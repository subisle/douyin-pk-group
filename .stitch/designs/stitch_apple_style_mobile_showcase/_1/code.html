<!-- 下级分支容器 + 纤细发丝引导线 -->
<div class="branch-tree flex flex-col pl-6 mt-space-md relative transition-all duration-300" id="branch-children-2"><div class="absolute left-[23px] top-0 bottom-6 w-[1px] bg-outline-variant"></div><div class="sub-branch flex flex-col relative pb-space-md"><div class="absolute left-0 top-6 w-[20px] h-[1px] bg-outline-variant"></div><div class="ml-5 bg-surface-container-lowest rounded-xl p-space-md shadow-sm relative z-10 flex items-center justify-between"><div class="flex items-center gap-space-sm"><div class="w-10 h-10 rounded-xl bg-surface-container-high text-on-surface flex items-center justify-center font-label-md text-label-md font-semibold select-none">二代</div><span class="font-label-md text-label-md text-on-surface font-semibold">宝儿</span></div><span class="font-caption text-caption text-on-surface-variant">活跃</span></div></div><div class="sub-branch flex flex-col relative"><div class="absolute left-0 top-6 w-[20px] h-[1px] bg-outline-variant"></div><div class="ml-5 bg-surface-container-lowest rounded-xl p-space-md shadow-sm relative z-10 flex items-center justify-between"><div class="flex items-center gap-space-sm"><div class="w-10 h-10 rounded-xl bg-surface-container-high text-on-surface flex items-center justify-center font-label-md text-label-md font-semibold select-none">三代</div><span class="font-label-md text-label-md text-on-surface font-semibold">阿泽</span></div><span class="font-caption text-caption text-on-surface-variant">活跃</span></div></div></div>

</section>

<script>
  (function() {
    // 1. 折叠与展开主支系逻辑
    document.querySelectorAll('.branch-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetId = btn.getAttribute('data-target');
        const targetEl = document.getElementById(targetId);
        const icon = btn.querySelector('.material-symbols-outlined');
        if (!targetEl) return;
        
        const isHidden = targetEl.classList.contains('hidden');
        if (isHidden) {
          targetEl.classList.remove('hidden');
          icon.textContent = 'expand_less';
        } else {
          targetEl.classList.add('hidden');
          icon.textContent = 'expand_more';
        }
      });
    });

    // 2. 子徒弟展开/收起
    document.querySelectorAll('.sub-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetId = btn.getAttribute('data-target');
        const targetEl = document.getElementById(targetId);
        const icon = btn.querySelector('.material-symbols-outlined');
        if (!targetEl) return;

        const isHidden = targetEl.classList.contains('hidden');
        if (isHidden) {
          targetEl.classList.remove('hidden');
          targetEl.classList.add('flex');
          icon.textContent = 'expand_less';
        } else {
          targetEl.classList.add('hidden');
          targetEl.classList.remove('flex');
          icon.textContent = 'expand_more';
        }
      });
    });

    // 3. 快速搜索主播定位脉络
    const searchInput = document.getElementById('genealogy-search');
    const clearBtn = document.getElementById('clear-search');
    const cards = document.querySelectorAll('.node-card');

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim().toLowerCase();
        if (val.length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }

        cards.forEach(card => {
          const name = (card.getAttribute('data-name') || '').toLowerCase();
          if (!val) {
            card.classList.remove('opacity-40');
            card.classList.remove('scale-102');
            card.classList.remove('shadow-md');
          } else if (name.includes(val)) {
            card.classList.remove('opacity-40');
            card.classList.add('scale-102');
            card.classList.add('shadow-md');
            
            // 自动向上展开父容器
            let parent = card.parentElement;
            while (parent && !parent.classList.contains('clan-branch')) {
              if (parent.classList.contains('hidden')) {
                parent.classList.remove('hidden');
                if (parent.id && parent.id.startsWith('grandchild')) {
                  parent.classList.add('flex');
                }
              }
              parent = parent.parentElement;
            }
          } else {
            card.classList.add('opacity-40');
            card.classList.remove('scale-102');
            card.classList.remove('shadow-md');
          }
        });
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        cards.forEach(card => {
          card.classList.remove('opacity-40');
          card.classList.remove('scale-102');
          card.classList.remove('shadow-md');
        });
      });
    }

    // 4. 重置视图按扭
    const resetBtn = document.getElementById('reset-view-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        if (searchInput) {
          searchInput.value = '';
          clearBtn.classList.add('hidden');
        }
        cards.forEach(card => {
          card.classList.remove('opacity-40');
          card.classList.remove('scale-102');
          card.classList.remove('shadow-md');
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // 5. 全部展开/折叠
    let allExpanded = false;
    const toggleAllBtn = document.getElementById('toggle-all-btn');
    if (toggleAllBtn) {
      toggleAllBtn.addEventListener('click', () => {
        allExpanded = !allExpanded;
        const subGrandchildren = document.querySelectorAll('[id^="grandchild-"]');
        const mainBranches = document.querySelectorAll('[id^="branch-children-"]');

        mainBranches.forEach(b => {
          const btn = document.querySelector(`[data-target="${b.id}"]`);
          const icon = btn ? btn.querySelector('.material-symbols-outlined') : null;
          if (allExpanded) {
            b.classList.remove('hidden');
            if (icon) icon.textContent = 'expand_less';
          } else {
            b.classList.add('hidden');
            if (icon) icon.textContent = 'expand_more';
          }
        });

        subGrandchildren.forEach(g => {
          const btn = document.querySelector(`[data-target="${g.id}"]`);
          const icon = btn ? btn.querySelector('.material-symbols-outlined') : null;
          if (allExpanded) {
            g.classList.remove('hidden');
            g.classList.add('flex');
            if (icon) icon.textContent = 'expand_less';
          } else {
            g.classList.add('hidden');
            g.classList.remove('flex');
            if (icon) icon.textContent = 'expand_more';
          }
        });

        const iconBtn = toggleAllBtn.querySelector('.material-symbols-outlined');
        if (iconBtn) {
          iconBtn.textContent = allExpanded ? 'unfold_less' : 'unfold_more';
        }
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-semibold"><div class="flex items-center justify-around h-16 px-space-xs"><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-xs text-on-surface-variant hover:text-on-surface transition-colors" data-path="leaderboard" href="#"><span class="material-symbols-outlined text-[24px]">monitoring</span><span class="font-caption text-caption mt-0.5 tracking-tight">看板</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-xs text-on-surface-variant hover:text-on-surface transition-colors" data-path="pk-tournament" href="#"><span class="material-symbols-outlined text-[24px]">emoji_events</span><span class="font-caption text-caption mt-0.5 tracking-tight">分组</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-xs transition-colors text-primary font-semibold" data-path="clan-lineage" href="#"><span class="material-symbols-outlined text-[24px]">account_tree</span><span class="font-caption text-caption mt-0.5 tracking-tight">族谱</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-xs text-on-surface-variant hover:text-on-surface transition-colors" data-path="my-profile" href="#"><span class="material-symbols-outlined text-[24px]">person</span><span class="font-caption text-caption mt-0.5 tracking-tight">我的</span></a></div></nav>
