<script data-purpose="particles-generator">
    // 动态生成3D翻转飘落金箔、紫晶碎片与高亮星尘粒子雨
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("particle-container");
      const confettiCount = 34;
      const palette = [
        { bg: '#fde047', shadow: 'rgba(253, 224, 71, 0.7)' }, // 金黄
        { bg: '#fbbf24', shadow: 'rgba(251, 191, 36, 0.7)' }, // 亮琥珀金
        { bg: '#c084fc', shadow: 'rgba(192, 132, 252, 0.7)' }, // 晶莹紫
        { bg: '#e9d5ff', shadow: 'rgba(233, 213, 255, 0.6)' }, // 浅紫光
        { bg: '#ffffff', shadow: 'rgba(255, 255, 255, 0.9)' }  // 闪亮白星
      ];

      for (let i = 0; i < confettiCount; i++) {
        const p = document.createElement("div");
        p.className = "confetti-particle";

        const isLeaf = Math.random() > 0.45;
        const width = isLeaf ? Math.random() * 5 + 4 : Math.random() * 3 + 2;
        const height = isLeaf ? Math.random() * 8 + 6 : width;
        const round = isLeaf ? (Math.random() > 0.5 ? '2px' : '50% 2px') : '50%';
        const col = palette[Math.floor(Math.random() * palette.length)];

        const left = Math.random() * 100;
        const duration = Math.random() * 4.5 + 4.5;
        const delay = Math.random() * 5;

        p.style.width = `${width}px`;
        p.style.height = `${height}px`;
        p.style.left = `${left}%`;
        p.style.borderRadius = round;
        p.style.backgroundColor = col.bg;
        p.style.boxShadow = `0 0 6px ${col.shadow}`;
        p.style.animation = `dropConfetti ${duration}s linear ${delay}s infinite`;

        container.appendChild(p);
      }
    });

    // 阻止卡片内部点击事件穿透到背景
    function stopPropagation(e) {
      if (e) {
        e.stopPropagation();
      }
    }

    // 点击空白背景区域响应进入下一页（季军页）
    function handleBackgroundClick(e) {
      handleNextPage(e);
    }

    // 下一页季军事件处理
    function handleNextPage(e) {
      if (e) {
        e.stopPropagation();
      }
      console.log("Navigating to: 初级争霸赛季军通报 (3/3)");
      alert("正在为您展示【初级争霸赛季军】荣誉通报...");
    }
  </script>
