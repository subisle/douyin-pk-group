[workspace]
resolver = "2"
members = ["crates/pk-core", "crates/pk-server"]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# P0（docs/17 §7.3）：Redis 只放可丢的派生数据（缓存 / 锁 / 去重标记）。
# 选 deadpool-redis 与 sqlx 池化心智一致，故障即降级入口；仅 store/cache.rs 直接使用。
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
deadpool-redis = "0.18"
