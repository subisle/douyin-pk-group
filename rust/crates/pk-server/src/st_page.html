<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>主播数据</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
::-webkit-scrollbar { display:none; }
.tab-content-enter { animation:stFadeIn 150ms ease-out forwards; }
@keyframes stFadeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
.material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
</style>
<style>
/* ===== Stitch Apple Style Mobile Showcase 精确 token ===== */
:root {
  --surface:#fcf8fb;
  --surface-container:#f0edef;
  --surface-container-low:#f6f3f5;
  --surface-container-lowest:#ffffff;
  --surface-container-high:#eae7ea;
  --surface-container-highest:#e4e2e4;
  --surface-variant:#e4e2e4;
  --on-surface:#1b1b1d;
  --on-surface-variant:#414755;
  --outline:#717786;
  --outline-variant:#c1c6d7;
  --primary:#0058bc;
  --primary-container:#0070eb;
  --primary-fixed:#d8e2ff;
  --primary-fixed-dim:#adc6ff;
  --on-primary:#ffffff;
  --on-primary-fixed:#001a41;
  --on-primary-fixed-variant:#004493;
  --secondary:#4c4aca;
  --secondary-fixed:#e2dfff;
  --on-secondary:#ffffff;
  --on-secondary-fixed:#0c006a;
  --on-secondary-fixed-variant:#3631b4;
  --tertiary:#9e3d00;
  --tertiary-fixed:#ffdbcc;
  --on-tertiary:#ffffff;
  --on-tertiary-fixed:#351000;
  --on-tertiary-fixed-variant:#7c2e00;
  --error:#ba1a1a;
  --error-container:#ffdad6;
  --on-error:#ffffff;
  --on-error-container:#93000a;
  --inverse-surface:#303032;
  --inverse-on-surface:#f3f0f2;
  --inverse-primary:#adc6ff;
  --hairline:#e4e2e4;
  --canvas-bg:#fcf8fb;
  --ink3:#717786;
  --up:#ba1a1a; --up-bg:#ffdad6; --down:#0b7a3e; --live:#0b7a3e;
  --gold-bg:#ffdbcc; --gold-tx:#7c2e00;
  --silver-bg:#e4e2e4; --silver-tx:#414755;
  --bronze-bg:#ffdbcc; --bronze-tx:#9e3d00;
  --r-lg:16px; --r-md:12px; --r-sm:8px; --r-full:9999px;
  --glass:rgba(252,248,251,.80);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--canvas-bg); color:var(--on-surface);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB',sans-serif; }
button { font:inherit; cursor:pointer; }
.hidden { display:none !important; }

/* ===== Masthead（Cupertino 毛玻璃浅色头部） ===== */
.masthead { background:var(--glass); color:var(--on-surface);
  -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;
  position:sticky; top:0; z-index:30; overflow:hidden;
  border-bottom:1px solid var(--hairline);
  box-shadow:0 1px 3px rgba(0,0,0,.04); }
.masthead::before { content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% -20%, rgba(0,122,255,.08), transparent 70%); }
.mh-top { display:flex; align-items:center; gap:10px; position:relative; }
.mh-badge { width:36px; height:36px; border-radius:11px; background:var(--masthead-surface);
  border:1px solid var(--hairline-dark); display:grid; place-items:center; font-weight:800;
  font-size:15px; color:var(--primary); flex:none; }
/* 徽标兼「换团」按钮：点一下回团别选择卡 */
.mh-badge.mh-switch { cursor:pointer; font-size:13px; }
.mh-badge.mh-switch:active { transform:scale(.94); }
.mh-title { flex:1; min-width:0; }
.mh-title .t { font-weight:800; font-size:17px; letter-spacing:-.01em; color:var(--on-surface); }
.mh-title .s { font-size:11px; color:var(--ink3); font-family:Menlo,monospace;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 分组子导航（按赛事类型拆页，浅色胶囊，仅在分组页显示） */
.subnav { display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:10px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  mask-image:linear-gradient(to right,#000 94%,transparent 100%); position:relative; }
.subnav::-webkit-scrollbar { display:none; }
.subnav button { flex:none; height:30px; padding:0 13px; border-radius:var(--r-full);
  background:#F2F4F7; border:1px solid transparent; color:var(--on-surface-variant);
  font-size:12.5px; }
.subnav button.on { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }

/* 底部标签栏（看板 / 分组 / 族谱 / 我的）：毛玻璃 + 安全区 */
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:31;
  display:flex; background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--hairline);
  padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar button { flex:1; height:52px; border:none; background:transparent; color:var(--ink3);
  font-size:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.tabbar button .ic { width:24px; height:24px; display:grid; place-items:center; }
.tabbar button.on { color:var(--primary); font-weight:700; }
.tabbar button:active { opacity:.55; }

/* 工具栏（口径 + 日期 + 搜索 + 字段） */
.toolbar { position:sticky; top:var(--mh-h, 56px); z-index:8; background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); border-bottom:1px solid var(--hairline);
  padding:8px 12px; }
.tools { max-width:560px; margin:0 auto; }
.seg { display:flex; background:#F2F4F7; border-radius:var(--r-full); padding:3px; }
.seg button { flex:1; height:32px; border:none; border-radius:var(--r-full); background:transparent;
  color:var(--on-surface-variant); font-size:13px; }
.seg button.on { background:#fff; color:var(--on-surface); font-weight:700;
  box-shadow:0 1px 2px rgb(16 24 40 / 12%); }
.seg button:disabled { color:#c2c8d2; cursor:not-allowed; }
.line2 { display:flex; align-items:center; gap:8px; margin-top:8px; }
.dates { display:flex; gap:8px; overflow-x:auto; flex:1; padding-bottom:2px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  mask-image:linear-gradient(to right,#000 88%,transparent 100%); }
.dates::-webkit-scrollbar { display:none; }
.dates button { flex:none; height:32px; padding:0 14px; border-radius:var(--r-full);
  background:#fff; border:1px solid var(--hairline); color:var(--on-surface-variant);
  font-size:12.5px; font-family:Menlo,monospace; }
.dates button.on { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }
.dates button.nodata { color:#C2C8D2; }
.dates .mgap { flex:none; align-self:center; font-size:10px; color:var(--ink3);
  font-weight:700; padding-left:2px; }
.stepper { display:flex; align-items:center; gap:4px; flex:1; min-width:0; }
.stepper button { width:34px; height:32px; border-radius:var(--r-sm); background:#fff;
  border:1px solid var(--hairline); color:var(--on-surface-variant); line-height:1; }
.stepper .now { flex:1; text-align:center; font-family:Menlo,monospace; font-size:14px; font-weight:600; }
.icon-btn { width:34px; height:32px; border-radius:var(--r-sm); background:#fff;
  border:1px solid var(--hairline); display:grid; place-items:center; color:var(--on-surface-variant); flex:none; }
.icon-btn.on { border-color:var(--primary); color:var(--primary); background:var(--highlight-bg); }
.search { display:flex; align-items:center; gap:6px; margin-top:8px; background:#fff;
  border:1px solid var(--hairline); border-radius:var(--r-sm); padding:0 10px; height:34px; }
.search input { flex:1; border:none; outline:none; font:inherit; background:transparent; color:var(--on-surface); }
.search input::placeholder { color:var(--ink3); }

/* ===== 点击即时反馈（2026-10-10）：RTT≈260ms，点了必须先有反应再等数据 ===== */
/* manipulation：去掉移动端双击缩放判定，点按立刻生效；高亮由下面的 :active 出 */
button { touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.lb-row, .pod, .gx-mem { touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.tabbar button:active, #subnav button:active, .seg button:active { opacity:.55; }
.dates button:active, .stepper button:active, .icon-btn:active,
.ln-ctl button:active { background:#EDF0F5; transform:scale(.93); }
.pod:active, .lb-row:active { opacity:.72; }
.gx-mem:active { background:rgba(255,255,255,.55); }
.my-logout:active, .my-push .go:active, .my-claim .go:active,
.gate-box .btn-main:active, .team-pick .pick-btn:active { opacity:.7; }
/* 请求在途：标题旁小菊花 + 内容轻微压暗（不清空已看内容，数据回来直接换） */
#mhSpin { display:none; width:12px; height:12px; flex:none;
  border:2px solid var(--hairline); border-top-color:var(--primary); border-radius:50%;
  animation:spin .7s linear infinite; }
body.busy #mhSpin { display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
#view { transition:opacity .12s; }
body.busy #view { opacity:.62; }
@media (hover:hover) {
  .tabbar button:hover { color:var(--primary); }
  #subnav button:hover { background:#E5E7EB; color:var(--on-surface); }
  .dates button:hover, .stepper button:hover, .icon-btn:hover { background:#F4F6FA; }
  .lb-row:hover { background:#F8FAFD; }
  .seg button:not(.on):hover { color:var(--on-surface); }
}

/* ===== 日期日历（2026-10-10）：横向日期条太长时点 📅 弹日历挑日期 ===== */
.cal-btn { flex:none; }
.cal-pop { position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end;
  justify-content:center; background:rgba(11,15,23,.45); animation:fade .15s ease-out; }
.cal-pop.hidden { display:none; }
.cal-card { background:#fff; border-radius:18px 18px 0 0; padding:14px 14px
  calc(env(safe-area-inset-bottom,0px) + 14px); width:100%; max-width:400px;
  box-shadow:0 -8px 32px rgba(11,15,23,.22); animation:calUp .18s ease-out; }
@keyframes calUp { from { transform:translateY(40px); opacity:.6; } to { transform:none; opacity:1; } }
@media (min-width:640px) {
  .cal-pop { align-items:center; }
  .cal-card { border-radius:18px; }
}
.cal-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.cal-head .ttl { flex:1; text-align:center; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
.cal-head button { width:34px; height:32px; border-radius:var(--r-sm); background:#fff;
  border:1px solid var(--hairline); color:var(--on-surface-variant); line-height:1; }
.cal-head .close { border:none; background:none; font-size:17px; color:var(--ink3); width:30px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-grid .wd { text-align:center; font-size:10.5px; color:var(--ink3); padding:4px 0 6px; }
.cal-grid .wd.wkend { color:#D92D20; }
.cal-d { height:40px; border:none; background:none; border-radius:10px;
  font-size:13.5px; color:var(--on-surface); font-variant-numeric:tabular-nums;
  display:grid; place-items:center; position:relative; }
.cal-d:disabled { color:#C9CFDA; }
.cal-d.dim { color:#98A2B3; }           /* 非本月 */
.cal-d.today::after { content:''; position:absolute; bottom:5px; left:50%;
  transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--primary); }
.cal-d.has::before { content:''; position:absolute; top:6px; right:8px;
  width:5px; height:5px; border-radius:50%; background:#10B981; }  /* 有数据的日期 */
.cal-d.on { background:var(--primary); color:#fff; font-weight:700; }
.cal-d:active { background:#EDF0F5; }
.cal-d.on:active { background:#1D4ED8; }

/* ===== 内容 ===== */
.wrap { padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 78px); max-width:560px; margin:0 auto; }
.section { animation:fade .18s ease-out; }
@keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.card { background:var(--card-bg); border:1px solid var(--hairline); border-radius:var(--r-lg); }
.card + .card { margin-top:12px; }
.card-pad { padding:14px 16px; }
h2.card-t { font-size:13px; font-weight:700; color:var(--ink3); margin:0 0 4px;
  letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; }

/* ===== 排行榜（Stitch Apple Style Mobile Showcase 精确还原） ===== */
.st-podium { display:grid; grid-template-columns:1fr 1.25fr 1fr; align-items:end; gap:.25rem;
  padding:1rem 1rem 1.5rem; }
.st-pod { display:flex; flex-direction:column; align-items:center; min-width:0; text-align:center; }
.st-pod-2 { padding-bottom:.5rem; }
.st-pod-1 { padding-bottom:1.25rem; }
.st-pod-3 { padding-bottom:.25rem; }
.st-pod-ring { position:relative; margin-bottom:.625rem; }
.st-pod-1 .st-pod-ring { margin-bottom:.875rem; }
.st-pod-av { border-radius:9999px; display:grid; place-items:center; font-weight:600;
  box-shadow:0 4px 10px rgba(0,0,0,.10); border:6px solid var(--surface-container-lowest); }
.st-pod-1 .st-pod-av { width:80px; height:80px; background:#fffbeb; color:#78350f;
  font-size:22px; font-weight:700; letter-spacing:-.015em; box-shadow:0 8px 20px rgba(0,0,0,.14); }
 .st-pod-2 .st-pod-av, .st-pod-3 .st-pod-av { width:64px; height:64px; font-size:18px; }
.st-pod-av.st-pod-in-1 { width:70px; height:70px; background:#fffbeb; color:#78350f; }
.st-pod-av.st-pod-in-2 { width:56px; height:56px; background:#f1f5f9; color:#334155; }
.st-pod-av.st-pod-in-3 { width:56px; height:56px; background:#f5f5f4; color:#44403c; }
.st-crown { position:absolute; top:-.5rem; left:50%; transform:translateX(-50%);
  width:1.25rem; height:1.25rem; border-radius:9999px; background:var(--tertiary-fixed);
  color:var(--tertiary); display:grid; place-items:center; box-shadow:0 1px 3px rgba(0,0,0,.10); }
.st-crown .material-symbols-outlined { font-size:13px; }
.st-pod-rank { position:absolute; bottom:-.375rem; left:50%; transform:translateX(-50%);
  padding:0 .625rem; height:1.25rem; display:grid; place-items:center; border-radius:9999px;
  background:var(--outline-variant); color:var(--on-surface-variant);
  font-size:11px; font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.10); }
.st-pod-1 .st-pod-rank { bottom:-.375rem; background:var(--tertiary); color:var(--on-tertiary); padding:0 .75rem; height:1.375rem; }
.st-pod-nm { margin:.25rem 0 0; font-size:18px; font-weight:600; letter-spacing:-.01em; color:var(--on-surface);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.st-pod-2 .st-pod-nm, .st-pod-3 .st-pod-nm { font-size:14px; }
.st-pod-off { margin-top:.125rem; display:inline-block; padding:0 .5rem; border-radius:.25rem;
  background:var(--surface-container); color:var(--on-surface-variant);
  font-size:10px; line-height:1.5; font-weight:400; }
.st-pod-1 .st-pod-off { padding:.125rem .5rem; border-radius:9999px; font-size:11px;
  background:rgba(185,28,28,.06); color:var(--error); border:1px solid rgba(185,28,28,.16); }
.st-pod-1 .st-pod-off.warn { background:rgba(185,28,28,.08); }
.st-pod-wv { margin:.25rem 0 0; font-size:15px; font-weight:700; color:var(--on-surface);
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.st-pod-1 .st-pod-wv { font-size:18px; color:var(--primary); }
.st-pod-lbl { display:block; font-size:11px; color:var(--primary); font-weight:500; letter-spacing:.02em; }
.st-pod-total { margin:.125rem 0 0; font-size:11px; color:var(--on-surface-variant);
  font-variant-numeric:tabular-nums; }
.st-pod-1 .st-pod-total { font-weight:500; }

/* 排行榜列表（4 名起） */
.st-list { display:flex; flex-direction:column; gap:.25rem; padding:0 1rem 1.5rem; }
.st-list-head { display:flex; align-items:center; justify-content:space-between; padding:0 .25rem .25rem; }
.st-list-head span { font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--on-surface-variant); }
.st-list-head span:last-child { text-align:right; }
.st-list-body { background:var(--surface-container-lowest); border-radius:.75rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; display:flex; flex-direction:column; }
.st-row { display:flex; align-items:center; justify-content:space-between; padding:.75rem 1rem;
  border-bottom:1px solid var(--surface-container); transition:background .15s; }
.st-row:last-child { border-bottom:none; }
.st-row:hover { background:var(--surface-container-low); }
.st-row.off { opacity:.62; }
.st-row-l { display:flex; align-items:center; gap:.75rem; min-width:0; }
.st-row-rk { width:1.25rem; text-align:center; font-size:14px; font-weight:600;
  color:var(--on-surface-variant); font-variant-numeric:tabular-nums; flex:none; }
.st-row-av { width:2.5rem; height:2.5rem; border-radius:9999px; display:grid; place-items:center;
  font-size:14px; font-weight:600; flex:none; box-shadow:0 1px 3px rgba(0,0,0,.06);
  border:1px solid rgba(0,0,0,.04); }
.st-row-mid { min-width:0; }
.st-row-nmwrap { display:flex; align-items:center; gap:.375rem; min-width:0; }
.st-row-nm { font-size:15px; font-weight:600; color:var(--on-surface);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.st-row-off { padding:0 .375rem; border-radius:.25rem; background:var(--surface-container);
  color:var(--on-surface-variant); font-size:10px; line-height:1.5; font-weight:400; flex:none; }
.st-row-off.warn { background:rgba(185,28,28,.06); color:var(--error); }
.st-row-sub { margin:.125rem 0 0; font-size:11px; color:var(--primary); font-variant-numeric:tabular-nums; }
.st-row.off .st-row-sub { color:var(--outline); }
.st-row-r { text-align:right; flex:none; }
.st-row-wv { display:block; font-size:15px; font-weight:700; color:var(--on-surface);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.st-row-lbl { display:block; font-size:11px; color:var(--on-surface-variant);
  font-variant-numeric:tabular-nums; }

/* ===== 工具栏（日榜/月榜 segmented + 日期胶囊）Stitch 版 ===== */
.st-seg { display:flex; background:var(--surface-container-high); border-radius:9999px;
  padding:.25rem; gap:.25rem; }
.st-seg button { flex:1; height:1.875rem; border-radius:9999px; border:none; background:transparent;
  color:var(--on-surface-variant); font-size:14px; font-weight:500; }
.st-seg button.on { background:var(--surface-container-lowest); color:var(--on-surface);
  box-shadow:0 1px 3px rgba(0,0,0,.08); }
.st-seg button:disabled { color:var(--outline); cursor:not-allowed; }
.dates button { background:var(--surface-container); border-color:transparent; color:var(--on-surface-variant); }
.dates button.on { background:var(--surface-container-lowest); color:var(--on-surface);
  box-shadow:0 1px 3px rgba(0,0,0,.08); border-color:transparent; position:relative; }
.dates button.on::before { content:''; width:.375rem; height:.375rem; border-radius:9999px;
  background:var(--primary); display:inline-block; margin-right:.25rem; vertical-align:middle; }
.icon-btn { background:var(--surface-container-low); border-color:transparent; border-radius:9999px; }
.icon-btn.on { background:var(--surface-container-lowest); color:var(--primary); border-color:transparent; }
.search { background:var(--surface-container-lowest); border-radius:.75rem; }
.search input { background:transparent; }

/* ===== 分组页（Pk Tournament）Stitch 版 ===== */
.st-group-tabs { display:flex; align-items:center; gap:.25rem; padding:.25rem;
  background:var(--surface-container); border-radius:.75rem; overflow-x:auto;
  scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.st-group-tabs::-webkit-scrollbar { display:none; }
.st-group-tabs button { flex:none; padding:.375rem 1rem; border-radius:.5rem; border:none;
  background:transparent; color:var(--on-surface-variant); font-size:14px; font-weight:500; }
.st-group-tabs button.on { background:var(--surface-container-lowest); color:var(--primary);
  font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.st-group-tabs button:disabled { color:var(--outline); }
.st-group-chips { display:flex; gap:.5rem; overflow-x:auto; padding-bottom:1rem;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(to right,#000 92%,transparent 100%); }
.st-group-chips::-webkit-scrollbar { display:none; }

/* 族谱画布（无底部导航后撑满剩余视口，视觉接近全屏；双击/按钮可进原生全屏） */
.lineage-wrap { position:relative; height:calc(100vh - 122px); min-height:430px;
  background:var(--canvas-bg); border:1px solid var(--hairline); border-radius:var(--r-lg);
  overflow:hidden; touch-action:none; cursor:grab; }
.lineage-wrap:active { cursor:grabbing; }
.lineage-wrap svg { width:100%; height:100%; display:block; }
.ln-hint { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px;
  align-items:center; pointer-events:none; z-index:2; }
.ln-hint .tip { background:rgba(11,15,23,.72); color:#fff; font-size:11px;
  padding:4px 10px; border-radius:var(--r-full); }
.ln-hint input { pointer-events:auto; margin-left:auto; width:132px; height:26px;
  border:1px solid var(--hairline); border-radius:var(--r-full); padding:0 12px;
  font-size:12px; background:#fff; color:var(--on-surface); }
.ln-hint input:focus { outline:none; border-color:var(--primary); }
.ln-hint .qinfo { background:rgba(11,15,23,.72); color:#fff; font-size:11px;
  padding:4px 8px; border-radius:var(--r-full); display:none; white-space:nowrap; }
.ln-ctl { position:absolute; right:10px; bottom:12px; z-index:2; display:flex;
  flex-direction:column; gap:6px; }
.ln-ctl button { width:32px; height:32px; padding:0; border-radius:10px;
  background:#fff; border:1px solid var(--hairline); font-size:16px; line-height:1;
  color:var(--on-surface-variant); box-shadow:0 1px 3px rgb(0 0 0 / 8%);
  display:grid; place-items:center; }
.ln-ctl button:active { background:var(--highlight-bg); }
/* 全屏：原生 Fullscreen API 走 :fullscreen；iPhone 上不支持时退到 .ln-fs 铺满视口 */
.lineage-wrap:fullscreen, .lineage-wrap:-webkit-full-screen {
  height:100vh; border:0; border-radius:0; background:var(--canvas-bg); }
.lineage-wrap.ln-fs { position:fixed; inset:0; z-index:60; height:100vh;
  border:0; border-radius:0; background:var(--canvas-bg); }
.ln-edge { fill:none; stroke:#C3CDDC; stroke-width:1.5; }
.ln-edge.hot { stroke:var(--primary); stroke-width:2.5; }
.ln-edge.dim { opacity:.25; }
.ln-node rect { fill:var(--card-bg); stroke:var(--hairline); stroke-width:1; }
.ln-node text { text-anchor:middle; fill:var(--on-surface); pointer-events:none; }
.ln-node .ln-name { font-size:13px; font-weight:700; }
.ln-node .ln-sub { font-size:10px; fill:var(--ink3); }
.ln-node.off { opacity:.45; }
.ln-node.off .ln-name { font-weight:500; }
.ln-node.sel rect { stroke:var(--primary); fill:var(--highlight-bg); }
.ln-node.anc rect { stroke:var(--primary); stroke-width:1.5; }
.ln-node.dim2 { opacity:.22; }
.ln-node.hit rect { stroke:#f79009; stroke-width:2; }
.ln-node.hit.dim2 { opacity:.6; }
.ln-node .ln-tag { font-size:9px; fill:var(--up); }

.err { background:#ffdad6; color:#93000a; border-radius:var(--r-md); padding:10px 13px; margin:10px 0; font-size:13px; }
.empty { text-align:center; color:var(--ink3); padding:34px 16px; font-size:13px; line-height:1.9; }

#toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 78px);

  border-radius:var(--r-full); font-size:13px; opacity:0; transition:all .2s; pointer-events:none;
  z-index:40; display:flex; align-items:center; gap:6px; white-space:nowrap; max-width:90vw; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

<!-- 登录门（未登录时盖住整页）+ 登录后全屏艺名水印 -->

<script>
/* ==================== 路由与全局状态 ==================== */
/* /1 男团 /0 女团；/st/m、/st/f 为别名。链接即团别，页内不提供切换。
   子路径 history 路由（2026-10-09）：
     /st/m             → 每日报告（首页默认）
     /st/m/report      → 每日报告（别名）
     /st/m/group/<key> → 按赛事类型的分组页
     /st/m/lineage     → 族谱
     /st/m/my          → 我的数据（手机号+密码登录；没账号可在登录门「注册」）
   刷新/直接分享子路径链接都能落到正确视图（后端对子路径渲染同一 HTML）。 */
/* 团别（2026-10-11 改）：
   - 开启登录：登录账号的团别决定 TEAM（男团成员只看男团、女团只看女团）；
   - 关闭登录：打开展示页先选「男团 / 女团」，TEAM = 所选团别。
   统一入口 /api/public/teams/all 保留，游客默认 all（还没选团别）。 */
let TEAM = 'all';
const LABEL = () => TEAM === 'female' ? '女团' : TEAM === 'male' ? '男团' : '主播';
const $ = (id) => document.getElementById(id);

/* 分组子页：key 进 URL，type 对应方案 eventType（与后端 EVENT_TYPES 一致），label 是页面标题 */
const GROUP_PAGES = [
  { key: 'junior',       type: '初级争霸赛小组赛', label: '初级争霸赛小组赛' },
  { key: 'mid',          type: '中级争霸赛小组赛', label: '中级争霸赛小组赛' },
  { key: 'final',        type: '月终争霸赛',       label: '月终争霸赛' },
  { key: 'junior-promo', type: '初级争霸赛晋级赛', label: '初级争霸赛晋级赛' },
  { key: 'mid-promo',    type: '中级争霸赛晋级赛', label: '中级争霸赛晋级赛' },
];

let site = null;         // 站点配置（含后台级显隐开关）
let period = 'daily';    // daily | monthly | yearly
let view = 'data';       // data | group | lineage | my
let curGroup = GROUP_PAGES[0].key;  // 分组子页当前 key
let curDate = null;      // 每日口径当前日期
let curPeriod = null;    // 月/年口径当前周期
let plans = [];          // 已上架分组方案（各类型独立互斥，每类型最多一场）
let planByType = {};     // 分组子页 key → 正在看的方案 id（同类型多个上架时页内切换用）
let searchOpen = false;
let q = '';
let consecutiveFail = 0;
let timer = null;
let loadSeq = 0;         // 请求序号：RTT≈260ms，快速连点时只认最后一次的结果

/* 请求在途的即时反馈：标题旁小菊花 + 内容轻微压暗。
   在 go() 里开、请求落地后关；静默刷新不经过这里，不打扰正常浏览。 */
function busyOn() { document.body.classList.add('busy'); }
function busyOff() { document.body.classList.remove('busy'); }

/* ==================== URL 路由（history，子路径 = 视图） ==================== */
/** 当前 pathname → 视图描述。识别不了的子路径一律落回每日报告（首页默认数据页）。
    兼容旧链接：/st/m/lineage、/1/report 这类带团别前缀的老路径剥掉前缀照常落视图。 */
function parseRoute() {
  const rest = location.pathname
    .replace(/^\/(?:st\/)?(?:m|f|1|0|all)(?=\/|$)/, '')
    .replace(/^\/+|\/+$/g, '');
  if (rest === '' || rest === 'report') return { view: 'data' };
  if (rest === 'lineage') return { view: 'lineage' };
  if (rest === 'my') return { view: 'my' };
  const gm = rest.match(/^group\/([a-z-]+)$/);
  if (gm && GROUP_PAGES.some(p => p.key === gm[1])) return { view: 'group', group: gm[1] };
  return { view: 'data' };
}
/** 当前视图对应的规范路径（根路径 + 子页路径；男女共用一个网址，团别不进 URL） */
function routePath() {
  if (view === 'lineage') return '/lineage';
  if (view === 'my') return '/my';
  if (view === 'group') return '/group/' + curGroup;
  return '/report';
}
function pushRoute(replace) {
  const path = routePath();
  if (location.pathname === path) return;
  if (replace) history.replaceState(null, '', path);
  else history.pushState(null, '', path);
}

/* ==================== 小工具 ==================== */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = (n) => String(n).padStart(2, '0');
/** 328500 → 32万8500；不足一万原样返回 */
const wan = (n) => {
  n = Math.round(Number(n) || 0);
  if (n < 10000) return String(n);
  const w = Math.floor(n / 10000), r = n % 10000;
  return r === 0 ? w + '万' : w + '万' + pad2safe(r);
};
const pad2safe = (r) => String(r).padStart(4, '0');
/** 提成金额（1.0.1）：后端已按「徒弟音浪 ÷ 音浪:人民币 × 提成百分比」算好金额，
    这里只做人民币格式化（最多 2 位小数、去尾零）。 */
const yuan = (n) => {
  if (n == null || !Number.isFinite(Number(n))) return '—';
  const v = Math.round(Number(n) * 100) / 100;
  return '¥' + v.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
};
/** 同期差值 chip（1.0.1）：涨红跌绿是固定口径；prev 为 null（上期没数据）不显示 */
const waveDelta = (wave, prev) => {
  if (wave == null || prev == null) return '';
  const d = wave - prev;
  if (d > 0) return '<span class="delta d-up">↑' + wan(d) + '</span>';
  if (d < 0) return '<span class="delta d-down">↓' + wan(-d) + '</span>';
  return '<span class="delta d-flat">—</span>';
};
const iso = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayStr = () => iso(new Date());
/** 数据每晚 24 点后入库前一天，所以「最新一天数据」落在昨天：
    展示页默认就站到昨天，而不是等到今天的数据到达才跳过去。 */
const refStr = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };
const nowPeriod = (p) => {
  // 与默认日期同一个参照日（昨天），否则月末切月会把新一天先算进本月
  const r = refStr();
  return p === 'monthly' ? r.slice(0, 7) : r.slice(0, 4);
};
const shiftMonth = (p, n) => {
  const y = +p.slice(0, 4), m = +p.slice(5, 7) - 1;
  const d = new Date(y, m + n, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
};
/* 月 / 年口径的可选周期 = **有数据的周期**（2026-10-11：库里只有 10 月 9 天的音浪，
   以前按 ‹ 能一路翻到 2026年3月，点进去只有空态，等于把不存在的月份的音浪摆给人看）。 */
function dataPeriods(p) {
  const ds = (site && site.dates) || [];
  return [...new Set(ds.map(d => p === 'monthly' ? d.slice(0, 7) : d.slice(0, 4)))];  // 降序
}
/** 当前周期不在有数据的列表里 → 吸附到 ≤ 它的最近一个有数据周期（没有就落到最早一个有数据周期） */
function snapPeriod(p, cur) {
  if (p !== 'monthly' && p !== 'yearly') return cur;   // 日口径不看周期
  const list = dataPeriods(p);
  if (!list.length) return cur || nowPeriod(p);
  if (list.includes(cur)) return cur;
  const le = list.filter(x => x <= String(cur || ''));
  return le.length ? le[0] : list[list.length - 1];
}
/** 步进 n=+1 更新 / -1 更早；只在有数据的周期之间走，到头就是原值 */
function stepPeriod(n) {
  const list = dataPeriods(period);
  const i = list.indexOf(curPeriod);
  if (i < 0) return snapPeriod(period, curPeriod);
  return list[Math.max(0, Math.min(list.length - 1, i - n))];
}
/** ‹ › 到头就禁用（只有一个月/一年的数据时两个都灰） */
function syncStepper() {
  if (period === 'daily' || !$('stepper')) return;
  const list = dataPeriods(period);
  const i = list.indexOf(curPeriod);
  const none = i < 0 || list.length <= 1;
  $('pPrev').disabled = none || i >= list.length - 1;   // 更早：已经是最早一个有数据的周期
  $('pNext').disabled = none || i <= 0;                 // 更新：已经是最近一个有数据的周期
}
/* show 传 id 或元素都行（syncNav 里对子导航按钮直接传元素） */
const show = (el, on) => (typeof el === 'string' ? $(el) : el).classList.toggle('hidden', !on);
let toastTimer;
function toast(msg) {
  $('toastTx').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}
async function api(p) {
  /* 登录门（2026-10-10）：团数据接口自动带上我的 token；401 → 弹登录门 */
  let url = p;
  const t = myToken();
  if (t && url.indexOf('/api/public/teams/' + TEAM) === 0 &&
      url.indexOf('access_token=') < 0 && url.indexOf('?token=') < 0) {
    url += (url.indexOf('?') >= 0 ? '&' : '?') + 'access_token=' + encodeURIComponent(t);
  }
  const r = await fetch(url);
  if (r.status === 401) { sessionExpired(); throw new Error('请先登录'); }
  let d = {};
  try { d = await r.json(); } catch (_) {}
  /* 访问门禁（2026-10-11）：白名单外的 IP 后端统一 403，不清 token、不弹登录门 */
  if (r.status === 403) { regionBlocked(d.error || '您的ip不在授权范围内'); throw new Error(d.error || '您的ip不在授权范围内'); }
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

/* ==================== 登录门 + 全屏水印 ==================== */
let gateResolve = null;   // 登录成功后 resolve({name,...})
let meState = null;       // 当前登录身份（who 的结果，带 bound / needBind）
let regCfg = null;        // 注册页能力探测：{oauth: 网关配没配}
let regWbState = '';      // WorkBuddy 授权流水号（第 ① 步申请到的）
let regOauthDone = false; // 授权是否已完成（账号已加入账号池）
let regTimer = null;      // 授权结果轮询

/** 手机号打码：水印/提示里不出现完整号码 */
const maskPhone = (p) => {
  const s = String(p || '');
  return s.length >= 7 ? s.slice(0, 3) + '****' + s.slice(-4) : s;
};

/** 登录/注册成功后统一收口：水印 + 未绑定提醒条 */
function applyLoginState(me) {
  meState = me || null;
  // 登录账号的团别决定 TEAM：男团成员只看男团、女团只看女团（2026-10-11）
  if (me && (me.team === 'male' || me.team === 'female') && TEAM !== me.team) {
    TEAM = me.team;
    applyTeam();
  }
  const needBind = !!(me && me.needBind);
  /* 提醒条用 hidden 属性控制（CSS 写的是 .bindbar[hidden]），不是 class="hidden" */
  const bar = $('bindBar');
  if (bar) bar.hidden = !needBind;
  /* 水印口径（2026-10-11）：显示自己的手机号（打码），没有手机号才回退艺名 */
  const wmText = needBind ? '未绑定主播' : ((me && (me.phone || me.name)) || '');
  applyWatermark(wmText === (me && me.phone) && wmText ? maskPhone(wmText) : wmText);
  return me;
}

/** 关登录门 + 落地登录态 */
function closeGate(me) {
  stopRegPoll();
  const g = $('gate');
  g.classList.add('hidden');
  g.innerHTML = '';
  const fn = gateResolve; gateResolve = null;
  applyLoginState(me);
  if (fn) fn(me);
}

function showGate() {
  stopRegPoll();
  regCfg = null;   // 每次弹门重新探测：后台可能刚开/刚关注册
  const g = $('gate');
  /* 团别待定（需登录站点：登录前还不知道账号属于哪个团）→ 中性标题「数据榜」 */
  const title = TEAM ? LABEL() + '数据榜' : '数据榜';
  const av = TEAM ? LABEL().charAt(0) : '榜';
  g.classList.remove('hidden');
  g.innerHTML = '<div class="gate-box">' +
    '<div class="big-av" style="background:' + avColor(av) + '"><span class="material-symbols-outlined" style="font-size:28px">person</span></div>' +
    '<h3>' + esc(title) + '</h3>' +
    '<div class="gate-tabs">' +
      '<button id="tabLogin" class="on">登录</button><button id="tabReg" hidden>注册</button>' +
    '</div>' +
    '<div id="paneLogin"><p class="tip">使用「手机号 + 密码」登录（姓名也可以）</p>' +
      '<input id="gateAcct" placeholder="手机号 / 姓名" autocomplete="off">' +
      '<input id="gatePass" placeholder="密码" inputmode="numeric" autocomplete="off">' +
      '<button class="reg-skip" id="gateForgot">忘记密码？重置为手机号后四位</button>' +
      '<div class="form-err hidden" id="gateErr"></div>' +
      '<button class="btn-main" id="gateGo">登 录</button></div>' +
    '<div id="paneReg" class="hidden"></div>' +
    '</div>';
  $('tabLogin').onclick = () => gateTab('login');
  $('tabReg').onclick = () => gateTab('reg');
  bindLoginPane();
  bindRegPane();
  gateTab('login');
  /* 注册是后台开关（2026-10-10 用户口径「注册先不开」，默认关）：
     探测到开着才把「注册」页签露出来，关着时登录门跟以前一模一样 */
  probeRegConfig().then((cfg) => {
    const tab = $('tabReg');
    if (tab) tab.hidden = !cfg.open;
  });
}

function gateTab(tab) {
  const login = tab === 'login';
  if (!login && regCfg && !regCfg.open) return;   // 注册没开：不进注册页签
  $('tabLogin').classList.toggle('on', login);
  $('tabReg').classList.toggle('on', !login);
  show('paneLogin', login);
  show('paneReg', !login);
  if (login) stopRegPoll();
  else prepareRegPane();
  setTimeout(() => { const el = login ? $('gateAcct') : $('regName'); if (el) el.focus(); }, 30);
}

/* ------------------------------ 登录页签 ------------------------------ */
function bindLoginPane() {
  const go = async () => {
    const acct = $('gateAcct').value.trim(), pw = $('gatePass').value.trim();
    const errEl = $('gateErr');
    if (!acct || !pw) {
      errEl.textContent = '请输入账号和密码';
      errEl.classList.remove('hidden');
      return;
    }
    const btn = $('gateGo');
    btn.disabled = true; btn.textContent = '登录中…';
    errEl.classList.add('hidden');
    try {
      /* 统一免团别登录口：后端按账号反查绑定主播，前端不再按团别分流 */
      const url = '/api/public/my/login';
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account: acct, pass: pw }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      if (!d.ok) throw new Error('账号或密码不对，或账号还没开通');
      /* token 统一存 MY_ANY_KEY；后端 all 端点接受任何绑定主播的账号 */
      const team = d.team === 'male' || d.team === 'female' ? d.team : '';
      const key = MY_ANY_KEY;
      sessionStorage.setItem(key, d.token);
      if (key !== MY_KEY()) sessionStorage.removeItem(MY_KEY());
      localStorage.setItem(team ? 'myName_' + team : MY_ANY_NAME, d.name || acct);
      toast(d.needBind ? '登录成功，请绑定主播姓名' : '登录成功');
      closeGate({ name: d.name || acct, personId: d.personId, bound: d.bound !== false,
        needBind: !!d.needBind, team: team, anyTeam: !team });
    } catch (e) {
      btn.disabled = false; btn.textContent = '登 录';
      errEl.textContent = e.message || '登录失败，稍后再试';
      errEl.classList.remove('hidden');
    }
  };
  $('gateGo').onclick = go;
  $('gateForgot').onclick = forgotPassword;
  $('gateAcct').onkeydown = (e) => { if (e.key === 'Enter') $('gatePass').focus(); };
  $('gatePass').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

async function forgotPassword() {
  const acct = ($('gateAcct').value || '').trim().replace(/[\s-]/g, '');
  const errEl = $('gateErr');
  errEl.classList.add('hidden');
  if (!/^\d{5,20}$/.test(acct)) {
    errEl.textContent = '先在账号框输入注册手机号，再点重置';
    errEl.classList.remove('hidden');
    return;
  }
  const btn = $('gateForgot');
  btn.disabled = true; btn.textContent = '重置中…';
  try {
    const r = await fetch('/api/public/my/password/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: acct }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    $('gatePass').value = d.password || acct.slice(-4);
    toast('密码已重置为手机号后四位');
  } catch (e) {
    errEl.textContent = e.message || '重置失败，稍后再试';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = '忘记密码？重置为手机号后四位';
  }
}

/* ------------------------------ 注册页签 ------------------------------
   用户口径（2026-10-11）：手机号 = 账号，短信验证码数字 = 密码，注册时还要填主播姓名；
   姓名必须在主播台账（person 表）里查得到，查不到直接拒绝注册。
   注册同时调用 WorkBuddy 网关「添加账号 (OAuth)」（那张授权页本身就是手机号登录）。
   注册即绑定：校验通过直接以主播姓名建号，不用再走一遍「绑定主播」。 */
function bindRegPane() {
  $('paneReg').innerHTML =
    '<p class="tip">手机号就是账号，短信验证码数字就是密码</p>' +
    '<div id="regOauth" class="hidden">' +
      '<div class="reg-step" id="regStep1"><div class="n">1</div>' +
        '<div class="t">获取短信验证码并完成授权</div></div>' +
      '<button class="btn-sec" id="regAuth" style="width:100%;margin:0 0 10px">获取验证码</button>' +
      '<div id="regLinkBox"></div>' +
      '<div class="reg-state wait hidden" id="regState"></div>' +
    '</div>' +
    '<div class="reg-step"><div class="n">2</div>' +
      '<div class="t">填主播姓名、手机号和刚收到的验证码，完成注册</div></div>' +
    '<input id="regName" placeholder="主播姓名（艺名，必须和台账一致）" autocomplete="off">' +
    '<div class="reg-state wait hidden" id="regNameTip" style="margin:-4px 0 8px"></div>' +
    '<input id="regPhone" placeholder="手机号" inputmode="numeric" autocomplete="off">' +
    '<input id="regCode" placeholder="短信验证码（= 密码）" inputmode="numeric" autocomplete="off">' +
    '<div class="form-err hidden" id="regErr"></div>' +
    '<button class="btn-main" id="regGo">完成注册</button>' +
    '<p class="reg-note">姓名必须是主播台账里已有的艺名（注册时会自动核对，查不到无法注册）；' +
    '注册后手机号就是账号、验证码就是密码，忘记密码可重置为手机号后四位。</p>';
  $('regAuth').onclick = startRegOauth;
  $('regGo').onclick = doRegister;
  $('regName').onkeydown = (e) => { if (e.key === 'Enter') $('regPhone').focus(); };
  $('regName').onblur = () => checkRegName();
  $('regPhone').onkeydown = (e) => { if (e.key === 'Enter') $('regCode').focus(); };
  $('regCode').onkeydown = (e) => { if (e.key === 'Enter') doRegister(); };
}

function setRegState(text, kind) {
  const el = $('regState');
  if (!el) return;
  el.className = 'reg-state' + (kind ? ' ' + kind : '');
  el.textContent = text;
  el.classList.remove('hidden');
}

/** 探测注册能力：功能开没开（后台开关，默认关）+ 网关配没配 */
async function probeRegConfig() {
  if (regCfg === null) {
    try {
      regCfg = await fetch('/api/public/my/register/config').then((r) => r.json());
    } catch (_) {
      regCfg = { open: false, oauth: false };
    }
  }
  return regCfg || { open: false, oauth: false };
}

/** 进注册页签时的收尾：功能关着不让进；开着时按网关配置决定显不显示授权步骤 */
async function prepareRegPane() {
  const cfg = await probeRegConfig();
  if (!cfg.open) { gateTab('login'); return; }
  show('regOauth', !!cfg.oauth);
  /* 默认国内版，进入注册页即发起授权；必须加入账号池后才能完成注册 */
  if (cfg.oauth && !regWbState && !regOauthDone) await startRegOauth();
}

async function startRegOauth() {
  const btn = $('regAuth');
  btn.disabled = true; btn.textContent = '获取中…';
  $('regLinkBox').innerHTML = '';
  regWbState = ''; regOauthDone = false;
  stopRegPoll();
  try {
    const r = await fetch('/api/public/my/register/oauth/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ realm: 'cn' }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    regWbState = d.state || '';
    $('regLinkBox').innerHTML =
      '<a class="reg-link" href="' + esc(d.authUrl) + '" target="_blank" rel="noopener">' + esc(d.authUrl) + '</a>' +
      '<div class="reg-note" style="margin:-6px 0 10px">在打开的页面用<b>手机号</b>登录并完成授权；' +
      '完成后这里会自动继续。</div>';
    setRegState('等待授权完成…', 'wait');
    btn.disabled = false; btn.textContent = '重新获取验证码';
    try { window.open(d.authUrl, '_blank', 'noopener'); } catch (_) { /* 拦截了就点链接 */ }
    startRegPoll();
  } catch (e) {
    btn.disabled = false; btn.textContent = '获取验证码';
    setRegState('获取失败：' + (e.message || '稍后再试'), 'wait');
  }
}

function stopRegPoll() {
  if (regTimer) { clearInterval(regTimer); regTimer = null; }
}

function startRegPoll() {
  stopRegPoll();
  let tries = 0;
  regTimer = setInterval(async () => {
    tries += 1;
    if (tries > 120) {   // 5 分钟没结果就别再轮了
      stopRegPoll();
      setRegState('验证码检测超时：可以点「重新获取验证码」再来一次', 'wait');
      return;
    }
    if (!regWbState) return;
    try {
      const d = await fetch('/api/public/my/register/oauth/poll?state=' + encodeURIComponent(regWbState))
        .then((r) => r.json());
      const s = String(d.status || '');
      if (s === 'ok') {
        stopRegPoll();
        regOauthDone = true;
        const step = $('regStep1');
        if (step) step.classList.add('done');
        setRegState('✓ 已加入账号池' + (d.nickname ? '（' + d.nickname + '）' : '') + '，请继续第 ② 步', 'ok');
      } else if (s === 'error' || s === 'expired' || s === 'unknown') {
        stopRegPoll();
        setRegState('验证码获取失败或已过期：请点「重新获取验证码」重试', 'wait');
      }
    } catch (_) { /* 网络抖动继续轮询 */ }
  }, 2500);
}

/** 主播姓名实时校验：失焦就问一次台账有没有这个人（注册前先知道填错没）。
 *  审计 2026-10-11：判成败只认后端 d.ok（台账 collation 大小写不敏感，逐字比对会误报）；
 *  连续失焦时用序号丢弃过期响应，避免旧结果覆盖新输入。 */
let regNameCheckSeq = 0;
async function checkRegName() {
  const el = $('regName'), tip = $('regNameTip');
  if (!el || !tip) return;
  const v = (el.value || '').trim();
  if (!v) { tip.className = 'reg-state wait hidden'; tip.textContent = ''; return; }
  const seq = ++regNameCheckSeq;
  tip.className = 'reg-state wait';
  tip.textContent = '核对姓名…';
  try {
    const d = await fetch('/api/public/my/register/check-name?q=' + encodeURIComponent(v))
      .then((r) => r.json());
    if (seq !== regNameCheckSeq || (el.value || '').trim() !== v) return;   // 过期响应
    if (d.ok) {
      tip.className = 'reg-state ok';
      tip.textContent = '✓ 台账里有这位主播「' + (d.name || v) + '」' +
        (d.team === 'male' ? '（男团）' : d.team === 'female' ? '（女团）' : '');
    } else {
      tip.className = 'reg-state wait';
      tip.textContent = d.error || '主播库里没有这个姓名';
    }
  } catch (_) {
    if (seq !== regNameCheckSeq) return;
    tip.className = 'reg-state wait hidden';
    tip.textContent = '';
  }
}

async function doRegister() {
  const name = ($('regName').value || '').trim();
  const phone = ($('regPhone').value || '').trim().replace(/[\s-]/g, '');
  const code = ($('regCode').value || '').trim();
  const errEl = $('regErr');
  const fail = (m) => {
    errEl.textContent = m;
    errEl.classList.remove('hidden');
  };
  errEl.classList.add('hidden');
  if (!name) return fail('请输入主播姓名（艺名）');
  if (name.length > 20) return fail('姓名太长（最多 20 字）');
  if (!/^\d{5,20}$/.test(phone)) return fail('请输入 5~20 位数字手机号');
  if (!/^\d{4,20}$/.test(code)) return fail('验证码应为 4~20 位数字（验证码就是密码）');
  if (regCfg && regCfg.oauth) {
    if (!regWbState) return fail('请先点「获取验证码」并用手机号完成授权');
    if (!regOauthDone) return fail('验证码授权还没完成，请稍后再点完成注册');
  }
  const btn = $('regGo');
  btn.disabled = true; btn.textContent = '注册中…';
  try {
    const r = await fetch('/api/public/my/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, code, name, team: '', wbState: regOauthDone ? regWbState : '' }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    if (!d.ok) throw new Error('注册失败，稍后再试');
    /* 注册即绑定：token 统一存 MY_ANY_KEY，不再按团别分档，避免跨团跳转。 */
    const team = d.team === 'male' || d.team === 'female' ? d.team : '';
    sessionStorage.setItem(MY_ANY_KEY, d.token);
    localStorage.setItem(MY_ANY_NAME, d.name || name);
    toast('注册成功，已绑定主播「' + (d.name || name) + '」');
    closeGate({ name: d.name || name, personId: d.personId || 0, bound: d.bound !== false,
      needBind: false, team: team, anyTeam: !team });
  } catch (e) {
    btn.disabled = false; btn.textContent = '完成注册';
    fail(e.message || '注册失败，稍后再试');
  }
}

/* 会话失效（接口 401）：清 token 回登录门；登录门已开着就不动 */
function sessionExpired() {
  myLogout();
  removeWatermark();
  if (gateResolve) return;            // 登录门已在
  gateResolve = () => location.reload();
  showGate();
}

/* 访问门禁（2026-10-11）：白名单外的访客整页提示（连不上服务之外的另一种终止态） */
let regionBlockedShown = false;
function regionBlocked(msg) {
  if (regionBlockedShown) return;
  regionBlockedShown = true;
  document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="big">🔒</span><b>' +
    esc(msg || '您的ip不在授权范围内') + '</b><br>本展示页仅对安徽、河南、江苏开放</div>';
}

/* 启动前置：有 token 先验身份（轻量 who）；没有/失效 → 弹登录门等人登录 */
async function ensureLogin() {
  const t = myToken();
  if (t) {
    /* token 可能记在别的团（团别待定的登录态两团都认）：候选团逐个问一遍身份 */
    const cands = ['all'];
    for (const team of cands) {
      try {
        const who = await fetch('/api/public/teams/' + team + '/my/who?token=' +
          encodeURIComponent(t)).then((r) => r.json());
        if (who && who.ok) {
          /* team 回账号真正的团别（团别待定 = 空串），不是刚试探的团 */
          who.team = who.anyTeam ? '' :
            (who.team === 'male' || who.team === 'female' ? who.team : team);
          return who;
        }
        if (who && /过期|失效/.test(who.error || '')) break;   // token 本身失效，别再问别的团
      } catch (_) { /* 网络问题也走重新登录，登录卡会给出报错 */ }
    }
    myLogout();
  }
  return new Promise((resolve) => {
    gateResolve = resolve;
    showGate();
  });
}

/* 全屏艺名水印：平铺斜排、极低透明度、pointer-events none，不影响任何操作 */
function applyWatermark(name) {
  const wm = $('wm');
  const nm = String(name || '').trim();
  if (!nm) { wm.hidden = true; return; }
  const tile = '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150">' +
    '<text x="120" y="80" font-size="14" fill="#0F1728" fill-opacity="0.10" text-anchor="middle" ' +
    'transform="rotate(-22 120 80)">' + esc(nm) + ' · ' + esc(nm) + '</text></svg>';
  wm.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(tile) + '")';
  wm.hidden = false;
}
function removeWatermark() { const wm = $('wm'); if (wm) { wm.hidden = true; wm.style.backgroundImage = ''; } }

/* ==================== 榜单 ==================== */
/* 版式严格对齐排行榜参考设计：TOP3 领奖台 + 名次/头像/名字/数值 的简洁列表。
   涨红跌绿是本项目固定口径：名次升 = 红 ↑，降 = 绿 ↓。 */
function deltaChip(it) {
  if (!it.delta) return '';
  const d = it.delta;
  if (d.dir === 'up') return '<span class="delta d-up">↑' + d.n + '</span>';
  if (d.dir === 'down') return '<span class="delta d-down">↓' + d.n + '</span>';
  return '<span class="delta d-flat">—</span>';
}

/* 头像：没有照片，用名字首字 + 按名字哈希取稳定底色（同一个人颜色不变） */
const AV_COLORS = ['#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#14B8A6'];
function avColor(name) {
  let h = 0;
  const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
const avHtml = (name) =>
  '<span class="av" style="background:' + avColor(name) + '">' +
  esc(String(name || '?').charAt(0)) + '</span>';

/** 领奖台：按 [第2名, 第1名, 第3名] 排布，第一名居中大号；缺位留空。
    后台关掉「音浪数值」时接口不下发数字（wave=null），显示 —。 */
function podHtml(items) {
  const pick = (r) => items.find(x => x.hasData !== false && x.rank === r);
  const order = [pick(2), pick(1), pick(3)];
  if (!order.some(Boolean)) return '';
  /* Stitch 版领奖台：外圈白环 + 内圈米色/银/铜，冠军带皇冠 + 深棕名次标 */
  const IN_TONE = (r) =>
    r === 1 ? 'st-pod-in-1' : r === 2 ? 'st-pod-in-2' : 'st-pod-in-3';
  const crown = '<div class="st-crown"><span class="material-symbols-outlined" style="font-variation-settings:&quot;FILL&quot; 1;">crown</span></div>';
  return '<div class="st-podium">' + order.map(it => {
    if (!it) return '<div class="st-pod"></div>';
    const ch = esc(String(it.name || '?').charAt(0));
    const wave = it.wave == null ? '—' : wan(it.wave);
    const total = it.periodic ? '' : (it.totalWave == null ? '' : wan(it.totalWave));
    const label = it.periodic ? (period === 'monthly' ? '当月音浪' : '年度音浪') : '日音浪';
    const min = it.minutes == null || it.minutes === 0 ? ''
      : (it.minutes >= 60 ? Math.floor(it.minutes / 60) + '小时' + (it.minutes % 60 ? (it.minutes % 60) + '分' : '') : it.minutes + '分钟');
    const absent = it.periodic ? (it.absentDays == null ? 0 : it.absentDays) : null;
    return '<div class="st-pod st-pod-' + it.rank + '" data-n="' + esc(it.name) + '" data-w="' + (it.wave == null ? '' : it.wave) + '">' +
      '<div class="st-pod-ring">' +
        (it.rank === 1 ? crown : '') +
        '<div class="st-pod-av ' + IN_TONE(it.rank) + '">' + ch + '</div>' +
        '<span class="st-pod-rank">' + it.rank + '</span>' +
      '</div>' +
      '<h3 class="st-pod-nm">' + esc(it.name) + '</h3>' +
      (absent != null ? '<span class="st-pod-off' + (absent > 0 ? ' warn' : '') + '">未播 ' + absent + '天</span>' : '') +
      (min ? '<span class="st-pod-off">时长 ' + min + '</span>' : '') +
      '<p class="st-pod-wv">' + wave + '</p>' +
      '<span class="st-pod-lbl">' + label + '</span>' +
      (total ? '<p class="st-pod-total">总 ' + total + '</p>' : '') +
    '</div>';
  }).join('') + '</div>';
}

/** 榜单行（Stitch 版）：
    日榜：按当日音浪排名，右列显示当日音浪，不显示未播天数。
    月榜：按当月音浪排名，右列显示当月音浪。
    年榜：按年度音浪排名，右列显示年度音浪。
    时长字段：导入有数据就显示在名字下方，没有则完全隐藏。 */
function lbRowHtml(it) {
  const hideWave = it.wave == null;
  const off = it.hasData === false || (!hideWave && it.wave < 2);
  const wave = hideWave ? '—' : wan(it.wave);
  const rightLbl = it.periodic
    ? (period === 'monthly' ? '当月音浪' : '年度音浪')
    : '当日音浪';
  const min = (it.minutes == null || it.minutes === 0) ? ''
    : (it.minutes >= 60 ? Math.floor(it.minutes / 60) + '小时' + (it.minutes % 60 ? (it.minutes % 60) + '分' : '') : it.minutes + '分钟');
  const absent = it.periodic ? (it.absentDays == null ? 0 : it.absentDays) : null;
  const sub = min ? '时长 ' + min : '';
  return '<div class="st-row' + (off ? ' off' : '') + '" data-n="' + esc(it.name) +
    '" data-w="' + (off || hideWave ? '' : it.wave) + '">' +
    '<div class="st-row-l">' +
      '<span class="st-row-rk">' + (off ? '—' : (it.rank || '—')) + '</span>' +
      '<div class="st-row-av" style="background:' + avSoft(it.name) + '">' +
        esc(String(it.name || '?').charAt(0)) + '</div>' +
      '<div class="st-row-mid">' +
        '<div class="st-row-nmwrap"><span class="st-row-nm">' + esc(it.name) + '</span>' +
          (absent != null ? '<span class="st-row-off' + (absent > 0 ? ' warn' : '') + '">未播 ' + absent + '天</span>' : '') +
        '</div>' +
        (sub ? '<p class="st-row-sub">' + sub + '</p>' : '') +
      '</div>' +
    '</div>' +
    '<div class="st-row-r"><span class="st-row-wv">' + (off ? '—' : wave) + '</span>' +
      '<span class="st-row-lbl">' + rightLbl + '</span></div>' +
  '</div>';
}

/** Stitch 版头像：柔和底色（indigo/sky/violet/rose/orange/teal 轮换） */
const SOFT_TONES = [
  ['rgba(99,102,241,.10)', '#4c4aca'],
  ['rgba(14,165,233,.10)', '#0369a1'],
  ['rgba(139,92,246,.10)', '#6d28d9'],
  ['rgba(244,63,94,.10)',  '#be123c'],
  ['rgba(249,115,22,.10)', '#c2410c'],
  ['rgba(20,184,166,.10)', '#0f766e'],
];
function avSoft(name) {
  let h = 0; const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const t = SOFT_TONES[h % SOFT_TONES.length];
  return 'background:' + t[0] + ';color:' + t[1];
}

let listAll = [];
/** 参与渲染的行：搜索过滤（未开播的人始终显示，置灰） */
function visibleRows() {
  const key = q.trim();
  return listAll.filter(it => !key || String(it.name).indexOf(key) >= 0);
}
function renderList() {
  const key = q.trim();
  /* 搜索时收起领奖台：命中的人（含前三）全部在列表里找得到；
     平时列表从第 4 名起，前三只在领奖台上出现一次（严格对齐参考设计） */
  const pod = key ? '' : podHtml(listAll);
  const rows = pod ? visibleRows().filter(it => !(it.rank >= 1 && it.rank <= 3)) : visibleRows();
  /* 只有前三名有数据时：领奖台照常，列表部分留个说明行而不是空态 */
  const isDaily = period === 'daily' && !listAll.some(x => x.periodic);
  const headL = isDaily ? '名次 / 主播' : '名次 / 主播 / 状态';
  const headR = isDaily ? '当日音浪' : (period === 'monthly' ? '当月音浪' : '年度音浪');
  const listHtml = '<div class="st-list">' +
    '<div class="st-list-head"><span>' + headL + '</span><span>' + headR + '</span></div>' +
    '<div class="st-list-body">' +
      (rows.length ? rows.map(lbRowHtml).join('') : '<div class="empty" style="padding:18px">其余人今天还没有数据</div>') +
    '</div></div>';
  const body = rows.length === 0 && !pod
    ? '<div class="empty">' + (key ? '没有匹配「' + esc(key) + '」的主播<br>换个名字试试'
        : '<span class="big">📺</span>这个' + (period === 'daily' ? '日期' : '周期') + '没有可显示的主播<br>换个日期试试') + '</div>'
    : (pod + listHtml);
  $('view').innerHTML = '<div class="section">' + body + '</div>';
  bindRows();
}

function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {});
  toast('已复制 ' + t);
}

/* 点人/长按 = 复制「名字 · 音浪」；音浪隐藏时只复制名字 */
function bindRows() {
  const copy = (el) => copyText(el.dataset.w === ''
    ? el.dataset.n
    : el.dataset.n + ' · ' + wan(Number(el.dataset.w || 0)) + ' 音浪');
  document.querySelectorAll('#view .lb-row, #view .pod').forEach(el => {
    let lp;
    el.onclick = () => copy(el);
    el.oncontextmenu = (e) => { e.preventDefault(); copy(el); };
    el.ontouchstart = () => { lp = setTimeout(() => copy(el), 520); };
    el.ontouchend = el.ontouchmove = () => clearTimeout(lp);
  });
}

/* ==================== 加载：数据页 ==================== */
async function loadData() {
  if (period === 'daily') {
    const d = await api('/api/public/teams/' + TEAM + '/daily' + (curDate ? '?date=' + curDate : ''));
    curDate = d.date;
    listAll = d.items || [];
    $('mhSub').textContent = 'DATA ' + (curDate || '').replaceAll('-', '.') +
      ' · ' + (d.liveCount || 0) + '/' + (d.teamSize || listAll.length) + ' 有数据';
    renderDates();
  } else {
    const url = '/api/public/teams/' + TEAM + '/' + period + (curPeriod ? '?period=' + curPeriod : '');
    const d = await api(url);
    /* 显隐兜底（2026-10-11）：后端 published:false / periodEnabled:false 时不下发 period，
       以前直接 curPeriod = d.period 再 .slice 会抛错，页面只剩「暂时取不到数据」。 */
    if (!d || d.published === false) {
      listAll = [];
      $('mhSub').textContent = period === 'monthly' ? 'MONTH' : 'YEAR';
      $('pNow').textContent = period === 'monthly'
        ? nowPeriod('monthly').slice(0, 4) + '年' + (+nowPeriod('monthly').slice(5, 7)) + '月'
        : nowPeriod('yearly') + '年';
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        LABEL() + '数据暂未公布<br>请等管理员发布</div></div>';
      return;
    }
    if (d.periodEnabled === false) {
      listAll = [];
      $('mhSub').textContent = period === 'monthly' ? 'MONTH' : 'YEAR';
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        (period === 'monthly' ? '每月' : '每年') + '榜暂未开放<br>换个口径看看</div></div>';
      return;
    }
    curPeriod = snapPeriod(period, d.period || curPeriod);
    if (!curPeriod) {
      listAll = [];
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        '这个周期没有可显示的主播<br>换一个周期试试</div></div>';
      return;
    }
    /* periodic：月/年榜行没有 absentDays/totalWave 概念，榜单行不渲染「本月/未播」副行 */
    listAll = (d.items || []).map(x => ({ ...x, hasData: true, periodic: true }));
    $('mhSub').textContent = (period === 'monthly' ? 'MONTH ' : 'YEAR ') + curPeriod;
    $('pNow').textContent = period === 'monthly'
      ? curPeriod.slice(0, 4) + '年' + (+curPeriod.slice(5, 7)) + '月'
      : curPeriod + '年';
    syncStepper();
  }
  renderList();
}

function renderDates() {
  const dates = (site && site.dates) || [];
  let prevM = '';
  $('dates').innerHTML = dates.map(d => {
    let label = d.slice(5).replace('-', '.');
    if (d === todayStr()) label = '今天';
    else if (d === refStr()) label = '昨天';
    /* 跨月时插一条「10月」分隔，长条里不迷路 */
    const m = d.slice(0, 7);
    const gap = prevM && m !== prevM ? '<span class="mgap">' + (+m.slice(5, 7)) + '月</span>' : '';
    prevM = m;
    const noData = calMonths && !calMonths.has(d.slice(0, 7)) ? '' :
      (calDays && !calDays.has(d) ? ' nodata' : '');
    return gap + '<button data-d="' + d + '" class="' + (d === curDate ? 'on' : '') + noData + '">' + label + '</button>';
  }).join('');
  document.querySelectorAll('#dates button').forEach(b => b.onclick = () => pickDate(b.dataset.d));
}

/* 点日期（日期条 / 日历共用）：先本地高亮（点了立刻有反应），再拉数据 */
function pickDate(d) {
  if (!d || d === curDate) return;
  curDate = d;
  document.querySelectorAll('#dates button').forEach(x =>
    x.classList.toggle('on', x.dataset.d === d));
  const on = document.querySelector('#dates button.on');
  if (on) on.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  go();
}

/* 数据分布（有数据的天）：curDate 所在月拉不到就把整段 dates 摊进日历 */
let calDays = null;      // Set('YYYY-MM-DD') 有数据的日子；null = 未知（不标点）
let calMonths = null;    // Set('YYYY-MM') 有数据的月份（哪些月缺数据）

function calBuildDays() {
  const dates = (site && site.dates) || [];
  calDays = new Set(dates);
  calMonths = new Set(dates.map(d => d.slice(0, 7)));
}

let calY = 0, calM = 0;   // 日历当前显示的年月（calM: 0-11）

function calShow() {
  if (!(site && site.dates && site.dates.length)) { toast('还没有可选的日期'); return; }
  if (!calDays) calBuildDays();
  const ref = curDate || refStr();
  calY = +ref.slice(0, 4);
  calM = +ref.slice(5, 7) - 1;
  if ($('calPop')) { $('calPop').classList.remove('hidden'); calRender(); return; }
  const pop = document.createElement('div');
  pop.id = 'calPop';
  pop.className = 'cal-pop';
  pop.innerHTML = '<div class="cal-card">' +
    '<div class="cal-head">' +
    '<button id="calPrev" title="上一个月"><span class="material-symbols-outlined">chevron_left</span></button>' +
    '<div class="ttl" id="calTitle">—</div>' +
    '<button id="calNext" title="下一个月"><span class="material-symbols-outlined">chevron_right</span></button>' +
    '<button class="close" id="calClose" title="关闭"><span class="material-symbols-outlined">close</span></button>' +
    '</div>' +
    '<div class="cal-grid" id="calGrid"></div>' +
    '<div class="note" style="margin:10px 0 0">绿点 = 有数据的日子 · 只能选有数据的日期</div>' +
    '</div>';
  document.body.appendChild(pop);
  pop.addEventListener('click', (e) => { if (e.target === pop) calHide(); });
  $('calClose').onclick = calHide;
  $('calPrev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } calRender(); };
  $('calNext').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } calRender(); };
  calRender();
}

function calHide() {
  const p = $('calPop');
  if (p) p.classList.add('hidden');
}

function calRender() {
  $('calTitle').textContent = calY + ' 年 ' + (calM + 1) + ' 月';
  const first = new Date(calY, calM, 1);
  const lead = first.getDay();                       // 0=周日
  const dim = new Date(calY, calM + 1, 0).getDate(); // 本月天数
  const prevDim = new Date(calY, calM, 0).getDate();
  const tStr = todayStr();
  let html = '';
  ['日', '一', '二', '三', '四', '五', '六'].forEach((w, i) => {
    html += '<div class="wd' + (i === 0 || i === 6 ? ' wkend' : '') + '">' + w + '</div>';
  });
  for (let i = lead - 1; i >= 0; i--) {
    html += '<button class="cal-d dim" disabled>' + (prevDim - i) + '</button>';
  }
  for (let d = 1; d <= dim; d++) {
    const ds = calY + '-' + pad2(calM + 1) + '-' + pad2(d);
    const has = calDays && calDays.has(ds);
    const cls = 'cal-d' + (has ? ' has' : '') + (ds === tStr ? ' today' : '') + (ds === curDate ? ' on' : '');
    html += '<button class="' + cls + '" data-d="' + ds + '"' + (has ? '' : ' disabled') + '>' + d + '</button>';
  }
  const tail = (7 - (lead + dim) % 7) % 7;
  for (let d = 1; d <= tail; d++) {
    html += '<button class="cal-d dim" disabled>' + d + '</button>';
  }
  $('calGrid').innerHTML = html;
  $('calGrid').querySelectorAll('.cal-d[data-d]').forEach(b => {
    b.onclick = () => {
      calHide();
      pickDate(b.dataset.d);   // 本地先高亮，数据回来再换内容
    };
  });
}

/* ==================== 族谱画布（男团：鹏先生为祖师爷的师门树） ==================== */
let lineageNodes = [];   // /lineage 的扁平节点
let lineageSel = null;   // 点击选中的节点 id（高亮祖师→自己整条链）
let lnView = { x: 0, y: 0, s: 1 };
let lnById = new Map();  // id → 布局节点（渲染后供搜索/定位用）
let lineageQ = '';       // 搜索词
let lnHitIdx = 0;        // 回车在命中之间循环

/* 与分组长图同源的 8 色循环：每个师门一种颜色， trunk（祖师+各大支支头）上色 */
const LN_THEMES = [
  { bg:'#fdeaf1', bd:'#f6a8c5', tc:'#e04f8a' },
  { bg:'#f0ecfd', bd:'#b3a1f2', tc:'#7a58e0' },
  { bg:'#e4f7fb', bd:'#7fd0e2', tc:'#189db8' },
  { bg:'#fdf3dd', bd:'#f4c46a', tc:'#dd8f1d' },
  { bg:'#e7f7ec', bd:'#82cb9b', tc:'#2f9e5d' },
  { bg:'#fdebe9', bd:'#f19a97', tc:'#dd4f4c' },
  { bg:'#e9eefc', bd:'#98aaee', tc:'#4c63d6' },
  { bg:'#e6f6f1', bd:'#74c7ab', tc:'#1c9b77' },
];

async function loadLineage() {
  const d = await api('/api/public/teams/' + TEAM + '/lineage');
  lineageNodes = d.nodes || [];
  $('mhSub').textContent = 'LINEAGE ' + lineageNodes.length + ' 人';
  lineageQ = ''; lnHitIdx = 0;
  renderLineage(false);
}

/** 树布局（横向，从左到右）：祖师在最左，一代向右一列；同层按子树大小排，
    父节点纵向居中于最上/最下子节点之间。叶节点各占一行。 */
function layoutLineage() {
  const byId = new Map(lineageNodes.map(n => [n.id, Object.assign({}, n, { kids: [], th: null, depth: 0, x: 0, y: 0 })]));
  const roots = [];
  for (const n of byId.values()) {
    if (n.masterId != null && byId.has(n.masterId)) byId.get(n.masterId).kids.push(n);
    else roots.push(n);
  }
  /* 没师傅又没徒弟的散人不上树（有徒弟的师门根保留：那是每棵树的头）。
     注意只从 byId 里摘掉，lineageNodes 原样保留，导出图底部的名单还要用。 */
  for (const n of [...byId.values()]) {
    if (n.masterId == null && n.kids.length === 0) byId.delete(n.id);
  }
  const visRoots = roots.filter(r => byId.has(r.id));
  const size = (n) => 1 + n.kids.reduce((s, k) => s + size(k), 0);
  const sortRec = (n) => {
    n.kids.sort((a, b) => size(b) - size(a) || a.name.localeCompare(b.name, 'zh-Hans-CN'));
    n.kids.forEach(sortRec);
  };
  roots.sort((a, b) => size(b) - size(a) || a.name.localeCompare(b.name, 'zh-Hans-CN'));
  roots.forEach(sortRec);
  const COL = 132, ROW = 62, PAD = 48;
  let cursor = PAD, maxDepth = 0;
  const place = (n, depth, th) => {
    n.depth = depth; n.th = th;
    maxDepth = Math.max(maxDepth, depth);
    if (!n.kids.length) { n.y = cursor + ROW / 2; cursor += ROW; }
    else { n.kids.forEach(k => place(k, depth + 1, th)); n.y = (n.kids[0].y + n.kids[n.kids.length - 1].y) / 2; }
    n.x = PAD + depth * COL;
  };
  visRoots.forEach((r, i) => place(r, 0, LN_THEMES[i % LN_THEMES.length]));
  return { byId, roots: visRoots, width: PAD * 2 + maxDepth * COL + 88, height: Math.max(cursor + PAD, 300) };
}

/** 祖师 → 自己 的链上所有人 */
function chainSet(byId, id) {
  const s = new Set();
  let cur = id, guard = 0;
  while (cur != null && byId.has(cur) && guard++ < 60) { s.add(cur); cur = byId.get(cur).masterId; }
  return s;
}

/* ---- 画布视图：平移/缩放/定位（顶层函数，按钮和手势共用） ---- */
function lnApply() {
  const vp = $('lnVp');
  if (vp) vp.setAttribute('transform', 'translate(' + lnView.x + ',' + lnView.y + ') scale(' + lnView.s + ')');
}
function lnZoomAt(px, py, k) {
  const v = lnView;
  const ns = Math.min(2.5, Math.max(0.22, v.s * k));
  const real = ns / v.s;
  v.x = px - (px - v.x) * real;
  v.y = py - (py - v.y) * real;
  v.s = ns;
  lnApply();
}
/** 把某人带到画布正中（搜索定位用），必要时稍微放大 */
function lnFocus(id) {
  const wrap = $('lnWrap');
  const n = lnById.get(id);
  if (!wrap || !n) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  lnView.s = Math.max(lnView.s, 0.85);
  lnView.x = w / 2 - n.x * lnView.s;
  lnView.y = h / 2 - n.y * lnView.s;
  lnApply();
}

const LN_FS_COLLAPSE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';

/* ---- 导出族谱图片：按布局数据现拼独立 SVG（内联属性，不依赖页面 CSS）→ Canvas → PNG ---- */
const LN_PNG_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>';
const LN_FONT = "-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif";
const LN_ROW = 62, LN_PAD = 48, LN_HALF_W = 44, LN_HEAD = 132, LN_FOOT = 64;

/** 名字列表按可用宽度折行（中文按 1 字宽、ASCII 按 0.55 估） */
function lnWrapNames(names, maxW, fontPx) {
  fontPx = fontPx || 12;
  const wOf = (s) => [...s].reduce((w, ch) => w + (/[\x00-\xff]/.test(ch) ? fontPx * 0.55 : fontPx), 0);
  const lines = [];
  let cur = '';
  for (const n of names) {
    const candidate = cur ? cur + '、' + n : n;
    if (cur && wOf(candidate) > maxW) { lines.push(cur); cur = n; }
    else cur = candidate;
  }
  if (cur) lines.push(cur);
  return lines;
}

/** 拼一张整族谱的独立 SVG：每棵师门树先算包围盒，再贪心装列（目标是接近方形，别出细长条） */
function lnBuildSvg() {
  const all = [...lnById.values()];
  if (!all.length) return null;
  /* 布局节点上已带 th（门色）与 kids（子树），直接用，保证与画布同色同层级 */
  const roots = all.filter(n => n.masterId == null || !lnById.has(n.masterId));
  const boxes = roots.map(root => {
    const nodes = [], edges = [];
    const walk = (n) => {
      nodes.push(n);
      (n.kids || []).forEach(k => { edges.push([n, k]); walk(k); });
    };
    walk(root);
    const minX = Math.min.apply(null, nodes.map(n => n.x)) - LN_HALF_W;
    const minY = Math.min.apply(null, nodes.map(n => n.y)) - 26;
    const maxX = Math.max.apply(null, nodes.map(n => n.x)) + LN_HALF_W;
    const maxY = Math.max.apply(null, nodes.map(n => n.y)) + 26;
    return { nodes: nodes, edges: edges, minX: minX, minY: minY, w: maxX - minX, h: maxY - minY, x: 0, y: 0 };
  });
  const GAP_X = 56, GAP_Y = 44;
  const colW = Math.max.apply(null, boxes.map(b => b.w).concat([320]));
  const sumH = boxes.reduce((s, b) => s + b.h + GAP_Y, 0);
  const targetH = Math.max(Math.max.apply(null, boxes.map(b => b.h)), Math.sqrt(sumH * colW));
  const cols = [];
  let cur = { boxes: [], w: 0, h: 0 };
  for (const b of boxes) {
    if (cur.boxes.length && cur.h + b.h + GAP_Y > targetH) { cols.push(cur); cur = { boxes: [], w: 0, h: 0 }; }
    cur.boxes.push(b);
    cur.w = Math.max(cur.w, b.w);
    cur.h += b.h + (cur.boxes.length > 1 ? GAP_Y : 0);
  }
  if (cur.boxes.length) cols.push(cur);
  let cx = LN_PAD, bodyH = 0;
  for (const c of cols) {
    let cy = 0;
    for (const b of c.boxes) { b.x = cx; b.y = cy; cy += b.h + GAP_Y; }
    bodyH = Math.max(bodyH, c.h);
    cx += c.w + GAP_X;
  }
  const width = Math.max(cx - GAP_X + LN_PAD, 640);
  /* 没有师傅的人：图底部再补一份文字名单。用原始数据（lineageNodes）而不是上树的节点，
     因为「没师傅又没徒弟」的散人已经不画在树里了，得在这一行里留个记录 */
  const orphans = lineageNodes.filter(n => n.masterId == null).map(n => n.name);
  const listLines = orphans.length ? lnWrapNames(orphans, width - LN_PAD * 2) : [];
  const listH = orphans.length ? 50 + listLines.length * 20 : 0;
  const listTop = LN_HEAD + bodyH;
  const height = LN_HEAD + bodyH + listH + LN_FOOT;
  const px = (b, n) => b.x + (n.x - b.minX);
  const py = (b, n) => b.y + (n.y - b.minY) + LN_HEAD;

  let edges = '', cells = '';
  for (const b of boxes) {
    for (const e of b.edges) {
      const p = e[0], n = e[1];
      const stroke = n.depth === 1 && n.th ? n.th.bd : '#C3CDDC';
      const x1 = px(b, p) + LN_HALF_W, x2 = px(b, n) - LN_HALF_W, mx = (x1 + x2) / 2;
      edges += '<path d="M' + x1 + ',' + py(b, p) + ' H' + mx + ' V' + py(b, n) + ' H' + x2 +
        '" fill="none" stroke="' + stroke + '" stroke-width="1.5"/>';
    }
    for (const n of b.nodes) {
      const off = n.status === 'left';
      const th = n.th;
      const fill = n.depth === 0 && th ? th.bg : '#FFFFFF';
      const stroke = th ? th.bd : '#E5E7EB';
      const nameFill = th && !off ? th.tc : '#0b1c30';
      const sub = n.disciples > 0 ? n.disciples + ' 徒'
        : (off ? '已离团' : '第 ' + ((n.generation != null ? n.generation : n.depth) + 1) + ' 代');
      const nx = px(b, n), ny = py(b, n);
      cells += '<g opacity="' + (off ? 0.45 : 1) + '">' +
        '<rect x="' + (nx - LN_HALF_W) + '" y="' + (ny - 26) + '" width="' + (LN_HALF_W * 2) + '" height="52" rx="11" fill="' + fill +
        '" stroke="' + stroke + '" stroke-width="' + (n.depth === 0 ? 1.5 : 1) + '"/>' +
        '<text x="' + nx + '" y="' + (ny - 3) + '" text-anchor="middle" font-family="' + LN_FONT +
        '" font-size="13" font-weight="700" fill="' + nameFill + '">' + esc(n.name) + '</text>' +
        '<text x="' + nx + '" y="' + (ny + 16) + '" text-anchor="middle" font-family="' + LN_FONT +

  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height +

    edges + cells +
    (listH
      ? '<line x1="0" y1="' + (listTop + 6) + '" x2="' + width + '" y2="' + (listTop + 6) + '" stroke="#E5E7EB" stroke-width="1"/>' +
        '<text x="' + LN_PAD + '" y="' + (listTop + 32) + '" font-family="' + LN_FONT + '" font-size="13" font-weight="700" fill="#475467">没有师傅（' + orphans.length + ' 人）</text>' +
        listLines.map((ln, i) =>
          '<text x="' + LN_PAD + '" y="' + (listTop + 54 + i * 20) + '" font-family="' + LN_FONT +
          '" font-size="12" fill="#64748b">' + esc(ln) + '</text>').join('')
      : '') +
