    '<text x="' + (width / 2) + '" y="' + (height - 24) + '" text-anchor="middle" font-family="' + LN_FONT +
    '" font-size="12" fill="#94a3b8">' + esc(foot) + '</text></svg>';
  return { svg: svg, width: width, height: height };
}
async function lnExportPng() {
  try {
    const t = lnBuildSvg();
    if (!t) { toast('还没有可导出的族谱'); return; }
    toast('正在生成图片…');
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(t.svg);
    await img.decode();
    /* 太长（近百人 ≈ 7000px）时降倍率，别撞 canvas 尺寸上限 */
    const s = Math.max(1, Math.min(2, 15000 / t.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(t.width * s);
    cv.height = Math.round(t.height * s);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise((res, rej) =>
      cv.toBlob(b => (b ? res(b) : rej(new Error('canvas 转 PNG 失败'))), 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = LABEL() + '族谱-' + todayStr() + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('已导出族谱图片 ' + cv.width + '×' + cv.height);
  } catch (e) {
    toast('导出失败：' + (e && e.message ? e.message : e));
  }
}

/** 搜索：不重建画布，只切换 hit 类 + 计数 + 定位（避免每次按键丢输入框焦点） */
function lineageHitIds() {
  const q = lineageQ.trim();
  if (!q) return [];
  const out = [];
  for (const n of lnById.values()) if (n.name.indexOf(q) >= 0) out.push(n.id);
  return out;
}
function lineageUpdateHits() {
  const ids = lineageHitIds();
  const set = new Set(ids);
  document.querySelectorAll('.ln-node').forEach(g => {
    g.classList.toggle('hit', set.has(Number(g.dataset.id)));
  });
  const qi = $('lnQInfo');
  if (ids.length) {
    if (lnHitIdx >= ids.length) lnHitIdx = 0;
    qi.style.display = '';
    qi.textContent = (lnHitIdx + 1) + '/' + ids.length;
    lnFocus(ids[lnHitIdx]);
  } else if (qi) {
    qi.style.display = 'none';
  }
}

function renderLineage(keepView) {
  const t = layoutLineage();
  const { byId, roots } = t;
  lnById = byId;
  const anc = lineageSel != null ? chainSet(byId, lineageSel) : null;
  const inChain = (id) => anc != null && anc.has(id);
  const q = lineageQ.trim();
  const hits = q ? new Set([...byId.values()].filter(n => n.name.indexOf(q) >= 0).map(n => n.id)) : null;

  /* Stitch 指标卡：在册 / 分支 / 代际 / 累计音浪 */
  const total = lineageNodes.length;
  const branches = roots.length;
  const gens = new Set([...byId.values()].map(n => n.generation != null ? n.generation : n.depth)).size;
  const waveSum = lineageNodes.reduce((s, n) => s + (n.wave || 0), 0);
  const branchCards = roots.slice(0, 12).map((r, i) => {
    const sub = r.disciples > 0 ? r.disciples + ' 位徒弟' : (r.status === 'left' ? '已离团' : '在册');
    const kids = (r.kids || []).slice(0, 6).map(k =>
      '<div class="st-branch-kid"><div class="st-kid-card">' +
        '<div class="l"><div class="st-branch-av sub">' + esc(String(k.name || '?').charAt(0)) + '</div>' +
        '<div><div class="nm">' + esc(k.name) + '</div>' +
        '<div class="sub">第 ' + (((k.generation != null ? k.generation : 1) + 1)) + ' 代</div></div></div>' +
        '<span class="st">' + (k.status === 'left' ? '离团' : '活跃') + '</span>' +
      '</div></div>').join('');
    const more = (r.kids || []).length > 6
      ? '<div class="st-branch-kid"><div class="st-kid-card"><span class="st">… 还有 ' +
        ((r.kids || []).length - 6) + ' 位</span></div></div>' : '';
    return '<div class="st-branch-card" data-id="' + r.id + '">' +
      '<div class="l"><div class="st-branch-av">' + esc(String(r.name || '?').charAt(0)) + '</div>' +
        '<div><div><span class="st-branch-nm">' + esc(r.name) + '</span>' +
        '<span class="st-branch-tag">一代</span></div>' +
        '<div class="st-branch-sub">' + esc(sub) + '</div></div></div>' +
      '<button class="st-ln-btn" data-toggle="branch-' + i + '" title="展开/收起">' +
        '<span class="material-symbols-outlined">expand_less</span></button>' +
    '</div>' +
    '<div class="st-branch-kids" id="branch-' + i + '">' + kids + more + '</div>';
  }).join('');

  let edges = '';
  for (const n of byId.values()) {
    if (n.masterId == null || !byId.has(n.masterId)) continue;
    const p = byId.get(n.masterId);
    const x1 = p.x + 44, x2 = n.x - 44, mx = (x1 + x2) / 2;
    const hot = anc != null && inChain(n.id) && anc.has(p.id);
    const cls = 'ln-edge' + (hot ? ' hot' : (anc ? ' dim' : ''));
    const trunk = n.depth === 1 && n.th ? ' style="stroke:' + n.th.bd + '"' : '';
    edges += '<path class="' + cls + '"' + trunk + ' d="M' + x1 + ',' + p.y + ' H' + mx + ' V' + n.y + ' H' + x2 + '"/>';
  }
  let nodes = '';
  for (const n of byId.values()) {
    const off = n.status === 'left';
    const cls = 'ln-node' + (off ? ' off' : '') + (lineageSel === n.id ? ' sel' : '') +
      (anc != null && inChain(n.id) && lineageSel !== n.id ? ' anc' : '') +
      (anc != null && !inChain(n.id) ? ' dim2' : '') +
      (hits != null && hits.has(n.id) ? ' hit' : '');
    const sub = n.disciples > 0 ? n.disciples + ' 徒'
      : (off ? '已离团' : '第 ' + ((n.generation != null ? n.generation : n.depth) + 1) + ' 代');
    let st = '';
    if (n.depth === 0 && n.th) st = 'fill:' + n.th.bg + ';stroke:' + n.th.bd + ';stroke-width:1.5;';
    else if (n.depth === 1 && n.th) st = 'stroke:' + n.th.bd + ';';
    if (hits != null && hits.has(n.id)) st += 'stroke:#f79009;stroke-width:2;';
    const nameSt = n.depth <= 1 && n.th && !off ? ' style="fill:' + n.th.tc + '"' : '';
    nodes += '<g class="' + cls + '" data-id="' + n.id + '" transform="translate(' + n.x + ',' + n.y + ')">' +
      '<rect x="-44" y="-25" width="88" height="50" rx="11"' + (st ? ' style="' + st + '"' : '') + '/>' +
      '<text class="ln-name" y="-3"' + nameSt + '>' + esc(n.name) + '</text>' +
      '<text class="ln-sub" y="15">' + esc(sub) + '</text>' +
      '</g>';
  }
  $('view').innerHTML =
    '<div class="section tab-content-enter">' +
    '<div class="st-ln-tools">' +
      '<div class="st-ln-search">' +
        '<span class="material-symbols-outlined" style="font-size:18px;color:var(--on-surface-variant)">search</span>' +
        '<input id="lnQ" placeholder="搜索主播或代际..." value="' + esc(q) + '" autocomplete="off">' +
      '</div>' +
      '<button class="st-ln-btn" id="lnFit" title="复位"><span class="material-symbols-outlined">filter_center_focus</span></button>' +
      '<button class="st-ln-btn" id="lnPng" title="导出图片">' + LN_PNG_ICON + '</button>' +
    '</div>' +
    '<div class="st-ln-stat">' +
      '<div class="st-ln-stat-h"><div class="l">' +
        '<span class="material-symbols-outlined">hub</span>代际脉络概览</div>' +
        '<span class="r">' + (new Date().getFullYear()) + ' 年度动态</span></div>' +
      '<div class="st-ln-stat-g">' +
        '<div><div class="k">' + total + '</div><div class="v">公会在册</div></div>' +
        '<div><div class="k">' + branches + '</div><div class="v">代际分支</div></div>' +
        '<div><div class="k">' + gens + '</div><div class="v">传承代际</div></div>' +
        '<div><div class="k hl">' + (waveSum >= 10000 ? Math.round(waveSum / 10000) : waveSum) +
          (waveSum >= 10000 ? '<span style="font-size:11px;font-weight:400">万</span>' : '') +
          '</div><div class="v">累计音浪</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="st-branch">' + branchCards + '</div>' +
    '<div class="lineage-wrap" id="lnWrap">' +
    '<div class="ln-hint"><span class="tip">完整师门链 · 拖动查看 · 点人看传承路径</span>' +
    '<span class="qinfo" id="lnQInfo"' + (q ? '' : ' style="display:none"') + '></span></div>' +
    '<div class="ln-ctl">' +
    '<button id="lnZin" title="放大">+</button>' +
    '<button id="lnZout" title="缩小">−</button>' +
    '<button id="lnFull" title="全屏"></button>' +
    '</div>' +
    '<svg><g id="lnVp" transform="translate(0,0) scale(1)">' + edges + nodes + '</g></svg>' +
    '</div>' +
    '<div class="st-ln-tip">' +
      '<span class="material-symbols-outlined">verified_user</span>' +
      '<div><div class="t">代际发展激励规范</div>' +
      '<div class="d">一代导师享有点对点指导津贴；签约主播月流水达标后自动晋级并获得独立指导资格。</div></div>' +
    '</div>' +
    '</div>';
  bindLineage(t, keepView);
  $('view').querySelectorAll('.st-branch-card [data-toggle]').forEach(b => {
    b.onclick = () => {
      const box = document.getElementById(b.dataset.toggle);
      if (!box) return;
      const hidden = box.classList.toggle('hidden');
      b.querySelector('.material-symbols-outlined').textContent = hidden ? 'expand_more' : 'expand_less';
    };
  });
}

function bindLineage(t, keepView) {
  const wrap = $('lnWrap');
  const fit = () => {
    // 横向树：祖师贴左边、纵向居中到最大师门（一代向右一列）
    const w = wrap.clientWidth || 360;
    const h = wrap.clientHeight || 400;
    const root = t.roots[0];
    lnView.s = Math.max(0.55, Math.min(0.95, (w - 24) / 460));
    lnView.x = 16;
    lnView.y = h / 2 - root.y * lnView.s;
    lnApply();
  };
  $('lnFit').onclick = fit;
  $('lnZin').onclick = () => lnZoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, 1.25);
  $('lnZout').onclick = () => lnZoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, 0.8);
  $('lnFull').onclick = lnToggleFs;
  $('lnPng').onclick = lnExportPng;
  /* 双击画布 = 全屏切换（拖动/点人不受影响：双击才触发） */
  wrap.addEventListener('dblclick', (e) => {
    if (e.target.closest && e.target.closest('.ln-ctl, .ln-hint')) return;
    lnToggleFs();
  });
  if (lnFsCss) wrap.classList.add('ln-fs');   // 全屏中切视图/重渲染，状态不丢
  lnSyncFsIcon();
  const qInput = $('lnQ');
  qInput.oninput = () => { lineageQ = qInput.value; lnHitIdx = 0; lineageUpdateHits(); };
  qInput.onkeydown = (e) => {
    if (e.key !== 'Enter') return;
    const ids = lineageHitIds();
    if (!ids.length) return;
    lnHitIdx = (lnHitIdx + 1) % ids.length;
    lineageUpdateHits();
  };
  const pts = new Map();
  let pinchD = 0, moved = 0, onCtl = false;
  /* 手势坐标 → 画布内坐标的换算 */
  const rel = (cx, cy) => {
    const r = wrap.getBoundingClientRect();
    return [cx - r.left, cy - r.top];
  };
  wrap.addEventListener('pointerdown', (e) => {
    /* 控件（缩放/全屏/搜索框）交给原生 click：一旦抢了指针或重建 DOM，
       按钮的 click 就不触发了（真实点击踩过，合成 .click() 测不出来） */
    if (e.target.closest && e.target.closest('.ln-ctl, .ln-hint')) { onCtl = true; return; }
    wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) moved = 0;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      moved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
      lnView.x += e.clientX - prev.x;
      lnView.y += e.clientY - prev.y;
      lnApply();
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD > 0) {
        const [px, py] = rel((a.x + b.x) / 2, (a.y + b.y) / 2);
        lnZoomAt(px, py, d / pinchD);
      }
      pinchD = d;
    }
  });
  const up = (e) => {
    if (onCtl) { onCtl = false; return; }
    const wasTap = pts.size === 1 && moved < 6;
    pts.delete(e.pointerId);
    pinchD = 0;
    if (wasTap) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('.ln-node') : null;
      const id = g ? +g.dataset.id : null;
      lineageSel = id != null && lineageSel !== id ? id : null;
      renderLineage(true);
    }
  };
  wrap.addEventListener('pointerup', up);
  wrap.addEventListener('pointercancel', (e) => { onCtl = false; pts.delete(e.pointerId); pinchD = 0; });
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const [px, py] = rel(e.clientX, e.clientY);
    lnZoomAt(px, py, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });
  if (keepView) lnApply(); else fit();
}

function groupHtml(d, page, list) {
  const showWave = !d.display || d.display.wave !== false;
  const showGroups = !d.display || d.display.groups !== false;
  const groups = d.groups || [];
  const sched = d.schedule || {};
  const nPlayers = d.counts ? d.counts.players : groups.reduce((s, g) => s + (g.count || 0), 0);
  const nGroups = d.counts ? d.counts.groups : groups.length;
  const day = (d.dates && d.dates[0]) || String(d.createdAt || '').slice(0, 10);
  const meta = [
    d.eventType || '',
    '共 ' + nPlayers + ' 人',
    sched.start ? sched.start + ' 后 / 间隔 ' + (sched.intervalMin || 15) + ' 分' : '',
  ].filter(Boolean).join(' · ');

  /* 顶部：赛事维度 segmented（复用 #subnav 的真实按钮文案/状态） */
  const tabs = [...document.querySelectorAll('#subnav button:not([disabled])')].map(b =>
    '<button data-g="' + b.dataset.g + '"' + (b.dataset.g === curGroup ? ' class="on"' : '') +
    '>' + esc(b.textContent) + '</button>').join('');

  let html = '<div class="section tab-content-enter">';
  if (d.stale) html += '<div class="stale">分组用的是快照数据，可能不是最新</div>';
  html += '<div class="st-group-tabs">' + tabs + '</div>';

  /* 场次信息卡 + 组别胶囊 */
  html +=
    '<div class="st-my-big" style="margin-top:0">' +
      '<div class="lbl"><span>' + esc(page.label) + (day ? ' · ' + esc(day) : '') + '</span>' +
      '<span class="chip">' + nGroups + '组 · ' + nPlayers + '人</span></div>' +
      '<div style="margin-top:.375rem;font-size:18px;font-weight:600;color:var(--on-surface)">' +
        esc(d.title || page.label) + '</div>' +
      (meta ? '<div style="margin-top:.25rem;font-size:12px;color:var(--on-surface-variant)">' +
        esc(meta) + '</div>' : '') +
    '</div>' +
    '<div class="st-group-chips">' + groups.map((g, i) =>
      '<button class="st-group-chip' + (i === 0 ? ' on' : '') + '" data-scroll="gcard-' + i + '">' +
        '<span class="n"></span><span>' + esc(g.name) + '</span>' +
        '<span class="c">' + (g.count || (g.players || []).length) + '人</span>' +
      '</button>').join('') + '</div>';

  if (!showGroups) {
    return html + '<div class="empty">名单尚未开放<br>开赛时间如上</div></div>';
  }
  if (!groups.length) {
    return html + '<div class="empty"><span class="big">📺</span>暂无分组数据</div></div>';
  }

  /* 分组卡：横向滑动 + snap；成员白卡列表（序号 / 首字头像 / 姓名） */
  html += '<div class="st-group-cards" id="stGroupCards">' + groups.map((g, gi) => {
    const mems = (g.players || []).map((p, pi) =>

        '<span class="st-gmem-rk">' + String(pi + 1).padStart(2, '0') + '</span>' +
        '<div class="st-gmem-av">' + esc(String(p.name || '?').charAt(0)) + '</div>' +
        '<span class="st-gmem-nm">' + esc(p.name) + (p.leader ? ' · ' + esc(p.leader) : '') + '</span>' +
      '</div>').join('');
    return '<section class="st-gcard" id="gcard-' + gi + '">' +
      '<div class="st-gcard-head"><div class="l">' +
        '<span class="bar' + (gi % 2 ? ' alt' : '') + '"></span>' +
        '<h2>' + esc(g.name) + '</h2></div>' +
        '<span class="cnt">' + (g.count || (g.players || []).length) + (g.slot ? '人满员' : '人') +
        (g.slot ? ' · ' + esc(g.slot) + ' 开赛' : '') + '</span></div>' +
      '<div class="st-gcard-body">' + (mems || '<div class="empty" style="padding:18px">空组</div>') + '</div>' +
    '</section>';
  }).join('') + '</div>';

  html += '<div class="gx-foot" style="text-align:center;color:var(--on-surface-variant);font-size:11px;margin-top:.25rem">' +
    esc((d.title || 'PK 分组') + (d.eventType ? ' · ' + d.eventType : '') + ' | ' + todayStr()) + '</div>';

  if (list.length > 1) {
    html += '<div class="st-my-list" style="margin-top:1rem"><div class="sec">切换已上架方案</div>' +
      list.map(p => '<button class="st-my-item" data-pid="' + p.id + '" style="width:100%;border:none;background:none;cursor:pointer">' +
        '<div class="l"><div class="ico"><span class="material-symbols-outlined">playlist_play</span></div>' +
        '<div class="t">' + esc(p.title || ('方案 ' + p.id)) + '</div></div>' +
        '<div class="r"><span class="pri">' + (p.id === planByType[curGroup] ? '当前' : '切换') + '</span>' +
        '<span class="material-symbols-outlined">chevron_right</span></div></button>').join('') + '</div>';
    setTimeout(() => document.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => {
      planByType[curGroup] = Number(b.dataset.pid); loadGroup();
    }), 0);
  }
  return html + '</div>';
}

/* ==================== 我的（手机号+密码登录 / 自助注册） ==================== */
/* 账号来源：管理员后台手动添加，或登录门「注册」（手机号=账号、短信验证码=密码）。
   注册出来的账号要先绑定主播，才有个人的音浪数据。
   token 存 sessionStorage，关闭浏览器后需重新登录；服务重启或失效自动退回登录卡。 */
const MY_ANY_KEY = 'myToken_any';
const MY_ANY_NAME = 'myName_any';
const MY_KEY = () => MY_ANY_KEY;
const MY_NAME_KEY = () => MY_ANY_NAME;

/* 登录态存放位：统一入口存 MY_ANY_KEY；旧团别 key 只做兼容读取 */
function myTokenKeys() {
  return [MY_ANY_KEY, 'myToken_male', 'myToken_female'];
}
const myTeamOfKey = (k) =>
  (k === 'myToken_male' ? 'male' : k === 'myToken_female' ? 'female' : '');
function readMyToken(key) {
  const token = sessionStorage.getItem(key);
  if (token) return token;
  const legacyToken = localStorage.getItem(key);   // 老版本存 localStorage：读到就搬进 sessionStorage
  if (legacyToken) {
    sessionStorage.setItem(key, legacyToken);
    localStorage.removeItem(key);
  }
  return legacyToken || '';
}

/** 当前登录态：{ token, team }（team 空串 = 团别待定，两团都能看；没登录则 token 为空） */
function mySession() {
  for (const key of myTokenKeys()) {
    const token = readMyToken(key);
    if (token) return { token: token, team: myTeamOfKey(key) };
  }
  return { token: '', team: '' };
}
function myToken() { return mySession().token; }
function myLogout() {
  ['myToken_male', 'myToken_female', MY_ANY_KEY].forEach((k) => {
    sessionStorage.removeItem(k);
    localStorage.removeItem(k);
  });
  localStorage.removeItem(MY_NAME_KEY());
  localStorage.removeItem(MY_ANY_NAME);
}

async function loadMy() {
  const t = myToken();
  if (!t) { sessionExpired(); return; }
  $('mhSub').textContent = 'MY';
  try {
    /* 手机号注册了但还没绑主播：这里只有一张绑定卡（绑定后才有个人的音浪数据） */
    const who = await api('/api/public/teams/' + TEAM + '/my/who?token=' + encodeURIComponent(t));
    if (who && who.needBind) { applyLoginState(who); renderBindCard(who); return; }
    const d = await api('/api/public/teams/' + TEAM + '/my?token=' + encodeURIComponent(t));
    let series = null;
    try {
      series = await api('/api/public/teams/' + TEAM + '/my/series?token=' + encodeURIComponent(t) + '&days=14');
    } catch (_) { /* 趋势图失败不挡主数据 */ }
    let claim = null, bound = [];
    try {
      const c = await api('/api/public/teams/' + TEAM + '/my/claim?token=' + encodeURIComponent(t));
      claim = c.claim; bound = c.bound || [];
    } catch (_) { /* 绑定状态失败不挡主数据 */ }
    let push = null;
    try {
      push = await api('/api/public/teams/' + TEAM + '/my/push?token=' + encodeURIComponent(t));
    } catch (_) { /* 推送状态失败不挡主数据 */ }
    renderMy(d, series, claim, bound, push);
  } catch (e) {
    /* token 过期/没验证过 → 回登录门；其它错误照常显示错误态 */
    const m = String(e.message || '');
    if (m.indexOf('过期') >= 0 || m.indexOf('缺少') >= 0 || m.indexOf('请先登录') >= 0) {
      sessionExpired();
    } else {
      $('view').innerHTML = '<div class="empty"><span class="big">📵</span>取不到个人数据<br>' + esc(m) + '</div>';
    }
  }
}

/* ==================== 绑定主播（注册后一次性；用户自己不能解绑） ====================
   用户口径（2026-10-10）：注册出来只有手机号，登录后提醒绑定主播姓名；绑定后
   不支持（自行）解绑，改绑只能走管理员。 */
let bindTimer = null;

function renderBindCard(who) {
  $('view').innerHTML = '<div class="section">' +
    '<div class="card my-bind">' +
      '<h2 class="card-t">绑定主播姓名</h2>' +
      '<div class="sub">账号已绑定手机号 <b>' + esc(maskPhone(who.phone || who.name || '')) +
        '</b>，还没有对应主播。<br>绑定后「我的」数据、水印、榜单名次都按这位主播算。</div>' +
      '<div class="warn">绑定之后不能自行解绑或换绑；名字填错了请联系管理员改绑。</div>' +
      '<input id="bindQ" placeholder="输入你的主播姓名（艺名）" autocomplete="off">' +
      '<div id="bindHits"></div>' +
      '<div class="form-err hidden" id="bindErr"></div>' +
    '</div>' +
    '<button class="my-logout" id="myOut">退出登录</button></div>';
  $('myOut').onclick = () => { myLogout(); removeWatermark(); location.reload(); };
  $('bindQ').oninput = () => { clearTimeout(bindTimer); bindTimer = setTimeout(searchBind, 280); };
  $('bindQ').onkeydown = (e) => { if (e.key === 'Enter') { clearTimeout(bindTimer); searchBind(); } };
  setTimeout(() => { const el = $('bindQ'); if (el) el.focus(); }, 60);
}

async function searchBind() {
  const box = $('bindHits');
  const key = ($('bindQ').value || '').trim();
  const errEl = $('bindErr');
  errEl.classList.add('hidden');
  if (!key) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="none">搜索中…</div>';
  try {
    const d = await fetch('/api/public/my/bind/search?token=' + encodeURIComponent(myToken()) +
      '&q=' + encodeURIComponent(key)).then((r) => r.json());
    if (d.error) throw new Error(d.error);
    const items = d.items || [];
    if (!items.length) {
      box.innerHTML = '<div class="none">没有找到这个名字，换个写法试试（可以只打一个字）</div>';
      return;
    }
    box.innerHTML = items.map((it) =>
      '<div class="hit"><div>' + esc(it.name) +
      '<span class="tag">' + (it.team === 'male' ? '男团' : it.team === 'female' ? '女团' : '') + '</span></div>' +
      '<button data-pid="' + esc(it.personId) + '" data-name="' + esc(it.name) + '">绑定</button></div>').join('');
    box.querySelectorAll('button[data-pid]').forEach((b) => {
      b.onclick = () => doBind(b.dataset.pid, b.dataset.name);
    });
  } catch (e) {
    box.innerHTML = '';
    errEl.textContent = e.message || '搜索失败，稍后再试';
    errEl.classList.remove('hidden');
  }
}

async function doBind(personId, name) {
  if (!confirm('确认绑定到「' + name + '」吗？\n绑定之后不能自行解绑或换绑，填错了需要联系管理员。')) return;
  const errEl = $('bindErr');
  errEl.classList.add('hidden');
  try {
    const r = await fetch('/api/public/my/bind', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: myToken(), personId: Number(personId) }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    if (!d.ok) throw new Error('绑定失败，稍后再试');
    /* 绑定成功后换发的 token 带主播所在团：改存到团别那一档，清掉团别待定那档 */
    sessionStorage.setItem(MY_ANY_KEY, d.token);
    localStorage.setItem(MY_ANY_NAME, d.name || name);
    /* 绑定成功后保留登录时的手机号（水印还用它） */
    applyLoginState({ name: d.name, phone: (meState && meState.phone) || '', personId: d.personId, bound: true, needBind: false });
    toast('已绑定主播：' + (d.name || name));
    loadMy();
  } catch (e) {
    errEl.textContent = e.message || '绑定失败，稍后再试';
    errEl.classList.remove('hidden');
  }
}

function renderMyLogin() {
  /* 全站有登录门后这里只是兜底（正常到不了）；文案保持与登录门一致 */
  const name = localStorage.getItem(MY_NAME_KEY()) || '';
  $('mhSub').textContent = 'MY';
  $('view').innerHTML = '<div class="section my-login">' +
    '<div class="card card-pad">' +
    '<div class="big-av" style="background:' + avColor(LABEL()) + '">' + esc(LABEL().charAt(0)) + '</div>' +
    '<h3>' + esc(LABEL()) + ' · 我的数据</h3>' +
    '<p class="tip">账号由管理员添加，或回登录门用手机号注册<br>手机号或姓名 + 密码登录</p>' +
    '<input id="myName" placeholder="手机号 / 姓名" value="' + esc(name) + '" autocomplete="off">' +
    '<input id="myPass" placeholder="密码" inputmode="numeric" autocomplete="off">' +
    '<div class="form-err hidden" id="myErr"></div>' +
    '<button class="btn-main" id="myGo">查看我的数据</button>' +
    '</div></div>';
  const go = async () => {
    const nm = $('myName').value.trim(), pw = $('myPass').value.trim();
    const errEl = $('myErr');
    if (!nm || !pw) {
      errEl.textContent = '请输入账号和密码';
      errEl.classList.remove('hidden');
      return;
    }
    const btn = $('myGo');
    btn.disabled = true; btn.textContent = '验证中…';
    errEl.classList.add('hidden');
    try {
      const r = await fetch('/api/public/my/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account: nm, pass: pw }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      if (!d.ok) throw new Error('账号或密码不对，或账号还没开通');
      sessionStorage.setItem(MY_ANY_KEY, d.token);
      localStorage.setItem(MY_NAME_KEY(), d.name || nm);
      toast('验证通过');
      loadMy();
    } catch (e) {
      btn.disabled = false; btn.textContent = '查看我的数据';
      errEl.textContent = e.message || '验证失败，稍后再试';
      errEl.classList.remove('hidden');
    }
  };
  $('myGo').onclick = go;
  $('myName').onkeydown = (e) => { if (e.key === 'Enter') $('myPass').focus(); };
  $('myPass').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

function renderMy(d, series, claim, bound, push) {
  if (d.name) {
    localStorage.setItem(MY_NAME_KEY(), d.name);
    /* 水印口径（2026-10-11）：手机号优先（打码），无手机号回退艺名。
       my 数据接口不带 phone，手机号从登录态 meState 取，避免被艺名覆盖 */
    const wmPhone = meState && meState.phone;
    applyWatermark(wmPhone ? maskPhone(wmPhone) : d.name);

  pushState = push || null;
  const minText = (v) => v == null ? '' : '时长 ' + (v >= 60
    ? Math.floor(v / 60) + '小时' + (v % 60 ? (v % 60) + '分' : '')

  const stat = (label, o, prevLabel) => '<div class="my-stat"><div class="l">' + label + '</div>' +

    (o.wave == null || o.prevWave == null ? '' :

  /* 近 14 个业务日趋势：条形图，未播（<3）置灰 */

  const m = d.monthly || {};

  const monthlyYuan = m.yuan == null ? (m.wave == null ? '—' : yuan(m.wave / 10)) : yuan(m.yuan);

  const big = '<div class="st-my-big">' +
    '<div class="lbl"><span>本月累计个人音浪</span>' +

      (pct >= 0 ? 'trending_up' : 'trending_down') + '</span>' +
      (pct >= 0 ? '+' : '') + pct + '% 环比</span>') + '</div>' +
    '<div class="num">' + monthlyWave + '</div>' +
    '<div class="row"><span>预估折合收益</span><span class="rmb">' + monthlyYuan + '</span></div>' +
    '<div class="st-my-rank">' +
      '<div class="l1"><span class="a"><span class="material-symbols-outlined">military_tech</span>' +
      (d.teamRank > 0 ? '战队排名：第 ' + d.teamRank + ' 名' : '暂无战队排名') + '</span>' +

      '<div class="t">抖音号绑定与审计</div></div>' +

      '<span class="material-symbols-outlined">chevron_right</span></div></div>' +

      '<div class="t">隐私与对外展示字段</div></div>' +

      '<div class="t">关于系统与内部版本</div></div>' +

/* ==================== 绑定抖音号（提交 + 截图 → 管理端审计） ==================== */
function claimCard(claim, bound) {
  let status = '';
  /* Stitch 外壳：白卡 + 分组列表标题（表单内部逻辑保持） */
  if (claim && claim.status === 'pending') {
    status = '<div class="row"><span class="st wait">审核中</span>' +
      '<span class="sub">' + esc(claim.douyinNo || '') + ' · ' + esc(claim.createdAt || '') + '</span></div>' +
      '<div class="sub" style="margin-top:6px">管理员通过后，你的音浪会自动记到这个抖音号上</div>';
  } else if (claim && claim.status === 'rejected') {
    status = '<div class="row"><span class="st bad">未通过</span>' +
      '<span class="sub">' + esc(claim.douyinNo || '') + '</span></div>' +
      (claim.rejectReason ? '<div class="why">管理员：' + esc(claim.rejectReason) + '</div>' : '');
  }
  const boundRows = (bound || []).map((b) =>
    '<div class="row"><span class="st ok">✓</span>' +
    '<span>' + esc(b.douyinNo) + '</span>' +
    (b.primary ? '<span class="sub">主号</span>' : '') + '</div>').join('');
  const form = (claim && claim.status === 'pending')
    ? ''
    : '<input id="clNo" placeholder="你的抖音号（字母/数字/下划线/点）" autocomplete="off">' +
      '<div class="pick"><img id="clPrev" class="shot" alt="">' +
      '<button class="pickbtn" id="clPick">选择抖音主页截图\n（截图里要能看到抖音号）</button></div>' +
      '<input type="file" id="clFile" accept="image/*" hidden>' +
      '<div class="form-err hidden" id="clErr" style="color:#D92D20;font-size:12px;margin-top:6px;text-align:left"></div>' +
      '<button class="go" id="clGo">提交绑定申请</button>';

/* 压缩截图：最长边 1280、JPEG 0.82，一般 100~300KB，审计够看 */
function compressShot(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('读图失败'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片读不出来，换一张试试'));
      img.onload = () => {
        const max = 1280;
        const ratio = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * ratio);
        cv.height = Math.round(img.height * ratio);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** 推送设置的写接口（统一带 token 与错误处理） */
async function postPush(path, extra) {
  const r = await fetch('/api/public/teams/' + TEAM + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ token: myToken() }, extra)),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

function bindPushBox(p) {
  const btn = $('pushScanStart');
  if (btn) btn.onclick = () => startPushScan();
  // 已扫码但还没激活：轮询一下状态，用户发完消息后自动刷新
  if (p && p.needActivate) {
    clearTimeout(pushSrTimer);
    pushSrTimer = setTimeout(() => refreshPush(), 5000);
  }
  if (p && p.bound) bindPushBoundHandlers(p);
}

/** 获取扫码二维码并轮询扫码状态（confirmed 后等服务端长轮询拿到首次消息） */
async function startPushScan() {
  const btn = $('pushScanStart');
  const box = $('pushScanBox');
  if (!btn || !box) return;
  btn.disabled = true;
  btn.textContent = '获取中…';
  box.innerHTML = '';
  try {
    const r = await fetch('/api/public/teams/' + TEAM + '/my/push/wechat/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: myToken() }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    let h = '';
    if (d.imgContent) {
      const src = String(d.imgContent).startsWith('data:')
        ? d.imgContent : 'data:image/png;base64,' + d.imgContent;
      h += '<img class="qrcode" alt="微信推送绑定二维码" src="' + esc(src) + '">';
    } else if (d.url) {
      h += '<a class="reg-link" href="' + esc(d.url) + '" target="_blank" rel="noopener">打开二维码链接</a>';
    }
    h += '<div class="reg-state wait" id="pushScanState">等待扫码…</div>' +
      '<div id="pushScanVerify" class="hidden" style="margin-top:8px">' +
      '<input id="pushScanCode" placeholder="微信里显示的验证码" inputmode="numeric" autocomplete="off">' +
      '<button class="go gray" id="pushScanCodeGo">提交验证码</button></div>';
    box.innerHTML = h;
    btn.disabled = false;
    btn.textContent = '重新获取';
    startPushScanPoll(d.qrcode);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '获取二维码';
    box.innerHTML = '<div class="form-err">' + esc(e.message || '获取失败，稍后再试') + '</div>';
  }
}

function startPushScanPoll(qrcode) {
  clearTimeout(pushScanTimer);
  pushScanTimer = null;
  let verifyCode = '';
  let stopped = false;
  const submit = $('pushScanCodeGo');
  if (submit) {
    submit.onclick = () => {
      verifyCode = ($('pushScanCode') || {}).value || '';
      submit.disabled = true;
      submit.textContent = '提交中…';
    };
  }
  const stop = () => { stopped = true; clearTimeout(pushScanTimer); pushScanTimer = null; };
  const tick = async () => {
    if (stopped) return;
    try {
      const r = await fetch('/api/public/teams/' + TEAM + '/my/push/wechat/poll', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: myToken(), qrcode: qrcode, verifyCode: verifyCode }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      const st = String(d.status || '');
      const el = $('pushScanState');
      if (st === 'confirmed') {
        stop();
        toast('扫码成功，请在微信里给机器人发一条消息激活推送');
        refreshPush();
        return;
      } else if (st === 'need_verifycode') {
        show('pushScanVerify', true);
        if (el) el.textContent = '需要验证码：请在微信里查看并填入';
      } else if (st === 'scaned') {
        if (el) el.textContent = '已扫码，等待确认…';
      } else if (st === 'expired') {
        stop();
        if (el) el.textContent = '二维码已过期，请重新获取';
        return;
      } else if (st === 'verify_code_blocked') {
        stop();
        if (el) el.textContent = '验证失败次数过多，请重新获取二维码';
        return;
      } else if (st === 'scaned_but_redirect' || st === 'binded_redirect') {
        if (el) el.textContent = '已扫码，等待确认…';
      } else {
        if (el) el.textContent = '等待扫码…';
      }
    } catch (e) {
      const el = $('pushScanState');
      if (el) el.textContent = e.message || '检测失败，重试中…';
    }
    if (!stopped) pushScanTimer = setTimeout(tick, 3000);
  };
  tick();
}

/* ==================== 视图切换 ==================== */
/* 顶部导航 sticky 后，工具条吸顶位置要跟头部实际高度走（分组页多一条子导航） */
function syncHeaderOffset() {
  const h = document.querySelector('.masthead')?.offsetHeight || 0;
  if (h) document.documentElement.style.setProperty('--mh-h', h + 'px');
}
window.addEventListener('resize', syncHeaderOffset);

function switchView(v, opts) {
  opts = opts || {};
  /* 后台关掉的页面不许进（popstate / 深链兜底）：改道到还开着的第一个页 */
  const s = (site && site.settings) || {};
  if (v === 'data' && s.dataEnabled === false) v = 'group';
  if (v === 'group') {
    const sub = [...document.querySelectorAll('#subnav button')].find(b => !b.disabled);
    if (s.groupEnabled === false || !sub) v = 'lineage';
    else if (!sub.classList.contains('on')) curGroup = sub.dataset.g;
  }
  if (v === 'lineage' && (s.lineageEnabled === false || TEAM === 'female')) v = 'data';
  if (v === 'my' && s.loginRequired === false) v = 'data';
  view = v;
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('#subnav button').forEach(b => b.classList.toggle('on', b.dataset.g === curGroup));
  show('toolbar', v === 'data');
  show('subnav', v === 'group');
  show('foot', v !== 'lineage');
  syncHeaderOffset();
  $('view').innerHTML = '';
  if (opts.push !== false) pushRoute(opts.replace === true);
  go();
}

  period = p;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  show('dates', p === 'daily');
  show('stepper', p !== 'daily');
  show('btnCal', p === 'daily');   // 日历只属于「每日」口径
  if (p === 'daily') calHide();    // 月/年切换时把开着的日历收掉
  curPeriod = snapPeriod(p, nowPeriod(p));   // 只落有数据的周期
  syncStepper();
  go();
}

async function go() {
  show('err', false);
  /* 立刻给反馈：小菊花 + 内容压暗（数据没到不清空，到了再换）。
     乐观骨架只在内容为空时上，避免已看内容被闪没。 */
  const seq = ++loadSeq;
  busyOn();
  const optimistic = () => {
    if (view === 'data' && !listAll.length) $('view').innerHTML = '<div class="section">' + shimmerList() + '</div>';
  };
  optimistic();
  try {
  if (view === 'data') await loadData();
  else if (view === 'lineage') await loadLineage();
  else if (view === 'my') await loadMy();
  else await loadGroup();
    if (seq !== loadSeq) return;          // 期间用户又点了别的：过期响应作废
    consecutiveFail = 0;
    show('stale', false);
  } catch (e) {
    if (seq !== loadSeq) return;          // 过期失败的报错也不许盖住新内容
    consecutiveFail++;
    if (consecutiveFail >= 2) show('stale', true);
    $('mhSub').textContent = 'NETWORK';
    $('view').innerHTML = '<div class="empty"><span class="big">📶</span>暂时取不到数据<br>' +
      esc(e.message) + '</div>';
  } finally {
    if (seq === loadSeq) busyOff();
  }
}

/* ==================== 静默刷新 ==================== */
/* 每分钟后台刷新，客户端加 ±10s 抖动：不加抖动的话所有人整点一起请求，服务端会尖峰 */
function scheduleRefresh() {
  clearTimeout(timer);
  const jitter = 60000 + (Math.random() * 20000 - 10000);
  timer = setTimeout(() => {
    /* lineage / my 不参与静默刷新：lineage 重建画布会丢缩放位置；
       my 是个人数据页，低频变化，且重建会打断用户正在输入的表单 */
    Promise.resolve(view === 'data' ? loadData()
      : (view === 'lineage' || view === 'my') ? null : loadGroup())
      .then(() => { consecutiveFail = 0; show('stale', false); })
      .catch(() => { consecutiveFail++; if (consecutiveFail >= 2) show('stale', true); })
      .finally(scheduleRefresh);
  }, jitter);
}

/* ==================== 导航显隐 ==================== */
/* 页面级显隐（2026-10-10）：每日报告 / 分组 / 族谱 / 分组子页都由后台开关控制，
   关掉的导航整体消失（接口也不下发，不是前端藏）；族谱仍是男团专属。
   分组子导航按赛事类型逐个显隐；全部子页都关时「分组」主导航也藏起来。 */
function syncNav() {
  const s = (site && site.settings) || {};
  const dataOn = s.dataEnabled !== false;
  const groupOn = s.groupEnabled !== false;
  // 族谱是男团专属页：女团视角不显示（2026-10-11）
  const linOn = s.lineageEnabled !== false && TEAM !== 'female';
  /* 子导航：把后台关掉的赛事类型按钮摘掉 */
  const gt = s.groupTypes || {};
  document.querySelectorAll('#subnav button').forEach(b => {
    const page = GROUP_PAGES.find(p => p.key === b.dataset.g);
    const on = groupOn && (!page || gt[page.type] !== false);
    b.disabled = !on;
    show(b, on);
  });
  /* 分组子页全关 → 分组主导航也没了 */
  const anySub = [...document.querySelectorAll('#subnav button')].some(b => !b.disabled);
  show('navGroup', groupOn && anySub);
  show('navData', dataOn);
  show('navLineage', linOn);
  show('navMy', s.loginRequired !== false);   // 关登录 = 全面开放，没有「我的」页
}

/* ==================== 启动（统一展示端） ====================
   2026-10-11 修复：首页不再弹「男团 / 女团」选择卡，也不根据登录账号所属团
   跳转；统一直接进 /api/public/teams/all 的全量展示。 */
async function siteIsOpen() {
  try {
    const r = await fetch('/api/public/teams/all');
    return r.ok;
  } catch (_) { return false; }
}

/* 团别选择卡（关闭登录门时）：打开展示页先选「男团 / 女团」 */
function pickTeam() {
  return new Promise((resolve) => {
    const g = $('gate');
    g.classList.remove('hidden');
    g.innerHTML = '<div class="gate-box team-pick">' +
      '<div class="pick-title">选择要查看的团</div>' +
      '<div class="pick-row">' +
        '<button class="pick-btn" id="pickMale"><span class="pick-av" style="background:#4f46e5">男</span>男团</button>' +
        '<button class="pick-btn" id="pickFemale"><span class="pick-av" style="background:#db2777">女</span>女团</button>' +
      '</div></div>';
    const done = (t) => { g.classList.add('hidden'); g.innerHTML = ''; resolve(t); };
    $('pickMale').onclick = () => done('male');
    $('pickFemale').onclick = () => done('female');
  });
}

function applyTeam() {
  $('mhTitle').textContent = LABEL() + '数据榜';
  document.title = LABEL() + '每日报告';
  const linBtn = document.getElementById('navLineage');
  // 族谱是男团专属页：女团视角隐藏入口
  if (linBtn) linBtn.style.display = TEAM === 'female' ? 'none' : '';
}

/* 引导弹窗（2026-10-11）：site.announcement 开启时弹多步骤引导，逐步「下一步」；
   点「完成 / 跳过」后按 version 记住，后台每次保存会让版本前进，前端就再弹一次。 */
function maybeAnnounce() {
  const a = site && site.announcement;
  if (!a || !a.enabled || !(a.steps && a.steps.length)) return;
  const key = 'pk_announce_v';
  try {
    if (localStorage.getItem(key) === String(a.version)) return;
  } catch (_) {}
  const box = $('announce');
  if (!box) return;
  const steps = a.steps;
  let idx = 0;
  const done = () => {
    try { localStorage.setItem(key, String(a.version)); } catch (_) {}
    box.classList.add('hidden');
  };
  const render = () => {
    const s = steps[idx];
    const first = idx === 0;
    const last = idx === steps.length - 1;
    box.innerHTML = '<div class="announce-box">' +
      '<div class="a-ico"><span class="material-symbols-outlined">campaign</span></div>' +
      '<div class="a-dots">' + steps.map((_, i) => '<span' + (i === idx ? ' class="on"' : '') + '></span>').join('') + '</div>' +
      '<h3>' + esc(s.title || ('第 ' + (idx + 1) + ' 步')) + '</h3>' +
      '<div class="a-body">' + esc(s.content || '') + '</div>' +
      '<div class="a-actions">' +
        (first ? '' : '<button class="a-prev" id="announcePrev">上一步</button>') +
        '<button class="a-ok" id="announceNext">' + (last ? '完成' : '下一步') + '</button>' +
      '</div>' +
      '<button class="a-skip" id="announceSkip">跳过引导</button></div>';
    box.classList.remove('hidden');
    $('announceNext').onclick = () => { if (last) done(); else { idx++; render(); } };
    if (!first) $('announcePrev').onclick = () => { idx--; render(); };
    $('announceSkip').onclick = done;
  };
  render();
}

(async function boot() {
  applyTeam();
  if (await siteIsOpen()) { bootRest(); return; }
  const me = await ensureLogin();
  applyLoginState(me);   // 登录后立刻按账号团别设置 TEAM
  bootRest();
})();

async function bootRest() {

  /* 主导航 + 分组子导航 + 前进/后退 */
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => switchView(b.dataset.v));
  document.querySelectorAll('#subnav button').forEach(b =>
    b.onclick = () => { if (!b.disabled) { curGroup = b.dataset.g; switchView('group'); } });
  window.addEventListener('popstate', () => {
    const r = parseRoute();
    if (r.view === 'group' && r.group) curGroup = r.group;
    switchView(r.view, { push: false });
  });
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setPeriod(b.dataset.p));
  $('btnSearch').onclick = () => {
    searchOpen = !searchOpen;
    show('searchBox', searchOpen);
    $('btnSearch').classList.toggle('on', searchOpen);
    if (searchOpen) $('q').focus();
  };
  $('q').oninput = (e) => { q = e.target.value; renderList(); };
  $('qClear').onclick = () => { q = ''; $('q').value = ''; renderList(); };
  $('pPrev').onclick = () => shiftStep(-1);
  $('pNext').onclick = () => shiftStep(1);
  $('btnCal').onclick = calShow;

  function shiftStep(n) {
    if (period === 'monthly') {
      curPeriod = stepPeriod(n);      // 只在有数据的月份之间走
    } else {
      curPeriod = snapPeriod('yearly', String(+curPeriod + n));
    }
    syncStepper();
    go();
  }

  /* 先拿站点配置：登录开关在 settings 里，关登录时根本不用弹登录门。
     401（要登录）→ 弹登录门重试。 */
  const fetchSite = () => api('/api/public/teams/' + TEAM);
  try {
    site = await fetchSite().catch(async (e) => {
      if (String(e.message || '').indexOf('登录') < 0) throw e;
      const me = await ensureLogin();
      applyLoginState(me);
      return fetchSite();
    });
  } catch (e) {
    if (regionBlockedShown) return;   // 已展示地区门禁整页提示，别覆盖成「连不上服务」
    document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="big">📡</span>' +
      '连不上服务，稍后再试试</div>';
    return;
  }
  if (!site.published) {
    document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="big">📺</span>' +
      '<b>' + LABEL() + '数据暂未公布</b><br>请等管理员发布</div>';
    return;
  }

  /* 展示端登录门（2026-10-11）：后台「开启登录」开着 → 先登录再看；
     关掉 → 全面开放，直接展示全量数据（统一入口，不再分男团/女团）。 */
  const loginRequired = (site.settings || {}).loginRequired !== false;
  if (loginRequired) {
    await ensureLogin().then(applyLoginState);
    site = await fetchSite();
  }
  /* 未绑定主播的提醒条：点「去绑定」直接进「我的」绑定卡 */
  $('bindBarGo').onclick = () => switchView('my');
  syncHeaderOffset();

  // 后台级开关：关掉的口径直接从界面消失（后端也不下发）
  const s = site.settings || {};
  const segs = { daily: s.daily !== false, monthly: s.monthly !== false, yearly: s.yearly !== false };
  document.querySelectorAll('#seg button').forEach(b => {
    b.disabled = !segs[b.dataset.p];
    if (!segs[b.dataset.p]) b.textContent = b.textContent + '（已关）';
  });
  if (!segs.daily && segs.monthly) period = 'monthly';
  else if (!segs.daily && segs.yearly) period = 'yearly';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.p === period));

  /* 每日报告页被关掉时首页落到分组（分组也关则落到族谱）；深链指到被关的页也一样改道 */
  const firstOn = (v, fb) => {
    if (v === 'data' && s.dataEnabled === false) return fb;
    if (v === 'group' && (s.groupEnabled === false ||
        !document.querySelector('#subnav button:not([disabled])'))) return fb;
    if (v === 'lineage' && (s.lineageEnabled === false || TEAM === 'female')) return fb;
    if (v === 'my' && s.loginRequired === false) return fb;
    return v;
  };
  const fallbackView = s.groupEnabled !== false &&
    document.querySelector('#subnav button:not([disabled])') ? 'group'
    : (s.dataEnabled !== false ? 'data' : 'lineage');
  view = firstOn(view, fallbackView);

  /* 默认站在昨天：数据每晚 24 点后才补前一天，今天那条一来就想看往往还没有。
     昨天万一还没入库（延迟或停采），退回库里最新那天，别把页面留在空状态。 */
  const dates0 = site.dates || [];
  curDate = dates0.includes(refStr()) ? refStr() : site.latestDate;
  curPeriod = snapPeriod(period, nowPeriod(period));   // 只站有数据的周期
  show('dates', period === 'daily');
  show('stepper', period !== 'daily');
  show('btnCal', period === 'daily');   // 日历只管「按日」口径；月/年走 ‹ › 步进
  $('pNow').textContent = period === 'monthly'
    ? curPeriod.slice(0, 4) + '年' + (+curPeriod.slice(5, 7)) + '月'
    : curPeriod + '年';
  syncStepper();

  await loadPlans();
  syncNav();

  /* 首页 = 每日报告：/st/m 直开时保留路径不跳转；带子路径（/group/xxx、/lineage）时
     按子路径落到对应视图，分享/刷新都不丢。深链指到被后台关掉的页时改道到首页兜底。 */
  const r0 = parseRoute();
  if (r0.view === 'group' && r0.group) curGroup = r0.group;
  view = firstOn(r0.view, fallbackView);
  if (view === 'group' && r0.view === 'group' && r0.group) {
    const sub = document.querySelector('#subnav button[data-g="' + r0.group + '"]');
    if (sub && sub.disabled) curGroup = GROUP_PAGES.find(p => !document
      .querySelector('#subnav button[data-g="' + p.key + '"]').disabled)?.key || curGroup;
  }
  switchView(view, { push: false });
  scheduleRefresh();
  maybeAnnounce();
}

/* 字段面板已随「严格按排行榜版式」移除：显示内容固定，后台级开关仍在后端生效。 */
