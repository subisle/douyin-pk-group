/* ===== spotlight 引导（2026-10-13）：指向具体元素的挖孔高亮 + 卡片贴位 =====
   原理：目标元素临时挂 .guide-spot —— 巨大 box-shadow（0 0 0 9999px）把全屏
   涂暗，只留元素本身「挖亮」；此时 #announce 遮罩切到 ann-spot 模式
   （去掉自己的半透明底色和毛玻璃，否则会把挖孔重新盖住）。
   卡片 position:fixed 按 getBoundingClientRect 贴在目标下/上/侧方，
   ::before 画 14px 小三角指向目标；哪个方向空间都不够就回落居中卡片。 */
#announce.ann-spot { background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; }
#announce.ann-spot .announce-box { position:fixed; z-index:103; }
/* 贴位时关掉入场动画：annCardIn 的 to{transform:none} 会盖掉 at-top 的
   translateY(-100%) 定位（CSS 动画优先级高于 inline style），卡片会闪回目标下方。 */
.announce-box.at-bottom, .announce-box.at-top,
.announce-box.at-left, .announce-box.at-right { animation:none; }
.guide-spot { position:relative; z-index:102 !important;
  border-radius:12px !important;
  box-shadow:0 0 0 4px #fff, 0 0 0 6px var(--primary), 0 0 0 9999px rgba(11,15,23,.55);
  animation:guideSpotPulse 1.8s ease-in-out infinite; }
@keyframes guideSpotPulse {
  0%,100% { box-shadow:0 0 0 4px #fff, 0 0 0 6px var(--primary), 0 0 0 9999px rgba(11,15,23,.55); }
  50%     { box-shadow:0 0 0 5px #fff, 0 0 0 8px var(--primary), 0 0 0 9999px rgba(11,15,23,.62); }
}
/* 贴位卡片：overflow 放开让小三角露出（a-head 渐变自带圆角自己裁） */
.announce-box .a-head { border-radius:28px 28px 0 0; }
.announce-box.at-bottom, .announce-box.at-top,
.announce-box.at-left, .announce-box.at-right { overflow:visible; }
.announce-box.at-bottom::before, .announce-box.at-top::before,
.announce-box.at-left::before, .announce-box.at-right::before {
  content:''; position:absolute; width:14px; height:14px; background:rgba(248,248,250,.96);
  transform:rotate(45deg); z-index:-1; }
.announce-box.at-bottom::before { top:-7px; left:var(--ax, 50%); margin-left:-7px;
  border-left:1px solid rgba(15,23,42,.06); border-top:1px solid rgba(15,23,42,.06); }
.announce-box.at-top::before { bottom:-7px; left:var(--ax, 50%); margin-left:-7px;
  border-right:1px solid rgba(15,23,42,.06); border-bottom:1px solid rgba(15,23,42,.06); }
.announce-box.at-right::before { left:-7px; top:var(--ay, 50%); margin-top:-7px;
  border-right:1px solid rgba(15,23,42,.06); border-bottom:1px solid rgba(15,23,42,.06); }
.announce-box.at-left::before { right:-7px; top:var(--ay, 50%); margin-top:-7px;
  border-left:1px solid rgba(15,23,42,.06); border-top:1px solid rgba(15,23,42,.06); }
@media (prefers-reduced-motion: reduce) {
  .guide-spot { animation:none; }
}

/* ===== 管理员消息弹窗（docs/23 §6.1，msg- 前缀独立类，不复用引导弹窗类名） =====
   视觉对齐引导弹窗：毛玻璃遮罩 + 居中圆角卡 + 品牌渐变头 + 主按钮「知道了」。
   差异点：多消息列表（卡内滚动）、图片按需加载、无步骤条/手势翻页。
   z-index 95：低于引导(100)，高于普通内容 / toast(40) / 家族水印(70)。 */
#msgModal { position:fixed; inset:0; z-index:95; background:rgba(11,15,23,.55);
  display:flex; align-items:center; justify-content:center; padding:20px;
  -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%); }
#msgModal.hidden { display:none; }
@keyframes msgOverlayIn { from { opacity:0; } to { opacity:1; } }
@keyframes msgCardIn {
  from { opacity:0; transform:translateY(24px) scale(.96); }
  60%  { opacity:1; transform:translateY(0) scale(1.005); }

/* ===== 微信扫码绑定（2026-10-12）：二维码卡 + 状态行 + 倒计时 + 刷新动画 =====
   对齐微信「添加朋友 → 扫码」的做法：
   · 二维码固定 208px 白底卡（SVG 原始尺寸不固定，不定尺寸在窄屏必溢出）
   · 四角取景框装饰：明确「扫这里」，比裸图更像扫码页
   · 状态行带彩色圆点 + 文案，三态（等待 / 已扫 / 失败）一眼分清
   · 二维码有效期倒计时（官方约 5 分钟）：剩 30 秒变红，到期自动失效并给「刷新」
   · 刷新时二维码淡出再淡入，不是硬替换 */
.qrcode { display:block; width:208px; height:208px; margin:0 auto;
  background:#fff; border-radius:12px; padding:8px;
  border:1px solid var(--hairline); image-rendering:pixelated; }
.qr-wrap { position:relative; width:208px; margin:0 auto; }
/* 四角取景框 */
.qr-wrap::before, .qr-wrap::after,
.qr-frame > i:first-child, .qr-frame > i:last-child { content:''; position:absolute;
  width:22px; height:22px; border:2.5px solid var(--primary); border-radius:4px; }
.qr-wrap::before { top:-3px; left:-3px; border-right:none; border-bottom:none; }
.qr-wrap::after { top:-3px; right:-3px; border-left:none; border-bottom:none; }
.qr-frame > i:first-child { bottom:-3px; left:-3px; border-right:none; border-top:none; }
.qr-frame > i:last-child { bottom:-3px; right:-3px; border-left:none; border-top:none; }
.qr-frame { position:relative; width:208px; height:208px; margin:0 auto; }
.qr-wrap.qr-refresh .qrcode { animation:annOverlayIn .3s ease both; }
@keyframes qrPulse { 0%,100% { box-shadow:0 0 0 0 rgb(var(--primary-rgb, 37 99 235) / 22%); }
  50% { box-shadow:0 0 0 8px rgb(var(--primary-rgb, 37 99 235) / 0%); } }
.qr-wrap.qr-live { animation:qrPulse 2.2s ease-out infinite; border-radius:12px; }
/* 扫码状态行：圆点 + 文案，等待=琥珀呼吸 / 已扫=绿 / 失败=红 */
.qr-status { display:flex; align-items:center; justify-content:center; gap:7px;
  margin:12px 0 2px; font-size:13px; color:var(--on-surface-variant); }
.qr-status .dot { width:7px; height:7px; border-radius:9999px; background:#b45309; flex:none; }
.qr-status.wait .dot { animation:stPulse 1.4s ease-in-out infinite; }
.qr-status.ok { color:#067647; }
.qr-status.ok .dot { background:#067647; }
.qr-status.bad { color:#b42318; }
.qr-status.bad .dot { background:#b42318; }
.qr-status.scaned { color:#067647; }
.qr-status.scaned .dot { background:#067647; }
.qr-expire { text-align:center; font-size:11px; color:var(--ink3); margin-top:6px; }
.qr-expire.soon { color:#b42318; font-weight:600; }
.qr-steps { display:flex; flex-direction:column; gap:0; margin:12px 0 4px; text-align:left; }
.qr-steps .qr-step { display:flex; gap:10px; align-items:flex-start; padding:5px 0; }
.qr-steps .qr-n { width:18px; height:18px; border-radius:9999px; flex:none;
  background:#EEF2FF; color:var(--primary);
  font-size:11px; font-weight:700; display:grid; place-items:center; margin-top:1px; }
.qr-steps .qr-txt { font-size:12.5px; color:var(--on-surface-variant); line-height:1.6; }
.qrcode { box-sizing:border-box; position:relative; z-index:1; }
.qr-placeholder { position:absolute; inset:0; z-index:0; display:grid; place-items:center;
  width:208px; height:208px; border-radius:12px; background:#fff; color:var(--ink3);
  font-size:13px; line-height:1.5; text-align:center; }
.qr-wrap.qr-live .qr-placeholder { display:none; }
.qr-wrap:not(.qr-live) .qrcode { visibility:hidden; }
.wx-bind-copy { position:relative; z-index:71; margin-top:8px; }
.wx-bind-lead { font-size:15px; font-weight:600; color:var(--on-surface); line-height:1.5; }
.wx-bind-copy p { margin:6px 0 0; font-size:13px; line-height:1.75;
  color:var(--on-surface-variant); text-wrap:pretty; }
.wx-bind-copy .nowrap { white-space:nowrap; }
.wx-bind-note { position:relative; z-index:71; margin-top:9px; padding:8px 10px; border-radius:10px; background:#EAF3FF;
  color:#175CD3; font-size:12.5px; line-height:1.6; }
.wx-bind-qr { position:relative; z-index:71; margin-top:14px; }
.wx-shot-hint { display:table; max-width:100%; margin:0 auto 10px; padding:4px 10px; border-radius:9999px;
  text-align:center; box-sizing:border-box;
  background:#EAF3FF; color:#175CD3; font-size:11.5px; font-weight:600; line-height:1.5; }
.wx-code-fallback { max-width:260px; margin:12px auto 0; text-align:left; }
.wx-code-fallback summary { cursor:pointer; list-style:none; text-align:center;
  font-size:12px; color:var(--on-surface-variant); line-height:1.6; }
.wx-code-fallback summary::-webkit-details-marker { display:none; }
.wx-code-fallback summary::after { content:'›'; display:inline-block; margin-left:4px; transform:rotate(90deg); }
.wx-code-fallback[open] summary::after { transform:rotate(-90deg); }
.wx-code-card { max-width:260px; margin:10px auto 0; padding:12px 14px;
  background:var(--surface-container-low); border:1px solid var(--hairline); border-radius:14px; }
.wx-code-main { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px; }

.wx-code-main button { flex:none; width:auto; height:32px; padding:0 12px; border-radius:9999px; font-size:12px; }
@media (prefers-reduced-motion: reduce) {
  .qr-wrap.qr-live, .qr-status.wait .dot { animation:none; }
}

<script>
/* ==================== 路由与全局状态 ==================== */
/* /1 男团 /0 女团；/st/m、/st/f 为别名。链接即团别，页内不提供切换。
   子路径 history 路由（2026-10-09）：
     /st/m             → 每日报告（首页默认）
     /st/m/report      → 每日报告（别名）
     /st/m/group/<key> → 按赛事类型的分组页
     /st/m/lineage     → 族谱
     /st/m/my          → 我的数据（手机号+密码登录；账号由管理员在后台开通）
   刷新/直接分享子路径链接都能落到正确视图（后端对子路径渲染同一 HTML）。 */
/* 团别（2026-10-11 改）：
   - 开启登录：登录账号的团别决定 TEAM（男团成员只看男团、女团只看女团）；
   - 关闭登录：打开展示页先选「男团 / 女团」，TEAM = 所选团别。
   统一入口 /api/public/teams/all 保留，游客默认 all（还没选团别）。 */
let TEAM = 'all';
const LABEL = () => TEAM === 'female' ? '女团' : TEAM === 'male' ? '男团' : '主播';
const $ = (id) => document.getElementById(id);

/* 分组子页：key 进 URL，type 对应方案 eventType（与后端 EVENT_TYPES 一致），label 是页面标题 */
const GROUP_PAGES = [
  { key: 'junior',       type: '初级争霸赛小组赛', label: '初级争霸赛小组赛' },
  { key: 'mid',          type: '中级争霸赛小组赛', label: '中级争霸赛小组赛' },
  { key: 'final',        type: '月终争霸赛',       label: '月终争霸赛' },
  { key: 'junior-promo', type: '初级争霸赛晋级赛', label: '初级争霸赛晋级赛' },
  { key: 'mid-promo',    type: '中级争霸赛晋级赛', label: '中级争霸赛晋级赛' },
];

let site = null;         // 站点配置（含后台级显隐开关）
let period = 'daily';    // daily | monthly | yearly
let view = 'data';       // data | group | lineage | my
let curGroup = GROUP_PAGES[0].key;  // 分组子页当前 key
/* 「我的」子页（2026-10-13）：bind/push/chase/privacy/about。/my 是列表首页，
   点列表行进子页（下一页式，带返回），路由 /my/<sub> 可直达可分享。 */
let mySub = null;
let curDate = null;      // 每日口径当前日期
let curPeriod = null;    // 月/年口径当前周期
let plans = [];          // 已上架分组方案（各类型独立互斥，每类型最多一场）
let planByType = {};     // 分组子页 key → 正在看的方案 id（同类型多个上架时页内切换用）
let searchOpen = false;
let q = '';
let consecutiveFail = 0;
let timer = null;
let loadSeq = 0;         // 请求序号：RTT≈260ms，快速连点时只认最后一次的结果
let viewAbort = null;    // 当前视图请求的 AbortController：切页/换日期时取消旧请求

/* 请求在途的即时反馈：标题旁小菊花 + 内容轻微压暗。
   在 go() 里开、请求落地后关；静默刷新不经过这里，不打扰正常浏览。 */
function busyOn() { document.body.classList.add('busy'); }
function busyOff() { document.body.classList.remove('busy'); }

/* ==================== URL 路由（history，子路径 = 视图） ==================== */
/** 当前 pathname → 视图描述。识别不了的子路径一律落回每日报告（首页默认数据页）。
    兼容旧链接：/st/m/lineage、/1/report 这类带团别前缀的老路径剥掉前缀照常落视图。 */
function parseRoute() {
  const rest = location.pathname
    .replace(/^\/(?:st\/)?(?:m|f|1|0|all)(?=\/|$)/, '')
    .replace(/^\/+|\/+$/g, '');
  if (rest === '' || rest === 'report') return { view: 'data' };
  if (rest === 'lineage') return { view: 'lineage' };
  if (rest === 'my') return { view: 'my' };
  /* 2026-10-15 task-11：底栏一级入口「微信对接」的短路径别名 /wechat
     （等价 /my/wechat，深链直达不 404、不落回列表；规范路径仍是 /my/wechat）。 */
  if (rest === 'wechat') return { view: 'my', mySub: 'wechat' };
  /* 「我的」子页（2026-10-15 契约 C）：wechat = 「消息设置」；push 为兼容别名，
     旧链接 /my/push 仍打开同一页（不 404、不落回列表）。 */
  const mym = rest.match(/^my\/(push|chase|privacy|about|wechat)$/);
  if (mym) return { view: 'my', mySub: mym[1] === 'push' ? 'wechat' : mym[1] };
  const gm = rest.match(/^group\/([a-z-]+)$/);
  if (gm && GROUP_PAGES.some(p => p.key === gm[1])) return { view: 'group', group: gm[1] };
  return { view: 'data' };
}
/** 当前视图对应的规范路径（根路径 + 子页路径；男女共用一个网址，团别不进 URL） */
function routePath() {
  if (view === 'lineage') return '/lineage';
  if (view === 'my') return mySub ? '/my/' + mySub : '/my';
  if (view === 'group') return '/group/' + curGroup;
  return '/report';
}
function pushRoute(replace) {
  const path = routePath();
  if (location.pathname === path) return;
  if (replace) history.replaceState(null, '', path);
  else history.pushState(null, '', path);
}

/* ==================== 小工具 ==================== */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = (n) => String(n).padStart(2, '0');
/** 328500 → 32万8500；不足一万原样返回 */
const wan = (n) => {
  n = Math.round(Number(n) || 0);
  if (n < 10000) return String(n);
  const w = Math.floor(n / 10000), r = n % 10000;
  return r === 0 ? w + '万' : w + '万' + pad2safe(r);
};
const pad2safe = (r) => String(r).padStart(4, '0');
/** 时长分钟 → 「x时x分」（用户口径 2026-10-16：不要秒，也不用「小时 / 分钟」长词）。
    108 → 「1时48分」；整点不显示 0 分，120 → 「2时」；不足 1 小时只显示「45分」。
    领奖台 / 榜单行 / 个人页三处共用这一个格式，别再各写一份。
    脏数据兜底：NaN / null / 字符串 → 0 分，Infinity 之类非有限值也按 0 处理
    （不兜的话会渲染出「Infinity时」）。 */
const minFmt = (v) => {
  const n = Number(v);
  if (!Number.isFinite(n)) return '0分';
  const t = Math.round(n);
  const h = Math.floor(t / 60), m = t % 60;
  return h > 0 ? h + '时' + (m ? m + '分' : '') : m + '分';
};
/** 提成金额（1.0.1）：后端已按「徒弟音浪 ÷ 音浪:人民币 × 提成百分比」算好金额，
    这里只做人民币格式化（最多 2 位小数、去尾零）。 */
const yuan = (n) => {
  if (n == null || !Number.isFinite(Number(n))) return '—';
  const v = Math.round(Number(n) * 100) / 100;
  return '¥' + v.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
};
/** 收益主数字：保留千分位，避免累计金额变长后难扫读；整数不补 .00。 */
const yuanBig = (n) => {
  if (n == null || !Number.isFinite(Number(n))) return '—';
  const v = Math.round(Number(n) * 100) / 100;
  const txt = v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    .replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
  return '¥' + txt;
};
/* ===== 预估收益口径（2026-10-19）=====
   抖音音浪兑人民币是 10:1（1 元 = 10 音浪，全站沿用），但**主播能拿多少不是固定 35%**：
     · 个人主播（无公会）约 30%，公会主播按公会等级 30%~55%（S 级最高 40%~55%）；
     · 2026 年起新政策改成「双周任务弹性制」（基线 + 流水 + 活跃任务叠加），
       固定分成被取消，实际比例随任务完成度浮动；
     · 提现侧另有成本：提现门槛 ¥1000 起、单笔手续费，平台技术服务费/个税另计。
   所以 35% 与手续费都不写在前端：由后台 `public_settings`（sharePct / feePct）下发，
   /my 与 /my/accounts 各带一份 earnings，前端按它算、按它展示口径说明。
   公式：到手 ≈ 音浪 ÷ 10 × 分成% ×（1 - 手续费/税%）。配置缺失/脏值回落 35% / 0%。
   2026-10-20 实测口径：分成后金额约扣 0.624% 税费，后台 feePct 填 0.624 即可；
   前端保留两位小数，避免整页配置被整数限制截断。 */
let earningsCfg = { sharePct: 35, feePct: 0 };
/** 单条 earnings 配置落库（接口没带 / 带了脏值都按缺省兜底，绝不让页面算出负数）。 */
function applyEarnings(src) {
  const num = (v, dflt) => {
    const n = Number(v);
    return Number.isFinite(n) && n >= 0 && n <= 100 ? n : dflt;
  };
  const round2 = (v, dflt) => Math.round(Number(v) * 100) / 100;
  const e = src && typeof src === 'object' ? src : {};
  earningsCfg = {
    sharePct: num(e.sharePct, 35),
    feePct: Number.isFinite(Number(e.feePct)) && Number(e.feePct) >= 0 && Number(e.feePct) <= 100
      ? round2(e.feePct, 0)
      : 0,
  };
}
/** 音浪 → 预估到手人民币（元）。wave 无效返回 null，由调用方决定显示「—」。 */
function estYuan(wave) {
  const w = Number(wave);
  if (!Number.isFinite(w) || w <= 0) return null;
  return w / 10 * (earningsCfg.sharePct / 100) * (1 - earningsCfg.feePct / 100);
}
/** 分成口径说明（卡内小字）：只按当前配置生成，不再写死 35%。 */
function earningsNote() {
  return '以实际提现为准。';
}
/** 同期差值 chip（1.0.1）：涨红跌绿是固定口径；prev 为 null（上期没数据）不显示 */
const waveDelta = (wave, prev) => {
  if (wave == null || prev == null) return '';
  const d = wave - prev;
  if (d > 0) return '<span class="delta d-up">↑' + wan(d) + '</span>';
  if (d < 0) return '<span class="delta d-down">↓' + wan(-d) + '</span>';
  return '<span class="delta d-flat">—</span>';
};
const iso = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayStr = () => iso(new Date());
/** 数据每晚 24 点后入库前一天，所以「最新一天数据」落在昨天：
    展示页默认就站到昨天，而不是等到今天的数据到达才跳过去。 */
const refStr = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };
const nowPeriod = (p) => {
  // 与默认日期同一个参照日（昨天），否则月末切月会把新一天先算进本月
  const r = refStr();
  return p === 'monthly' ? r.slice(0, 7) : r.slice(0, 4);
};
const shiftMonth = (p, n) => {
  const y = +p.slice(0, 4), m = +p.slice(5, 7) - 1;
  const d = new Date(y, m + n, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
};
/* 月 / 年口径的可选周期 = **有数据的周期**（2026-10-11：库里只有 10 月 9 天的音浪，
   以前按 ‹ 能一路翻到 2026年3月，点进去只有空态，等于把不存在的月份的音浪摆给人看）。 */
function dataPeriods(p) {
  const ds = (site && site.dates) || [];
  const server = (site && (p === 'monthly' ? site.monthlyPeriods : site.yearlyPeriods)) || [];
  return [...new Set([...server, ...ds.map(d => p === 'monthly' ? d.slice(0, 7) : d.slice(0, 4))])]
    .filter(Boolean)
    .sort((a, b) => b.localeCompare(a));  // 降序
}
/** 当前周期不在有数据的列表里 → 吸附到 ≤ 它的最近一个有数据周期（没有就落到最早一个有数据周期） */
function snapPeriod(p, cur) {
  if (p !== 'monthly' && p !== 'yearly') return cur;   // 日口径不看周期
  const list = dataPeriods(p);
  if (!list.length) return cur || nowPeriod(p);
  if (list.includes(cur)) return cur;
  const le = list.filter(x => x <= String(cur || ''));
  return le.length ? le[0] : list[list.length - 1];
}
/** 步进 n=+1 更新 / -1 更早；只在有数据的周期之间走，到头就是原值 */
function stepPeriod(n) {
  const list = dataPeriods(period);
  const i = list.indexOf(curPeriod);
  if (i < 0) return snapPeriod(period, curPeriod);
  return list[Math.max(0, Math.min(list.length - 1, i - n))];
}
/** ‹ › 到头就禁用（只有一个月/一年的数据时两个都灰） */
function syncStepper() {
  if (period === 'daily' || !$('stepper')) return;
  const list = dataPeriods(period);
  const i = list.indexOf(curPeriod);
  const none = i < 0 || list.length <= 1;
  $('pPrev').disabled = none || i >= list.length - 1;   // 更早：已经是最早一个有数据的周期
  $('pNext').disabled = none || i <= 0;                 // 更新：已经是最近一个有数据的周期
}
/* show 传 id 或元素都行（syncNav 里对子导航按钮直接传元素） */
const show = (el, on) => (typeof el === 'string' ? $(el) : el).classList.toggle('hidden', !on);
let toastTimer;
function toast(msg) {
  $('toastTx').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}

/* ==================== 账号绑定/QQ 邮箱：公共小工具（2026-10-18 契约 v2 §4） ====================
   契约文件：docs/26-账号绑定QQ邮箱与艺名登录-设计/05-实现契约-v2.md
   用户 2026-10-18 拍板：凭艺名认领开号；没有 QQ 找管理（QQ 不强制，忘记密码必须有 QQ）；
   密码 4~64 个字符、支持中英文/特殊字符/任何符号、**不 trim**；同一 QQ 只能绑一个账号。 */

/** 错误码 → 展示文案（契约 §4.9）。业务错误优先看 code，旧接口没 code 时回落到后端 error 文本。 */
function apiErrText(e) {
  const code = (e && e.code) || '';
  const msg = String((e && e.message) || '');
  const MAP = {
    BAD_PASSWORD: '密码错误，请重新输入',
    NO_ACCOUNT: '账号还没开通，请联系管理员帅帅',
    TEMP_EXPIRED: '临时密码已过期，请重新获取',
    INVALID_PHONE: '手机号格式不对：应为 5~20 位数字',
    PHONE_TAKEN: '该手机号已被其他账号绑定，请联系管理员帅帅',
    INVALID_QQ: 'QQ 号格式不对：应为 5~12 位数字，且不能以 0 开头',
    QQ_TAKEN: '该 QQ 邮箱已被其他账号绑定，请核对后重试',
    INVALID_PASS: '密码不符合要求：需 4~64 个字符，可用中英文、数字和任意符号',
    RESET_MISMATCH: '手机号和 QQ 号对不上，或这个账号还没绑定 QQ 邮箱，请核对后重试（忘记绑定 QQ 的联系管理员帅帅）',
    SMTP_UNAVAILABLE: '邮件服务暂时不可用，请稍后再试或联系管理员帅帅（本次没有改密码）',
    RATE_LIMITED: '操作太频繁了，请 1 分钟后再试',
    PROFILE_ALREADY_DONE: '该账号已完成绑定，如需修改手机号请联系管理员帅帅',
    NEED_PROFILE: '请先补全手机号和密码',
    UNAUTHORIZED: '登录已过期，请重新登录',
  };
  if (MAP[code]) return MAP[code];
  if (msg) return msg;
  return '操作失败，请稍后重试';
}

/** 判断是否为「登录态失效」类错误（api() 的 401 分支会抛不带 code 的 '请先登录'）。 */
function isAuthError(e) {
  if (!e) return false;
  if (e.code === 'UNAUTHORIZED' || e.status === 401) return true;
  return /请先登录|登录已过期/.test(String(e.message || ''));
}

/** 前端兜底脱敏（只在服务端 emailMask 为空串时用：二级闸抑制/旧后端）。
    常规显示**只认**服务端下发的 emailMask，避免两套脱敏口径。 */
function maskQq(qq) {
  const s = String(qq == null ? '' : qq).trim().replace(/@qq\.com$/i, '').replace(/\s/g, '');
  if (!/^\d+$/.test(s)) return '';
  return (s.length >= 3 ? s.slice(0, 3) : s.slice(0, 1)) + '***@qq.com';
}

/** 手机号口径：5~20 位数字（与后端 validate_my_phone 一致） */
function isValidPhone(p) { return /^\d{5,20}$/.test(String(p || '').trim()); }
/** QQ 号口径：5~12 位数字且首位非 0（契约 §2.1 normalize_qq） */
function isValidQq(q) { return /^[1-9]\d{4,11}$/.test(String(q || '').trim()); }
/** 密码口径（契约 §2.1 validate_my_password）：4~64 个字符，允许中英文/特殊字符/任何符号，
    不允许 ASCII 控制字符；**不 trim**（首尾空格是密码的一部分）。 */
function isValidPass(p) {
  if (typeof p !== 'string') return false;
  if (p.length < 4 || p.length > 64) return false;
  return !/[\x00-\x1F\x7F]/.test(p);
}
const PASS_RULE = '密码 4~64 个字符，可用中英文、数字和任意符号';

/** POST JSON（统一错误码/401 处理）。失败抛 Error 且带 .code / .data（登录失败要读 data.canClaim）。 */
async function postJson(url, body, opts) {
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' },
    opts.auth ? myTokenHeaders() : {});
  const r = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body || {}) });
  let d = {};
  try { d = await r.json(); } catch (_) {}
  if (r.status === 401) {
    const err = new Error('登录已过期，请重新登录');
    err.code = 'UNAUTHORIZED'; err.status = 401; err.data = d;
    throw err;
  }
  if (!r.ok || d.ok === false) {
    const err = new Error(apiErrText({ code: d.code, message: d.error || ('HTTP ' + r.status) }));
    err.code = d.code || ''; err.status = r.status; err.data = d;
    throw err;
  }
  return d;
}

/** 通用弹层脚手架（复用「我的」页对话框既有做法：自建遮罩 + .gate-box 卡体）。
    z-index 96：高于 #gate(90)/#msgModal(95)，低于 #announce(100)。
    Esc / 点遮罩关闭（dataset.locked='1' 时不关，给强制层用）；打开锁背景滚动。 */
function makeDialog(id, boxHtml) {
  const old = $(id);
  if (old) old.remove();
  const mask = document.createElement('div');
  mask.id = id;
  mask.className = 'dlg-mask';
  mask.innerHTML = '<div class="gate-box dlg-box" role="dialog" aria-modal="true">' + boxHtml + '</div>';
  document.body.appendChild(mask);
  lockScroll();
  let closed = false;
  const onKey = (e) => { if (e.key === 'Escape' && mask.dataset.locked !== '1') close(); };
  const close = () => {
    if (closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey);
    mask.remove();
    unlockScroll();
  };
  document.addEventListener('keydown', onKey);
  mask.addEventListener('click', (e) => {
    if (e.target === mask && mask.dataset.locked !== '1') close();
  });
  return { mask: mask, close: close, box: mask.firstElementChild, locked: (on) => { mask.dataset.locked = on ? '1' : ''; } };
}

async function api(p, opts) {
  /* 登录门（2026-10-10）：带登录态请求头；401 → 弹登录门。
     2026-10-13 修「登录成功又回登录门」：token 一律走 X-My-Token 头——后端
     （admin.rs::header_my_token）只认这个头，?token= / ?access_token= 一律按未登录
     401 处理。旧写法下登录成功后第一个数据请求就 401 → sessionExpired 清 token →
     又弹登录门。顺带 token 不再进 URL（访问日志/浏览器历史/Referer 不再记登录态）。 */
  const r = await fetch(p, { headers: myTokenHeaders(), signal: opts && opts.signal });
  if (r.status === 401) { sessionExpired(); throw new Error('请先登录'); }
  let d = {};
  try { d = await r.json(); } catch (_) {}
  /* 访问门禁（2026-10-11）：白名单外的 IP 后端统一 403，不清 token、不弹登录门。
     2026-10-13：403 不再全是地区门禁 —— 后端用 `code` 区分（如族谱的
     lineage_forbidden）。带 code 的是业务拒绝，抛给调用方就地展示；
     只有不带 code 的（地区门禁）才整页替换，否则页面骨架会被整个换掉。 */
  if (r.status === 403) {
    /* 2026-10-18 契约 v2 §3.9/§4：needProfile 与 mustChangePass 后端都**不做** 403 拦截，
       但保留兜底 —— 万一后端按旧设计拦了写接口，前端要把用户领回引导/提示层，
       而不是只弹一条 toast 让人莫名其妙。 */
    if (d.code === 'MUST_CHANGE_PASS') {
      try { openMustChangeDlg(); } catch (_) {}
      throw Object.assign(new Error(apiErrText({ code: d.code, message: d.error })), { code: d.code });
    }
    if (d.code === 'NEED_PROFILE') {
      /* 后端按旧设计 403 拦截时的兜底：把用户领回「绑定账号信息」卡（#gate 复用容器） */
      try {
        if (meState) meState.needProfile = true;
        if (!$('obPhone')) renderProfileGuide(meState || {});
      } catch (_) {}
      throw Object.assign(new Error(apiErrText({ code: d.code, message: d.error })), { code: d.code });
    }
    if (d.code) throw Object.assign(new Error(d.error || '没有访问权限'), { code: d.code });
    regionBlocked(d.error || '您的ip不在授权范围内');
    throw new Error(d.error || '您的ip不在授权范围内');
  }
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

/* ==================== 登录门 + 全屏水印 ==================== */
let gateResolve = null;   // 登录成功后 resolve({name,...})
let meState = null;       // 当前登录身份（who 的结果，带 bound / needBind）
/* 2026-10-14 注册功能已下线：原有 4 个注册状态变量及相关页面逻辑一并删除，
   登录门只剩「登录」+「忘记密码」。 */

/* 2026-10-14：原 maskPhone() 前端打码函数已删 —— 手机号统一由后端 /my/who、
   /my/push 在服务端 mask_phone() 后下发，前端拿到即已脱敏，不再二次打码
   （对已打码值再 mask 会把 138****1234 打成 13****34，水印失真）。 */

/** 登录成功后统一收口：水印 + 未绑定提醒条 + 换团条显隐 */
function applyLoginState(me) {
  meState = me || null;
  /* 换团条：只有「全团」账号（后端 switchable=true）才显示。
     钉死某团的账号（饭团=女团）压根不给切换入口，不是「显示但点了报错」。
     switchable 由 /my/who 每次都下发，所以刷新页面也能重建（不只登录那一刻）。 */
  renderTeamSwitch(me);
  // 登录账号的团别决定 TEAM：男团成员只看男团、女团只看女团（2026-10-11）
  if (me && (me.team === 'male' || me.team === 'female') && TEAM !== me.team) {
    TEAM = me.team;
    applyTeam();
  }
  /* 全团账号：套用上次选的视角（刷新/重进还是上次那个团）。
     钉死团的账号 me.team 就是死值，上面的分支已经设好，这里不覆盖。 */
  if (me && me.switchable) {
    const saved = savedViewTeam();
    if (saved && saved !== TEAM) { TEAM = saved; applyTeam(); }
    if (meState) meState.team = TEAM;
    renderTeamSwitch(meState);
  }
  const needBind = !!(me && me.needBind);
  /* 提醒条用 hidden 属性控制（CSS 写的是 .bindbar[hidden]），不是 class="hidden" */
  const bar = $('bindBar');
  if (bar) bar.hidden = !needBind;
  /* 水印口径（2026-10-11）：显示自己的手机号（打码），没有手机号才回退艺名。
     2026-10-14：phone 现在是后端 /my/who 服务端打码后的值，这里直接用、不再 mask，
     （对已打码值再 mask 会把 138****1234 打成 13****34，水印反而失真）。 */
  const wmText = needBind ? '未绑定主播' : ((me && (me.phone || me.name)) || '');
  applyWatermark(wmText);
  return me;
}

/* ---- 换团条（2026-10-15 权限分布）----
   全团账号（帅帅 / 鹏先生）可以在「全团 / 男团 / 女团」之间自己切；
   钉死某团的账号（饭团 = 只看女团）不渲染这条 —— 不是显示出来点了报错，
   压根不给入口。后端仍会在每个数据接口上按 token 团别复核，前端藏只是体验。 */

/** 上次选的视角（localStorage 可能不可用/被禁，一律 try 包住） */
function savedViewTeam() {
  try {
    const v = localStorage.getItem('myViewTeam');
    return (v === 'all' || v === 'male' || v === 'female') ? v : '';
  } catch (_) { return ''; }
}

function renderTeamSwitch(me) {
  const box = $('teamSwitch');
  if (!box) return;
  const on = !!(me && me.switchable);
  show('teamSwitch', on);
  if (!on) return;
  /* 当前视角高亮：all / male / female。空串（旧「任意团」token）按 all 显示 */
  const cur = (me && (me.team === 'male' || me.team === 'female')) ? me.team : 'all';
  box.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === cur);
    b.onclick = () => switchTeam(b.dataset.t);
  });
}

/** 切团：换 TEAM 后整页重拉（榜单 / 日期条 / 族谱都按团别取数）。
    只改前端视角，不动 token —— 后端 gate_team 对「任意团」token 一律放行，
    所以从 all 切到 male 不需要重新登录。 */
function switchTeam(t) {
  if (t !== 'all' && t !== 'male' && t !== 'female') return;
  if (TEAM === t) return;
  TEAM = t;
  /* 记忆住，刷新/下次进来还是这个视角（同一账号自己的偏好） */
  try { localStorage.setItem('myViewTeam', t); } catch (_) {}
  if (meState) meState.team = t;
  renderTeamSwitch(meState);
  applyTeam();
  syncNav();
  /* 族谱是男团专属页：正在看族谱时切到女团会被改道，改道由 switchView 负责，
     这里只保证当前视图的数据按新团别重拉 */
  go();
}

/** 关登录门 + 落地登录态。
    2026-10-18 契约 v2 §4.3：needProfile=true 时 **不关** #gate，改渲染不可关闭的
    「绑定账号信息」一屏卡（复用同一个登录门容器 → 天然没有关闭按钮/点外关闭）；
    补全成功后再走一次正常收尾。 */
function closeGate(me) {
  const g = $('gate');
  if (me && me.needProfile) {
    applyLoginState(me);
    renderProfileGuide(me);
    return;
  }
  g.classList.add('hidden');
  g.innerHTML = '';
  const fn = gateResolve; gateResolve = null;
  applyLoginState(me);
  if (fn) fn(me);
  /* 引导在登录门弹出时被 dismissAnnounce 收掉了，登录成功要补弹一次。
     用 rAF 等一帧：登录门的 hidden 和引导的 remove('hidden') 要在同一帧后
     再改 class，否则浏览器可能把两层遮罩的过渡叠在一起闪一下。
     同一用户 7 天内已经看过引导的，这里会按时间戳自然跳过。 */
  requestAnimationFrame(() => {
    try { maybeAnnounce(); } catch (_) {}
    /* 2026-10-18：登录后的后续编排（契约 §4.2 优先级：needProfile > mustChangePass > needQq）。
       必须等 gate 的 hidden 生效、首屏数据先出来，否则两层遮罩叠着用户找不到东西。 */
    try { afterGateFlow(me); } catch (_) {}
  });
}

/** 登录门关闭后的后续编排（只处理「本次登录」；刷新恢复登录态时由 boot() 单独判定）。
    mustChangePass（临时密码登录）优先于可关闭的 QQ nudge —— 否则用户点掉 nudge 后
    写接口全被拦，体验更差（03 §6.6 边界）。 */
function afterGateFlow(me) {
  if (!me) return;
  if (me.mustChangePass) {
    setTimeout(() => { try { openMustChangeDlg(); } catch (_) {} }, 420);
    return;
  }
  if (me.needQq) setTimeout(() => { try { maybeQqNudge(); } catch (_) {} }, 650);
}

function showGate() {
  const g = $('gate');
  /* 团别待定（需登录站点：登录前还不知道账号属于哪个团）→ 中性标题「数据榜」 */
  const title = TEAM ? LABEL() + '数据榜' : '数据榜';
  const av = TEAM ? LABEL().charAt(0) : '榜';
  g.classList.remove('hidden');
  /* 📣 登录页公告条（2026-10-13）：login.enabled && login.text 才渲染，插在登录卡上方。
     boot() 已把配置存进 siteAnnouncements（接口失败 = 全关，自然不显示）。
     icon 只认文件内 ANNOUNCE_ICONS 白名单里的 Material Symbols 名，白名单外回默认 campaign。 */
  const gateAnnHtml = annBarHtml('gate-ann', siteAnnouncements.login, 'campaign');
  /* #gate 本身是 flex 行布局：公告条 + 登录卡要上下排，统一包进 .gate-col 纵向容器。

  g.innerHTML = '<div class="gate-col">' + (gateAnnHtml || '') +

    '<div class="big-av" style="background:' + avColor(av) + '"><span class="material-symbols-outlined" style="font-size:28px">person</span></div>' +
    '<h3>' + esc(title) + '</h3>' +

      '<input id="gateAcct" placeholder="手机号 / 艺名" autocomplete="off">' +
      /* 2026-10-14：密码规则是 4~20 位字母/数字（2026-10-17 起也允许点），原先 inputmode="numeric" 在手机上
         只弹数字键盘、字母打不出来（自助设置了字母密码就登不进来）。去掉该属性用默认键盘。 */
      /* 2026-10-17 第四轮审计 D 域 P3-4：登录密码框用 type="password"（原来裸 text，肩窥/投屏直接露密码）。 */
      /* 2026-10-18 契约 v2：密码 4~64 个字符、支持中英文/任意符号；取 value 时**不 trim**（见 bindLoginPane）。 */
      '<input id="gatePass" type="password" placeholder="密码" autocomplete="off">' +
      '<button class="gate-forgot" id="gateForgot">忘记密码？</button>' +
      '<div class="form-err hidden" id="gateErr"></div>' +
      '<button class="btn-main" id="gateGo">登 录</button>' +
      '<div class="gate-foot">遇到问题？请联系管理员帅帅</div></div>' +
    '</div></div>';
  /* 引导让位给登录门：两层遮罩叠着用户找不到登录框。
     dismissAnnounce 走 close()，会把 announceCtx 置 null 并摘掉键盘/触摸监听，
     所以登录门关掉后 closeGate 里的重弹是一次干净的新实例，不会双监听。 */
  dismissAnnounce();
  /* 消息弹窗同样让位给登录门（#msgModal z-index 95 会盖住 #gate z-index 90）。 */
  dismissMsgModal();
  bindLoginPane();
  gateTab('login');
}

/** 登录门已先显示、公告随后才回来时，只补/换登录页公告条，不重建表单、不打断输入。 */

/* 2026-10-14 注册功能已下线；2026-10-18 仅剩的「登录」页签条也删除，
   gateTab 只是「显示登录面板 + 聚焦账号框」的入口（同名同调用点保留，避免调用链脱节）。 */
function gateTab() {

/* ------------------------------ 登录面板 ------------------------------ */
/** 登录/认领/补全的响应（与 /my/who 同形）→ 页面统一身份对象。
    只保留脱敏后的 emailMask/phone，明文邮箱不进 DOM/存储（契约 §4.7）。 */
function buildMe(d, fallbackName) {
  d = d || {};
  const team = d.team === 'male' || d.team === 'female' ? d.team : '';
  return {
    name: d.name || fallbackName || '',
    personId: d.personId,
    bound: d.bound !== false,
    needBind: !!d.needBind,
    needProfile: !!d.needProfile,
    needQq: !!d.needQq,
    mustChangePass: !!d.mustChangePass,
    phone: d.phone || '',
    personPhone: d.personPhone || '',
    emailMask: d.emailMask || '',
    email: d.emailMask || d.email || '',   // 兼容旧键；只放脱敏串
    switchable: !!d.switchable,
    admin: !!d.admin,
    team: team,
    anyTeam: !team,
  };
}

/** 登录 / 认领成功后统一收口：存 token → 组装 me → 交给 closeGate 按状态编排。
    契约 v2 §3.1：登录响应与 /my/who 同形（phone 打码、emailMask 脱敏、三个状态布尔）。 */
function applyLoginSuccess(d, fallbackName) {
  d = d || {};
  const me = buildMe(d, fallbackName);
  setMyToken(d.token);   // 登录/认领/补全/改密都会换发 token，统一走 setMyToken 清历史引用
  localStorage.setItem(me.team ? 'myName_' + me.team : MY_ANY_NAME, me.name);
  toast(me.needBind ? '登录成功，账号未绑定主播请联系管理员帅帅' : '登录成功');
  closeGate(me);
  /* 🎈 登录门关掉 = 挂载闸放开，兜底补挂弹幕（closeGate 里 needProfile 走补全卡
     时 gate 未 hidden，renderDanmaku 的闸会自己按住不渲染，无副作用） */
  try { renderDanmaku(); } catch (e) {}
}

function bindLoginPane() {
  const go = async () => {
    const acct = $('gateAcct').value.trim();
    /* 契约 v2 §4.1：密码**不 trim** —— 首尾空格是密码的一部分（后端同样不 trim） */
    const pw = $('gatePass').value || '';
    const errEl = $('gateErr');
    if (!acct || !pw) {
      errEl.textContent = '请输入账号和密码';
      errEl.classList.remove('hidden');
      return;
    }
    const btn = $('gateGo');
    const acctEl = $('gateAcct'), passEl = $('gatePass');
    btn.disabled = true; btn.textContent = '登录中…';
    acctEl.disabled = true; passEl.disabled = true;
    errEl.classList.add('hidden');
    try {
      /* 统一免团别登录口：后端按账号反查绑定主播，前端不再按团别分流 */
      const d = await postJson('/api/public/my/login', { account: acct, pass: pw });
      applyLoginSuccess(d, acct);
    } catch (e) {
      /* 2026-10-18 用户口径：**未认领的艺名直接点登录就开通** ——
         NO_ACCOUNT + canClaim 时不弹「认领账号」入口/弹窗，把刚输入的密码
         直接当开通密码调 /my/claim（后端 canClaim 已校验「台账唯一同名在职 +
         未被占用」），成功即进强制补全。
         已认领的艺名走不到这里（后端按 BAD_PASSWORD 报「密码错误」），互不干扰。 */
      if (e.code === 'NO_ACCOUNT' && e.data && e.data.canClaim) {
        const name = e.data.claimName || acct;
        /* 开通密码规则本地先验（4~64 位），不合规则提示重输，不打到限流口上 */
        if (!isValidPass(pw)) {
          btn.disabled = false; btn.textContent = '登 录';
          acctEl.disabled = false; passEl.disabled = false;
          errEl.textContent = '首次用这个艺名登录将自动开通账号；' + PASS_RULE;
          errEl.classList.remove('hidden');
          return;
        }
        btn.textContent = '开通中…';
        try {
          const d = await postJson('/api/public/my/claim', { name: name, pass: pw });
          applyLoginSuccess(d, name);   // needProfile:true → 强制补全卡
        } catch (e2) {
          /* 并发被人先认领 / 限流：如实报错，已认领的直接用密码再登一次即可 */
          btn.disabled = false; btn.textContent = '登 录';

          errEl.textContent = apiErrText(e2) || '开通失败，稍后再试';

      btn.disabled = false; btn.textContent = '登 录';
      acctEl.disabled = false; passEl.disabled = false;
      errEl.textContent = apiErrText(e) || '登录失败，稍后再试';
      errEl.classList.remove('hidden');
    }
  };
  $('gateGo').onclick = go;
  $('gateForgot').onclick = openForgotDlg;
  $('gateAcct').onkeydown = (e) => { if (e.key === 'Enter') $('gatePass').focus(); };

/** 提交首次补全（契约 §3.3）：成功 → 换 token → 重拉 who → 关登录门进数据榜。 */
async function submitProfile() {
  const phoneEl = $('obPhone'), qqEl = $('obQq');
  const p1 = $('obPass'), p2 = $('obPass2');
  if (!phoneEl || !p1 || !p2) return;
  const errEl = $('obErr');
  const fail = (m) => {
    if (!errEl) return;
    errEl.textContent = m;
    errEl.classList.remove('hidden');
  };
  errEl.classList.add('hidden');
  const phone = String(phoneEl.value || '').trim();
  const qq = String(qqEl.value || '').trim();
  const pass = p1.value || '';
  const pass2 = p2.value || '';
  if (!isValidPhone(phone)) return fail('手机号应为 5~20 位数字');
  if (qq && !isValidQq(qq)) return fail('QQ 号应为 5~12 位数字，且不能以 0 开头');
  if (pass || pass2) {
    if (!isValidPass(pass)) return fail(PASS_RULE);
    if (pass !== pass2) return fail('两次输入的新密码不一致');
  }
  const btn = $('obGo');
  const fields = [phoneEl, qqEl, p1, p2];
  btn.disabled = true; btn.textContent = '提交中…';
  fields.forEach((el) => { el.disabled = true; });
  const body = { phone: phone };
  if (qq) body.qq = qq;
  if (pass) body.newPass = pass;
  const restore = () => {
    btn.disabled = false; btn.textContent = '完成绑定，进入数据榜';
    fields.forEach((el) => { el.disabled = false; });
  };
  try {
    const d = await postJson('/api/public/my/profile/bind', body, { auth: true });
    setMyToken(d && d.token);   // 后端吊销全部旧 token → 必须换发，否则下一个请求 401
    let who = null;
    try { who = await refreshWho(); } catch (_) { /* who 失败就先用响应兜底，不挡收尾 */ }
    closeGate(who || buildMe(d, meState && meState.name));
    toast('绑定完成，开始使用吧');
  } catch (e) {
    if (isAuthError(e)) {
      myLogout();
      gateResolve = null;
      showGate();
      toast('登录已过期，请重新登录');
      return;
    }
    /* 已成功但前端没收到响应（超时）再提交会拿 PROFILE_ALREADY_DONE：
       先重拉 who，若已经补全完成就按成功收尾（契约 §4.3 第 6 步） */
    if (e.code === 'PROFILE_ALREADY_DONE') {
      let who = null;
      try { who = await refreshWho(); } catch (_) {}
      if (who && !who.needProfile) {
        closeGate(who);
        toast('绑定完成，开始使用吧');
        return;
      }
      restore();
      return fail('该账号已完成绑定，如需修改手机号请联系管理员帅帅');
    }
    restore();
    fail(apiErrText(e) || '提交失败，稍后再试');
  }
}

/* ==================== 绑定 QQ 提醒（契约 v2 §4.4） ====================
   2026-10-18 用户拍板：QQ **不强制**，但忘记密码必须有 QQ —— 所以提醒保留、可关闭。
   频控（03 §4.1）：登录后首次必弹 + 7 天冷却 + 单会话一次；「我的」页常驻入口随时可绑。 */
const QQ_NUDGE_CD = 7 * 24 * 60 * 60 * 1000;
const QQ_NUDGE_AT_KEY = 'qqNudgeAt';
const QQ_NUDGE_SEEN_KEY = 'qqNudged';
function qqNudgeAllowed() {
  try { if (sessionStorage.getItem(QQ_NUDGE_SEEN_KEY)) return false; } catch (_) {}
  try {
    const ts = Number(localStorage.getItem(QQ_NUDGE_AT_KEY) || 0) || 0;
    if (ts > 0 && Date.now() - ts < QQ_NUDGE_CD) return false;
  } catch (_) {}
  return true;
}
function markQqNudged() {
  try { sessionStorage.setItem(QQ_NUDGE_SEEN_KEY, '1'); } catch (_) {}
  try { localStorage.setItem(QQ_NUDGE_AT_KEY, String(Date.now())); } catch (_) {}
}
function maybeQqNudge() {
  if (!meState || !meState.needQq) return;
  if ($('qqMask')) return;
  if (!qqNudgeAllowed()) return;
  markQqNudged();
  openQqDlg({ source: 'nudge' });
}

/* ==================== 重拉身份（补全 / 绑 QQ / 改密后统一刷新） ====================
   除了让水印从艺名切成打码手机号，也保证 needQq/mustChangePass/emailMask 与服务端一致。 */
async function refreshWho() {
  const who = await api('/api/public/teams/' + (TEAM || 'all') + '/my/who');
  if (!who || who.ok === false) return null;
  if (who.anyTeam) who.team = '';
  else if (who.team !== 'male' && who.team !== 'female') who.team = TEAM || '';
  applyLoginState(who);
  return who;
}

/* 启动前置：有 token 先验身份（轻量 who）；没有/失效 → 弹登录门等人登录 */
async function ensureLogin() {
  const t = myToken();
  if (t) {
    /* token 可能记在别的团（团别待定的登录态两团都认）：候选团逐个问一遍身份 */
    const cands = ['all'];
    for (const team of cands) {
      try {
        const who = await fetchWithTimeout('/api/public/teams/' + team + '/my/who',
          { headers: myTokenHeaders() }, 2500).then((r) => r.json());
        if (who && who.ok) {
          /* team 回账号真正的团别（团别待定 = 空串），不是刚试探的团 */
          who.team = who.anyTeam ? '' :
            (who.team === 'male' || who.team === 'female' ? who.team : team);
          return who;
        }
        if (who && /过期|失效/.test(who.error || '')) break;   // token 本身失效，别再问别的团
      } catch (_) { /* 网络问题也走重新登录，登录卡会给出报错 */ }
    }
    myLogout();
  }
  return new Promise((resolve) => {
    gateResolve = resolve;
    showGate();
  });
}

/* 全屏水印（显示打码手机号，没有手机号才回退艺名）：平铺斜排、极低透明度、
   pointer-events none，不影响任何操作 */
function applyWatermark(name) {
  const wm = $('wm');
  const nm = String(name || '').trim();
  if (!nm) { wm.hidden = true; return; }
  const tile = '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150">' +
    '<text x="120" y="80" font-size="14" fill="#0F1728" fill-opacity="0.10" text-anchor="middle" ' +
    'transform="rotate(-22 120 80)">' + esc(nm) + ' · ' + esc(nm) + '</text></svg>';
  wm.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(tile) + '")';
  wm.hidden = false;
}
function removeWatermark() { const wm = $('wm'); if (wm) { wm.hidden = true; wm.style.backgroundImage = ''; } }
/* 二维码页临时收起全屏水印：水印层 z-index 高于普通内容，若压在二维码上会影响
   相册识别。只在「消息设置 → 微信对接」子页隐藏，离开后按原状态恢复。 */
function setQrWatermarkHidden(hide) {
  const wm = $('wm');
  if (!wm) return;
  if (hide) {
    if (wm.dataset.qrHidden !== '1') {
      wm.dataset.qrWasHidden = wm.hidden ? '1' : '0';
      wm.dataset.qrHidden = '1';
    }
    wm.hidden = true;
    return;
  }
  if (wm.dataset.qrHidden === '1') {
    if (wm.dataset.qrWasHidden !== '1') wm.hidden = false;
    delete wm.dataset.qrHidden;
    delete wm.dataset.qrWasHidden;
  }
}

/* ==================== 榜单 ==================== */
/* 版式严格对齐排行榜参考设计：TOP3 领奖台 + 名次/头像/名字/数值 的简洁列表。
   涨红跌绿是本项目固定口径：名次升 = 红 ↑，降 = 绿 ↓。 */
function deltaChip(it) {
  if (!it.delta) return '';
  const d = it.delta;
  if (d.dir === 'up') return '<span class="delta d-up">↑' + d.n + '</span>';
  if (d.dir === 'down') return '<span class="delta d-down">↓' + d.n + '</span>';
  return '<span class="delta d-flat">—</span>';
}

/* 头像：没有照片，用名字首字 + 按名字哈希取稳定底色（同一个人颜色不变） */
const AV_COLORS = ['#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#14B8A6'];
function avColor(name) {
  let h = 0;
  const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
const avHtml = (name) =>
  '<span class="av" style="background:' + avColor(name) + '">' +
  esc(String(name || '?').charAt(0)) + '</span>';

/* ---- 主播详情手风琴：点击展开 / 收回；上下文（团别 + 日期/周期）变化自动失效 ---- */
let expandedName = '';
let expandedCtx = '';
function detailCtx() {
  return [TEAM, period, period === 'daily' ? (curDate || '') : (curPeriod || '')].join('|');
}
function detailOpen(it) {
  return !!it && expandedName === it.name && expandedCtx === detailCtx();
}
function expandCue(open) {
  return '<span class="st-expand-cue" aria-hidden="true"></span>';
}
function detailDeltaText(delta) {
  if (!delta) return '—';
  if (delta.dir === 'up') return '↑ ' + delta.n + ' 名';
  if (delta.dir === 'down') return '↓ ' + delta.n + ' 名';
  return '持平';
}
function detailStatus(it) {
  /* 月 / 年榜单的日数信息统一放进「未播 / 直播天数」格，不再重复一个状态胶囊。 */
  if (it.periodic) return { text: '', cls: '' };
  if (it.hasData === false) return { text: '暂无数据', cls: '' };
  /* 2026-10-22 用户口径：详情不再展示在线状态；未播提示保留。 */
  return it.isLive ? { text: '', cls: '' } : { text: '今日未开播', cls: 'warn' };
}
function detailCell(label, value) {
  return '<div class="st-detail-cell"><div class="st-detail-lb">' + esc(label) +
    '</div><div class="st-detail-v">' + esc(value) + '</div></div>';
}
function daySplitCell(absent, live) {
  const off = Math.max(0, Number(absent) || 0);
  const on = Math.max(0, Number(live) || 0);
  return '<div class="st-detail-cell" title="未直播 ' + off + ' 天 / 直播 ' + on + ' 天">' +
    '<div class="st-detail-lb">未播 / 直播天数</div>' +
    '<div class="st-detail-v st-day-split"><span class="st-day-off">' + off +
      '</span><span class="st-day-sep">/</span><span class="st-day-live">' + on + '</span></div></div>';
}
function detailHtml(it, rowMode) {
  if (!it || !detailOpen(it)) return '';
  const st = detailStatus(it);
  const badge = st.text
    ? ' <span class="st-detail-badge ' + st.cls + '">' + esc(st.text) + '</span>'
    : '';
  const waveLbl = it.periodic ? (period === 'monthly' ? '当月音浪' : '年度音浪') : '当日音浪';
  const cells = [
    detailCell('当前排名', it.rank ? '第 ' + it.rank + ' 名' : '—'),
    detailCell(waveLbl, it.wave == null ? '—' : wan(it.wave)),
  ];
  if (!it.periodic && it.totalWave != null) cells.push(detailCell('累计音浪', wan(it.totalWave)));
  cells.push(detailCell('直播时长', it.minutes == null ? '—' : minFmt(it.minutes)));
  if (it.delta) cells.push(detailCell('排名变化', detailDeltaText(it.delta)));
  if (it.liveDays != null && it.absentDays != null &&
      ((Number(it.liveDays) || 0) + (Number(it.absentDays) || 0) > 0)) {
    cells.push(daySplitCell(it.absentDays, it.liveDays));
  }
  return '<div class="st-detail' + (rowMode ? ' st-detail-row' : '') + '" data-detail-name="' + esc(it.name) +
      '" role="region" aria-label="' + esc(it.name) + '详情">' +
    '<div class="st-detail-head">' +
      '<div class="st-detail-title">主播详情' + badge + '</div>' +
      '<button class="st-detail-close" type="button" data-close-detail="' + esc(it.name) + '">收起</button>' +
    '</div>' +
    '<div class="st-detail-grid">' + cells.join('') + '</div>' +
    '<div class="st-detail-foot"><span>长按主播可复制数据</span><b>点击同一主播也可收回</b></div>' +
  '</div>';
}
function clearOpenDetail() {
  document.querySelectorAll('.st-detail').forEach(el => el.remove());
  document.querySelectorAll('[data-expand-name]').forEach(el => {
    el.classList.remove('is-open');
    el.setAttribute('aria-expanded', 'false');
  });
}
function toggleDetail(name, restoreFocus) {
  if (!name) return;
  const ctx = detailCtx();
  const same = expandedName === name && expandedCtx === ctx;
  clearOpenDetail();
  if (same) {
    expandedName = '';
    expandedCtx = '';
    if (restoreFocus) {
      const trigger = [...document.querySelectorAll('[data-expand-name]')]
        .find(el => el.dataset.expandName === name);
      if (trigger) trigger.focus({ preventScroll: true });
    }
    return;
  }
  expandedName = name;
  expandedCtx = ctx;
  const it = listAll.find(x => x.name === name);
  const trigger = [...document.querySelectorAll('[data-expand-name]')]
    .find(el => el.dataset.expandName === name);
  if (!it || !trigger) return;
  trigger.classList.add('is-open');
  trigger.setAttribute('aria-expanded', 'true');
  const isPod = trigger.classList.contains('st-pod');
  if (isPod) {
    const podium = trigger.closest('.st-podium');
    if (podium) podium.insertAdjacentHTML('afterend', detailHtml(it, false));
  } else {
    const group = trigger.closest('.st-row-group') || trigger.parentElement;
    if (group) group.insertAdjacentHTML('beforeend', detailHtml(it, true));
  }
  requestAnimationFrame(() => {
    if (restoreFocus) {
      const trigger = [...document.querySelectorAll('[data-expand-name]')]
        .find(el => el.dataset.expandName === name);
      if (trigger) trigger.focus({ preventScroll: true });
    }
    const detail = [...document.querySelectorAll('.st-detail')]
      .find(el => el.dataset.detailName === name);
    if (detail) detail.scrollIntoView({ block: 'nearest' });
  });
}

/** 领奖台：按 [第2名, 第1名, 第3名] 排布，第一名居中大号；缺位留空。
    后台关掉「音浪数值」时接口不下发数字（wave=null），显示 —。 */
function podHtml(items) {
  const pick = (r) => items.find(x => x.hasData !== false && x.rank === r);
  const order = [pick(2), pick(1), pick(3)];
  if (!order.some(Boolean)) return '';
  /* Stitch 版领奖台：外圈白环 + 内圈米色/银/铜，每位名次头顶金/银/铜奖杯 + 深棕名次标 */
  const IN_TONE = (r) =>
    r === 1 ? 'st-pod-in-1' : r === 2 ? 'st-pod-in-2' : 'st-pod-in-3';
  return '<div class="st-podium">' + order.map(it => {
    if (!it) return '<div class="st-pod"></div>';
    const open = detailOpen(it);
    const ch = esc(String(it.name || '?').charAt(0));
    /* 真头像（T3）：avatar 是同源相对路径（拿不到就是 null）。有图就直出 <img>（公开图，
       不用 fetch+objectURL），没图仍走原来的「首字 + 金银铜底色」，外观与旧版一模一样。
       data-n 交给 bindRows 的 onerror 兜底：裂图时回落到首字。 */
    const av = it.avatar
      ? '<div class="st-pod-av ' + IN_TONE(it.rank) + ' has-img" data-n="' + esc(it.name) + '">' +
          '<img data-av src="' + esc(it.avatar) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">' +
        '</div>'
      : '<div class="st-pod-av ' + IN_TONE(it.rank) + '" data-n="' + esc(it.name) + '">' + ch + '</div>';
    const wave = it.wave == null ? '—' : wan(it.wave);
    /* 2026-10-19 用户口径：领奖台不再显示「总音浪」，日 / 月 / 年都只保留本期音浪。 */
    const label = it.periodic ? '' : '日音浪';
    /* 字段关闭时后端可能不下发 → null/undefined 一律隐藏；0 是后端真实值，照常显示。 */
    const min = it.minutes == null ? '' : minFmt(it.minutes);
    const absent = it.periodic && it.absentDays != null ? it.absentDays : null;
    return '<div class="st-pod st-pod-' + it.rank + (open ? ' is-open' : '') + '" data-n="' + esc(it.name) +
        '" data-w="' + (it.wave == null ? '' : it.wave) + '" data-expand-name="' + esc(it.name) +
        '" role="button" tabindex="0" aria-expanded="' + open + '" aria-label="查看' + esc(it.name) + '详情">' +
      '<div class="st-pod-ring">' +
        trophyHtml(it.rank) +
        av +
      '</div>' +
      '<h3 class="st-pod-nm"><span class="st-pod-nmtext">' + esc(it.name) + '</span>' + expandCue(open) + '</h3>' +
      (absent != null ? '<span class="st-pod-off' + (absent > 0 ? ' warn' : '') + '">未播 ' + absent + '天</span>' : '') +
      (min ? '<span class="st-pod-off">时长 ' + min + '</span>' : '') +
      /* 2026-10-18 第二轮 1:1：数值与单位小字包进 .st-pod-num（设计稿 div.mt-0.5），
         块级 label 撑到与数值同宽 —— 设计稿标签实测宽 83.5 正是数值「5万6788」的宽度。 */
      '<div class="st-pod-num">' +
        '<p class="st-pod-wv">' + wave + '</p>' +
        (label ? '<span class="st-pod-lbl">' + label + '</span>' : '') +
      '</div>' +
    '</div>';
  }).join('') + '</div>' + detailHtml(order.find(it => it && detailOpen(it)), false);
}

/** 榜单行（Stitch 版）：

    月榜：按当月音浪排名，右列只显示数字（2026-10-19 去掉「当月音浪」小字）。
    年榜：按年度音浪排名，右列只显示数字（同上）。
    时长：minutes 缺失/null 时整格隐藏；0 是真实值，显示为「时长 0分」。
    未播天数（仅月 / 年榜）：absentDays 缺失/null 时整行隐藏；0 是真实值，显示「未播 0天」。

function lbRowHtml(it) {

  const wave = hideWave ? '—' : wan(it.wave);

  return '<div class="st-row-group">' +
    '<div class="st-row' + (off ? ' off' : '') + (open ? ' is-open' : '') + '" data-n="' + esc(it.name) +

    '<div class="st-row-l">' +

      (it.avatar
        ? '<div class="st-row-av has-img" data-n="' + esc(it.name) + '">' +

/** Stitch 版头像：柔和底色（indigo/sky/violet/rose/orange/teal 轮换） */
const SOFT_TONES = [
  ['rgba(99,102,241,.10)', '#4c4aca'],
  ['rgba(14,165,233,.10)', '#0369a1'],
  ['rgba(139,92,246,.10)', '#6d28d9'],
  ['rgba(244,63,94,.10)',  '#be123c'],
  ['rgba(249,115,22,.10)', '#c2410c'],
  ['rgba(20,184,166,.10)', '#0f766e'],
];
function avSoft(name) {
  let h = 0; const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const t = SOFT_TONES[h % SOFT_TONES.length];
  return 'background:' + t[0] + ';color:' + t[1];
}

let listAll = [];
/* 数据页整包缓存（2026-10-21）：用户点开主播详情只用当前页已有字段，零网络请求。
   首屏响应含当前榜单全部主播及详情字段；其它日期 / 月榜 / 年榜在空闲时串行预取，
   之后切换直接读缓存，避免用户操作时才发请求造成等待。 */
const PAGE_DATA_TTL_MS = 5 * 60 * 1000;
const pageDataCache = new Map();
const prefetchedTeams = new Set();
function pageDataKey(team, p, scope) {
  return String(team || '') + '|' + String(p || '') + '|' + String(scope || '');
}
function cachedPageData(key) {
  const hit = pageDataCache.get(key);
  if (!hit) return null;
  if (Date.now() - hit.at > PAGE_DATA_TTL_MS) {
    pageDataCache.delete(key);
    return null;
  }
  return hit.data;
}
function cachePageData(key, data) {
  if (!key || !data || typeof data !== 'object') return;
  pageDataCache.set(key, { at: Date.now(), data });
}
function scheduleDashboardPrefetch() {
  const dates = (site && Array.isArray(site.dates)) ? site.dates.slice(0, 60) : [];
  if (!dates.length || prefetchedTeams.has(TEAM)) return;
  if (navigator.onLine === false || (navigator.connection && navigator.connection.saveData)) return;
  prefetchedTeams.add(TEAM);
  const jobs = [];
  dates.forEach(d => jobs.push({
    key: pageDataKey(TEAM, 'daily', d),
    url: '/api/public/teams/' + TEAM + '/daily?date=' + encodeURIComponent(d),
  }));
  const monthPeriods = new Set([...(site.monthlyPeriods || []), ...dates.map(d => d.slice(0, 7))]);
  [...monthPeriods].forEach(p => jobs.push({
    key: pageDataKey(TEAM, 'monthly', p),
    url: '/api/public/teams/' + TEAM + '/monthly?period=' + encodeURIComponent(p),
  }));
  const yearPeriods = new Set([...(site.yearlyPeriods || []), ...dates.map(d => d.slice(0, 4))]);
  [...yearPeriods].forEach(p => jobs.push({
    key: pageDataKey(TEAM, 'yearly', p),
    url: '/api/public/teams/' + TEAM + '/yearly?period=' + encodeURIComponent(p),
  }));
  const run = () => {
    let i = 0;
    const next = () => {
      while (i < jobs.length && cachedPageData(jobs[i].key)) i++;
      if (i >= jobs.length) return;
      const job = jobs[i++];
      fetchWithTimeout(job.url, { headers: myTokenHeaders() }, 5000)
        .then(async (r) => {
          if (!r.ok) return;
          const d = await r.json().catch(() => null);
          cachePageData(job.key, d);
        })
        .catch(() => {})
        .finally(() => setTimeout(next, 220));
    };
    next();
  };
  /* 标签页持续动画时 requestIdleCallback 可能迟迟不触发；1.5s 定时器兜底，
     保证预取一定会启动，又不抢首屏渲染。 */
  let kicked = false;
  const kick = () => {
    if (kicked) return;
    kicked = true;
    run();
  };
  setTimeout(kick, 1500);
  if (window.requestIdleCallback) requestIdleCallback(kick, { timeout: 4000 });
}
/** 参与渲染的行：搜索过滤（未开播的人始终显示，置灰） */

/* ==================== 看板弹幕（2026-10-22：男女团各自的当日最高） ====================
    用户口径：「弹幕只放在前三名分数下面即可。名次/主播上边」，男女团各滚自己的每日最高 —— 不再是 fixed 全屏轨道，
    改为**文档流里的窄条 .dm-strip**（高 24px，与胶囊同高），由 renderList 插在
    领奖台与榜单之间；胶囊在条内横向流动，条外 overflow:hidden 裁住。
       · 男团取 teamRank===1，女团取 teamRank===1；全团视角两条胶囊同轨滚动。
         显示「👑 {名} · 男/女团每日最高 {X万音浪}」（wave==null 不出数字段）
    位置微调：后端 danmaku.top 是**偏移量**（-80..80，正=下移，默认 0 = 自然位），
    写成 .dm-strip 的 margin-top；非数字回落 0。
    显示条件：仅日榜；danmaku.enabled === true 且 danmaku.dailyChampion !== false，
    且有当日冠军。月榜 / 年榜 / 无冠军 → renderList 不输出弹幕条（零高度占用）。
    挂载闸：登录门 / 三甲通报弹窗 / 引导弹窗 任一开着 → 条内保持空（占位不闪），
    各自关闭时 renderDanmaku() 补挂（幂等）。 */
function dmCfg() {
  const cfg = (siteAnnouncements && typeof siteAnnouncements === 'object') ? siteAnnouncements : {};
  return (cfg.danmaku && typeof cfg.danmaku === 'object') ? cfg.danmaku : {};
}
/** 位置偏移：-80..80px（正=下移）；非数字/缺失 → 0 */
function dmOffset(d) {
  let t = Number(d.top);
  if (!isFinite(t)) t = 0;
  return Math.max(-80, Math.min(80, Math.round(t)));
}
/** 挂载闸：登录门 / 三甲通报弹窗 / 引导弹窗 任一开着 → true（弹幕先不出现） */
function dmGateOpen() {
  const gate = $('gate');
  const popup = $('itemPopup');
  return !!((gate && !gate.classList.contains('hidden')) ||
            (popup && !popup.classList.contains('hidden')) ||
            announceCtx);
}
/** 某个团的当日最高主播（2026-10-22）：优先用后端 teamRank=1；
    旧接口没有 teamRank/team 时退回全局 rank=1。 */
function dmChampionForTeam(team) {
  const rows = listAll.filter((x) => x && x.hasData !== false &&
    (!x.team || !team || x.team === team));
  return rows.find((x) => Number(x.teamRank) === 1) ||
    rows.find((x) => Number(x.rank) === 1) || null;
}

/** 单条每日最高胶囊：男团金、女团粉；全团视角下男女各一条。 */
function dmPillFor(item, team) {
  if (!item) return '';
  const label = team === 'male' ? '男团每日最高'
    : team === 'female' ? '女团每日最高' : '每日最高';
  const cls = team === 'female' ? ' danmaku-slim-pink' : '';
  return '<span class="danmaku-slim danmaku-slim-gold' + cls + '">' +
      '<span class="dm-ic">👑</span>' +
      '<span class="dm-nm">' + esc(item.name) + '</span>' +
      '<span class="dm-dot">·</span>' +
      '<span class="dm-tt">' + label + '</span>' +
      (item.wave == null ? '' : '<span class="dm-num">' + wan(item.wave) + '</span>') +
    '</span>';
}

/** 当日最高胶囊 HTML（月/年榜、数据缺、开关关时为空串） */
function dmPillsHtml(d) {
  if (period !== 'daily' || d.dailyChampion === false || !Array.isArray(listAll)) return '';
  const hasTeamMeta = listAll.some((x) => x && (x.team === 'male' || x.team === 'female'));
  if (!hasTeamMeta) {
    const team = TEAM === 'male' || TEAM === 'female' ? TEAM : '';
    return dmPillFor(dmChampionForTeam(team), team);
  }
  const teams = TEAM === 'male' || TEAM === 'female' ? [TEAM] : ['male', 'female'];
  return teams.map((team) => dmPillFor(dmChampionForTeam(team), team)).join('');
}
/** renderList 用：输出弹幕条（开关关 = 空串，零占用）；挂载闸开着 = 空轨道占位 */
function dmStripHtml() {
  const d = dmCfg();
  if (d.enabled !== true || period !== 'daily' || d.dailyChampion === false) return '';
  const pills = dmGateOpen() ? '' : dmPillsHtml(d);
  if (!pills && !dmGateOpen()) return '';
  return '<div class="dm-strip" style="margin-top:' + dmOffset(d) + 'px">' +
    '<div class="dm-track">' + pills + '</div></div>';
}
/** 幂等补挂：更新已存在弹幕条里的胶囊（三个关闭点：登录成功 / 通报弹窗关 / bootRest 尾） */
function renderDanmaku() {
  const strip = document.querySelector('.dm-strip');
  if (!strip) return;                      // 非看板 / 弹幕关闭：无事可做
  const d = dmCfg();
  if (d.enabled !== true || period !== 'daily' || d.dailyChampion === false) { strip.remove(); return; }
  strip.style.marginTop = dmOffset(d) + 'px';
  const track = strip.querySelector('.dm-track');
  if (!track) return;
  const pills = dmGateOpen() ? '' : dmPillsHtml(d);
  if (!pills && !dmGateOpen()) { strip.remove(); return; }
  track.innerHTML = pills;
}

function copyText(t) {

/* 点人 = 展开 / 收回详情；长按 / 右键 = 复制「名字 · 音浪」（音浪隐藏时只复制名字） */
function bindRows() {

/* 头像兜底（T3）：接口给的 avatar 也可能 404 / 图挂了，绝不能留破图。
   在渲染后同一拍挂 onerror：摘掉 has-img（领奖台的 CSS 底色自己回来），按容器类型回落 ——
     · .st-row-av（榜单名次行）→ avSoft 柔和底色 + 姓名首字；
     · .ico（我的抖音号行图标）→ 补回 material 图标（**不再**走首字，图标位不是头像位）；
     · 其余（.st-pod-av 领奖台 / .st-my-av 我的页大头像）→ 姓名首字。
   2026-10-19：从 bindRows 里抽出来 —— 「我的」页（个人页大头像 + 抖音号列表）也用真头像，
   同样要有裂图兜底；原先 ico 分支设完 innerHTML 后又被 textContent='' 清掉，这里一并修正。 */
function bindAvatarFallback() {
  document.querySelectorAll('#view img[data-av]').forEach(img => {
    img.onerror = () => {
      const box = img.parentElement;
      if (!box) return;
      box.classList.remove('has-img');
      const nm = box.dataset.n || '';
      if (box.classList.contains('st-row-av')) {
        box.style.cssText = avSoft(nm);
        box.textContent = String(nm || '?').charAt(0);
      } else if (box.classList.contains('ico')) {
        box.classList.add('material-icon');
        box.innerHTML = '<span class="material-symbols-outlined">smart_display</span>';
      } else {
        box.textContent = String(nm || '?').charAt(0);
      }
    };
  });
}

/* ==================== 加载：数据页 ==================== */
async function loadData(signal, fresh) {
  const scope = period === 'daily' ? (curDate || '') : (curPeriod || '');
  let key = pageDataKey(TEAM, period, scope);
  const url = period === 'daily'
    ? '/api/public/teams/' + TEAM + '/daily' + (curDate ? '?date=' + encodeURIComponent(curDate) : '')
    : '/api/public/teams/' + TEAM + '/' + period + (curPeriod ? '?period=' + encodeURIComponent(curPeriod) : '');
  let d = fresh ? null : cachedPageData(key);
  if (!d) {
    d = await api(url, { signal });
    if (period === 'daily' && d && d.date) key = pageDataKey(TEAM, 'daily', d.date);
    else if (d && d.period) key = pageDataKey(TEAM, period, d.period);
    cachePageData(key, d);
  }
  if (period === 'daily') {
    curDate = d.date;
    listAll = d.items || [];
    $('mhSub').textContent = 'DATA ' + (curDate || '').replaceAll('-', '.') +
      ' · ' + (d.liveCount || 0) + '/' + (d.teamSize || listAll.length) + ' 有数据';
    renderDates();
  } else {
    /* 显隐兜底（2026-10-11）：后端 published:false / periodEnabled:false 时不下发 period，
       以前直接 curPeriod = d.period 再 .slice 会抛错，页面只剩「暂时取不到数据」。 */
    if (!d || d.published === false) {
      listAll = [];
      $('mhSub').textContent = period === 'monthly' ? 'MONTH' : 'YEAR';
      $('pNow').textContent = period === 'monthly'
        ? nowPeriod('monthly').slice(0, 4) + '年' + (+nowPeriod('monthly').slice(5, 7)) + '月'
        : nowPeriod('yearly') + '年';
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        LABEL() + '数据暂未公布<br>请等管理员发布</div></div>';
      return;
    }
    if (d.periodEnabled === false) {
      listAll = [];
      $('mhSub').textContent = period === 'monthly' ? 'MONTH' : 'YEAR';
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        (period === 'monthly' ? '每月' : '每年') + '榜暂未开放<br>换个口径看看</div></div>';
      return;
    }
    curPeriod = snapPeriod(period, d.period || curPeriod);
    if (!curPeriod) {
      listAll = [];
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        '这个周期没有可显示的主播<br>换一个周期试试</div></div>';
      return;
    }
    /* periodic：月/年榜行没有 absentDays/totalWave 概念，榜单行不渲染「本月/未播」副行 */
    listAll = (d.items || []).map(x => ({ ...x, hasData: true, periodic: true }));
    $('mhSub').textContent = (period === 'monthly' ? 'MONTH ' : 'YEAR ') + curPeriod;
    $('pNow').textContent = period === 'monthly'
      ? curPeriod.slice(0, 4) + '年' + (+curPeriod.slice(5, 7)) + '月'
      : curPeriod + '年';
    renderDates();
  }
  renderList();
  if (period === 'daily') scheduleDashboardPrefetch();
}

function renderDates() {
  /* 2026-10-18：日期条重渲染后布局可能变化，底栏/分段滑块顺带对齐一次 */
  try { navDropMove(); stSegMove(); } catch (e) {}
  if (period !== 'daily') {
    const periods = dataPeriods(period);
    let prevY = '';
    $('dates').innerHTML = periods.map(p => {
      const year = p.slice(0, 4);
      const gap = period === 'monthly' && year !== prevY
        ? '<span class="mgap">' + year + '年</span>' : '';
      prevY = year;
      const label = period === 'monthly' ? (+p.slice(5, 7)) + '月' : p + '年';
      return gap + '<button data-period="' + p + '" class="' + (p === curPeriod ? 'on' : '') + '">' +
        label + '</button>';
    }).join('');
    document.querySelectorAll('#dates button').forEach(b => b.onclick = () => pickPeriod(b.dataset.period));
    const on = document.querySelector('#dates button.on');
    if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
    return;
  }
  const dates = (site && site.dates) || [];
  let prevM = '';
  $('dates').innerHTML = dates.map(d => {
    let label = d.slice(5).replace('-', '.');
    if (d === todayStr()) label = '今天';
    else if (d === refStr()) label = '昨天';
    /* 跨月时插一条「10月」分隔，长条里不迷路 */
    const m = d.slice(0, 7);
    const gap = prevM && m !== prevM ? '<span class="mgap">' + (+m.slice(5, 7)) + '月</span>' : '';
    prevM = m;
    const noData = calMonths && !calMonths.has(d.slice(0, 7)) ? '' :
      (calDays && !calDays.has(d) ? ' nodata' : '');
    return gap + '<button data-d="' + d + '" class="' + (d === curDate ? 'on' : '') + noData + '">' + label + '</button>';
  }).join('');
  document.querySelectorAll('#dates button').forEach(b => b.onclick = () => pickDate(b.dataset.d));
}

/* 点日期（日期条 / 日历共用）：先本地高亮（点了立刻有反应），再拉数据 */
function pickDate(d) {
  if (!d || d === curDate) return;
  curDate = d;
  document.querySelectorAll('#dates button').forEach(x =>
    x.classList.toggle('on', x.dataset.d === d));
  const on = document.querySelector('#dates button.on');
  if (on) on.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  go();
}

/* 点月份 / 年份：与日榜日期条同一交互，选中后立刻高亮并加载对应整月数据 */
function pickPeriod(p) {
  if (!p || p === curPeriod) return;
  curPeriod = p;
  renderDates();
  go();
}

/* ==================== 日期日历（点 📅 弹出，底部抽屉 / PC 居中卡） ==================== */
/* 数据分布（有数据的天）：curDate 所在月拉不到就把整段 dates 摊进日历 */
let calDays = null;      // Set('YYYY-MM-DD') 有数据的日子；null = 未知（不标点）
let calMonths = null;    // Set('YYYY-MM') 有数据的月份（哪些月缺数据）

function calBuildDays() {
  const dates = (site && site.dates) || [];
  calDays = new Set(dates);
  calMonths = new Set(dates.map(d => d.slice(0, 7)));
}

let calY = 0, calM = 0;   // 日历当前显示的年月（calM: 0-11）

function calShow() {
  if (!(site && site.dates && site.dates.length)) { toast('还没有可选的日期'); return; }
  if (!calDays) calBuildDays();
  const ref = curDate || refStr();
  calY = +ref.slice(0, 4);
  calM = +ref.slice(5, 7) - 1;
  if ($('calPop')) { $('calPop').classList.remove('hidden'); calRender(); return; }
  const pop = document.createElement('div');
  pop.id = 'calPop';
  pop.className = 'cal-pop';
  pop.innerHTML = '<div class="cal-card">' +
    '<div class="cal-head">' +
    '<button id="calPrev" title="上一个月"><span class="material-symbols-outlined">chevron_left</span></button>' +
    '<div class="ttl" id="calTitle">—</div>' +
    '<button id="calNext" title="下一个月"><span class="material-symbols-outlined">chevron_right</span></button>' +
    '<button class="close" id="calClose" title="关闭"><span class="material-symbols-outlined">close</span></button>' +
    '</div>' +
    '<div class="cal-grid" id="calGrid"></div>' +
    '<div class="note" style="margin:10px 0 0">绿点 = 有数据的日子 · 只能选有数据的日期</div>' +
    '</div>';
  document.body.appendChild(pop);
  pop.addEventListener('click', (e) => { if (e.target === pop) calHide(); });
  $('calClose').onclick = calHide;
  $('calPrev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } calRender(); };
  $('calNext').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } calRender(); };
  calRender();
}

function calHide() {
  const p = $('calPop');
  if (p) p.classList.add('hidden');
}

function calRender() {
  $('calTitle').textContent = calY + ' 年 ' + (calM + 1) + ' 月';
  const first = new Date(calY, calM, 1);
  const lead = first.getDay();                       // 0=周日
  const dim = new Date(calY, calM + 1, 0).getDate(); // 本月天数
  const prevDim = new Date(calY, calM, 0).getDate();
  const tStr = todayStr();
  let html = '';
  ['日', '一', '二', '三', '四', '五', '六'].forEach((w, i) => {
    html += '<div class="wd' + (i === 0 || i === 6 ? ' wkend' : '') + '">' + w + '</div>';
  });
  for (let i = lead - 1; i >= 0; i--) {
    html += '<button class="cal-d dim" disabled>' + (prevDim - i) + '</button>';
  }
  for (let d = 1; d <= dim; d++) {
    const ds = calY + '-' + pad2(calM + 1) + '-' + pad2(d);
    const has = calDays && calDays.has(ds);
    const cls = 'cal-d' + (has ? ' has' : '') + (ds === tStr ? ' today' : '') + (ds === curDate ? ' on' : '');
    html += '<button class="' + cls + '" data-d="' + ds + '"' + (has ? '' : ' disabled') + '>' + d + '</button>';
  }
  const tail = (7 - (lead + dim) % 7) % 7;
  for (let d = 1; d <= tail; d++) {
    html += '<button class="cal-d dim" disabled>' + d + '</button>';
  }
  $('calGrid').innerHTML = html;
  $('calGrid').querySelectorAll('.cal-d[data-d]').forEach(b => {
    b.onclick = () => {
      calHide();
      pickDate(b.dataset.d);   // 本地先高亮，数据回来再换内容
    };
  });
}

/* 与分组长图同源的 8 色循环：每个师门一种颜色， trunk（祖师+各大支支头）上色 */
const LN_THEMES = [
  { bg:'#fdeaf1', bd:'#f6a8c5', tc:'#e04f8a' },

/* 族谱音浪口径（2026-10-12）：daily / monthly / yearly，切换时带 period 重新拉 */
let lineagePeriod = 'daily';

async function loadLineage(period, signal) {
  if (period) lineagePeriod = period;
  let d;
  try {
    d = await api('/api/public/teams/' + TEAM + '/lineage?period=' + lineagePeriod, { signal });
  } catch (e) {
    /* 非师门成员：后端 403 + code=lineage_forbidden（2026-10-12 审计口径，产品口径是
       「族谱给有师门归属的人看」）。这是本人的正常态，不是地区门禁 —— 页面骨架/导航
       保留，只把内容区换成提示（原来落进 regionBlocked 会把整页换成地区门禁文案，
       紧接着 $('mhSub') 取不到元素 → 整个页面挂掉）。 */
    if (e && e.code === 'lineage_forbidden') {
      $('mhSub').textContent = 'LINEAGE';
      $('view').innerHTML = '<div class="empty" style="padding-top:80px">' +
        '<span class="big">🔒</span><b>族谱仅对师门成员开放</b><br>' +
        '有师傅或徒弟的账号才能查看师门树。</div>';
      return;
    }
    throw e;
  }
  lineageNodes = d.nodes || [];
  $('mhSub').textContent = 'LINEAGE ' + lineageNodes.length + ' 人';
  lineageQ = ''; lnHitIdx = 0; lnAllOpen = true;
  renderLineage(false);
}

/** 树布局（横向，从左到右）：祖师在最左，一代向右一列；同层按子树大小排，
    父节点纵向居中于最上/最下子节点之间。叶节点各占一行。 */
function layoutLineage() {
  const byId = new Map(lineageNodes.map(n => [n.id, Object.assign({}, n, { kids: [], th: null, depth: 0, x: 0, y: 0 })]));
  const roots = [];
  for (const n of byId.values()) {
    if (n.masterId != null && byId.has(n.masterId)) byId.get(n.masterId).kids.push(n);
    else roots.push(n);
  }
  /* 没师傅又没徒弟的散人不上树（有徒弟的师门根保留：那是每棵树的头）。
     注意只从 byId 里摘掉，lineageNodes 原样保留，导出图底部的名单还要用。 */
  for (const n of [...byId.values()]) {
    if (n.masterId == null && n.kids.length === 0) byId.delete(n.id);
  }
  const visRoots = roots.filter(r => byId.has(r.id));
  const size = (n) => 1 + n.kids.reduce((s, k) => s + size(k), 0);
  const sortRec = (n) => {
    n.kids.sort((a, b) => size(b) - size(a) || a.name.localeCompare(b.name, 'zh-Hans-CN'));
    n.kids.forEach(sortRec);
  };
  roots.sort((a, b) => size(b) - size(a) || a.name.localeCompare(b.name, 'zh-Hans-CN'));
  roots.forEach(sortRec);
  const COL = 132, ROW = 62, PAD = 48;
  let cursor = PAD, maxDepth = 0;
  const place = (n, depth, th) => {
    n.depth = depth; n.th = th;
    maxDepth = Math.max(maxDepth, depth);
    if (!n.kids.length) { n.y = cursor + ROW / 2; cursor += ROW; }
    else { n.kids.forEach(k => place(k, depth + 1, th)); n.y = (n.kids[0].y + n.kids[n.kids.length - 1].y) / 2; }
    n.x = PAD + depth * COL;
  };
  visRoots.forEach((r, i) => place(r, 0, LN_THEMES[i % LN_THEMES.length]));
  return { byId, roots: visRoots, width: PAD * 2 + maxDepth * COL + 88, height: Math.max(cursor + PAD, 300) };
}

/** 祖师 → 自己 的链上所有人 */
function chainSet(byId, id) {
  const s = new Set();
  let cur = id, guard = 0;
  while (cur != null && byId.has(cur) && guard++ < 60) { s.add(cur); cur = byId.get(cur).masterId; }
  return s;
}

/* ---- 画布视图：平移/缩放/定位（顶层函数，按钮和手势共用） ---- */
function lnApply() {
  const vp = $('lnVp');
  if (vp) vp.setAttribute('transform', 'translate(' + lnView.x + ',' + lnView.y + ') scale(' + lnView.s + ')');
}
function lnZoomAt(px, py, k) {
  const v = lnView;
  const ns = Math.min(2.5, Math.max(0.22, v.s * k));
  const real = ns / v.s;
  v.x = px - (px - v.x) * real;
  v.y = py - (py - v.y) * real;
  v.s = ns;
  lnApply();
}
/** 把某人带到画布正中（搜索定位用），必要时稍微放大 */
function lnFocus(id) {
  const wrap = $('lnWrap');
  const n = lnById.get(id);
  if (!wrap || !n) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  lnView.s = Math.max(lnView.s, 0.85);
  lnView.x = w / 2 - n.x * lnView.s;
  lnView.y = h / 2 - n.y * lnView.s;
  lnApply();
}
