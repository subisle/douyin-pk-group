  /* 无卡片的信息型子页（隐私/关于）：就地渲染内容卡
     （修复6③：MY_SUB_INFO 定义里本就没有卡片键，!MY_SUB_CARDS[sub] 是恒真判断，
     保留只是噪音——改为直接判 MY_SUB_INFO[sub]） */
  if (MY_SUB_INFO[sub]) {

    card.innerHTML = '<div class="sec">' + esc(meta.title) + '</div><div style="padding:0 1rem 1rem">' +

          '手机号仅用于登录与微信推送，不在任何页面公开展示。推送图上的水印只压收件人艺名，' +
          '用于数据溯源。绑定审计提交的抖音号截图仅管理员可见。</div>'
        : '<div class="sub" style="line-height:1.8">主播数据日报 · 内部系统 v7.10-FINAL。<br>' +
          '数据每晚 24:00 后入库前一天；推送图带收件人专属隐形水印（可溯源）。' +
          '遇到问题请在「我的」页联系运营帅帅。</div>') +

/* ==================== 「我的」页内：重置密码对话框（2026-10-15 契约 A） ====================
   已登录身份下自己重置密码，不再走手机号重置（手机号重置只保留在未登录的登录门「忘记密码」）。
   接口（冻结契约）：POST /api/public/my/password
     Headers: X-My-Token: <token>（身份**只**认这个头）
     Body:    {"newPass":"..."}（不再要 oldPass；带了也忽略）
     200 → {ok:true, token:"<新的 my token>"}；400 → {error:"...具体文案..."}；401 → 登录已过期
   成功后后端吊销全部旧 token：必须用响应里的 token 覆盖本地登录态（setMyToken），
   否则用户会被立刻踢回登录门。
   前端先自校验（4~20 位字母或数字 + 两次一致），不满足就地提示、不发请求。 */
function openMyPwdDlg() {
  const old = $('myPwdMask');
  if (old) old.remove();   // 防重复弹层
  const mask = document.createElement('div');
  mask.id = 'myPwdMask';
  /* 行内样式：单文件 SPA 的对话框没有现成皮肤可套，照登录门 iOS 卡风格给一套 */
  mask.style.cssText = 'position:fixed;inset:0;z-index:95;background:rgba(11,28,48,.45);' +
    'display:flex;align-items:center;justify-content:center;padding:20px;';
  mask.innerHTML = '<div class="gate-box" style="max-width:360px">' +
    '<h3 style="font-size:19px">重置密码</h3>' +
    '<p class="tip">直接设置一个新的登录密码，不需要旧密码。<br>' +
    '改完旧的登录凭证立即失效，本机会自动换成新登录态，不用重新登录。</p>' +
    '<input id="myPwdNew" type="password" placeholder="新密码（4~20 位字母或数字）" autocomplete="new-password">' +
    '<input id="myPwdNew2" type="password" placeholder="确认新密码" autocomplete="new-password">' +
    '<div class="form-err hidden" id="myPwdErr" style="color:#F43F5E;font-size:13px;text-align:left;margin:6px 0"></div>' +
    '<div style="display:flex;gap:10px;margin-top:12px">' +
    '<button class="go gray" id="myPwdCancel" style="margin-top:0">取消</button>' +
    '<button class="go" id="myPwdGo" style="margin-top:0">重置密码</button></div></div>';
  document.body.appendChild(mask);
  mask.addEventListener('click', (e) => { if (e.target === mask) close(); });
  const close = () => mask.remove();
  $('myPwdCancel').onclick = close;
  ['myPwdNew', 'myPwdNew2'].forEach((id) => {
    $(id).onkeydown = (e) => { if (e.key === 'Enter') $('myPwdGo').click(); };
  });
  setTimeout(() => { const el = $('myPwdNew'); if (el) el.focus(); }, 60);
  $('myPwdGo').onclick = async () => {
    const newPass = ($('myPwdNew').value || '');
    const newPass2 = ($('myPwdNew2').value || '');
    const errEl = $('myPwdErr');
    const fail = (m) => {
      errEl.textContent = m;
      errEl.classList.remove('hidden');
    };
    errEl.classList.add('hidden');
    /* 前端先校验（与后端同口径）：不满足直接提示，不发请求。
       没有旧密码可比，所以不再校验「新旧相同」（后端也已不要求 oldPass）。 */
    if (!/^[A-Za-z0-9]{4,20}$/.test(newPass)) return fail('新密码必须是 4~20 位字母或数字');
    if (newPass !== newPass2) return fail('两次输入的新密码不一致');
    const btn = $('myPwdGo');
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const r = await fetch('/api/public/my/password', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
        body: JSON.stringify({ newPass: newPass }),   // 契约 A：body 只有 newPass
      });
      /* 401 = 登录已过期：按登录失效处理，收起对话框回登录门 */
      if (r.status === 401) { close(); sessionExpired(); return; }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      /* 后端已吊销全部旧 token：用新 token 覆盖本地全部 token 引用（setMyToken） */
      setMyToken(d.token);
      close();
      toast(d.token ? '密码已重置' : '密码已重置，请重新登录');
    } catch (e) {
      btn.disabled = false; btn.textContent = '重置密码';
      fail(e.message || '重置失败，稍后再试');
    }
  };
}

/* 追分设置入口行的右侧摘要（2026-10-12：没开追分开关 = 关；开了看目标数）。
   2026-10-15 任务一：未绑定不再返回「未绑定」装禁用 —— 后端 POST /my/push/targets
   本就不校验绑定状态，未绑定也能设目标，摘要要反映真实状态：
   · p 为 null（接口失败）→ 维持「未绑定」（真的什么状态都拿不到）；
   · 未绑定 → 「未绑定微信 · N 个目标 / 未绑定微信 · 未设目标」；
   · 已绑定 → 按既有口径：没开追分开关 = 关；开了看目标数。 */
function chaseSummary(p) {
  if (!p) return '未绑定';
  if (!p.bound) {
    const n = (p.targets || []).length;
    return n ? '未绑定微信 · ' + n + ' 个目标' : '未绑定微信 · 未设目标';
  }
  if (!p.notifyTarget) return '已关';
  const n = (p.targets || []).length;
  return n ? n + ' 个目标' : '已开 · 未设目标';
}

/* 段标题（与推送/追分卡里的 .card-t 小标题同一口径） */
function pushSecTitle(text) {
  return '<div class="card-t" style="margin:12px 0 2px;font-size:13px">' + text + '</div>';
}

/* ① 微信对接（2026-10-17 用户口径：两态极简，原三态/多段提示全部收拢）：
   · 状态 B 已对接（p.bound）：一行「✓ 已对接（昵称）」+「取消绑定」按钮；
     解绑只断推送接线、不注销扫码登录，重新对接不用再扫码（confirm 文案里说清）。
   · 状态 A 未对接（!p.bound，含 scanBound 旧态）：交给 pushUnboundHtml ——
     一句说明 + 「扫码对接」按钮。 */
function wechatBindHtml(p) {
  let h = pushSecTitle('微信对接');
  if (p.bound) {
    /* 昵称来自后端 scanNickname：用户换了号或代绑过也能看出推送发去哪 */
    const who = p.scanNickname ? '（' + esc(p.scanNickname) + '）' : '';
    h += '<div class="row"><span class="st ok">✓ 已对接' + who + '</span></div>';
    /* 推送失败原因只在真出过错时多一行，正常状态不给页面加行数 */
    if (p.lastError) {
      h += '<div class="hint">上次推送没成功：' + esc(p.lastError) + '</div>';
    }
    h += '<button class="go gray" id="pushUnbind" style="margin-top:10px">取消绑定</button>';
  } else {
    h += pushUnboundHtml(p);
  }
  return h;
}

/* 状态 A 未对接（2026-10-17 用户口径：极简，两行文案 + 一个按钮）：
   点「扫码对接」→ POST /my/push/wechat/start → 就地出二维码（imgContent 直接塞 <img>）
   + 4 位对接码（start 响应的 code 字段；admin 观看账号后端不下发 code，码块保持隐藏）
   + 2 秒轮询 poll，confirmed 即对接完成（onWxDockConfirmed → refreshPush 进状态 B）。
   scanBound 旧态（扫了码还没等微信确认）也归入状态 A：只说「等微信确认」，
   不再要求用户给机器人发消息激活；状态回流靠 bindPushBox 保留的 5 秒自动刷新。 */
function pushUnboundHtml(p) {
  let h = '';
  if (wxDockConfirmed) {
    /* 本次会话刚轮询到 confirmed：只钉一句成功（toast 会被重渲染冲掉）。
       正常情况 refreshPush 之后就是状态 B；万一还停在状态 A（后端 bound 还没翻转），
       5 秒自动回流会把页面带过去，这里不再重复「等确认」文案自相矛盾。 */
    h += '<div class="sub" style="margin-top:8px;line-height:1.75">✅ 对接成功</div>';
  } else {
    h += '<div class="sub" style="margin-top:8px;line-height:1.75">' +
      (p.scanBound
        ? '等微信确认，扫码后手机上点确认即可。'
        : '扫码对接微信后，提醒和日报会发到你的微信。') +
      '</div>';
  }
  h += '<button class="go gray" id="pushQrShow" style="margin-top:10px">扫码对接</button>' +
    '<div id="pushQrArea" class="hidden" style="margin-top:10px">' +
    /* 二维码卡（.qr-* 一套样式是原「扫码绑定」卡留下的：208px 白底 + 四角取景框 +
       状态行 + 倒计时），二维码与状态行由 startWxDock/pollWxDock 现填。 */
    '<div class="qr-frame"><i></i><div class="qr-wrap" id="pushWxQrWrap">' +
    '<img class="qrcode" id="pushWxQr" alt="微信对接二维码"></div><i></i></div>' +
    '<div class="qr-status wait" id="pushWxStatus"><span class="dot"></span>' +
    '<span id="pushWxStatusTx">二维码获取中…</span></div>' +
    '<div class="qr-expire" id="pushWxExpire"></div>' +
    '<button class="go gray hidden" id="pushWxRefresh" style="margin-top:8px">刷新二维码</button>' +
    /* 上游要求验证码时才出现（status = need_verifycode），官方流程的一部分，保留 */
    '<div class="hidden" id="pushWxVerifyWrap" style="margin-top:8px;text-align:left">' +
    '<div class="hint">微信让你输验证码：把微信里显示的数字填到这里。</div>' +
    '<input id="pushWxVerify" inputmode="numeric" autocomplete="one-time-code" ' +
    'placeholder="微信里显示的验证码" style="width:100%;height:42px;border:1px solid var(--hairline);' +
    'border-radius:12px;padding:0 12px;font-size:14px;margin-top:6px;background:#fff;color:var(--on-surface)">' +
    '<button class="go gray" id="pushWxVerifyGo" style="margin-top:6px">提交验证码</button></div>' +
    /* 4 位对接码：start 响应带 4 位 code 时由 fillPushCode 解开 hidden；
       admin 观看账号没有 code，这块永远不出现（正好满足「没有 code 就不显示码块」）。 */
    '<div class="hint wx-code-card hidden" id="pushCodeBox">' +
    '<div class="sub">4 位对接码（30 分钟内有效）</div>' +
    '<div class="wx-code-main"><b id="pushCodeValue">—</b>' +
    '<button class="go gray" id="pushCodeCopy" disabled>复制对接码</button></div>' +
    '<div class="qr-expire" id="pushCodeExpire">把对接码发给机器人也能对接</div>' +
    '<div id="pushCodeError" class="hidden" style="margin-top:6px;color:#b42318;font-weight:600"></div>' +
    '</div>' +
    '<button class="go gray hidden" id="pushCodeRetry" style="margin-top:6px">重新获取对接码</button>' +
    '</div>';
  return h;
}

/* 「扫码对接」按钮（2026-10-17 用户口径）：点一下**直接**调 start 出二维码 + 对接码，
   不再展开/收起两段式；「刷新二维码」兜底重取（上游抖动 / 二维码过期时用）。
   双击防抖看按钮自身 disabled（对接期间禁用），不用 wxDockQr 判断 ——
   那个值在流程结束/过期时不一定清掉，拿它当闸会把重试也挡住。 */
function bindPushQrShow() {
  const btn = $('pushQrShow'), area = $('pushQrArea');
  if (!btn || !area) return;
  btn.onclick = () => {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '对接中…';
    area.classList.remove('hidden');   // 二维码卡默认藏，点按钮才亮出来
    startWxDock();
  };
  const refresh = $('pushWxRefresh');
  if (refresh) refresh.onclick = () => startWxDock();
  const verifyGo = $('pushWxVerifyGo');
  if (verifyGo) verifyGo.onclick = () => wxDockPollNow();
  const copy = $('pushCodeCopy');
  if (copy) copy.onclick = copyPushCode;
  bindPushCodeRetry();
}

/* ===== 微信对接二维码（2026-10-17 用户口径）=====
   点「扫码对接」→ POST /my/push/wechat/start（后端转 openclaw-weixin 官方
   get_bot_qrcode）→ imgContent 是 data:image/svg+xml 的二维码图，直接塞 <img>；
   同一响应里的 code / codeExpires 由 fillPushCode 填 4 位对接码块。
   拿到就 2 秒一轮 POST /my/push/wechat/poll 看状态：wait/scaned/need_verifycode/
   expired/verify_code_blocked/scaned_but_redirect/binded_redirect/confirmed。
   confirmed = 后端已保存凭证 + 试发欢迎语 = 对接完成（不再要用户发消息激活）。
   计时器必须显式清（clearWxDock）：renderPushBox 每次重渲染都会换掉 #pushBox 的 DOM，
   残留的 setInterval/setTimeout 只会在已卸载节点上白写文案。 */
const WX_QR_TTL_MS = 5 * 60 * 1000; // 官方二维码约 5 分钟有效（与页面文案一致）
const PUSH_CODE_TTL_MS = 30 * 60 * 1000; // 后端对接码固定 30 分钟有效（兜底用）
let wxDockTimer = null;      // 状态轮询句柄
let wxDockTick = null;       // 有效期倒计时句柄
let pushCodeTick = null;     // 对接码倒计时句柄
let wxDockQr = '';           // 当前二维码标识（轮询必须带上）
let wxDockDeadline = 0;      // 有效期截止（毫秒时间戳）
let wxDockConfirmed = false; // 本次会话刚对接成功：重渲染后仍显示一句「对接成功」

function clearWxDock() {
  clearTimeout(wxDockTimer); clearInterval(wxDockTick);
  wxDockTimer = null; wxDockTick = null;
}

function clearPushCodeTimer() {
  clearInterval(pushCodeTick);
  pushCodeTick = null;
}

/* 状态行（.qr-status 三态色：wait 琥珀呼吸 / scaned 绿 / ok 绿加粗 / bad 红） */
function wxStatusSet(kind, text) {
  const box = $('pushWxStatus'), tx = $('pushWxStatusTx');
  if (!box) return;
  box.className = 'qr-status ' + kind;
  if (tx) tx.textContent = text;
}

/* 二维码倒计时：每 5 分钟失效一次（官方口径），剩 30 秒变红，到点给「刷新」 */
function startWxCountdown() {
  clearInterval(wxDockTick);
  const render = () => {
    const exp = $('pushWxExpire');
    if (!exp) { clearInterval(wxDockTick); return; }   // 节点没了（收起/重渲染）
    const left = Math.max(0, wxDockDeadline - Date.now());
    if (!left) { clearInterval(wxDockTick); onWxQrExpired(); return; }
    const sec = Math.ceil(left / 1000);
    exp.textContent = '二维码 ' + Math.floor(sec / 60) + ' 分 ' + pad2(sec % 60) + ' 秒后失效';
    exp.classList.toggle('soon', sec <= 30);
  };
  render();
  wxDockTick = setInterval(render, 1000);
}

/* 取二维码：失败（上游抖动 / 401 之外的 400）也要给「刷新」按钮，不能把这块卡死 */
async function startWxDock() {
  clearWxDock();
  wxDockQr = '';
  wxDockConfirmed = false;
  const img = $('pushWxQr');
  if (img) { img.removeAttribute('src'); img.alt = '微信对接二维码'; }
  const wrap = $('pushWxQrWrap');
  if (wrap) wrap.classList.remove('qr-live');
  $('pushWxRefresh')?.classList.add('hidden');
  $('pushWxVerifyWrap')?.classList.add('hidden');
  if ($('pushWxVerify')) $('pushWxVerify').value = '';
  const exp = $('pushWxExpire');
  if (exp) { exp.textContent = ''; exp.classList.remove('soon'); }
  wxStatusSet('wait', '二维码获取中…');
  try {
    const d = await postPush('/wechat/start', {});
    if (!$('pushWxStatus')) return;          // 展开期间被收起 / 重渲染：结果丢掉
    wxDockQr = d.qrcode || '';
    if (!wxDockQr) throw new Error('微信接口没有返回二维码');
    const imgContent = typeof d.imgContent === 'string' ? d.imgContent.trim() : '';
    if (!imgContent) throw new Error('微信接口没有返回二维码图形');
    if (img) img.src = imgContent;
    if (wrap) wrap.classList.add('qr-live');
    wxDockDeadline = Date.now() + WX_QR_TTL_MS;
    /* 响应里带 4 位 code 就直接填码块（admin 观看账号 code 为空 → 码块保持隐藏） */
    fillPushCode(d);
    wxStatusSet('wait', '等待扫码…');
    startWxCountdown();
    pollWxDock();
  } catch (e) {
    wxStatusSet('bad', '二维码没取到：' + (e.message || '未知错误'));
    $('pushWxRefresh')?.classList.remove('hidden');
    wxDockGoReenable();   // start 失败也允许直接再点「扫码对接」重试
  }
}

/* 安排下一轮状态轮询（2 秒一轮）。节点没了就自然停（收起 / 重渲染都会清计时器）。 */
function pollWxDock() {
  clearTimeout(wxDockTimer);
  wxDockTimer = setTimeout(wxDockPollOnce, 2000);
}

/* 二维码流程作废（过期 / 验证码拉黑）后恢复「扫码对接」主按钮可点（2026-10-17） */
function wxDockGoReenable() {
  const goBtn = $('pushQrShow');
  if (goBtn) { goBtn.disabled = false; goBtn.textContent = '扫码对接'; }
}

/* 立刻轮询一次（点「提交验证码」走这里：等 2 秒才发像是卡住了，用户会连点）。
   排队的下一轮先取消，跑完由 wxDockPollOnce 末尾照常续上，任何时刻至多一个待触发计时器。 */
function wxDockPollNow() {
  clearTimeout(wxDockTimer);
  wxDockPollOnce();
}

/* 轮询一次状态，末尾自己续下一轮。有验证码输入时按 verify_code 一起带上
   （need_verifycode 的解法：后端透传给官方 get_qrcode_status）。 */
async function wxDockPollOnce() {
  if (!wxDockQr || !$('pushWxStatus')) return;  // 收起 / 重渲染：不再续轮询
  const verify = $('pushWxVerify') ? $('pushWxVerify').value.trim() : '';
  let d;
  try {
    d = await postPush('/wechat/poll', verify
      ? { qrcode: wxDockQr, verifyCode: verify }
      : { qrcode: wxDockQr });
  } catch (e) {
    /* 400 = 后端判定二维码会话已过期（pending 会话 5 分钟 TTL）→ 给刷新 */
    if (e.status !== 400) {
      wxStatusSet('bad', '状态查询暂时失败，继续等待…');
      pollWxDock();
      return;
    }
    clearWxDock();
    wxStatusSet('bad', '二维码已失效，点下面刷新');
    $('pushWxRefresh')?.classList.remove('hidden');
    wxDockGoReenable();
    return;
  }
  const st = d.status || 'wait';
  if (st === 'confirmed') { onWxDockConfirmed(d); return; }
  if (st === 'expired') { onWxQrExpired(); return; }
  if (st === 'scaned') wxStatusSet('scaned', '已扫码，请在手机上确认…');
  else if (st === 'need_verifycode') {
    $('pushWxVerifyWrap')?.classList.remove('hidden');
    wxStatusSet('wait', '微信要求输入验证码');
  } else if (st === 'verify_code_blocked') {
    clearWxDock();
    wxStatusSet('bad', '验证码连续不对，二维码作废了');
    $('pushWxRefresh')?.classList.remove('hidden');
    wxDockGoReenable();
    return;
  } else if (st === 'scaned_but_redirect') {
    wxStatusSet('scaned', '已扫码，正在切换服务器继续等待…');
  } else if (st === 'binded_redirect') {
    /* 官方语义：这个微信之前已经连过本机器人。凭证这次拿不到，只能等上游再给
       confirmed；一直不来的话倒计时到点会引导刷新（换一个二维码再扫）。 */
    wxStatusSet('scaned', '这个微信之前对接过，正在同步…');
  } else wxStatusSet('wait', '等待扫码…');
  pollWxDock();
}

function onWxQrExpired() {
  clearWxDock();
  wxStatusSet('bad', '二维码已失效');
  const exp = $('pushWxExpire');
  if (exp) { exp.textContent = '二维码 5 分钟有效，点下面刷新'; exp.classList.remove('soon'); }
  const wrap = $('pushWxQrWrap');
  if (wrap) wrap.classList.remove('qr-live');
  $('pushWxRefresh')?.classList.remove('hidden');
  wxDockGoReenable();
}

/* 对接成功（2026-10-17 口径：confirmed 即完成，后端保存凭证 = bound 随之变 true）：
   停轮询、钉一句成功、刷新推送状态直接进状态 B（onWxDockConfirmed 先置
   wxDockConfirmed=true，refreshPush 重渲染后状态 A 分支显示「✅ 对接成功」，
   随后 p.bound=true 换成状态 B 的「✓ 已对接（昵称）」）。 */
function onWxDockConfirmed(d) {
  clearWxDock();
  clearPushCodeTimer();
  wxDockConfirmed = true;
  wxStatusSet('ok', '✅ 对接成功');
  const wrap = $('pushWxQrWrap');
  if (wrap) wrap.classList.remove('qr-live');
  const exp = $('pushWxExpire');
  if (exp) { exp.textContent = ''; exp.classList.remove('soon'); }
  $('pushWxVerifyWrap')?.classList.add('hidden');
  $('pushWxRefresh')?.classList.add('hidden');
  $('pushCodeBox')?.classList.add('hidden');
  $('pushCodeRetry')?.classList.add('hidden');
  wxDockGoReenable();
  toast(d && d.welcome === false ? '对接成功（欢迎语稍后到）' : '对接成功');
  refreshPush();
}

/* 4 位对接码（2026-10-17 口径）：不再单独打 POST /my/push/code ——
   POST /my/push/wechat/start 的响应里就带 code / codeExpires（后端同源生成），
   startWxDock 拿到响应直接调本函数填码块；取不到码时走 start 的状态行 + 刷新按钮，
   不再单设一条码的报错路径。
   admin 观看账号后端 code 返回空串，正则不过 → 码块保持 hidden，
   整个对接只走扫码一条路（满足「没有 code 就不显示码块」）。 */
function pushCodeDeadline(expires) {
  const parsed = Date.parse(String(expires || '').replace(' ', 'T'));
  return Number.isFinite(parsed) ? parsed : Date.now() + PUSH_CODE_TTL_MS;
}

function startPushCodeCountdown(deadline) {
  clearPushCodeTimer();
  const render = () => {
    const exp = $('pushCodeExpire');
    if (!exp) { clearPushCodeTimer(); return; }
    const left = Math.max(0, deadline - Date.now());
    if (!left) {
      clearPushCodeTimer();
      exp.textContent = '对接码已失效，点下面重新获取';
      exp.classList.add('soon');
      $('pushCodeCopy').disabled = true;
      $('pushCodeRetry')?.classList.remove('hidden');
      return;
    }
    const sec = Math.ceil(left / 1000);
    exp.textContent = Math.floor(sec / 60) + ' 分 ' + pad2(sec % 60) + ' 秒后失效';
    exp.classList.toggle('soon', sec <= 30);
  };
  render();
  pushCodeTick = setInterval(render, 1000);
}

async function copyPushCode() {
  const code = ($('pushCodeValue')?.textContent || '').trim();
  if (!/^\d{4}$/.test(code)) return;
  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(code);
    } else {
      const fallback = document.createElement('textarea');
      fallback.value = code;
      fallback.setAttribute('readonly', '');
      fallback.style.position = 'fixed';
      fallback.style.opacity = '0';
      document.body.appendChild(fallback);
      fallback.select();
      if (!document.execCommand('copy')) throw new Error('copy failed');
      fallback.remove();
    }
    toast('已复制对接码');
  } catch (_) {
    toast('复制失败，请手动复制');
  }
}

function fillPushCode(d) {
  const box = $('pushCodeBox');
  if (!box) return;
  clearPushCodeTimer();
  const code = String(d.code || '').trim();
  /* admin 观看账号 / 后端没给码：码块保持 hidden，整个对接只走扫码一条路 */
  if (!/^\d{4}$/.test(code)) return;
  box.classList.remove('hidden');
  $('pushCodeValue').textContent = code;
  $('pushCodeCopy').disabled = false;
  $('pushCodeExpire').textContent = '30 分钟内有效';
  $('pushCodeExpire').classList.remove('soon');
  $('pushCodeError').textContent = '';
  $('pushCodeError').classList.add('hidden');
  $('pushCodeRetry')?.classList.add('hidden');
  startPushCodeCountdown(pushCodeDeadline(d.codeExpires));
}

/* 失败重取按钮：start 重跑一遍（重新取二维码 + 对接码） */
function bindPushCodeRetry() {
  const retry = $('pushCodeRetry');
  if (retry) retry.onclick = () => startWxDock();
}

/* ② 推送开关（2026-10-17 口径：只属于状态 B —— p.bound 时才渲染本段；
   状态 A 的开关置灰与提示文案整段删除，页面极简）。
   bot 支持的全部个人开关：notifyTarget / dailyReport / lineageReport。
   lineageReport 仅 hasDisciples 为真时显示（没有徒弟就完全不出现），保持既有口径。 */
function pushFlagsHtml(p) {
  /* 状态 A（未对接）：开关一个都不出 —— 对接完成刷新后自然出现 */
  if (!p.bound) return '';
  let h = pushSecTitle('推送开关');
  h += '<label class="sw"><input type="checkbox" id="swTarget"' +
    (p.notifyTarget ? ' checked' : '') + (p.admin ? ' disabled' : '') +
    '> 追分提醒（追上 / 还差多少）</label>';
  h += '<label class="sw"><input type="checkbox" id="swDaily"' +
    (p.dailyReport ? ' checked' : '') + '> 每日报告（当天音浪排行榜）</label>';
  /* 师门日报第三开关（docs/23 §4.3）：仅名下有直系徒弟的人显示（hasDisciples）。
     兼容期后端还没下发 hasDisciples 时按 false 处理 = 不显示，开关自然回退两开盖。 */
  if (p.hasDisciples) {
    h += '<label class="sw"><input type="checkbox" id="swLineage"' +
      (p.lineageReport ? ' checked' : '') + '> 师门日报（徒弟音浪对比）</label>';
  }
  /* 管理员观看账号说明：追分开关为什么置灰（追分目标表单在「追分设置」独立卡） */
  if (p.admin) {
    h += '<div class="sub" style="margin-top:10px;line-height:1.7">管理员观看账号没有自己的音浪，' +
      '不能设置追分目标，只能收每日报告。</div>';
  }
  return h;
}

/* 2026-10-15 契约 C 拆段沿革：原 pushBoundHtml → wechatBindHtml（段①「微信对接」）+
   pushFlagsHtml（段②「推送开关」）；2026-10-17 极简口径下段②只随状态 B（p.bound）出现，
   段③追分入口行（chaseEntryHtml）已整段删除。 */

/* 「追分设置」子页内容（2026-10-15 契约 B 口径：分数是分数，追人是追人）：
   拆成「目标分数」「目标人」两块，各自独立上限（GET /my/push 的 counts 字段），
   外加只读可删的「名次目标」。填进 #chaseBox，与「消息设置」卡各管各的。
   2026-10-15 task-7：「渲染 + 绑定」收敛到本函数内完成（末尾 bindChaseHandlers）——
   之前渲染在这里、绑定在 bindPushBox，结果 renderMy 里的一次二次渲染只换壳不绑事件，
   真机上追分按钮全部点不动。 */
function renderChaseBox(p) {
  const box = $('chaseBox');
  if (!box) return;
  /* 顶部状态行：绑定状态决定能不能真的收到提醒，目标本身任何时候都能设 */
  if (!p) { box.innerHTML = chaseErrHtml(); bindChaseRetry(); return; }
  const max = p.maxTargets || 5;
  const list = p.targets || [];
  const counts = p.counts || {};
  /* counts 是契约新增字段；后端没上线时按 targets 里 kind 现算兜底 */
  const cnt = (k) => {
    const v = counts[k];
    return Number.isFinite(Number(v)) ? Number(v) : list.filter((t) => t.kind === k).length;
  };
  let h = '';
  /* 2026-10-15 任务一：未绑定路径只提示、不禁用 —— 后端 POST /my/push/targets
     不校验绑定状态，目标先存着、绑定后提醒自动生效，所以三个目标块的输入框
     照常可编辑（绝不 disabled）。提示口径统一为「未绑定微信也能先设目标」；
     admin 观看账号仍维持禁止口径不动（下面那个 if）。 */
  if (!p.bound) {
    h += !p.channelConfigured
      ? '<div class="hint">微信推送暂未开放（管理员还没连接微信机器人），' +
        '未绑定微信也能先设目标，绑定后提醒自动生效。</div>'
      : p.scanBound
        ? '<div class="hint">微信还在待激活：未绑定微信也能先设目标，绑定后提醒自动生效。</div>'
        : '<div class="hint">未绑定微信也能先设目标，绑定后提醒自动生效；' +
          '也可以先去「消息设置」扫码绑定。</div>';
  }
  if (p.admin) {
    h += '<div class="sub" style="margin-top:6px;line-height:1.7">管理员观看账号没有自己的音浪，' +
      '不能设置追分目标。</div>';
    box.innerHTML = h;
    return;
  }
  const byKind = (k) => list.filter((t) => t.kind === k);
  h += chaseValueBlock(byKind('value'), cnt('value'), max);
  h += chasePersonBlock(byKind('person'), cnt('person'), max);
  h += chaseRankBlock(byKind('rank'), cnt('rank'));
  /* 「微信对接」入口行已撤（2026-10-17 用户口径）：卡间互跳不再交叉放置 ——
     「消息设置」页不放追分入口，「追分设置」卡也不放微信入口，
     两边的入口统一由「我的」列表页两行（myPushRow / myChaseRow）承担。 */
  box.innerHTML = h;
  /* 绑定必须紧跟这次 innerHTML，作为本函数的收尾动作（2026-10-15 task-7）：
     事件只对当前 DOM 节点有效，谁换了 innerHTML 谁就负责重绑。
     本函数是 #chaseBox 内容的唯一写入点，所以绑定放在这里 = 任何渲染路径都自带事件，
     且重复调用不会重复挂监听（innerHTML 换新节点，addEventListener 随旧节点一起消失），
     Enter 不会双提交。admin / 无卡 / 兜底重试三条早退路径在 return 之前，不经过这里。 */
  bindChaseHandlers(p);
}

/* 一行目标（三类共用）：目标文案 + 达成/还差状态 + 单个删除按钮 */
function chaseRowHtml(t) {
  /* 2026-10-12：person 目标 targetValue>0 = 用户设了自定义目标分（后端存的是原始值），
     label 里要把它显出来，不然用户看不出这个目标按什么比 */
  const label = t.kind === 'value' ? '🎯 本月音浪 ' + wan(t.targetValue)
    : t.kind === 'rank' ? '🏅 本月第 ' + t.targetValue + ' 名'
    : (t.targetValue > 0 ? '🏃 ' + esc(t.targetName) + ' · 目标 ' + wan(t.targetValue)
                         : '🏃 ' + esc(t.targetName));
  const state = t.hit ? '<span class="st ok">已达成</span>'
    : t.kind === 'rank'
      ? (t.lastGap > 0 ? '<span class="sub">还差 ' + t.lastGap + ' 名</span>' : '<span class="sub">未进榜</span>')
      : (t.lastGap > 0 ? '<span class="sub">还差 ' + wan(t.lastGap) + '</span>' : '');
  return '<div class="tgt"><span>' + label + '</span>' +
    '<span style="margin-left:auto">' + state + '</span>' +
    '<button class="x" data-del="' + t.id + '">✕</button></div>';
}

/* 目标分数块：输入框（单位万）+ 添加；满额置灰 + 「最多 N 个」 */
function chaseValueBlock(items, used, max) {
  const full = used >= max;
  let h = '<div class="card-t" style="margin:12px 0 2px;font-size:13px">目标分数（最多 ' + max +
    ' 个 · 已设 ' + used + ' 个 · 一律比本月累计）</div>';
  if (!items.length) {
    h += '<div class="sub" style="padding:6px 0">还没设目标分。填一个（单位：万），追上或差多少都会推给你。</div>';
  }
  h += items.map(chaseRowHtml).join('');
  if (full) {
    h += '<div class="hint">目标分数已满 ' + max + ' 个，先删掉一个再加。</div>' +
      '<input id="tkVal" inputmode="decimal" placeholder="本月音浪目标（万）" disabled>' +
      '<button class="go" id="tkValAdd" disabled>最多 ' + max + ' 个</button>';
  } else {
    h += '<input id="tkVal" inputmode="decimal" placeholder="本月音浪目标（万），例如 50">' +
      '<button class="go" id="tkValAdd">添加目标分数</button>';
  }
  return h;
}

/* 目标人块：本团主播搜索 + 多选勾选（一次最多 5 个）+ 批量添加；满额置灰 */
function chasePersonBlock(items, used, max) {
  const full = used >= max;
  let h = '<div class="card-t" style="margin:14px 0 2px;font-size:13px">目标人（最多 ' + max +
    ' 个 · 已设 ' + used + ' 个）</div>';
  if (!items.length) {
    h += '<div class="sub" style="padding:6px 0">还没追人。搜本团主播，勾选后一次加进去。</div>';
  }
  h += items.map(chaseRowHtml).join('');
  if (full) {
    h += '<div class="hint">目标人已满 ' + max + ' 个，先删掉一个再加。</div>' +
      '<div class="sr"><input id="tkQ" placeholder="搜本团主播名字" autocomplete="off" disabled>' +
      '<div class="sr-list hidden" id="tkList"></div></div>' +
      '<button class="go" id="tkBatchAdd" disabled>最多 ' + max + ' 个</button>';
    return h;
  }
  /* 剩下的额度：一次最多 5 个，且不能超过这一类剩余名额（后端按 person 计数硬拦） */
  const room = Math.min(5, max - used);
  return h +
    '<div class="sub" style="margin-top:6px">搜本团主播，可多选，一次最多 ' + room + ' 个</div>' +
    '<div class="sr"><input id="tkQ" placeholder="搜本团主播名字" autocomplete="off">' +
    '<div class="sr-list hidden" id="tkList"></div></div>' +
    '<div class="tk-sel" id="tkSel"><span class="sub">还没选人</span></div>' +
    '<div class="hint" id="tkPickedHint"></div>' +
    '<button class="go" id="tkBatchAdd" disabled>批量添加</button>';
}

/* 名次目标块：契约 B —— 只展示 + 可删，**不给新增入口**；没有则整块不渲染 */
function chaseRankBlock(items, used) {
  if (!items.length) return '';
  return '<div class="card-t" style="margin:14px 0 2px;font-size:13px">名次目标（' + used +
    ' 个 · 已停止新增，只可删除）</div>' +
    items.map(chaseRowHtml).join('');
}

/* 追分状态取不到时的兜底内容（照 pushErrHtml 口径，重试按钮独立命名避免撞车） */
function chaseErrHtml() {
  return '<div class="sub" style="margin-top:6px;line-height:1.75">' +
    '追分状态没取到，可能是网络慢。点下面重试。</div>' +
    '<button class="go gray" id="chaseRetry" style="margin-top:10px">重试</button>';
}

/* chase 卡兜底重试：重新拉一次 /my/push，成功就同时刷新追分卡与推送卡 */
function bindChaseRetry() {
  const retry = $('chaseRetry');
  if (!retry) return;
  retry.onclick = async () => {
    retry.disabled = true;
    retry.textContent = '重试中…';
    try {
      renderPushBox(await fetchPush());   // renderPushBox 内部会同步刷 chase 卡
    } catch (e) {
      retry.disabled = false;
      retry.textContent = '重试';
      toast(e.message || '还是没取到');
    }
  };
}

/* 2026-10-15 契约 B：原 pushAddHtml（三 tab：追主播 / 定音浪 / 追名次）整体移除——
   两个添加面板现在分别长在 chaseValueBlock / chasePersonBlock 里，名次不再有新增入口。 */

function bindPushBoundHandlers(p) {
  const swT = $('swTarget'), swD = $('swDaily'), swL = $('swLineage');
  const saveFlags = async () => {
    /* 2026-10-17 口径：追分提醒打开时一个目标都没有 → 不保存、开关不勾上，
       toast 指路后直接跳「追分设置」子页（mySub='chase'，与「我的」列表页同一跳转口径）。
       跳走前先把开关拨回 false：本页重渲染/回看时不会残留一个「假开」的勾。 */
    if (swT && swT.checked && !(p.targets || []).length) {
      swT.checked = false;
      toast('先去设置追分目标');
      mySub = 'chase';
      pushRoute();
      renderMySub();
      return;
    }
    try {
      await fetch('/api/public/teams/' + TEAM + '/my/push/settings', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
        body: JSON.stringify({
          token: myToken(),
          /* 三个开关每次全量带**当前值**（契约 C.2）：后端 my_push_settings 对
             notifyTarget/dailyReport 缺省按 false 落库（整行 UPDATE），只传改动的一个
             会把另外两个覆盖成关；lineageReport 缺省 = 不改动现值，所以更不能漏。
             开关没渲染（例如无徒弟时第三开关不显示）就回落到接口下发的现值，
             保证不会把线上的值静默改掉。 */
          notifyTarget: swT ? !!swT.checked : !!p.notifyTarget,
          dailyReport: swD ? !!swD.checked : !!p.dailyReport,
          lineageReport: swL ? !!swL.checked : !!p.lineageReport,
        }),
      }).then(async (r) => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      });
      toast('已保存');
    } catch (e) {
      toast(e.message || '保存失败');
      refreshPush();
    }
  };
  if (swT) swT.onchange = saveFlags;
  if (swD) swD.onchange = saveFlags;
  if (swL) swL.onchange = saveFlags;

  /* 「取消绑定」（2026-10-17 改名，原「解除绑定」）：confirm 后 POST /my/push/unbind
     → refreshPush 回状态 A。后端只断推送接线、不注销扫码登录，重新对接不用再扫码。 */
  const unbind = $('pushUnbind');
  if (unbind) {
    unbind.onclick = async () => {
      if (!confirm('取消绑定后不再收到推送，确定吗？')) return;
      unbind.disabled = true;
      try {
        await fetch('/api/public/teams/' + TEAM + '/my/push/unbind', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: myToken() }),
        }).then(async (r) => {
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        });
        toast('已取消绑定');
        /* 「本次会话刚对接成功」的标记一并清掉：回状态 A 时不能再显示「✅ 对接成功」 */
        wxDockConfirmed = false;
        await refreshPush();
      } catch (e) {
        unbind.disabled = false;
        toast(e.message || '操作失败');
      }
    };
  }
}

/* 「追分设置」卡的事件（2026-10-15 契约 B 重写）：单个删除 + 目标分添加 +
   目标人「搜索 → 多选勾选 → 批量添加」。
   这里只绑事件，DOM 由 renderChaseBox 生成；bindPushBox 每次刷新都会重新调本函数，
   所以不要用 addEventListener（会叠加），统一用 onclick/oninput 覆盖式绑定。 */
function bindChaseHandlers(p) {
  /* 单个删除：三类目标共用（名次目标可删、不可新增） */
  document.querySelectorAll('#chaseBox [data-del]').forEach((b) => {
    b.onclick = async () => {
      try {
        await fetch('/api/public/teams/' + TEAM + '/my/push/targets/delete', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
          body: JSON.stringify({ token: myToken(), id: Number(b.dataset.del) }),
        }).then(async (r) => {
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        });
        toast('已删除');
        await refreshPush();
      } catch (e) {
        toast(e.message || '删除失败');
      }
    };
  });

  /* 2026-10-15 任务二的追分卡「微信对接」入口（chaseWechatGo）已随 2026-10-17
     极简口径整段撤掉：入口统一由「我的」列表页承担。 */

  /* Enter 直提（2026-10-12）：目标分输入框回车 = 点添加 */
  const enterSubmit = (inputId, btnId) => {
    const el = $(inputId), btn = btnId && $(btnId);
    if (el && btn) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
  };
  enterSubmit('tkVal', 'tkValAdd');

  /* ── 目标分数（kind=value）── */
  const valAdd = $('tkValAdd'), valInput = $('tkVal');
  /* 与下面「目标人」同口径（task-8 自查）：判满额看**输入框**是否 disabled，
     不看按钮的 disabled —— 按钮的 disabled 还可能是「提交中…」这类临时态，
     拿它当早退条件就是 task-8 那个真机缺陷的同型写法。
     满额时 chaseValueBlock 把输入框和按钮一起 disabled 并写「最多 N 个」，这里就不绑事件。 */
  if (valAdd && valInput && !valInput.disabled) {
    valAdd.onclick = async () => {
      const v = parseFloat($('tkVal').value);
      if (!(v > 0)) { toast('请输入大于 0 的目标（万）'); return; }
      valAdd.disabled = true;
      valAdd.textContent = '添加中…';
      try {
        await postPush('/my/push/targets', { kind: 'value', valueWan: v });
        toast('已添加');
        await refreshPush();
      } catch (e) {
        valAdd.disabled = false;
        valAdd.textContent = '添加目标分数';
        toast(e.message || '添加失败');
      }
    };
  }

  /* ── 目标人（kind=person）：多选勾选 + 批量添加 ── */
  const q = $('tkQ'), listEl = $('tkList'), batchBtn = $('tkBatchAdd');
  /* 只有「满额」才早退：满额时输入框和按钮一起 disabled、按钮文案是「最多 N 个」。
     ⚠️ 2026-10-15 task-8 真机缺陷：这里原来多了个 `batchBtn.disabled` 条件，可
     #tkBatchAdd 渲染出来**默认就是 disabled**（语义 =「还没选人」，由下面末尾的
     renderSel() 在选中后放开）——于是首次绑定直接 return，q.oninput / batchBtn.onclick /
     renderSel() 全都没执行：真机上搜索不出候选、选不了人、批量添加永远点不动。
     判满额只看输入框（q.disabled），「未选人」交给 renderSel() 管。 */
  if (!q || !listEl || !batchBtn || q.disabled) return;
  const max = (p && p.maxTargets) || 5;
  const listAll = (p && p.targets) || [];
  const counts = (p && p.counts) || {};
  const personUsed = Number.isFinite(Number(counts.person))
    ? Number(counts.person)
    : listAll.filter((t) => t.kind === 'person').length;
  /* 一次最多 5 个，且不超过「追人」这一类的剩余额度（后端按 person 计数硬拦） */
  const canPick = Math.max(0, Math.min(5, max - personUsed));
  const sel = chasePicked;   // 模块级暂存：刷新重渲染后勾选不丢
  let lastItems = [];        // 最近一次搜索结果：重渲染候选行时复用，避免再打请求

  const renderSel = () => {
    const selBox = $('tkSel');
    if (selBox) {
      selBox.innerHTML = sel.size
        ? Array.from(sel.entries()).map(([id, name]) =>
            '<span class="chip" data-unpick="' + id + '">' + esc(name) + ' ✕</span>').join('')
        : '<span class="sub">还没选人</span>';
      /* 点 chip 撤销该人 */
      selBox.querySelectorAll('[data-unpick]').forEach((el) => {
        el.onclick = () => { sel.delete(Number(el.dataset.unpick)); renderList(); renderSel(); };
      });
    }
    const hint = $('tkPickedHint');
    if (hint) hint.textContent = sel.size
      ? '已选 ' + sel.size + ' 个，还能再选 ' + Math.max(0, canPick - sel.size) + ' 个'
      : '';
    batchBtn.disabled = sel.size === 0;
    batchBtn.textContent = sel.size ? '批量添加（' + sel.size + ' 个）' : '批量添加';
  };

  const renderList = () => {
    if (!lastItems.length) { listEl.classList.add('hidden'); listEl.innerHTML = ''; return; }
    listEl.innerHTML = lastItems.map((a) => {
      const id = Number(a.personId);
      const on = sel.has(id);
      return '<div class="tk-opt" data-pid="' + id + '">' +
        '<input type="checkbox"' + (on ? ' checked' : '') +
        (!on && sel.size >= canPick ? ' disabled' : '') + '>' +
        '<span>' + esc(a.name) + '</span></div>';
    }).join('');
    listEl.classList.remove('hidden');
    listEl.querySelectorAll('.tk-opt').forEach((row) => {
      const id = Number(row.dataset.pid);
      const cb = row.querySelector('input');
      row.onclick = () => {
        if (sel.has(id)) {
          sel.delete(id);
        } else {
          /* 已选满（一次 5 个或本类剩余额度）→ 拒绝勾选并提示 */
          if (sel.size >= canPick) {
            toast(canPick <= 0 ? '追人目标已满 ' + max + ' 个'
              : '一次最多选 ' + canPick + ' 个（追人目标上限 ' + max + ' 个）');
            return;
          }
          const hit = lastItems.find((a) => Number(a.personId) === id) || {};
          sel.set(id, hit.name || String(id));
        }
        renderList(); renderSel();
      };
      /* checkbox 自身的 click 会再冒泡到 row.onclick 造成「勾一下又取消」：
         stopPropagation 后手动调一次行点击，保证只切换一次 */
      if (cb) cb.onclick = (e) => { e.stopPropagation(); row.onclick(); };
    });
  };

  q.oninput = () => {
    const key = q.value.trim();
    clearTimeout(pushChaseSrTimer);
    if (!key) { lastItems = []; renderList(); return; }
    pushChaseSrTimer = setTimeout(async () => {
      try {
        const d = await api('/api/public/teams/' + TEAM + '/my/push/search?q=' +
          encodeURIComponent(key));
        lastItems = d.items || [];
        if (!lastItems.length) {
          listEl.innerHTML = '<div class="none">本团没搜到这个人</div>';
          listEl.classList.remove('hidden');
          return;
        }
        renderList();
      } catch (e) {
        listEl.innerHTML = '<div class="none">' + esc(e.message || '搜索失败') + '</div>';
        listEl.classList.remove('hidden');
      }
    }, 220);
  };

  batchBtn.onclick = async () => {
    if (!sel.size) return;
    const ids = Array.from(sel.keys());
    batchBtn.disabled = true;
    batchBtn.textContent = '添加中…';
    try {
      const d = await postPush('/my/push/targets/batch', { personIds: ids });
      const added = d.added == null ? ids.length : d.added;
      const skipped = d.skipped || 0;
      toast('已添加 ' + added + ' 个' + (skipped ? '，跳过 ' + skipped + ' 个已有的' : ''));
      sel.clear();
      lastItems = [];
      q.value = '';
      await refreshPush();
    } catch (e) {
      batchBtn.disabled = false;
      batchBtn.textContent = '批量添加';
      toast(e.message || '添加失败');
    }
  };
  renderSel();
}

/* 旧「获取绑定码」独立按钮已撤（2026-10-16 第二轮）；2026-10-17 起对接码也

/** 推送设置的写接口（统一带 token 与错误处理）。

    targets/batch 等新路由指定走头）：两条路都留，少一条就会 401。 */
async function postPush(path, extra) {
  /* 2026-10-17 修正：/wechat/start 与 /wechat/poll 在后端注册在 /my/push/wechat/*
     下，前端拼接漏了 /my/push 段，报「接口不存在：/api/public/teams/all/wechat/start」。
     这里按契约补全；其余 path 本来就带 /my/push 前缀，不受影响。 */
  const prefix = path.startsWith('/my/push') ? '' : '/my/push';
  const r = await fetch('/api/public/teams/' + TEAM + prefix + path, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
    body: JSON.stringify(Object.assign({ token: myToken() }, extra)),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error(d.error || ('HTTP ' + r.status));
    e.status = r.status;

  }
  return d;

async function go() {
  show('err', false);
  /* 立刻给反馈：小菊花 + 内容压暗（数据没到不清空，到了再换）。
     乐观骨架只在内容为空时上，避免已看内容被闪没。 */
  const seq = ++loadSeq;
  busyOn();
  const optimistic = () => {
    if (view === 'data' && !listAll.length) $('view').innerHTML = '<div class="section">' + shimmerList() + '</div>';
  };
  optimistic();
  try {
  if (view === 'data') await loadData();
  else if (view === 'lineage') await loadLineage();
  else if (view === 'my') await loadMy();
  else await loadGroup();
    if (seq !== loadSeq) return;          // 期间用户又点了别的：过期响应作废
    consecutiveFail = 0;
    show('stale', false);
  } catch (e) {
    if (seq !== loadSeq) return;          // 过期失败的报错也不许盖住新内容
    consecutiveFail++;
    if (consecutiveFail >= 2) show('stale', true);
    /* 页面骨架可能已被整页接管（地区门禁 regionBlocked）：取不到就别硬写 */
    const mh = $('mhSub'), box = $('view');
    if (mh) mh.textContent = 'NETWORK';
    if (box) box.innerHTML = '<div class="empty"><span class="big">📶</span>暂时取不到数据<br>' +
      esc(e.message) + '</div>';
  } finally {
    if (seq === loadSeq) busyOff();
  }
}

/* 每分钟后台刷新，客户端加 ±10s 抖动：不加抖动的话所有人整点一起请求，服务端会尖峰 */
function scheduleRefresh() {
  clearTimeout(timer);
  const jitter = 60000 + (Math.random() * 20000 - 10000);
  timer = setTimeout(() => {
    /* lineage / my 不参与静默刷新：lineage 重建画布会丢缩放位置；
       my 是个人数据页，低频变化，且重建会打断用户正在输入的表单 */
    Promise.resolve(view === 'data' ? loadData()
      : (view === 'lineage' || view === 'my') ? null : loadGroup())
      .then(() => { consecutiveFail = 0; show('stale', false); })
      .catch(() => { consecutiveFail++; if (consecutiveFail >= 2) show('stale', true); })
      .finally(scheduleRefresh);
  }, jitter);
}

/* 图标白名单与后端 STEP_ICON_WHITELIST 一致；只允许走 class 名，不放任意字符串 */

/* 深链直达：?announce=N（或 #announce=N）从第 N 步打开。
   运营改完引导可以把链接直接发给用户看某一步，不用让人一路点过来。

   返回 0 起的步序号；没有深链或越界返回 -1。 */
function announceDeepStep(stepCount) {
  var m = /(?:[?&#])announce=(\d{1,2})(?!\d)/.exec(location.search + location.hash);

/* ---- spotlight 引导（2026-10-13）：step.target 指向具体元素时的定位逻辑 ---- */

/* target selector → 所属视图的映射：selector 命不中当前视图时先切页再定位。
   #my* → my；#navRow → 看按钮的 data-v 属性（分组页签→group、族谱页签→lineage、

   映射里没有的 selector 不切页。 */
function announceTargetView(sel) {
  if (!sel) return null;
  if (/^#my/.test(sel)) return 'my';
  if (/^#navRow/.test(sel)) {
    var b = null;
    try { b = document.querySelector(sel); } catch (_) {}
    var v = b && b.dataset ? b.dataset.v : null;
    return (v === 'group' || v === 'lineage' || v === 'my' || v === 'wechat') ? v : null;
  }
  if (/^\.seg\b|^\.st-row/.test(sel)) return 'data';
  return null;
}

/* target 指向的页面被后台关掉（如 groupEnabled=false 时 #navGroup 整体 hidden）：
   spotlight 找不到可见元素会自然回落居中卡片，但卡片文案里写着「点分组页签」就会误导。
   这里提前检测：目标元素是 hidden 或干脆不存在时，直接把整步跳过（自动滑到下一步），
   没有下一步就当这一步看完。返回 true 表示已跳过、调用方不要再 render。 */
function announceStepTargetMissing(steps, idxRef) {
  var s = steps[idxRef.idx] || {};
  var sel = s.target;
  if (!sel) return false;
  var el = null;
  try { el = document.querySelector(sel); } catch (_) {}
  var missing = !el || el.classList.contains('hidden')
    || el.offsetWidth <= 0 || el.offsetHeight <= 0;
  if (!missing) return false;
  if (idxRef.idx < steps.length - 1) {
    idxRef.idx++;
    return true;   // jump/render 由调用方继续
  }
  return false;    // 最后一步：留着走居中卡片，文案仍在
}

/* 上一步挂在目标元素上的 spotlight class / 贴位 class，步进与关闭时都要清干净 */
var announceSpotEl = null;
function clearAnnounceSpot() {

    announceSpotEl.classList.remove('guide-spot');
    announceSpotEl.style.zIndex = announceSpotEl.getAttribute('data-ann-z') || '';
    announceSpotEl.removeAttribute('data-ann-z');

/* 卡片贴位：按目标 rect 与剩余空间挑方向（下 > 上 > 右 > 左），都不够回落居中。
   贴位失败返回 false（调用方据此去掉方向 class，让卡片回到遮罩居中布局）。 */
function placeAnnounceCard(card, rect) {
  var cls = ['at-bottom', 'at-top', 'at-right', 'at-left'];
  cls.forEach(function (c) { card.classList.remove(c); });
  var m = 14, gap = 12;                       // 屏幕边距 / 卡片与目标间距
  var vw = window.innerWidth, vh = window.innerHeight;
  var top = rect.top, bottom = vh - rect.bottom, left = rect.left, right = vw - rect.right;
  var small = vw < 480;                        // 手机上竖屏：侧贴空间普遍不够
  card.style.left = card.style.top = card.style.right = card.style.bottom = '';
  card.style.maxWidth = '';
  var best = null;
  if (bottom >= 190 + gap && (!small || top < bottom)) best = 'at-bottom';
  else if (top >= 190 + gap) best = 'at-top';
  else if (!small && right >= 250 + gap && left < right) best = 'at-right';
  else if (!small && left >= 250 + gap) best = 'at-left';
  if (!best) return false;
  var bw = Math.min(352, vw - m * 2);
  card.style.maxWidth = bw + 'px';
  if (best === 'at-bottom' || best === 'at-top') {
    var ax = Math.min(Math.max(rect.left + rect.width / 2, m + bw / 2), vw - m - bw / 2);
    card.style.left = Math.round(ax - bw / 2) + 'px';
    card.style.top = best === 'at-bottom'
      ? Math.min(Math.round(rect.bottom + gap), vh - 120) + 'px'
      : Math.max(Math.round(rect.top - gap), 0) + 'px';
    card.style.transform = best === 'at-bottom' ? '' : 'translateY(-100%)';
    /* 箭头 x：相对卡片自身的偏移 = 目标中心 - 卡片左缘 */
    card.style.setProperty('--ax', Math.round(rect.left + rect.width / 2 - parseFloat(card.style.left)) + 'px');
  } else {
    var ay = Math.min(Math.max(rect.top + rect.height / 2, m + 90), vh - m - 90);
    card.style.top = Math.round(ay - 90) + 'px';
    card.style.left = best === 'at-right'
      ? Math.min(Math.round(rect.right + gap), vw - bw - m) + 'px'
      : Math.max(Math.round(rect.left - gap - bw), m) + 'px';
    card.style.setProperty('--ay', Math.round(Math.min(Math.max(rect.top + rect.height / 2, 90), 180)) + 'px');
  }
  card.classList.add(best);
  return true;
}
/* 渲染某一步时挂 spotlight：返回 true 表示进入贴位模式（遮罩变透明挖孔），
   false 表示找不到目标 / 放不下，回落旧的居中卡片。 */
function applyAnnounceSpot(box, card, sel) {
  clearAnnounceSpot();
  var spotMode = false;
  var el = null;
  if (sel) { try { el = document.querySelector(sel); } catch (_) { el = null; } }
  /* 显式挂着 hidden 的元素（如非当前视图的 toolbar）不算数 */
  if (el && el.classList.contains('hidden')) el = null;
  if (el && el.offsetWidth > 0 && el.offsetHeight > 0) {
    announceSpotEl = el;
    el.setAttribute('data-ann-z', el.style.zIndex || '');
    el.classList.add('guide-spot');
    el.style.zIndex = '102';
    /* 目标可能在长页面视口外（如我的页推送行）：先滚到可视区再量位置 */
    var vr = el.getBoundingClientRect();
    if (vr.top < 60 || vr.bottom > window.innerHeight - 60) {
      try { el.scrollIntoView({ block: 'center', behavior: 'instant' }); } catch (_) {}
    }
    /* 挂 class 后再量一次：guide-spot 的圆角/描边可能改变布局 */
    var rect = el.getBoundingClientRect();
    spotMode = placeAnnounceCard(card, rect);
    if (spotMode) {
      /* 读屏：把描述文本也用 aria-describedby 关联到目标元素本身 */
      try { el.setAttribute('aria-describedby', 'announceBody'); } catch (_) {}
    } else {
      /* 哪个方向都放不下：挖孔留着也意义不大，整个回落居中卡片 */
      clearAnnounceSpot();
      el.removeAttribute('aria-describedby');
    }
  }
  box.classList.toggle('ann-spot', spotMode);
  return spotMode;
}

function maybeAnnounce() {
  var a = site && site.announcement;
  if (!a || !a.enabled || !(a.steps && a.steps.length)) return;
  var box = $('announce');
  if (!box) return;
  var steps = a.steps;
  var closing = false;
  var deep = announceDeepStep(steps.length);
  var deepLinked = deep >= 0;
  /* 2026-10-17 用户口径「新手引导默认关闭」：前端总闸 GUIDE_ENABLED=false，
     正常进入不再弹引导（库里存量 announcement 配置 enabled=true 也被这道闸兜住）。
     return 插在深链计算之后、已读锁之前 —— 深链 ?announce=N 预览不受总闸影响仍能看。
     要恢复引导：把 GUIDE_ENABLED 改回 true 即可，后端 announcement 配置不用动。 */
  var GUIDE_ENABLED = false;
  if (!GUIDE_ENABLED && !deepLinked) return;
  /* 深链优先于已读判断：已读用户也要能通过别人发的链接预览某一步，
     所以这一行必须在版本守卫之前算出来，不能等 return 之后再解析。 */
  var idx = deepLinked ? deep : 0;
  if (!deepLinked) {
    var key = 'pk_announce_v';
    try {
      if (localStorage.getItem(key) === String(a.version)) return;
    } catch (_) {}
  }

  /* 关闭：锁版本 + 收动画。removeListeners 必须在 DOM 重建前摘干净，
     否则键盘 / 触摸监听会残留到下一页。 */
  var detach = [];
  function removeListeners() {
    detach.forEach(function (fn) { try { fn(); } catch (_) {} });
    detach = [];
  }
  function close() {
    if (closing) return;
    closing = true;
    clearTimeout(pushSrTimer);
    clearSwitching();
    removeListeners();
    /* 深链预览不落已读：看一眼链接不该把正式引导吃掉 */
    if (!deepLinked) {
      try { localStorage.setItem(key, String(a.version)); } catch (_) {}
    }
    announceCtx = null;
    clearAnnounceSpot();
    unlockScroll();
    box.classList.add('hidden');
    box.innerHTML = '';
    box.classList.remove('ann-spot');
    box.classList.remove('ann-overlay-in');
  }
  announceCtx = close;

  /* 内容渲染：白名单式富文本，绝不放原始 HTML。
     支持两种编辑习惯（都是运营在后台 textarea 里 Natural 会写的）：
       · 「· 」「- 」「1. 」开头的行 → 列表项
       · *星号包起来* → 加粗
     其余字符（含 < > & " '）一律走 esc 转义，所以注入面只剩这两个标记本身。 */
  function bodyHtml(s) {
    var raw = (s && s.content) ? String(s.content) : '';
    /* 快路：没有任何标记字符时直接转义返回，省掉拆行/建 DOM 的开销。
       命中判断必须覆盖全部三种标记（换行、星号、行首列表符）——
       早期版本漏了行首列表符，导致「· xxx」这种单行列表不走富文本路径。 */
    if (raw.indexOf('\n') < 0 && raw.indexOf('*') < 0
        && !/^\s*(?:[\u00b7\u2022-]|\d+[.、)])\s/.test(raw)) return esc(raw);
    var lines = raw.split('\n').map(function (ln) {
      var m = /^\s*(?:[·•\-]|\d+[.、)])\s+/.exec(ln);
      var li = m ? '<li>' + esc(ln.slice(m[0].length)).replace(/\*([^*\n]+)\*/g, '<b>$1</b>') + '</li>'
                 : esc(ln).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
      return { li: !!m, html: li };
    });
    var out = '', inList = false;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].li && !inList) { out += '<ul>'; inList = true; }
      if (!lines[i].li && inList) { out += '</ul>'; inList = false; }
      out += lines[i].li ? lines[i].html : '<p>' + (lines[i].html || '&nbsp;') + '</p>';
    }
    if (inList) out += '</ul>';
    return out;
  }
  function iconOf(s, i) {
    var ic = s && s.icon ? String(s.icon).trim() : '';
    return ANNOUNCE_ICONS.indexOf(ic) >= 0 ? ic : ANNOUNCE_ICONS[i % ANNOUNCE_ICONS.length];
  }

  /* 步进时若新步骤的 target 在别的视图里，先切页（data / my / group …）。
     go() 是 async：用轮询等目标视图真正渲染出来（上限 2.5s），数据一到就
     渲染 spotlight；超时也要渲染兜底，别让引导卡死在黑屏。
     等待期间卡片先收起，切完页再整卡淡入，避免卡片盖在空视图上闪烁。 */
  var switchingTimer = null, switchingPoll = null;
  function clearSwitching() {
    clearTimeout(switchingTimer); switchingTimer = null;
    clearInterval(switchingPoll); switchingPoll = null;
  }
  /* 目标此刻真的可定位：存在、没挂 hidden、有实际尺寸 */
  function targetReady(sel) {
    var el = null;
    try { el = document.querySelector(sel); } catch (_) {}
    return !!el && !el.classList.contains('hidden')
      && el.offsetWidth > 0 && el.offsetHeight > 0;
  }
  function jump(n) {
    if (n < 0) n = 0;
    if (n > steps.length - 1) n = steps.length - 1;
    if (n === idx) return;
    idx = n;
    var sel = (steps[idx] && steps[idx].target) || '';
    var need = announceTargetView(sel);
    if (need && need !== view) {
      clearAnnounceSpot();
      box.classList.add('hidden');
      box.innerHTML = '';
      box.classList.remove('ann-spot');
      try { switchView(need); } catch (e) { render(); return; }
      clearSwitching();
      var waited = 0;
      switchingPoll = setInterval(function () {
        waited += 120;
        if (targetReady(sel) || waited >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null; render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); render(); }, 2600);
      return;
    }
    /* 同视图：元素已经在了直接渲染；还没渲染出来（如 .st-row 行）等它出现 */
    if (sel && !targetReady(sel)) {
      clearSwitching();
      var w2 = 0;
      switchingPoll = setInterval(function () {
        w2 += 120;
        if (targetReady(sel) || w2 >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null; render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); render(); }, 2600);
      return;
    }
    render();
  }

  var firstOpen = true;
  function render() {
    clearSwitching();
    const isFirst = firstOpen;
    firstOpen = false;
    /* 深链直达的步骤：target 若在别的视图里，先切页再渲染（普通步进由 jump 管，
       深链绕过 jump，所以这里补一刀）。只处理一次：切页后 firstOpen 已翻 false。 */
    if (isFirst && deepLinked) {
      var s0 = steps[idx] || {};
      var v0 = announceTargetView(s0.target);
      if (v0 && v0 !== view) {
        try { switchView(v0); } catch (_) {}
      }
    }
    /* 目标被后台关掉的步骤自动滑过：指向的页签整个 hidden 时，挖孔没意义、
       文案还会误导用户去找一个不存在的按钮 —— 直接跳到下一步更干净。 */
    var idxRef = { idx: idx };
    if (announceStepTargetMissing(steps, idxRef)) {
      if (idxRef.idx === idx) return;   // 最后一步且目标缺失：不跳,照常渲染
      idx = idxRef.idx;
      render();
      return;
    }
    /* 深链首渲染：目标视图刚切过去、数据还在加载（如我的页推送行），
       和 jump 一样轮询等它出现（上限 2.5s），而不是立刻渲染成居中卡片。 */
    var sWait = steps[idx] || {};
    if (isFirst && deepLinked && sWait.target && !targetReady(sWait.target)) {
      var w0 = 0;
      switchingPoll = setInterval(function () {
        w0 += 120;
        if (targetReady(sWait.target) || w0 >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null;
          firstOpen = false;
          render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); firstOpen = false; render(); }, 2600);
      return;
    }
    removeListeners();
    var s = steps[idx] || {};
    var first = idx === 0;
    var last = idx === steps.length - 1;
    var ic = iconOf(s, idx);
    var html = bodyHtml(s);
    /* 纯文本才挂 rich：只有一行的文本加 rich 会丢掉用户手打的换行 */
    var isRich = /<(p|ul|li|b)>/.test(html);
    var dots = steps.map(function (_, i) {
      return '<button type="button" class="' + (i === idx ? 'on' : (i < idx ? 'done' : '')) +
        '" data-i="' + i + '" aria-label="第 ' + (i + 1) + ' 步"></button>';
    }).join('');
    box.innerHTML = '<div class="announce-box" role="dialog" aria-modal="true" ' +
      'aria-labelledby="announceTitle" aria-describedby="announceBody">' +
      '<div class="a-head">' +
        '<span class="a-chip">新功能</span>' +
        '<div class="a-ico"><span class="material-symbols-outlined">' + esc(ic) + '</span></div>' +
        '<h3 id="announceTitle">' + esc(s.title || ('第 ' + (idx + 1) + ' 步')) + '</h3>' +
      '</div>' +
      '<div class="a-body a-step-in' + (isRich ? ' rich' : '') + '" id="announceBody">' +
        html + '</div>' +
      '<div class="a-dots" id="announceDots">' + dots + '</div>' +
      '<div class="a-actions">' +
        (first ? '' : '<button class="a-prev" id="announcePrev">上一步</button>') +
        '<button class="a-ok" id="announceNext">' + (last ? '知道啦' : '下一步') + '</button>' +
      '</div>' +
      '<button class="a-skip" id="announceSkip">' + (last ? '关闭' : '跳过引导') + '</button>' +
      (steps.length > 1 ? '<div class="a-swipe-hint">左右滑动 / 按 ← → 键也可以翻页</div>' : '') +
      '</div>';
    box.classList.remove('hidden');
    box.classList.add('ann-overlay-in');

    /* spotlight：step.target 命中页面元素 → 挖孔 + 卡片贴位；否则保持居中卡片。
       贴位失败（元素太小放不下卡）时把方向 class 摘掉，让卡片回落遮罩居中。 */
    var cardEl = box.querySelector('.announce-box');
    var spotOn = applyAnnounceSpot(box, cardEl, s.target);
    if (!spotOn && cardEl) {
      ['at-bottom', 'at-top', 'at-right', 'at-left'].forEach(function (c) {
        cardEl.classList.remove(c);
      });
      cardEl.style.left = cardEl.style.top =
        cardEl.style.maxWidth = cardEl.style.transform = '';
    }

    $('announceNext').onclick = function () { last ? close() : jump(idx + 1); };
    /* 焦点落到主按钮：读屏用户进来就能听到「下一步」，键盘党直接回车。
        只在「引导首次打开」时抢焦点 —— jump() 翻页不抢，否则用户点步骤条
        回看某一步，焦点被强行挪到按钮上，读屏进度被打断。 */
    if (isFirst) {
      const nx = $('announceNext');
      try { nx.focus({ preventScroll: true }); } catch (_) { nx.focus(); }
    }
    var prev = $('announcePrev');
    if (prev) prev.onclick = function () { jump(idx - 1); };
    $('announceSkip').onclick = close;

    /* Pill 步骤条：点哪颗去哪步（已看过的步骤可回看，这是大厂引导的标配） */
    Array.prototype.forEach.call(box.querySelectorAll('#announceDots button'), function (b) {
      b.onclick = function () { jump(+b.dataset.i); };
    });

    /* 键盘：Esc 跳过，← → 翻页。只在引导开着时接管。 */
    function onKey(e) {
      if (closing) return;
      var k = e.key;
      if (k === 'Escape') { e.preventDefault(); close(); }
      else if (k === 'ArrowRight') { e.preventDefault(); jump(idx + 1); }
      else if (k === 'ArrowLeft') { e.preventDefault(); jump(idx - 1); }
    }
    document.addEventListener('keydown', onKey, true);
    detach.push(function () { document.removeEventListener('keydown', onKey, true); });

    /* 触屏：左右滑动翻页（阈值 45px，竖向滑动不抢）。 */
    var card = box.querySelector('.announce-box');
    var sx = 0, sy = 0, tracking = false;
    function onStart(e) {
      var t = e.touches && e.touches[0];
      if (!t) return;
      sx = t.clientX; sy = t.clientY; tracking = true;
    }
    function onEnd(e) {
      if (!tracking) return;
      tracking = false;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)) return;
      jump(idx + (dx < 0 ? 1 : -1));
    }
    if (card) {
      card.addEventListener('touchstart', onStart, { passive: true });
      card.addEventListener('touchend', onEnd, { passive: true });
      detach.push(function () {
        card.removeEventListener('touchstart', onStart);
        card.removeEventListener('touchend', onEnd);
      });
    }

    /* 点遮罩关闭；点在卡片内不关（避免误触把引导吃掉）。 */
    function onOverlay(e) { if (e.target === box) close(); }
    box.onclick = onOverlay;
    detach.push(function () { box.onclick = null; });
  }

  lockScroll();
  render();
}

/* ==================== 📩 管理员消息弹窗（docs/23 §6.1 / P3，msg- 前缀独立实现） ====================
   与引导弹窗的关系：视觉对齐（品牌头 / 圆角卡 / 主按钮），类名与逻辑完全独立，互不复用。
   数据契约（后端并行实现，任何失败一律静默）：
   · GET  /api/public/my/messages          （X-My-Token）→ {items:[{id,title,content,imageKind,date,createdAt}]}，只含未读
   · POST /api/public/my/messages/{id}/read（X-My-Token）→ {ok:true}，幂等
   · GET  /api/public/my/messages/{id}/image.png（X-My-Token）→ image/png，按收件人实时渲染（水印=本人姓名）
   行为约定：
   · 登录成功进「我的」主界面后探测一次；有未读才弹，无未读什么都不做
   · 弹窗内列表展示全部未读（最新在上），不做连续弹
   · 「知道了」逐条 POST read（allSettled，失败不阻塞关闭但 console.warn）→ 关闭
   · 单条也可先标已读；全部已读后自动关闭
   · 本次页面生命周期只自动弹一次（内存变量；「知道了」后不再弹）
   · token 未登录/过期 → 非 2xx 直接静默返回，绝不挡页面加载 */

/* 会话内防重弹：本次页面生命周期只自动弹一次；「知道了」/ 单条全读后也置 true */
let msgModalAutoShown = false;
/* 打开中的弹窗收起句柄（dismissMsgModal 用；登录门出现时主动让位） */
let msgModalCtx = null;

/* 单条消息的 date 字段过白名单：只放 数字/-/: 与空格，其余原样丢弃（防注入显示层）。
   形如 2026-10-14 的业务日与 2026-10-14 18:00 的展示时间都能通过；空/非法返回空串。 */
function msgSafeDate(v) {
  const s = String(v == null ? '' : v);
  if (!s) return '';
  const cleaned = s.replace(/[^0-9\-: ]/g, '').trim();
  return /^\d{4}-\d{2}-\d{2}([ ]\d{2}:\d{2}(:\d{2})?)?$/.test(cleaned) ? cleaned : '';
}

/* 拉未读消息：非 2xx（含 401 登录过期）/网络失败 → null，调用方静默忽略 */
async function fetchMyMessages() {
  try {
    const r = await fetch('/api/public/my/messages', { headers: myTokenHeaders() });
    if (!r.ok) return null;
    const d = await r.json().catch(() => null);
    if (!d || !Array.isArray(d.items)) return null;
    /* 只认带合法 id 的条目；title/content/date 缺省给空串，渲染端兜底 */
    return d.items.filter((it) => it && it.id != null)
      .map((it) => ({
        id: it.id,
        title: String(it.title || ''),
        content: String(it.content || ''),
        imageKind: String(it.imageKind || ''),
        date: String(it.date || ''),
        createdAt: String(it.createdAt || ''),
      }));
  } catch (_) {
    return null;   // 网络失败：静默，绝不挡页面
  }
}

/* 图片按需加载：fetch + blob + URL.createObjectURL（<img> 直接指 URL 会丢 X-My-Token 头）。
   成功 resolve URL；任何失败 resolve null（调用方显示占位文案，不挡正文）。 */
async function fetchMsgImage(id) {
  try {
    const r = await fetch('/api/public/my/messages/' + encodeURIComponent(String(id)) + '/image.png',
      { headers: myTokenHeaders() });
    if (!r.ok) return null;
    const b = await r.blob();
    if (!b || b.type.indexOf('image') !== 0) return null;
    return URL.createObjectURL(b);
  } catch (_) {
    return null;
  }
}

/* 逐条标已读：幂等；失败抛错（调用方 warn/降级），非 2xx 原样走失败分支 */
async function postMsgRead(id) {
  const r = await fetch('/api/public/my/messages/' + encodeURIComponent(String(id)) + '/read', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
    body: JSON.stringify({}),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}

/* 图片懒加载：item 未读且带 imageKind 才按需拉图；失败/无图显示占位文案，不挡正文。
   返回是否发起了加载（用于决定占位文案内容）。 */
function loadMsgImage(item, wrapEl) {
  let note = null;
  const showNote = (tx) => {
    if (!note) { note = document.createElement('div'); note.className = 'msg-img-note'; wrapEl.appendChild(note); }
    note.textContent = tx;   // textContent，绝不 innerHTML
  };
  if (!item.imageKind) { wrapEl.hidden = true; return false; }
  fetchMsgImage(item.id).then((url) => {
    if (!document.getElementById('msgModal').contains(wrapEl)) {
      if (url) URL.revokeObjectURL(url);   // 弹窗已关：直接回收
      return;
    }
    if (!url) { showNote('图片加载失败，稍后重试'); return; }
    const img = document.createElement('img');
    img.alt = '消息配图';
    img.onload = () => { wrapEl.style.minHeight = ''; };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      img.remove();
      showNote('图片加载失败，稍后重试');
    };
    img.src = url;
    wrapEl.style.minHeight = '120px';   // 加载中撑住高度，避免闪跳
    wrapEl.appendChild(img);
  });
  return true;
}

/** 打开消息弹窗：items 最新在上（服务端只发未读；顺序这里再保险一次）。
    title/content 一律 textContent 赋值，绝不 innerHTML 拼接用户内容。 */
function openMsgModal(items) {
  const box = $('msgModal');
  if (!box || !items || !items.length) return;
  const list = items.slice().sort((a, b) => {
    const da = String(a.createdAt || a.date || ''), db = String(b.createdAt || b.date || '');
    return da < db ? 1 : da > db ? -1 : 0;   // 最新在上；同刻按原序稳定
  });
  const card = document.createElement('div');
  card.className = 'msg-box';
  card.setAttribute('role', 'dialog');
  card.setAttribute('aria-modal', 'true');
  card.setAttribute('aria-labelledby', 'msgTitle');

  /* 品牌头（静态结构固定，无用户内容） */
  const head = document.createElement('div');
  head.className = 'msg-head';
  const chip = document.createElement('span');
  chip.className = 'msg-chip';
  chip.textContent = '管理员消息';
  const ico = document.createElement('div');
  ico.className = 'msg-ico';
  const icoSpan = document.createElement('span');
  icoSpan.className = 'material-symbols-outlined';
  icoSpan.textContent = 'campaign';
  ico.appendChild(icoSpan);
  const h3 = document.createElement('h3');
  h3.id = 'msgTitle';
  h3.textContent = '你有 ' + list.length + ' 条未读消息';
  head.appendChild(chip); head.appendChild(ico); head.appendChild(h3);
  card.appendChild(head);

  /* 消息列表（textContent 渲染，防注入） */
  const listEl = document.createElement('div');
  listEl.className = 'msg-list';
  const markOneRead = (item, btn) => {
    btn.disabled = true;
    postMsgRead(item.id).then(() => {
      btn.textContent = '已读';
      btn.classList.add('msg-read-done');
      item.__read = true;
      /* 全部已读 → 自动关闭（含一条的情况） */
      if (list.every((x) => x.__read)) closeMsgModal();
    }).catch((e) => {
      console.warn('[msgModal] 标记已读失败 id=' + item.id, e);
      btn.disabled = false;
      btn.textContent = '标已读';
    });
  };
  list.forEach((item) => {
    const li = document.createElement('div');
    li.className = 'msg-item';
    const top = document.createElement('div');
    top.className = 'msg-item-top';
    const t = document.createElement('div');
    t.className = 'msg-item-title';
    t.textContent = item.title || '（无标题）';
    top.appendChild(t);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'msg-read-btn';
    btn.textContent = '标已读';
    btn.onclick = () => markOneRead(item, btn);
    top.appendChild(btn);
    li.appendChild(top);
    const dt = msgSafeDate(item.date) || msgSafeDate(item.createdAt);
    if (dt) {
      const dEl = document.createElement('div');
      dEl.className = 'msg-item-date';
      dEl.textContent = dt;
      li.appendChild(dEl);
    }
    if (item.content) {
      const body = document.createElement('div');
      body.className = 'msg-item-body';
      body.textContent = item.content;   // 绝不 innerHTML
      li.appendChild(body);
    }
    if (item.imageKind) {
      const wrap = document.createElement('div');
      wrap.className = 'msg-img-wrap';
      li.appendChild(wrap);
      loadMsgImage(item, wrap);   // 按需 fetch blob，失败占位文案不挡正文
    }
    listEl.appendChild(li);
  });
  card.appendChild(listEl);

  /* 底部「知道了」：逐条 POST read（allSettled，幂等），失败不阻塞关闭 */
  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  const okBtn = document.createElement('button');
  okBtn.type = 'button';
  okBtn.className = 'msg-ok';
  okBtn.textContent = '知道了';
  okBtn.onclick = () => {
    okBtn.disabled = true;
    const pending = list.filter((x) => !x.__read);
    Promise.allSettled(pending.map((x) => postMsgRead(x.id))).then((rs) => {
      rs.forEach((r, i) => {
        if (r.status === 'rejected') console.warn('[msgModal] 已读回执失败 id=' +
          (pending[i] && pending[i].id), r.reason);
      });
      closeMsgModal();
    });
  };
  actions.appendChild(okBtn);
  card.appendChild(actions);

  if (list.length > 1) {
    const hint = document.createElement('div');
    hint.className = 'msg-swipe-hint';
    hint.textContent = '共 ' + list.length + ' 条，可逐条「标已读」，或一次「知道了」全部已读';
    card.appendChild(hint);
  }

  box.innerHTML = '';
  box.appendChild(card);
  box.classList.remove('hidden');
  box.classList.add('msg-overlay-in');
  lockScroll();
  /* 点遮罩不关（消息需要确认已读，误触遮罩关掉会丢「知道了」时机）；Esc 让位给登录门 */
  msgModalCtx = closeMsgModal;
  try { okBtn.focus({ preventScroll: true }); } catch (_) { okBtn.focus(); }
}

/** 关闭弹窗：回滚遮罩入场动画、解锁滚动、清 DOM 与句柄 */
function closeMsgModal() {
  const box = $('msgModal');
  msgModalCtx = null;
  msgModalAutoShown = true;   // 关过一次（含单条全读自动关）：本次页面不再自动弹
  if (!box) return;
  /* 回收列表里已生成的 blob URL：节点上取不到原始 url，逐个 img.src 撤销 */
  box.querySelectorAll('.msg-img-wrap img').forEach((img) => {
    if (img.src && img.src.indexOf('blob:') === 0) URL.revokeObjectURL(img.src);
  });
  box.classList.add('hidden');
  box.classList.remove('msg-overlay-in');
  box.innerHTML = '';
  unlockScroll();
}

/** 收起消息弹窗（登录门出现时调用，让位优先级更高的界面） */
function dismissMsgModal() {
  const box = $('msgModal');
  if (box && !box.classList.contains('hidden')) closeMsgModal();
  else if (msgModalCtx) { msgModalCtx = null; }
}

/** 登录成功进「我的」主界面后的探测入口：只自动弹一次，任何失败静默忽略。
    调用点：loadMy() 主数据渲染完成后（fire-and-forget，不 await，绝不挡主数据）。 */
async function probeMyMessages() {
  if (msgModalAutoShown) return;
  msgModalAutoShown = true;   // 先占位：本次页面生命周期只探测弹一次，失败也不重试
  const items = await fetchMyMessages();
  if (!items || !items.length) return;   // 无未读 / token 失效 / 网络失败：什么都不做
  if (!$('gate') || !$('gate').classList.contains('hidden')) return;   // 登录门开着：不叠层
  openMsgModal(items);
}

/* ==================== 🎉 彩带庆祝 + 📣 运营公告（2026-10-13 / items 2026-10-14） ====================
   数据契约（后端并行实现，前端按契约消费，拿不到就全关不显示）：
   · GET /api/public/announcements（无需登录）
       → { login:{enabled,text,icon}, celebrate:{enabled,confetti,title,name,wave},
           items:[{enabled,icon,title,name,wave,text,tone}] }   ← 登录前的公告条兜底
   · GET /api/public/teams/{TEAM}（site 接口）
       placements: { home:{enabled,text,icon}, my:{enabled,text,icon} }
       celebrate:  { enabled, confetti, title, name, wave }
       items:      [{enabled,icon,title,name,wave,text,tone}]   ← 公告条主数据源（顺序即从上到下）
   页面顶部公告（2026-10-17 口径）= renderAnnounceItems(items) + renderHomeAnnouncement(placements.home)
   都收进头部单行 #mhAnn；site.champ / site.celebrate 兼容期
   后端仍下发，但前端不再单独渲染横幅（否则同一条冠军信息会上下重复）。 */

let siteAnnouncements = {};   // /announcements 探测结果（失败 = {}，所有消费点 falsy 兜底）

/* 📣 头部公告行 #mhAnn 的轮换计时句柄（2026-10-17）：**全局唯一** —— 任何重渲染
   （bootRest 静默刷新 / 切视图回来）都先 mhAnnStopRotate() 清掉旧的再起新的，
   杜绝双份 interval 导致的单行公告闪烁与错拍。 */
let mhAnnRotateTimer = null;
/* 写入序号令牌：mhAnnShowItem 每次调用自增取号，挂起的 450ms 淡出重建到期时对号 ——
   号不对（期间又发生过收起 / 重渲染 / 更新一次轮换）就丢弃这帧，防止过期闭包把
   旧内容写回已经清空或换新的公告行（闪烁 / 幽灵内容）。 */
let mhAnnSeq = 0;
/* 最近一次 renderAnnounceItems 建好的单行轮换队列（含 renderHomeAnnouncement 追加的
   home 条）：switchView 切走时保留，切回数据视图时据此原样恢复（不用等网络）。 */
let mhAnnQueue = [];

/** 拉 announcements 配置：任何失败（404/网络/后端未上线）都回落为空对象，绝不挡启动 */
async function fetchAnnouncements() {
  const r = await fetch('/api/public/announcements');
  if (!r.ok) return {};
  const d = await r.json().catch(() => ({}));
  return d && typeof d === 'object' ? d : {};
}

/** 公告条统一 HTML（文案经 esc 转义；icon 只认文件内 ANNOUNCE_ICONS 白名单，
    白名单外的名字一律回默认图标 —— 与后端 STEP_ICON_WHITELIST 同一口径，防注入）
    2026-10-17 口径变更：cfg.icon 为空串或白名单外 → **不渲染图标 span**（设置
    「不显示图标」就真不显示，不再回默认图标兜底）。defIcon 参数保留在签名里
    （gate/my 两处调用方不动），函数内已不再使用。布局由 .ann-bar 的 flex 自然收缩，
    ann-ico 样式无需改动。 */
function annBarHtml(id, cfg, defIcon) {
  cfg = cfg || {};
  if (!cfg.enabled || !cfg.text) return '';   // 关着 / 没文案：不出（调用方空串直拼）
  const icon = ANNOUNCE_ICONS.indexOf(cfg.icon) >= 0 ? cfg.icon : '';
  return '<div class="ann-bar" id="' + id + '">' +
    (icon ? '<span class="material-symbols-outlined ann-ico">' + esc(icon) + '</span>' : '') +
    '<span class="ann-tx">' + esc(cfg.text) + '</span>' +
  '</div>';
}

/** 人名 → 名次姓名（2026-10-15 task-9②）：运营把前三位写在同一格时用
    「、,，/;；」或空白分隔（例如「狼哲、狼九、狼仔」），也可能留空位
    （「狼哲、、狼仔」= 第 2 名空缺）。这里切分 → trim → 只取前 3 个位置，
    **保留名次位置**（空位留成 ''）：这样第 3 名不会被顶成第 2 名；
    调用方只渲染非空项，所以空名次不占行。
    ⚠️ 分隔符里**不含 `|`**：`|` 是 champBanner 三段式（称号|人名|音浪）的专用分隔符，
    人名再按 `|` 切会和它撞车、串位（Lead 2026-10-15 复核口径）。 */
function splitRankNames(raw) {
  return String(raw == null ? '' : raw)
    .split(/[、,，\/;；\n]|\s+/)
    .map((s) => s.trim())
    .slice(0, 3);
}

/** 📣 头部公告行渲染（2026-10-17 用户口径改版）：原来把每条 enabled 渲染成一张竖排
    .ann-item 大卡（#annItems 顶部占近半屏、滚走前一直占位），现在全部压缩进 masthead
    内的单行胶囊 #mhAnn —— 随头部吸顶、只占一行；多条 = 4 秒间隔自动轮换，同一行内
    淡入淡出（interval 存全局句柄，重渲染先清，杜绝双份计时器闪烁）。
    契约（每条）：{ enabled, icon, title, name, wave, text, tone:'brand'|'plain', align, popup, seat, avatar }
    · 只渲染 enabled=true 的（公开接口已过滤一遍，这里再兜一道，防管理端形态喂）
    · 单条口径：一行取核心信息「🏆 title name·wave text」（🏆 = emoji_events 符号占位，
      name 切前三位取第一位 + wave>0 补 wan(wave)，段与段之间用 ' · ' 连接；text 换行压空格）
    · 多条：按数组顺序 4 秒轮换，行尾小字「当前序号/总数」；同一条内淡入淡出
    · tone=brand → 紫金渐变胶囊（.mh-ann.ai-brand）；其余/非法 → 浅紫白底胶囊
    · align / popup / seat / avatar 字段单行轮播条**不用**（弹窗逻辑走
      maybeAnnounceItemsPopup，保持原样；align 是大卡版式字段，单行无意义）
    · 图标按条目配置（2026-10-17 改口径）：item.icon 空串/未配 → **不出图标 span**；
      icon 有值且在 ANNOUNCE_ICONS 白名单内才显示 —— 不再回落 emoji_events/military_tech 默认图标
    · title/name/wave/text 全空 → 该条直接跳过
    · 显隐口径（2026-10-17，任务口径 e 选「switchView 控制显隐」）：渲染只填
      view==='data'；switchView 切走时 mhAnnCollapse 收起、切回 mhAnnRestore 按队列
      （mhAnnQueue）恢复，内容随 bootRest 静默刷新整包校准
    安全：全程 createElement + textContent，后端字符串一律不进 innerHTML（零注入面）；
    icon 只认页面 ANNOUNCE_ICONS 白名单（与后端 STEP_ICON_WHITELIST 同一口径）。 */
function renderAnnounceItems(items) {
  const box = $('mhAnn');
  if (!box) return;
  /* 公告挂数据看板：只填数据视图。非数据视图切走时由 switchView 统一收口
     （mhAnnCollapse：停轮换 + 清行 + hidden，队列 mhAnnQueue 保留供切回恢复）；
     若这里发现 view 已不是 data（深链 / bootRest 改道后的首次渲染），同样收起并返回。 */
  if (view !== 'data') {
    mhAnnCollapse();
    return;
  }
  /* 收集 enabled 且有内容的条目（跳过全空条），压成单行轮换队列 */
  const list = (Array.isArray(items) ? items : []).filter((it) => {
    if (!it || !it.enabled) return false;
    const title = String(it.title == null ? '' : it.title);
    const text = String(it.text == null ? '' : it.text);
    const picked = splitRankNames(it.name).filter((s) => s.length > 0);
    return !!(title || picked.length || text);
  });
  /* 空数组 / 全关：不在这里直接收起 —— placements.home 可能还开着（home 条自己
     就能撑起这一行）。只清掉 items 队列，行显隐交给行尾的「队列空则收起」兜底
     或 renderHomeAnnouncement（有 home 条时它会把行撑开并显示）。 */
  /* 队列条目 → 单行文本（🏆 title name·wave text 组合）+ 视觉档（brand/plain）+ 图标 */
  const queue = list.map((it) => {
    const title = String(it.title == null ? '' : it.title);
    const text = String(it.text == null ? '' : it.text).replace(/\s*\n+\s*/g, ' ').trim();
    const picked = splitRankNames(it.name).filter((s) => s.length > 0);
    const nm = picked.length ? picked[0] + (Number(it.wave) > 0 ? ' · ' + wan(it.wave) : '') : '';
    const segs = [title, nm, text].filter((s) => s.length > 0).map((s) => s.trim())
      .filter((s) => s.length > 0);
    const ic = String(it.icon == null ? '' : it.icon).trim();
    return {
      icon: (ic && ANNOUNCE_ICONS.indexOf(ic) >= 0) ? ic : '',   // 空 = 无图标（不出 span）
      brand: it.tone === 'brand',
      text: segs.join(' · ')
    };
  });
  /* 空数组 / 全关：items 部分直接清队列收起；placements.home 若还开着，紧接着的
     renderHomeAnnouncement 发现 mhAnnQueue 空但 home 有内容，会把行重新撑起并
     只显示 home 条（见其内注释）。同一 bootRest 帧内先后完成，不会闪。 */
  if (!queue.length) {
    mhAnnQueue = [];
    mhAnnCollapse();
    syncHeaderOffset();
    return;
  }
  mhAnnQueue = queue;   // 存全局：switchView 切走/切回时据此收起/恢复
  box.hidden = false;
  if (queue.length === 1) {   // 只有一条：直接显示，不轮换
    mhAnnStopRotate();
    mhAnnShowItem(box, queue[0], 0, 1);
    syncHeaderOffset();
    return;
  }
  /* 多条：4 秒间隔自动轮换。interval 是全局唯一句柄，任何重渲染（静默刷新 /
     切视图回来）都先 mhAnnStopRotate() 清掉旧的再起新的，杜绝双计时器闪烁。 */
  mhAnnStopRotate();
  let qi = 0;
  mhAnnShowItem(box, queue[0], 1, queue.length);
  mhAnnRotateTimer = setInterval(() => {
    qi = (qi + 1) % queue.length;
    mhAnnShowItem(box, queue[qi], qi + 1, queue.length);
  }, 4000);
  syncHeaderOffset();
}

/** 头部公告行：把第 idx/total 条 queue item 写进 #mhAnn（原地淡出→换内容→淡入）。
    内容全量重建（icon span + 文案 span + 多条时的序号角标），textContent 安全口径。
    竞态防护（2026-10-17）：取全局写入序号令牌，450ms 淡出重建到期时对号，号过期
    （期间发生过收起 / 重渲染 / 更新一次轮换）整帧丢弃 —— 挂起的旧闭包绝不回写。 */
function mhAnnShowItem(box, q, idx, total) {
  const seq = ++mhAnnSeq;
  const homeCls = q.home ? ' ai-home' : '';   // home 蓝条视觉档（并入的 placements.home）
  const tx = box.querySelector('.mha-tx');
  const apply = () => {
    if (seq !== mhAnnSeq) return;   // 令牌过期：这一帧作废，不写 DOM
    box.className = 'mh-ann' + (q.brand ? ' ai-brand' : '') + homeCls;
    box.textContent = '';
    if (q.icon) {   // icon 空串 = 这条不渲染图标（2026-10-17 口径，无默认兜底）
      const ico = document.createElement('span');
      ico.className = 'material-symbols-outlined';
      ico.textContent = q.icon;
      box.appendChild(ico);
    }
    const t = document.createElement('span');
    t.className = 'mha-tx';
    t.textContent = q.text;
    box.appendChild(t);
    if (total > 1) {   // 多条轮换：行尾小字序号角标「1/3」
      const ix = document.createElement('span');
      ix.className = 'mha-idx';
      ix.textContent = idx + '/' + total;
      box.appendChild(ix);
    }
    t.classList.remove('mha-fade');
  };
  if (tx) {   // 轮换切换：先淡出再整体重建（淡入），一行内完成、不撑高
    tx.classList.add('mha-fade');
    setTimeout(apply, 450);
  } else {
    apply();
  }
}

/** 全局唯一轮换句柄：重渲染 / 切视图前先清，杜绝双份 interval（闪烁 + 错拍）。 */
function mhAnnStopRotate() {
  if (mhAnnRotateTimer) { clearInterval(mhAnnRotateTimer); mhAnnRotateTimer = null; }
}

/** 切走数据视图时收起头部公告行（switchView 调用）：停轮换 + 清行 + hidden。
    同时递增写入序号令牌 —— 挂起中的 450ms 淡出重建帧到期对不上号，整帧作废，
    绝不会把内容写回已收起的行。轮换队列 mhAnnQueue 保留，切回时 mhAnnRestore 恢复。 */
function mhAnnCollapse() {
  mhAnnSeq++;
  const box = $('mhAnn');
  if (!box) return;
  mhAnnStopRotate();
  box.textContent = '';
  box.hidden = true;
  box.className = 'mh-ann';
}

/** 切回数据视图时恢复头部公告行（switchView 调用）：按 mhAnnQueue 原样重建 ——
    单条直显 / 多条 4 秒轮换，口径与 renderAnnounceItems 完全一致；队列空（没渲染过
    或公告全关）→ 保持 hidden。 */
function mhAnnRestore() {
  const box = $('mhAnn');
  if (!box) return;
  const queue = mhAnnQueue || [];
  if (view !== 'data' || !queue.length) {   // 非数据视图 / 无公告：收起
    mhAnnCollapse();
    return;
  }
  box.hidden = false;
  mhAnnStopRotate();
  if (queue.length === 1) {
    mhAnnShowItem(box, queue[0], 0, 1);
    return;
  }
  let qi = 0;
  mhAnnShowItem(box, queue[0], 1, queue.length);
  mhAnnRotateTimer = setInterval(() => {
    qi = (qi + 1) % queue.length;
    mhAnnShowItem(box, queue[qi], qi + 1, queue.length);
  }, 4000);
}

/* 看板公告条历史版本说明（2026-10-14 → 2026-10-17）：原来此处按 items 逐条渲染
   .ann-item 大卡到 #annItems（竖排大卡，顶部占近半屏），已由上方头部公告行替代；
   #annItems 容器与旧 CSS 保留不再写入。 */

/** 看板公告条（2026-10-17 并入口径）：placements.home 不再插成 toolbar 上方的
    #home-ann 蓝色大条，改为压成一条与 items 同构的队列条目**并进**头部公告行
    #mhAnn 的全局轮换队列（普通浅蓝条 .ai-home），一起参与单条直显 / 多条 4 秒轮换。
    每次静默刷新先走 renderAnnounceItems 整包重建队列（mhAnnQueue 不含 home 条），
    再由本函数把 home 条接回队尾 —— 天然无重复、每次进看板都显示。
    cfg.icon 空串/白名单外 → 不出图标（与 renderAnnounceItems 同口径）。 */
function renderHomeAnnouncement(home) {
  const box = $('mhAnn');
  if (!box) return;
  const cfg = home || {};
  if (!cfg.enabled || !cfg.text) return;   // 关着 / 没文案：不出
  /* 非数据视图：不追加（公告挂数据看板，回看板时整条渲染链路重跑）。
     mhAnnQueue 为空（items 全关）不算拦 —— home 条自己就能撑起这一行：
     renderAnnounceItems 刚收起，这里重新 unhide 并只显示 home 条。 */
  if (view !== 'data') return;
  /* home 条压成与 items 同构的队列条目（text 换行压空格；icon 空串/白名单外 = 无图标），
     蓝色通知条视觉用 .mh-ann.ai-home（沿原 #home-ann / .ann-bar 浅蓝渐变）。 */
  const ic = String(cfg.icon == null ? '' : cfg.icon).trim();
  const homeItem = {
    icon: (ic && ANNOUNCE_ICONS.indexOf(ic) >= 0) ? ic : '',
    brand: false, home: true,
    text: String(cfg.text).replace(/\s*\n+\s*/g, ' ').trim()
  };
  /* 并进全局轮换队列：mhAnnQueue 里还没有 home 条 → 追加到队尾；已有（静默刷新
     重复调用）→ 原位替换，杜绝同一条蓝通知重复占两个轮换位。 */
  const at = mhAnnQueue.findIndex((q) => q.home);
  if (at >= 0) mhAnnQueue[at] = homeItem;
  else mhAnnQueue.push(homeItem);
  /* 追加/替换后按队列长度重建展示：1 条 → 单条直显；>1 条 → 重启 4 秒轮换并先显示
     刚并进来的 home 条。全局唯一句柄，重渲染先 mhAnnStopRotate 清旧。
     行可能刚被 renderAnnounceItems 收起（items 全关）—— 这里必须重新 unhide。 */
  mhAnnStopRotate();
  const queue = mhAnnQueue;
  box.hidden = false;
  if (queue.length === 1) {
    mhAnnShowItem(box, queue[0], 0, 1);
    syncHeaderOffset();
    return;
  }
  let qi = queue.findIndex((q) => q === homeItem);
  mhAnnShowItem(box, queue[qi], qi + 1, queue.length);
  mhAnnRotateTimer = setInterval(() => {
    qi = (qi + 1) % queue.length;
    mhAnnShowItem(box, queue[qi], qi + 1, queue.length);
  }, 4000);
  syncHeaderOffset();
}

/** 「我的」页公告条：renderMy 渲染完成后调用，插在 view 内容最顶上。
    loadMy 每次都整体重建 view，天然不持久 —— 每次进「我的」都重新显示。 */
function renderMyAnnouncement(my) {
  const html = annBarHtml('my-ann', my, 'person');
  if (!html) return;
  const box = $('view');
  if (box) box.insertAdjacentHTML('afterbegin', html);
}

/* ==================== 📣 公告弹窗（2026-10-16 三甲通报 Stitch 改版） ====================
   数据契约：site 接口与 /api/public/announcements 下发的 items 每条含
   popup:boolean（后端未上线时 undefined = false）。横幅（renderAnnounceItems）
   仍渲染全部 enabled 条目、与弹窗互不排斥；弹窗取**全部** enabled && popup 条目
   按配置顺序翻页（设计稿：三甲连报，1/3 → 2/3 → 3/3，每页同一骨架同一尺寸）。
   已读锁与引导弹窗 maybeAnnounce 的版本锁同口径，key 再掺通报内容指纹：
   key = 'pk_item_popup_v' + version + '_' + hash(title|name|wave|text 各页拼接)，
   值相等不弹；「知道了」/ 翻完 / 点空白关闭都写锁。掺指纹的原因：登录门开着时
   未登录用户拿不到 version（恒 0），内容更新后必须能重弹。引导弹开了
   （announceCtx 非空）本次让位不弹。
   安全：全程 createElement + textContent / 白名单标记（加粗 + 行首列表），
   后端字符串绝不进 innerHTML（与 renderAnnounceItems 同一口径）。 */

/* 公告正文白名单富文本（2026-10-15 任务三）：与引导弹窗 maybeAnnounce 闭包内的
   bodyHtml 同一套标记口径（*星号* = 加粗；行首 ·/•/-/1. = 列表项），但那个函数
   是闭包内的，不能复用也不去改它 —— 这里独立实现等价逻辑。
   支持两种编辑习惯（运营在后台 textarea 里自然写的）：
     · 「· 」「- 」「1. 」开头的行 → 列表项
     · *星号包起来* → 加粗
   其余字符（含 < > & " '）一律走 esc 转义，所以注入面只剩这两个标记本身。 */
function ipBodyHtml(item) {
  const raw = item && item.text != null ? String(item.text) : '';
  /* 快路：没有任何标记字符时直接转义返回，省掉拆行/建 DOM 的开销。
     命中判断必须覆盖全部三种标记（换行、星号、行首列表符）——与引导弹窗同款。 */
  if (raw.indexOf('\n') < 0 && raw.indexOf('*') < 0
      && !/^\s*(?:[\u00b7\u2022-]|\d+[.、)])\s/.test(raw)) return esc(raw);
  const lines = raw.split('\n').map((ln) => {
    const m = /^\s*(?:[·•\-]|\d+[.、)])\s+/.exec(ln);
    const li = m ? '<li>' + esc(ln.slice(m[0].length)).replace(/\*([^*\n]+)\*/g, '<b>$1</b>') + '</li>'
                 : esc(ln).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
    return { li: !!m, html: li };
  });
  let out = '', inList = false;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].li && !inList) { out += '<ul>'; inList = true; }
    if (!lines[i].li && inList) { out += '</ul>'; inList = false; }
    out += lines[i].li ? lines[i].html : '<p>' + (lines[i].html || '&nbsp;') + '</p>';
  }
  if (inList) out += '</ul>';
  return out;
}
