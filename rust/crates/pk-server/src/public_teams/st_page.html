/* 「追分设置」卡的事件（2026-10-13 从 bindPushBoundHandlers 拆出，逻辑不变，
   只是选择器从 #pushBox 换到 #chaseBox）：目标删除、三个添加面板、搜索。 */
function bindChaseHandlers(p) {
  document.querySelectorAll('#chaseBox [data-del]').forEach((b) => {
    b.onclick = async () => {
      try {
        await fetch('/api/public/teams/' + TEAM + '/my/push/targets/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: myToken(), id: Number(b.dataset.del) }),
        }).then(async (r) => {
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        });
        toast('已删除');
        await refreshPush();
      } catch (e) {
        toast(e.message || '删除失败');
      }
    };
  });

  /* 追主播 / 定音浪 / 追名次 三个子面板 */
  let picked = null;
  document.querySelectorAll('#chaseBox .tabs2 button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('#chaseBox .tabs2 button').forEach((x) => x.classList.toggle('on', x === b));
      show('tkPerson', b.dataset.tk === 'person');
      show('tkValue', b.dataset.tk === 'value');
      show('tkRank', b.dataset.tk === 'rank');
    };
  });
  /* Enter 直提（2026-10-12）：三个输入框分别触发对应添加按钮，减少一次点按 */
  const enterSubmit = (inputId, btnId) => {
    const el = $(inputId), btn = btnId && $(btnId);
    if (el && btn) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
  };
  enterSubmit('tkWan', 'tkAdd');
  enterSubmit('tkVal', 'tkValAdd');
  enterSubmit('tkRankVal', 'tkRankAdd');
  const q = $('tkQ'), listEl = $('tkList'), addBtn = $('tkAdd');
  if (q) {
    q.oninput = () => {
      picked = null;
      if (addBtn) addBtn.disabled = true;
      const key = q.value.trim();
      clearTimeout(pushSrTimer);
      if (!key) { listEl.classList.add('hidden'); listEl.innerHTML = ''; return; }
      pushSrTimer = setTimeout(async () => {
        try {
          const d = await api('/api/public/teams/' + TEAM + '/my/push/search?q=' +
            encodeURIComponent(key));
          const items = d.items || [];
          listEl.innerHTML = items.length
            ? items.map((a) => '<div data-pid="' + a.personId + '">' + esc(a.name) + '</div>').join('')
            : '<div class="none">本团没搜到这个人</div>';
          listEl.classList.remove('hidden');
          listEl.querySelectorAll('[data-pid]').forEach((row) => {
            row.onclick = () => {
              picked = { id: Number(row.dataset.pid), name: row.textContent };
              q.value = picked.name;
              listEl.classList.add('hidden');
              addBtn.disabled = false;
            };
          });
        } catch (e) {
          listEl.innerHTML = '<div class="none">' + esc(e.message || '搜索失败') + '</div>';
          listEl.classList.remove('hidden');
        }
      }, 220);
    };
    q.onblur = () => setTimeout(() => listEl.classList.add('hidden'), 180);
  }
  if (addBtn) {
    addBtn.onclick = async () => {
      if (!picked) return;
      addBtn.disabled = true;
      addBtn.textContent = '添加中…';
      try {
        const wanRaw = parseFloat(($('tkWan') || {}).value);
        const payload = { kind: 'person', personId: picked.id };
        if (!isNaN(wanRaw)) {
          if (!(wanRaw > 0)) { toast('目标分要大于 0（万）'); addBtn.disabled = false; addBtn.textContent = '添加'; return; }
          payload.targetWan = wanRaw;
        }
        await postPush('/my/push/targets', payload);
        if ($('tkWan')) $('tkWan').value = '';
        q.value = '';
        picked = null;
        addBtn.disabled = true;
        addBtn.textContent = '添加';
        toast('已添加');
        await refreshPush();
      } catch (e) {
        addBtn.disabled = false;
        addBtn.textContent = '添加';
        toast(e.message || '添加失败');
      }
    };
  }
  const valAdd = $('tkValAdd');
  if (valAdd) {
    valAdd.onclick = async () => {
      const v = parseFloat($('tkVal').value);
      if (!(v > 0)) { toast('请输入大于 0 的目标（万）'); return; }
      valAdd.disabled = true;
      valAdd.textContent = '添加中…';
      try {
        await postPush('/my/push/targets', { kind: 'value', valueWan: v });
        toast('已添加');
        $('tkVal').value = '';
        await refreshPush();
      } catch (e) {
        valAdd.disabled = false;
        valAdd.textContent = '添加目标';
        toast(e.message || '添加失败');
      }
    };
  }
  const rankAdd = $('tkRankAdd');
  if (rankAdd) {
    rankAdd.onclick = async () => {
      const n = parseInt($('tkRankVal').value, 10);
      if (!(n > 0)) { toast('请输入要追的名次（如 3）'); return; }
      if (n > 999) { toast('名次太大了'); return; }
      rankAdd.disabled = true;
      rankAdd.textContent = '添加中…';
      try {
        await postPush('/my/push/targets', { kind: 'rank', targetRank: n });
        toast('已添加');
        $('tkRankVal').value = '';
        await refreshPush();
      } catch (e) {
        rankAdd.disabled = false;
        rankAdd.textContent = '添加名次目标';
        toast(e.message || '添加失败');
      }
    };
  }
}

/** 推送设置的写接口（统一带 token 与错误处理） */
async function postPush(path, extra) {
  const r = await fetch('/api/public/teams/' + TEAM + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ token: myToken() }, extra)),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

function bindPushBox(p) {
  const btn = $('pushScanStart');
  if (btn) btn.onclick = () => startPushScan();
  // 已扫码但还没激活：轮询一下状态，用户发完消息后自动刷新
  if (p && p.needActivate) {
    clearTimeout(pushSrTimer);
    pushSrTimer = setTimeout(() => refreshPush(), 5000);
  }
  /* 「我发了，查一下激活状态」：已扫码未激活时的手动兜底。
     自动轮询只在页面停留期间有效，用户切走再回来往往已经停了。 */
  const chk = $('pushCheckActivate');
  if (chk) {
    chk.onclick = async () => {
      chk.disabled = true;
      chk.textContent = '查询中…';
      try {
        const next = await fetchPush();
        renderPushBox(next);
        if (next && next.bound) toast('已激活，推送会按你的开关发送');
        else if (next && next.needActivate) toast('还没激活：先在微信里给机器人发一条消息');
        else toast('状态已刷新');
      } catch (e) {
        chk.disabled = false;
        chk.textContent = '我发了，查一下激活状态';
        toast(e.message || '查询失败');
      }
    };
  }
  if (p && p.bound) bindPushBoundHandlers(p);
  /* 「追分设置」独立卡（2026-10-13）：内容渲染 + 事件都跟着推送状态走，
     每次推送卡刷新（renderPushBox → 这里）都同步刷一遍 chase 卡。
     chase 卡不存在（首页藏着也存在于 DOM）时 renderChaseBox 自己会跳过。 */
  renderChaseBox(p);
  /* 非 admin 一律绑（目标满员没有添加表单，但 data-del 删除按钮仍在）；
     admin 卡只有一行说明，无可绑元素 */
  if (p && !p.admin) bindChaseHandlers(p);
}

/* 扫码二维码有效期：官方约 5 分钟。前端只做「展示倒计时 + 到期提示刷新」，
   真正的失效由后端 status=expired 判定，前端不自己判死。 */
var QR_TTL_SEC = 300;
var pushScanQrExpire = 0;   // 到期时间戳（ms），0 = 无倒计时

/** 获取扫码二维码并轮询扫码状态（confirmed 后等服务端长轮询拿到首次消息） */
async function startPushScan() {
  var btn = $('pushScanStart');
  var box = $('pushScanBox');
  if (!btn || !box) return;
  btn.disabled = true;
  btn.textContent = '获取中…';
  box.innerHTML = '<div class="qr-status wait"><span class="dot"></span>正在获取二维码…</div>';
  try {
    const r = await fetch('/api/public/teams/' + TEAM + '/my/push/wechat/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: myToken() }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    let h = '<div class="qr-frame">';
    if (d.imgContent) {
      const src = String(d.imgContent).startsWith('data:')
        ? d.imgContent : 'data:image/png;base64,' + d.imgContent;
      h += '<div class="qr-wrap qr-live" id="pushScanWrap">' +
        '<img class="qrcode" alt="微信推送绑定二维码" src="' + esc(src) + '"></div>';
    } else if (d.url) {
      h += '<a class="reg-link" href="' + esc(d.url) + '" target="_blank" rel="noopener">打开二维码链接</a>';
    } else {
      throw new Error('没有拿到二维码，稍后再试');
    }
    h += '</div>';
    if (d.imgContent) {
      h += '<div class="qr-status wait" id="pushScanStatus"><span class="dot"></span>' +
        '<span id="pushScanStatusTx">等待扫码…</span></div>' +
        '<div class="qr-expire" id="pushScanExpire"></div>';
    }
    h += '<div class="qr-steps">' +
      '<div class="qr-step"><span class="qr-n">1</span><span class="qr-txt">用微信「扫一扫」扫描上面的二维码</span></div>' +
      '<div class="qr-step"><span class="qr-n">2</span><span class="qr-txt">在微信里确认授权登录</span></div>' +
      '<div class="qr-step"><span class="qr-n">3</span><span class="qr-txt">给机器人发一条消息，推送即激活</span></div>' +
      '</div>' +
      '<div id="pushScanVerify" class="hidden" style="margin-top:8px">' +
      '<input id="pushScanCode" placeholder="微信里显示的验证码" inputmode="numeric" autocomplete="off">' +
      '<button class="go gray" id="pushScanCodeGo">提交验证码</button></div>';
    box.innerHTML = h;
    btn.disabled = false;
    btn.textContent = '刷新二维码';
    scanStatus('wait', '等待扫码…', true);
    pushScanQrExpire = Date.now() + QR_TTL_SEC * 1000;
    startPushScanPoll(d.qrcode);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '重新获取';
    box.innerHTML = '<div class="qr-status bad"><span class="dot"></span>' +
      esc(e.message || '获取失败，稍后再试') + '</div>';
  }
}

/** 扫码状态行：state = wait / scaned / ok / bad；带呼吸点的只有 wait */
function scanStatus(state, text, pulse) {
  var row = $('pushScanStatus');
  if (!row) return;
  row.className = 'qr-status ' + (state === 'ok' ? 'ok' : state === 'bad' ? 'bad'
    : state === 'scaned' ? 'scaned wait' : 'wait');
  var tx = $('pushScanStatusTx');
  if (tx) tx.textContent = text;
  var dot = row.querySelector('.dot');
  if (dot) dot.style.animation = state === 'wait' && pulse ? '' : 'none';
}

/** 二维码倒计时：剩 30 秒内变红，到期只提示、不自动跳（后端 expired 才是权威） */
function qrExpireTick() {
  var el = $('pushScanExpire');
  if (!el) return;
  if (!pushScanQrExpire) { el.textContent = ''; el.className = 'qr-expire'; return; }
  var left = Math.round((pushScanQrExpire - Date.now()) / 1000);
  if (left <= 0) {
    el.textContent = '二维码可能已过期，点「刷新二维码」重新获取';
    el.className = 'qr-expire soon';
    return;
  }
  var mm = Math.floor(left / 60), ss = left % 60;
  el.textContent = '二维码 ' + (mm ? mm + ':' + pad2(ss) : ss + ' 秒') + ' 后过期';
  el.className = 'qr-expire' + (left <= 30 ? ' soon' : '');
}

function startPushScanPoll(qrcode) {
  clearTimeout(pushScanTimer);
  pushScanTimer = null;
  var verifyCode = '';
  var stopped = false;
  var ticks = 0;
  clearInterval(pushScanExpireTimer);
  pushScanExpireTimer = setInterval(qrExpireTick, 1000);
  qrExpireTick();
  const submit = $('pushScanCodeGo');
  if (submit) {
    submit.onclick = () => {
      verifyCode = ($('pushScanCode') || {}).value || '';
      submit.disabled = true;
      submit.textContent = '提交中…';
    };
  }
  const stop = () => {
    stopped = true; clearTimeout(pushScanTimer); pushScanTimer = null;
    clearInterval(pushScanExpireTimer); pushScanQrExpire = 0;
    var w = $('pushScanWrap');
    if (w) w.classList.remove('qr-live');
  };
  const tick = async () => {
    if (stopped) return;
    try {
      const r = await fetch('/api/public/teams/' + TEAM + '/my/push/wechat/poll', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: myToken(), qrcode: qrcode, verifyCode: verifyCode }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      const st = String(d.status || '');
      if (st === 'confirmed') {
        stop();
        scanStatus('ok', '✓ 已扫码确认', false);
        toast('扫码成功，请在微信里给机器人发一条消息激活推送');
        refreshPush();
        return;
      } else if (st === 'need_verifycode') {
        show('pushScanVerify', true);
        scanStatus('wait', '需要验证码：请在微信里查看并填入', true);
      } else if (st === 'scaned') {
        scanStatus('scaned', '已扫码，等待确认…', false);
      } else if (st === 'expired') {
        stop();
        scanStatus('bad', '二维码已过期，请点「刷新二维码」重新获取', false);
        return;
      } else if (st === 'verify_code_blocked') {
        stop();
        scanStatus('bad', '验证失败次数过多，请重新获取二维码', false);
        return;
      } else if (st === 'scaned_but_redirect' || st === 'binded_redirect') {
        scanStatus('scaned', '已扫码，等待确认…', false);
      } else {
        scanStatus('wait', '等待扫码…', true);
      }
    } catch (e) {
      // 连续网络失败不清状态，只在文案上提示；10 次后停轮询让用户手动刷新
      if (++ticks >= 10) {
        stop();
        scanStatus('bad', (e.message || '检测失败') + '（已停止，请手动刷新）', false);
        return;
      }
      scanStatus('wait', (e.message || '检测失败') + '，重试中…', true);
    }
    if (!stopped) pushScanTimer = setTimeout(tick, 3000);
  };
  tick();
}

/* ==================== 视图切换 ==================== */
/* 顶部导航 sticky 后，工具条吸顶位置要跟头部实际高度走（分组页多一条子导航）。
   公告条容器 #annItems 夹在 masthead 与 toolbar 之间，但它跟正文一起滚走、自身不吸顶，
   所以**不把**它的高度算进 --mh-h（算了会在吸顶的 masthead 下面留一条空隙）；
   这里只量真正吸顶的 .masthead。renderAnnounceItems 每次改完条数会再调一次本函数，
   保证站点初始化后第一次渲染出来的高度变化也能同步。 */
function syncHeaderOffset() {
  const h = document.querySelector('.masthead')?.offsetHeight || 0;
  if (h) document.documentElement.style.setProperty('--mh-h', h + 'px');
}
window.addEventListener('resize', syncHeaderOffset);

function switchView(v, opts) {
  opts = opts || {};
  /* 后台关掉的页面不许进（popstate / 深链兜底）：改道到还开着的第一个页 */
  const s = (site && site.settings) || {};
  if (v === 'data' && s.dataEnabled === false) v = 'group';
  if (v === 'group') {
    /* 还开着的子页（后台按赛事类型逐个关） */
    const enabled = [...document.querySelectorAll('#subnav button:not([disabled])')];
    if (s.groupEnabled === false || !enabled.length) v = 'lineage';
    /* 2026-10-13 修「点子页被改道回首个子页」：原来拿"第一个按钮有没有 .on"当
       "当前有没有选中子页"，可子导航点击早已把 curGroup 设成目标页，而 .on 还停在
       上一次选中项 —— 于是只要第一个子页当前不是选中态，点第二个起的所有子页都会被
       改道回第一个（实测 5 次点击 3 次无效）。改成：curGroup 不在还开着的列表里才落到第一个。 */
    else if (!enabled.some(b => b.dataset.g === curGroup)) curGroup = enabled[0].dataset.g;
  }
  if (v === 'lineage' && (s.lineageEnabled === false || TEAM === 'female')) v = 'data';
  if (v === 'my' && s.loginRequired === false) v = 'data';
  view = v;
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('#subnav button').forEach(b => b.classList.toggle('on', b.dataset.g === curGroup));
  show('toolbar', v === 'data');
  /* 看板公告条跟 toolbar 一起显隐：公告挂在数据看板（运营触达位），
     切到分组/族谱/我的时收起，进「我的」由 renderMyAnnouncement 挂自己的条 */
  const homeAnn = $('home-ann');
  if (homeAnn) show(homeAnn, v === 'data');
  show('subnav', v === 'group');
  show('foot', v !== 'lineage');
  syncHeaderOffset();
  /* 离开「我的」页就停扫码轮询：三个计时器（轮询 / 倒计时 / 搜索防抖）
     不停的话切回来会变成双份轮询，白耗请求 */
  if (v !== 'my') {
    clearTimeout(pushScanTimer); pushScanTimer = null;
    clearInterval(pushScanExpireTimer); pushScanQrExpire = 0;
    clearTimeout(pushSrTimer);
  }
  $('view').innerHTML = '';
  if (opts.push !== false) pushRoute(opts.replace === true);
  go();
}

function setPeriod(p) {
  period = p;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  show('dates', p === 'daily');
  show('stepper', p !== 'daily');
  show('btnCal', p === 'daily');   // 日历只属于「每日」口径
  if (p === 'daily') calHide();    // 月/年切换时把开着的日历收掉
  curPeriod = snapPeriod(p, nowPeriod(p));   // 只落有数据的周期
  syncStepper();
  go();
}

/* 2026-10-14：顶部公告/庆祝只按 items 渲染一次（renderAnnounceItems），
   不再有独立的冠军/庆祝横幅路径，也不随日期口径切换刷新。 */


async function go() {
  show('err', false);
  /* 立刻给反馈：小菊花 + 内容压暗（数据没到不清空，到了再换）。
     乐观骨架只在内容为空时上，避免已看内容被闪没。 */
  const seq = ++loadSeq;
  busyOn();
  const optimistic = () => {
    if (view === 'data' && !listAll.length) $('view').innerHTML = '<div class="section">' + shimmerList() + '</div>';
  };
  optimistic();
  try {
  if (view === 'data') await loadData();
  else if (view === 'lineage') await loadLineage();
  else if (view === 'my') await loadMy();
  else await loadGroup();
    if (seq !== loadSeq) return;          // 期间用户又点了别的：过期响应作废
    consecutiveFail = 0;
    show('stale', false);
  } catch (e) {
    if (seq !== loadSeq) return;          // 过期失败的报错也不许盖住新内容
    consecutiveFail++;
    if (consecutiveFail >= 2) show('stale', true);
    /* 页面骨架可能已被整页接管（地区门禁 regionBlocked）：取不到就别硬写 */
    const mh = $('mhSub'), box = $('view');
    if (mh) mh.textContent = 'NETWORK';
    if (box) box.innerHTML = '<div class="empty"><span class="big">📶</span>暂时取不到数据<br>' +
      esc(e.message) + '</div>';
  } finally {
    if (seq === loadSeq) busyOff();
  }
}

/* ==================== 静默刷新 ==================== */
/* 每分钟后台刷新，客户端加 ±10s 抖动：不加抖动的话所有人整点一起请求，服务端会尖峰 */
function scheduleRefresh() {
  clearTimeout(timer);
  const jitter = 60000 + (Math.random() * 20000 - 10000);
  timer = setTimeout(() => {
    /* lineage / my 不参与静默刷新：lineage 重建画布会丢缩放位置；
       my 是个人数据页，低频变化，且重建会打断用户正在输入的表单 */
    Promise.resolve(view === 'data' ? loadData()
      : (view === 'lineage' || view === 'my') ? null : loadGroup())
      .then(() => { consecutiveFail = 0; show('stale', false); })
      .catch(() => { consecutiveFail++; if (consecutiveFail >= 2) show('stale', true); })
      .finally(scheduleRefresh);
  }, jitter);
}

/* ==================== 导航显隐 ==================== */
/* 页面级显隐（2026-10-10）：每日报告 / 分组 / 族谱 / 分组子页都由后台开关控制，
   关掉的导航整体消失（接口也不下发，不是前端藏）；族谱仍是男团专属。
   分组子导航按赛事类型逐个显隐；全部子页都关时「分组」主导航也藏起来。 */
function syncNav() {
  const s = (site && site.settings) || {};
  const dataOn = s.dataEnabled !== false;
  const groupOn = s.groupEnabled !== false;
  // 族谱是男团专属页：女团视角不显示（2026-10-11）
  const linOn = s.lineageEnabled !== false && TEAM !== 'female';
  /* 子导航：把后台关掉的赛事类型按钮摘掉 */
  const gt = s.groupTypes || {};
  document.querySelectorAll('#subnav button').forEach(b => {
    const page = GROUP_PAGES.find(p => p.key === b.dataset.g);
    const on = groupOn && (!page || gt[page.type] !== false);
    b.disabled = !on;
    show(b, on);
  });
  /* 分组子页全关 → 分组主导航也没了 */
  const anySub = [...document.querySelectorAll('#subnav button')].some(b => !b.disabled);
  show('navGroup', groupOn && anySub);
  show('navData', dataOn);
  show('navLineage', linOn);
  show('navMy', s.loginRequired !== false);   // 关登录 = 全面开放，没有「我的」页
}

/* ==================== 启动（统一展示端） ====================
   2026-10-11 修复：首页不再弹「男团 / 女团」选择卡，也不根据登录账号所属团
   跳转；统一直接进 /api/public/teams/all 的全量展示。 */
async function siteIsOpen() {
  try {
    /* 带上已有登录态：登录门开启时 /all 对有效 token 放行（后端 gate_team 口径）。
       token 走 X-My-Token 头（2026-10-13）；裸 fetch 或 ?access_token= 都会 401，
       导致每次 boot 又弹一次登录门（"登录成功又回登录门 / 要登录两次"的根因之一）。 */
    const r = await fetch('/api/public/teams/all', { headers: myTokenHeaders() });
    return r.ok;
  } catch (_) { return false; }
}

/* 团别选择卡（关闭登录门时）：打开展示页先选「男团 / 女团」 */

/* 引导弹窗（2026-10-12 大厂级）：多步骤「新功能介绍」。
   对齐 Apple / 微信的首次引导：
   · 品牌头 + 每步一个图标（后端 icon 白名单，前端再验一次）
   · Pill 步骤条可点击回跳；Esc / 点遮罩 = 跳过
   · 键盘 ← → 翻页；触屏左右滑动翻页
   · 滚动锁定 + 长文案卡内滚动，按钮永不被顶出屏幕
   · 版本记住已读：点「知道啦 / 跳过」，或翻完最后一步，都按 version 落 localStorage
   每次渲染都重建 DOM（innerHTML），所以这里统一在 render() 里重新绑事件。 */

/* 图标白名单与后端 STEP_ICON_WHITELIST 一致；只允许走 class 名，不放任意字符串 */
var ANNOUNCE_ICONS = ['auto_awesome', 'military_tech', 'qr_code_scanner',
  'notifications_active', 'insights', 'tips_and_updates', 'campaign', 'star', 'bolt',
  'groups', 'emoji_events', 'local_fire_department', 'trending_up', 'calendar_month',
  'chat_bubble', 'lock', 'person', 'smart_toy', 'workspace_premium'];

var announceCtx = null;   // 当前引导实例的开闭句柄（供外部强制收起）

/* 深链直达：?announce=N（或 #announce=N）从第 N 步打开。
   运营改完引导可以把链接直接发给用户看某一步，不用让人一路点过来。
   深链进来的**不写已读** —— 否则用户点开看到一半，下次正式引导反而不弹了。
   返回 0 起的步序号；没有深链或越界返回 -1。 */
function announceDeepStep(stepCount) {
  var m = /(?:[?&#])announce=(\d{1,2})(?!\d)/.exec(location.search + location.hash);
  if (!m) return -1;
  var n = +m[1] - 1;
  return (n >= 0 && n < stepCount) ? n : -1;
}

/* ---- spotlight 引导（2026-10-13）：step.target 指向具体元素时的定位逻辑 ---- */

/* target selector → 所属视图的映射：selector 命不中当前视图时先切页再定位。
   #my* → my；#navRow → 看按钮的 data-v 属性（分组页签→group、族谱页签→lineage、
   我的页签→my、看板页签不用切）；其余（.seg / .st-row* 等）→ data。
   映射里没有的 selector 不切页。 */
function announceTargetView(sel) {
  if (!sel) return null;
  if (/^#my/.test(sel)) return 'my';
  if (/^#navRow/.test(sel)) {
    var b = null;
    try { b = document.querySelector(sel); } catch (_) {}
    var v = b && b.dataset ? b.dataset.v : null;
    return (v === 'group' || v === 'lineage' || v === 'my') ? v : null;
  }
  if (/^\.seg\b|^\.st-row/.test(sel)) return 'data';
  return null;
}

/* target 指向的页面被后台关掉（如 groupEnabled=false 时 #navGroup 整体 hidden）：
   spotlight 找不到可见元素会自然回落居中卡片，但卡片文案里写着「点分组页签」就会误导。
   这里提前检测：目标元素是 hidden 或干脆不存在时，直接把整步跳过（自动滑到下一步），
   没有下一步就当这一步看完。返回 true 表示已跳过、调用方不要再 render。 */
function announceStepTargetMissing(steps, idxRef) {
  var s = steps[idxRef.idx] || {};
  var sel = s.target;
  if (!sel) return false;
  var el = null;
  try { el = document.querySelector(sel); } catch (_) {}
  var missing = !el || el.classList.contains('hidden')
    || el.offsetWidth <= 0 || el.offsetHeight <= 0;
  if (!missing) return false;
  if (idxRef.idx < steps.length - 1) {
    idxRef.idx++;
    return true;   // jump/render 由调用方继续
  }
  return false;    // 最后一步：留着走居中卡片，文案仍在
}

/* 上一步挂在目标元素上的 spotlight class / 贴位 class，步进与关闭时都要清干净 */
var announceSpotEl = null;
function clearAnnounceSpot() {
  if (announceSpotEl) {
    announceSpotEl.classList.remove('guide-spot');
    announceSpotEl.style.zIndex = announceSpotEl.getAttribute('data-ann-z') || '';
    announceSpotEl.removeAttribute('data-ann-z');
    announceSpotEl = null;
  }
}
/* 卡片贴位：按目标 rect 与剩余空间挑方向（下 > 上 > 右 > 左），都不够回落居中。
   贴位失败返回 false（调用方据此去掉方向 class，让卡片回到遮罩居中布局）。 */
function placeAnnounceCard(card, rect) {
  var cls = ['at-bottom', 'at-top', 'at-right', 'at-left'];
  cls.forEach(function (c) { card.classList.remove(c); });
  var m = 14, gap = 12;                       // 屏幕边距 / 卡片与目标间距
  var vw = window.innerWidth, vh = window.innerHeight;
  var top = rect.top, bottom = vh - rect.bottom, left = rect.left, right = vw - rect.right;
  var small = vw < 480;                        // 手机上竖屏：侧贴空间普遍不够
  card.style.left = card.style.top = card.style.right = card.style.bottom = '';
  card.style.maxWidth = '';
  var best = null;
  if (bottom >= 190 + gap && (!small || top < bottom)) best = 'at-bottom';
  else if (top >= 190 + gap) best = 'at-top';
  else if (!small && right >= 250 + gap && left < right) best = 'at-right';
  else if (!small && left >= 250 + gap) best = 'at-left';
  if (!best) return false;
  var bw = Math.min(352, vw - m * 2);
  card.style.maxWidth = bw + 'px';
  if (best === 'at-bottom' || best === 'at-top') {
    var ax = Math.min(Math.max(rect.left + rect.width / 2, m + bw / 2), vw - m - bw / 2);
    card.style.left = Math.round(ax - bw / 2) + 'px';
    card.style.top = best === 'at-bottom'
      ? Math.min(Math.round(rect.bottom + gap), vh - 120) + 'px'
      : Math.max(Math.round(rect.top - gap), 0) + 'px';
    card.style.transform = best === 'at-bottom' ? '' : 'translateY(-100%)';
    /* 箭头 x：相对卡片自身的偏移 = 目标中心 - 卡片左缘 */
    card.style.setProperty('--ax', Math.round(rect.left + rect.width / 2 - parseFloat(card.style.left)) + 'px');
  } else {
    var ay = Math.min(Math.max(rect.top + rect.height / 2, m + 90), vh - m - 90);
    card.style.top = Math.round(ay - 90) + 'px';
    card.style.left = best === 'at-right'
      ? Math.min(Math.round(rect.right + gap), vw - bw - m) + 'px'
      : Math.max(Math.round(rect.left - gap - bw), m) + 'px';
    card.style.setProperty('--ay', Math.round(Math.min(Math.max(rect.top + rect.height / 2, 90), 180)) + 'px');
  }
  card.classList.add(best);
  return true;
}
/* 渲染某一步时挂 spotlight：返回 true 表示进入贴位模式（遮罩变透明挖孔），
   false 表示找不到目标 / 放不下，回落旧的居中卡片。 */
function applyAnnounceSpot(box, card, sel) {
  clearAnnounceSpot();
  var spotMode = false;
  var el = null;
  if (sel) { try { el = document.querySelector(sel); } catch (_) { el = null; } }
  /* 显式挂着 hidden 的元素（如非当前视图的 toolbar）不算数 */
  if (el && el.classList.contains('hidden')) el = null;
  if (el && el.offsetWidth > 0 && el.offsetHeight > 0) {
    announceSpotEl = el;
    el.setAttribute('data-ann-z', el.style.zIndex || '');
    el.classList.add('guide-spot');
    el.style.zIndex = '102';
    /* 目标可能在长页面视口外（如我的页推送行）：先滚到可视区再量位置 */
    var vr = el.getBoundingClientRect();
    if (vr.top < 60 || vr.bottom > window.innerHeight - 60) {
      try { el.scrollIntoView({ block: 'center', behavior: 'instant' }); } catch (_) {}
    }
    /* 挂 class 后再量一次：guide-spot 的圆角/描边可能改变布局 */
    var rect = el.getBoundingClientRect();
    spotMode = placeAnnounceCard(card, rect);
    if (spotMode) {
      /* 读屏：把描述文本也用 aria-describedby 关联到目标元素本身 */
      try { el.setAttribute('aria-describedby', 'announceBody'); } catch (_) {}
    } else {
      /* 哪个方向都放不下：挖孔留着也意义不大，整个回落居中卡片 */
      clearAnnounceSpot();
      el.removeAttribute('aria-describedby');
    }
  }
  box.classList.toggle('ann-spot', spotMode);
  return spotMode;
}

function maybeAnnounce() {
  var a = site && site.announcement;
  if (!a || !a.enabled || !(a.steps && a.steps.length)) return;
  var box = $('announce');
  if (!box) return;
  var steps = a.steps;
  var closing = false;
  var deep = announceDeepStep(steps.length);
  var deepLinked = deep >= 0;
  /* 深链优先于已读判断：已读用户也要能通过别人发的链接预览某一步，
     所以这一行必须在版本守卫之前算出来，不能等 return 之后再解析。 */
  var idx = deepLinked ? deep : 0;
  if (!deepLinked) {
    var key = 'pk_announce_v';
    try {
      if (localStorage.getItem(key) === String(a.version)) return;
    } catch (_) {}
  }

  /* 关闭：锁版本 + 收动画。removeListeners 必须在 DOM 重建前摘干净，
     否则键盘 / 触摸监听会残留到下一页。 */
  var detach = [];
  function removeListeners() {
    detach.forEach(function (fn) { try { fn(); } catch (_) {} });
    detach = [];
  }
  function close() {
    if (closing) return;
    closing = true;
    clearTimeout(pushSrTimer);
    clearSwitching();
    removeListeners();
    /* 深链预览不落已读：看一眼链接不该把正式引导吃掉 */
    if (!deepLinked) {
      try { localStorage.setItem(key, String(a.version)); } catch (_) {}
    }
    announceCtx = null;
    clearAnnounceSpot();
    unlockScroll();
    box.classList.add('hidden');
    box.innerHTML = '';
    box.classList.remove('ann-spot');
    box.classList.remove('ann-overlay-in');
  }
  announceCtx = close;

  /* 内容渲染：白名单式富文本，绝不放原始 HTML。
     支持两种编辑习惯（都是运营在后台 textarea 里 Natural 会写的）：
       · 「· 」「- 」「1. 」开头的行 → 列表项
       · *星号包起来* → 加粗
     其余字符（含 < > & " '）一律走 esc 转义，所以注入面只剩这两个标记本身。 */
  function bodyHtml(s) {
    var raw = (s && s.content) ? String(s.content) : '';
    /* 快路：没有任何标记字符时直接转义返回，省掉拆行/建 DOM 的开销。
       命中判断必须覆盖全部三种标记（换行、星号、行首列表符）——
       早期版本漏了行首列表符，导致「· xxx」这种单行列表不走富文本路径。 */
    if (raw.indexOf('\n') < 0 && raw.indexOf('*') < 0
        && !/^\s*(?:[\u00b7\u2022-]|\d+[.、)])\s/.test(raw)) return esc(raw);
    var lines = raw.split('\n').map(function (ln) {
      var m = /^\s*(?:[·•\-]|\d+[.、)])\s+/.exec(ln);
      var li = m ? '<li>' + esc(ln.slice(m[0].length)).replace(/\*([^*\n]+)\*/g, '<b>$1</b>') + '</li>'
                 : esc(ln).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
      return { li: !!m, html: li };
    });
    var out = '', inList = false;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].li && !inList) { out += '<ul>'; inList = true; }
      if (!lines[i].li && inList) { out += '</ul>'; inList = false; }
      out += lines[i].li ? lines[i].html : '<p>' + (lines[i].html || '&nbsp;') + '</p>';
    }
    if (inList) out += '</ul>';
    return out;
  }
  function iconOf(s, i) {
    var ic = s && s.icon ? String(s.icon).trim() : '';
    return ANNOUNCE_ICONS.indexOf(ic) >= 0 ? ic : ANNOUNCE_ICONS[i % ANNOUNCE_ICONS.length];
  }

  /* 步进时若新步骤的 target 在别的视图里，先切页（data / my / group …）。
     go() 是 async：用轮询等目标视图真正渲染出来（上限 2.5s），数据一到就
     渲染 spotlight；超时也要渲染兜底，别让引导卡死在黑屏。
     等待期间卡片先收起，切完页再整卡淡入，避免卡片盖在空视图上闪烁。 */
  var switchingTimer = null, switchingPoll = null;
  function clearSwitching() {
    clearTimeout(switchingTimer); switchingTimer = null;
    clearInterval(switchingPoll); switchingPoll = null;
  }
  /* 目标此刻真的可定位：存在、没挂 hidden、有实际尺寸 */
  function targetReady(sel) {
    var el = null;
    try { el = document.querySelector(sel); } catch (_) {}
    return !!el && !el.classList.contains('hidden')
      && el.offsetWidth > 0 && el.offsetHeight > 0;
  }
  function jump(n) {
    if (n < 0) n = 0;
    if (n > steps.length - 1) n = steps.length - 1;
    if (n === idx) return;
    idx = n;
    var sel = (steps[idx] && steps[idx].target) || '';
    var need = announceTargetView(sel);
    if (need && need !== view) {
      clearAnnounceSpot();
      box.classList.add('hidden');
      box.innerHTML = '';
      box.classList.remove('ann-spot');
      try { switchView(need); } catch (e) { render(); return; }
      clearSwitching();
      var waited = 0;
      switchingPoll = setInterval(function () {
        waited += 120;
        if (targetReady(sel) || waited >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null; render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); render(); }, 2600);
      return;
    }
    /* 同视图：元素已经在了直接渲染；还没渲染出来（如 .st-row 行）等它出现 */
    if (sel && !targetReady(sel)) {
      clearSwitching();
      var w2 = 0;
      switchingPoll = setInterval(function () {
        w2 += 120;
        if (targetReady(sel) || w2 >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null; render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); render(); }, 2600);
      return;
    }
    render();
  }

  var firstOpen = true;
  function render() {
    clearSwitching();
    const isFirst = firstOpen;
    firstOpen = false;
    /* 深链直达的步骤：target 若在别的视图里，先切页再渲染（普通步进由 jump 管，
       深链绕过 jump，所以这里补一刀）。只处理一次：切页后 firstOpen 已翻 false。 */
    if (isFirst && deepLinked) {
      var s0 = steps[idx] || {};
      var v0 = announceTargetView(s0.target);
      if (v0 && v0 !== view) {
        try { switchView(v0); } catch (_) {}
      }
    }
    /* 目标被后台关掉的步骤自动滑过：指向的页签整个 hidden 时，挖孔没意义、
       文案还会误导用户去找一个不存在的按钮 —— 直接跳到下一步更干净。 */
    var idxRef = { idx: idx };
    if (announceStepTargetMissing(steps, idxRef)) {
      if (idxRef.idx === idx) return;   // 最后一步且目标缺失：不跳,照常渲染
      idx = idxRef.idx;
      render();
      return;
    }
    /* 深链首渲染：目标视图刚切过去、数据还在加载（如我的页推送行），
       和 jump 一样轮询等它出现（上限 2.5s），而不是立刻渲染成居中卡片。 */
    var sWait = steps[idx] || {};
    if (isFirst && deepLinked && sWait.target && !targetReady(sWait.target)) {
      var w0 = 0;
      switchingPoll = setInterval(function () {
        w0 += 120;
        if (targetReady(sWait.target) || w0 >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null;
          firstOpen = false;
          render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); firstOpen = false; render(); }, 2600);
      return;
    }
    removeListeners();
    var s = steps[idx] || {};
    var first = idx === 0;
    var last = idx === steps.length - 1;
    var ic = iconOf(s, idx);
    var html = bodyHtml(s);
    /* 纯文本才挂 rich：只有一行的文本加 rich 会丢掉用户手打的换行 */
    var isRich = /<(p|ul|li|b)>/.test(html);
    var dots = steps.map(function (_, i) {
      return '<button type="button" class="' + (i === idx ? 'on' : (i < idx ? 'done' : '')) +
        '" data-i="' + i + '" aria-label="第 ' + (i + 1) + ' 步"></button>';
    }).join('');
    box.innerHTML = '<div class="announce-box" role="dialog" aria-modal="true" ' +
      'aria-labelledby="announceTitle" aria-describedby="announceBody">' +
      '<div class="a-head">' +
        '<span class="a-chip">新功能</span>' +
        '<div class="a-ico"><span class="material-symbols-outlined">' + esc(ic) + '</span></div>' +
        '<h3 id="announceTitle">' + esc(s.title || ('第 ' + (idx + 1) + ' 步')) + '</h3>' +
      '</div>' +
      '<div class="a-body a-step-in' + (isRich ? ' rich' : '') + '" id="announceBody">' +
        html + '</div>' +
      '<div class="a-dots" id="announceDots">' + dots + '</div>' +
      '<div class="a-actions">' +
        (first ? '' : '<button class="a-prev" id="announcePrev">上一步</button>') +
        '<button class="a-ok" id="announceNext">' + (last ? '知道啦' : '下一步') + '</button>' +
      '</div>' +
      '<button class="a-skip" id="announceSkip">' + (last ? '关闭' : '跳过引导') + '</button>' +
      (steps.length > 1 ? '<div class="a-swipe-hint">左右滑动 / 按 ← → 键也可以翻页</div>' : '') +
      '</div>';
    box.classList.remove('hidden');
    box.classList.add('ann-overlay-in');

    /* spotlight：step.target 命中页面元素 → 挖孔 + 卡片贴位；否则保持居中卡片。
       贴位失败（元素太小放不下卡）时把方向 class 摘掉，让卡片回落遮罩居中。 */
    var cardEl = box.querySelector('.announce-box');
    var spotOn = applyAnnounceSpot(box, cardEl, s.target);
    if (!spotOn && cardEl) {
      ['at-bottom', 'at-top', 'at-right', 'at-left'].forEach(function (c) {
        cardEl.classList.remove(c);
      });
      cardEl.style.left = cardEl.style.top =
        cardEl.style.maxWidth = cardEl.style.transform = '';
    }

    $('announceNext').onclick = function () { last ? close() : jump(idx + 1); };
    /* 焦点落到主按钮：读屏用户进来就能听到「下一步」，键盘党直接回车。
        只在「引导首次打开」时抢焦点 —— jump() 翻页不抢，否则用户点步骤条
        回看某一步，焦点被强行挪到按钮上，读屏进度被打断。 */
    if (isFirst) {
      const nx = $('announceNext');
      try { nx.focus({ preventScroll: true }); } catch (_) { nx.focus(); }
    }
    var prev = $('announcePrev');
    if (prev) prev.onclick = function () { jump(idx - 1); };
    $('announceSkip').onclick = close;

    /* Pill 步骤条：点哪颗去哪步（已看过的步骤可回看，这是大厂引导的标配） */
    Array.prototype.forEach.call(box.querySelectorAll('#announceDots button'), function (b) {
      b.onclick = function () { jump(+b.dataset.i); };
    });

    /* 键盘：Esc 跳过，← → 翻页。只在引导开着时接管。 */
    function onKey(e) {
      if (closing) return;
      var k = e.key;
      if (k === 'Escape') { e.preventDefault(); close(); }
      else if (k === 'ArrowRight') { e.preventDefault(); jump(idx + 1); }
      else if (k === 'ArrowLeft') { e.preventDefault(); jump(idx - 1); }
    }
    document.addEventListener('keydown', onKey, true);
    detach.push(function () { document.removeEventListener('keydown', onKey, true); });

    /* 触屏：左右滑动翻页（阈值 45px，竖向滑动不抢）。 */
    var card = box.querySelector('.announce-box');
    var sx = 0, sy = 0, tracking = false;
    function onStart(e) {
      var t = e.touches && e.touches[0];
      if (!t) return;
      sx = t.clientX; sy = t.clientY; tracking = true;
    }
    function onEnd(e) {
      if (!tracking) return;
      tracking = false;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)) return;
      jump(idx + (dx < 0 ? 1 : -1));
    }
    if (card) {
      card.addEventListener('touchstart', onStart, { passive: true });
      card.addEventListener('touchend', onEnd, { passive: true });
      detach.push(function () {
        card.removeEventListener('touchstart', onStart);
        card.removeEventListener('touchend', onEnd);
      });
    }

    /* 点遮罩关闭；点在卡片内不关（避免误触把引导吃掉）。 */
    function onOverlay(e) { if (e.target === box) close(); }
    box.onclick = onOverlay;
    detach.push(function () { box.onclick = null; });
  }

  lockScroll();
  render();
}

/* ==================== 🎉 彩带庆祝 + 📣 运营公告（2026-10-13 / items 2026-10-14） ====================
   数据契约（后端并行实现，前端按契约消费，拿不到就全关不显示）：
   · GET /api/public/announcements（无需登录）
       → { login:{enabled,text,icon}, celebrate:{enabled,confetti,title,name,wave},
           items:[{enabled,icon,title,name,wave,text,tone}] }   ← 登录前的公告条兜底
   · GET /api/public/teams/{TEAM}（site 接口）
       placements: { home:{enabled,text,icon}, my:{enabled,text,icon} }
       celebrate:  { enabled, confetti, title, name, wave }
       items:      [{enabled,icon,title,name,wave,text,tone}]   ← 公告条主数据源（顺序即从上到下）
   页面顶部**只**渲染 items（renderAnnounceItems）；site.champ / site.celebrate 兼容期
   后端仍下发，但前端不再单独渲染横幅（否则同一条冠军信息会上下重复）。 */

let siteAnnouncements = {};   // /announcements 探测结果（失败 = {}，所有消费点 falsy 兜底）

/** 拉 announcements 配置：任何失败（404/网络/后端未上线）都回落为空对象，绝不挡启动 */
async function fetchAnnouncements() {
  const r = await fetch('/api/public/announcements');
  if (!r.ok) return {};
  const d = await r.json().catch(() => ({}));
  return d && typeof d === 'object' ? d : {};
}

/** 公告条统一 HTML（文案经 esc 转义；icon 只认文件内 ANNOUNCE_ICONS 白名单，
    白名单外的名字一律回默认图标 —— 与后端 STEP_ICON_WHITELIST 同一口径，防注入） */
function annBarHtml(id, cfg, defIcon) {
  cfg = cfg || {};
  if (!cfg.enabled || !cfg.text) return '';   // 关着 / 没文案：不出（调用方空串直拼）
  const icon = ANNOUNCE_ICONS.indexOf(cfg.icon) >= 0 ? cfg.icon : defIcon;
  return '<div class="ann-bar" id="' + id + '">' +
    '<span class="material-symbols-outlined ann-ico">' + esc(icon) + '</span>' +
    '<span class="ann-tx">' + esc(cfg.text) + '</span>' +
  '</div>';
}

/** 📣 公告条渲染（2026-10-14）：页面顶部唯一渲染入口，按 items 数组顺序一条一个
    .ann-item，几条就渲染几条。
    契约（每条）：{ enabled, icon, title, name, wave, text, tone:'brand'|'plain' }
    · 只渲染 enabled=true 的（公开接口已过滤一遍，这里再兜一道，防管理端形态误喂）
    · tone=brand → 紫金渐变；其余/非法 → plain 白底描边（与后端 normalize_tone 同口径）
    · wave>0 → 人名后补 ' · ' + wan(wave)（wan 是页面已有函数）
    · title/name 都空而 text 有值 → 纯文本条；text 支持换行（CSS white-space:pre-line）
    · 三条都空 → 该条直接跳过，不占位
    安全：全程 createElement + textContent，后端字符串一律不进 innerHTML（零注入面）；
    icon 只认页面 ANNOUNCE_ICONS 白名单（与后端 STEP_ICON_WHITELIST 同一口径），
    白名单外/空串 → 按 tone 回默认图标。
    空数组/全关 → 容器清空且不占位（#annItems 自身无 margin，CSS :empty 再兜一层）。 */
function renderAnnounceItems(items) {
  const box = $('annItems');
  if (!box) return;
  box.textContent = '';   // 先清空（赋值 textContent 一次性摘掉所有子节点）
  const list = Array.isArray(items) ? items : [];
  for (const it of list) {
    if (!it || !it.enabled) continue;
    const title = String(it.title == null ? '' : it.title);
    const name = String(it.name == null ? '' : it.name);
    const text = String(it.text == null ? '' : it.text);
    if (!title && !name && !text) continue;   // 全空条：跳过，别留一条空壳占位
    const brand = it.tone === 'brand';
    const row = document.createElement('div');
    row.className = 'ann-item ' + (brand ? 'ai-brand' : 'ai-plain');
    const ico = document.createElement('span');
    ico.className = 'material-symbols-outlined ai-ico';
    const ic = String(it.icon == null ? '' : it.icon).trim();
    ico.textContent = ANNOUNCE_ICONS.indexOf(ic) >= 0
      ? ic : (brand ? 'emoji_events' : 'military_tech');
    row.appendChild(ico);
    const body = document.createElement('div');
    body.className = 'ai-body';
    if (title || name) {
      const head = document.createElement('div');
      head.className = 'ai-head';
      if (title) {
        const t = document.createElement('span');
        t.className = 'ai-title';
        t.textContent = title;
        head.appendChild(t);
      }
      if (name) {
        const n = document.createElement('span');
        n.className = 'ai-name';
        n.textContent = name + (Number(it.wave) > 0 ? ' · ' + wan(it.wave) : '');
        head.appendChild(n);
      }
      body.appendChild(head);
    }
    if (text) {
      const tx = document.createElement('div');
      tx.className = 'ai-text';
      tx.textContent = text;
      body.appendChild(tx);
    }
    row.appendChild(body);
    box.appendChild(row);
  }
  /* 条数变化会改公告区高度（虽然它不吸顶、--mh-h 只量 masthead），
     这里仍重算一次吸顶偏移，保证切换视图/初始化后的首帧布局口径一致。 */
  syncHeaderOffset();
}

/** 看板公告条：插在 toolbar 之前（#annItems 公告条下方）。每次 bootRest 都重建 = 每次进看板都显示 */
function renderHomeAnnouncement(home) {
  const old = $('home-ann');
  if (old) old.remove();   // 静默刷新重复调用时先摘旧的，避免叠两条
  const html = annBarHtml('home-ann', home, 'notifications');
  if (!html) return;
  const tb = $('toolbar');
  if (tb && tb.parentNode) tb.insertAdjacentHTML('beforebegin', html);
}

/** 「我的」页公告条：renderMy 渲染完成后调用，插在 view 内容最顶上。
    loadMy 每次都整体重建 view，天然不持久 —— 每次进「我的」都重新显示。 */
function renderMyAnnouncement(my) {
  const html = annBarHtml('my-ann', my, 'person');
  if (!html) return;
  const box = $('view');
  if (box) box.insertAdjacentHTML('afterbegin', html);
}

/* ---- 🎉 彩带：全屏 canvas 粒子（零依赖，rAF 驱动；样式全内联不碰其它元素） ---- */

/** 发射彩带：顶部两侧喷射 80~120 个彩色矩形/圆片，重力下落 + 旋转，
    durationMs 后自动停止并移除 canvas（重复调用会先清掉上一场） */
function fireConfetti(durationMs) {
  durationMs = Number(durationMs) > 0 ? Number(durationMs) : 2500;
  /* 上一场还没结束就再点：直接掐掉旧的 rAF 和 canvas，保证全场只有一份 */
  if (fireConfetti._raf) { cancelAnimationFrame(fireConfetti._raf); fireConfetti._raf = null; }
  const old = document.getElementById('confettiCanvas');
  if (old) old.remove();

  const doc = document.documentElement;
  const cv = document.createElement('canvas');
  cv.id = 'confettiCanvas';
  /* 全屏覆盖、绝不挡操作；z-index 9999 压过登录门(90)/toast 等一切 UI */
  cv.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;' +
    'pointer-events:none;z-index:9999;');
  cv.width = doc.clientWidth;
  cv.height = doc.clientHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');

  /* 配色：金/蓝/紫/粉，与整站庆祝视觉（items 里 tone=brand 那条紫金公告条）一致 */
  const COLORS = ['#F59E0B', '#FBBF24', '#3B82F6', '#8B5CF6', '#EC4899', '#F472B6', '#FDE68A'];
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* 80~120 个粒子：从左上 / 右上两个喷射点往外上方抛，带随机初速、角速度与形状 */
  const N = 80 + Math.floor(Math.random() * 41);
  const W = cv.width, H = cv.height;
  const parts = [];
  for (let i = 0; i < N; i++) {
    const left = i % 2 === 0;                       // 偶数从左侧喷、奇数从右侧喷
    parts.push({
      x: left ? rnd(0, W * 0.12) : rnd(W * 0.88, W),
      y: rnd(-20, H * 0.08),
      vx: (left ? 1 : -1) * rnd(2, 7),              // 左点朝右上喷、右点朝左上喷
      vy: -rnd(7, 13),                              // 先向上抛，重力再拉下来
      w: rnd(6, 11), h: rnd(8, 16),                 // 矩形尺寸
      r: rnd(0, Math.PI * 2),                       // 当前旋转角
      vr: rnd(-0.22, 0.22),                         // 角速度
      round: Math.random() < 0.35,                  // 35% 圆片、其余矩形
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }

  const g = 0.22;                                   // 重力（px/帧²）
  const t0 = performance.now();
  const tick = (now) => {
    const el = now - t0;
    if (el >= durationMs || !cv.isConnected) {      // 到点 / canvas 被移除：收场
      cv.remove();
      fireConfetti._raf = null;
      return;
    }
    /* 最后 500ms 整体淡出，避免彩带凭空消失 */
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = el > durationMs - 500 ? Math.max(0, (durationMs - el) / 500) : 1;
    for (const p of parts) {
      p.vy += g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 24) continue;                   // 已落出屏：不再画
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.color;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    fireConfetti._raf = requestAnimationFrame(tick);
  };
  fireConfetti._raf = requestAnimationFrame(tick);
}

/* ---- 🎉 每日之星登录庆祝：彩带 + 紫金庆祝横幅（当天只弹一次） ---- */

/* 当天只庆祝一次的两层锁：
   · sessionStorage celebrateShown_<YYYY-MM-DD> —— 跨页面加载（刷新/再进站当天不再弹）；
   · celebrateFiredThisLoad（内存）—— 本次页面里的庆祝事件进行中（登录时刻彩带已放，
     紧接着 bootRest 挂横幅属于同一次庆祝，不能被当天锁误吞）。 */
let celebrateFiredThisLoad = false;

function celebrateShownToday() {
  try { return !!sessionStorage.getItem('celebrateShown_' + todayStr()); }
  catch (_) { return false; }
}
function markCelebrateShown() {
  try { sessionStorage.setItem('celebrateShown_' + todayStr(), '1'); } catch (_) {}
}

/** 登录成功触发点（boot 主路径）：celebrate.enabled && confetti → 放彩带。
    只放彩带、只写锁；展示内容全部走 items（见 renderAnnounceItems），
    这里不再挂任何横幅。 */
function fireConfettiOnce(celebrate) {
  if (!celebrate || !celebrate.enabled || !celebrate.confetti) return;
  if (celebrateShownToday() || celebrateFiredThisLoad) return;
  markCelebrateShown();
  celebrateFiredThisLoad = true;
  fireConfetti(2800);
}

/** 庆祝彩带补挂（2026-10-14 改）：横幅已并入 items（tone=brand 那条），本函数
    **只**负责「彩带允许但本次页面还没放过」的补一场 + 两层锁，不再渲染任何横幅元素。
    （原实现往页面顶部再插一条庆祝横幅，与固定冠军条一起造成顶部两条重复，
    该路径已删除。）
    site.celebrate 是主数据源；site 没带字段（后端只发 /announcements）用 preferAnn 兜底。
    彩带允许但还没放过（比如 confetti 只在 site 侧给出 / 关登录直接进站）→ 这里补一场。
    bootRest 每次页面加载只跑一次，本函数天然只在首屏执行；静默刷新不经过这里。 */
function ensureCelebrateConfetti(celebrate, preferAnn) {
  const c = celebrate && (celebrate.enabled || celebrate.title || celebrate.name)
    ? celebrate : preferAnn;
  if (!c || !c.enabled) return;
  /* 当天已庆祝过、且本次页面没有进行中的庆祝事件 → 今天放过了，不再补 */
  if (celebrateShownToday() && !celebrateFiredThisLoad) return;
  /* 彩带：允许 && 本次页面还没放过（当天锁顺带写上，覆盖 confetti 只配在 site 侧的情况） */
  if (c.confetti && !celebrateFiredThisLoad) {
    markCelebrateShown();
    celebrateFiredThisLoad = true;
    fireConfetti(2800);
  }
}


/* 引导开着时锁背景滚动（iOS Safari 上 body overflow:hidden 不够，要连 touchmove 一起挡） */
var announceScrollDepth = 0;
function lockScroll() {
  announceScrollDepth++;
  var prev = document.body.style.overflow;
  document.body.setAttribute('data-ann-overflow', prev || '');
  document.body.style.overflow = 'hidden';
}
function unlockScroll() {
  announceScrollDepth = Math.max(0, announceScrollDepth - 1);
  if (announceScrollDepth > 0) return;
  document.body.style.overflow = document.body.getAttribute('data-ann-overflow') || '';
  document.body.removeAttribute('data-ann-overflow');
}

/* 登录门 / 地区门禁出现时把引导收掉，避免两层遮罩叠着。
   会话中途（登录 reload 前的窗口期）切页也可能把 spotlight 元素冲掉，一并清。 */
function dismissAnnounce() {
  clearAnnounceSpot();
  if (announceCtx) announceCtx();
}

(async function boot() {
  applyTeam();
  /* 公告/庆祝配置（2026-10-13）：并行探测 GET /api/public/announcements，
     失败/后端未上线时回落为全关（{}），所有消费点都按 falsy 兜底，不挡启动流程。
     items 也在这份里先垫一帧，见 bootRest 顶部。 */
  siteAnnouncements = await fetchAnnouncements().catch(() => ({}));
  if (await siteIsOpen()) { bootRest(); return; }
  const me = await ensureLogin();
  applyLoginState(me);   // 登录后立刻按账号团别设置 TEAM
  /* 登录彩带（2026-10-13）：celebrate.enabled && celebrate.confetti 才放。
     只放彩带、不挂横幅（展示内容走 items）；
     celebrateFiredThisLoad 记着本次页面的庆祝事件已开跑，site 数据回来后
     ensureCelebrateConfetti 不会因为当天锁误吞/重放。 */
  fireConfettiOnce(siteAnnouncements.celebrate);
  bootRest();
})();

async function bootRest() {

  /* 主导航 + 分组子导航 + 前进/后退 */
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => switchView(b.dataset.v));
  document.querySelectorAll('#subnav button').forEach(b =>
    b.onclick = () => { if (!b.disabled) { curGroup = b.dataset.g; switchView('group'); } });
  window.addEventListener('popstate', () => {
    const r = parseRoute();
    if (r.view === 'group' && r.group) curGroup = r.group;
    /* 「我的」子页进出（浏览器返回键 / 子页内返回按钮共用） */
    if (r.view === 'my') {
      const next = r.mySub || null;
      if (view === 'my') { mySub = next; renderMySub(); return; }
      mySub = next;
    } else if (view === 'my') {
      mySub = null;
    }
    switchView(r.view, { push: false });
  });
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setPeriod(b.dataset.p));
  $('btnSearch').onclick = () => {
    searchOpen = !searchOpen;
    show('searchBox', searchOpen);
    $('btnSearch').classList.toggle('on', searchOpen);
    if (searchOpen) $('q').focus();
  };
  $('q').oninput = (e) => { q = e.target.value; renderList(); };
  $('qClear').onclick = () => { q = ''; $('q').value = ''; renderList(); };
  $('pPrev').onclick = () => shiftStep(-1);
  $('pNext').onclick = () => shiftStep(1);
  $('btnCal').onclick = calShow;

  function shiftStep(n) {
    if (period === 'monthly') {
      curPeriod = stepPeriod(n);      // 只在有数据的月份之间走
    } else {
      curPeriod = snapPeriod('yearly', String(+curPeriod + n));
    }
    syncStepper();
    go();
  }

  /* 📣 公告条先垫一帧（2026-10-14）：site 还没回来，先用 boot 里探测到的
     /api/public/announcements.items（登录前就能拿到，与 site.items 同源同口径）。
     site 到了以后由下面的 renderAnnounceItems(site.items) 整包覆盖；
     site.items 不是数组（旧后端）时才回落到这份兜底。 */
  renderAnnounceItems(Array.isArray(siteAnnouncements.items) ? siteAnnouncements.items : []);

  /* 先拿站点配置：登录开关在 settings 里，关登录时根本不用弹登录门。
     401（要登录）→ 弹登录门重试。 */
  const fetchSite = () => api('/api/public/teams/' + TEAM);
  try {
    site = await fetchSite().catch(async (e) => {
      if (String(e.message || '').indexOf('登录') < 0) throw e;
      const me = await ensureLogin();
      applyLoginState(me);
      return fetchSite();
    });
  } catch (e) {
    if (regionBlockedShown) return;   // 已展示地区门禁整页提示，别覆盖成「连不上服务」
    document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="big">📡</span>' +
      '连不上服务，稍后再试试</div>';
    return;
  }
  if (!site.published) {
    document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="big">📺</span>' +
      '<b>' + LABEL() + '数据暂未公布</b><br>请等管理员发布</div>';
    return;
  }
  /* 📣 公告条（2026-10-14）：页面顶部唯一渲染入口 —— site.items 是主数据源
     （顺序即从上到下，几条渲染几条；空数组 = 一条都不显示），整包覆盖掉上面那帧兜底。
     旧后端没有 items 字段时才回落到 boot 探测的 /announcements.items。
     site.champ / site.celebrate 兼容期后端仍会下发，但这里**不再**单独渲染
     （原来是固定冠军条 + 庆祝横幅两条独立路径同时渲染 = 顶部重复一条冠军）。 */
  renderAnnounceItems(Array.isArray(site.items) ? site.items : siteAnnouncements.items);
  /* 📣 看板公告条（2026-10-13）：placements.home 开着才渲染。不持久化关闭 ——
     公告是运营触达位，每次进看板都显示。 */
  renderHomeAnnouncement(site.placements && site.placements.home);
  /* 🎉 登录庆祝彩带（2026-10-14）：只补彩带 + 两层锁，不再挂横幅（内容走 items）。 */
  ensureCelebrateConfetti(site.celebrate, siteAnnouncements.celebrate);

  /* 展示端登录门（2026-10-11）：后台「开启登录」开着 → 先登录再看；
     关掉 → 全面开放，直接展示全量数据（统一入口，不再分男团/女团）。 */
  const loginRequired = (site.settings || {}).loginRequired !== false;
  if (loginRequired) {
    await ensureLogin().then(applyLoginState);
    site = await fetchSite();
  }
  /* 未绑定主播的提醒条：点「去绑定」直接进「我的」绑定卡 */
  $('bindBarGo').onclick = () => switchView('my');
  syncHeaderOffset();

  // 后台级开关：关掉的口径直接从界面消失（后端也不下发）
  const s = site.settings || {};
  const segs = { daily: s.daily !== false, monthly: s.monthly !== false, yearly: s.yearly !== false };
  document.querySelectorAll('#seg button').forEach(b => {
    b.disabled = !segs[b.dataset.p];
    if (!segs[b.dataset.p]) b.textContent = b.textContent + '（已关）';
  });
  if (!segs.daily && segs.monthly) period = 'monthly';
  else if (!segs.daily && segs.yearly) period = 'yearly';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.p === period));

  /* 每日报告页被关掉时首页落到分组（分组也关则落到族谱）；深链指到被关的页也一样改道 */
  const firstOn = (v, fb) => {
    if (v === 'data' && s.dataEnabled === false) return fb;
    if (v === 'group' && (s.groupEnabled === false ||
        !document.querySelector('#subnav button:not([disabled])'))) return fb;
    if (v === 'lineage' && (s.lineageEnabled === false || TEAM === 'female')) return fb;
    if (v === 'my' && s.loginRequired === false) return fb;
    return v;
  };
  const fallbackView = s.groupEnabled !== false &&
    document.querySelector('#subnav button:not([disabled])') ? 'group'
    : (s.dataEnabled !== false ? 'data' : 'lineage');
  view = firstOn(view, fallbackView);

  /* 默认站在昨天：数据每晚 24 点后才补前一天，今天那条一来就想看往往还没有。
     昨天万一还没入库（延迟或停采），退回库里最新那天，别把页面留在空状态。 */
  const dates0 = site.dates || [];
  curDate = dates0.includes(refStr()) ? refStr() : site.latestDate;
  curPeriod = snapPeriod(period, nowPeriod(period));   // 只站有数据的周期
  show('dates', period === 'daily');
  show('stepper', period !== 'daily');
  show('btnCal', period === 'daily');   // 日历只管「按日」口径；月/年走 ‹ › 步进
  $('pNow').textContent = period === 'monthly'
    ? curPeriod.slice(0, 4) + '年' + (+curPeriod.slice(5, 7)) + '月'
    : curPeriod + '年';
  syncStepper();

  await loadPlans();
  syncNav();

  /* 首页 = 每日报告：/st/m 直开时保留路径不跳转；带子路径（/group/xxx、/lineage）时
     按子路径落到对应视图，分享/刷新都不丢。深链指到被后台关掉的页时改道到首页兜底。 */
  const r0 = parseRoute();
  if (r0.view === 'group' && r0.group) curGroup = r0.group;
  /* 「我的」子页深链：/my/bind 等 → 全局 mySub，loadMy 渲染完按它落子页 */
  if (r0.view === 'my' && r0.mySub) mySub = r0.mySub;
  view = firstOn(r0.view, fallbackView);
  if (view === 'group' && r0.view === 'group' && r0.group) {
    const sub = document.querySelector('#subnav button[data-g="' + r0.group + '"]');
    if (sub && sub.disabled) curGroup = GROUP_PAGES.find(p => !document
      .querySelector('#subnav button[data-g="' + p.key + '"]').disabled)?.key || curGroup;
  }
  switchView(view, { push: false });
  scheduleRefresh();
  /* 引导放最后：它依赖 site.settings / site.announcement，且必须让位给登录门。
     登录成功后 gateResolve 会 reload，二次进来时 localStorage 已记住版本就不弹了。 */
  maybeAnnounce();
}

/* 字段面板已随「严格按排行榜版式」移除：显示内容固定，后台级开关仍在后端生效。 */
</script>
</body>
</html>
