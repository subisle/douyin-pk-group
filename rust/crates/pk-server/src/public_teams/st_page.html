/* hidden 属性必须赢过任何 display 规则（新版 UI 大量 flex/grid 布局会覆盖它） */
[hidden] { display:none !important; }
.hidden { display:none !important; }

/* ===== Masthead（Cupertino 毛玻璃浅色头部） ===== */
.masthead { background:var(--glass); color:var(--on-surface);
  -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;
  position:sticky; top:0; z-index:30; overflow:hidden;
  border-bottom:1px solid var(--hairline);
  box-shadow:0 1px 3px rgba(0,0,0,.04); }
.masthead::before { content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% -20%, rgba(0,122,255,.08), transparent 70%); }
/* 头部（2026-10-16 用户口径）：标题整块居中 —— 三栏网格（左 1fr / 中 auto / 右 1fr），
   中栏宽度 = 标题本身，所以标题天然落在**整行正中**；换团胶囊固定右栏、右对齐。
   副标题从 .mh-title 里拆出来单占一行（.mh-sub）整行居中 —— 若跟着标题挤在中栏，
   长副标题（DATA 2026.10.12 · 2/101 有数据）会被右侧胶囊压成省略号。 */
.mh-top { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
  position:relative; }
.mh-badge { width:36px; height:36px; border-radius:11px; background:var(--masthead-surface);
  border:1px solid var(--hairline-dark); display:grid; place-items:center; font-weight:800;
  font-size:15px; color:var(--primary); flex:none; }
/* 徽标兼「换团」按钮：点一下回团别选择卡 */
.mh-badge.mh-switch { cursor:pointer; font-size:13px; }
.mh-badge.mh-switch:active { transform:scale(.94); }
.mh-title { grid-column:2; min-width:0; text-align:center; }
.mh-title .t { font-weight:800; font-size:17px; letter-spacing:-.01em; color:var(--on-surface); }
/* 副标题行：整行居中（长文本走省略号，不挡右侧胶囊） */
.mh-sub { margin-top:2px; font-size:11px; color:var(--ink3); font-family:Menlo,monospace;
  text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 📣 头部公告行（2026-10-17 用户口径）：原来公告内容占三块竖排大卡（#annItems 两条
   紫金横幅 + #home-ann 蓝色通知条，合计近半屏、滚走前一直占位），现在全部收进
   masthead 内的**单行胶囊**：随头部吸顶、只占一行 22px。多条公告 4 秒轮换单行
   淡入淡出（JS 侧 renderAnnounceItems / renderHomeAnnouncement）。
   单行省略：nowrap + ellipsis，行内居中；max-width 95% 与头部同宽感。 */
.mh-ann { display:flex; align-items:center; justify-content:center; gap:4px;
  height:22px; margin:4px auto 6px; max-width:95%; padding:2px 10px;
  border-radius:9999px; font-size:11px; line-height:1.2; text-align:center;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  background:#F5F3FF; border:1px solid #C4B5FD; color:#4C1D95; }
/* 品牌条（tone=brand）：沿 .ann-item.ai-brand 的紫金渐变，整体调淡一档适配头部小字 */
.mh-ann.ai-brand { background:linear-gradient(120deg,#6D28D9 0%,#8B5CF6 45%,#B45309 100%);
  border-color:rgba(245,158,11,.55); color:#FFFBEB;
  box-shadow:0 2px 10px rgba(109,40,217,.25); }
/* 蓝色通知条（renderHomeAnnouncement 并入的 placements.home）：沿原 .ann-bar 浅蓝 */
.mh-ann.ai-home { background:linear-gradient(135deg,#EAF3FF,#E0EDFF);
  border-color:var(--primary-fixed-dim); color:var(--on-surface); }
.mh-ann .material-symbols-outlined { font-size:14px; line-height:1; flex:none;
  color:inherit; opacity:.85; }
/* 单行内多条轮换的淡入淡出（同一行内换内容，不换行不撑高） */
.mh-ann .mha-tx { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:opacity .45s ease; }
.mh-ann .mha-tx.mha-fade { opacity:0; }
/* 轮换角标「1/3」：只有多条时渲染，字号压到 9.5px */
.mh-ann .mha-idx { flex:none; font-size:9.5px; opacity:.65; font-family:Menlo,monospace; }
/* 换团条（2026-10-15）：头部右侧三胶囊，只给「全团」账号。
    2026-10-16：改成网格右栏 + 右对齐（原来是 flex:1 的标题挤着它）；同时收紧一档 ——
    原自然宽 140px 比右栏（390 屏上 127px）还宽，按钮会被压成两行。 */
.team-switch { grid-column:3; justify-self:end; display:flex; gap:3px; padding:2px; border-radius:11px;
  background:var(--masthead-surface); border:1px solid var(--hairline-dark); }
.team-switch button { border:none; background:none; cursor:pointer; padding:4px 6px;
  border-radius:8px; font-size:11.5px; font-weight:700; color:var(--ink3);
  font-family:inherit; line-height:1; white-space:nowrap; transition:all .15s; }
.team-switch button:active { transform:scale(.94); }
.team-switch button.on { background:var(--primary); color:#fff; }
.team-switch.hidden { display:none; }
/* 极窄屏（≤370px，如 360 安卓机）：胶囊再收一档，保持「标题居中 + 胶囊右对齐」不打架 */
@media (max-width:370px) {
  .team-switch button { padding:3px 5px; font-size:11px; }
}
/* 分组子导航（按赛事类型拆页，浅色胶囊，仅在分组页显示） */
.subnav { display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:10px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  mask-image:linear-gradient(to right,#000 94%,transparent 100%); position:relative; }
.subnav::-webkit-scrollbar { display:none; }
.subnav button { flex:none; height:30px; padding:0 13px; border-radius:var(--r-full);
  background:#F2F4F7; border:1px solid transparent; color:var(--on-surface-variant);
  font-size:12.5px; }
.subnav button.on { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }

/* 📣 公告大卡（2026-10-14 → 2026-10-17 停用）：原顶部竖排公告大卡样式整组保留不删
   （弹窗与别的块仍引用其中部分类名），但顶部已不再渲染 —— 公告内容收进头部单行
   胶囊 .mh-ann（见上方 2026-10-17 注释块），#annItems 容器保留、不再写入。 */
#annItems:empty { display:none; }
/* 2026-10-15 task-9②：上下间距收窄（原 margin:10 / padding:10~12 太松），
   行距也跟着压：整卡看起来更紧凑，一屏能装下更多内容。 */
/* 2026-10-16（用户口径）：横幅左右收窄 —— 原 margin:6px 12px 几乎贴着屏幕边，
   改成两侧各 20px、居中；宽屏（iPad）再限宽 520px，与正文 560px 栏对齐。 */
.ann-item { display:flex; align-items:flex-start; gap:9px; margin:6px auto;
  width:calc(100% - 40px); max-width:520px;
  padding:7px 12px; border-radius:11px; }
.ann-item.ai-plain { background:linear-gradient(135deg,#F5F3FF,#EDE9FE); border:1px solid #C4B5FD; }
.ann-item.ai-brand { padding:8px 12px;
  background:linear-gradient(120deg,#4C1D95 0%,#6D28D9 45%,#B45309 100%);
  border:1px solid #F59E0B; color:#FFFBEB; box-shadow:0 4px 18px rgba(109,40,217,.35); }
.ann-item .ai-ico { font-size:21px; line-height:1.2; flex:none; color:#6D28D9; }
.ann-item.ai-brand .ai-ico { font-size:22px; color:#FDE68A; }
.ann-item .ai-body { flex:1; min-width:0; }
.ann-item .ai-head { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
.ann-item .ai-title { font-weight:800; font-size:13.5px; line-height:1.3; color:#6D28D9; }
.ann-item.ai-brand .ai-title { color:#FDE68A; }
.ann-item .ai-name { font-weight:700; font-size:13.5px; line-height:1.3; color:#101828; }
.ann-item.ai-brand .ai-name { color:#FFFBEB; }
.ann-item .ai-text { font-size:12.5px; line-height:1.5; margin-top:1px;
  white-space:pre-line; word-break:break-word; }
/* 前三位姓名（人名一格写多人、按名次换行）：紧凑名次行，空名次不渲染所以不留空行 */
.ann-item .ai-ranks { display:flex; flex-direction:column; gap:1px; margin-top:2px; }
.ann-item .ai-rank { display:flex; align-items:center; gap:6px; line-height:1.35; }
.ann-item .ai-rank-no { flex:none; width:14px; height:14px; border-radius:9999px; font-size:9.5px;
  font-weight:700; display:grid; place-items:center;
  background:rgba(109,40,217,.12); color:#6D28D9; }
.ann-item.ai-brand .ai-rank-no { background:rgba(253,230,138,.24); color:#FDE68A; }
.ann-item .ai-rank-nm { font-weight:700; font-size:13px; color:#101828; }
.ann-item.ai-brand .ai-rank-nm { color:#FFFBEB; }
/* 横幅对齐（2026-10-16 用户口径，管理端用三个对齐图标按条设置）：
   ai-left = 原版式（图标靠左、正文 flex:1 撑满，一字不动）；
   ai-center / ai-right —— 正文不能再撑满（flex:1 会把 justify-content 吃掉），
   改成「图标 + 文案」作为一整组靠中 / 靠右，标题行与名次行同步对齐。 */
.ann-item.ai-center { justify-content:center; }
.ann-item.ai-center .ai-body { flex:0 1 auto; text-align:center; }
.ann-item.ai-center .ai-head,
.ann-item.ai-center .ai-rank { justify-content:center; }
.ann-item.ai-right { justify-content:flex-end; }
.ann-item.ai-right .ai-body { flex:0 1 auto; text-align:right; }

.ann-item.ai-right .ai-rank { justify-content:flex-end; }

/* ===== 📣 公告弹窗（2026-10-16 三甲通报 Stitch 1:1 改版） =====
   设计源：.stitch/designs/stitch_announcement_modal_redesign/（stitch_announcement_modal_redesign (1).zip）。
   1:1 口径：尺寸/间距/渐变/阴影直接取设计稿 HTML 在 390px 视口的实测渲染值
   （卡片 366×554、徽章图 136×136、选手卡高 134、主按钮 48、胶囊高 26 等），
   主徽章用设计稿原 Poster 图（assets/badge-{1,2,3}.png 内嵌 data URI）。
   items 里 enabled && popup 条目按配置顺序翻页（1/3 冠军 → 2/3 亚军 → 3/3 季军……），
   每页同一骨架同一尺寸（卡片定高 554、中段超出内部滚动，翻页不跳尺寸）。
   z-index 89：低于登录门 #gate(90)（登录门打开时被盖住，open 前还有 gate 检查兜底）、

#itemPopup { position:fixed; inset:0; z-index:89; background:rgba(6,2,18,.78);

#itemPopup.hidden { display:none; }
@keyframes ipOverlayIn { from { opacity:0; } to { opacity:1; } }
@keyframes ipCardIn {

  60%  { opacity:1; transform:translateY(0) scale(1.005); }
  to   { opacity:1; transform:none; } }
@keyframes ipPageIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
@keyframes ipSpinSlow { to { transform:rotate(360deg); } }
@keyframes ipSpinReverse { to { transform:rotate(-360deg); } }
@keyframes ipPulseGlow { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:.95; transform:scale(1.1); } }
@keyframes ipFloatSoft { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-9px) scale(1.02); } }
@keyframes ipTwinkle { 0%,100% { opacity:.3; transform:scale(.8); } 50% { opacity:1; transform:scale(1.3); } }

@keyframes ipSweep { 0% { left:-60%; } 60%,100% { left:120%; } }
@keyframes ipDrop {
  0% { transform:translateY(-40px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); opacity:0; }

#itemPopup.ip-overlay-in { animation:ipOverlayIn .22s ease both; }
/* 全屏氛围层（设计稿三层）：圣殿天光 + 顶峰紫金聚光源 + 底部玄紫托底 */
.ip-rays { position:absolute; top:-40px; left:50%; width:600px; max-width:100vw; height:780px;
  transform:translateX(-50%); pointer-events:none;

/* 金紫飘落粒子层：打开时生成一次，翻页不重建 */
.ip-particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.ip-particles span { position:absolute; top:-24px; display:block; will-change:transform,opacity; }
/* 舞台 = 卡片 + 卡下提示；margin:auto 在内容溢出可滚时也保持居中 */

  display:flex; flex-direction:column; align-items:center; }
/* 卡片：外层 2px 流光渐变铸边（::before）+ 内层深紫圣殿；高度锁设计稿 554（同尺寸保证） */
.ip-box { position:relative; flex:none; width:min(382px, calc(100vw - 24px)); height:min(554px, calc(100dvh - 88px));
  border-radius:32px; padding:2px; overflow:hidden; box-sizing:border-box;

  display:flex; flex-direction:column;

.ip-box::before { content:''; position:absolute; inset:0; border-radius:32px; pointer-events:none;
  background:linear-gradient(180deg, rgba(216,180,254,.7) 0%, rgba(147,51,234,.35) 55%, rgba(245,158,11,.4) 100%); }

.ip-capsule { flex:none; margin-bottom:4px; display:inline-flex; align-items:center; gap:6px;

.ip-main { flex:1 1 auto; min-height:0; width:100%; overflow-x:hidden; overflow-y:auto;

   · ip-theme-gold   冠军（殿堂至尊光环）：鎏金日冕双环 + 太阳芒羽 + 金色能量核
   · ip-theme-purple 亚军（殿堂排面）：紫晶双星轨（默认原有体系）
   · ip-theme-ice    季军（殿堂透视星轨）：冰蓝倾斜透视椭圆星轨 + 双能量星体 */
.ip-visual { position:relative; flex:none; width:100%; height:184px; margin:-4px 0;

.ip-halo { position:absolute; width:224px; height:224px; border-radius:50%; pointer-events:none;

.ip-theme-gold .ip-podium-ring { border-color:rgba(253,224,71,.45);

.ip-theme-ice .ip-badge { filter:drop-shadow(0 12px 24px rgba(14,116,222,.55)); }
/* 星轨一：顺时针 24s（上缘浅紫 / 下缘琥珀，含内发光），星点琥珀 top-1 left-8 */
.ip-orbit { position:absolute; width:176px; height:176px; border-radius:50%; pointer-events:none;
  border:1.5px solid transparent;
  border-top-color:rgba(233,213,255,.7); border-bottom-color:rgba(251,191,36,.55);
  box-shadow:0 0 16px rgba(168,85,247,.5), inset 0 0 16px rgba(251,191,36,.35);
  animation:ipSpinSlow 24s linear infinite; }
.ip-orbit i { position:absolute; top:4px; left:32px; width:10px; height:10px; border-radius:50%;
  background:#fde047; box-shadow:0 0 8px #fde047; }
/* 星轨二：逆时针 18s（左缘紫晶 / 右缘鎏金虚线），星点浅紫 bottom-3 right-8 */
.ip-orbit2 { position:absolute; width:192px; height:192px; border-radius:50%; pointer-events:none;
  border:1.5px dashed transparent;
  border-left-color:rgba(192,132,252,.75); border-right-color:rgba(253,224,71,.6);
  box-shadow:0 0 20px rgba(192,132,252,.45);
  animation:ipSpinReverse 18s linear infinite; }
.ip-orbit2 i { position:absolute; bottom:12px; right:32px; width:8px; height:8px; border-radius:50%;
  background:#E9D5FF; box-shadow:0 0 8px #E9D5FF; }
/* ---- 冠军专属（Stitch 冠军稿）：鎏金日冕双环 + 太阳芒羽 + 金色能量核 ---- */
/* 日冕外环：逆时针 22s 精密金色能量环（上缘亮金 / 下缘深金，内发光） */
.ip-theme-gold .ip-corona { position:absolute; width:212px; height:212px; border-radius:50%;
  pointer-events:none; border:2px solid transparent;
  border-top-color:rgba(254,243,138,.85); border-bottom-color:rgba(217,119,6,.6);
  box-shadow:0 0 22px rgba(251,191,36,.5), inset 0 0 22px rgba(253,224,71,.35);
  animation:ipSpinReverse 22s linear infinite; }
/* 日冕四芒星与能量星珠（随环旋转） */
.ip-theme-gold .ip-corona i { position:absolute; font-style:normal; color:#fde047;
  text-shadow:0 0 8px #fde047; animation:ipTwinkle 2s ease-in-out infinite; }
.ip-theme-gold .ip-corona .dot { position:absolute; top:2px; right:36px; width:9px; height:9px;
  border-radius:50%; background:#fde047; box-shadow:0 0 10px #fbbf24; }
/* 鎏金星轨：顺时针 16s 粒子环（左缘琥珀 / 右缘亮金虚线） */
.ip-theme-gold .ip-orbit { width:178px; height:178px;
  border-top-color:rgba(253,224,71,.75); border-bottom-color:rgba(245,158,11,.55);
  box-shadow:0 0 18px rgba(251,191,36,.5), inset 0 0 18px rgba(253,224,71,.3);
  animation:ipSpinSlow 16s linear infinite; }
.ip-theme-gold .ip-orbit i { background:#fbbf24; box-shadow:0 0 10px #fbbf24; }
.ip-theme-gold .ip-orbit2 { border-left-color:rgba(251,191,36,.7); border-right-color:rgba(254,240,138,.6);
  box-shadow:0 0 20px rgba(245,158,11,.45);
  animation:ipSpinReverse 24s linear infinite; }
.ip-theme-gold .ip-orbit2 i { background:#fef08a; box-shadow:0 0 8px #fef08a; }
/* 太阳芒羽：徽章背后放射状金色佛光，周期旋转 + 缩放呼吸 */
.ip-sunburst { position:absolute; width:260px; height:260px; border-radius:50%; pointer-events:none;
  opacity:.85; z-index:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,
    rgba(253,224,71,.28) 0deg 4deg, transparent 4deg 12deg);
  -webkit-mask-image:radial-gradient(circle, #000 0%, #000 30%, transparent 68%);
  mask-image:radial-gradient(circle, #000 0%, #000 30%, transparent 68%);
  animation:ipSunspin 40s linear infinite, ipPulseGlow 4s ease-in-out infinite; }
@keyframes ipSunspin { to { transform:rotate(360deg); } }
/* 金色能量核：徽章正后方耀斑光团，让徽章宛如悬浮在耀日中心 */
.ip-glowcore { position:absolute; width:150px; height:150px; border-radius:50%; pointer-events:none;
  z-index:1;
  background:radial-gradient(circle, rgba(254,240,138,.55) 0%, rgba(251,191,36,.32) 40%, transparent 70%);
  animation:ipPulseGlow 3s ease-in-out infinite; }
/* ---- 季军专属（Stitch 季军稿）：冰蓝倾斜透视椭圆星轨 + 双能量星体 ---- */
/* 透视星轨：rotateX(68deg) + rotate(-15deg) 的立体椭圆，发光描边，绕椭圆公转 */
.ip-ice-orbit { position:absolute; width:200px; height:200px; border-radius:50%; pointer-events:none;
  z-index:0; border:1.5px solid rgba(125,211,252,.55);
  box-shadow:0 0 18px rgba(56,189,248,.45), inset 0 0 18px rgba(56,189,248,.25);
  transform:rotateX(68deg) rotate(-15deg);
  animation:ipIceSpin 14s linear infinite; }
@keyframes ipIceSpin { to { transform:rotateX(68deg) rotate(345deg); } }
/* 沿轨能量星体：椭圆前后各一颗（前亮后暗），公转由父级旋转带动 */
.ip-ice-orbit i { position:absolute; top:50%; left:-4px; width:9px; height:9px; margin-top:-4px;
  border-radius:50%; background:#7dd3fc; box-shadow:0 0 12px #38bdf8; }
.ip-ice-orbit i:nth-child(2) { left:auto; right:-4px; top:50%; margin-top:-4px;
  background:#bae6fd; box-shadow:0 0 10px rgba(186,230,253,.9); }
/* 冰蓝虚线内环：反向慢转，丰富层次 */
.ip-ice-orbit2 { position:absolute; width:168px; height:168px; border-radius:50%; pointer-events:none;
  z-index:0; border:1.5px dashed rgba(186,230,253,.4);
  transform:rotateX(68deg) rotate(-15deg);
  animation:ipIceSpin2 20s linear infinite reverse; }
@keyframes ipIceSpin2 { to { transform:rotateX(68deg) rotate(345deg); } }
/* 冰蓝暗幕光晕（星轨背后的圆形暗部遮罩 + 极光扩散） */
.ip-ice-veil { position:absolute; width:224px; height:224px; border-radius:50%; pointer-events:none;
  z-index:0;
  background:radial-gradient(circle, rgba(2,6,23,.55) 0%, rgba(8,47,90,.35) 45%, rgba(14,116,222,.18) 62%, transparent 75%);
  animation:ipPulseGlow 3.5s ease-in-out infinite; }
/* 主徽章：设计稿原 Poster 图 136×136 + 呼吸浮动 + 紫晶投影 */
.ip-badge { position:relative; z-index:2; width:136px; height:136px;
  animation:ipFloatSoft 3.5s ease-in-out infinite;
  filter:drop-shadow(0 12px 24px rgba(147,51,234,.55)); }
.ip-badge img { width:136px; height:136px; object-fit:contain; display:block;
  user-select:none; -webkit-user-drag:none; }
.ip-spark { position:absolute; pointer-events:none; animation:ipTwinkle 2s ease-in-out infinite; }
/* 标题（25px/900 烫金银渐变，行高 38 = 实测）+ 荣耀副行（12px/600 .1em 紫） */
.ip-titles { flex:none; width:100%; margin:0 0 16px; }
.ip-titles h1 { margin:0 0 4px; font-size:25px; line-height:38px; font-weight:900; letter-spacing:.05em;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8FAFC 30%,#E2E8F0 60%,#F59E0B 95%,#B45309 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 2px 10px rgba(168,85,247,.65)) drop-shadow(0 4px 20px rgba(0,0,0,.9)); }
.ip-sub { margin:0; display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:12px; line-height:16px; font-weight:600; letter-spacing:.1em; color:rgba(233,213,255,.9); }
.ip-sub i { font-style:normal; color:#fbbf24; animation:ipPulseGlow 2.5s ease-in-out infinite; }
/* 选手荣耀卡：定高 134（设计稿实测 p-4），内部上排 + 奖励行。
   2026-10-16 用户口径：上排 space-between 的中段空洞过大 → space-evenly 把
   头像↔成绩的中缝收到与两侧边缘一致，名字短也显得排满合适。 */
.ip-player { position:relative; flex:none; width:100%; height:134px; box-sizing:border-box;
  padding:16px; border-radius:16px; margin-bottom:16px; overflow:hidden; text-align:left;
  display:flex; flex-direction:column;
  background:linear-gradient(90deg, rgba(59,7,100,.7) 0%, rgba(88,28,135,.5) 50%, rgba(30,27,75,.7) 100%);
  border:1px solid rgba(192,132,252,.4);
  box-shadow:0 0 24px rgba(168,85,247,.28), inset 0 0 16px rgba(216,180,254,.15);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.ip-player::before { content:''; position:absolute; top:0; right:0; width:80px; height:80px;
  background:linear-gradient(225deg, rgba(192,132,252,.2) 0%, transparent 70%); pointer-events:none; }
.ip-p-row { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:space-evenly; gap:8px; }
.ip-p-left { display:flex; align-items:center; gap:12px; min-width:0; }
.ip-ava { position:relative; flex:none; }
.ip-ava-ring { width:56px; height:56px; border-radius:50%; padding:2.5px; box-sizing:border-box;
  background:linear-gradient(45deg, #fbbf24 0%, #d8b4fe 50%, #818cf8 100%);
  box-shadow:0 0 12px rgba(168,85,247,.5); }
.ip-ava-core { width:100%; height:100%; border-radius:50%; background:#1b0a3b; border:2px solid #391973;
  display:grid; place-items:center; overflow:hidden; box-sizing:border-box;
  color:#fff; font-weight:800; font-size:18px; letter-spacing:.05em; }
/* 抖音真头像：铺满圆形容器（与领奖台头像同口径：无白框、cover 裁圆） */
.ip-ava-core .ip-ava-img { width:100%; height:100%; object-fit:cover; display:block;
  user-select:none; -webkit-user-drag:none; }
.ip-ava-core .material-symbols-outlined { font-size:24px; color:#d8b4fe; }
/* 头像角标（2026-10-16 用户口径「去除金字」：DOM 不再生成，样式保留仅为
   旧结构兜底，等下一轮清理可删）。 */
.ip-ava-rank { display:none; }
.ip-p-info { min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.ip-p-name { font-size:16px; line-height:24px; font-weight:800; letter-spacing:.025em; color:#F1F5F9;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  max-width:9em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ip-chip { display:inline-flex; align-items:center; gap:6px; max-width:100%;
  padding:2px 8px; border-radius:9999px;
  background:rgba(88,28,135,.8); border:1px solid rgba(192,132,252,.4);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3); }
.ip-chip i { flex:none; width:6px; height:6px; border-radius:50%; background:#22d3ee;
  box-shadow:0 0 5px #22d3ee; animation:ipPulseGlow 2.5s ease-in-out infinite; }
.ip-chip span { font-size:10px; font-weight:600; letter-spacing:.025em; color:#E9D5FF;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ip-score { flex:none; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; }
.ip-score em { font-style:normal; font-size:11px; font-weight:500; letter-spacing:-.025em; color:rgba(216,180,254,.9); }
.ip-score-row { display:flex; align-items:baseline; justify-content:flex-end; }
.ip-score-row b { font-size:30px; line-height:36px; font-weight:900; letter-spacing:-.025em; color:#fcd34d;
  text-shadow:0 2px 8px rgba(251,191,36,.5); }
.ip-score-row i { font-style:normal; font-size:16px; font-weight:800; color:#fde68a; margin-left:2px; }
.ip-score-row u { text-decoration:none; font-size:12px; font-weight:700; color:#fde68a; margin-left:1px; }
/* 奖励行（1:1）：设计稿勾选 SVG + 文案（单行省略）+「已派发」绿标，mt-3 pt-2.5 分隔线 */
.ip-reward { flex:none; display:flex; align-items:center; gap:6px; min-width:0;
  margin-top:12px; padding-top:10px; border-top:1px solid rgba(147,51,234,.25); }
.ip-reward > svg { flex:none; width:14px; height:14px; color:#d8b4fe; }
.ip-reward-text { flex:1 1 auto; min-width:0; font-size:11px; line-height:16px; font-weight:500;
  color:rgba(233,213,255,.9); text-align:left;
  white-space:nowrap; overflow:hidden; }
.ip-reward-text .rich p { margin:0; display:inline; }
.ip-reward-text .rich ul { margin:0; padding:0; list-style:none; display:inline; }
.ip-reward-text .rich li { display:inline; margin:0; padding:0; }
.ip-reward-text .rich li + li::before { content:' · '; }
.ip-reward-text .rich b { color:#fde047; font-weight:700; }
.ip-ok-pill { flex:none; font-size:10px; line-height:16px; font-weight:700; letter-spacing:.05em;
  color:#6ee7b7; background:rgba(6,78,59,.8); padding:2px 8px; border-radius:9999px;
  border:1px solid rgba(16,185,129,.4); box-shadow:0 1px 2px rgba(0,0,0,.2); }
/* 主按钮（h-12 鎏金渐变 + 扫光 + chevron SVG）与进度小字 */
.ip-actions { flex:none; width:100%; margin-top:0;
  display:flex; flex-direction:column; align-items:center; gap:8px; }
.ip-next { position:relative; width:100%; height:48px; border-radius:16px; cursor:pointer;
  border:1px solid rgba(254,243,199,.5); overflow:hidden;
  background:linear-gradient(90deg, #fbbf24 0%, #fde047 50%, #eab308 100%);
  box-shadow:0 6px 22px rgba(245,158,11,.38);
  color:#3b0764; font-size:16px; font-weight:900; letter-spacing:.05em;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:transform .15s ease; }
.ip-next:active { transform:scale(.98); }
.ip-next > svg { flex:none; width:16px; height:16px; }
.ip-next i.sweep { position:absolute; top:0; bottom:0; width:40%; left:-60%; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
  animation:ipSweep 2.5s ease-in-out infinite; }
.ip-foot { margin:2px 0 0; font-size:11px; line-height:16px; font-weight:500; letter-spacing:.025em;
  color:rgba(216,180,254,.8); text-align:center; }
/* 卡下提示：点它等同点空白（进入下一页 / 最后一页关闭） */
.ip-tip { margin-top:16px; display:inline-flex; align-items:center; gap:4px;
  font-size:12px; color:rgba(216,180,254,.6); cursor:pointer; }
.ip-tip b { font-size:10px; }
@media (prefers-reduced-motion: reduce) {
  #itemPopup.ip-overlay-in, .ip-box, .ip-page, .ip-rays, .ip-particles span,
  .ip-podium, .ip-halo, .ip-orbit, .ip-orbit2, .ip-badge, .ip-spark,
  .ip-theme-gold .ip-corona, .ip-sunburst, .ip-glowcore,
  .ip-ice-orbit, .ip-ice-orbit2, .ip-ice-veil,
  .ip-sub i, .ip-capsule i, .ip-chip i, .ip-next i.sweep { animation:none !important; }
  .ip-next i.sweep { display:none; }
}
@media (max-width:360px) {
  #itemPopup { padding:8px; }
  .ip-p-name { max-width:7em; }
}

/* 底部标签栏（看板 / 分组 / 族谱 / 我的 / 微信对接）：毛玻璃 + 安全区 */
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:31;
  display:flex; background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--hairline);
  padding-bottom:env(safe-area-inset-bottom,0px); }
/* 2026-10-15 task-11：第 5 项「微信对接」加入后要 5 等分且不换行 ——
   flex:1 + min-width:0 保证横向均分，white-space:nowrap 保证「微信对接」四字不折行。 */
.tabbar button { flex:1; min-width:0; height:52px; border:none; background:transparent; color:var(--ink3);
  font-size:11px; white-space:nowrap; padding:0 2px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.tabbar button .ic { width:24px; height:24px; display:grid; place-items:center; }
.tabbar button.on { color:var(--primary); font-weight:700; }
/* 窄屏（≤375px，iPhone SE/mini 一档）5 项时再收一点字号，优先保住「微信对接」全文案 */
@media (max-width:375px) {
  .tabbar button { font-size:10px; letter-spacing:-.02em; }
  .tabbar button .ic { width:22px; height:22px; }
}
.tabbar button:active { opacity:.55; }

/* 工具栏（口径 + 日期 + 搜索 + 字段） */
.toolbar { position:sticky; top:var(--mh-h, 56px); z-index:8; background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); border-bottom:1px solid var(--hairline);
  padding:8px 12px; }
.tools { max-width:560px; margin:0 auto; }
.seg { display:flex; background:#F2F4F7; border-radius:var(--r-full); padding:3px; }
.seg button { flex:1; height:32px; border:none; border-radius:var(--r-full); background:transparent;
  color:var(--on-surface-variant); font-size:13px; }
.seg button.on { background:#fff; color:var(--on-surface); font-weight:700;
  box-shadow:0 1px 2px rgb(16 24 40 / 12%); }
.seg button:disabled { color:#c2c8d2; cursor:not-allowed; }
.line2 { display:flex; align-items:center; gap:8px; margin-top:8px; }
.dates { display:flex; gap:8px; overflow-x:auto; flex:1; padding-bottom:2px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  mask-image:linear-gradient(to right,#000 88%,transparent 100%); }
.dates::-webkit-scrollbar { display:none; }
.dates button { flex:none; height:32px; padding:0 14px; border-radius:var(--r-full);
  background:#fff; border:1px solid var(--hairline); color:var(--on-surface-variant);
  font-size:12.5px; font-family:Menlo,monospace; }
.dates button.on { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }
.dates button.nodata { color:#C2C8D2; }
.dates .mgap { flex:none; align-self:center; font-size:10px; color:var(--ink3);
  font-weight:700; padding-left:2px; }
.stepper { display:flex; align-items:center; gap:4px; flex:1; min-width:0; }
.stepper button { width:34px; height:32px; border-radius:var(--r-sm); background:#fff;
  border:1px solid var(--hairline); color:var(--on-surface-variant); line-height:1; }
.stepper .now { flex:1; text-align:center; font-family:Menlo,monospace; font-size:14px; font-weight:600; }
.icon-btn { width:34px; height:32px; border-radius:var(--r-sm); background:#fff;
  border:1px solid var(--hairline); display:grid; place-items:center; color:var(--on-surface-variant); flex:none; }
.icon-btn.on { border-color:var(--primary); color:var(--primary); background:var(--highlight-bg); }
.search { display:flex; align-items:center; gap:6px; margin-top:8px; background:#fff;
  border:1px solid var(--hairline); border-radius:var(--r-sm); padding:0 10px; height:34px; }
.search input { flex:1; border:none; outline:none; font:inherit; background:transparent; color:var(--on-surface); }
.search input::placeholder { color:var(--ink3); }

/* ===== 点击即时反馈（2026-10-10）：RTT≈260ms，点了必须先有反应再等数据 ===== */
/* manipulation：去掉移动端双击缩放判定，点按立刻生效；高亮由下面的 :active 出 */
button { touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.lb-row, .pod, .gx-mem { touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.tabbar button:active, #subnav button:active, .seg button:active { opacity:.55; }
.dates button:active, .stepper button:active, .icon-btn:active,
.ln-ctl button:active { background:#EDF0F5; transform:scale(.93); }
.pod:active, .lb-row:active { opacity:.72; }
.gx-mem:active { background:rgba(255,255,255,.55); }
.my-logout:active, .my-push .go:active,
.gate-box .btn-main:active, .team-pick .pick-btn:active { opacity:.7; }
/* 请求在途：标题旁小菊花 + 内容轻微压暗（不清空已看内容，数据回来直接换） */
#mhSpin { display:none; width:12px; height:12px; flex:none;
  border:2px solid var(--hairline); border-top-color:var(--primary); border-radius:50%;
  animation:spin .7s linear infinite; }
body.busy #mhSpin { display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
#view { transition:opacity .12s; }
body.busy #view { opacity:.62; }
@media (hover:hover) {
  .tabbar button:hover { color:var(--primary); }
  #subnav button:hover { background:#E5E7EB; color:var(--on-surface); }
  .dates button:hover, .stepper button:hover, .icon-btn:hover { background:#F4F6FA; }
  .lb-row:hover { background:#F8FAFD; }
  .seg button:not(.on):hover { color:var(--on-surface); }
}

/* ===== 日期日历（2026-10-10）：横向日期条太长时点 📅 弹日历挑日期 ===== */
.cal-btn { flex:none; }
.cal-pop { position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end;
  justify-content:center; background:rgba(11,15,23,.45); animation:fade .15s ease-out; }
.cal-pop.hidden { display:none; }
.cal-card { background:#fff; border-radius:18px 18px 0 0; padding:14px 14px
  calc(env(safe-area-inset-bottom,0px) + 14px); width:100%; max-width:400px;
  box-shadow:0 -8px 32px rgba(11,15,23,.22); animation:calUp .18s ease-out; }
@keyframes calUp { from { transform:translateY(40px); opacity:.6; } to { transform:none; opacity:1; } }
@media (min-width:640px) {
  .cal-pop { align-items:center; }
  .cal-card { border-radius:18px; }
}
.cal-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.cal-head .ttl { flex:1; text-align:center; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
.cal-head button { width:34px; height:32px; border-radius:var(--r-sm); background:#fff;
  border:1px solid var(--hairline); color:var(--on-surface-variant); line-height:1; }
.cal-head .close { border:none; background:none; font-size:17px; color:var(--ink3); width:30px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-grid .wd { text-align:center; font-size:10.5px; color:var(--ink3); padding:4px 0 6px; }
.cal-grid .wd.wkend { color:#D92D20; }
.cal-d { height:40px; border:none; background:none; border-radius:10px;
  font-size:13.5px; color:var(--on-surface); font-variant-numeric:tabular-nums;
  display:grid; place-items:center; position:relative; }
.cal-d:disabled { color:#C9CFDA; }
.cal-d.dim { color:#98A2B3; }           /* 非本月 */
.cal-d.today::after { content:''; position:absolute; bottom:5px; left:50%;
  transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--primary); }
.cal-d.has::before { content:''; position:absolute; top:6px; right:8px;
  width:5px; height:5px; border-radius:50%; background:#10B981; }  /* 有数据的日期 */
.cal-d.on { background:var(--primary); color:#fff; font-weight:700; }
.cal-d:active { background:#EDF0F5; }
.cal-d.on:active { background:#1D4ED8; }

/* ===== 内容 ===== */
.wrap { padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 78px); max-width:560px; margin:0 auto; }
.section { animation:fade .18s ease-out; }
@keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.card { background:var(--card-bg); border:1px solid var(--hairline); border-radius:var(--r-lg); }
.card + .card { margin-top:12px; }
.card-pad { padding:14px 16px; }
h2.card-t { font-size:13px; font-weight:700; color:var(--ink3); margin:0 0 4px;
  letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; }

/* ===== 排行榜（Stitch Apple Style Mobile Showcase 精确还原） ===== */
.st-podium { display:grid; grid-template-columns:1fr 1.25fr 1fr; align-items:end; gap:.25rem;
  padding:1rem 1rem 1.5rem; }
.st-pod { display:flex; flex-direction:column; align-items:center; min-width:0; text-align:center; }
.st-pod-2 { padding-bottom:.5rem; }
.st-pod-1 { padding-bottom:1.25rem; }
.st-pod-3 { padding-bottom:.25rem; }
.st-pod-ring { position:relative; margin-bottom:1rem; }
.st-pod-1 .st-pod-ring { margin-bottom:1.25rem; }
.st-pod-av { border-radius:9999px; display:grid; place-items:center; font-weight:600;
  box-shadow:0 4px 10px rgba(0,0,0,.10); }
.st-pod-1 .st-pod-av { width:80px; height:80px; background:#fffbeb; color:#78350f;
  font-size:22px; font-weight:700; letter-spacing:-.015em; box-shadow:0 8px 20px rgba(0,0,0,.14); }
 .st-pod-2 .st-pod-av, .st-pod-3 .st-pod-av { width:64px; height:64px; font-size:18px; }
.st-pod-av.st-pod-in-1 { width:70px; height:70px; background:#fffbeb; color:#78350f; }
.st-pod-av.st-pod-in-2 { width:56px; height:56px; background:#f1f5f9; color:#334155; }
.st-pod-av.st-pod-in-3 { width:56px; height:56px; background:#f5f5f4; color:#44403c; }
/* 真头像（T3）：后端给了 avatar 的容器带 .has-img，<img> 铺满圆形容器裁切；
   底色与首字只属于没头像的人，所以有图时把容器底色去掉（领奖台的金银铜底、列表行的
   柔和底都靠这一步让位），尺寸一概不变，版式与旧版完全一致。 */
.st-pod-av img, .st-row-av img { width:100%; height:100%; object-fit:cover; border-radius:9999px; display:block; }
.st-pod-av.has-img, .st-row-av.has-img { background:none; }
/* 领奖台奖杯（金/银/铜，替代原 crown 图标）：源文件 public_teams/assets/trophy-1.svg（金，第1名）/ trophy-2.svg（银，第2名）/ trophy-3.svg（铜，第3名），
   iconfont 导出、viewBox 0 0 1024 1024，**已去掉原图浅色圆底**（透明背景）。
   为保持本页自包含（零外网/零新路由），三份 SVG 已按名次内嵌为 base64 data URI。
   换图步骤：替换 assets/trophy-N.svg 后重跑
     base64 -i rust/crates/pk-server/src/public_teams/assets/trophy-N.svg | tr -d '\n'
   把新串贴回 TROPHY_SRC 对应名次即可（保持单行、末尾无换行）。 */
/* 位置（2026-10-16 用户口径「头部不显示了，数字换成…」）：奖杯挂在头像**正下方**——
   原来挂在头像顶上正好压住主播的脸；而且奖杯自带名次数字，原先那个数字药丸是重复的，
   所以整体替代掉（DOM 里已无 .st-pod-rank）。 */
.st-trophy { position:absolute; bottom:-.625rem; left:50%; transform:translateX(-50%);
  width:1.75rem; height:1.75rem; display:block; pointer-events:none; user-select:none;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.18)); }
.st-pod-1 .st-trophy { bottom:-.75rem; width:2rem; height:2rem; }
.st-pod-nm { margin:.25rem 0 0; font-size:18px; font-weight:600; letter-spacing:-.01em; color:var(--on-surface);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.st-pod-2 .st-pod-nm, .st-pod-3 .st-pod-nm { font-size:14px; }
.st-pod-off { margin-top:.125rem; display:inline-block; padding:0 .5rem; border-radius:.25rem;
  background:var(--surface-container); color:var(--on-surface-variant);
  font-size:10px; line-height:1.5; font-weight:400; }
.st-pod-1 .st-pod-off { padding:.125rem .5rem; border-radius:9999px; font-size:11px;
  background:rgba(185,28,28,.06); color:var(--error); border:1px solid rgba(185,28,28,.16); }
.st-pod-1 .st-pod-off.warn { background:rgba(185,28,28,.08); }
.st-pod-wv { margin:.25rem 0 0; font-size:15px; font-weight:700; color:var(--on-surface);
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.st-pod-1 .st-pod-wv { font-size:18px; color:var(--primary); }
.st-pod-lbl { display:block; font-size:11px; color:var(--primary); font-weight:500; letter-spacing:.02em; }
.st-pod-total { margin:.125rem 0 0; font-size:11px; color:var(--on-surface-variant);
  font-variant-numeric:tabular-nums; }
.st-pod-1 .st-pod-total { font-weight:500; }

/* 排行榜列表（4 名起） */
.st-list { display:flex; flex-direction:column; gap:.25rem; padding:0 1rem 1.5rem; }
.st-list-head { display:flex; align-items:center; justify-content:space-between; padding:0 .25rem .25rem; }

.st-row-nmwrap { display:flex; align-items:center; gap:.375rem; min-width:0; }
.st-row-nm { font-size:15px; font-weight:600; color:var(--on-surface);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.st-row-off { padding:0 .375rem; border-radius:.25rem; background:var(--surface-container);
  color:var(--on-surface-variant); font-size:10px; line-height:1.5; font-weight:400; flex:none; }
.st-row-off.warn { background:rgba(185,28,28,.06); color:var(--error); }
.st-row-sub { margin:.125rem 0 0; font-size:11px; color:var(--primary); font-variant-numeric:tabular-nums; }
.st-row.off .st-row-sub { color:var(--outline); }
.st-row-r { text-align:right; flex:none; }
.st-row-wv { display:block; font-size:15px; font-weight:700; color:var(--on-surface);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.st-row-lbl { display:block; font-size:11px; color:var(--on-surface-variant);
  font-variant-numeric:tabular-nums; }

/* ===== 工具栏（日榜/月榜 segmented + 日期胶囊）Stitch 版 ===== */
.st-seg { display:flex; background:var(--surface-container-high); border-radius:9999px;
  padding:.25rem; gap:.25rem; }
.st-seg button { flex:1; height:1.875rem; border-radius:9999px; border:none; background:transparent;
  color:var(--on-surface-variant); font-size:14px; font-weight:500; }
.st-seg button.on { background:var(--surface-container-lowest); color:var(--on-surface);
  box-shadow:0 1px 3px rgba(0,0,0,.08); }

.dates button { background:var(--surface-container); border-color:transparent; color:var(--on-surface-variant); }
.dates button.on { background:var(--surface-container-lowest); color:var(--on-surface);
  box-shadow:0 1px 3px rgba(0,0,0,.08); border-color:transparent; position:relative; }
.dates button.on::before { content:''; width:.375rem; height:.375rem; border-radius:9999px;
  background:var(--primary); display:inline-block; margin-right:.25rem; vertical-align:middle; }
.icon-btn { background:var(--surface-container-low); border-color:transparent; border-radius:9999px; }

.search { background:var(--surface-container-lowest); border-radius:.75rem; }
.search input { background:transparent; }

/* ===== 分组页（Pk Tournament）Stitch 版 ===== */
.st-group-tabs { display:flex; align-items:center; gap:.25rem; padding:.25rem;
  background:var(--surface-container); border-radius:.75rem; overflow-x:auto;
  scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.st-group-tabs::-webkit-scrollbar { display:none; }
.st-group-tabs button { flex:none; padding:.375rem 1rem; border-radius:.5rem; border:none;
  background:transparent; color:var(--on-surface-variant); font-size:14px; font-weight:500; }
.st-group-tabs button.on { background:var(--surface-container-lowest); color:var(--primary);
  font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.st-group-tabs button:disabled { color:var(--outline); }
.st-group-chips { display:flex; gap:.5rem; overflow-x:auto; padding-bottom:1rem;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(to right,#000 92%,transparent 100%); }
.st-group-chips::-webkit-scrollbar { display:none; }
.st-group-chip { flex:none; display:flex; align-items:center; gap:.5rem; padding:.5rem 1rem;
  border-radius:9999px; background:var(--surface-container-lowest); color:var(--on-surface);
  box-shadow:0 1px 3px rgba(0,0,0,.06); font-size:12px; font-weight:600; cursor:pointer;
  border:none; }

  box-shadow:0 2px 6px rgba(0,88,188,.24); }
.st-group-chip .n { width:.25rem; height:.25rem; border-radius:9999px; background:var(--outline-variant); }
.st-group-chip.on .n { background:rgba(255,255,255,.6); }
.st-group-chip .c { color:var(--on-surface-variant); font-weight:400; }
.st-group-chip.on .c { color:rgba(255,255,255,.95); }
.st-group-cards { display:flex; overflow-x:auto; gap:1rem; padding-bottom:1rem;
  scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.st-group-cards::-webkit-scrollbar { display:none; }
.st-gcard { scroll-snap-align:center; flex:none; width:86vw; max-width:360px;
  display:flex; flex-direction:column; gap:.5rem; }
.st-gcard-head { display:flex; align-items:center; justify-content:space-between; padding:0 .125rem; }
.st-gcard-head .l { display:flex; align-items:center; gap:.5rem; }
.st-gcard-head .bar { width:.375rem; height:1rem; border-radius:9999px; background:var(--primary); }
.st-gcard-head .bar.alt { background:var(--secondary); }
.st-gcard-head h2 { margin:0; font-size:18px; font-weight:600; color:var(--on-surface); letter-spacing:-.01em; }
.st-gcard-head .cnt { font-size:12px; color:var(--on-surface-variant); font-weight:500; }
.st-gcard-body { background:var(--surface-container-lowest); border-radius:.75rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; display:flex; flex-direction:column; }
.st-gmem { display:flex; align-items:center; gap:1rem; padding:.75rem 1rem;
  border-bottom:1px solid var(--surface-container); transition:background .15s; }
.st-gmem:last-child { border-bottom:none; }
.st-gmem:hover { background:var(--surface-container-low); }
.st-gmem-rk { width:1.5rem; text-align:center; font-size:18px; font-weight:700;

.st-gmem-av { width:2.5rem; height:2.5rem; border-radius:9999px; background:var(--surface-container);

.st-gmem:nth-child(1) .st-gmem-av { color:var(--primary); }
.st-gmem:nth-child(2) .st-gmem-av { color:var(--secondary); }
.st-gmem-nm { font-size:14px; font-weight:500; color:var(--on-surface);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ===== 族谱页（Clan Lineage）Stitch 版 ===== */
.st-ln-tools { display:flex; align-items:center; gap:.5rem; padding:.5rem 0 1rem; }
.st-ln-search { flex:1; display:flex; align-items:center; gap:.5rem; height:2.5rem;
  background:var(--surface-container-lowest); border-radius:.75rem; padding:0 1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06); }
.st-ln-search input { flex:1; border:none; outline:none; background:transparent;
  font-size:13px; color:var(--on-surface); min-width:0; }
.st-ln-search input::placeholder { color:var(--outline); }
/* 搜索框内「清除」按钮（设计稿 cancel 图标）：有输入时才出现，避免常驻占位 */
.st-ln-clear { border:none; background:transparent; padding:0; display:grid; place-items:center;
  color:var(--on-surface-variant); flex:none; }
.st-ln-clear .material-symbols-outlined { font-size:18px; }
.st-ln-btn { width:2.5rem; height:2.5rem; border-radius:.75rem; background:var(--surface-container-lowest);
  border:none; box-shadow:0 1px 3px rgba(0,0,0,.06); display:grid; place-items:center;
  color:var(--on-surface-variant); font-size:16px; flex:none; }
.st-ln-btn:active { transform:scale(.95); }
.st-ln-stat { background:var(--surface-container-lowest); border-radius:.75rem; padding:1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:1rem; }
/* 指标卡固定 3 格（设计稿 Apple Clean Grid）：单根=直属徒弟/师傅音浪/师徒总音浪，
   多根=公会在册/代际分支/累计音浪 */
.st-ln-stat-g { display:grid; grid-template-columns:repeat(3,1fr); gap:.25rem; text-align:center; }
.st-ln-stat-g .k { font-size:18px; font-weight:600; color:var(--on-surface); font-variant-numeric:tabular-nums; }
.st-ln-stat-g .k.hl { color:var(--primary); }
.st-ln-stat-g .v { font-size:11px; color:var(--on-surface-variant); margin-top:.125rem; }
.st-branch { display:flex; flex-direction:column; gap:1.5rem; padding:0 0 1rem; }
/* 支系卡（设计稿 node-card）：内容比单行高，头像与折叠钮都顶对齐 */
.st-branch-card { background:var(--surface-container-lowest); border-radius:.75rem; padding:1rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; align-items:flex-start; justify-content:space-between; }
.st-branch-card .l { display:flex; align-items:flex-start; gap:1rem; min-width:0; flex:1; }
/* 根支系头像/代际胶囊用 primary-fixed 浅蓝底（设计稿一致），不再用 secondary 紫 */
.st-branch-av { width:3rem; height:3rem; border-radius:.75rem; background:var(--primary-fixed);
  color:var(--on-primary-fixed); display:grid; place-items:center; font-size:18px; font-weight:600; flex:none; }
.st-branch-av.sub { width:2.5rem; height:2.5rem; background:var(--surface-container-high);
  color:var(--on-surface); font-size:14px; border-radius:.75rem; }
.st-branch-nm { font-size:18px; font-weight:600; color:var(--on-surface); letter-spacing:-.01em; }
.st-branch-tag { padding:0 .5rem; border-radius:9999px; background:var(--primary-fixed);
  color:var(--on-primary-fixed); font-size:11px; line-height:1.5; margin-left:.375rem; }
.st-branch-sub { font-size:11px; color:var(--on-surface-variant); margin-top:.25rem; }
/* 「个人音浪」行：与 sub 同级的 caption，数字走 tabular-nums 对齐 */
.st-branch-wave { font-size:11px; color:var(--on-surface-variant); margin-top:.125rem;
  font-variant-numeric:tabular-nums; }
/* 卡内底部「师徒合算总音浪」条（设计稿：surface-container-low 圆角条，左 label 右数值） */
.st-branch-total { margin-top:.5rem; background:var(--surface-container-low); border-radius:.75rem;
  padding:.375rem .75rem; display:flex; align-items:center; justify-content:space-between;
  font-size:11px; font-weight:500; color:var(--on-surface); }
.st-branch-total b { font-size:14px; font-weight:600; color:var(--primary);
  font-variant-numeric:tabular-nums; }
/* 支系/子支系折叠钮（设计稿 branch-toggle：2rem 圆形 surface-container 底） */
.st-branch-tg { width:2rem; height:2rem; border-radius:9999px; border:none; padding:0;
  background:var(--surface-container); color:var(--on-surface-variant); display:grid;
  place-items:center; flex:none; margin-left:.5rem; }
.st-branch-tg .material-symbols-outlined { font-size:18px; }
.st-branch-tg:active { transform:scale(.94); }
.st-branch-kids { display:flex; flex-direction:column; padding-left:1.5rem; margin-top:.75rem;
  position:relative; gap:.75rem; }
.st-branch-kids::before { content:''; position:absolute; left:.875rem; top:0; bottom:.5rem;
  width:1px; background:var(--outline-variant); }
.st-branch-kid { position:relative; }
.st-branch-kid::before { content:''; position:absolute; left:-.75rem; top:1.5rem; width:1rem; height:1px;
  background:var(--outline-variant); }
.st-kid-card { margin-left:1.25rem; background:var(--surface-container-lowest); border-radius:.75rem;
  padding:.875rem 1rem; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; align-items:center;
  justify-content:space-between; }
.st-kid-card .l { display:flex; align-items:center; gap:.5rem; min-width:0; }
.st-kid-card .nm { font-size:14px; font-weight:600; color:var(--on-surface); }
/* 「N 代」与状态跟在姓名后面（设计稿：二代 狼小宝 · 活跃） */
.st-kid-card .gen { font-size:11px; color:var(--on-surface-variant); margin-left:.375rem; }
.st-kid-card .st { font-size:11px; color:var(--on-surface-variant); margin-left:.375rem; }
.st-kid-card .wv { font-size:11px; color:var(--on-surface-variant); margin-top:.125rem;
  font-variant-numeric:tabular-nums; }
/* 离团淡显：人在树上但权重放低，跟画布 .ln-node.off 同一语义 */
.st-kid-card.off { opacity:.5; }
/* 卡片树搜索（与画布 hit 同一个输入框驱动）：不匹配 dim、匹配描边高亮 */
.st-branch-card, .st-kid-card { transition:opacity .15s, box-shadow .15s; }
.st-branch-card.dim, .st-kid-card.dim { opacity:.4; }
.st-branch-card.hit, .st-kid-card.hit { box-shadow:0 0 0 2px var(--primary), 0 1px 3px rgba(0,0,0,.06); }
.st-ln-tip { background:var(--surface-container-low); border-radius:.75rem; padding:1rem;
  display:flex; align-items:flex-start; gap:1rem; margin-top:.5rem; }
.st-ln-tip .material-symbols-outlined { font-size:20px; color:var(--primary); margin-top:.125rem; }
.st-ln-tip .t { font-size:14px; font-weight:600; color:var(--on-surface); }

/* ===== 我的页（My Profile）Stitch 版 ===== */

/* ===== 我的抖音号卡（2026-10-12）：每个号一行，日/月/年/累计四格 =====
   title 行复用 .st-my-list .sec 口径，右侧「共 N 个」用同色 11px 非大写 */
.st-my-acct { background:var(--surface-container-lowest); border-radius:.75rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; margin-top:.75rem; }
.st-my-acct > .sec { padding:.5rem 1rem; font-size:11px; color:var(--outline);
  display:flex; align-items:center; justify-content:space-between; }
.st-my-acct > .sec .n { text-transform:none; letter-spacing:0; }
/* 合计条（2026-10-15 任务五）：原 surface-container-low 灰底升级为 primary-fixed
   淡主色底 + 同色内描边，与上面的普通行区分开，「合计」一眼可辨
   （仍是 Stitch 低饱和底色，不引入新颜色体系）。 */
.st-my-acct .sum { margin:0 1rem .5rem; background:var(--primary-fixed);
  box-shadow:inset 0 0 0 1px rgba(0,88,188,.12); border-radius:.5rem;
  padding:.5rem .75rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  font-size:12px; font-weight:500; color:var(--on-surface); }
.st-my-acct .sum .g { flex:1; min-width:0; display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr)); gap:.25rem .75rem; }
.st-my-acct .sum .c { display:flex; align-items:baseline; justify-content:flex-end; gap:.25rem;
  font-size:11px; font-weight:400; color:var(--on-surface-variant); }
.st-my-acct .sum .c b { font-size:13px; font-weight:600; color:var(--on-surface);
  font-variant-numeric:tabular-nums; text-align:right; min-width:3.5em; }
/* 单个抖音号行：.st-my-item 口径（左图标 + 主/副标题，右数值），无 chevron。
   窄屏兜底：撑不下时四格整块换行到下一行（左块有 8rem 基宽，不会把主标题挤没）。
   2026-10-15 任务五：行可点（点击复制抖音号），.copiable 挂 cursor + hover/active 反馈。 */
.st-my-acct .row { display:flex; flex-wrap:wrap; align-items:center;
  justify-content:space-between; gap:.25rem .75rem;
  padding:.875rem 1rem; border-top:1px solid var(--surface-container); }
.st-my-acct .row.copiable { cursor:pointer; -webkit-tap-highlight-color:transparent; }
.st-my-acct .row.copiable:hover { background:var(--surface-container-low); }
.st-my-acct .row.copiable:active { background:var(--surface-container); }
.st-my-acct .row .l { display:flex; align-items:center; gap:1rem; flex:1 1 8rem; min-width:0; }
.st-my-acct .row .ico { width:2rem; height:2rem; border-radius:.5rem;
  background:var(--surface-container); color:var(--on-surface-variant);
  display:grid; place-items:center; flex:none; }
.st-my-acct .row .ico .material-symbols-outlined { font-size:20px; }
.st-my-acct .row .t { font-size:15px; font-weight:500; color:var(--on-surface);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; max-width:100%; }
/* 主号 chip（2026-10-15 任务五微调）：加一圈淡主色描边，与开播 pill 的灰底区分更明显 */
.st-my-acct .row .chip { padding:0 .375rem; border-radius:9999px; background:rgba(0,88,188,.10);
  border:1px solid rgba(0,88,188,.18);
  color:var(--primary); font-size:11px; font-weight:600; line-height:1.5; flex:none; }
/* 开播状态点（2026-10-15 任务五：强化对比的小圆点 pill）：
   灰底灰点灰字 = 未开播；浅主色底 + 主色点（保留脉冲）+ 主色字 = 已开播 */
.st-my-acct .row .st { display:inline-flex; align-items:center; gap:.3rem; font-size:10.5px;
  font-weight:600; line-height:1.5; padding:.1rem .5rem; border-radius:9999px;
  background:var(--surface-container); color:var(--on-surface-variant); flex:none;
  white-space:nowrap; }
.st-my-acct .row .st i { width:.375rem; height:.375rem; border-radius:9999px;
  background:var(--outline-variant); flex:none; }
.st-my-acct .row .st.on { background:rgba(0,88,188,.10); color:var(--primary); }
.st-my-acct .row .st.on i { background:var(--primary); animation:stPulse 1.6s ease-in-out infinite; }
.st-my-acct .row .d { font-size:11px; color:var(--outline); margin-top:.125rem; }
/* 四格音浪：恒 2×2 小网格 —— 与左侧「标题+副标题」两行等高，且不抢占主标题宽度；
   2026-10-14 防挤：列宽 minmax(max-content,1fr)，数值格至少占满自身内容宽
   （「4万3892」这类带万字的值永不截断、永不和「日/月/年/累计」标签重叠），
   基宽 9rem→11rem 并允许 shrink，富余空间才均分；与 .l 的 8rem 基宽相加超容器时
   才整块换行（320px 屏折到第二行，绝不横向溢出）。
   2026-10-15 任务五：数值 b 加 text-align:right + min-width:3.5em 统一右对齐宽度，
   配合 tabular-nums 四行读数逐位对齐。 */
.st-my-acct .row .wg { display:grid; grid-template-columns:repeat(2,minmax(max-content,1fr));
  gap:.25rem .75rem; flex:0 1 11rem; margin-left:auto; }
.st-my-acct .row .wg .c { display:flex; align-items:baseline; justify-content:flex-end; gap:.25rem;
  font-size:11px; color:var(--on-surface-variant); white-space:nowrap; }
.st-my-acct .row .wg .c b { font-size:13px; font-weight:600; color:var(--on-surface);
  font-variant-numeric:tabular-nums; white-space:nowrap;
  text-align:right; min-width:3.5em; }
.st-my-acct .fail { padding:.75rem 1rem; font-size:11px; color:var(--outline); text-align:center; }
.st-my-acct .none { padding:1rem; font-size:12px; color:var(--on-surface-variant);
  text-align:center; line-height:1.7; }
.st-my-list { background:var(--surface-container-lowest); border-radius:.75rem;
  box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; margin-top:.75rem; }
.st-my-list .sec { padding:.5rem 1rem; font-size:11px; color:var(--outline);
  text-transform:uppercase; letter-spacing:.05em; }
.st-my-item { display:flex; align-items:center; justify-content:space-between; padding:.875rem 1rem;
  border-top:1px solid var(--surface-container); transition:background .15s; }
.st-my-item:hover { background:var(--surface-container-low); }
.st-my-item .l { display:flex; align-items:center; gap:1rem; min-width:0; }
.st-my-item .ico { width:2rem; height:2rem; border-radius:.5rem; background:var(--surface-container);
  display:grid; place-items:center; color:var(--on-surface-variant); flex:none; }
.st-my-item .ico .material-symbols-outlined { font-size:20px; }
.st-my-item .t { font-size:15px; font-weight:500; color:var(--on-surface); }
/* 标题旁的 chip（设计稿：已绑定 N 个）与标题下副行（设计稿 qr_code_scanner 项） */
.st-my-item .chip { padding:0 .375rem; border-radius:9999px; background:rgba(0,88,188,.10);
  color:var(--primary); font-size:11px; font-weight:500; line-height:1.5; margin-left:.375rem; flex:none; }
.st-my-item .d { font-size:11px; color:var(--outline); margin-top:.125rem; }
.st-my-item .r { display:flex; align-items:center; gap:.25rem; color:var(--on-surface-variant);
  font-size:13px; flex:none; }
.st-my-item .r .pri { color:var(--primary); font-weight:500; }
.st-my-item .r .material-symbols-outlined { font-size:18px; }

/* ===== 修复2：「我的」子页控件样式补齐 =====
   pushCard/追分卡（chaseValueBlock/chasePersonBlock/chaseRowHtml）用的
   .go/.sw/.tgt/.sr/.sr-list/.tk-opt/.tk-sel/.sk/.my-stat/.delta 等原来依赖
   .my-push 祖先类（旧 DOM），新 Stitch DOM（.st-my-list 直接包内容）
   没有该祖先，样式全部丢失。这里补一套独立规则，变量对齐文件头 :root
   （--primary/--hairline/--up/--down 等）。.tabs2 是旧三 tab 添加面板的遗留样式，
   2026-10-15 契约 B 起不再有 DOM 用它（保留无副作用）。 */
/* 主操作按钮：主色实底圆角；.go.gray 灰底次级款 */
.go { display:block; width:100%; height:40px; margin-top:10px; border:none;
  border-radius:var(--r-md); background:var(--primary); color:var(--on-primary);
  font-size:14px; font-weight:700; cursor:pointer; transition:opacity .15s, transform .1s; }
.go:active { transform:scale(.98); }
.go:disabled { opacity:.45; cursor:default; }
.go.gray { background:var(--surface-container-high); color:var(--on-surface);
  border:1px solid var(--hairline); font-weight:600; }
/* iOS 式开关：36x20 圆角轨道 + 滑块，checked 变主色 */
.sw { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px;
  color:var(--on-surface); cursor:pointer; -webkit-user-select:none; user-select:none; }
.sw input { appearance:none; -webkit-appearance:none; width:36px; height:20px; flex:none;
  border-radius:9999px; background:var(--surface-container-highest); position:relative;
  outline:none; cursor:pointer; transition:background .2s; }
.sw input::before { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:9999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform .2s; }
.sw input:checked { background:var(--primary); }
.sw input:checked::before { transform:translateX(16px); }
.sw input:disabled { opacity:.5; cursor:default; }
/* 追分目标行：flex 行 + 右侧删除 ✕ */
.tgt { display:flex; align-items:center; gap:8px; padding:9px 2px; font-size:13px;
  color:var(--on-surface); border-bottom:1px solid var(--hairline); }
.tgt:last-of-type { border-bottom:none; }
.tgt .x { flex:none; width:26px; height:26px; padding:0; margin-left:2px; border:none;
  border-radius:9999px; background:var(--surface-container); color:var(--on-surface-variant);
  font-size:13px; line-height:1; cursor:pointer; }
.tgt .x:active { background:var(--surface-container-high); color:var(--up); }
/* tab 切换：两个/三个等宽按钮，选中反色（主色底白字） */
.tabs2 { display:flex; gap:6px; margin-top:12px; }
.tabs2 button { flex:1; height:32px; padding:0 8px; border:1px solid var(--hairline);
  border-radius:var(--r-full); background:#fff; color:var(--on-surface-variant);
  font-size:12.5px; font-weight:600; cursor:pointer; }
.tabs2 button.on { background:var(--primary); border-color:var(--primary); color:#fff; }
/* 搜索框 + 下拉候选列表：相对定位容器，下拉绝对定位白底阴影 */
.sr { position:relative; margin-top:10px; }
.sr input { width:100%; height:40px; border:1px solid var(--hairline);
  border-radius:var(--r-md); padding:0 12px; font-size:14px; background:#fff;
  color:var(--on-surface); }
.sr input:focus { outline:none; border-color:var(--primary); }
.sr-list { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20;
  background:#fff; border:1px solid var(--hairline); border-radius:var(--r-md);
  box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:200px; overflow:auto; }
.sr-list > div { padding:9px 12px; font-size:13px; color:var(--on-surface);
  border-bottom:1px solid var(--hairline); cursor:pointer; }
.sr-list > div:last-child { border-bottom:none; }
.sr-list > div:active { background:var(--surface-container-low); }
.sr-list .none { color:var(--on-surface-variant); font-size:12px; cursor:default; }
/* 追分设置「目标人」多选候选行（2026-10-15 契约 B）：候选行左侧加原生 checkbox，
   点整行也能勾。选择器带 [type=checkbox] 是为了压过上面 `.sr input` 的输入框皮肤
   （`.sr input` 把任何后代 input 都撑成 100%×40px 的文本框）。 */
.sr-list > div.tk-opt { display:flex; align-items:center; gap:9px; }
.tk-opt input[type="checkbox"] { appearance:auto; -webkit-appearance:checkbox; flex:none;
  width:16px; height:16px; margin:0; padding:0; border:none; border-radius:2px;
  accent-color:var(--primary); cursor:pointer; }
.tk-opt input[type="checkbox"]:disabled { opacity:.45; cursor:default; }
/* 已选人 chip 行：点 chip = 取消选择 */
.tk-sel { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tk-sel .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 9px;
  border-radius:9999px; background:rgba(0,88,188,.10); color:var(--primary);
  font-size:12px; line-height:1.6; cursor:pointer; }
.tk-sel .chip:active { background:rgba(0,88,188,.2); }
/* 骨架屏：灰底块 + shimmer 扫光动画（shimmerList 用 .sk.sk-row） */
.sk { background:linear-gradient(90deg, var(--surface-container) 25%,
  var(--surface-container-highest) 45%, var(--surface-container) 65%);
  background-size:200% 100%; border-radius:6px;
  animation:skShimmer 1.4s ease-in-out infinite; }
.sk-row { height:14px; margin:12px 0; }
@keyframes skShimmer { from { background-position:120% 0; } to { background-position:-80% 0; } }
/* 统计行：label 左 / 值右（renderMy 里的 stat() 输出） */
.my-stat { display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  padding:8px 2px; font-size:13px; border-bottom:1px solid var(--hairline); }
.my-stat:last-child { border-bottom:none; }
.my-stat .l { color:var(--on-surface-variant); flex:none; }
.my-stat .w { font-weight:600; color:var(--on-surface);
  font-variant-numeric:tabular-nums; text-align:right; }

/* ===== 登录门（2026-10-12 已并入 712 行 stitch iOS Style 段，此处仅保留水印/团别卡）
   旧的 .gate-box 灰卡片样式整块删除：两处同名选择器按加载顺序后者胜出，
   会让 712 段的新设计稿皮肤失效。#gate 布局、.form-err、.btn-main、输入框
   全部以 712 段为准。 ===== */
#wm { position:fixed; inset:0; z-index:70; pointer-events:none; background-repeat:repeat; }
#wm[hidden] { display:none; }

/* ===== 引导弹窗（2026-10-12 大厂级）：分步引导 + 品牌头 + 步骤条 + 键盘/手势 =====
   对齐 Apple / 微信「新功能介绍」的做法：
   · 居中卡片，毛玻璃遮罩 + 卡片回弹入场（不是硬弹）
   · 品牌头（图标 + 「新功能」chip）替代裸标题，每步一个图标
   · 进度条可点（Pill 步骤条），第 N 步可点回跳
   · Esc / 点遮罩 = 跳过，← → 键盘翻页，触屏左右滑动翻页
   · 底部「跳过引导」+ 主按钮「下一步 / 知道啦」，上一步有但不抢焦点
   · 滚动锁定（body overflow hidden），长文案卡内滚动，不会把按钮顶出屏幕
   · prefers-reduced-motion 时关掉动画 */
#announce { position:fixed; inset:0; z-index:100; background:rgba(11,15,23,.55);
  display:flex; align-items:center; justify-content:center; padding:20px;
  -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%); }
#announce.hidden { display:none; }
@keyframes annOverlayIn { from { opacity:0; } to { opacity:1; } }
@keyframes annCardIn {
  from { opacity:0; transform:translateY(24px) scale(.96); }
  60%  { opacity:1; transform:translateY(0) scale(1.005); }
  to   { opacity:1; transform:none; }
}
@keyframes annStepIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
@keyframes annIconPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
#announce.ann-overlay-in { animation:annOverlayIn .22s ease both; }
.announce-box { max-width:352px; width:100%; max-height:calc(100dvh - 40px);
  background:#fff; border-radius:22px; padding:0 0 18px; text-align:center;
  box-shadow:0 24px 70px rgb(0 0 0 / 28%); overflow:hidden;
  display:flex; flex-direction:column; animation:annCardIn .34s cubic-bezier(.22,1,.36,1) both; }
/* 品牌头：渐变头图，让「这是一个正式功能说明」而不是系统告警 */
.announce-box .a-head { position:relative; padding:22px 20px 16px;
  background:var(--primary);
  background:linear-gradient(160deg, var(--primary) 0%, #6d5bd0 100%);
  color:var(--on-primary); }
@supports (background: linear-gradient(in srgb, red, blue)) {
  .announce-box .a-head { background:linear-gradient(160deg, var(--primary) 0%, color-mix(in srgb, var(--primary) 72%, #7c3aed) 100%); }
}
.announce-box .a-ico { width:52px; height:52px; border-radius:16px; margin:0 auto 12px;
  background:rgb(255 255 255 / 18%); color:#fff; display:grid; place-items:center;
  font-size:26px; animation:annIconPulse 2.4s ease-in-out infinite; }
.announce-box .a-chip { display:inline-block; padding:3px 10px; border-radius:9999px;
  background:rgb(255 255 255 / 20%); color:#fff; font-size:11px; font-weight:700;
  letter-spacing:.04em; margin-bottom:8px; }
.announce-box h3 { margin:0; font-size:18px; font-weight:800; line-height:1.4; }
.announce-box .a-body { margin:0; padding:16px 20px 18px; font-size:14px;
  color:var(--on-surface-variant); line-height:1.8; text-align:left;
  white-space:pre-wrap; word-break:break-word; overflow-y:auto; flex:1 1 auto;
  -webkit-overflow-scrolling:touch; }
/* 富文本模式（bodyHtml 产出 <p>/<ul>）关掉 pre-wrap，改由块级元素自己管间距；
   纯文本模式（上面那条）保留 pre-wrap，README 式的手动换行才好看。 */
.announce-box .a-body.rich { white-space:normal; }
.announce-box .a-body.rich p { margin:0 0 8px; }
.announce-box .a-body.rich p:last-child { margin-bottom:0; }
.announce-box .a-body.rich ul { margin:4px 0 8px; padding-left:4px; list-style:none; }
.announce-box .a-body.rich ul:last-child { margin-bottom:0; }
.announce-box .a-body.rich li { position:relative; padding-left:14px; margin:3px 0; }
.announce-box .a-body.rich li::before { content:''; position:absolute; left:2px; top:.62em;
  width:4px; height:4px; border-radius:9999px; background:var(--primary); }
.announce-box .a-body.rich b { color:var(--on-surface); font-weight:700; }
/* Pill 步骤条：当前步拉长成胶囊，整条可点（大厂引导的标配进度反馈） */
.announce-box .a-dots { display:flex; justify-content:center; align-items:center;
  gap:6px; padding:0 20px 14px; }
.announce-box .a-dots button { width:6px; height:6px; padding:0; border:none; cursor:pointer;
  border-radius:9999px; background:#D8DEE7; transition:width .25s cubic-bezier(.22,1,.36,1), background .25s; }
.announce-box .a-dots button.on { width:18px; border-radius:3px; background:var(--primary); }
.announce-box .a-dots button.done { background:#BFC9E4; }
@supports (color: color-mix(in srgb, red 50%, blue)) {
  .announce-box .a-dots button.done { background:color-mix(in srgb, var(--primary) 45%, #fff); }
}
.announce-box .a-actions { display:flex; gap:8px; padding:0 20px; }
.announce-box .a-prev, .announce-box .a-ok { flex:1; height:46px; border:none;
  border-radius:var(--r-md); font-size:15px; font-weight:700; cursor:pointer;
  transition:transform .12s ease, opacity .12s ease; }
.announce-box .a-prev { background:#F1F5F9; color:var(--on-surface-variant); flex:0 0 92px; }
.announce-box .a-ok { background:var(--primary); color:var(--on-primary); }
.announce-box .a-prev:active, .announce-box .a-ok:active { transform:scale(.97); }
.announce-box .a-prev:disabled { opacity:.4; cursor:default; }
.announce-box .a-skip { margin:12px 20px 0; background:none; border:none; cursor:pointer;
  color:var(--ink3); font-size:12px; padding:4px 0; }
.announce-box .a-step-in { animation:annStepIn .26s cubic-bezier(.22,1,.36,1) both; }
/* 底部上滑提示（最后一步）：告诉用户可以滑动手势翻页 */
.announce-box .a-swipe-hint { margin:10px 20px 0; font-size:11px; color:var(--ink3); }
@media (prefers-reduced-motion: reduce) {
  #announce.ann-overlay-in, .announce-box, .announce-box .a-step-in,
  .announce-box .a-ico { animation:none; }
}
@media (max-width:360px) {
  .announce-box { max-width:100%; }
  .announce-box .a-prev { flex:0 0 80px; }
}

/* ===== spotlight 引导（2026-10-13）：指向具体元素的挖孔高亮 + 卡片贴位 =====
   原理：目标元素临时挂 .guide-spot —— 巨大 box-shadow（0 0 0 9999px）把全屏
   涂暗，只留元素本身「挖亮」；此时 #announce 遮罩切到 ann-spot 模式
   （去掉自己的半透明底色和毛玻璃，否则会把挖孔重新盖住）。
   卡片 position:fixed 按 getBoundingClientRect 贴在目标下/上/侧方，
   ::before 画 14px 小三角指向目标；哪个方向空间都不够就回落居中卡片。 */
#announce.ann-spot { background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; }
#announce.ann-spot .announce-box { position:fixed; z-index:103; }
/* 贴位时关掉入场动画：annCardIn 的 to{transform:none} 会盖掉 at-top 的
   translateY(-100%) 定位（CSS 动画优先级高于 inline style），卡片会闪回目标下方。 */
.announce-box.at-bottom, .announce-box.at-top,
.announce-box.at-left, .announce-box.at-right { animation:none; }
.guide-spot { position:relative; z-index:102 !important;
  border-radius:12px !important;
  box-shadow:0 0 0 4px #fff, 0 0 0 6px var(--primary), 0 0 0 9999px rgba(11,15,23,.55);
  animation:guideSpotPulse 1.8s ease-in-out infinite; }
@keyframes guideSpotPulse {
  0%,100% { box-shadow:0 0 0 4px #fff, 0 0 0 6px var(--primary), 0 0 0 9999px rgba(11,15,23,.55); }
  50%     { box-shadow:0 0 0 5px #fff, 0 0 0 8px var(--primary), 0 0 0 9999px rgba(11,15,23,.62); }
}
/* 贴位卡片：overflow 放开让小三角露出（a-head 渐变自带圆角自己裁） */
.announce-box .a-head { border-radius:22px 22px 0 0; }
.announce-box.at-bottom, .announce-box.at-top,
.announce-box.at-left, .announce-box.at-right { overflow:visible; }
.announce-box.at-bottom::before, .announce-box.at-top::before,
.announce-box.at-left::before, .announce-box.at-right::before {
  content:''; position:absolute; width:14px; height:14px; background:#fff;
  transform:rotate(45deg); z-index:-1; }
.announce-box.at-bottom::before { top:-7px; left:var(--ax, 50%); margin-left:-7px;
  border-left:1px solid rgba(15,23,42,.06); border-top:1px solid rgba(15,23,42,.06); }
.announce-box.at-top::before { bottom:-7px; left:var(--ax, 50%); margin-left:-7px;
  border-right:1px solid rgba(15,23,42,.06); border-bottom:1px solid rgba(15,23,42,.06); }
.announce-box.at-right::before { left:-7px; top:var(--ay, 50%); margin-top:-7px;
  border-right:1px solid rgba(15,23,42,.06); border-bottom:1px solid rgba(15,23,42,.06); }
.announce-box.at-left::before { right:-7px; top:var(--ay, 50%); margin-top:-7px;
  border-left:1px solid rgba(15,23,42,.06); border-top:1px solid rgba(15,23,42,.06); }
@media (prefers-reduced-motion: reduce) {
  .guide-spot { animation:none; }
}

/* ===== 管理员消息弹窗（docs/23 §6.1，msg- 前缀独立类，不复用引导弹窗类名） =====
   视觉对齐引导弹窗：毛玻璃遮罩 + 居中圆角卡 + 品牌渐变头 + 主按钮「知道了」。
   差异点：多消息列表（卡内滚动）、图片按需加载、无步骤条/手势翻页。
   z-index 95：低于引导(100)，高于普通内容 / toast(40) / 家族水印(70)。 */
#msgModal { position:fixed; inset:0; z-index:95; background:rgba(11,15,23,.55);
  display:flex; align-items:center; justify-content:center; padding:20px;
  -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%); }
#msgModal.hidden { display:none; }
@keyframes msgOverlayIn { from { opacity:0; } to { opacity:1; } }
@keyframes msgCardIn {
  from { opacity:0; transform:translateY(24px) scale(.96); }
  60%  { opacity:1; transform:translateY(0) scale(1.005); }
  to   { opacity:1; transform:none; }
}
#msgModal.msg-overlay-in { animation:msgOverlayIn .22s ease both; }
.msg-box { max-width:352px; width:100%; max-height:calc(100dvh - 40px);
  background:#fff; border-radius:22px; padding:0 0 18px; text-align:center;
  box-shadow:0 24px 70px rgb(0 0 0 / 28%); overflow:hidden;
  display:flex; flex-direction:column; animation:msgCardIn .34s cubic-bezier(.22,1,.36,1) both; }
/* 品牌头（与 .announce-box .a-head 同款渐变，独立类实现） */
.msg-box .msg-head { position:relative; padding:22px 20px 16px; flex:none;
  background:var(--primary);
  background:linear-gradient(160deg, var(--primary) 0%, #6d5bd0 100%);
  color:var(--on-primary); border-radius:22px 22px 0 0; }
@supports (background: linear-gradient(in srgb, red, blue)) {
  .msg-box .msg-head { background:linear-gradient(160deg, var(--primary) 0%, color-mix(in srgb, var(--primary) 72%, #7c3aed) 100%); }
}
.msg-box .msg-ico { width:52px; height:52px; border-radius:16px; margin:0 auto 12px;
  background:rgb(255 255 255 / 18%); color:#fff; display:grid; place-items:center;
  font-size:26px; }
.msg-box .msg-chip { display:inline-block; padding:3px 10px; border-radius:9999px;
  background:rgb(255 255 255 / 20%); color:#fff; font-size:11px; font-weight:700;
  letter-spacing:.04em; margin-bottom:8px; }
.msg-box .msg-head h3 { margin:0; font-size:18px; font-weight:800; line-height:1.4; }
/* 列表区：多条未读卡内滚动，按钮永不被顶出屏幕（与引导 .a-body 同口径） */
.msg-box .msg-list { margin:0; padding:14px 14px 4px; overflow-y:auto; flex:1 1 auto;
  -webkit-overflow-scrolling:touch; text-align:left; }
.msg-box .msg-item { border:1px solid #E8ECF2; border-radius:14px;
  padding:12px 14px 10px; margin-bottom:10px; }
.msg-box .msg-item:last-child { margin-bottom:4px; }
.msg-box .msg-item-top { display:flex; align-items:flex-start; gap:8px; }
.msg-box .msg-item-title { flex:1 1 auto; min-width:0; font-size:14px; font-weight:700;
  color:var(--on-surface); line-height:1.5; word-break:break-word; }
/* 单条「已读」小按钮：完成态换文案变灰，不再响应 */
.msg-box .msg-read-btn { flex:none; border:none; cursor:pointer; border-radius:9999px;
  padding:3px 10px; font-size:11px; font-weight:700; background:#F1F5F9;
  color:var(--on-surface-variant); transition:opacity .12s ease; white-space:nowrap; }
.msg-box .msg-read-btn:active { transform:scale(.97); }
.msg-box .msg-read-btn.msg-read-done { opacity:.5; cursor:default; }
.msg-box .msg-item-date { margin-top:4px; font-size:11px; color:var(--ink3); }
.msg-box .msg-item-body { margin-top:6px; font-size:13px;
  color:var(--on-surface-variant); line-height:1.8; white-space:pre-wrap;
  word-break:break-word; }
/* 图片占位/容器：按需加载，加载失败文案不挡正文 */
.msg-box .msg-img-wrap { margin-top:10px; border-radius:12px; overflow:hidden;
  background:#F6F8FB; min-height:28px; display:flex; align-items:center;
  justify-content:center; }
.msg-box .msg-img-wrap img { display:block; max-width:100%; height:auto; }
.msg-box .msg-img-note { padding:8px 10px; font-size:11px; color:var(--ink3); }
.msg-box .msg-actions { display:flex; gap:8px; padding:10px 20px 0; flex:none; }
.msg-box .msg-ok { flex:1; height:46px; border:none; border-radius:var(--r-md);
  font-size:15px; font-weight:700; cursor:pointer; background:var(--primary);
  color:var(--on-primary); transition:transform .12s ease, opacity .12s ease; }
.msg-box .msg-ok:active { transform:scale(.97); }
.msg-box .msg-ok:disabled { opacity:.4; cursor:default; }
.msg-box .msg-swipe-hint { margin:10px 20px 0; font-size:11px; color:var(--ink3); flex:none; }
@media (prefers-reduced-motion: reduce) {
  #msgModal.msg-overlay-in, .msg-box { animation:none; }
}
@media (max-width:360px) {
  .msg-box { max-width:100%; }
}

/* ===== 微信扫码绑定（2026-10-12）：二维码卡 + 状态行 + 倒计时 + 刷新动画 =====
   对齐微信「添加朋友 → 扫码」的做法：
   · 二维码固定 208px 白底卡（SVG 原始尺寸不固定，不定尺寸在窄屏必溢出）
   · 四角取景框装饰：明确「扫这里」，比裸图更像扫码页
   · 状态行带彩色圆点 + 文案，三态（等待 / 已扫 / 失败）一眼分清
   · 二维码有效期倒计时（官方约 5 分钟）：剩 30 秒变红，到期自动失效并给「刷新」
   · 刷新时二维码淡出再淡入，不是硬替换 */
.qrcode { display:block; width:208px; height:208px; margin:0 auto;
  background:#fff; border-radius:12px; padding:8px;
  border:1px solid var(--hairline); image-rendering:pixelated; }
.qr-wrap { position:relative; width:208px; margin:0 auto; }
/* 四角取景框 */
.qr-wrap::before, .qr-wrap::after,
.qr-frame > i:first-child, .qr-frame > i:last-child { content:''; position:absolute;
  width:22px; height:22px; border:2.5px solid var(--primary); border-radius:4px; }
.qr-wrap::before { top:-3px; left:-3px; border-right:none; border-bottom:none; }
.qr-wrap::after { top:-3px; right:-3px; border-left:none; border-bottom:none; }
.qr-frame > i:first-child { bottom:-3px; left:-3px; border-right:none; border-top:none; }
.qr-frame > i:last-child { bottom:-3px; right:-3px; border-left:none; border-top:none; }
.qr-frame { position:relative; width:208px; height:208px; margin:0 auto; }
.qr-wrap.qr-refresh .qrcode { animation:annOverlayIn .3s ease both; }
@keyframes qrPulse { 0%,100% { box-shadow:0 0 0 0 rgb(var(--primary-rgb, 37 99 235) / 22%); }
  50% { box-shadow:0 0 0 8px rgb(var(--primary-rgb, 37 99 235) / 0%); } }
.qr-wrap.qr-live { animation:qrPulse 2.2s ease-out infinite; border-radius:12px; }
/* 扫码状态行：圆点 + 文案，等待=琥珀呼吸 / 已扫=绿 / 失败=红 */
.qr-status { display:flex; align-items:center; justify-content:center; gap:7px;
  margin:12px 0 2px; font-size:13px; color:var(--on-surface-variant); }
.qr-status .dot { width:7px; height:7px; border-radius:9999px; background:#b45309; flex:none; }
.qr-status.wait .dot { animation:stPulse 1.4s ease-in-out infinite; }
.qr-status.ok { color:#067647; }
.qr-status.ok .dot { background:#067647; }
.qr-status.bad { color:#b42318; }
.qr-status.bad .dot { background:#b42318; }
.qr-status.scaned { color:#067647; }
.qr-status.scaned .dot { background:#067647; }
.qr-expire { text-align:center; font-size:11px; color:var(--ink3); margin-top:6px; }
.qr-expire.soon { color:#b42318; font-weight:600; }
.qr-steps { display:flex; flex-direction:column; gap:0; margin:12px 0 4px; text-align:left; }
.qr-steps .qr-step { display:flex; gap:10px; align-items:flex-start; padding:5px 0; }
.qr-steps .qr-n { width:18px; height:18px; border-radius:9999px; flex:none;
  background:#EEF2FF; color:var(--primary);
  font-size:11px; font-weight:700; display:grid; place-items:center; margin-top:1px; }
.qr-steps .qr-txt { font-size:12.5px; color:var(--on-surface-variant); line-height:1.6; }
.wx-code-card { max-width:260px; margin:12px auto 0; padding:12px 14px;
  background:var(--surface-container-low); border:1px solid var(--hairline); border-radius:14px; }
.wx-code-main { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px; }
.wx-code-main b { min-width:88px; font-size:26px; letter-spacing:6px; color:var(--on-surface); }
.wx-code-main button { height:32px; padding:0 12px; border-radius:9999px; font-size:12px; }
@media (prefers-reduced-motion: reduce) {
  .qr-wrap.qr-live, .qr-status.wait .dot { animation:none; }
}

/* 2026-10-14 注册功能已下线：原注册段 CSS 整段删除；登录门仍在用的 .gate-tabs、
   .gate-forgot 由上面的 stitch iOS 段（842 行起）统一定义 —— 与上面 1027 行
   「旧样式整块删除、以 stitch 段为准」的口径一致。 */
/* 我的页 · 绑定主播卡片 */
.my-bind { padding:16px 16px 14px; text-align:left; }
.my-bind .sub { font-size:12px; color:var(--ink3); line-height:1.7; }
.my-bind .warn { font-size:12px; color:#B54708; background:#FFF7E6; border-radius:8px;
  padding:8px 10px; margin-top:10px; line-height:1.6; }

  padding:0 12px; font-size:14px; margin-top:10px; background:#fff; color:var(--on-surface); }

/* ===== 公告条 + 庆祝横幅（2026-10-13）：运营触达位，颜色对齐 :root 变量 ===== */
/* .ann-bar：圆角浅蓝渐变横条，图标 + 文案（white-space:pre-line 支持多行公告）。
