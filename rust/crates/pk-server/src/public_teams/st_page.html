  --r-lg:16px; --r-md:12px; --r-sm:8px; --r-full:9999px;
  --glass:rgba(252,248,251,.80);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* 页面背景（2026-10-18 Stitch「主播数据榜-真实凸透镜折射玻璃导航栏」1:1）：
   浅色多重微光弥散网格（Light Mesh Gradients）—— 底色 #f6f8fc + 四团径向柔光 +
   24px 极淡网格线（设计稿 main.bg-light-apple 原值照搬）。
   原 --canvas-bg 变量保留在 :root 里给别处引用，body 不再用它。 */
/* 2026-10-18 看板 1:1 对齐 Stitch 设计稿（glass_nav）：
   body = 设备外框（bg-[#edf1f7] 居中），main.wrap = 手机屏本体（bg-light-apple 渐变 + 430 上限
   + 左右边线 + 0 12px 45px 投影）。原先渐变挂在 body 上、wrap 透明 —— 设计稿正好相反。 */
body { margin:0; background-color:#edf1f7;
  /* 2026-10-18 第二轮 1:1：body 文字色对齐设计稿 slate-800（30,41,59） */
  color:#1E293B;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
button { font:inherit; cursor:pointer; }
/* hidden 属性必须赢过任何 display 规则（新版 UI 大量 flex/grid 布局会覆盖它） */
[hidden] { display:none !important; }
.hidden { display:none !important; }

/* ===== Masthead（Cupertino 毛玻璃浅色头部） ===== */
.masthead { background:none; color:var(--on-surface);
  -webkit-backdrop-filter:none; backdrop-filter:none;
  /* 2026-10-18 第二轮 1:1：masthead 移入 main.wrap —— 水平 padding 17→16（px-4）
     + margin:0 -17px 抵消 wrap 的 17px padding（全宽 388、内容起点 x=17，
     与设计稿 1px 边线 + px-4 一致） */
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;
  margin:0 -17px;
  position:static; overflow:visible;
  border-bottom:0px solid #E5E7EB; box-shadow:none; z-index:10; }
.masthead::before { display:none; }
/* 头部（2026-10-16 用户口径）：标题整块居中 —— 三栏网格（左 1fr / 中 auto / 右 1fr），
   中栏宽度 = 标题本身，所以标题天然落在**整行正中**；换团胶囊固定右栏、右对齐。
   副标题从 .mh-title 里拆出来单占一行（.mh-sub）整行居中 —— 若跟着标题挤在中栏，
   长副标题（DATA 2026.10.12 · 2/101 有数据）会被右侧胶囊压成省略号。 */
.mh-top { display:flex; align-items:center; justify-content:space-between; gap:10px;
  position:relative; }
/* 左栏：呼吸圆点 + 主标题（设计稿 w-2 h-2 amber-500 ping + text-xl font-extrabold） */
.mh-left { display:flex; align-items:center; gap:8px; min-width:0; }
.mh-dot { flex:none; width:8px; height:8px; border-radius:9999px; background:#F59E0B;
  box-shadow:0 0 8px rgba(245,158,11,.6); animation:mhPing 1.2s cubic-bezier(0,0,.2,1) infinite; }
@keyframes mhPing { 75%,100% { transform:scale(2); opacity:0; } }
.mh-badge { width:36px; height:36px; border-radius:11px; background:var(--masthead-surface);
  border:1px solid var(--hairline-dark); display:grid; place-items:center; font-weight:800;
  font-size:15px; color:var(--primary); flex:none; }
/* 徽标兼「换团」按钮：点一下回团别选择卡 */
.mh-badge.mh-switch { cursor:pointer; font-size:13px; }
.mh-badge.mh-switch:active { transform:scale(.94); }
.mh-title { min-width:0; text-align:left; }
.mh-title .t { font-weight:800; font-size:20px; line-height:28px; letter-spacing:-.5px;
  color:#0F172A; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* 副标题行（设计稿 text-[11px] font-medium text-slate-500 mt-1.5 tracking-wide）：
    左对齐跟主标题同栏（设计稿数据行就在标题下方左侧） */
.mh-sub { margin-top:6px; font-size:11px; line-height:16.5px; font-weight:500; color:#64748B;
  font-family:inherit; letter-spacing:.025em; text-align:start;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mh-sub .mono { font-family:Menlo,monospace; font-weight:700; color:#0284C7; }
.mh-sub .sep { color:#CBD5E1; margin:0 4px; }
/* 📣 头部公告行（2026-10-18 Stitch 1:1 精确结构）：设计稿是**双层 DOM** ——
    外层 1px 渐变描边胶囊（p-[1px] + from-purple-300/60 via-amber-300/80 to-blue-300/60
    + shadow 0 2px 12px purple-500/12），内层白玻胆（bg-white/80 + blur(12px) +
    border white/80 + py-1.5 px-3 + rounded-full）：
      · 左：图标 + 金色渐变标题（bg-clip-text，amber-700→amber-600→yellow-600）
      · 右：琥珀色「1/3」等宽角标（amber-50 底 + amber-300/40 描边）
    2026-10-18 第二轮：从「单元素双背景」改为真实双层（.mha-in 内胆），
    computed style 与设计稿逐字段一致（padding 1px / background-image 单渐变）。 */
.mh-ann { border-radius:9999px; padding:1px; margin:10px 0 0; height:38px;
  box-sizing:border-box; overflow:hidden;
  background:linear-gradient(to right, rgba(216,180,254,.6), rgba(252,211,77,.8), rgba(147,197,253,.6));
  box-shadow:0 2px 12px rgba(168,85,247,.12);
  font-size:12px; color:#1E293B; }
/* 内胆：白玻一行（设计稿 bg-white/80 backdrop-blur-md py-1.5 px-3 border-white/80） */
.mh-ann .mha-in { height:36px; box-sizing:border-box;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:6px 12px; border-radius:9999px;
  background:rgba(255,255,255,.8); border:1px solid rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
/* 左段：图标 + 文案（文案超长走省略号，不撑破胶囊） */
.mh-ann .mha-l { display:flex; align-items:center; gap:6px; flex:1 1 auto; min-width:0; }
.mh-ann .material-symbols-outlined { font-size:14px; line-height:1; flex:none;
  color:#1E293B; opacity:.85; }
/* 金渐变标题（设计稿 from-amber-700 via-amber-600 to-yellow-600 bg-clip-text） */
.mh-ann .mha-tx { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:12px; font-weight:800; letter-spacing:.3px; line-height:16px;
  background:linear-gradient(to right, #B45309, #D97706, #CA8A04);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  transition:opacity .45s ease; }
.mh-ann .mha-tx.mha-fade { opacity:0; }
/* 轮换角标「1/3」（设计稿 amber-50 底 + amber-300/40 描边 + amber-700 等宽字） */
.mh-ann .mha-idx { flex:none; font-size:11px; font-weight:700; font-family:Menlo,monospace;
  letter-spacing:.1em; color:#B45309; background:#FFFBEB; padding:2px 8px;

/* 品牌条（tone=brand）：内胆换紫，外层渐变描边不变（设计稿只有这一种胶囊，
    紫胆是运营配置 tone=brand 的展示变体，保留） */
.mh-ann.ai-brand .mha-in {
  background:rgba(88,28,135,.88); color:#FFFBEB; }
.mh-ann.ai-brand .mha-tx, .mh-ann.ai-brand .material-symbols-outlined {
  background:none; -webkit-text-fill-color:#FFFBEB; color:#FFFBEB; }
.mh-ann.ai-brand .mha-idx { color:#FDE68A; background:rgba(88,28,135,.9);
  border-color:rgba(252,211,77,.45); }
/* 蓝色通知条（renderHomeAnnouncement 并入的 placements.home）：内胆换浅蓝 */
.mh-ann.ai-home .mha-in { background:rgba(224,237,255,.85); }
.mh-ann.ai-home .mha-tx, .mh-ann.ai-home .material-symbols-outlined {
  background:none; -webkit-text-fill-color:var(--on-surface); color:var(--on-surface); }
/* 换团条（2026-10-18 Stitch 1:1）：iOS 分段控制器（Segmented Control）——
    外壳 slate-200/70 + p-0.5 + 全圆角 + 白 .6 描边 + inset 阴影 + blur(12px)；
    选中项 = 白底胶囊（px-3 py-1）+ 白 .9 描边 + 0 2px 8px rgba(0,0,0,.08)。
    实测（390 视口）：外壳 144×32、选中按钮 50×26、字号 12/700。 */
.team-switch { display:inline-flex; align-items:center; flex:none;
  padding:2px; border-radius:9999px;
  background:rgba(226,232,240,.7); border:1px solid rgba(255,255,255,.6);
  /* 2026-10-18 1:1：设计稿外壳带 inset 0 2px 4px rgba(0,0,0,.05)（内陷感） */
  box-shadow:inset 0 2px 4px rgba(0,0,0,.05);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  font-size:12px; font-weight:600; }
.team-switch button { border:none; background:none; cursor:pointer;
  padding:4px 10px; border-radius:9999px; font-size:12px; font-weight:500;
  color:#475569; font-family:inherit; line-height:16px; white-space:nowrap;
  transition:all .15s; }
.team-switch button:active { transform:scale(.94); }
/* 选中项（设计稿 bg-white px-3 py-1 + border border-white/90 + shadow）：
   加边框的同时把左右内边距补到 12 —— 设计稿三颗按钮实测 50/44/44、外壳 144 宽。 */
.team-switch button.on { background:#fff; color:#0F172A; font-weight:700;
  padding:4px 12px; border:1px solid rgba(255,255,255,.9);
  box-shadow:0 2px 8px rgba(0,0,0,.08); }
.team-switch.hidden { display:none; }
/* 极窄屏（≤370px）：胶囊再收一档，别把标题挤成省略号 */
@media (max-width:370px) {
  .team-switch { font-size:11px; }
  .team-switch button { padding:4px 8px; font-size:11px; }
}
/* 分组赛事切换（2026-10-19 用户口径）：只保留这一套，苹果白玻分段控件。
   与底部水滴导航明确区分：这里是等宽分段 + 白色玻璃滑块，支持长按后拖动。 */
.battle-seg { margin-top:10px; }
#subnav { touch-action:pan-y; user-select:none; -webkit-user-select:none; }
#subnav.is-dragging { cursor:grabbing; }
/* 与日/月/年完全同一套 .seg.st-seg / .st-seg-pill；仅因五组中文标签更长收一档字号。 */

#subnav.is-longpress .st-seg-pill { filter:brightness(1.025); }
@media (max-width:370px) { #subnav button { font-size:12px; } }

/* 📣 公告大卡（2026-10-14 → 2026-10-17 停用）：原顶部竖排公告大卡样式整组保留不删
   （弹窗与别的块仍引用其中部分类名），但顶部已不再渲染 —— 公告内容收进头部单行
   胶囊 .mh-ann（见上方 2026-10-17 注释块），#annItems 容器保留、不再写入。 */
#annItems:empty { display:none; }
/* 2026-10-15 task-9②：上下间距收窄（原 margin:10 / padding:10~12 太松），
   行距也跟着压：整卡看起来更紧凑，一屏能装下更多内容。 */
/* 2026-10-16（用户口径）：横幅左右收窄 —— 原 margin:6px 12px 几乎贴着屏幕边，
   改成两侧各 20px、居中；宽屏（iPad）再限宽 520px，与正文 560px 栏对齐。 */
.ann-item { display:flex; align-items:flex-start; gap:9px; margin:6px auto;
  width:calc(100% - 40px); max-width:520px;
  padding:7px 12px; border-radius:11px; }
.ann-item.ai-plain { background:linear-gradient(135deg,#F5F3FF,#EDE9FE); border:1px solid #C4B5FD; }
.ann-item.ai-brand { padding:8px 12px;
  background:linear-gradient(120deg,#4C1D95 0%,#6D28D9 45%,#B45309 100%);
  border:1px solid #F59E0B; color:#FFFBEB; box-shadow:0 4px 18px rgba(109,40,217,.35); }
.ann-item .ai-ico { font-size:21px; line-height:1.2; flex:none; color:#6D28D9; }
.ann-item.ai-brand .ai-ico { font-size:22px; color:#FDE68A; }
.ann-item .ai-body { flex:1; min-width:0; }
.ann-item .ai-head { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
.ann-item .ai-title { font-weight:800; font-size:13.5px; line-height:1.3; color:#6D28D9; }
.ann-item.ai-brand .ai-title { color:#FDE68A; }
.ann-item .ai-name { font-weight:700; font-size:13.5px; line-height:1.3; color:#101828; }
.ann-item.ai-brand .ai-name { color:#FFFBEB; }
.ann-item .ai-text { font-size:12.5px; line-height:1.5; margin-top:1px;
  white-space:pre-line; word-break:break-word; }
/* 前三位姓名（人名一格写多人、按名次换行）：紧凑名次行，空名次不渲染所以不留空行 */
.ann-item .ai-ranks { display:flex; flex-direction:column; gap:1px; margin-top:2px; }
.ann-item .ai-rank { display:flex; align-items:center; gap:6px; line-height:1.35; }
.ann-item .ai-rank-no { flex:none; width:14px; height:14px; border-radius:9999px; font-size:9.5px;
  font-weight:700; display:grid; place-items:center;
  background:rgba(109,40,217,.12); color:#6D28D9; }
.ann-item.ai-brand .ai-rank-no { background:rgba(253,230,138,.24); color:#FDE68A; }
.ann-item .ai-rank-nm { font-weight:700; font-size:13px; color:#101828; }
.ann-item.ai-brand .ai-rank-nm { color:#FFFBEB; }
/* 横幅对齐（2026-10-16 用户口径，管理端用三个对齐图标按条设置）：
   ai-left = 原版式（图标靠左、正文 flex:1 撑满，一字不动）；
   ai-center / ai-right —— 正文不能再撑满（flex:1 会把 justify-content 吃掉），
   改成「图标 + 文案」作为一整组靠中 / 靠右，标题行与名次行同步对齐。 */
.ann-item.ai-center { justify-content:center; }
.ann-item.ai-center .ai-body { flex:0 1 auto; text-align:center; }
.ann-item.ai-center .ai-head,
.ann-item.ai-center .ai-rank { justify-content:center; }
.ann-item.ai-right { justify-content:flex-end; }
.ann-item.ai-right .ai-body { flex:0 1 auto; text-align:right; }
.ann-item.ai-right .ai-head,
.ann-item.ai-right .ai-rank { justify-content:flex-end; }

/* ===== 📣 公告弹窗（2026-10-16 三甲通报 Stitch 1:1 改版） =====
   设计源：.stitch/designs/stitch_announcement_modal_redesign/（stitch_announcement_modal_redesign (1).zip）。
   1:1 口径：尺寸/间距/渐变/阴影直接取设计稿 HTML 在 390px 视口的实测渲染值
   （2026-10-17 以 Stitch 冠军稿 _2 为基准：卡片 ~336×554（稿内 main max-w-[360px]+p-3
   在 390 视口实测）、徽章图 136×136（冠军页 134）、选手卡高 134、主按钮 48、胶囊高 26 等），
   主徽章用设计稿原 Poster 图（assets/badge-{1,2,3}.png 内嵌 data URI）。
   items 里 enabled && popup 条目按配置顺序翻页（1/3 冠军 → 2/3 亚军 → 3/3 季军……），
   每页同一骨架同一尺寸（卡片定高 554、中段超出内部滚动，翻页不跳尺寸）。
   z-index 89：低于登录门 #gate(90)（登录门打开时被盖住，open 前还有 gate 检查兜底）、

#itemPopup { position:fixed; inset:0; z-index:89; background:rgba(6,2,18,.78);
  display:flex; align-items:center; justify-content:center; padding:12px; overflow:auto;
  -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%); }
/* 卡片宽口径 1:1（2026-10-17 实测三稿）：gold 卡 360（_2 max-w-360）、purple 卡 366
   （_3 max-w-382 + p-3=366）、ice 卡 362（_1 max-w-390 实测 362）——按页主题覆盖宽度 */
.ip-box { position:relative; flex:none; width:min(366px, calc(100vw - 24px)); height:min(554px, calc(100dvh - 88px));
  border-radius:28px; padding:2px; overflow:hidden; box-sizing:border-box;
  box-shadow:0 15px 50px rgba(10,3,25,.92), 0 0 40px rgba(245,158,11,.4);
  display:flex; flex-direction:column;
  animation:ipCardIn .4s cubic-bezier(.16,1,.3,1) both; }
.ip-box.ip-theme-gold { width:min(360px, calc(100vw - 24px)); }
.ip-box.ip-theme-ice { width:min(362px, calc(100vw - 24px)); }
#itemPopup.hidden { display:none; }
@keyframes ipOverlayIn { from { opacity:0; } to { opacity:1; } }
@keyframes ipCardIn {
  from { opacity:0; transform:translateY(24px) scale(.96); }
  60%  { opacity:1; transform:translateY(0) scale(1.005); }
  to   { opacity:1; transform:none; } }
@keyframes ipPageIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
@keyframes ipSpinSlow { to { transform:rotate(360deg); } }
@keyframes ipSpinReverse { to { transform:rotate(-360deg); } }
@keyframes ipPulseGlow { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:.95; transform:scale(1.1); } }
@keyframes ipFloatSoft { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-9px) scale(1.02); } }
@keyframes ipTwinkle { 0%,100% { opacity:.3; transform:scale(.8); } 50% { opacity:1; transform:scale(1.3); } }
@keyframes ipPodium { 0%,100% { transform:translateX(-50%) scaleX(1) scaleY(1); opacity:.8; }
  50% { transform:translateX(-50%) scaleX(1.08) scaleY(1.15); opacity:1; } }
@keyframes ipRayBreathe { 0%,100% { opacity:.65; } 50% { opacity:.95; } }
@keyframes ipSweep { 0% { left:-60%; } 60%,100% { left:120%; } }
@keyframes ipDrop {
  0% { transform:translateY(-40px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); opacity:0; }
  15% { opacity:.95; } 80% { opacity:.85; }
  100% { transform:translateY(105vh) rotateX(720deg) rotateY(540deg) rotateZ(360deg); opacity:0; } }
#itemPopup.ip-overlay-in { animation:ipOverlayIn .22s ease both; }
/* 全屏氛围层（设计稿三层）：圣殿天光 + 顶峰紫金聚光源 + 底部玄紫托底 */
.ip-rays { position:absolute; top:-40px; left:50%; width:600px; max-width:100vw; height:780px;
  transform:translateX(-50%); pointer-events:none;
  background:conic-gradient(from 240deg at 50% -10%,
    rgba(192,132,252,0) 0deg, rgba(216,180,254,.18) 25deg, rgba(147,51,234,.03) 40deg,
    rgba(254,240,138,.22) 55deg, rgba(192,132,252,.05) 70deg, rgba(253,224,71,.18) 85deg,
    rgba(147,51,234,.04) 100deg, rgba(216,180,254,.16) 120deg, rgba(192,132,252,0) 140deg);
  -webkit-mask-image:linear-gradient(to bottom,#000 10%,rgba(0,0,0,.4) 65%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 10%,rgba(0,0,0,.4) 65%,transparent 100%);
  animation:ipRayBreathe 4s ease-in-out infinite; }
.ip-glow-top { position:absolute; top:0; left:50%; width:380px; height:300px;
  transform:translateX(-50%); pointer-events:none; filter:blur(40px);
  background:radial-gradient(ellipse at top, rgba(216,180,254,.4) 0%, rgba(168,85,247,.22) 40%, transparent 75%); }
.ip-glow-bottom { position:absolute; bottom:0; left:50%; width:480px; height:340px;
  transform:translateX(-50%); pointer-events:none; filter:blur(64px);
  background:radial-gradient(ellipse at bottom, rgba(107,33,168,.32) 0%, rgba(30,11,61,.5) 50%, transparent 80%); }
/* 金紫飘落粒子层：打开时生成一次，翻页不重建 */
.ip-particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.ip-particles span { position:absolute; top:-24px; display:block; will-change:transform,opacity; }
/* 舞台 = 卡片 + 卡下提示；margin:auto 在内容溢出可滚时也保持居中 */
.ip-stage { margin:auto; position:relative; z-index:1; max-width:100%;
  display:flex; flex-direction:column; align-items:center; }
/* 卡片：外层 2px 流光渐变铸边（::before）+ 内层深紫圣殿；高度锁设计稿 554（同尺寸保证） */
/* 2026-10-17 骨架对齐（Stitch 冠军稿 _2）：卡宽 max-w-[360px]、圆角 28/26、
   外层流光铸边 amber-300/85→amber-500/45→purple-600/40、内层圣殿底 #1c0c3b→#120727→#0a0318、
   描边转 amber-400/30、阴影 0 0 40px 琥珀金；定高 554 体系不动（三页同尺寸）。 */
.ip-box { position:relative; flex:none; width:min(336px, calc(100vw - 24px)); height:min(554px, calc(100dvh - 88px));
  border-radius:28px; padding:2px; overflow:hidden; box-sizing:border-box;
  box-shadow:0 15px 50px rgba(10,3,25,.92), 0 0 40px rgba(245,158,11,.4);
  display:flex; flex-direction:column;
  animation:ipCardIn .4s cubic-bezier(.16,1,.3,1) both; }
.ip-box::before { content:''; position:absolute; inset:0; border-radius:28px; pointer-events:none;
  background:linear-gradient(180deg, rgba(252,211,77,.85) 0%, rgba(245,158,11,.45) 50%, rgba(147,51,234,.4) 100%); }
.ip-inner { position:relative; flex:1 1 auto; min-height:0; width:100%; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center;
  padding:20px 20px 24px; border-radius:26px; border:1px solid rgba(251,191,36,.3);
  background:linear-gradient(180deg,#1c0c3b 0%,#120727 50%,#0a0318 100%);
  color:#fff; text-align:center; }
/* 「✦ 通报 ✦」紫晶流光胶囊（设计稿 px-7 py-1 = 26 高） */
.ip-capsule { flex:none; margin-bottom:4px; display:inline-flex; align-items:center; gap:6px;
  padding:4px 28px; border-radius:9999px;
  background:linear-gradient(90deg, rgba(58,26,120,.9) 0%, rgba(126,34,206,.85) 50%, rgba(58,26,120,.9) 100%);
  border:1px solid rgba(216,180,254,.5);
  box-shadow:0 0 15px rgba(192,132,252,.4), inset 0 1px 2px rgba(255,255,255,.4);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
.ip-capsule b { font-size:12px; font-weight:700; letter-spacing:.25em; color:#F3E8FF; }
.ip-capsule i { font-style:normal; font-size:10px; color:#fcd34d; animation:ipTwinkle 2s ease-in-out infinite; }
/* 冠军页胶囊（Stitch _2 稿）：金紫流光，px-7 py-1 不变；鎏金描边 + 金色内高光 + amber-100 字 */
.ip-theme-gold .ip-capsule {
  padding:4px 28px;
  background:linear-gradient(90deg, rgba(69,26,13,.9) 0%, rgba(88,28,135,.9) 50%, rgba(69,26,13,.9) 100%);
  border-color:rgba(252,211,77,.6);
  box-shadow:0 0 16px rgba(251,191,36,.5), inset 0 1px 2px rgba(255,255,255,.4); }
.ip-theme-gold .ip-capsule b { color:#FEF3C7; }
.ip-theme-gold .ip-capsule i { color:#FDE047; text-shadow:0 0 6px rgba(253,224,71,.8); }
/* 全屏顶部聚光源按页切主题：gold 页鎏金（Stitch _2），purple/ice 页保持紫（_3/_1 稿）
   口径：主题类挂 #itemPopup（box）上，glow-top 是 box 直接子节点，后代选择器直达 */
.ip-live-gold .ip-glow-top {
  background:radial-gradient(ellipse at top, rgba(254,240,138,.5) 0%, rgba(245,158,11,.28) 45%, transparent 75%); }
/* 中段可滚区（内容超出内部滚，卡片尺寸不动；设计稿自上而下排布） */
.ip-main { flex:1 1 auto; min-height:0; width:100%; overflow-x:hidden; overflow-y:auto;
  display:flex; flex-direction:column; align-items:center;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.ip-main::-webkit-scrollbar { display:none; }
.ip-page { width:100%; display:flex; flex-direction:column; align-items:center; animation:ipPageIn .3s ease both; }
/* 徽章排面：聚光地台（-bottom-2 256×96 + bottom-2 192×40 细环）+ 光环 224 + 双星轨 + 徽章 136
   2026-10-16 三甲分化：同一套骨架，三页各自换主题色与星轨形态（Stitch 三稿）——
   · ip-theme-gold   冠军（殿堂至尊光环）：鎏金日冕双环 + 太阳芒羽 + 金色能量核
   · ip-theme-purple 亚军（殿堂排面）：紫晶双星轨（默认原有体系）
   · ip-theme-ice    季军（殿堂透视星轨）：冰蓝倾斜透视椭圆星轨 + 双能量星体 */
.ip-visual { position:relative; flex:none; width:100%; height:184px; margin:-4px 0;
  display:flex; align-items:center; justify-content:center; }
/* 主题化：星辉四芒星默认金色；冰蓝主题换星蓝、紫主题换浅紫 */
.ip-visual.ip-theme-gold .ip-spark { color:#fcd34d; text-shadow:0 0 8px rgba(253,224,71,.9); }
.ip-visual.ip-theme-purple .ip-spark { color:#d8b4fe; text-shadow:0 0 8px rgba(192,132,252,.9); }
.ip-visual.ip-theme-ice .ip-spark { color:#7dd3fc; text-shadow:0 0 8px rgba(125,211,252,.9); }
.ip-podium { position:absolute; bottom:-8px; left:50%; width:256px; height:96px;
  transform:translateX(-50%); border-radius:50%; pointer-events:none;
  background:radial-gradient(ellipse 90% 45% at 50% 50%, rgba(168,85,247,.6) 0%, rgba(126,34,206,.35) 45%, rgba(217,119,6,.15) 70%, transparent 85%);
  animation:ipPodium 3s ease-in-out infinite; }
.ip-podium-ring { position:absolute; bottom:8px; left:50%; width:192px; height:40px;
  transform:translateX(-50%); border:1px solid rgba(192,132,252,.3); border-radius:100%;
  box-shadow:0 0 20px rgba(192,132,252,.4); pointer-events:none; }
.ip-halo { position:absolute; width:224px; height:224px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(168,85,247,.38) 0%, rgba(147,51,234,.18) 45%, transparent 70%);
  animation:ipPulseGlow 2.5s ease-in-out infinite; }
/* 主题色分化（Stitch 三稿）：地台细环 / 光晕 / 徽章投影按席位换色 */
/* gold（_2 稿）：地台金 70% 起步（podium-stage-base 金版），细环 amber-400/40 + 22px 金辉，
   光晕并入能量核体系（halo 藏掉，sunburst+glowcore 上场），徽章 134px 金投影 */
.ip-theme-gold .ip-podium {
  background:radial-gradient(ellipse 90% 45% at 50% 50%, rgba(245,158,11,.7) 0%, rgba(168,85,247,.4) 45%, rgba(217,119,6,.2) 70%, transparent 85%); }
.ip-theme-gold .ip-podium-ring { border-color:rgba(251,191,36,.4);
  box-shadow:0 0 22px rgba(251,191,36,.5); }
.ip-theme-gold .ip-halo { display:none; }   /* _2 稿无 224 光晕：太阳芒羽+能量核接管 */
.ip-theme-gold .ip-badge { filter:drop-shadow(0 12px 28px rgba(245,158,11,.7)); }
.ip-theme-gold .ip-badge img { width:134px; height:134px; }
/* ice（_1 稿）：细环 cyan-400/50 + 24px 冰蓝辉光，暗幕 veil 替代 halo */
.ip-theme-ice .ip-podium {
  background:radial-gradient(ellipse 90% 45% at 50% 50%, rgba(56,189,248,.4) 0%, rgba(59,130,246,.2) 40%, transparent 75%); }
.ip-theme-ice .ip-podium-ring { border-color:rgba(56,189,248,.5);
  box-shadow:0 0 24px rgba(56,189,248,.5); }
.ip-theme-ice .ip-halo { display:none; }
.ip-theme-ice .ip-badge { filter:drop-shadow(0 0 16px rgba(56,189,248,.75)) drop-shadow(0 0 32px rgba(37,99,235,.4)); }
.ip-theme-ice .ip-badge img { width:148px; height:148px; }
/* 星轨一：顺时针 24s（上缘浅紫 / 下缘琥珀，含内发光），星点琥珀 top-1 left-8 */
.ip-orbit { position:absolute; width:176px; height:176px; border-radius:50%; pointer-events:none;
  border:1.5px solid transparent;
  border-top-color:rgba(233,213,255,.7); border-bottom-color:rgba(251,191,36,.55);
  box-shadow:0 0 16px rgba(168,85,247,.5), inset 0 0 16px rgba(251,191,36,.35);
  animation:ipSpinSlow 24s linear infinite; }
.ip-orbit i { position:absolute; top:4px; left:32px; width:10px; height:10px; border-radius:50%;
  background:#fde047; box-shadow:0 0 8px #fde047; }
/* 星轨二：逆时针 18s（左缘紫晶 / 右缘鎏金虚线），星点浅紫 bottom-3 right-8 */
.ip-orbit2 { position:absolute; width:192px; height:192px; border-radius:50%; pointer-events:none;
  border:1.5px dashed transparent;
  border-left-color:rgba(192,132,252,.75); border-right-color:rgba(253,224,71,.6);
  box-shadow:0 0 20px rgba(192,132,252,.45);
  animation:ipSpinReverse 18s linear infinite; }
.ip-orbit2 i { position:absolute; bottom:12px; right:32px; width:8px; height:8px; border-radius:50%;
  background:#E9D5FF; box-shadow:0 0 8px #E9D5FF; }
/* ---- 冠军专属（Stitch _2 冠军稿）：鎏金日冕双环（3D 透视椭圆）+ 太阳芒羽 + 金色能量核 ---- */
/* 日冕外环：w-52 h-52（208px）1.5px 虚线亮金，rotateX(64deg) rotateY(16deg) 透视椭圆，逆时针 16s */
.ip-theme-gold .ip-corona { position:absolute; width:208px; height:208px; border-radius:50%;
  pointer-events:none; border:1.5px dashed rgba(253,224,71,.85);
  box-shadow:0 0 24px rgba(245,158,11,.7), inset 0 0 18px rgba(254,240,138,.4);
  transform:rotateX(64deg) rotateY(16deg);
  animation:ipGoldSpinRev 16s linear infinite; }
@keyframes ipGoldSpinRev {
  from { transform:rotateX(64deg) rotateY(16deg) rotate(0deg); }
  to   { transform:rotateX(64deg) rotateY(16deg) rotate(-360deg); } }
/* 日冕四芒星与能量星珠（随环旋转）：星珠 top-1.5 right-10，✦ bottom-2 left-9 */
.ip-theme-gold .ip-corona i { position:absolute; font-style:normal; color:#fde047;
  text-shadow:0 0 8px #fde047; animation:ipTwinkle 2s ease-in-out infinite; }
.ip-theme-gold .ip-corona .dot { position:absolute; top:6px; right:40px; width:10px; height:10px;
  border-radius:50%; background:#fde047; box-shadow:0 0 10px #fde047; }
/* _2 稿内环（orbit-ring-inner 类名 w-46）在 Tailwind 中不存在，实测渲染 2×2px 不可见
   —— gold 页不渲染内环，DOM 与 CSS 均不再产出（2026-10-17 实测对齐）。 */
/* 太阳芒羽：徽章背后放射状金色佛光（_2 稿 golden-sunburst）。
   两个 transform 动画（自转 36s + 呼吸 3.5s scale .95→1.08）分属两层：
   元素本体只做呼吸，::before 载芒羽 conic 并自转 —— 同元素挂两个 transform 动画会互相覆盖。 */
.ip-sunburst { position:absolute; width:224px; height:224px; border-radius:50%; pointer-events:none;
  opacity:.85; z-index:0;
  animation:ipSunPulse 3.5s ease-in-out infinite; }
.ip-sunburst::before { content:''; position:absolute; inset:0; border-radius:50%;
  background:repeating-conic-gradient(from 0deg at 50% 50%,
    rgba(253,224,71,.35) 0deg 8deg, transparent 8deg 20deg,
    rgba(245,158,11,.3) 20deg 28deg, transparent 28deg 40deg);
  -webkit-mask-image:radial-gradient(circle, #000 20%, rgba(0,0,0,.6) 55%, transparent 72%);
  mask-image:radial-gradient(circle, #000 20%, rgba(0,0,0,.6) 55%, transparent 72%);
  animation:ipSunspin 36s linear infinite; }
/* 第二层芒羽（_2 稿同尺寸双 golden-sunburst）：纯光晕呼吸，不载芒羽纹理，
   opacity .8（与稿 opacity-80 一致），位移错峰形成景深 */
.ip-sunburst-pulse { animation:ipSunPulse 3.5s ease-in-out infinite .35s; opacity:.8; }
.ip-sunburst-pulse::before { animation:none; background:none; }
@keyframes ipSunspin { to { transform:rotate(360deg); } }
@keyframes ipSunPulse {
  0%,100% { transform:scale(.95); opacity:.75; }
  50%     { transform:scale(1.08); opacity:1; } }
/* 金色能量核：徽章正后方耀斑光团（_2 稿 w-44 h-44 四段金→紫渐变，呼吸 3.5s） */
.ip-glowcore { position:absolute; width:176px; height:176px; border-radius:50%; pointer-events:none;
  z-index:1;
  background:radial-gradient(circle, rgba(253,224,71,.7) 0%, rgba(245,158,11,.45) 35%, rgba(147,51,234,.2) 60%, transparent 75%);
  animation:ipPulseGlow 3.5s ease-in-out infinite; }
/* ---- 亚军专属（Stitch _3 亚军稿）：紫晶 3D 透视椭圆双星轨（覆盖通用正圆环） ----
   orbit-ring-1 w-44（176px）border-top 浅紫/bottom 琥珀，rotateX(68) rotateY(18)，
   顺时针 24s，星珠 top-1 left-8 琥珀；orbit-ring-2 w-48（192px）虚线左紫晶/右鎏金，
   rotateX(62) rotateY(-22)，逆时针 18s，星珠 bottom-3 right-8 浅紫。 */
.ip-theme-purple .ip-orbit {
  border-top-color:rgba(233,213,255,.7); border-bottom-color:rgba(251,191,36,.55);
  box-shadow:0 0 16px rgba(168,85,247,.5), inset 0 0 16px rgba(251,191,36,.35);
  transform:rotateX(68deg) rotateY(18deg);
  animation:ipPurpleSpin 24s linear infinite; }
@keyframes ipPurpleSpin {
  from { transform:rotateX(68deg) rotateY(18deg) rotate(0deg); }
  to   { transform:rotateX(68deg) rotateY(18deg) rotate(360deg); } }
.ip-theme-purple .ip-orbit i { top:4px; left:32px; width:10px; height:10px;
  background:#fde047; box-shadow:0 0 8px #fde047; }
.ip-theme-purple .ip-orbit2 {
  border-left-color:rgba(192,132,252,.75); border-right-color:rgba(253,224,71,.6);
  box-shadow:0 0 20px rgba(192,132,252,.45);
  transform:rotateX(62deg) rotateY(-22deg);
  animation:ipPurpleSpinRev 18s linear infinite; }
@keyframes ipPurpleSpinRev {
  from { transform:rotateX(62deg) rotateY(-22deg) rotate(0deg); }
  to   { transform:rotateX(62deg) rotateY(-22deg) rotate(-360deg); } }
.ip-theme-purple .ip-orbit2 i { bottom:12px; right:32px; width:8px; height:8px;
  background:#E9D5FF; box-shadow:0 0 8px #E9D5FF; }
/* 亚军页光晕（_3 稿 w-56 h-56 = 224px 同通用），地台按 _3 稿 podium-stage-base 微调 */
.ip-theme-purple .ip-podium {
  background:radial-gradient(ellipse 90% 45% at 50% 50%, rgba(168,85,247,.6) 0%, rgba(126,34,206,.35) 45%, rgba(217,119,6,.15) 70%, transparent 85%); }
/* ---- 季军专属（Stitch _1 季军稿）：冰蓝倾斜透视椭圆星轨 + 双能量星体 ----
   主椭圆环 236×130（rounded-[50%] border-2 cyan-400/50，整组 rotate(-15deg)），
   顺时针 14s；内虚线环 208×112（sky-300/35），反向 18s；徽章 148px。 */
.ip-ice-orbit { position:absolute; width:236px; height:130px; border-radius:50%; pointer-events:none;
  z-index:0; border:2px solid rgba(56,189,248,.5);
  box-shadow:0 0 24px rgba(56,189,248,.5), inset 0 0 16px rgba(56,189,248,.3);
  transform:rotate(-15deg);
  animation:ipIceSpin 14s linear infinite; }
@keyframes ipIceSpin {
  from { transform:rotate(-15deg) rotate(0deg); }
  to   { transform:rotate(-15deg) rotate(360deg); } }
/* 椭圆上的流光渐变线（inset-0 rounded-[50%] via cyan-300/40） */
.ip-ice-orbit::before { content:''; position:absolute; inset:0; border-radius:50%;
  background:linear-gradient(90deg, transparent, rgba(103,232,249,.4), transparent); }
/* 沿轨双能量星体（前白冰蓝 / 后金核），内芯白点由 ::after 实现 */
.ip-ice-orbit i { position:absolute; top:-7px; left:25%; width:14px; height:14px;
  border-radius:50%; background:linear-gradient(45deg, #fff, #67e8f9);
  box-shadow:0 0 14px #38bdf8, 0 0 24px #67e8f9;
  display:flex; align-items:center; justify-content:center; }
.ip-ice-orbit i::after { content:''; width:6px; height:6px; border-radius:50%; background:#fff; }
.ip-ice-orbit i:nth-child(2) { top:auto; bottom:-7px; left:auto; right:25%;
  background:linear-gradient(45deg, #fef9c3, #fcd34d);
  box-shadow:0 0 14px #facc15, 0 0 20px #fde047; }
/* 内层虚线环：208×112，反向 18s，右/左缘微光点 */
.ip-ice-orbit2 { position:absolute; width:208px; height:112px; border-radius:50%; pointer-events:none;
  z-index:0; border:1px dashed rgba(125,211,252,.35);
  box-shadow:0 0 12px rgba(56,189,248,.25);
  transform:rotate(-15deg);
  animation:ipIceSpin2 18s linear infinite reverse; }
@keyframes ipIceSpin2 {
  from { transform:rotate(-15deg) rotate(0deg); }
  to   { transform:rotate(-15deg) rotate(-360deg); } }
.ip-ice-orbit2 i { position:absolute; top:50%; right:-4px; width:8px; height:8px; margin-top:-4px;
  border-radius:50%; background:#a5f3fc; box-shadow:0 0 8px #38bdf8; }
.ip-ice-orbit2 i + i { right:auto; left:-4px; width:6px; height:6px;
  background:#bae6fd; box-shadow:0 0 6px #38bdf8; }
/* 冰蓝暗幕光晕（_1 稿 aura 极光 192px，blur-2xl 呼吸） */
.ip-ice-veil { position:absolute; width:192px; height:192px; border-radius:50%; pointer-events:none;
  z-index:0; filter:blur(16px);
  background:linear-gradient(45deg, rgba(2,132,199,.3) 0%, rgba(56,189,248,.35) 50%, rgba(29,78,216,.25) 100%);
  animation:ipAuraPulse 4.5s ease-in-out infinite; }
@keyframes ipAuraPulse {
  0%,100% { transform:scale(.95); opacity:.65; }
  50%     { transform:scale(1.08); opacity:.95; } }
/* _1 稿暗部层（w-36 h-36 = 144px）：深蓝紫内暗 + 冰蓝内发光 */
.ip-ice-dark { position:absolute; width:144px; height:144px; border-radius:50%; pointer-events:none;
  z-index:0;
  background:linear-gradient(180deg, rgba(12,22,64,.7) 0%, rgba(26,16,71,.8) 100%);
  box-shadow:inset 0 0 25px rgba(56,189,248,.3); }
/* _1 稿金雾层（w-28 h-28 = 112px）：琥珀微光衬徽章 */
.ip-ice-mist { position:absolute; width:112px; height:112px; border-radius:50%; pointer-events:none;
  z-index:1; filter:blur(24px);
  background:rgba(251,191,36,.15); }
/* 主徽章：设计稿原 Poster 图 136×136 + 呼吸浮动 + 紫晶投影 */
.ip-badge { position:relative; z-index:2; width:136px; height:136px;
  animation:ipFloatSoft 3.5s ease-in-out infinite;
  filter:drop-shadow(0 12px 24px rgba(147,51,234,.55)); }
.ip-badge img { width:136px; height:136px; object-fit:contain; display:block;
  user-select:none; -webkit-user-drag:none; }
.ip-spark { position:absolute; pointer-events:none; animation:ipTwinkle 2s ease-in-out infinite; }
/* 标题（25px/900 烫金银渐变，行高 38 = 实测）+ 荣耀副行（12px/600 .1em 紫） */
.ip-titles { flex:none; width:100%; margin:0 0 16px; }
.ip-titles h1 { margin:0 0 4px; font-size:25px; line-height:38px; font-weight:900; letter-spacing:.05em;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8FAFC 30%,#E2E8F0 60%,#F59E0B 95%,#B45309 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 2px 10px rgba(168,85,247,.65)) drop-shadow(0 4px 20px rgba(0,0,0,.9)); }
.ip-sub { margin:0; display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:12px; line-height:16px; font-weight:600; letter-spacing:.1em; color:rgba(233,213,255,.9); }
.ip-sub i { font-style:normal; color:#fbbf24; animation:ipPulseGlow 2.5s ease-in-out infinite; }
/* 冠军页标题渐变（Stitch _2 稿 title-supreme-gold）：全金阶 + 金色投影 */
.ip-theme-gold .ip-titles h1 {
  background:linear-gradient(180deg,#FFFFFF 0%,#FEF08A 25%,#FDE047 50%,#F59E0B 80%,#B45309 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 2px 10px rgba(245,158,11,.75)) drop-shadow(0 4px 22px rgba(0,0,0,.95)); }
/* 冠军页副行（_2 稿）：amber-200/95 */
.ip-theme-gold .ip-sub { color:rgba(253,230,138,.95); }
/* 季军页标题渐变（Stitch _1 稿 text-title-3d）：白→冰蓝→金，冰蓝+金双色投影 */
.ip-theme-ice .ip-titles h1 {
  background:linear-gradient(180deg,#FFFFFF 0%,#BAE6FD 35%,#FDE047 75%,#D97706 100%);

/* ===== 底部导航（2026-10-19 最新设计稿）：悬浮白色胶囊 Dock + 液态水滴 =====
    设计源：Stitch 9879920671738170074 / 2f32c73c9eb745c99ad617e812c6189f
    「主播数据榜-水滴仅边缘色散质感导航栏」（本地落盘
    .stitch/designs/stitch_droplet_nav/code.html）。
    实测（390 视口）：外层 fixed bottom-4 居中、宽 calc(100% - 32px)（上限 398px）、z-40；
    nav 本体全圆角、p-1.5（6px）、高 68.5、白 .88 底 + 白 .95 描边 +
    blur(28px) saturate(180%) + shadow-lg 两段投影。
    选中态：一格宽「液态水滴」#navDrop 停在选中格（纯透明白玻璃 + 最外沿 1.5px
    conic 色散环），选中图标/文字琥珀 #B45309；未选中 slate-600。 */
/* 2026-10-18 第二轮 1:1：定位层上提（设计稿 fixed 外层 + relative nav 双层） */
.tabbar-dock { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  width:calc(100% - 32px); max-width:398px; z-index:40; }
.tabbar { position:relative;
  display:flex; align-items:center; justify-content:space-between;
  padding:6px; border-radius:9999px;
  /* 2026-10-18 第三轮：dock 按新设计稿 .dock-capsule-container 给值 ——
     更白的胶囊（.88）+ .95 白描边 + blur(28px) saturate(180%) + 四段投影（含内嵌高光）
     + **全圆角**（rounded-full）。只有这一层 backdrop（旧的 4 层叠 backdrop 是卡顿源）。 */
  background:rgba(255,255,255,.88); border:1px solid rgba(255,255,255,.95);
  /* 设计稿 markup 在 .dock-capsule-container 上还挂了 Tailwind shadow-lg，
     utilities 层后注入把自定义四段阴影盖掉了 —— 实际渲染的是 shadow-lg 这两段，
     这里按「实际渲染值」对齐（否则与设计稿截图的投影观感不一致）。 */
  box-shadow:0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
  -webkit-backdrop-filter:blur(28px) saturate(180%); backdrop-filter:blur(28px) saturate(180%);
  touch-action:none; user-select:none; -webkit-user-select:none;
  /* 2026-10-19 第四轮：删掉 .tabbar:active 的整条缩放 —— 旧版按下时 dock 会
     scale(.985)，拖拽过程中 getBoundingClientRect 一直变，水滴跟手会漂；最新
    设计稿的按压缩放由水滴自身形变承担，dock 保持不动。 */
  overflow:hidden; }
/* 2026-10-15 task-11：5 项均分不换行（「微信对接」四字 nowrap 保全文案）。
   加 overflow:hidden + border-radius —— tap 小反馈（.tab-tap-feedback）
   必须裁在 Tab 格子内，不能溢出到隔壁格子 / dock 外。 */
.tabbar button { position:relative; z-index:20; flex:1; min-width:0;
  border:none; background:transparent;
  /* 2026-10-18 第三轮：新设计稿 .dock-tab-btn —— 未选中图标/文字都是 slate-600
     （rgb 71,85,105），选中态是琥珀 #B45309（见下方 .on 规则）。 */
  color:rgb(30,41,59);
  font-size:16px; font-weight:500; white-space:nowrap; padding:8px 2px;
  /* 2026-10-18 第三轮：设计稿图标与标签之间只靠标签的 mt-0.5(2px) 拉开，
     不再额外 gap（两个都算会把 dock 撑高到 71，设计稿是 68.5） */
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:color .15s;
  /* 2026-10-19：设计稿 nav 上是 `touch-none`，按钮也要显式 touch-action:none。
     <button> 的 UA 默认是 `touch-action: manipulation`（不继承 dock 的 none），
     浏览器于是把底栏上的横向拖动判成「滚动手势」→ 拖两下就抛 pointercancel，
     长按拖拽被中断、松手永远走不到磁吸/切页。这里补上与设计稿一致的 touch-none。 */
  touch-action:none;
  overflow:hidden; border-radius:18px; }
/* 标签：11px / 500 / slate-600（设计稿 text-[11px] font-medium text-slate-600 mt-0.5） */
.tabbar button .tab-label { font-size:11px; color:#475569; font-weight:500; margin-top:2px;
  touch-action:none; }
.tabbar button .ic { width:20px; height:20px; display:grid; place-items:center;
  touch-action:none;
  color:#475569;
  transition:color .15s, transform .15s, filter .15s, opacity .15s; }
.tabbar button .ic svg { width:20px; height:20px; position:relative; z-index:1; }
/* 选中态 / 水滴 focused·edge 两态的图标文字样式，统一在下方「液态水滴」体系里定义
   （2026-10-19 第四轮：scale 从旧版的 1.12 改回设计稿的 1.08 + translateY(-.5px)）。 */
/* ===== 点击反馈（2026-10-19 第五轮）=====
   用户补充口径：普通 tap 不应出现之前的整格「大红」径向光晕；只需一个克制、
   贴近图标的小反馈，并且不得让 tap 看起来像已经切页。反馈在松手确认是 tap 后才生成，
   所以长按/拖拽不会残留红圈，也不会因合成 click 重复生成。 */
.tab-tap-feedback { position:absolute; left:50%; top:50%; width:30px; height:30px;
  border-radius:50%; pointer-events:none; z-index:0;
  background:radial-gradient(circle, rgba(180,83,9,.16) 0%, rgba(180,83,9,.06) 55%,
    rgba(180,83,9,0) 72%);
  transform:translate(-50%,-50%) scale(.62); opacity:0;
  transition:transform .18s ease-out, opacity .18s ease-out; }
.tab-tap-feedback.on { transform:translate(-50%,-50%) scale(1); opacity:1; }
/* tap 只给水滴一次无色的张力回弹，不改变静态 rim 的色散强度。 */
#navDrop.is-tap-ack .nav-drop-body { animation:navDropTapAck .2s ease-out; }
@keyframes navDropTapAck {
  0%,100% { transform:scale(1,1); }
  45% { transform:scale(.97,1.03); }
}
@media (prefers-reduced-motion: reduce) {
  .tab-tap-feedback { transition:opacity .12s ease-out; transform:translate(-50%,-50%) scale(1); }
  #navDrop.is-tap-ack .nav-drop-body { animation:none; }
}
/* ===== 底部导航「液态水滴 + 边缘色散」体系（2026-10-19 第四轮）=====
   设计源：Stitch 项目 9879920671738170074 / 屏幕 2f32c73c9eb745c99ad617e812c6189f
   （标题「主播数据榜-水滴仅边缘色散质感导航栏」；本地落盘
   .stitch/designs/stitch_droplet_nav/code.html）。

   为什么整体替换上一版「琥珀胶囊 + 拖拽大光晕」体系：
   ① 视觉不对：上一版拖拽时是 1.5 格宽的琥珀大光晕，内部有径向渐变和外发光，还把
      原选中项压到 opacity .35；最新设计稿要求「清澈通透水滴，色散只出现在最外沿
      1.5px 轮廓线上，水滴内部零彩光」——用户反馈「拖动的时候和设计图不一致」。
   ② 结构：设计稿是三层 —— 底层 dock 胶囊（含左右内壁碰撞色散）+ 中层一格宽水滴
      （#navDrop，跟手/磁吸）+ 顶层图标（水滴内的 focused 琥珀、边缘掠过的 edge）。
   性能口径：只有 dock 自身一层 backdrop-filter + 水滴 body 一层小面积 backdrop
   （16px、一格宽），旧体系的 1.5 格大光晕、多层渐变叠加全部移除。 */

/* 内壁碰撞色散霓虹层（设计稿 .dock-wall-dispersion-left/right）：
   只有拖到左右两端 18px 内才淡入，平时 opacity:0 不参与渲染。 */
.nav-wall { position:absolute; top:0; bottom:0; width:48px; pointer-events:none;
  opacity:0; z-index:5;
  transition:opacity .18s ease-out, transform .18s ease-out; }
.nav-wall-l { left:0;
  background:radial-gradient(ellipse at 0% 50%,
    rgba(255,59,48,.55) 0%, rgba(255,149,0,.48) 22%, rgba(52,199,89,.4) 45%,
    rgba(0,199,190,.35) 65%, rgba(88,86,214,.3) 82%, transparent 100%);
  filter:blur(4px); }
.nav-wall-r { right:0;
  background:radial-gradient(ellipse at 100% 50%,
    rgba(255,59,48,.55) 0%, rgba(255,149,0,.48) 22%, rgba(52,199,89,.4) 45%,
    rgba(0,199,190,.35) 65%, rgba(88,86,214,.3) 82%, transparent 100%);
  filter:blur(4px); }

/* 水滴滑动宿主（设计稿 .liquid-water-droplet-core）：
   宽度由 JS 量成一格宽（初始 0，避免首帧在错误位置闪一下）；left:6 / top/bottom:5
   与设计稿一致。拖拽时去掉 transition 跟手；松手 .is-snapping 走果冻弹性吸附；
   静止 .is-idle 时水体做 4.5s 表面张力呼吸形变。 */
#navDrop { position:absolute; top:5px; bottom:5px; left:6px; width:0; z-index:10;
  pointer-events:none; will-change:transform, width, border-radius;
  transform-origin:center center;
  transition:transform .42s cubic-bezier(.19,1,.22,1), border-radius .35s ease-out; }
#navDrop.is-idle .nav-drop-body { animation:navDropletBreathing 4.5s ease-in-out infinite; }
#navDrop.is-dragging { transition:none !important; }
#navDrop.is-snapping {
  transition:transform .48s cubic-bezier(.175,.885,.32,1.28),
    border-radius .4s cubic-bezier(.175,.885,.32,1.25); }
@keyframes navDropletBreathing {
  0%, 100% { border-radius:52% 48% 50% 50% / 48% 52% 48% 52%; transform:scale(1) translateY(0); }
  35% { border-radius:48% 52% 47% 53% / 52% 47% 53% 48%; transform:scale(1.02,.98) translateY(-.5px); }
  70% { border-radius:53% 47% 52% 48% / 49% 53% 47% 51%; transform:scale(.985,1.015) translateY(.5px); }
}
/* 内部光斑折射浮动（设计稿 dropletCausticGlint） */
@keyframes navDropletGlint {
  0%, 100% { opacity:.85; transform:scale(1) translateX(0); }
  50% { opacity:1; transform:scale(1.08) translateX(1px); }
}

/* 水滴主体（设计稿 .droplet-body）：100% 纯粹通透的白色半透水体 + 高透毛玻璃，
   **内部零彩光、零琥珀渐变、零外发光**（上一版视觉不对的核心就是这些内部光效）。 */
.nav-drop-body { position:absolute; inset:0; border-radius:9999px;
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(16px) saturate(140%); backdrop-filter:blur(16px) saturate(140%);
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 4px 16px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04),
    inset 0 1.5px 2px rgba(255,255,255,.95), inset 0 -1.5px 2px rgba(226,232,240,.5);
  overflow:hidden;
  will-change:transform, border-radius, box-shadow;
  transition:box-shadow .15s ease-out; }

/* 最外层边缘轮廓色散环（设计稿 .droplet-chromatic-ring）：
   conic 彩虹只画在 1.5px 边框上 —— mask 把内部挖空（content-box xor），
   保证色散/薄膜干涉只存在于最外沿 rim，绝不向水体内部浸染。 */
.nav-drop-ring { position:absolute; inset:-1.5px; border-radius:9999px;
  pointer-events:none; opacity:.35; padding:1.5px;
  background:conic-gradient(from 180deg at 50% 50%,
    rgba(255,59,48,.85) 0deg, rgba(255,149,0,.8) 55deg, rgba(255,214,10,.8) 110deg,
    rgba(52,199,89,.8) 170deg, rgba(0,199,190,.85) 230deg, rgba(0,122,255,.85) 280deg,
    rgba(175,82,222,.85) 330deg, rgba(255,59,48,.85) 360deg);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite:exclude;
  box-shadow:0 0 6px rgba(0,199,190,.35), 0 0 2px rgba(255,59,48,.4);
  filter:blur(.6px);
  transition:opacity .18s ease-out, box-shadow .18s ease-out;
  will-change:opacity, box-shadow; }

/* 水膜表面张力顶部极细高光切面（设计稿 .droplet-glint-top） */
.nav-drop-glint { position:absolute; top:1.5px; left:14%; right:14%; height:4.5px;
  border-radius:9999px; pointer-events:none; filter:blur(.2px);
  background:linear-gradient(180deg, rgba(255,255,255,.95) 0%,
    rgba(255,255,255,.15) 80%, transparent 100%);
  animation:navDropletGlint 3.6s ease-in-out infinite; }
/* 水底焦散反折射细弧（设计稿 .droplet-caustic-bottom，保持纯净白色） */
.nav-drop-caustic { position:absolute; bottom:1.5px; left:20%; right:20%; height:3px;
  border-radius:9999px; pointer-events:none; filter:blur(.4px);
  background:radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.75) 0%, transparent 80%); }

/* 顶层图标状态（设计稿 .dock-tab-btn 两态）：
   · focused（水滴内部）：琥珀 #B45309 + scale(1.08) translateY(-.5px) + 琥珀投影；
   · edge（水滴边缘掠过）：slate-700 #334155 + scale(1.02)；
   · 其余回默认 slate-600。
   拖拽中 dock 挂 .is-droplet-dragging —— 此时旧的 .on 常亮必须失效，否则被水滴
   甩开的老选中项还是琥珀，和设计稿「焦点跟随水滴」不一致。 */
.tabbar:not(.is-droplet-dragging) button.on .tab-label { color:#B45309; font-weight:700; letter-spacing:.025em; }
.tabbar:not(.is-droplet-dragging) button.on .ic { color:#B45309; transform:scale(1.08) translateY(-.5px);
  filter:drop-shadow(0 1.5px 4px rgba(180,83,9,.2)); }
.tabbar button.is-droplet-focused .tab-label { color:#B45309; font-weight:700; letter-spacing:.025em; }
.tabbar button.is-droplet-focused .ic { color:#B45309; transform:scale(1.08) translateY(-.5px);
  filter:drop-shadow(0 1.5px 4px rgba(180,83,9,.2)); }
.tabbar button.is-droplet-edge .ic { color:#334155; transform:scale(1.02); filter:none; }
.tabbar button.is-droplet-edge .tab-label { color:#475569; font-weight:500; letter-spacing:0; }

/* 微信未读角标（设计稿 #wechat-badge）：rose→red 渐变、15 高、白色 1.5px 描边环 */
.wx-badge { position:absolute; top:-6px; right:-10px; z-index:30;
  min-width:15px; height:15px; padding:0 4px; border-radius:9999px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(to right, #f43f5e, #dc2626);
  color:#fff; font-size:9px; font-weight:700; line-height:1;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;
  box-shadow:0 0 0 1.5px #fff, 0 1px 2px rgba(0,0,0,.12);
  pointer-events:none; }
.wx-badge[hidden] { display:none; }
/* 未读角标微弹（设计稿 badgePop） */
@keyframes wxBadgePop { 0% { transform:scale(1); } 40% { transform:scale(1.35); } 70% { transform:scale(.85); } 100% { transform:scale(1); } }
.wx-badge.wx-badge-pop { animation:wxBadgePop .4s cubic-bezier(.175,.885,.32,1.275); }
/* 图标容器要能定位角标 */
.tabbar button .ic { position:relative; }

@media (prefers-reduced-motion: reduce) {
  #navDrop, #navDrop.is-snapping { transition:none; }
  #navDrop.is-idle .nav-drop-body { animation:none; }
  .nav-drop-glint { animation:none; }
  .wx-badge.wx-badge-pop { animation:none; }
}
/* 工具栏（口径 + 日期 + 搜索）—— 2026-10-18 Stitch 1:1：
    不再是「毛玻璃吸顶通条」，而是普通文档流里的一块（设计稿 toolbar 无背景无边框），
    左右各 16px 内边距、上限 560px 居中。内含两块：
      ① 日/月/年 白玻分段容器（.st-seg，42 高 + 白 .85 描边 + blur(28px) saturate(1.8)）
      ② 日期胶囊条 + 日历/搜索图标钮（30/32 高） */
/* 2026-10-18 第二轮 1:1：toolbar 移入 main.wrap —— padding 17→16 + margin:0 -17px
   （抵消 wrap padding，全宽 388、内容起点 x=17，与设计稿 1px 边线 + px-4 一致） */
.toolbar { position:static; z-index:8; background:none; border-bottom:none;
  -webkit-backdrop-filter:none; backdrop-filter:none; padding:6px 16px 0; margin:0 -17px; }
/* 2026-10-18 第二轮 1:1：tools 容器对齐设计稿 main 内 16px 边距（wrap 17px 减 1px 边线） */
.tools { max-width:430px; margin:0 auto; }
/* 分段容器（设计稿 period-segmented-container）：p-1 + 全圆角 + blur(28px) saturate(180%) */
.seg.st-seg { position:relative; display:flex; align-items:center; justify-content:space-between;
  padding:4px; border-radius:9999px; gap:0;
  background:rgba(255,255,255,.52); border:1px solid rgba(255,255,255,.85);
  box-shadow:0 6px 24px rgba(15,23,42,.05), 0 1px 3px rgba(0,0,0,.02),
    inset 0 1px 2px rgba(255,255,255,.95), inset 0 -1px 2px rgba(148,163,184,.12);
  -webkit-backdrop-filter:blur(28px) saturate(180%); backdrop-filter:blur(28px) saturate(180%); }
.seg.st-seg button { position:relative; z-index:1; flex:1; height:32px; border:none;
  border-radius:9999px; background:transparent; padding:6px 0; box-sizing:border-box;
  color:#64748B; font-size:14px; font-weight:500; font-family:inherit;
  transition:color .2s, font-weight .2s; }
.seg.st-seg button.on { background:transparent; color:#0F172A; font-weight:700; }
.seg.st-seg button:disabled { color:#94A3B8; cursor:not-allowed; }
/* 白玻滑块（JS 定位，宽度/位移由 stSegMove 计算） */
.st-seg-pill { position:absolute; top:4px; bottom:4px; left:4px; border-radius:9999px;
  pointer-events:none; z-index:0;
  background:rgba(255,255,255,.95); border:1px solid rgba(255,255,255,.95);
  box-shadow:0 4px 14px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04),
    inset 0 1px 2px #fff;
  transition:transform .4s cubic-bezier(.175,.885,.32,1.15), width .25s ease; }
.st-seg-pill.is-dragging { transition:none; transform-origin:center; }
/* 滑块内微晶反光弧顶 + 竖向渐变（设计稿两个绝对定位装饰层） */
.st-seg-pill::before { content:''; position:absolute; left:12px; right:12px; top:2px;
  height:1.5px; background:#fff; border-radius:9999px; filter:blur(.2px); }
.st-seg-pill::after { content:''; position:absolute; inset:0; border-radius:9999px;
  background:linear-gradient(180deg, rgba(255,255,255,.40) 0%, transparent 50%, rgba(241,245,249,.30) 100%); }
.line2 { display:flex; align-items:center; gap:8px; margin-top:12px; }
.dates { display:flex; gap:8px; overflow-x:auto; flex:1; padding:2px 0; min-width:0;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  mask-image:linear-gradient(to right,#000 88%,transparent 100%); }
.dates::-webkit-scrollbar { display:none; }
/* 日期胶囊（设计稿：选中=白底 + emerald 字 + emerald-200 描边；其余=白 .6 渐淡） */
.dates button { flex:none; padding:6px 12px; border-radius:9999px;
  background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.8);
  color:#475569; font-size:12px; font-weight:600; font-family:inherit;
  line-height:16px; }
.dates button.on { background:#fff; border-color:rgba(167,243,208,.9); color:#047857;
  font-weight:700; box-shadow:0 2px 10px rgba(5,150,105,.14); }
.dates button.on::before { content:''; display:inline-block; width:6px; height:6px;
  border-radius:9999px; background:#10B981; margin-right:6px; vertical-align:middle;
  animation:stPulse 1.6s ease-in-out infinite; }
/* 更旧的日期再淡一档（设计稿 period-sub-2/3） */
.dates button.sub { background:rgba(255,255,255,.4); border-color:rgba(255,255,255,.6);
  color:#94A3B8; }
.dates button.nodata { color:#CBD5E1; }
.dates .mgap { flex:none; align-self:center; font-size:10px; color:var(--ink3);
  font-weight:700; padding-left:2px; }
.stepper { display:flex; align-items:center; gap:4px; flex:1; min-width:0; }
.stepper button { width:32px; height:30px; border-radius:9999px;
  background:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.9);
  color:#475569; line-height:1; }
.stepper .now { flex:1; text-align:center; font-family:Menlo,monospace; font-size:14px; font-weight:600; }
/* 日历 / 搜索图标钮（设计稿 w-8 h-8 全圆角 + 白 .7 底 + 白 .9 描边） */
.icon-btn { width:32px; height:32px; border-radius:9999px; flex:none;
  background:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.9);
  display:grid; place-items:center; color:#475569;
  box-shadow:0 2px 6px rgba(0,0,0,.04); }
.icon-btn.on { border-color:var(--primary); color:var(--primary); background:#fff; }
.search { display:flex; align-items:center; gap:6px; margin-top:8px;
  background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.85);
  border-radius:12px; padding:0 10px; height:34px; }
.search input { flex:1; border:none; outline:none; font:inherit; background:transparent; color:var(--on-surface); }
.search input::placeholder { color:var(--ink3); }

/* ===== 点击即时反馈（2026-10-10）：RTT≈260ms，点了必须先有反应再等数据 ===== */
/* manipulation：去掉移动端双击缩放判定，点按立刻生效；高亮由下面的 :active 出 */
button { touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.lb-row, .pod, .gx-mem { touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.tabbar button:active, #subnav button:active, .seg button:active { opacity:.55; }
.dates button:active, .stepper button:active, .icon-btn:active,
.ln-ctl button:active { background:#EDF0F5; transform:scale(.93); }
.pod:active, .lb-row:active { opacity:.72; }
.gx-mem:active { background:rgba(255,255,255,.55); }
.my-logout:active, .my-push .go:active,
.gate-box .btn-main:active, .team-pick .pick-btn:active { opacity:.7; }
/* 请求在途：标题旁小菊花 + 内容轻微压暗（不清空已看内容，数据回来直接换） */
#mhSpin { display:none; width:12px; height:12px; flex:none;
  border:2px solid var(--hairline); border-top-color:var(--primary); border-radius:50%;
  animation:spin .7s linear infinite; }
body.busy #mhSpin { display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
/* 页面横向滑动容器（2026-10-18 v6，提示词第 7 条 PageView 思路）：
   #viewSlide 包住 #view，切 Tab 时 JS 按「旧页序号 → 新页序号」的方向给
   #view 一个 translateX 入场动画（向左切 = 新页从右侧滑入，向右切 = 从左侧），
   模拟 APP PageView 翻页。动画只动 transform + opacity（合成层，不重排）。 */
#view { transition:opacity .12s; }
body.busy #view { opacity:.62; }
.view-slide-in { animation:viewSlide .32s cubic-bezier(.25,.8,.35,1); }
@keyframes viewSlide {
  from { opacity:.35; transform:translateX(var(--slide-from, 40px)); }
  to   { opacity:1;   transform:translateX(0); } }
/* reduced-motion：翻页动画位移归零，退化为纯淡入 */
@media (prefers-reduced-motion: reduce) {
  .view-slide-in { --slide-from:0px; animation-duration:.18s; }
}
@media (hover:hover) {
  .tabbar button:hover { color:var(--primary); }
  /* 2026-10-18 玻璃化：subnav 白玻胶囊 hover 改浅玻璃提亮，不再灰底 */
  #subnav button:hover { background:transparent; color:#0F172A; }
  .dates button:hover, .stepper button:hover, .icon-btn:hover { background:#F4F6FA; }
  .lb-row:hover { background:#F8FAFD; }
  .seg button:not(.on):hover { color:var(--on-surface); }
}

/* ===== 日期日历（2026-10-10）：横向日期条太长时点 📅 弹日历挑日期 ===== */
.cal-btn { flex:none; }
.cal-pop { position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end;

@media (min-width:640px) {
  .cal-pop { align-items:center; }
  .cal-card { border-radius:18px; }
}
.cal-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.cal-head .ttl { flex:1; text-align:center; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
.cal-head button { width:34px; height:32px; border-radius:var(--r-sm); background:#fff;

.cal-head .close { border:none; background:none; font-size:17px; color:var(--ink3); width:30px; }

.cal-grid .wd { text-align:center; font-size:10.5px; color:var(--ink3); padding:4px 0 6px; }
.cal-grid .wd.wkend { color:#D92D20; }
.cal-d { height:40px; border:none; background:none; border-radius:10px;

.cal-d:disabled { color:#C9CFDA; }
.cal-d.dim { color:#98A2B3; }           /* 非本月 */
.cal-d.today::after { content:''; position:absolute; bottom:5px; left:50%;

.cal-d:active { background:#EDF0F5; }

/* ===== 内容 ===== */
/* 内容区（2026-10-18）：底栏改成悬浮 dock（离底 16px、高 68.5），底部留白要够；
    左右 16px 与头部/工具栏对齐，上限 560px 居中。 */
/* 左右 17px（不是 16）：设计稿 main 有 border-x 1px，内部区块实测从 x=17 起、宽 356，
    本页没有那层设备边框，用 17px 内边距把这段 1px 补回来 —— 这样在 390 视口下
    头部/工具栏/榜单的左右边界与设计稿像素级一致。 */
/* 2026-10-18 看板 1:1：wrap = 设计稿 main（max-w-[430px] bg-light-apple pb-28
   shadow 0 12px 45px rgba(15,23,42,.08) + border-x slate-200/70）。
   渐变/网格微光从 body 迁来（设计稿 .bg-light-apple 全套值）。 */
.wrap { padding:0 17px calc(env(safe-area-inset-bottom,0px) + 112px); max-width:430px; margin:0 auto;
  /* 2026-10-18 第三轮：设计稿 main 是 min-h-screen（渐变背景铺满视口）。
     内容短的页面（分组暂未公布）不加这条时，卡片下方会露出 body 的平底色，
     出现一道硬边。 */
  min-height:100vh;
  background-color:#f6f8fc;
  background-image:
    radial-gradient(ellipse 90% 45% at 50% -5%, rgba(199,210,254,.45), transparent 70%),
    radial-gradient(circle 320px at 90% 12%, rgba(254,240,138,.35), transparent 70%),
    radial-gradient(circle 280px at 10% 32%, rgba(186,230,253,.35), transparent 65%),
    radial-gradient(circle 350px at 50% 75%, rgba(237,233,254,.40), transparent 70%),
    linear-gradient(rgba(148,163,184,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148,163,184,.03) 1px, transparent 1px);
  background-size:100% 100%,100% 100%,100% 100%,100% 100%,24px 24px,24px 24px;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat;
  box-shadow:0 12px 45px rgba(15,23,42,.08);
  border-left:1px solid rgba(229,231,235,.7); border-right:1px solid rgba(229,231,235,.7); }
.section { animation:fade .18s ease-out; }
@keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.card { background:var(--card-bg); border:1px solid var(--hairline); border-radius:var(--r-lg); }
.card + .card { margin-top:12px; }
.card-pad { padding:14px 16px; }
h2.card-t { font-size:13px; font-weight:700; color:var(--ink3); margin:0 0 4px;

/* ===== 排行榜（2026-10-18 Stitch 玻璃稿 1:1 改版）=====
    设计源：.stitch/designs/stitch_streamer_glass_nav/code.html（390 视口实测值）：
      · 领奖台：grid-cols-3 gap-1.5 items-end、pt-2 pb-3、容器左右 12px；
        第1名头像环 80（p-3 + 白→amber-300→amber-500 渐变 + ring-4 白 .95），
        第2/3名 64（p-2.5 + 冷银 / 琥珀渐变 + ring-2 白 .9）；第1名整组上移 8px。

/* ===== 看板弹幕（2026-10-22：男女团各自的当日最高）=====
    用户口径：弹幕只放前三名分数下面、名次/主播表头上边；男团、女团各自滚自己的
    当日最高主播。全团视角两条一起滚，单团视角只滚本团一条。
    实现：.dm-strip 作为**文档流**元素插在领奖台与榜单之间（高 24px 与胶囊同高，
    overflow:hidden 裁住横飘；pointer-events:none 不挡滑动），胶囊在其中横向流动。
    位置微调：后端 danmaku.top 是**偏移量**（-80..80px，正=下移，默认 0=自然位），

    内容胶囊：男团金牌「男团每日最高」、女团粉牌「女团每日最高」。

.danmaku-slim { display:inline-flex; align-items:center; gap:6px; padding:0 10px;
  height:24px; box-sizing:border-box; vertical-align:top;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:0 4px 12px rgba(15,23,42,.06), 0 1px 2px rgba(0,0,0,.02);
  border-radius:9999px; line-height:1; }

   （条内右段静止 2 秒，用户看到的就是「一打开就固定在那儿」），delay 结束才跳到
   屏幕外开始滚 —— 加 fill-mode 后 delay 期间就落在 0% 关键帧（translateX(108vw)
   = 屏幕右侧外），到期后从右边平稳滚进来，全程看不见「先静止再跳」。 */
.danmaku-slim-gold { background:linear-gradient(90deg, rgba(255,255,255,.88) 0%, rgba(254,243,199,.78) 100%);
  border:.5px solid rgba(245,158,11,.35);
  animation:danmakuRunMedium 10s linear infinite; animation-delay:.15s;
  animation-fill-mode:backwards; }
/* 胶囊内文字：emoji 11 / 名字 10.5 黑体黑 / 中点 9 / 称号 10 粗 / 数字 10.5 黑 mono */
.dm-ic  { font-size:11px; line-height:1; }
.dm-nm  { font-size:10.5px; font-weight:900; letter-spacing:-.01em; }
.dm-dot { font-size:9px; font-weight:700; line-height:1; }
.dm-tt  { font-size:10px; font-weight:700; }
.dm-num { font-size:10.5px; font-weight:900; letter-spacing:-.01em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace; }
/* 金系配色：名字/数字 = 深色（800），称号 = 中色（700），中点 = 亮色（400/500） */
.danmaku-slim-gold .dm-nm, .danmaku-slim-gold .dm-num { color:#92400E; }
.danmaku-slim-gold .dm-tt { color:#B45309; }
.danmaku-slim-gold .dm-dot { color:#F59E0B; }
/* 女团每日最高：与男团金牌区分成玫瑰粉琉璃，全团视角下两条胶囊并排滚动。 */
.danmaku-slim-pink { background:linear-gradient(90deg, rgba(255,255,255,.90) 0%, rgba(252,231,243,.82) 100%);
  border:.5px solid rgba(219,39,119,.24);
  animation:danmakuRunMedium 10s linear infinite; animation-delay:.15s;
  animation-fill-mode:backwards; }
.danmaku-slim-pink .dm-nm, .danmaku-slim-pink .dm-num { color:#9D174D; }
.danmaku-slim-pink .dm-tt { color:#BE185D; }
.danmaku-slim-pink .dm-dot { color:#F472B6; }
/* 无障碍：用户开了「减弱动态」→ 动画全关，胶囊静止停在轨道左侧 */
@media (prefers-reduced-motion: reduce) {
  .danmaku-slim-gold, .danmaku-slim-pink { animation:none; }
}

   .go/.sw/.tgt/.sr/.sr-list/.tk-opt/.tk-sel/.sk/.my-stat/.delta 等原来依赖

   没有该祖先，样式全部丢失。这里补一套独立规则，变量对齐文件头 :root
   （--primary/--hairline/--up/--down 等）。.tabs2 是旧三 tab 添加面板的遗留样式，

  font-size:14px; font-weight:700; cursor:pointer; transition:opacity .15s, transform .1s; }
.go:active { transform:scale(.98); }
.go:disabled { opacity:.45; cursor:default; }
.go.gray { background:var(--surface-container-high); color:var(--on-surface);
  border:1px solid var(--hairline); font-weight:600; }
/* iOS 式开关：36x20 圆角轨道 + 滑块，checked 变主色 */

  color:var(--on-surface); cursor:pointer; -webkit-user-select:none; user-select:none; }

  border-radius:9999px; background:var(--surface-container-highest); position:relative;
  outline:none; cursor:pointer; transition:background .2s; }

  border-radius:9999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform .2s; }
.sw input:checked { background:var(--primary); }

  color:var(--on-surface); border-bottom:1px solid var(--hairline); }

  color:var(--on-surface); }
.sr input:focus { outline:none; border-color:var(--primary); }
/* 2026-10-18 玻璃化：候选下拉白实底 → 白玻卡（白 .85 描边 + blur 20px，投影保留浮层可读性） */
.sr-list { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20;
  background:rgba(255,255,255,.92); border:1px solid rgba(255,255,255,.85); border-radius:var(--r-md);
  box-shadow:0 8px 32px rgba(148,163,184,.12), 0 1px 2px rgba(0,0,0,.03);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  max-height:60vh; overflow:auto; }
.sr-list > div { padding:9px 12px; font-size:13px; color:var(--on-surface);
  border-bottom:1px solid var(--hairline); cursor:pointer; }
.sr-list > div:last-child { border-bottom:none; }
.sr-list > div:active { background:var(--surface-container-low); }
.sr-list .none { color:var(--on-surface-variant); font-size:12px; cursor:default; }
/* 追分设置「目标人」多选候选行（2026-10-15 契约 B）：候选行左侧加原生 checkbox，
   点整行也能勾。选择器带 [type=checkbox] 是为了压过上面 `.sr input` 的输入框皮肤
   （`.sr input` 把任何后代 input 都撑成 100%×40px 的文本框）。 */
.sr-list > div.tk-opt { display:flex; align-items:center; gap:9px; }
.tk-opt input[type="checkbox"] { appearance:auto; -webkit-appearance:checkbox; flex:none;
  width:16px; height:16px; margin:0; padding:0; border:none; border-radius:2px;
  accent-color:var(--primary); cursor:pointer; }
.tk-opt input[type="checkbox"]:disabled { opacity:.45; cursor:default; }
/* tk-opt 行按下反馈：与 .sr-list > div:active 同款背景（2026-10-17），
   名字区 flex:1 吃掉剩余宽度，本月音浪才能贴到行右缘 */
.tk-opt:active { background:var(--surface-container-low); }
.tk-opt .tk-wave { margin-left:auto; flex:none; color:var(--on-surface-variant);
  font-size:12px; text-align:right; }
.tk-opt .tk-wave.off { opacity:.75; }
/* 已选人 chip 行：点 chip = 取消选择 */
.tk-sel { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tk-sel .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 9px;
  border-radius:9999px; background:rgba(0,88,188,.10); color:var(--primary);
  font-size:12px; line-height:1.6; cursor:pointer; }
.tk-sel .chip:active { background:rgba(0,88,188,.2); }
/* 骨架屏：灰底块 + shimmer 扫光动画（shimmerList 用 .sk.sk-row） */
.sk { background:linear-gradient(90deg, var(--surface-container) 25%,
  var(--surface-container-highest) 45%, var(--surface-container) 65%);
  background-size:200% 100%; border-radius:6px;
  animation:skShimmer 1.4s ease-in-out infinite; }
.sk-row { height:14px; margin:12px 0; }
@keyframes skShimmer { from { background-position:120% 0; } to { background-position:-80% 0; } }
/* 统计行：label 左 / 值右（renderMy 里的 stat() 输出） */
.my-stat { display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  padding:8px 2px; font-size:13px; border-bottom:1px solid var(--hairline); }
.my-stat:last-child { border-bottom:none; }
.my-stat .l { color:var(--on-surface-variant); flex:none; }
.my-stat .w { font-weight:600; color:var(--on-surface);
  font-variant-numeric:tabular-nums; text-align:right; }
.my-stat .m { width:100%; font-size:11px; color:var(--outline); }
/* 涨跌小字：红涨绿跌（与 waveDelta 的 d-up/d-down/d-flat 口径一致） */
.delta { display:inline-block; margin-left:4px; font-size:11px; font-weight:600;
  font-variant-numeric:tabular-nums; }
.delta.d-up { color:var(--up); }
.delta.d-down { color:var(--down); }
.delta.d-flat { color:var(--outline); font-weight:400; }

/* 联系运营卡（设计稿：圆形「帅」字头像 + 文案 + 立即私信 pill） */
/* 2026-10-18 玻璃化：实底白卡 → 白 .72 玻璃卡（描边白 .85 换玻璃口径 + blur 20px） */
.st-my-ops { margin-top:.75rem; background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.85); border-radius:16px; padding:1rem;
  box-shadow:0 8px 32px rgba(148,163,184,.12), 0 1px 2px rgba(0,0,0,.03);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  display:flex; align-items:center; gap:1rem; }
.st-my-ops-av { width:2.5rem; height:2.5rem; border-radius:9999px; background:var(--primary-fixed);
  color:var(--primary); display:grid; place-items:center; font-size:18px; font-weight:700; flex:none; }
.st-my-ops .t { font-size:14px; font-weight:600; color:var(--on-surface); }
.st-my-ops .d { font-size:11px; color:var(--outline); margin-top:.125rem; }
.st-my-ops-btn { display:inline-flex; align-items:center; gap:.25rem; padding:.375rem .75rem;
  border:none; border-radius:9999px;
  /* 2026-10-18 玻璃化：surface-container-low 实底 → 白 .52 玻 */
  background:rgba(255,255,255,.52); color:var(--primary);
  font-size:12px; font-weight:500; flex:none; }
.st-my-ops-btn .material-symbols-outlined { font-size:16px; }
.st-my-ops-btn:active { transform:scale(.96); }


/* 分组页（与导出长图同版式：渐变头部卡 + 彩色分组卡 + 成员胶囊，成员单列） */
.gx-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  background:linear-gradient(120deg,#ff9a3d 0%,#ff6a5e 55%,#ff4d94 100%);
  border-radius:18px; padding:16px; color:#fff; margin-bottom:14px; }
.gx-head .l { min-width:0; flex:1 1 100%; }
.gx-head .bl { font-size:10px; letter-spacing:2px; opacity:.85; font-family:Menlo,monospace; }
.gx-head .tt { margin-top:5px; font-size:19px; font-weight:800; letter-spacing:.02em; }
.gx-head .mt { margin-top:6px; font-size:11.5px; opacity:.95; }
.gx-pills { display:flex; gap:8px; flex:none; margin-left:auto; }
.gx-pill { min-width:50px; text-align:center; border-radius:14px; padding:7px 12px; }
.gx-pill.ghost { background:rgba(255,255,255,.28); }
.gx-pill.solid { background:#fff; color:#f4573d; }
.gx-pill .n { font-size:18px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums; }
.gx-pill .l { font-size:9.5px; opacity:.85; margin-top:1px; }
.gx-card { border:2px solid; border-radius:16px; padding:13px 13px 12px; margin-bottom:14px; }
.gx-card .g { font-size:16px; font-weight:800; }
.gx-card .s { margin-top:2px; font-size:11.5px; color:#7b8494; }
.gx-mem { background:rgba(255,255,255,.8); border-radius:10px; padding:8px 10px; margin-top:8px; }
.gx-mem .top { font-size:13.5px; line-height:19px; color:#1f2937; display:flex;
  align-items:center; gap:6px; min-width:0; }
.gx-mem .top .r { font-weight:800; flex:none; font-family:Menlo,monospace; }
.gx-mem .top b { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gx-mem .st { margin-top:2px; font-size:10.5px; line-height:15px; color:#8590a2;
  font-variant-numeric:tabular-nums; }
.gx-foot { text-align:center; color:#98a2b3; font-size:11px; margin-top:4px; }

/* 族谱画布（无底部导航后撑满剩余视口，视觉接近全屏；双击/按钮可进原生全屏） */
.lineage-wrap { position:relative; height:calc(100vh - 122px); min-height:430px;
  background:var(--canvas-bg); border:1px solid var(--hairline); border-radius:var(--r-lg);
  overflow:hidden; touch-action:none; cursor:grab; }
.lineage-wrap:active { cursor:grabbing; }
.lineage-wrap svg { width:100%; height:100%; display:block; }
.ln-hint { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px;
  align-items:center; pointer-events:none; z-index:2; }
.ln-hint .tip { background:rgba(11,15,23,.72); color:#fff; font-size:11px;
  padding:4px 10px; border-radius:var(--r-full); }
.ln-hint input { pointer-events:auto; margin-left:auto; width:132px; height:26px;
  border:1px solid var(--hairline); border-radius:var(--r-full); padding:0 12px;
  font-size:12px; background:#fff; color:var(--on-surface); }
.ln-hint input:focus { outline:none; border-color:var(--primary); }
.ln-hint .qinfo { background:rgba(11,15,23,.72); color:#fff; font-size:11px;
  padding:4px 8px; border-radius:var(--r-full); display:none; white-space:nowrap; }
.ln-ctl { position:absolute; right:10px; bottom:12px; z-index:2; display:flex;
  flex-direction:column; gap:6px; }
.ln-ctl button { width:32px; height:32px; padding:0; border-radius:10px;
  background:#fff; border:1px solid var(--hairline); font-size:16px; line-height:1;
  color:var(--on-surface-variant); box-shadow:0 1px 3px rgb(0 0 0 / 8%);
  display:grid; place-items:center; }
.ln-ctl button:active { background:var(--highlight-bg); }
/* 全屏：原生 Fullscreen API 走 :fullscreen；iPhone 上不支持时退到 .ln-fs 铺满视口 */
.lineage-wrap:fullscreen, .lineage-wrap:-webkit-full-screen {
  height:100vh; border:0; border-radius:0; background:var(--canvas-bg); }
.lineage-wrap.ln-fs { position:fixed; inset:0; z-index:60; height:100vh;
  border:0; border-radius:0; background:var(--canvas-bg); }
.ln-edge { fill:none; stroke:#C3CDDC; stroke-width:1.5; }
.ln-edge.hot { stroke:var(--primary); stroke-width:2.5; }
.ln-edge.dim { opacity:.25; }
.ln-node rect { fill:var(--card-bg); stroke:var(--hairline); stroke-width:1; }
.ln-node text { text-anchor:middle; fill:var(--on-surface); pointer-events:none; }
.ln-node .ln-name { font-size:13px; font-weight:700; }
.ln-node .ln-sub { font-size:10px; fill:var(--ink3); }
.ln-node.off { opacity:.45; }
.ln-node.off .ln-name { font-weight:500; }
.ln-node.sel rect { stroke:var(--primary); fill:var(--highlight-bg); }
.ln-node.anc rect { stroke:var(--primary); stroke-width:1.5; }
.ln-node.dim2 { opacity:.22; }
.ln-node.hit rect { stroke:#f79009; stroke-width:2; }
.ln-node.hit.dim2 { opacity:.6; }
.ln-node .ln-tag { font-size:9px; fill:var(--up); }

.err { background:#ffdad6; color:#93000a; border-radius:var(--r-md); padding:10px 13px; margin:10px 0; font-size:13px; }
.empty { text-align:center; color:var(--ink3); padding:34px 16px; font-size:13px; line-height:1.9; }
.empty .big { font-size:30px; display:block; margin-bottom:6px; }
.note { text-align:center; color:var(--ink3); font-size:11.5px; margin-top:18px; line-height:1.7; }

#toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  transform:translateX(-50%) translateY(16px); background:#0f172a; color:#fff; padding:9px 16px;
  border-radius:var(--r-full); font-size:13px; opacity:0; transition:all .2s; pointer-events:none;
  z-index:40; display:flex; align-items:center; gap:6px; white-space:nowrap; max-width:90vw; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast svg { color:var(--live); flex:none; }
.stale { background:#fff7e6; color:#b45309; border-radius:.5rem; padding:7px 12px;
  font-size:12px; margin-bottom:10px; text-align:center; }

/* ===== 我的页兼容层（Stitch 外壳 + 原表单/弹层） ===== */
/* 2026-10-18 玻璃化：退出按钮白实底 → 白玻输入口径（白 .72 底 + 白 .85 描边） */
.my-logout { margin-top:12px; width:100%; height:44px; border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-md); background:rgba(255,255,255,.72); color:var(--on-surface); font-weight:600; }
/* 2026-10-18 玻璃化：趋势图容器实底白卡 → 白 .72 玻璃卡（白 .85 描边 + 看板同款投影 + blur 20px） */
.my-trend { background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.85);
  border-radius:16px; padding:1rem;
  box-shadow:0 8px 32px rgba(148,163,184,.12), 0 1px 2px rgba(0,0,0,.03);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); margin-top:.75rem; }
.my-trend .bars { display:flex; align-items:flex-end; gap:3px; height:90px; margin-top:8px; }
.my-trend .b { flex:1; background:var(--primary); border-radius:3px; opacity:.9; }
.my-trend .b.off { background:var(--surface-container-highest); }
.my-trend .xs { display:flex; justify-content:space-between; margin-top:6px;
  font-size:11px; color:var(--on-surface-variant); }
.my-push { margin-top:.75rem; }
.my-push .row { font-size:13px; margin-top:8px; display:flex; align-items:center; gap:8px; }
.my-push .sub { font-size:11px; color:var(--on-surface-variant); }
/* 2026-10-18 玻璃化：微信卡输入框白实底 → 白玻输入（白 .72 底 + 白 .85 描边，参照看板 .search） */
.my-push input { width:100%; height:40px; border:1px solid rgba(255,255,255,.85);
  border-radius:12px; padding:0 12px; font-size:14px; margin-top:8px;
  background:rgba(255,255,255,.72); color:var(--on-surface); }
.my-push input:focus { outline:none; border-color:var(--primary); }
  object-fit:cover; background:var(--surface-container-low); flex:none; }
  background:#fff; color:var(--on-surface-variant); font-size:12.5px; }
.my-push .go { margin-top:10px; width:100%; height:40px; border:none;
  border-radius:var(--r-md); background:var(--primary); color:var(--on-primary);
  font-size:14px; font-weight:700; }
.my-push .go:disabled { opacity:.45; }
.my-push .hint { font-size:11.5px; color:#b45309; background:#fff7e6;
  border-radius:8px; padding:7px 10px; margin-top:8px; line-height:1.6; }

/* ===== 登录门（stitch iOS Style · 2026-10-12 重做）
   设计稿：stitch_apple_style_mobile_showcase——iOS 卡片（28px 圆角 + 柔和投影）、
   青绿渐变圆形徽标、蓝 #0066FF 主按钮带投影、50px 输入框、红字错误行。
   2026-10-14 注册功能已下线：登录门只剩「登录」表单 + 「忘记密码」链接。
   2026-10-18：仅剩的那条页签条（琥珀底单页签）删除，登录门不再有 tab 容器。 ===== */
#gate { position:fixed; inset:0; z-index:90; background:#F2F4F7;
  display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; }
#gate.hidden { display:none; }
/* 2026-10-18 玻璃化：登录卡白实底 → 白 .72 玻璃卡（白 .85 描边 + 看板同款投影 + blur 20px，
   28px 圆角保持不变；body 的 .bg-light-apple 渐变能透出来） */
.gate-box { max-width:390px; width:100%; margin:auto; text-align:center;
  background:rgba(255,255,255,.72); border-radius:28px; border:1px solid rgba(255,255,255,.85);
  box-shadow:0 8px 32px rgba(148,163,184,.12), 0 1px 2px rgba(0,0,0,.03);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  padding:28px; padding-top:36px;
  animation:stFadeIn .18s ease-out;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif; }
/* 青绿渐变圆徽标（设计稿 teal #0BB796 系） */
.gate-box .big-av { width:64px; height:64px; border-radius:9999px; display:grid; place-items:center;
  margin:0 auto 14px; color:#fff;
  background:linear-gradient(45deg,#08A484,#12CEAA);
  box-shadow:0 4px 16px rgba(11,183,150,.22); }
.gate-box .big-av .material-symbols-outlined { font-size:30px; }
.gate-box h3 { margin:0 0 18px; font-size:23px; font-weight:700; letter-spacing:-.02em; color:#0B1C30; }
.gate-box .tip { margin:0 0 16px; color:#64748B; font-size:13px; line-height:1.7; }
/* 2026-10-18 玻璃化：登录输入框白实底 + 灰描边 → 白玻输入（白 .72 底 + 白 .85 描边 + 12px 圆角，
   参照看板 .search 口径） */
.gate-box input { width:100%; height:50px; border:1px solid rgba(255,255,255,.85);
  border-radius:12px; padding:0 16px; font-size:15px; margin-bottom:12px;
  background:rgba(255,255,255,.72); color:#0B1C30; transition:border-color .18s ease, box-shadow .18s ease; }
.gate-box input::placeholder { color:#94A3B8; }
/* 2026-10-18 玻璃化：focus 描边/光圈 #0066FF 蓝 → 琥珀 #D97706 系（强调色统一） */
.gate-box input:focus { outline:none; border-color:#D97706;
  box-shadow:0 0 0 4px rgba(217,119,6,.10); background:rgba(255,255,255,.72); }
.gate-box input.gate-err { border-color:#FB7185;
  box-shadow:0 0 0 4px rgba(244,63,94,.15); }
.gate-box .form-err { color:#F43F5E; font-size:13px; margin:-4px 0 10px; text-align:left;
  display:flex; align-items:center; gap:6px; }
.gate-box .form-err::before { content:'!'; flex:none; width:16px; height:16px;
  border-radius:9999px; background:#F43F5E; color:#fff; font-size:11px; font-weight:700;
  display:grid; place-items:center; }
.gate-box .form-err:empty { display:none; }
.gate-box .btn-main { width:100%; height:50px; border:none; border-radius:12px;
  background:#0066FF; color:#fff; font-size:16px; font-weight:600; letter-spacing:.05em;
  box-shadow:0 4px 14px 0 rgba(0,102,255,.28);
  transition:all .15s; cursor:pointer; }
.gate-box .btn-main:active { transform:scale(.985); filter:brightness(.96); }
.gate-box .btn-main:disabled { opacity:.45; box-shadow:none; }
/* 忘记密码：下划线浅灰链接（设计稿 13px slate-400） */
.gate-box .gate-forgot { background:none; border:none; color:#94A3B8; font-size:13px;
  text-decoration:underline; text-underline-offset:4px; text-decoration-color:#CBD5E1;
  cursor:pointer; padding:2px 0 0; margin:2px 0 14px; }
/* 设计稿脚注：遇到问题？请联系管理员帅帅（12px slate-400 居中） */
.gate-box .gate-foot { margin:14px 0 0; font-size:12px; color:#94A3B8;
  letter-spacing:.02em; }

/* ===== 账号绑定 / QQ 邮箱 / 忘记密码 / 强制补全 / 临时密码提示（2026-10-18）
   契约：docs/26-账号绑定QQ邮箱与艺名登录-设计/05-实现契约-v2.md §4。
   全部复用 .gate-box / .form-err / .btn-main / .go / toast 体系，不新增组件库。
   QQ 后缀用绝对定位（不用 flex 挤 input），375px 宽下不产生横向滚动。 ===== */
.dlg-mask { position:fixed; inset:0; z-index:96; background:rgba(11,28,48,.45);
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation:stFadeIn .15s ease-out; }
.gate-box.dlg-box { max-width:360px; max-height:calc(100dvh - 40px);
  overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; }
.gate-box.dlg-box h3 { font-size:19px; margin-bottom:14px; }
.gate-box .dialog-close { position:absolute; top:8px; right:10px; width:34px; height:34px;
  border:none; background:none; border-radius:9999px; color:#94A3B8;
  display:grid; place-items:center; cursor:pointer; }
.gate-box .dialog-close .material-symbols-outlined { font-size:20px; }
.gate-box .field-label { margin:0 0 6px; font-size:12.5px; font-weight:600;
  color:#475569; text-align:left; display:flex; align-items:center; gap:3px; }
.gate-box .field-label .req { color:#F43F5E; }
.gate-box .qq-wrap { position:relative; margin-bottom:12px; }
.gate-box .qq-wrap input { margin-bottom:0; padding-right:78px; }
.gate-box .qq-suffix { position:absolute; right:14px; top:0; height:50px; display:flex;
  align-items:center; font-size:13px; color:#64748B; pointer-events:none; }
.gate-box .qq-preview { margin:-6px 0 10px; font-size:11.5px; color:#94A3B8;
  text-align:left; line-height:1.6; }
.gate-box .form-hint { margin:-6px 0 12px; font-size:11.5px; color:#94A3B8;
  text-align:left; line-height:1.7; }
.gate-box .form-hint b { color:#B54708; font-weight:600; }
.gate-box .warn-box { margin:0 0 12px; padding:8px 10px; border-radius:8px;
  background:#FFF7E6; color:#B54708; font-size:12px; line-height:1.7; text-align:left; }
.gate-box .btn-row { display:flex; gap:10px; margin-top:12px; }

/* ===== 新手引导（2026-10-19 Apple 白玻版） =====
   仅保留必要信息：图标、标题、直白说明、步骤点、主按钮。
   使用系统字体、白色半透明玻璃、Apple 蓝主按钮，不再使用彩色品牌头。 */
#announce { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.32);
  display:flex; align-items:center; justify-content:center; padding:20px;
  -webkit-backdrop-filter:blur(16px) saturate(130%); backdrop-filter:blur(16px) saturate(130%); }
#announce.hidden { display:none; }
@keyframes annOverlayIn { from { opacity:0; } to { opacity:1; } }
@keyframes annCardIn {
  from { opacity:0; transform:translateY(16px) scale(.975); }
  to { opacity:1; transform:none; }
}
@keyframes annStepIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
#announce.ann-overlay-in { animation:annOverlayIn .2s ease both; }
.announce-box { max-width:350px; width:100%; max-height:calc(100dvh - 40px);
  background:rgba(255,255,255,.84); border:1px solid rgba(255,255,255,.92);

  -webkit-backdrop-filter:blur(32px) saturate(180%); backdrop-filter:blur(32px) saturate(180%);
  overflow:hidden; display:flex; flex-direction:column;
  animation:annCardIn .28s cubic-bezier(.22,1,.36,1) both;
  color:#1d1d1f; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',
    'Helvetica Neue',Arial,sans-serif; }
.announce-box .a-head { position:relative; padding:22px 22px 12px; background:transparent; color:#1d1d1f; }
.announce-box .a-ico { width:50px; height:50px; border-radius:15px; margin:0 auto 10px;
  background:linear-gradient(180deg,#fff,#f2f2f7); color:#007aff; display:grid; place-items:center;
  font-size:25px; border:1px solid rgba(255,255,255,.95);
  box-shadow:0 6px 18px rgba(15,23,42,.09), inset 0 1px 1px #fff; animation:none; }
.announce-box .a-chip { display:inline-block; padding:3px 9px; border-radius:9999px;
  background:rgba(118,118,128,.10); color:#6e6e73; font-size:11px; font-weight:600;
  letter-spacing:.02em; margin-bottom:8px; }
.announce-box h3 { margin:0; font-size:20px; font-weight:700; line-height:1.3; letter-spacing:-.02em; }
.announce-box .a-body { margin:0; padding:4px 24px 18px; font-size:15px;
  color:#3a3a3c; line-height:1.55; text-align:center; white-space:pre-wrap;
  word-break:break-word; overflow-y:auto; flex:1 1 auto; -webkit-overflow-scrolling:touch; }
.announce-box .a-body.rich { white-space:normal; }
.announce-box .a-body.rich p { margin:0 0 7px; }
.announce-box .a-body.rich p:last-child { margin-bottom:0; }
.announce-box .a-body.rich ul { margin:4px 0 7px; padding:0; list-style:none; text-align:left; }
.announce-box .a-body.rich li { position:relative; padding-left:14px; margin:3px 0; }
.announce-box .a-body.rich li::before { content:''; position:absolute; left:2px; top:.62em;
  width:4px; height:4px; border-radius:9999px; background:#007aff; }

.announce-box .a-dots { display:flex; justify-content:center; align-items:center;
  gap:6px; padding:0 22px 15px; }
.announce-box .a-dots button { width:6px; height:6px; padding:0; border:none; cursor:pointer;
  border-radius:9999px; background:rgba(118,118,128,.24);
  transition:width .24s cubic-bezier(.22,1,.36,1), background .2s; }
.announce-box .a-dots button.on { width:18px; border-radius:3px; background:#007aff; }
.announce-box .a-dots button.done { background:rgba(0,122,255,.32); }
.announce-box .a-actions { display:flex; gap:8px; padding:0 18px; }
.announce-box .a-prev, .announce-box .a-ok { flex:1; height:48px; border:none;
  border-radius:14px; font-size:16px; font-weight:600; cursor:pointer;
  font-family:inherit; transition:transform .12s ease, opacity .12s ease; }
