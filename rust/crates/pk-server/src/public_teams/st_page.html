  }
];

var announceCtx = null;   // 当前引导实例的开闭句柄（供外部强制收起）

/* 深链直达：?announce=N（或 #announce=N）从第 N 步打开。
   运营改完引导可以把链接直接发给用户看某一步，不用让人一路点过来。
   深链进来的**不写已读** —— 否则用户点开看到一半，下次正式引导反而不弹了。
   返回 0 起的步序号；没有深链或越界返回 -1。 */
function announceDeepStep(stepCount) {
  var m = /(?:[?&#])announce=(\d{1,2})(?!\d)/.exec(location.search + location.hash);
  if (!m) return -1;
  var n = +m[1] - 1;
  return (n >= 0 && n < stepCount) ? n : -1;
}

/* ---- spotlight 引导（2026-10-13）：step.target 指向具体元素时的定位逻辑 ---- */

/* target selector → 所属视图的映射：selector 命不中当前视图时先切页再定位。
   #my* → my；#navRow → 看按钮的 data-v 属性（分组页签→group、族谱页签→lineage、
   我的页签→my、看板页签不用切）；其余（.seg / .st-row* 等）→ data。
   映射里没有的 selector 不切页。 */
function announceTargetView(sel) {
  if (!sel) return null;
  if (/^#nav(?:Data|Group|Lineage|My|Wechat)$/.test(sel)) {
    var b = null;
    try { b = document.querySelector(sel); } catch (_) {}
    var v = b && b.dataset ? b.dataset.v : null;
    return (v === 'data' || v === 'group' || v === 'lineage' || v === 'my' || v === 'wechat') ? v : null;
  }
  if (/^#my/.test(sel)) return 'my';
  if (/^#subnav\b/.test(sel)) return 'group';
  if (/^#navRow/.test(sel)) {
    var rowBtn = null;
    try { rowBtn = document.querySelector(sel); } catch (_) {}
    var rv = rowBtn && rowBtn.dataset ? rowBtn.dataset.v : null;
    return (rv === 'group' || rv === 'lineage' || rv === 'my' || rv === 'wechat') ? rv : null;
  }
  if (/^\.seg\b|^#seg\b|^\.st-row/.test(sel)) return 'data';
  return null;
}

/** 引导目标在「我的」下需要哪个子页：undefined = 不改变当前子页。 */
function announceTargetMySub(sel) {
  if (!sel) return undefined;
  if (/^#navWechat$/.test(sel)) return 'wechat';
  if (/^#navMy$/.test(sel) || /^#my/.test(sel)) return null;
  return undefined;
}

/* target 指向的页面被后台关掉（如 groupEnabled=false 时 #navGroup 整体 hidden）：
   spotlight 找不到可见元素会自然回落居中卡片，但卡片文案里写着「点分组页签」就会误导。
   这里提前检测：目标元素是 hidden 或干脆不存在时，直接把整步跳过（自动滑到下一步），
   没有下一步就当这一步看完。返回 true 表示已跳过、调用方不要再 render。 */
function announceStepTargetMissing(steps, idxRef) {
  var s = steps[idxRef.idx] || {};
  var sel = s.target;
  if (!sel) return false;
  var el = null;
  try { el = document.querySelector(sel); } catch (_) {}
  var missing = !el || el.classList.contains('hidden')
    || el.offsetWidth <= 0 || el.offsetHeight <= 0;
  if (!missing) return false;
  if (idxRef.idx < steps.length - 1) {
    idxRef.idx++;
    return true;   // jump/render 由调用方继续
  }
  return false;    // 最后一步：留着走居中卡片，文案仍在
}

/* 上一步挂在目标元素上的 spotlight class / 贴位 class，步进与关闭时都要清干净 */
var announceSpotEl = null;
function clearAnnounceSpot() {
  if (announceSpotEl) {
    announceSpotEl.classList.remove('guide-spot');
    announceSpotEl.style.zIndex = announceSpotEl.getAttribute('data-ann-z') || '';
    announceSpotEl.removeAttribute('data-ann-z');
    announceSpotEl = null;
  }
}
/* 卡片贴位：按目标 rect 与剩余空间挑方向（下 > 上 > 右 > 左），都不够回落居中。
   贴位失败返回 false（调用方据此去掉方向 class，让卡片回到遮罩居中布局）。 */
function placeAnnounceCard(card, rect) {
  var cls = ['at-bottom', 'at-top', 'at-right', 'at-left'];
  cls.forEach(function (c) { card.classList.remove(c); });
  var m = 14, gap = 12;                       // 屏幕边距 / 卡片与目标间距
  var vw = window.innerWidth, vh = window.innerHeight;
  var top = rect.top, bottom = vh - rect.bottom, left = rect.left, right = vw - rect.right;
  var small = vw < 480;                        // 手机上竖屏：侧贴空间普遍不够
  card.style.left = card.style.top = card.style.right = card.style.bottom = '';
  card.style.maxWidth = '';
  var best = null;
  if (bottom >= 190 + gap && (!small || top < bottom)) best = 'at-bottom';
  else if (top >= 190 + gap) best = 'at-top';
  else if (!small && right >= 250 + gap && left < right) best = 'at-right';
  else if (!small && left >= 250 + gap) best = 'at-left';
  if (!best) return false;
  var bw = Math.min(352, vw - m * 2);
  card.style.maxWidth = bw + 'px';
  if (best === 'at-bottom' || best === 'at-top') {
    var ax = Math.min(Math.max(rect.left + rect.width / 2, m + bw / 2), vw - m - bw / 2);
    card.style.left = Math.round(ax - bw / 2) + 'px';
    card.style.top = best === 'at-bottom'
      ? Math.min(Math.round(rect.bottom + gap), vh - 120) + 'px'
      : Math.max(Math.round(rect.top - gap), 0) + 'px';
    card.style.transform = best === 'at-bottom' ? '' : 'translateY(-100%)';
    /* 箭头 x：相对卡片自身的偏移 = 目标中心 - 卡片左缘 */
    card.style.setProperty('--ax', Math.round(rect.left + rect.width / 2 - parseFloat(card.style.left)) + 'px');
  } else {
    var ay = Math.min(Math.max(rect.top + rect.height / 2, m + 90), vh - m - 90);
    card.style.top = Math.round(ay - 90) + 'px';
    card.style.left = best === 'at-right'
      ? Math.min(Math.round(rect.right + gap), vw - bw - m) + 'px'
      : Math.max(Math.round(rect.left - gap - bw), m) + 'px';
    card.style.setProperty('--ay', Math.round(Math.min(Math.max(rect.top + rect.height / 2, 90), 180)) + 'px');
  }
  card.classList.add(best);
  return true;
}
/* 渲染某一步时挂 spotlight：返回 true 表示进入贴位模式（遮罩变透明挖孔），
   false 表示找不到目标 / 放不下，回落旧的居中卡片。 */
function applyAnnounceSpot(box, card, sel) {
  clearAnnounceSpot();
  var spotMode = false;
  var el = null;
  if (sel) { try { el = document.querySelector(sel); } catch (_) { el = null; } }
  /* 显式挂着 hidden 的元素（如非当前视图的 toolbar）不算数 */
  if (el && el.classList.contains('hidden')) el = null;
  if (el && el.offsetWidth > 0 && el.offsetHeight > 0) {
    announceSpotEl = el;
    el.setAttribute('data-ann-z', el.style.zIndex || '');
    el.classList.add('guide-spot');
    el.style.zIndex = '102';
    /* 目标可能在长页面视口外（如我的页推送行）：先滚到可视区再量位置 */
    var vr = el.getBoundingClientRect();
    if (vr.top < 60 || vr.bottom > window.innerHeight - 60) {
      try { el.scrollIntoView({ block: 'center', behavior: 'instant' }); } catch (_) {}
    }
    /* 挂 class 后再量一次：guide-spot 的圆角/描边可能改变布局 */
    var rect = el.getBoundingClientRect();
    spotMode = placeAnnounceCard(card, rect);
    if (spotMode) {
      /* 读屏：把描述文本也用 aria-describedby 关联到目标元素本身 */
      try { el.setAttribute('aria-describedby', 'announceBody'); } catch (_) {}
    } else {
      /* 哪个方向都放不下：挖孔留着也意义不大，整个回落居中卡片 */
      clearAnnounceSpot();
      el.removeAttribute('aria-describedby');
    }
  }
  box.classList.toggle('ann-spot', spotMode);
  return spotMode;
}

function announceSeenKey() {
  var me = meState || {};
  var pid = Number(me.personId || 0);
  var who = pid > 0 ? ('person:' + pid) : (me.name ? ('name:' + me.name) : 'anonymous');
  return 'pk_guide_seen_at:' + encodeURIComponent(who);
}

function maybeAnnounce() {
  var a = site && site.announcement;
  /* 后端只负责开关；步骤固定在前端，避免运营后台再维护一套内容。 */
  if (!a || !a.enabled) return;
  var box = $('announce');
  if (!box) return;
  var steps = DEFAULT_GUIDE_STEPS;
  var closing = false;
  var deep = announceDeepStep(steps.length);
  var deepLinked = deep >= 0;
  var idx = deepLinked ? deep : 0;
  if (!deepLinked) {
    try {
      var seenAt = Number(localStorage.getItem(announceSeenKey()) || 0);
      if (seenAt > 0 && Date.now() - seenAt < 7 * 24 * 60 * 60 * 1000) return;
      /* 展示即记时：同一用户 7 天内刷新/重新登录都不再重复提示。 */
      localStorage.setItem(announceSeenKey(), String(Date.now()));
    } catch (_) {}
  }

  /* 关闭：锁版本 + 收动画。removeListeners 必须在 DOM 重建前摘干净，
     否则键盘 / 触摸监听会残留到下一页。 */
  var detach = [];
  function removeListeners() {
    detach.forEach(function (fn) { try { fn(); } catch (_) {} });
    detach = [];
  }
  function close() {
    if (closing) return;
    closing = true;
    clearTimeout(pushSrTimer);
    clearSwitching();
    removeListeners();
    /* 正常引导在打开时已按用户写入 7 天时间戳；深链预览不写。 */
    announceCtx = null;
    clearAnnounceSpot();
    unlockScroll();
    box.classList.add('hidden');
    box.innerHTML = '';
    box.classList.remove('ann-spot');
    box.classList.remove('ann-overlay-in');
    /* 引导关闭 = 弹幕挂载闸解除：首帧若被引导按住，这里立即补挂当日冠军。 */
    try { renderDanmaku(); } catch (_) {}
  }
  announceCtx = close;

  /* 内容渲染：白名单式富文本，绝不放原始 HTML。
     支持两种编辑习惯（都是运营在后台 textarea 里 Natural 会写的）：
       · 「· 」「- 」「1. 」开头的行 → 列表项
       · *星号包起来* → 加粗
     其余字符（含 < > & " '）一律走 esc 转义，所以注入面只剩这两个标记本身。 */
  function bodyHtml(s) {
    var raw = (s && s.content) ? String(s.content) : '';
    /* 快路：没有任何标记字符时直接转义返回，省掉拆行/建 DOM 的开销。
       命中判断必须覆盖全部三种标记（换行、星号、行首列表符）——
       早期版本漏了行首列表符，导致「· xxx」这种单行列表不走富文本路径。 */
    if (raw.indexOf('\n') < 0 && raw.indexOf('*') < 0
        && !/^\s*(?:[\u00b7\u2022-]|\d+[.、)])\s/.test(raw)) return esc(raw);
    var lines = raw.split('\n').map(function (ln) {
      var m = /^\s*(?:[·•\-]|\d+[.、)])\s+/.exec(ln);
      var li = m ? '<li>' + esc(ln.slice(m[0].length)).replace(/\*([^*\n]+)\*/g, '<b>$1</b>') + '</li>'
                 : esc(ln).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
      return { li: !!m, html: li };
    });
    var out = '', inList = false;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].li && !inList) { out += '<ul>'; inList = true; }
      if (!lines[i].li && inList) { out += '</ul>'; inList = false; }
      out += lines[i].li ? lines[i].html : '<p>' + (lines[i].html || '&nbsp;') + '</p>';
    }
    if (inList) out += '</ul>';
    return out;
  }
  function iconOf(s, i) {
    var ic = s && s.icon ? String(s.icon).trim() : '';
    return ANNOUNCE_ICONS.indexOf(ic) >= 0 ? ic : ANNOUNCE_ICONS[i % ANNOUNCE_ICONS.length];
  }

  /* 步进时若新步骤的 target 在别的视图里，先切页（data / my / group …）。
     go() 是 async：用轮询等目标视图真正渲染出来（上限 2.5s），数据一到就
     渲染 spotlight；超时也要渲染兜底，别让引导卡死在黑屏。
     等待期间卡片先收起，切完页再整卡淡入，避免卡片盖在空视图上闪烁。 */
  var switchingTimer = null, switchingPoll = null;
  function clearSwitching() {
    clearTimeout(switchingTimer); switchingTimer = null;
    clearInterval(switchingPoll); switchingPoll = null;
  }
  /* 目标此刻真的可定位：存在、没挂 hidden、有实际尺寸 */
  function targetReady(sel) {
    var el = null;
    try { el = document.querySelector(sel); } catch (_) {}
    return !!el && !el.classList.contains('hidden')
      && el.offsetWidth > 0 && el.offsetHeight > 0;
  }
  function jump(n) {
    if (n < 0) n = 0;
    if (n > steps.length - 1) n = steps.length - 1;
    if (n === idx) return;
    idx = n;
    var sel = (steps[idx] && steps[idx].target) || '';
    var targetSub = announceTargetMySub(sel);
    var subChanged = targetSub !== undefined && mySub !== targetSub;
    if (targetSub !== undefined) mySub = targetSub;
    var need = announceTargetView(sel);
    if (need && (need !== view || subChanged)) {
      clearAnnounceSpot();
      box.classList.add('hidden');
      box.innerHTML = '';
      box.classList.remove('ann-spot');
      try { switchView(need); } catch (e) { render(); return; }
      clearSwitching();
      var waited = 0;
      switchingPoll = setInterval(function () {
        waited += 120;
        if (targetReady(sel) || waited >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null; render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); render(); }, 2600);
      return;
    }
    /* 同视图：元素已经在了直接渲染；还没渲染出来（如 .st-row 行）等它出现 */
    if (sel && !targetReady(sel)) {
      clearSwitching();
      var w2 = 0;
      switchingPoll = setInterval(function () {
        w2 += 120;
        if (targetReady(sel) || w2 >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null; render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); render(); }, 2600);
      return;
    }
    render();
  }

  var firstOpen = true;
  function render() {
    clearSwitching();
    const isFirst = firstOpen;
    firstOpen = false;
    /* 深链直达的步骤：target 若在别的视图里，先切页再渲染（普通步进由 jump 管，
       深链绕过 jump，所以这里补一刀）。只处理一次：切页后 firstOpen 已翻 false。 */
    if (isFirst && deepLinked) {
      var s0 = steps[idx] || {};
      var sub0 = announceTargetMySub(s0.target);
      var sub0Changed = sub0 !== undefined && mySub !== sub0;
      if (sub0 !== undefined) mySub = sub0;
      var v0 = announceTargetView(s0.target);
      if (v0 && (v0 !== view || sub0Changed)) {
        try { switchView(v0); } catch (_) {}
      }
    }
    /* 目标被后台关掉的步骤自动滑过：指向的页签整个 hidden 时，挖孔没意义、
       文案还会误导用户去找一个不存在的按钮 —— 直接跳到下一步更干净。 */
    var idxRef = { idx: idx };
    if (announceStepTargetMissing(steps, idxRef)) {
      if (idxRef.idx === idx) return;   // 最后一步且目标缺失：不跳,照常渲染
      idx = idxRef.idx;
      render();
      return;
    }
    /* 深链首渲染：目标视图刚切过去、数据还在加载（如我的页推送行），
       和 jump 一样轮询等它出现（上限 2.5s），而不是立刻渲染成居中卡片。 */
    var sWait = steps[idx] || {};
    if (isFirst && deepLinked && sWait.target && !targetReady(sWait.target)) {
      var w0 = 0;
      switchingPoll = setInterval(function () {
        w0 += 120;
        if (targetReady(sWait.target) || w0 >= 2500) {
          clearInterval(switchingPoll); switchingPoll = null;
          firstOpen = false;
          render();
        }
      }, 120);
      switchingTimer = setTimeout(function () { clearSwitching(); firstOpen = false; render(); }, 2600);
      return;
    }
    removeListeners();
    var s = steps[idx] || {};
    var first = idx === 0;
    var last = idx === steps.length - 1;
    var ic = iconOf(s, idx);
    var html = bodyHtml(s);
    /* 纯文本才挂 rich：只有一行的文本加 rich 会丢掉用户手打的换行 */
    var isRich = /<(p|ul|li|b)>/.test(html);
    var dots = steps.map(function (_, i) {
      return '<button type="button" class="' + (i === idx ? 'on' : (i < idx ? 'done' : '')) +
        '" data-i="' + i + '" aria-label="第 ' + (i + 1) + ' 步"></button>';
    }).join('');
    box.innerHTML = '<div class="announce-box" role="dialog" aria-modal="true" ' +
      'aria-labelledby="announceTitle" aria-describedby="announceBody">' +
      '<div class="a-head">' +
        '<span class="a-chip">新手引导</span>' +
        '<div class="a-ico"><span class="material-symbols-outlined">' + esc(ic) + '</span></div>' +
        '<h3 id="announceTitle">' + esc(s.title || ('第 ' + (idx + 1) + ' 步')) + '</h3>' +
      '</div>' +
      '<div class="a-body a-step-in' + (isRich ? ' rich' : '') + '" id="announceBody">' +
        html + '</div>' +
      '<div class="a-dots" id="announceDots">' + dots + '</div>' +
      '<div class="a-actions">' +
        (first ? '' : '<button class="a-prev" id="announcePrev">上一步</button>') +
        '<button class="a-ok" id="announceNext">' + (last ? '知道啦' : '下一步') + '</button>' +
      '</div>' +
      '<button class="a-skip" id="announceSkip">' + (last ? '关闭' : '跳过引导') + '</button>' +
      '</div>';
    box.classList.remove('hidden');
    box.classList.add('ann-overlay-in');

    /* spotlight：step.target 命中页面元素 → 挖孔 + 卡片贴位；否则保持居中卡片。
       贴位失败（元素太小放不下卡）时把方向 class 摘掉，让卡片回落遮罩居中。 */
    var cardEl = box.querySelector('.announce-box');
    var spotOn = applyAnnounceSpot(box, cardEl, s.target);
    if (!spotOn && cardEl) {
      ['at-bottom', 'at-top', 'at-right', 'at-left'].forEach(function (c) {
        cardEl.classList.remove(c);
      });
      cardEl.style.left = cardEl.style.top =
        cardEl.style.maxWidth = cardEl.style.transform = '';
    }

    $('announceNext').onclick = function () { last ? close() : jump(idx + 1); };
    /* 焦点落到主按钮：读屏用户进来就能听到「下一步」，键盘党直接回车。
        只在「引导首次打开」时抢焦点 —— jump() 翻页不抢，否则用户点步骤条
        回看某一步，焦点被强行挪到按钮上，读屏进度被打断。 */
    if (isFirst) {
      const nx = $('announceNext');
      try { nx.focus({ preventScroll: true }); } catch (_) { nx.focus(); }
    }
    var prev = $('announcePrev');
    if (prev) prev.onclick = function () { jump(idx - 1); };
    $('announceSkip').onclick = close;

    /* Pill 步骤条：点哪颗去哪步（已看过的步骤可回看，这是大厂引导的标配） */
    Array.prototype.forEach.call(box.querySelectorAll('#announceDots button'), function (b) {
      b.onclick = function () { jump(+b.dataset.i); };
    });

    /* 键盘：Esc 跳过，← → 翻页。只在引导开着时接管。 */
    function onKey(e) {
      if (closing) return;
      var k = e.key;
      if (k === 'Escape') { e.preventDefault(); close(); }
      else if (k === 'ArrowRight') { e.preventDefault(); jump(idx + 1); }
      else if (k === 'ArrowLeft') { e.preventDefault(); jump(idx - 1); }
    }
    document.addEventListener('keydown', onKey, true);
    detach.push(function () { document.removeEventListener('keydown', onKey, true); });

    /* 触屏：左右滑动翻页（阈值 45px，竖向滑动不抢）。 */
    var card = box.querySelector('.announce-box');
    var sx = 0, sy = 0, tracking = false;
    function onStart(e) {
      var t = e.touches && e.touches[0];
      if (!t) return;
      sx = t.clientX; sy = t.clientY; tracking = true;
    }
    function onEnd(e) {
      if (!tracking) return;
      tracking = false;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx)) return;
      jump(idx + (dx < 0 ? 1 : -1));
    }
    if (card) {
      card.addEventListener('touchstart', onStart, { passive: true });
      card.addEventListener('touchend', onEnd, { passive: true });
      detach.push(function () {
        card.removeEventListener('touchstart', onStart);
        card.removeEventListener('touchend', onEnd);
      });
    }

    /* 点遮罩关闭；点在卡片内不关（避免误触把引导吃掉）。 */
    function onOverlay(e) { if (e.target === box) close(); }
    box.onclick = onOverlay;
    detach.push(function () { box.onclick = null; });
  }

  lockScroll();
  render();
}

/* ==================== 📩 管理员消息弹窗（docs/23 §6.1 / P3，msg- 前缀独立实现） ====================
   与引导弹窗的关系：视觉对齐（品牌头 / 圆角卡 / 主按钮），类名与逻辑完全独立，互不复用。
   数据契约（后端并行实现，任何失败一律静默）：
   · GET  /api/public/my/messages          （X-My-Token）→ {items:[{id,title,content,imageKind,date,createdAt}]}，只含未读
   · POST /api/public/my/messages/{id}/read（X-My-Token）→ {ok:true}，幂等
   · GET  /api/public/my/messages/{id}/image.png（X-My-Token）→ image/png，按收件人实时渲染（水印=本人姓名）
   行为约定：
   · 登录成功进「我的」主界面后探测一次；有未读才弹，无未读什么都不做
   · 弹窗内列表展示全部未读（最新在上），不做连续弹
   · 「知道了」逐条 POST read（allSettled，失败不阻塞关闭但 console.warn）→ 关闭
   · 单条也可先标已读；全部已读后自动关闭
   · 本次页面生命周期只自动弹一次（内存变量；「知道了」后不再弹）
   · token 未登录/过期 → 非 2xx 直接静默返回，绝不挡页面加载 */

/* 会话内防重弹：本次页面生命周期只自动弹一次；「知道了」/ 单条全读后也置 true */
let msgModalAutoShown = false;
/* 打开中的弹窗收起句柄（dismissMsgModal 用；登录门出现时主动让位） */
let msgModalCtx = null;

/* 单条消息的 date 字段过白名单：只放 数字/-/: 与空格，其余原样丢弃（防注入显示层）。
   形如 2026-10-14 的业务日与 2026-10-14 18:00 的展示时间都能通过；空/非法返回空串。 */
function msgSafeDate(v) {
  const s = String(v == null ? '' : v);
  if (!s) return '';
  const cleaned = s.replace(/[^0-9\-: ]/g, '').trim();
  return /^\d{4}-\d{2}-\d{2}([ ]\d{2}:\d{2}(:\d{2})?)?$/.test(cleaned) ? cleaned : '';
}

/* 拉未读消息：非 2xx（含 401 登录过期）/网络失败 → null，调用方静默忽略 */
async function fetchMyMessages() {
  try {
    const r = await fetch('/api/public/my/messages', { headers: myTokenHeaders() });
    if (!r.ok) return null;
    const d = await r.json().catch(() => null);
    if (!d || !Array.isArray(d.items)) return null;
    /* 只认带合法 id 的条目；title/content/date 缺省给空串，渲染端兜底 */
    return d.items.filter((it) => it && it.id != null)
      .map((it) => ({
        id: it.id,
        title: String(it.title || ''),
        content: String(it.content || ''),
        imageKind: String(it.imageKind || ''),
        date: String(it.date || ''),
        createdAt: String(it.createdAt || ''),
      }));
  } catch (_) {
    return null;   // 网络失败：静默，绝不挡页面
  }
}

/** 底栏「微信对接」未读角标（2026-10-18 第三轮，设计稿 #wechat-badge）：
    数量 = /api/public/my/messages 的未读条数（该接口只下发未读）。任何失败静默隐藏，
    绝不挡页面；未登录（无 my token）直接隐藏。 */
async function refreshWxBadge() {
  const b = $('wxBadge');
  if (!b) return;
  if (!myToken()) { b.hidden = true; return; }
  let items = null;
  try { items = await fetchMyMessages(); } catch (_) { items = null; }
  const n = items ? items.length : 0;
  if (n > 0) {
    b.hidden = false;
    b.textContent = n > 99 ? '99+' : String(n);
    b.classList.remove('wx-badge-pop');
    void b.offsetWidth;                 // 重置动画
    b.classList.add('wx-badge-pop');
  } else {
    b.hidden = true;
  }
}

/* 图片按需加载：fetch + blob + URL.createObjectURL（<img> 直接指 URL 会丢 X-My-Token 头）。
   成功 resolve URL；任何失败 resolve null（调用方显示占位文案，不挡正文）。 */
async function fetchMsgImage(id) {
  try {
    const r = await fetch('/api/public/my/messages/' + encodeURIComponent(String(id)) + '/image.png',
      { headers: myTokenHeaders() });
    if (!r.ok) return null;
    const b = await r.blob();
    if (!b || b.type.indexOf('image') !== 0) return null;
    return URL.createObjectURL(b);
  } catch (_) {
    return null;
  }
}

/* 逐条标已读：幂等；失败抛错（调用方 warn/降级），非 2xx 原样走失败分支 */
async function postMsgRead(id) {
  const r = await fetch('/api/public/my/messages/' + encodeURIComponent(String(id)) + '/read', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
    body: JSON.stringify({}),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}

/* 图片懒加载：item 未读且带 imageKind 才按需拉图；失败/无图显示占位文案，不挡正文。
   返回是否发起了加载（用于决定占位文案内容）。 */
function loadMsgImage(item, wrapEl) {
  let note = null;
  const showNote = (tx) => {
    if (!note) { note = document.createElement('div'); note.className = 'msg-img-note'; wrapEl.appendChild(note); }
    note.textContent = tx;   // textContent，绝不 innerHTML
  };
  if (!item.imageKind) { wrapEl.hidden = true; return false; }
  fetchMsgImage(item.id).then((url) => {
    if (!document.getElementById('msgModal').contains(wrapEl)) {
      if (url) URL.revokeObjectURL(url);   // 弹窗已关：直接回收
      return;
    }
    if (!url) { showNote('图片加载失败，稍后重试'); return; }
    const img = document.createElement('img');
    img.alt = '消息配图';
    img.onload = () => { wrapEl.style.minHeight = ''; };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      img.remove();
      showNote('图片加载失败，稍后重试');
    };
    img.src = url;
    wrapEl.style.minHeight = '120px';   // 加载中撑住高度，避免闪跳
    wrapEl.appendChild(img);
  });
  return true;
}

/** 打开消息弹窗：items 最新在上（服务端只发未读；顺序这里再保险一次）。
    title/content 一律 textContent 赋值，绝不 innerHTML 拼接用户内容。 */
function openMsgModal(items) {
  const box = $('msgModal');
  if (!box || !items || !items.length) return;
  const list = items.slice().sort((a, b) => {
    const da = String(a.createdAt || a.date || ''), db = String(b.createdAt || b.date || '');
    return da < db ? 1 : da > db ? -1 : 0;   // 最新在上；同刻按原序稳定
  });
  const card = document.createElement('div');
  card.className = 'msg-box';
  card.setAttribute('role', 'dialog');
  card.setAttribute('aria-modal', 'true');
  card.setAttribute('aria-labelledby', 'msgTitle');

  /* 品牌头（静态结构固定，无用户内容） */
  const head = document.createElement('div');
  head.className = 'msg-head';
  const chip = document.createElement('span');
  chip.className = 'msg-chip';
  chip.textContent = '管理员消息';
  const ico = document.createElement('div');
  ico.className = 'msg-ico';
  const icoSpan = document.createElement('span');
  icoSpan.className = 'material-symbols-outlined';
  icoSpan.textContent = 'campaign';
  ico.appendChild(icoSpan);
  const h3 = document.createElement('h3');
  h3.id = 'msgTitle';
  h3.textContent = '你有 ' + list.length + ' 条未读消息';
  head.appendChild(chip); head.appendChild(ico); head.appendChild(h3);
  card.appendChild(head);

  /* 消息列表（textContent 渲染，防注入） */
  const listEl = document.createElement('div');
  listEl.className = 'msg-list';
  const markOneRead = (item, btn) => {
    btn.disabled = true;
    postMsgRead(item.id).then(() => {
      btn.textContent = '已读';
      btn.classList.add('msg-read-done');
      item.__read = true;
      refreshWxBadge();   // 未读少一条 → 底栏角标跟着减
      /* 全部已读 → 自动关闭（含一条的情况） */
      if (list.every((x) => x.__read)) closeMsgModal();
    }).catch((e) => {
      console.warn('[msgModal] 标记已读失败 id=' + item.id, e);
      btn.disabled = false;
      btn.textContent = '标已读';
    });
  };
  list.forEach((item) => {
    const li = document.createElement('div');
    li.className = 'msg-item';
    const top = document.createElement('div');
    top.className = 'msg-item-top';
    const t = document.createElement('div');
    t.className = 'msg-item-title';
    t.textContent = item.title || '（无标题）';
    top.appendChild(t);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'msg-read-btn';
    btn.textContent = '标已读';
    btn.onclick = () => markOneRead(item, btn);
    top.appendChild(btn);
    li.appendChild(top);
    const dt = msgSafeDate(item.date) || msgSafeDate(item.createdAt);
    if (dt) {
      const dEl = document.createElement('div');
      dEl.className = 'msg-item-date';
      dEl.textContent = dt;
      li.appendChild(dEl);
    }
    if (item.content) {
      const body = document.createElement('div');
      body.className = 'msg-item-body';
      body.textContent = item.content;   // 绝不 innerHTML
      li.appendChild(body);
    }
    if (item.imageKind) {
      const wrap = document.createElement('div');
      wrap.className = 'msg-img-wrap';
      li.appendChild(wrap);
      loadMsgImage(item, wrap);   // 按需 fetch blob，失败占位文案不挡正文
    }
    listEl.appendChild(li);
  });
  card.appendChild(listEl);

  /* 底部「知道了」：逐条 POST read（allSettled，幂等），失败不阻塞关闭 */
  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  const okBtn = document.createElement('button');
  okBtn.type = 'button';
  okBtn.className = 'msg-ok';
  okBtn.textContent = '知道了';
  okBtn.onclick = () => {
    okBtn.disabled = true;
    const pending = list.filter((x) => !x.__read);
    Promise.allSettled(pending.map((x) => postMsgRead(x.id))).then((rs) => {
      rs.forEach((r, i) => {
        if (r.status === 'rejected') console.warn('[msgModal] 已读回执失败 id=' +
          (pending[i] && pending[i].id), r.reason);
      });
      refreshWxBadge();   // 批量已读 → 底栏角标归零/更新
      closeMsgModal();
    });
  };
  actions.appendChild(okBtn);
  card.appendChild(actions);

  if (list.length > 1) {
    const hint = document.createElement('div');
    hint.className = 'msg-swipe-hint';
    hint.textContent = '共 ' + list.length + ' 条，可逐条「标已读」，或一次「知道了」全部已读';
    card.appendChild(hint);
  }

  box.innerHTML = '';
  box.appendChild(card);
  box.classList.remove('hidden');
  box.classList.add('msg-overlay-in');
  lockScroll();
  /* 点遮罩不关（消息需要确认已读，误触遮罩关掉会丢「知道了」时机）；Esc 让位给登录门 */
  msgModalCtx = closeMsgModal;
  try { okBtn.focus({ preventScroll: true }); } catch (_) { okBtn.focus(); }
}

/** 关闭弹窗：回滚遮罩入场动画、解锁滚动、清 DOM 与句柄 */
function closeMsgModal() {
  const box = $('msgModal');
  msgModalCtx = null;
  msgModalAutoShown = true;   // 关过一次（含单条全读自动关）：本次页面不再自动弹
  if (!box) return;
  /* 回收列表里已生成的 blob URL：节点上取不到原始 url，逐个 img.src 撤销 */
  box.querySelectorAll('.msg-img-wrap img').forEach((img) => {
    if (img.src && img.src.indexOf('blob:') === 0) URL.revokeObjectURL(img.src);
  });
  box.classList.add('hidden');
  box.classList.remove('msg-overlay-in');
  box.innerHTML = '';
  unlockScroll();
}

/** 收起消息弹窗（登录门出现时调用，让位优先级更高的界面） */
function dismissMsgModal() {
  const box = $('msgModal');
  if (box && !box.classList.contains('hidden')) closeMsgModal();
  else if (msgModalCtx) { msgModalCtx = null; }
}

/** 登录成功进「我的」主界面后的探测入口：只自动弹一次，任何失败静默忽略。
    调用点：loadMy() 主数据渲染完成后（fire-and-forget，不 await，绝不挡主数据）。 */
async function probeMyMessages() {
  if (msgModalAutoShown) return;
  msgModalAutoShown = true;   // 先占位：本次页面生命周期只探测弹一次，失败也不重试
  const items = await fetchMyMessages();
  if (!items || !items.length) return;   // 无未读 / token 失效 / 网络失败：什么都不做
  if (!$('gate') || !$('gate').classList.contains('hidden')) return;   // 登录门开着：不叠层
  openMsgModal(items);
}

/* ==================== 🎉 彩带庆祝 + 📣 运营公告（2026-10-13 / items 2026-10-14） ====================
   数据契约（后端并行实现，前端按契约消费，拿不到就全关不显示）：
   · GET /api/public/announcements（无需登录）
       → { login:{enabled,text,icon}, celebrate:{enabled,confetti,title,name,wave},
           items:[{enabled,icon,title,name,wave,text,tone}] }   ← 登录前的公告条兜底
   · GET /api/public/teams/{TEAM}（site 接口）
       placements: { home:{enabled,text,icon}, my:{enabled,text,icon} }
       celebrate:  { enabled, confetti, title, name, wave }
       items:      [{enabled,icon,title,name,wave,text,tone}]   ← 公告条主数据源（顺序即从上到下）
   页面顶部公告（2026-10-17 口径）= renderAnnounceItems(items) + renderHomeAnnouncement(placements.home)
   都收进头部单行 #mhAnn；site.champ / site.celebrate 兼容期
   后端仍下发，但前端不再单独渲染横幅（否则同一条冠军信息会上下重复）。 */

let siteAnnouncements = {};   // /announcements 探测结果（失败 = {}，所有消费点 falsy 兜底）

/* 📣 头部公告行 #mhAnn 的轮换计时句柄（2026-10-17）：**全局唯一** —— 任何重渲染
   （bootRest 静默刷新 / 切视图回来）都先 mhAnnStopRotate() 清掉旧的再起新的，
   杜绝双份 interval 导致的单行公告闪烁与错拍。 */
let mhAnnRotateTimer = null;
/* 写入序号令牌：mhAnnShowItem 每次调用自增取号，挂起的 450ms 淡出重建到期时对号 ——
   号不对（期间又发生过收起 / 重渲染 / 更新一次轮换）就丢弃这帧，防止过期闭包把
   旧内容写回已经清空或换新的公告行（闪烁 / 幽灵内容）。 */
let mhAnnSeq = 0;
/* 最近一次 renderAnnounceItems 建好的单行轮换队列（含 renderHomeAnnouncement 追加的
   home 条）：switchView 切走时保留，切回数据视图时据此原样恢复（不用等网络）。 */
let mhAnnQueue = [];

/** 公开启动探测的硬超时：登录界面不能被公告/站点接口拖住。
    页面内的业务请求仍走 api()；这里只保护首屏那几次“有就用、没有也能继续”的探测。 */
async function fetchWithTimeout(url, opts, timeoutMs) {
  if (typeof AbortController !== 'function') return fetch(url, opts);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    return await fetch(url, Object.assign({}, opts || {}, { signal: ctl.signal }));
  } finally {
    clearTimeout(timer);
  }
}

/** 拉 announcements 配置：任何失败（404/网络/后端未上线）都回落为空对象，绝不挡启动 */
async function fetchAnnouncements() {
  const team = TEAM === 'male' || TEAM === 'female' ? TEAM : '';
  const url = '/api/public/announcements' + (team ? '?team=' + encodeURIComponent(team) : '');
  const r = await fetchWithTimeout(url, {}, 2500);
  if (!r.ok) return {};
  const d = await r.json().catch(() => ({}));
  return d && typeof d === 'object' ? d : {};
}

/** 公告条统一 HTML（文案经 esc 转义；icon 只认文件内 ANNOUNCE_ICONS 白名单，
    白名单外的名字一律回默认图标 —— 与后端 STEP_ICON_WHITELIST 同一口径，防注入）
    2026-10-17 口径变更：cfg.icon 为空串或白名单外 → **不渲染图标 span**（设置
    「不显示图标」就真不显示，不再回默认图标兜底）。defIcon 参数保留在签名里
    （gate/my 两处调用方不动），函数内已不再使用。布局由 .ann-bar 的 flex 自然收缩，
    ann-ico 样式无需改动。 */
function annBarHtml(id, cfg, defIcon) {
  cfg = cfg || {};
  if (!cfg.enabled || !cfg.text) return '';   // 关着 / 没文案：不出（调用方空串直拼）
  const icon = ANNOUNCE_ICONS.indexOf(cfg.icon) >= 0 ? cfg.icon : '';
  return '<div class="ann-bar" id="' + id + '">' +
    (icon ? '<span class="material-symbols-outlined ann-ico">' + esc(icon) + '</span>' : '') +
    '<span class="ann-tx">' + esc(cfg.text) + '</span>' +
  '</div>';
}

/** 人名 → 名次姓名（2026-10-15 task-9②）：运营把前三位写在同一格时用
    「、,，/;；」或空白分隔（例如「狼哲、狼九、狼仔」），也可能留空位
    （「狼哲、、狼仔」= 第 2 名空缺）。这里切分 → trim → 只取前 3 个位置，
    **保留名次位置**（空位留成 ''）：这样第 3 名不会被顶成第 2 名；
    调用方只渲染非空项，所以空名次不占行。
    ⚠️ 分隔符里**不含 `|`**：`|` 是 champBanner 三段式（称号|人名|音浪）的专用分隔符，
    人名再按 `|` 切会和它撞车、串位（Lead 2026-10-15 复核口径）。 */
function splitRankNames(raw) {
  return String(raw == null ? '' : raw)
    .split(/[、,，\/;；\n]|\s+/)
    .map((s) => s.trim())
    .slice(0, 3);
}

/** 公告条按当前团别过滤（2026-10-22）：
    team 空 = 男女团通用；male/female = 仅该团。空团别视角（全团 / 登录前）
    不做额外限制，保留全部公告；真正登录后 applyLoginState 会切到本团并重渲染。 */
function announcementItemsForTeam(items, team) {
  const t = team === 'male' || team === 'female'
    ? team
    : (TEAM === 'male' || TEAM === 'female' ? TEAM : 'all');
  return (Array.isArray(items) ? items : []).filter((it) => {
    if (!it) return false;
    const itTeam = it.team === 'male' || it.team === 'female' ? it.team : '';
    return !itTeam || t === 'all' || itTeam === t;
  });
}

/** 当前缓存里的公告条来源：site.items 为主，登录前探测结果兜底。 */
function currentAnnouncementItems() {
  if (site && Array.isArray(site.items)) return site.items;
  if (typeof siteAnnouncements !== 'undefined' && siteAnnouncements &&
      Array.isArray(siteAnnouncements.items)) return siteAnnouncements.items;
  return [];
}

/** 团别变化后立即刷新已缓存横幅，不等下一次网络请求。 */
function refreshTeamAnnouncements() {
  renderAnnounceItems(currentAnnouncementItems());
}

/** 📣 头部公告行渲染（2026-10-17 用户口径改版）：原来把每条 enabled 渲染成一张竖排
    .ann-item 大卡（#annItems 顶部占近半屏、滚走前一直占位），现在全部压缩进 masthead
    内的单行胶囊 #mhAnn —— 随头部吸顶、只占一行；多条 = 4 秒间隔自动轮换，同一行内
    淡入淡出（interval 存全局句柄，重渲染先清，杜绝双份计时器闪烁）。
    契约（每条）：{ enabled, icon, title, name, wave, text, tone:'brand'|'plain', align, popup, seat, avatar }
    · 只渲染 enabled=true 的（公开接口已过滤一遍，这里再兜一道，防管理端形态喂）
    · 单条口径：一行取核心信息「🏆 title name·wave text」（🏆 = emoji_events 符号占位，
      name 切前三位取第一位 + wave>0 补 wan(wave)，段与段之间用 ' · ' 连接；text 换行压空格）
    · 多条：按数组顺序 4 秒轮换，行尾小字「当前序号/总数」；同一条内淡入淡出
    · tone=brand → 紫金渐变胶囊（.mh-ann.ai-brand）；其余/非法 → 浅紫白底胶囊
    · align / popup / seat / avatar 字段单行轮播条**不用**（弹窗逻辑走
      maybeAnnounceItemsPopup，保持原样；align 是大卡版式字段，单行无意义）
    · 图标按条目配置（2026-10-17 改口径）：item.icon 空串/未配 → **不出图标 span**；
      icon 有值且在 ANNOUNCE_ICONS 白名单内才显示 —— 不再回落 emoji_events/military_tech 默认图标
    · title/name/wave/text 全空 → 该条直接跳过
    · 显隐口径（2026-10-17，任务口径 e 选「switchView 控制显隐」）：渲染只填
      view==='data'；switchView 切走时 mhAnnCollapse 收起、切回 mhAnnRestore 按队列
      （mhAnnQueue）恢复，内容随 bootRest 静默刷新整包校准
    安全：全程 createElement + textContent，后端字符串一律不进 innerHTML（零注入面）；
    icon 只认页面 ANNOUNCE_ICONS 白名单（与后端 STEP_ICON_WHITELIST 同一口径）。 */
function renderAnnounceItems(items) {
  const box = $('mhAnn');
  if (!box) return;
  /* 公告挂数据看板：只填数据视图。非数据视图切走时由 switchView 统一收口
     （mhAnnCollapse：停轮换 + 清行 + hidden，队列 mhAnnQueue 保留供切回恢复）；
     若这里发现 view 已不是 data（深链 / bootRest 改道后的首次渲染），同样收起并返回。 */
  if (view !== 'data') {
    mhAnnCollapse();
    return;
  }
  /* 收集 enabled 且有内容的条目（跳过全空条），压成单行轮换队列 */
  const list = announcementItemsForTeam(items, TEAM).filter((it) => {
    if (!it || !it.enabled) return false;
    const title = String(it.title == null ? '' : it.title);
    const text = String(it.text == null ? '' : it.text);
    const picked = splitRankNames(it.name).filter((s) => s.length > 0);
    return !!(title || picked.length || text);
  });
  /* 空数组 / 全关：不在这里直接收起 —— placements.home 可能还开着（home 条自己
     就能撑起这一行）。只清掉 items 队列，行显隐交给行尾的「队列空则收起」兜底
     或 renderHomeAnnouncement（有 home 条时它会把行撑开并显示）。 */
  /* 队列条目 → 单行文本（🏆 title name·wave text 组合）+ 视觉档（brand/plain）+ 图标 */
  const queue = list.map((it) => {
    const title = String(it.title == null ? '' : it.title);
    const text = String(it.text == null ? '' : it.text).replace(/\s*\n+\s*/g, ' ').trim();
    const picked = splitRankNames(it.name).filter((s) => s.length > 0);
    const nm = picked.length ? picked[0] + (Number(it.wave) > 0 ? ' · ' + wan(it.wave) : '') : '';
    const segs = [title, nm, text].filter((s) => s.length > 0).map((s) => s.trim())
      .filter((s) => s.length > 0);
    const ic = String(it.icon == null ? '' : it.icon).trim();
    return {
      icon: (ic && ANNOUNCE_ICONS.indexOf(ic) >= 0) ? ic : '',   // 空 = 无图标（不出 span）
      brand: it.tone === 'brand',
      text: segs.join(' · ')
    };
  });
  /* 空数组 / 全关：items 部分直接清队列收起；placements.home 若还开着，紧接着的
     renderHomeAnnouncement 发现 mhAnnQueue 空但 home 有内容，会把行重新撑起并
     只显示 home 条（见其内注释）。同一 bootRest 帧内先后完成，不会闪。 */
  if (!queue.length) {
    mhAnnQueue = [];
    mhAnnCollapse();
    syncHeaderOffset();
    return;
  }
  mhAnnQueue = queue;   // 存全局：switchView 切走/切回时据此收起/恢复
  box.hidden = false;
  if (queue.length === 1) {   // 只有一条：直接显示，不轮换
    mhAnnStopRotate();
    mhAnnShowItem(box, queue[0], 0, 1);
    syncHeaderOffset();
    return;
  }
  /* 多条：4 秒间隔自动轮换。interval 是全局唯一句柄，任何重渲染（静默刷新 /
     切视图回来）都先 mhAnnStopRotate() 清掉旧的再起新的，杜绝双计时器闪烁。 */
  mhAnnStopRotate();
  let qi = 0;
  mhAnnShowItem(box, queue[0], 1, queue.length);
  mhAnnRotateTimer = setInterval(() => {
    qi = (qi + 1) % queue.length;
    mhAnnShowItem(box, queue[qi], qi + 1, queue.length);
  }, 4000);
  syncHeaderOffset();
}

/** 头部公告行：把第 idx/total 条 queue item 写进 #mhAnn（原地淡出→换内容→淡入）。
    内容全量重建（icon span + 文案 span + 多条时的序号角标），textContent 安全口径。
    竞态防护（2026-10-17）：取全局写入序号令牌，450ms 淡出重建到期时对号，号过期
    （期间发生过收起 / 重渲染 / 更新一次轮换）整帧丢弃 —— 挂起的旧闭包绝不回写。 */
function mhAnnShowItem(box, q, idx, total) {
  const seq = ++mhAnnSeq;
  const homeCls = q.home ? ' ai-home' : '';   // home 蓝条视觉档（并入的 placements.home）
  const tx = box.querySelector('.mha-tx');
  const apply = () => {
    if (seq !== mhAnnSeq) return;   // 令牌过期：这一帧作废，不写 DOM
    box.className = 'mh-ann' + (q.brand ? ' ai-brand' : '') + homeCls;
    box.textContent = '';
    /* 2026-10-18 第二轮 1:1：外层（渐变描边 1px）+ 内层白玻胆 .mha-in 真双层结构，
       与设计稿 DOM 逐字段对应（外 padding:1px 渐变 / 内 bg-white/80 + border）。 */
    const inn = document.createElement('span');
    inn.className = 'mha-in';
    box.appendChild(inn);
    /* 左段（图标 + 文案）整体包进 .mha-l 撑满剩余宽度，
       序号角标才能被 justify-content:space-between 顶到最右（设计稿两端对齐）。 */
    const l = document.createElement('span');
    l.className = 'mha-l';
    inn.appendChild(l);
    if (q.icon) {   // icon 空串 = 这条不渲染图标（2026-10-17 口径，无默认兜底）
      const ico = document.createElement('span');
      ico.className = 'material-symbols-outlined';
      ico.textContent = q.icon;
      l.appendChild(ico);
    }
    const t = document.createElement('span');
    t.className = 'mha-tx';
    t.textContent = q.text;
    l.appendChild(t);
    if (total > 1) {   // 多条轮换：行尾小字序号角标「1/3」
      const ix = document.createElement('span');
      ix.className = 'mha-idx';
      ix.textContent = idx + '/' + total;
      inn.appendChild(ix);
    }
    t.classList.remove('mha-fade');
  };
  if (tx) {   // 轮换切换：先淡出再整体重建（淡入），一行内完成、不撑高
    tx.classList.add('mha-fade');
    setTimeout(apply, 450);
  } else {
    apply();
  }
}

/** 全局唯一轮换句柄：重渲染 / 切视图前先清，杜绝双份 interval（闪烁 + 错拍）。 */
function mhAnnStopRotate() {
  if (mhAnnRotateTimer) { clearInterval(mhAnnRotateTimer); mhAnnRotateTimer = null; }
}

/** 切走数据视图时收起头部公告行（switchView 调用）：停轮换 + 清行 + hidden。
    同时递增写入序号令牌 —— 挂起中的 450ms 淡出重建帧到期对不上号，整帧作废，
    绝不会把内容写回已收起的行。轮换队列 mhAnnQueue 保留，切回时 mhAnnRestore 恢复。 */
function mhAnnCollapse() {
  mhAnnSeq++;
  const box = $('mhAnn');
  if (!box) return;
  mhAnnStopRotate();
  box.textContent = '';
  box.hidden = true;
  box.className = 'mh-ann';
}

/** 切回数据视图时恢复头部公告行（switchView 调用）：按 mhAnnQueue 原样重建 ——
    单条直显 / 多条 4 秒轮换，口径与 renderAnnounceItems 完全一致；队列空（没渲染过
    或公告全关）→ 保持 hidden。 */
function mhAnnRestore() {
  const box = $('mhAnn');
  if (!box) return;
  const queue = mhAnnQueue || [];
  if (view !== 'data' || !queue.length) {   // 非数据视图 / 无公告：收起
    mhAnnCollapse();
    return;
  }
  box.hidden = false;
  mhAnnStopRotate();
  if (queue.length === 1) {
    mhAnnShowItem(box, queue[0], 0, 1);
    return;
  }
  let qi = 0;
  mhAnnShowItem(box, queue[0], 1, queue.length);
  mhAnnRotateTimer = setInterval(() => {
    qi = (qi + 1) % queue.length;
    mhAnnShowItem(box, queue[qi], qi + 1, queue.length);
  }, 4000);
}

/* 看板公告条历史版本说明（2026-10-14 → 2026-10-17）：原来此处按 items 逐条渲染
   .ann-item 大卡到 #annItems（竖排大卡，顶部占近半屏），已由上方头部公告行替代；
   #annItems 容器与旧 CSS 保留不再写入。 */

/** 看板公告条（2026-10-17 并入口径）：placements.home 不再插成 toolbar 上方的
    #home-ann 蓝色大条，改为压成一条与 items 同构的队列条目**并进**头部公告行
    #mhAnn 的全局轮换队列（普通浅蓝条 .ai-home），一起参与单条直显 / 多条 4 秒轮换。
    每次静默刷新先走 renderAnnounceItems 整包重建队列（mhAnnQueue 不含 home 条），
    再由本函数把 home 条接回队尾 —— 天然无重复、每次进看板都显示。
    cfg.icon 空串/白名单外 → 不出图标（与 renderAnnounceItems 同口径）。 */
function renderHomeAnnouncement(home) {
  const box = $('mhAnn');
  if (!box) return;
  const cfg = home || {};
  if (!cfg.enabled || !cfg.text) return;   // 关着 / 没文案：不出
  /* 非数据视图：不追加（公告挂数据看板，回看板时整条渲染链路重跑）。
     mhAnnQueue 为空（items 全关）不算拦 —— home 条自己就能撑起这一行：
     renderAnnounceItems 刚收起，这里重新 unhide 并只显示 home 条。 */
  if (view !== 'data') return;
  /* home 条压成与 items 同构的队列条目（text 换行压空格；icon 空串/白名单外 = 无图标），
     蓝色通知条视觉用 .mh-ann.ai-home（沿原 #home-ann / .ann-bar 浅蓝渐变）。 */
  const ic = String(cfg.icon == null ? '' : cfg.icon).trim();
  const homeItem = {
    icon: (ic && ANNOUNCE_ICONS.indexOf(ic) >= 0) ? ic : '',
    brand: false, home: true,
    text: String(cfg.text).replace(/\s*\n+\s*/g, ' ').trim()
  };
  /* 并进全局轮换队列：mhAnnQueue 里还没有 home 条 → 追加到队尾；已有（静默刷新
     重复调用）→ 原位替换，杜绝同一条蓝通知重复占两个轮换位。 */
  const at = mhAnnQueue.findIndex((q) => q.home);
  if (at >= 0) mhAnnQueue[at] = homeItem;
  else mhAnnQueue.push(homeItem);
  /* 追加/替换后按队列长度重建展示：1 条 → 单条直显；>1 条 → 重启 4 秒轮换并先显示
     刚并进来的 home 条。全局唯一句柄，重渲染先 mhAnnStopRotate 清旧。
     行可能刚被 renderAnnounceItems 收起（items 全关）—— 这里必须重新 unhide。 */
  mhAnnStopRotate();
  const queue = mhAnnQueue;
  box.hidden = false;
  if (queue.length === 1) {
    mhAnnShowItem(box, queue[0], 0, 1);
    syncHeaderOffset();
    return;
  }
  let qi = queue.findIndex((q) => q === homeItem);
  mhAnnShowItem(box, queue[qi], qi + 1, queue.length);
  mhAnnRotateTimer = setInterval(() => {
    qi = (qi + 1) % queue.length;
    mhAnnShowItem(box, queue[qi], qi + 1, queue.length);
  }, 4000);
  syncHeaderOffset();
}

/** 「我的」页公告条：renderMy 渲染完成后调用，插在 view 内容最顶上。
    loadMy 每次都整体重建 view，天然不持久 —— 每次进「我的」都重新显示。 */
function renderMyAnnouncement(my) {
  const html = annBarHtml('my-ann', my, 'person');
  if (!html) return;
  const box = $('view');
  if (box) box.insertAdjacentHTML('afterbegin', html);
}

/* ==================== 📣 公告弹窗（2026-10-16 三甲通报 Stitch 改版） ====================
   数据契约：site 接口与 /api/public/announcements 下发的 items 每条含
   popup:boolean（后端未上线时 undefined = false）。横幅（renderAnnounceItems）
   仍渲染全部 enabled 条目、与弹窗互不排斥；弹窗取**全部** enabled && popup 条目
   按配置顺序翻页（设计稿：三甲连报，1/3 → 2/3 → 3/3，每页同一骨架同一尺寸）。
   已读锁与引导弹窗 maybeAnnounce 的版本锁同口径，key 再掺通报内容指纹：
   key = 'pk_item_popup_v' + version + '_' + hash(title|name|wave|text 各页拼接)，
   值相等不弹；「知道了」/ 翻完 / 点空白关闭都写锁。掺指纹的原因：登录门开着时
   未登录用户拿不到 version（恒 0），内容更新后必须能重弹。引导弹开了
   （announceCtx 非空）本次让位不弹。
   安全：全程 createElement + textContent / 白名单标记（加粗 + 行首列表），
   后端字符串绝不进 innerHTML（与 renderAnnounceItems 同一口径）。 */

/* 公告正文白名单富文本（2026-10-15 任务三）：与引导弹窗 maybeAnnounce 闭包内的
   bodyHtml 同一套标记口径（*星号* = 加粗；行首 ·/•/-/1. = 列表项），但那个函数
   是闭包内的，不能复用也不去改它 —— 这里独立实现等价逻辑。
   支持两种编辑习惯（运营在后台 textarea 里自然写的）：
     · 「· 」「- 」「1. 」开头的行 → 列表项
     · *星号包起来* → 加粗
   其余字符（含 < > & " '）一律走 esc 转义，所以注入面只剩这两个标记本身。 */
function ipBodyHtml(item) {
  const raw = item && item.text != null ? String(item.text) : '';
  /* 快路：没有任何标记字符时直接转义返回，省掉拆行/建 DOM 的开销。
     命中判断必须覆盖全部三种标记（换行、星号、行首列表符）——与引导弹窗同款。 */
  if (raw.indexOf('\n') < 0 && raw.indexOf('*') < 0
      && !/^\s*(?:[\u00b7\u2022-]|\d+[.、)])\s/.test(raw)) return esc(raw);
  const lines = raw.split('\n').map((ln) => {
    const m = /^\s*(?:[·•\-]|\d+[.、)])\s+/.exec(ln);
    const li = m ? '<li>' + esc(ln.slice(m[0].length)).replace(/\*([^*\n]+)\*/g, '<b>$1</b>') + '</li>'
                 : esc(ln).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
    return { li: !!m, html: li };
  });
  let out = '', inList = false;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].li && !inList) { out += '<ul>'; inList = true; }
    if (!lines[i].li && inList) { out += '</ul>'; inList = false; }
    out += lines[i].li ? lines[i].html : '<p>' + (lines[i].html || '&nbsp;') + '</p>';
  }
  if (inList) out += '</ul>';
  return out;
}
