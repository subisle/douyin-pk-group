    '<div class="qr-frame"><i></i><div class="qr-wrap" id="pushWxQrWrap">' +
    '<div class="qr-placeholder" id="pushWxQrPlaceholder">二维码生成中…</div>' +
    '<img class="qrcode" id="pushWxQr" width="208" height="208" ' +
    'alt="微信机器人绑定二维码，截屏后可从微信相册扫码"></div><i></i></div>' +
    '<div class="qr-status wait" id="pushWxStatus" role="status" aria-live="polite">' +
    '<span class="dot"></span><span id="pushWxStatusTx">二维码获取中…</span></div>' +
    '<div class="qr-expire" id="pushWxExpire">打开微信「扫一扫」，从相册选择即可绑定</div>' +
    '<button class="go gray hidden" id="pushWxRefresh" style="margin-top:8px">获取二维码</button>' +
    /* 上游要求验证码时才出现（status = need_verifycode），官方流程的一部分，保留 */
    '<div class="hidden" id="pushWxVerifyWrap" style="margin-top:8px;text-align:left">' +
    '<div class="hint">微信让你输验证码：把微信里显示的数字填到这里。</div>' +
    '<input id="pushWxVerify" inputmode="numeric" autocomplete="one-time-code" ' +
    'aria-label="微信验证码" placeholder="微信里显示的验证码" ' +
    'style="width:100%;height:42px;border:1px solid var(--hairline);' +
    'border-radius:12px;padding:0 12px;font-size:14px;margin-top:6px;background:#fff;color:var(--on-surface)">' +
    '<button class="go gray" id="pushWxVerifyGo" style="margin-top:6px">提交验证码</button></div>' +
    /* 4 位对接码：start 响应带码时展开一个可折叠兜底；默认只走扫码，不抢主流程注意力。 */
    '<details class="wx-code-fallback hidden" id="pushCodeFallback">' +
    '<summary>扫码遇到问题？使用 4 位对接码</summary>' +
    '<div class="hint wx-code-card" id="pushCodeBox">' +
    '<div class="sub">在微信里把这 4 位数字发给机器人，也能完成对接</div>' +
    '<div class="wx-code-main"><b id="pushCodeValue">—</b>' +
    '<button class="go gray" id="pushCodeCopy" disabled>复制对接码</button></div>' +
    '<div class="qr-expire" id="pushCodeExpire">30 分钟内有效</div>' +
    '<div id="pushCodeError" class="hidden" style="margin-top:6px;color:#b42318;font-weight:600"></div>' +
    '</div></details>' +
    '</div>';
  }
  return h;
}

/* 二维码区常驻：页面打开自动取码，用户直接截屏。
   「重新获取二维码」在扫码后中间态 / 取码失败 / 过期时都可用；验证码与对接码是异常兜底。 */
function bindPushQrShow() {
  const refresh = $('pushWxRefresh');
  if (refresh) {
    refresh.onclick = () => {
      /* scanBound 状态只渲染了说明和按钮。用户点重取时必须先按二维码模式
         重渲染整张卡，否则 startWxDock 没有 #pushQrArea / #pushWxQr 可写，
         接口即使返回二维码也永远显示不出来。 */
      if (!wxDockForceQr && pushState && pushState.scanBound && !$('pushQrArea')) {
        wxDockForceQr = true;
        renderPushBox(pushState);
        return;
      }
      startWxDock();
    };
  }
  const verifyGo = $('pushWxVerifyGo');
  if (verifyGo) verifyGo.onclick = () => wxDockPollNow();
  const copy = $('pushCodeCopy');
  if (copy) copy.onclick = copyPushCode;
}

/* ===== 微信对接二维码（2026-10-19 用户口径）=====
   进入子页自动 POST /my/push/wechat/start（后端转 openclaw-weixin 官方
   get_bot_qrcode）→ imgContent 是 data:image/svg+xml 的二维码图，直接塞 <img>；
   同一响应里的 code / codeExpires 由 fillPushCode 填 4 位对接码块。
   拿到就 2 秒一轮 POST /my/push/wechat/poll 看状态：wait/scaned/need_verifycode/
   expired/verify_code_blocked/scaned_but_redirect/binded_redirect/confirmed。
   confirmed = 后端已保存凭证；重配时复用会话上下文主动连发两条，首次扫码待用户首条消息触发。
   计时器必须显式清（clearWxDock）：renderPushBox 每次重渲染都会换掉 #pushBox 的 DOM，
   残留的 setInterval/setTimeout 只会在已卸载节点上白写文案。 */
const WX_QR_TTL_MS = 5 * 60 * 1000; // 官方二维码约 5 分钟有效（与页面文案一致）
const PUSH_CODE_TTL_MS = 30 * 60 * 1000; // 后端对接码固定 30 分钟有效（兜底用）
let wxDockTimer = null;      // 状态轮询句柄
let wxDockTick = null;       // 有效期倒计时句柄
let pushCodeTick = null;     // 对接码倒计时句柄
let wxDockQr = '';           // 当前二维码标识（轮询必须带上）
let wxDockImgContent = '';   // 当前二维码 data URL；离开子页再回来可就地恢复
let wxDockDeadline = 0;      // 有效期截止（毫秒时间戳）
let wxDockStarting = false;  // 防止自动取码与手动重试并发打两次 start
let wxDockEpoch = 0;         // 二维码请求代际：重渲染/重取码后旧响应必须作废
let wxDockPollingEpoch = 0;  // 当前在飞的 poll 属于哪一代（0 = 无）
let wxDockAutoAttempted = false; // 本次进入子页是否已自动取过一次码
let wxDockConfirmed = false; // 本次会话刚对接成功：重渲染后仍显示一句「对接成功」
let wxDockNeedActivate = false; // 首次扫码没有 context_token：要提示「给机器人发一条消息」
let wxDockForceQr = false; // scanBound 中间态下，用户已明确选择重新展示并获取二维码

function clearWxDock() {
  wxDockEpoch++;
  clearTimeout(wxDockTimer); clearInterval(wxDockTick);
  wxDockTimer = null; wxDockTick = null;
}

function clearPushCodeTimer() {
  clearInterval(pushCodeTick);
  pushCodeTick = null;
}

/* 状态行（.qr-status 三态色：wait 琥珀呼吸 / scaned 绿 / ok 绿加粗 / bad 红） */
function wxStatusSet(kind, text) {
  const box = $('pushWxStatus'), tx = $('pushWxStatusTx');
  if (!box) return;
  box.className = 'qr-status ' + kind;
  if (tx) tx.textContent = text;
}

/* 二维码倒计时：每 5 分钟失效一次（官方口径），剩 30 秒变红，到点给「刷新」 */
function startWxCountdown() {
  clearInterval(wxDockTick);
  const render = () => {
    const exp = $('pushWxExpire');
    if (mySub !== 'wechat' || !exp) { clearInterval(wxDockTick); return; }   // 离开子页/节点没了
    const left = Math.max(0, wxDockDeadline - Date.now());
    if (!left) { clearInterval(wxDockTick); onWxQrExpired(); return; }
    const sec = Math.ceil(left / 1000);
    exp.textContent = '二维码 ' + Math.floor(sec / 60) + ' 分 ' + pad2(sec % 60) + ' 秒后失效';
    exp.classList.toggle('soon', sec <= 30);
  };
  render();
  wxDockTick = setInterval(render, 1000);
}

function setWxQrPlaceholder(text) {
  const ph = $('pushWxQrPlaceholder');
  if (ph) ph.textContent = text;
}

function wxDockShowRetry() {
  $('pushWxRefresh')?.classList.remove('hidden');
}

/* 取二维码：失败（上游抖动 / 401 之外的 400）也要给「重新获取」按钮，不能把这块卡死。
   并发保护：自动取码和用户点重试可能同一帧触发，只允许一个 start 在飞。 */
async function startWxDock() {
  if (wxDockStarting) return;
  /* 「重新获取二维码」唯一出口：先放弃上一代状态，把过期的 scanBound
     中间态清成可渲染的取码页；否则按钮会指向已消失的旧 DOM。 */
  wxDockAutoAttempted = false;
  wxDockStarting = true;
  clearWxDock();
  const epoch = wxDockEpoch;
  clearPushCodeTimer();
  wxDockQr = '';
  wxDockImgContent = '';
  wxDockDeadline = 0;
  wxDockConfirmed = false;
  wxDockNeedActivate = false;
  const img = $('pushWxQr');
  if (img) img.removeAttribute('src');
  const wrap = $('pushWxQrWrap');
  if (wrap) wrap.classList.remove('qr-live');
  const area = $('pushQrArea');
  if (area) area.setAttribute('aria-busy', 'true');
  setWxQrPlaceholder('二维码生成中…');
  $('pushWxRefresh')?.classList.add('hidden');
  $('pushWxVerifyWrap')?.classList.add('hidden');
  $('pushCodeFallback')?.classList.add('hidden');
  if ($('pushWxVerify')) $('pushWxVerify').value = '';
  const exp = $('pushWxExpire');
  if (exp) { exp.textContent = '正在生成二维码，请稍候…'; exp.classList.remove('soon'); }
  wxStatusSet('wait', '二维码获取中…');
  try {
    const d = await postPush('/wechat/start', {});
    /* 代际/DOM 变了就丢弃旧响应：否则重渲染后旧响应会把新页面写坏。 */
    if (epoch !== wxDockEpoch || !$('pushWxStatus') || mySub !== 'wechat') return;
    wxDockQr = d.qrcode || '';
    if (!wxDockQr) throw new Error('微信接口没有返回二维码');
    const imgContent = typeof d.imgContent === 'string' ? d.imgContent.trim() : '';
    if (!imgContent) throw new Error('微信接口没有返回二维码图形');
    wxDockImgContent = imgContent;
    if (img) img.src = imgContent;
    if (wrap) wrap.classList.add('qr-live');
    const expiresIn = Number(d.expiresIn);
    wxDockDeadline = Date.now() +
      (Number.isFinite(expiresIn) && expiresIn > 0 ? expiresIn * 1000 : WX_QR_TTL_MS);
    /* 响应里带 4 位 code 时只露出折叠兜底（admin 观看账号 code 为空 → 整块隐藏） */
    fillPushCode(d);
    wxStatusSet('wait', '等待扫码…');
    const exp2 = $('pushWxExpire');
    if (exp2) { exp2.textContent = ''; exp2.classList.remove('soon'); }
    if (area) area.setAttribute('aria-busy', 'false');
    startWxCountdown();
    pollWxDock();
  } catch (e) {
    if (epoch !== wxDockEpoch || mySub !== 'wechat') return;
    if (e.status === 401) return; // postPush 已拉起登录门
    wxDockQr = '';
    wxDockImgContent = '';
    setWxQrPlaceholder('二维码没取到');
    wxStatusSet('bad', '二维码没取到：' + (e.message || '未知错误'));
    if (area) area.setAttribute('aria-busy', 'false');
    wxDockShowRetry();
  } finally {
    wxDockStarting = false;
    /* 渲染换代导致本次请求作废：等旧请求退出后，在新 DOM 上自动补一次。 */
    if (epoch !== wxDockEpoch && mySub === 'wechat' && !wxDockQr) {
      wxDockAutoAttempted = false;
      queueMicrotask(() => autoStartWxDock(pushState));
    }
  }
}

/* 离开子页会停轮询；再回来且二维码仍有效时直接恢复，不重新打 start。 */
function resumeWxDock() {
  if (!wxDockQr || !wxDockImgContent || wxDockDeadline <= Date.now()) return false;
  const img = $('pushWxQr');
  const wrap = $('pushWxQrWrap');
  if (!img || !wrap) return false;
  img.src = wxDockImgContent;
  wrap.classList.add('qr-live');
  const area = $('pushQrArea');
  if (area) area.setAttribute('aria-busy', 'false');
  wxStatusSet('wait', '等待扫码…');
  startWxCountdown();
  pollWxDock();
  return true;
}

function autoStartWxDock(p) {
  if (!p || p.bound || !p.channelConfigured || wxDockConfirmed) return;
  if (mySub !== 'wechat') return;
  const card = $('myPushCard');
  if (card && card.hidden) return;
  if (wxDockStarting) return;
  if (resumeWxDock()) return;
  /* scanBound = 已经扫过码、只差手机确认。此时自动重开会顶掉刚扫的码；
     只渲染说明和手动重取入口，用户明确点击后再 startWxDock()。 */
  if (p.scanBound && !wxDockForceQr && !wxDockQr) {
    wxDockShowRetry();
    return;
  }
  if (wxDockAutoAttempted) return;
  wxDockAutoAttempted = true;
  startWxDock();
}

/* 安排下一轮状态轮询（2 秒一轮）。节点没了就自然停（收起 / 重渲染都会清计时器）。 */
function pollWxDock() {
  if (mySub !== 'wechat' || !wxDockQr) return;
  clearTimeout(wxDockTimer);
  wxDockTimer = setTimeout(wxDockPollOnce, 2000);
}


/* 立刻轮询一次（点「提交验证码」走这里：等 2 秒才发像是卡住了，用户会连点）。
   排队的下一轮先取消，跑完由 wxDockPollOnce 末尾照常续上，任何时刻至多一个待触发计时器。 */
function wxDockPollNow() {
  clearTimeout(wxDockTimer);
  wxDockPollOnce();
}

/* 轮询一次状态，末尾自己续下一轮。有验证码输入时按 verify_code 一起带上
   （need_verifycode 的解法：后端透传给官方 get_qrcode_status）。 */
async function wxDockPollOnce() {
  const epoch = wxDockEpoch;
  if (mySub !== 'wechat' || !wxDockQr || !$('pushWxStatus')) return;  // 离开子页/收起：不再续轮询
  if (wxDockPollingEpoch === epoch) return;
  wxDockPollingEpoch = epoch;
  const qr = wxDockQr;
  const verify = $('pushWxVerify') ? $('pushWxVerify').value.trim() : '';
  let d;
  try {
    d = await postPush('/wechat/poll', verify
      ? { qrcode: qr, verifyCode: verify }
      : { qrcode: qr });
    if (epoch !== wxDockEpoch || qr !== wxDockQr || mySub !== 'wechat' || !$('pushWxStatus')) return;
  } catch (e) {
    if (epoch !== wxDockEpoch || qr !== wxDockQr || mySub !== 'wechat') return;
    if (e.status === 401) return; // postPush 已拉起登录门
    if (e.status === 403) {
      clearWxDock();
      wxStatusSet('bad', e.message || '微信状态查询被拒绝');
      wxDockShowRetry();
      return;
    }
    /* 400 = 后端判定二维码会话已过期（pending 会话 5 分钟 TTL）→ 给刷新 */
    if (e.status !== 400) {
      wxStatusSet('bad', '状态查询暂时失败，继续等待…');
      pollWxDock();
      return;
    }
    clearWxDock();
    wxDockQr = '';
    wxDockImgContent = '';
    const img = $('pushWxQr');
    if (img) img.removeAttribute('src');
    setWxQrPlaceholder('二维码已失效');
    wxStatusSet('bad', '二维码已失效，点下面刷新');
    wxDockShowRetry();
    return;
  } finally {
    if (wxDockPollingEpoch === epoch) wxDockPollingEpoch = 0;
  }
  const st = d.status || 'wait';
  if (st === 'confirmed') { onWxDockConfirmed(d); return; }
  if (st === 'expired') { onWxQrExpired(); return; }
  if (st === 'scaned') wxStatusSet('scaned', '已扫码，请在微信中确认机器人对接…');
  else if (st === 'need_verifycode') {
    $('pushWxVerifyWrap')?.classList.remove('hidden');
    wxStatusSet('wait', '微信要求输入验证码');
  } else if (st === 'verify_code_blocked') {
    clearWxDock();
    wxDockQr = '';
    wxDockImgContent = '';
    const img = $('pushWxQr');
    if (img) img.removeAttribute('src');
    setWxQrPlaceholder('二维码已作废');
    wxStatusSet('bad', '验证码连续不对，二维码作废了');
    wxDockShowRetry();
    return;
  } else if (st === 'scaned_but_redirect') {
    wxStatusSet('scaned', '已扫码，正在切换服务器继续对接…');
  } else if (st === 'binded_redirect') {
    /* 官方语义：这个微信之前已经连过本机器人。凭证这次拿不到，只能等上游再给
       confirmed；一直不来的话倒计时到点会引导刷新（换一个二维码再扫）。 */
    wxStatusSet('scaned', '这个微信已对接过机器人，正在同步…');
  } else wxStatusSet('wait', '等待扫码…');
  pollWxDock();
}

function onWxQrExpired() {
  clearWxDock();
  wxDockQr = '';
  wxDockImgContent = '';
  const img = $('pushWxQr');
  if (img) img.removeAttribute('src');
  const area = $('pushQrArea');
  if (area) area.setAttribute('aria-busy', 'false');
  setWxQrPlaceholder('二维码已失效');
  wxStatusSet('bad', '二维码已失效');
  const exp = $('pushWxExpire');
  if (exp) { exp.textContent = '二维码 5 分钟有效，点下面重新获取'; exp.classList.remove('soon'); }
  const wrap = $('pushWxQrWrap');
  if (wrap) wrap.classList.remove('qr-live');
  wxDockShowRetry();
}

/* 对接成功：停轮询、钉一句成功、刷新推送状态。首次扫码仍需对方发一条消息，
   机器人收到后连发成功提示和功能介绍；同一微信号重配则后端已主动连发两条。 */
function onWxDockConfirmed(d) {
  clearWxDock();
  clearPushCodeTimer();
  wxDockConfirmed = true;
  wxDockNeedActivate = !!(d && d.needActivate);
  wxDockForceQr = false;
  wxDockQr = '';
  wxDockImgContent = '';
  wxDockDeadline = 0;
  const qrImg = $('pushWxQr');
  if (qrImg) qrImg.removeAttribute('src');
  const qrArea = $('pushQrArea');
  if (qrArea) qrArea.setAttribute('aria-busy', 'false');
  wxStatusSet('ok', wxDockNeedActivate ? '✅ 已完成，待激活' : '✅ 对接成功');
  const wrap = $('pushWxQrWrap');
  if (wrap) wrap.classList.remove('qr-live');
  const exp = $('pushWxExpire');
  if (exp) { exp.textContent = ''; exp.classList.remove('soon'); }
  $('pushWxVerifyWrap')?.classList.add('hidden');
  $('pushWxRefresh')?.classList.add('hidden');
  $('pushCodeFallback')?.classList.add('hidden');
  $('pushCodeFallback')?.removeAttribute('open');
  toast(wxDockNeedActivate
    ? '已完成对接：给机器人发一条消息，即发送成功提示和介绍'
    : '对接成功');
  refreshPush();
}

/* 4 位对接码（2026-10-17 口径）：不再单独打 POST /my/push/code ——
   POST /my/push/wechat/start 的响应里就带 code / codeExpires（后端同源生成），
   startWxDock 拿到响应直接调本函数填码块；取不到码时走 start 的状态行 + 刷新按钮，
   不再单设一条码的报错路径。
   admin 观看账号后端 code 返回空串，正则不过 → 码块保持 hidden，
   整个对接只走扫码一条路（满足「没有 code 就不显示码块」）。 */
function pushCodeDeadline(expires) {
  const parsed = Date.parse(String(expires || '').replace(' ', 'T'));
  return Number.isFinite(parsed) ? parsed : Date.now() + PUSH_CODE_TTL_MS;
}

function startPushCodeCountdown(deadline) {
  clearPushCodeTimer();
  const render = () => {
    const exp = $('pushCodeExpire');
    if (!exp) { clearPushCodeTimer(); return; }
    const left = Math.max(0, deadline - Date.now());
    if (!left) {
      clearPushCodeTimer();
      exp.textContent = '对接码已失效，请重新获取二维码';
      exp.classList.add('soon');
      $('pushCodeCopy').disabled = true;
      return;
    }
    const sec = Math.ceil(left / 1000);
    exp.textContent = Math.floor(sec / 60) + ' 分 ' + pad2(sec % 60) + ' 秒后失效';
    exp.classList.toggle('soon', sec <= 30);
  };
  render();
  pushCodeTick = setInterval(render, 1000);
}

async function copyPushCode() {
  const code = ($('pushCodeValue')?.textContent || '').trim();
  if (!/^\d{4}$/.test(code)) return;
  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(code);
    } else {
      const fallback = document.createElement('textarea');
      fallback.value = code;
      fallback.setAttribute('readonly', '');
      fallback.style.position = 'fixed';
      fallback.style.opacity = '0';
      document.body.appendChild(fallback);
      fallback.select();
      if (!document.execCommand('copy')) throw new Error('copy failed');
      fallback.remove();
    }
    toast('已复制对接码');
  } catch (_) {
    toast('复制失败，请手动复制');
  }
}

function fillPushCode(d) {
  const box = $('pushCodeFallback');
  if (!box) return;
  clearPushCodeTimer();
  const code = String(d.code || '').trim();
  /* admin 观看账号 / 后端没给码：整块兜底保持 hidden，只走扫码 */
  if (!/^\d{4}$/.test(code)) return;
  box.classList.remove('hidden');
  box.removeAttribute('open');
  $('pushCodeValue').textContent = code;
  $('pushCodeCopy').disabled = false;
  $('pushCodeExpire').textContent = '30 分钟内有效';
  $('pushCodeExpire').classList.remove('soon');
  $('pushCodeError').textContent = '';
  $('pushCodeError').classList.add('hidden');
  startPushCodeCountdown(pushCodeDeadline(d.codeExpires));
}

/* ② 推送开关（2026-10-17 口径：只属于状态 B —— p.bound 时才渲染本段；
   状态 A 的开关置灰与提示文案整段删除，页面极简）。
   bot 支持的全部个人开关：notifyTarget / dailyReport / lineageReport。
   lineageReport 仅 hasDisciples 为真时显示（没有徒弟就完全不出现），保持既有口径。 */
function pushFlagsHtml(p) {
  /* 2026-10-19 用户口径「绑定后显示开关和通知开关等」：完全没扫过码时不出开关；
     扫了码（scanBound，哪怕还差手机确认）就先给出来，让主播提前设好要不要收。 */
  if (!p.bound && !p.scanBound) return '';
  let h = pushSecTitle('推送开关');
  h += '<label class="sw"><input type="checkbox" id="swTarget"' +
    (p.notifyTarget ? ' checked' : '') + (p.admin ? ' disabled' : '') +
    '> 追分提醒（追上 / 还差多少）</label>';
  h += '<label class="sw"><input type="checkbox" id="swDaily"' +
    (p.dailyReport ? ' checked' : '') + '> 每日报告（默认开启）</label>';
  /* 师门日报第三开关（docs/23 §4.3）：仅名下有直系徒弟的人显示（hasDisciples）。
     兼容期后端还没下发 hasDisciples 时按 false 处理 = 不显示，开关自然回退两开盖。 */
  if (p.hasDisciples) {
    h += '<label class="sw"><input type="checkbox" id="swLineage"' +
      (p.lineageReport ? ' checked' : '') + '> 师门日报（徒弟音浪对比）</label>';
  }
  h += '<div class="hint" style="margin-top:10px;line-height:1.7">' +
    '开启后，数据更新后会自动推送到你的微信。</div>';
  /* 管理员观看账号说明：追分开关为什么置灰（追分目标表单在「追分设置」独立卡） */
  if (p.admin) {
    h += '<div class="sub" style="margin-top:10px;line-height:1.7">管理员观看账号没有自己的音浪，' +
      '不能设置追分目标，只能收每日报告。</div>';
  }
  return h;
}

/* 2026-10-15 契约 C 拆段沿革：原 pushBoundHtml → wechatBindHtml（段①「微信对接」）+
   pushFlagsHtml（段②「推送开关」）；2026-10-17 极简口径下段②只随状态 B（p.bound）出现，
   段③追分入口行（chaseEntryHtml）已整段删除。 */

/* 「追分设置」子页内容（2026-10-15 契约 B 口径：分数是分数，追人是追人）：
   拆成「目标分数」「目标人」两块，各自独立上限（GET /my/push 的 counts 字段），
   外加只读可删的「名次目标」。填进 #chaseBox，与「消息设置」卡各管各的。
   2026-10-15 task-7：「渲染 + 绑定」收敛到本函数内完成（末尾 bindChaseHandlers）——
   之前渲染在这里、绑定在 bindPushBox，结果 renderMy 里的一次二次渲染只换壳不绑事件，
   真机上追分按钮全部点不动。 */
function renderChaseBox(p) {
  const box = $('chaseBox');
  if (!box) return;
  /* 顶部状态行：绑定状态决定能不能真的收到提醒，目标本身任何时候都能设 */
  if (!p) { box.innerHTML = chaseErrHtml(); bindChaseRetry(); return; }
  const max = p.maxTargets || 5;
  const list = p.targets || [];
  const counts = p.counts || {};
  /* counts 是契约新增字段；后端没上线时按 targets 里 kind 现算兜底 */
  const cnt = (k) => {
    const v = counts[k];
    return Number.isFinite(Number(v)) ? Number(v) : list.filter((t) => t.kind === k).length;
  };
  let h = '';
  /* 2026-10-15 任务一：未绑定路径只提示、不禁用 —— 后端 POST /my/push/targets
     不校验绑定状态，目标先存着、绑定后提醒自动生效，所以三个目标块的输入框
     照常可编辑（绝不 disabled）。提示口径统一为「未绑定微信也能先设目标」；
     admin 观看账号仍维持禁止口径不动（下面那个 if）。 */
  if (!p.bound) {
    h += !p.channelConfigured
      ? '<div class="hint">微信推送暂未开放（管理员还没连接微信机器人），' +
        '未绑定微信也能先设目标，绑定后提醒自动生效。</div>'
      : p.scanBound
        ? '<div class="hint">微信还在待激活：未绑定微信也能先设目标，绑定后提醒自动生效。</div>'
        : '<div class="hint">未绑定微信也能先设目标，绑定后提醒自动生效；' +
          '也可以先去「消息设置」扫码绑定。</div>';
  }
  if (p.admin) {
    h += '<div class="sub" style="margin-top:6px;line-height:1.7">管理员观看账号没有自己的音浪，' +
      '不能设置追分目标。</div>';
    box.innerHTML = h;
    return;
  }
  const byKind = (k) => list.filter((t) => t.kind === k);
  h += chaseValueBlock(byKind('value'), cnt('value'), max);
  h += chasePersonBlock(byKind('person'), cnt('person'), max);
  h += chaseRankBlock(byKind('rank'), cnt('rank'));
  /* 「微信对接」入口行已撤（2026-10-17 用户口径）：卡间互跳不再交叉放置 ——
     「消息设置」页不放追分入口，「追分设置」卡也不放微信入口，
     两边的入口统一由「我的」列表页两行（myPushRow / myChaseRow）承担。 */
  box.innerHTML = h;
  /* 绑定必须紧跟这次 innerHTML，作为本函数的收尾动作（2026-10-15 task-7）：
     事件只对当前 DOM 节点有效，谁换了 innerHTML 谁就负责重绑。
     本函数是 #chaseBox 内容的唯一写入点，所以绑定放在这里 = 任何渲染路径都自带事件，
     且重复调用不会重复挂监听（innerHTML 换新节点，addEventListener 随旧节点一起消失），
     Enter 不会双提交。admin / 无卡 / 兜底重试三条早退路径在 return 之前，不经过这里。 */
  bindChaseHandlers(p);
}

/* 一行目标（三类共用）：目标文案 + 达成/还差状态 + 单个删除按钮 */
function chaseRowHtml(t) {
  /* 2026-10-12：person 目标 targetValue>0 = 用户设了自定义目标分（后端存的是原始值），
     label 里要把它显出来，不然用户看不出这个目标按什么比 */
  const label = t.kind === 'value' ? '🎯 本月音浪 ' + wan(t.targetValue)
    : t.kind === 'rank' ? '🏅 本月第 ' + t.targetValue + ' 名'
    : (t.targetValue > 0 ? '🏃 ' + esc(t.targetName) + ' · 目标 ' + wan(t.targetValue)
                         : '🏃 ' + esc(t.targetName));
  const state = t.hit ? '<span class="st ok">已达成</span>'
    : t.kind === 'rank'
      ? (t.lastGap > 0 ? '<span class="sub">还差 ' + t.lastGap + ' 名</span>' : '<span class="sub">未进榜</span>')
      : (t.lastGap > 0 ? '<span class="sub">还差 ' + wan(t.lastGap) + '</span>' : '');
  return '<div class="tgt"><span>' + label + '</span>' +
    '<span style="margin-left:auto">' + state + '</span>' +
    '<button class="x" data-del="' + t.id + '">✕</button></div>';
}

/* 目标分数块：输入框（单位万）+ 添加；满额置灰 + 「最多 N 个」 */
function chaseValueBlock(items, used, max) {
  const full = used >= max;
  let h = '<div class="card-t" style="margin:12px 0 2px;font-size:13px">目标分数（最多 ' + max +
    ' 个 · 已设 ' + used + ' 个 · 一律比本月累计）</div>';
  if (!items.length) {
    h += '<div class="sub" style="padding:6px 0">还没设目标分。填一个（单位：万），追上或差多少都会推给你。</div>';
  }
  h += items.map(chaseRowHtml).join('');
  if (full) {
    h += '<div class="hint">目标分数已满 ' + max + ' 个，先删掉一个再加。</div>' +
      '<input id="tkVal" inputmode="decimal" placeholder="本月音浪目标（万）" disabled>' +
      '<button class="go" id="tkValAdd" disabled>最多 ' + max + ' 个</button>';
  } else {
    h += '<input id="tkVal" inputmode="decimal" placeholder="目标分数（万）">' +
      '<button class="go" id="tkValAdd">添加目标分数</button>';
  }
  return h;
}

/* 目标人块：本团主播搜索 + 多选勾选（一次最多 5 个）+ 批量添加；满额置灰 */
function chasePersonBlock(items, used, max) {
  const full = used >= max;
  let h = '<div class="card-t" style="margin:14px 0 2px;font-size:13px">目标人（最多 ' + max +
    ' 个 · 已设 ' + used + ' 个）</div>';
  if (!items.length) {
    h += '<div class="sub" style="padding:6px 0">还没追人。搜本团主播，勾选后一次加进去。</div>';
  }
  h += items.map(chaseRowHtml).join('');
  if (full) {
    h += '<div class="hint">目标人已满 ' + max + ' 个，先删掉一个再加。</div>' +
      '<div class="sr"><input id="tkQ" placeholder="搜本团主播名字" autocomplete="off" disabled>' +
      '<div class="sr-list hidden" id="tkList"></div></div>' +
      '<button class="go" id="tkBatchAdd" disabled>最多 ' + max + ' 个</button>';
    return h;
  }
  /* 剩下的额度：一次最多 5 个，且不能超过这一类剩余名额（后端按 person 计数硬拦） */
  const room = Math.min(5, max - used);
  return h +
    '<div class="sub" style="margin-top:6px">点输入框直接出本团榜单，勾选后一次最多 ' + room + ' 个</div>' +
    '<div class="sr"><input id="tkQ" placeholder="搜本团主播名字" autocomplete="off">' +
    '<div class="sr-list hidden" id="tkList"></div></div>' +
    '<div class="tk-sel" id="tkSel"><span class="sub">还没选人</span></div>' +
    '<div class="hint" id="tkPickedHint"></div>' +
    '<button class="go" id="tkBatchAdd" disabled>批量添加</button>';
}

/* 名次目标块：契约 B —— 只展示 + 可删，**不给新增入口**；没有则整块不渲染 */
function chaseRankBlock(items, used) {
  if (!items.length) return '';
  return '<div class="card-t" style="margin:14px 0 2px;font-size:13px">名次目标（' + used +
    ' 个 · 已停止新增，只可删除）</div>' +
    items.map(chaseRowHtml).join('');
}

/* 追分状态取不到时的兜底内容（照 pushErrHtml 口径，重试按钮独立命名避免撞车） */
function chaseErrHtml() {
  return '<div class="sub" style="margin-top:6px;line-height:1.75">' +
    '追分状态没取到，可能是网络慢。点下面重试。</div>' +
    '<button class="go gray" id="chaseRetry" style="margin-top:10px">重试</button>';
}

/* chase 卡兜底重试：重新拉一次 /my/push，成功就同时刷新追分卡与推送卡 */
function bindChaseRetry() {
  const retry = $('chaseRetry');
  if (!retry) return;
  retry.onclick = async () => {
    retry.disabled = true;
    retry.textContent = '重试中…';
    try {
      renderPushBox(await fetchPush());   // renderPushBox 内部会同步刷 chase 卡
    } catch (e) {
      retry.disabled = false;
      retry.textContent = '重试';
      toast(e.message || '还是没取到');
    }
  };
}

/* 2026-10-15 契约 B：原 pushAddHtml（三 tab：追主播 / 定音浪 / 追名次）整体移除——
   两个添加面板现在分别长在 chaseValueBlock / chasePersonBlock 里，名次不再有新增入口。 */

function bindPushBoundHandlers(p) {
  const swT = $('swTarget'), swD = $('swDaily'), swL = $('swLineage');
  const saveFlags = async () => {
    /* 2026-10-17 口径：追分提醒打开时一个目标都没有 → 不保存、开关不勾上，
       toast 指路后直接跳「追分设置」子页（mySub='chase'，与「我的」列表页同一跳转口径）。
       跳走前先把开关拨回 false：本页重渲染/回看时不会残留一个「假开」的勾。 */
    if (swT && swT.checked && !(p.targets || []).length) {
      swT.checked = false;
      toast('先去设置追分目标');
      mySub = 'chase';
      pushRoute();
      renderMySub();
      return;
    }
    try {
      await fetch('/api/public/teams/' + TEAM + '/my/push/settings', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
        body: JSON.stringify({
          token: myToken(),
          /* 三个开关每次全量带**当前值**（契约 C.2）：后端 my_push_settings 对
             notifyTarget/dailyReport 缺省按 false 落库（整行 UPDATE），只传改动的一个
             会把另外两个覆盖成关；lineageReport 缺省 = 不改动现值，所以更不能漏。
             开关没渲染（例如无徒弟时第三开关不显示）就回落到接口下发的现值，
             保证不会把线上的值静默改掉。 */
          notifyTarget: swT ? !!swT.checked : !!p.notifyTarget,
          dailyReport: swD ? !!swD.checked : !!p.dailyReport,
          lineageReport: swL ? !!swL.checked : !!p.lineageReport,
        }),
      }).then(async (r) => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      });
      toast('已保存');
    } catch (e) {
      toast(e.message || '保存失败');
      refreshPush();
    }
  };
  if (swT) swT.onchange = saveFlags;
  if (swD) swD.onchange = saveFlags;
  if (swL) swL.onchange = saveFlags;

  /* 「重新绑定」（2026-10-20 改名，原「取消绑定」）：confirm 后 POST /my/push/unbind
     → refreshPush 回状态 A。后端只重置推送接线、不注销扫码登录，重新对接不用再扫码。 */
  const unbind = $('pushUnbind');
  if (unbind) {
    unbind.onclick = async () => {
      if (!confirm('重新绑定会先解除当前推送，确定继续吗？')) return;
      unbind.disabled = true;
      try {
        await fetch('/api/public/teams/' + TEAM + '/my/push/unbind', {
          method: 'POST',
          /* 2026-10-17 审计 4-N15：后端 5 个 push 接口 token 收口到 X-My-Token 头，
          这里是唯一漏带头的前端调用点，必须补上（body 里的 token 后端已不读）。 */
          headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
          body: JSON.stringify({ token: myToken() }),
        }).then(async (r) => {
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        });
        toast('已解除当前绑定，请重新对接');
        /* 「本次会话刚对接成功」的标记一并清掉：回状态 A 时不能再显示「✅ 对接成功」 */
        wxDockConfirmed = false;
        wxDockNeedActivate = false;
        wxDockAutoAttempted = false;
        wxDockForceQr = false;
        await refreshPush();
      } catch (e) {
        unbind.disabled = false;
        toast(e.message || '操作失败');
      }
    };
  }
}

/* 「追分设置」卡的事件（2026-10-15 契约 B 重写）：单个删除 + 目标分添加 +
   目标人「搜索 → 多选勾选 → 批量添加」。
   这里只绑事件，DOM 由 renderChaseBox 生成；bindPushBox 每次刷新都会重新调本函数，
   所以不要用 addEventListener（会叠加），统一用 onclick/oninput 覆盖式绑定。 */
function bindChaseHandlers(p) {
  /* 单个删除：三类目标共用（名次目标可删、不可新增） */
  document.querySelectorAll('#chaseBox [data-del]').forEach((b) => {
    b.onclick = async () => {
      try {
        await fetch('/api/public/teams/' + TEAM + '/my/push/targets/delete', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
          body: JSON.stringify({ token: myToken(), id: Number(b.dataset.del) }),
        }).then(async (r) => {
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        });
        toast('已删除');
        await refreshPush();
      } catch (e) {
        toast(e.message || '删除失败');
      }
    };
  });

  /* 2026-10-15 任务二的追分卡「微信对接」入口（chaseWechatGo）已随 2026-10-17
     极简口径整段撤掉：入口统一由「我的」列表页承担。 */

  /* Enter 直提（2026-10-12）：目标分输入框回车 = 点添加 */
  const enterSubmit = (inputId, btnId) => {
    const el = $(inputId), btn = btnId && $(btnId);
    if (el && btn) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
  };
  enterSubmit('tkVal', 'tkValAdd');

  /* ── 目标分数（kind=value）── */
  const valAdd = $('tkValAdd'), valInput = $('tkVal');
  /* 与下面「目标人」同口径（task-8 自查）：判满额看**输入框**是否 disabled，
     不看按钮的 disabled —— 按钮的 disabled 还可能是「提交中…」这类临时态，
     拿它当早退条件就是 task-8 那个真机缺陷的同型写法。
     满额时 chaseValueBlock 把输入框和按钮一起 disabled 并写「最多 N 个」，这里就不绑事件。 */
  if (valAdd && valInput && !valInput.disabled) {
    valAdd.onclick = async () => {
      const v = parseFloat($('tkVal').value);
      if (!(v > 0)) { toast('请输入大于 0 的目标（万）'); return; }
      valAdd.disabled = true;
      valAdd.textContent = '添加中…';
      try {
        await postPush('/my/push/targets', { kind: 'value', valueWan: v });
        toast('已添加');
        await refreshPush();
      } catch (e) {
        valAdd.disabled = false;
        valAdd.textContent = '添加目标分数';
        toast(e.message || '添加失败');
      }
    };
  }

  /* ── 目标人（kind=person）：多选勾选 + 批量添加 ── */
  const q = $('tkQ'), listEl = $('tkList'), batchBtn = $('tkBatchAdd');
  /* 只有「满额」才早退：满额时输入框和按钮一起 disabled、按钮文案是「最多 N 个」。
     ⚠️ 2026-10-15 task-8 真机缺陷：这里原来多了个 `batchBtn.disabled` 条件，可
     #tkBatchAdd 渲染出来**默认就是 disabled**（语义 =「还没选人」，由下面末尾的
     renderSel() 在选中后放开）——于是首次绑定直接 return，q.oninput / batchBtn.onclick /
     renderSel() 全都没执行：真机上搜索不出候选、选不了人、批量添加永远点不动。
     判满额只看输入框（q.disabled），「未选人」交给 renderSel() 管。 */
  if (!q || !listEl || !batchBtn || q.disabled) return;
  const max = (p && p.maxTargets) || 5;
  const listAll = (p && p.targets) || [];
  const counts = (p && p.counts) || {};
  const personUsed = Number.isFinite(Number(counts.person))
    ? Number(counts.person)
    : listAll.filter((t) => t.kind === 'person').length;
  /* 一次最多 5 个，且不超过「追人」这一类的剩余额度（后端按 person 计数硬拦） */
  const canPick = Math.max(0, Math.min(5, max - personUsed));
  const sel = chasePicked;   // 模块级暂存：刷新重渲染后勾选不丢（值 = {name, wave}）
  let lastItems = [];        // 最近一次搜索结果：重渲染候选行时复用，避免再打请求
  let lastKey = null;        // lastItems 对应的关键词（null = 本次绑定还没查过）：focus 复用判断用
  let tkReqId = 0;           // 搜索请求序号：只认最后一次请求的响应，防慢响应覆盖新结果

  const renderSel = () => {
    const selBox = $('tkSel');
    if (selBox) {
      /* chip 文案「名字 · 本月音浪」（2026-10-17）：wave 从勾选时缓存的 {name, wave} 取，
         拿不到（wave==null）就只显示名字；wave=0 是「本月没数据」，正常显示 wan(0)='0'。
         值全走 esc()/Number，Map 值是内部缓存、但转 HTML 前仍照 innerHTML 口径过一遍。 */
      selBox.innerHTML = sel.size
        ? Array.from(sel.entries()).map(([id, it]) => {
            const name = (it && it.name) || String(id);
            const w = (it && Number.isFinite(Number(it.wave))) ? Number(it.wave) : null;
            return '<span class="chip" data-unpick="' + Number(id) + '">' +
              esc(name) + (w == null ? '' : ' · ' + esc(wan(w))) + ' ✕</span>';
          }).join('')
        : '<span class="sub">还没选人</span>';
      /* 点 chip 撤销该人：下拉开着才重渲候选行（checkbox 勾选态要跟着解除）；
         若这次点击刚把下拉点收起（chip 在 .sr 外），就不强行弹回 */
      selBox.querySelectorAll('[data-unpick]').forEach((el) => {
        el.onclick = () => {
          sel.delete(Number(el.dataset.unpick));
          if (!listEl.classList.contains('hidden')) renderList();
          renderSel();
        };
      });
    }
    const hint = $('tkPickedHint');
    if (hint) hint.textContent = sel.size
      ? '已选 ' + sel.size + ' 个，还能再选 ' + Math.max(0, canPick - sel.size) + ' 个'
      : '';
    batchBtn.disabled = sel.size === 0;
    batchBtn.textContent = sel.size ? '批量添加（' + sel.size + ' 个）' : '批量添加';
  };

  const renderList = () => {
    if (!lastItems.length) { listEl.classList.add('hidden'); listEl.innerHTML = ''; return; }
    /* 行结构（2026-10-17）：checkbox + 名字（左）+ 本月音浪（右，wan() 格式化）。
       wave==0 = 本月没数据 → 显示灰字「本月未播」。所有插值过 esc()/Number。 */
    listEl.innerHTML = lastItems.map((a) => {
      const id = Number(a.personId);
      const on = sel.has(id);
      const w = Number(a.wave);
      const waveHtml = w > 0
        ? '<span class="tk-wave">' + esc(wan(w)) + '</span>'
        : '<span class="tk-wave off">本月未播</span>';
      return '<div class="tk-opt" data-pid="' + id + '">' +
        '<input type="checkbox"' + (on ? ' checked' : '') +
        (!on && sel.size >= canPick ? ' disabled' : '') + '>' +
        '<span style="flex:1;min-width:0">' + esc(a.name) + '</span>' + waveHtml + '</div>';
    }).join('');
    listEl.classList.remove('hidden');
    listEl.querySelectorAll('.tk-opt').forEach((row) => {
      const id = Number(row.dataset.pid);
      const cb = row.querySelector('input');
      row.onclick = () => {
        if (sel.has(id)) {
          sel.delete(id);
        } else {
          /* 已选满（一次 5 个或本类剩余额度）→ 拒绝勾选并提示 */
          if (sel.size >= canPick) {
            toast(canPick <= 0 ? '追人目标已满 ' + max + ' 个'
              : '一次最多选 ' + canPick + ' 个（追人目标上限 ' + max + ' 个）');
            return;
          }
          const hit = lastItems.find((a) => Number(a.personId) === id) || {};
          /* wave 一并缓存进 {name, wave}：chip 与后续重渲染都有本月音浪可显 */
          sel.set(id, {
            name: hit.name || String(id),
            wave: Number.isFinite(Number(hit.wave)) ? Number(hit.wave) : null,
          });
        }
        renderList(); renderSel();
      };
      /* checkbox 自身的 click 会再冒泡到 row.onclick 造成「勾一下又取消」：
         stopPropagation 后手动调一次行点击，保证只切换一次 */
      if (cb) cb.onclick = (e) => { e.stopPropagation(); row.onclick(); };
    });
  };

  /* 统一入口：按当前关键词查一次（关键词可空 = 默认候选/本团榜单）。
     请求期间下拉先渲染「搜索中…」占位；慢响应旧序号直接丢弃（tkReqId 只认最后一次）。
     lastKey/lastItems 只在响应被采纳时更新，focus 的复用判断才有依据。 */
  const closeList = () => { listEl.classList.add('hidden'); listEl.innerHTML = ''; };
  /* 用户已经点了其它区域把下拉收起（列表隐藏 + 输入框也不在焦点上）→
     后到的搜索响应 / 排队中的防抖不再把下拉弹回去，直接作废 */
  const dismissed = () =>
    listEl.classList.contains('hidden') && document.activeElement !== q;
  const tkSearch = async () => {
    clearTimeout(pushChaseSrTimer);
    if (dismissed()) { tkReqId++; return; }   // 作废在途旧请求，防止它们稍后回写
    const key = q.value.trim();
    const myReq = ++tkReqId;
    listEl.innerHTML = '<div class="none">搜索中…</div>';
    listEl.classList.remove('hidden');
    try {
      const d = await api('/api/public/teams/' + TEAM + '/my/push/search?q=' +
        encodeURIComponent(key));
      if (myReq !== tkReqId || dismissed()) return;   // 更新请求已在途 / 用户已收起 → 作废
      lastItems = (d && d.items) || [];
      lastKey = key;
      if (!lastItems.length) {
        listEl.innerHTML = '<div class="none">' +
          (key ? '本团没搜到这个人' : '本团暂时没有候选（本月还没人产生音浪）') + '</div>';
        listEl.classList.remove('hidden');
        return;
      }
      renderList();
    } catch (e) {
      if (myReq !== tkReqId || dismissed()) return;
      listEl.innerHTML = '<div class="none">' + esc(e.message || '搜索失败') + '</div>';
      listEl.classList.remove('hidden');
    }
  };

  /* 点输入框立即出下拉（2026-10-17）：空关键词 = 默认候选（后端按本月音浪降序给 50 条）。
     lastItems 已有且关键词没变 → 复用缓存直接重渲染，不重发请求；否则立即查一次。 */
  q.onfocus = () => {
    const key = q.value.trim();
    if (lastKey === key && lastItems.length) { renderList(); return; }
    tkSearch();
  };

  /* oninput 走 220ms 防抖；focus 那次立即查，不受防抖影响 */
  q.oninput = () => {
    clearTimeout(pushChaseSrTimer);
    pushChaseSrTimer = setTimeout(tkSearch, 220);
  };

  /* 下拉关闭逻辑（2026-10-17，方案一：document 级 mousedown + window 守卫）：
     点页面其它区域关闭下拉；勾选/搜索/选人不关（点击发生在 .sr 内部，直接放行）。
     bindChaseHandlers 每次 renderChaseBox 都会重新执行，用 window.__tkOutsideBound
     守卫保证 document 监听只挂一次（否则每次重渲染都叠一个监听）。
     监听闭包里不引用本次绑定的 listEl —— 每次现查 #tkList：chase 卡重渲染后
     旧节点已被 innerHTML 换掉，守卫过的监听必须永远操作最新的下拉节点。 */
  if (!window.__tkOutsideBound) {
    window.__tkOutsideBound = true;
    document.addEventListener('mousedown', (e) => {
      if (e.target.closest && e.target.closest('.sr')) return;  // 下拉内部点击不关
      const el = document.getElementById('tkList');
      if (el && !el.classList.contains('hidden')) {
        el.classList.add('hidden');
        el.innerHTML = '';
      }
    });
  }

  batchBtn.onclick = async () => {
    if (!sel.size) return;
    const ids = Array.from(sel.keys());
    batchBtn.disabled = true;
    batchBtn.textContent = '添加中…';
    try {
      const d = await postPush('/my/push/targets/batch', { personIds: ids });
      const added = d.added == null ? ids.length : d.added;
      const skipped = d.skipped || 0;
      toast('已添加 ' + added + ' 个' + (skipped ? '，跳过 ' + skipped + ' 个已有的' : ''));
      sel.clear();
      lastItems = [];
      lastKey = null;          // 下拉缓存随关键词一起作废（refreshPush 重渲染后会重新查）
      q.value = '';
      closeList();             // 批量添加完成收尾：下拉关掉，等 refreshPush 重渲染整卡
      await refreshPush();
    } catch (e) {
      batchBtn.disabled = false;
      batchBtn.textContent = '批量添加';
      toast(e.message || '添加失败');
    }
  };
  renderSel();
}

/* 旧「获取绑定码」独立按钮已撤（2026-10-16 第二轮）；2026-10-17 起对接码也
   不再单独打 POST /my/push/code —— 直接用 /my/push/wechat/start 响应里的
   code / codeExpires（fillPushCode 填块）。 */

/** 推送设置的写接口（统一带 token 与错误处理）。
    身份同时给 body.token（既有后端一律读 body）与 X-My-Token 头（契约里
    targets/batch 等新路由指定走头）：两条路都留，少一条就会 401。 */
async function postPush(path, extra) {
  /* 2026-10-17 修正：/wechat/start 与 /wechat/poll 在后端注册在 /my/push/wechat/*
     下，前端拼接漏了 /my/push 段，报「接口不存在：/api/public/teams/all/wechat/start」。
     这里按契约补全；其余 path 本来就带 /my/push 前缀，不受影响。 */
  const prefix = path.startsWith('/my/push') ? '' : '/my/push';
  const r = await fetch('/api/public/teams/' + TEAM + prefix + path, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, myTokenHeaders()),
    body: JSON.stringify(Object.assign({ token: myToken() }, extra)),
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) {
    sessionExpired();
    const e = new Error('请先登录');
    e.status = 401;
    throw e;
  }
  if (!r.ok) {
    const e = new Error(d.error || ('HTTP ' + r.status));
    e.status = r.status;
    throw e;
  }
  return d;
}

function bindPushBox(p) {
  /* 2026-10-19 用户口径：进入子页自动取二维码 + 对接码；事件绑定统一在下方
     bindPushQrShow()（离渲染近、注释同源）。autoStartWxDock 自身有 starting /
     有效二维码 / scanBound 三重保护，重复渲染不会重复打 start。 */
  // scanBound 旧态（扫了码还没等微信确认）：留在状态 A 显示「等微信确认」，
  // 但保留 5 秒自动刷新让状态回流（后端确认后 bound=true，这里一刷就进状态 B）。
  if (p && (p.needActivate || p.scanBound) && !wxDockForceQr) {
    clearTimeout(pushSrTimer);
    pushSrTimer = setTimeout(() => {
      /* 用户已点「重新获取二维码」时，后续状态由 start/poll 自己推进。
         此时再整卡刷新会清掉刚建立的轮询并把二维码重新藏回中间态。 */
      if (!wxDockForceQr) refreshPush();
    }, 5000);
  }
  /* 二维码区的刷新 / 验证码 / 对接码事件绑定 */
  bindPushQrShow();
  if (p && p.bound) bindPushBoundHandlers(p);
  /* 「追分设置」独立卡（2026-10-13）：内容渲染 + 事件都跟着推送状态走，
     每次推送卡刷新（renderPushBox → 这里）都同步刷一遍 chase 卡。
     chase 卡不存在（首页藏着也存在于 DOM）时 renderChaseBox 自己会跳过。
     2026-10-15 task-7：绑定已在 renderChaseBox 末尾完成（渲染即绑定），这里**不要再调**
     bindChaseHandlers —— 那会在没换 innerHTML 的情况下把事件挂第二遍（enterSubmit 的
     addEventListener 会让 Enter 双提交）。 */
  renderChaseBox(p);
  /* 数据渲染完成后再判断 #myPushCard 是否可见：初始 renderMy 时子页还没切出来，
     用 microtask 等 renderMySub 设置完 hidden 再自动取码；重试路径也能复用。 */
  queueMicrotask(() => autoStartWxDock(p));
}


/* ==================== 视图切换 ==================== */
/* 顶部导航 sticky 后，工具条吸顶位置要跟头部实际高度走（分组页多一条子导航）。
   2026-10-17 口径：公告行 #mhAnn 在 masthead **内部**，随头部一起吸顶、高度天然计入
   .masthead 的 offsetHeight，量到的就是真实值，不需要（也不能）单独排除；
   原来竖排在 masthead 与 toolbar 之间的 #annItems / #home-ann 已取消渲染，不存在
   「吸顶下方留空隙」的问题了。renderAnnounceItems 每次渲染完仍调一次本函数，
   保证公告行显隐导致头部高度变化时 --mh-h 同步。 */
function syncHeaderOffset() {
  const h = document.querySelector('.masthead')?.offsetHeight || 0;
  if (h) document.documentElement.style.setProperty('--mh-h', h + 'px');
}
window.addEventListener('resize', syncHeaderOffset);

/* 底栏选中态（2026-10-15 task-11）：底栏「微信对接」与「我的」共用 view='my'，
   靠 mySub 区分 —— 停在 /my/wechat 子页时高亮「微信对接」，其余情况高亮 view 对应项。
   子页切换（点「我的」列表行 / popstate 只重渲染子页、不走 switchView）也要调本函数。 */
function syncNavActive() {
  const key = (view === 'my' && mySub === 'wechat') ? 'wechat' : view;
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === key));
  navDropMove();     // 2026-10-19：选中态变了 → 液态水滴滑到新位置
}

/* ==================== 底部「液态水滴 + 边缘色散」Dock（2026-10-19 第四轮） ====================
   设计源：Stitch 项目 9879920671738170074 / 屏幕 2f32c73c9eb745c99ad617e812c6189f
   （「主播数据榜-水滴仅边缘色散质感导航栏」，本地落盘
   .stitch/designs/stitch_droplet_nav/code.html 的 #liquid-water-droplet 体系）。

   结构（与设计稿同构）：
     · #navWallL/#navWallR —— 左右内壁碰撞色散霓虹层（拖到两端 <18px 才淡入）
     · #navDrop           —— 一格宽水滴宿主（top/bottom:5px、left:6px；transform 跟手）
     · #navDropRing       —— 1.5px 空心 conic 彩虹环（mask-composite 挖空内部：
                             色散/薄膜干涉只允许出现在最外沿轮廓线上）
     · #navDropBody       —— 白 .72 + blur(16px) saturate(140%) 通透水体，内部零彩光
   交互：普通点击立即切路由；按住横移即可拖拽，松手磁吸最近格（340ms 弹性回弹）
   并立即切路由。水滴按速度拉伸/压扁/skew；外沿增强色散只在长按拖拽的
   水滴碰撞带遇到其它 tab 图标包围盒时增强。跨格时图标 focused（琥珀）/edge
   （slate-700）两态，不再把原选中项压暗（旧 .is-dim/.is-covered 已删除）。
   ⚠️ 隐藏按钮宽度 0，只取可见按钮（navVisibleTabs）参与定位。
   ⚠️ 旧体系（#navPill 琥珀胶囊 + #navLens 1.5 格大光晕 + .is-dim/.is-covered）
      就是「拖动时和设计图不一致」的直接原因：内部琥珀渐变、大面积外发光、原选中项
      被压到 35% 透明 —— 设计稿要求的是「清澈水滴 + 仅边缘色散 + 焦点图标琥珀」。 */

/** 当前可见的底栏格子（后台关掉的视图按钮 offsetParent 为空，宽度 0 不参与定位） */
function navVisibleTabs() {
  return [...document.querySelectorAll('#navRow button[data-v]')]
    .filter(b => b.offsetParent !== null);
}

/** 水滴基础宽度 = 一格宽；字体/视口/可见项数量变化后都要重新量 */
let navDropW = 86;
/** 水滴当前 translateX（相对 dock 左边界；CSS left:6 + translateX = 实际左沿） */
let navDropX = 0;
/** 是否正在拖拽：拖拽期间 resize/syncNavActive 不能把水滴拉回选中格（见 navDropMove） */
let navDropDragging = false;
function navDropGeometry() {
  const drop = $('navDrop');
  const tabs = navVisibleTabs();
  if (!drop) return false;
  if (!tabs.length) { drop.style.width = '0px'; return false; }
  navDropW = Math.round(tabs[0].getBoundingClientRect().width);
  drop.style.width = navDropW + 'px';
  return true;
}

/** 第 idx 个可见格 → 水滴 translateX（设计稿同口径：按钮左 - dock 左 - 6） */
function navDropXOf(idx) {
  const dock = $('navRow'), tabs = navVisibleTabs();
  if (!dock || !tabs.length) return 0;
  const i = Math.max(0, Math.min(tabs.length - 1, idx));
  const dr = dock.getBoundingClientRect(), tr = tabs[i].getBoundingClientRect();
  return tr.left - dr.left - 6;
}

/** 水滴当前中心（dock 坐标）：left:6px + translateX + 半格宽 */
function navDropCenter() {
  return 6 + navDropX + navDropW / 2;
}

/** 只设置最外沿 rim 的强度；k=0 完全隐藏，k>0 只由图标真实碰撞产生。 */
function navDropSetRim(k) {
  const ring = $('navDropRing'), dock = $('navRow');
  k = Math.max(0, Math.min(1, Number(k) || 0));
  /* Stitch 1:1：静止时最外沿已有 1.5px 薄膜干涉 rim（.35）；图标碰撞只增强
     同一圈外沿的亮度/外发光，绝不向水体内部染色。 */
  if (ring) {
    ring.style.opacity = (.35 + k * .55).toFixed(2);
    ring.style.boxShadow = k > .02
      ? '0 0 ' + (6 + k * 4).toFixed(1) + 'px rgba(0,199,190,.42), 0 0 2px rgba(255,59,48,.62)'
      : '0 0 6px rgba(0,199,190,.35), 0 0 2px rgba(255,59,48,.4)';
  }
  if (dock) dock.dataset.navCollision = k > .02 ? '1' : '0';
}

/** 拖拽几何缓存：一次手势只量一次，pointermove 不再反复 getBoundingClientRect。 */
function navDropDragGeometry() {
  const dock = $('navRow'), drop = $('navDrop');
  if (!dock || !drop) return null;
  const dr = dock.getBoundingClientRect();
  const tabs = navVisibleTabs();
  const originIndex = navIndexRefresh();
  return {
    dockLeft: dr.left,
    dockWidth: dr.width,
    dockHeight: dr.height,
    dropHeight: drop.getBoundingClientRect().height || Math.max(1, dr.height - 10),
    originIndex: originIndex,
    tabCenters: tabs.map((tab) => {
      const r = tab.getBoundingClientRect();
      return (r.left - dr.left) + r.width / 2;
    }),
    icons: tabs.map((tab, index) => {
      const el = tab.querySelector('.ic') || tab;
      const r = el.getBoundingClientRect();
      return {
        index: index,
        left: r.left - dr.left,
        right: r.right - dr.left,
        top: r.top - dr.top,
        bottom: r.bottom - dr.top,
      };
    }),
  };
}

/** 水滴外沿 band 与其它 tab 图标的真实包围盒是否相交。
    只在长按后的水平拖拽里调用；速度、贴内壁、未碰撞的邻近都不参与。
    椭圆归一化后：rMin/rMax 是图标矩形离水滴中心最近/最远的 normalized radius。
    图标矩形穿过 [内侧安全区, 外沿] 这条窄带才算碰撞。 */
function navDropIconCollision(geom, targetX, scaleX, scaleY) {
  if (!geom || !geom.icons || !geom.icons.length) return 0;
  const halfW = Math.max(1, navDropW * scaleX / 2);
  const halfH = Math.max(1, geom.dropHeight * scaleY / 2);
  const cx = 6 + targetX + navDropW / 2;
  const cy = 5 + geom.dropHeight / 2;
  const bandPx = Math.max(8, Math.min(14, Math.min(halfW, halfH) * .24));
  const inner = Math.max(.66, 1 - bandPx / Math.min(halfW, halfH));
  let hit = 0;
  for (let i = 0; i < geom.icons.length; i++) {
    const r = geom.icons[i];
    if (i === geom.originIndex) continue;      // 起点那一格是水滴原本所在格，不算「其他图标」
    const dxNear = cx < r.left ? r.left - cx : (cx > r.right ? cx - r.right : 0);
    const dyNear = cy < r.top ? r.top - cy : (cy > r.bottom ? cy - r.bottom : 0);
    const rMin = Math.hypot(dxNear / halfW, dyNear / halfH);
    if (rMin > 1.06) continue;
    const dxFar = Math.max(Math.abs(r.left - cx), Math.abs(r.right - cx));
    const dyFar = Math.max(Math.abs(r.top - cy), Math.abs(r.bottom - cy));
    const rMax = Math.hypot(dxFar / halfW, dyFar / halfH);
    if (rMax < inner) continue;
    const outerContact = Math.max(0, Math.min(1, (1.06 - rMin) / .16));
    const innerContact = Math.max(0, Math.min(1, (rMax - inner) / Math.max(.01, 1 - inner)));
    hit = Math.max(hit, Math.min(outerContact, innerContact));
  }
  return hit;
}

/** 内壁色散层复位（平时完全透明；2026-10-19 第五轮起不再由贴壁触发） */
function navDropHideWalls() {
  const l = $('navWallL'), r = $('navWallR');
  if (l) { l.style.opacity = '0'; l.style.transform = 'scale(1)'; }
  if (r) { r.style.opacity = '0'; r.style.transform = 'scale(1)'; }
}

/** 水滴形态复位：圆角/缩放/色散环/内壁霓虹（place 与 snap 结束共用） */
function navDropResetMorph() {
  const body = $('navDropBody'), ring = $('navDropRing');
  if (body) { body.style.borderRadius = '9999px'; body.style.transform = 'scale(1, 1)'; }
  if (ring) {
    ring.style.borderRadius = '9999px';
    ring.style.transform = 'scale(1, 1)';
  }
  navDropSetRim(0);
  navDropHideWalls();
}

/** 顶层图标态（设计稿 applyDropletMorphAndDispersion 末段同口径）：
    水滴中心距格中心 ≤ 0.45 半格 → focused（琥珀加粗放大）
    ≤ 1.05 半格 → edge（slate-700 微放大），其余回默认 slate-600。
    拖拽中 dock 会挂 .is-droplet-dragging，CSS 里让 .on 不再常量高亮
    （否则被水滴甩开的老选中项还是琥珀，正是旧实现视觉不对的另一半原因）。 */
function navDropPaintTabs(geom) {
  const dock = $('navRow');
  if (!dock) return;
  const center = navDropCenter();
  const half = navDropW / 2;
  let centers;
  if (geom && geom.tabCenters) centers = geom.tabCenters;
  else {
    const dr = dock.getBoundingClientRect();
    centers = navVisibleTabs().map((tab) => {
      const tr = tab.getBoundingClientRect();
      return (tr.left - dr.left) + tr.width / 2;
    });
  }
  navVisibleTabs().forEach((tab, i) => {
    const dist = Math.abs(center - (centers[i] || 0));
    tab.classList.remove('is-droplet-focused', 'is-droplet-edge');
    if (dist <= half * .45) tab.classList.add('is-droplet-focused');
    else if (dist <= half * 1.05) tab.classList.add('is-droplet-edge');
  });
}

/** 水滴位置/形态动画的定时器（place 的 idle 复位 + 松手后的 snap 收尾） */
const navDropTimers = { idle: 0, snap: 0 };

/** 把水滴放到第 index 个可见格（animate=true 走弹性吸附过渡，false 立即落位） */
function navDropPlace(index, animate) {
  const drop = $('navDrop');
  if (!drop || !navDropGeometry()) return;
  const tabs = navVisibleTabs();
  const i = Math.max(0, Math.min(tabs.length - 1, index));
  navDropX = navDropXOf(i);
  drop.classList.remove('is-dragging');
  drop.classList.toggle('is-snapping', animate === true);
  navDropResetMorph();
  drop.style.transform = 'translateX(' + navDropX + 'px)';
  navDropPaintTabs();
  clearTimeout(navDropTimers.idle);
  navDropTimers.idle = setTimeout(() => {
    drop.classList.remove('is-snapping');
    drop.classList.add('is-idle');
  }, animate === true ? 480 : 60);
}

/** 按当前选中态（.on）定位水滴 —— syncNavActive / resize / 渲染后都会调它。
    拖拽中必须跳过：resize（含截图工具/横竖屏变化）或页面重渲染若把水滴拉回
    老选中格，松手时的「最近格」就会算错，直接导致拖到 B 却切回 A。 */
function navDropMove(instant) {
  if (navDropDragging) return;
  navCurIdx = navIndexRefresh();
  navDropPlace(navCurIdx, instant !== true);
}

/** 当前选中项在可见按钮里的序号（拖拽落位用） */
let navCurIdx = 0;

function navIndexRefresh() {
  const tabs = navVisibleTabs();
  const on = tabs.findIndex(b => b.classList.contains('on'));
  navCurIdx = on < 0 ? 0 : on;
  return navCurIdx;
}

/** pointer 手势结束后短暂吞掉浏览器补发的原生 click。
    短按由 onUp 直接切页；长按拖拽由 finishSnap 直接切页；被判定为滑扫的手势
    也必须吞掉 click。键盘/脚本直接触发的 click 不经过这里，仍可正常切页。 */
let navClickSuppressUntil = 0;

/** 底栏按钮的唯一激活函数：点击、键盘与长按拖拽共用同一网关。 */
function activateNavButton(btn) {
  if (!btn || !btn.dataset || btn.disabled) return;
  /* 「我的」是列表首页入口：先清掉上次停留的子页（与旧 bootRest 行为一致）。 */
  if (btn.dataset.v === 'my') mySub = null;
  switchView(btn.dataset.v);
}

/** 底栏手势初始化（对齐设计稿 initLiquidWaterDropletDock 的物理参数）
    · 短按点击 → 立即切页，只给克制 tap 反馈（不再出现整格大红）
    · 按住后只要产生横向位移就进入拖拽，不要求先等 150ms；速度只控形变
    · 长按 150ms 后继续拖动时，色散才由水滴边缘带碰到其它图标包围盒增强
    · 松手 → 立即切路由/发请求；340ms 只保留水滴磁吸回弹视觉 */
function initNavDock() {
  const dock = $('navRow'), drop = $('navDrop'), body = $('navDropBody'), ring = $('navDropRing');
  if (!dock || !drop) return;
  let pressed = false, longReady = false, dragMode = false, gestureRejected = false;
  let pressT = 0, startX = 0, startY = 0, lastX = 0, lastTime = 0, velocity = 0;
  let longPressTimer = null, velocityTimer = null, moveRaf = 0, pendingX = 0;
  let pressBtn = null, dragGeom = null, activePointerId = null;

  const vibrate = (ms) => { try { if ('vibrate' in navigator) navigator.vibrate(ms); } catch (e) {} };
  const reducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /** 仅 tap 成功后出现的小反馈：图标附近一个 30px 暖色淡环 + 水滴无色回弹。
      长按/拖拽不生成；合成 click 也不生成，因此不会出现旧版整格大红或重复动画。 */
  function showTapFeedback(btn) {
    if (!btn) return;
    const icon = btn.querySelector('.ic') || btn;
    icon.querySelectorAll('.tab-tap-feedback').forEach((n) => n.remove());
    const r = document.createElement('span');
    r.className = 'tab-tap-feedback';
    icon.appendChild(r);
    requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add('on')));
    setTimeout(() => r.remove(), 240);
    if (reducedMotion()) return;
    if (body && body.animate) {
      try {
        body.animate([
          { transform: 'scale(1, 1)' },
          { transform: 'scale(.97, 1.03)' },
          { transform: 'scale(1, 1)' },
        ], { duration: 200, easing: 'ease-out' });
        return;
      } catch (e) { /* 老浏览器走下面的 CSS class 兜底 */ }
    }
    drop.classList.remove('is-tap-ack');
    requestAnimationFrame(() => {
      drop.classList.add('is-tap-ack');
      setTimeout(() => drop.classList.remove('is-tap-ack'), 220);
    });
  }

  function clearPressTimers() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (velocityTimer) { clearTimeout(velocityTimer); velocityTimer = null; }
    if (moveRaf) { cancelAnimationFrame(moveRaf); moveRaf = 0; }
    pendingX = 0;
  }

  function resetPress() {
    pressed = false; longReady = false; dragMode = false; gestureRejected = false;
    pressBtn = null; dragGeom = null; navDropDragging = false;
    clearPressTimers();
    dock.classList.remove('is-droplet-dragging');
  }

  /** 340ms 只是水滴磁吸视觉；路由在 pointerup 时已经立刻提交，不在这里等待。 */
  function settleSnap() {
    if (navDropTimers.snap) { clearTimeout(navDropTimers.snap); navDropTimers.snap = 0; }
    navDropResetMorph();
    drop.classList.remove('is-dragging', 'is-snapping');
    drop.classList.add('is-idle');
    resetPress();
    navDropMove(true);
  }

  function cancelGesture() {
    navDropResetMorph();
    drop.classList.remove('is-dragging', 'is-snapping');
    drop.classList.add('is-idle');
    resetPress();
    navDropMove(true);
  }

  /** 拖拽跟手 + 速度形变。色散环强度只由 navDropIconCollision() 的图标碰撞决定；
      速度只控制拉伸/压扁，贴左右内壁不再触发任何霓虹。 */
  function applyMorph(targetX, dockWidth, geom) {
    const v = Math.max(-2.5, Math.min(2.5, velocity));
    const absV = Math.abs(v);
    const dir = v >= 0 ? 1 : -1;
    const stretchX = 1 + Math.min(.42, absV * .22);
    const squashY = Math.max(.82, 1 - absV * .12);
    let br = '9999px';
    if (absV > .08) {
      br = dir > 0
        ? '35% 65% 62% 38% / 44% 56% 56% 44%'
        : '65% 35% 38% 62% / 56% 44% 44% 56%';
    }
    const tf = 'scale(' + stretchX.toFixed(3) + ', ' + squashY.toFixed(3) + ')' +
      ' skewX(' + (dir * Math.min(8, absV * 4)).toFixed(1) + 'deg)';
    if (body) { body.style.borderRadius = br; body.style.transform = tf; }
    if (ring) {
      ring.style.borderRadius = br;
      ring.style.transform = tf;
    }
    navDropSetRim(navDropIconCollision(geom, targetX, stretchX, squashY));
    navDropPaintTabs(geom);
  }

  /** pointermove 合并到一帧，避免长按拖拽时每个原始事件都同步写样式。 */
  function updateDrop(clientX) {
    if (!dragGeom) return;
    const minX = 4, maxX = Math.max(minX, dragGeom.dockWidth - navDropW - 4);
    navDropX = Math.max(minX, Math.min(maxX, (clientX - dragGeom.dockLeft) - navDropW / 2));
    drop.style.transform = 'translateX(' + navDropX.toFixed(1) + 'px)';
    applyMorph(navDropX, dragGeom.dockWidth, dragGeom);
  }

  function scheduleDrop(clientX) {
    pendingX = clientX;
    if (moveRaf) return;
    moveRaf = requestAnimationFrame(() => {
      moveRaf = 0;
      updateDrop(pendingX);
    });
  }

  function decayVelocity() {
    if (velocityTimer) clearTimeout(velocityTimer);
    velocityTimer = setTimeout(() => {
      velocityTimer = null;
      if (!dragMode || !dragGeom) return;
      velocity *= .45;
      if (Math.abs(velocity) < .015) velocity = 0;
      applyMorph(navDropX, dragGeom.dockWidth, dragGeom);
      if (velocity !== 0) decayVelocity();
    }, 70);
  }

  /** 进入跟手态必须同时满足：已长按 + 确实发生了横向移动。 */
  function enterDrag(clientX) {
    if (dragMode) return;
    dragMode = true;
    clearTimeout(navDropTimers.idle);
    navDropDragging = true;
    dragGeom = navDropDragGeometry();
    drop.classList.remove('is-idle', 'is-snapping');
    drop.classList.add('is-dragging');
    dock.classList.add('is-droplet-dragging');
    navDropHideWalls();
    navDropSetRim(0);
    vibrate(12);
    updateDrop(clientX);
  }

  /** 激活某格：直接走 activateNavButton → switchView，不再合成 click。 */
  function activate(idx) {
    activateNavButton(navVisibleTabs()[idx]);
  }

  /** 松手：先立即激活目标页，再让 340ms 磁吸动画自己收尾。
      之前是先等完 340ms 才 activate，实测每次切换都固定慢 344-366ms。 */
  function finishSnap() {
    clearPressTimers();   // 取消松手瞬间尚未落地的 rAF/速度计时，避免覆盖磁吸形态
    if (!dragGeom) dragGeom = navDropDragGeometry();
    if (!dragGeom) { cancelGesture(); return; }
    const center = navDropX + 6 + navDropW / 2;
    let best = 0, min = Infinity;
    dragGeom.tabCenters.forEach((tc, i) => {
      const d = Math.abs(center - tc);
      if (d < min) { min = d; best = i; }
    });
    const snapX = navDropXOf(best);
    navDropX = snapX;
    drop.classList.remove('is-dragging');
    drop.classList.add('is-snapping');
    drop.style.transform = 'translateX(' + snapX + 'px)';
    const jelly = '58% 58% 54% 54% / 52% 52% 48% 48%';
    if (body) { body.style.borderRadius = jelly; body.style.transform = 'scale(.92, 1.08)'; }
    if (ring) {
      ring.style.borderRadius = jelly;
      ring.style.transform = 'scale(.92, 1.08)';
    }
    navDropSetRim(0);
    navDropHideWalls();
    vibrate(15);

    const current = navVisibleTabs().findIndex(b => b.classList.contains('on'));
    if (best !== current) activate(best);     // 立即切路由/发请求；不等 340ms 视觉动画
    if (navDropTimers.snap) clearTimeout(navDropTimers.snap);
    navDropTimers.snap = setTimeout(settleSnap, 340);
  }

  function onDown(e) {
    if (e.button != null && e.button !== 0) return;
    if (activePointerId != null) return;
    if (window.PointerEvent && e.pointerId != null) {
      activePointerId = e.pointerId;
      try { dock.setPointerCapture(e.pointerId); } catch (_) {}
    }
    if (navDropTimers.snap) settleSnap();
    pressed = true; longReady = false; dragMode = false; gestureRejected = false;
    pressT = performance.now();
    const p0 = e.touches && e.touches[0] ? e.touches[0] : e;
    startX = p0.clientX || 0; startY = p0.clientY || 0;
    lastX = startX; lastTime = pressT; velocity = 0;
    const target = p0.target || e.target;
    pressBtn = target && target.closest ? target.closest('#navRow button[data-v]') : null;
    clearPressTimers();
    /* 只启动长按计时；不位移不进入拖拽，因此普通长按不会变形成贴壁霓虹。 */
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      if (!pressed || dragMode || gestureRejected) return;
      longReady = true;
    }, 150);
  }

  function onMove(e) {
    if (!pressed) return;
    if (activePointerId != null && e.pointerId != null && e.pointerId !== activePointerId) return;
    const p0 = e.touches && e.touches[0] ? e.touches[0] : e;
    const x = p0.clientX || 0;
    const y = p0.clientY || 0;
    const dx = x - startX, dy = y - startY;
    const now = performance.now();

    const dt = Math.max(1, now - lastTime);
    velocity = velocity * .4 + ((x - lastX) / dt) * .6;
    lastX = x; lastTime = now;
    /* 支持按住即拖：横向位移超过 3px 立即进入拖拽，不要求先长按 150ms。
       纵向明显移动才视为页面滚动并取消；长按只控制碰撞色散何时增强。 */
    if (!dragMode && Math.abs(dx) > 3 && Math.abs(dx) > Math.abs(dy)) enterDrag(x);
    if (!dragMode) {
      if (Math.hypot(dx, dy) > 8) {
        gestureRejected = true;
        clearPressTimers();
        navDropResetMorph();
        drop.classList.remove('is-dragging', 'is-snapping', 'is-tap-ack');
        drop.classList.add('is-idle');
      }
      return;
    }
    if (dragMode) {
      if (e.cancelable) e.preventDefault();
      scheduleDrop(x);
      decayVelocity();
    }
  }

  function onUp(e) {
    if (!pressed) return;
    if (activePointerId != null && e && e.pointerId != null && e.pointerId !== activePointerId) return;
    activePointerId = null;
    navClickSuppressUntil = performance.now() + 500;
    const held = performance.now() - pressT;
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (gestureRejected) {
      cancelGesture();
      return;
    }
    if (!dragMode) {
      const tapped = pressBtn;
      /* 普通短按：立即切页并给克制反馈；长按不放仍安静结束，不误触路由。 */
      if (tapped && held < 420) {
        showTapFeedback(tapped);
        activateNavButton(tapped);
      }
      navDropResetMorph();
      drop.classList.remove('is-dragging', 'is-snapping');
      drop.classList.add('is-idle');
      resetPress();
      return;
    }
    finishSnap();
  }

  function onCancel(e) {
    if (activePointerId != null && e && e.pointerId != null && e.pointerId !== activePointerId) return;
    activePointerId = null;
    if (!pressed) return;
    cancelGesture();
  }

  if (window.PointerEvent) {
    dock.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
    dock.addEventListener('lostpointercapture', () => {
      /* pointerup 提交后浏览器会正常释放 capture，此时 is-snapping 正在播放，
         不能把它误当成 pointercancel 截断磁吸动画。真正的异常失焦仍走 cancel。 */
      if (drop.classList.contains('is-snapping')) return;
      onCancel();
    });
  } else {
    dock.addEventListener('touchstart', onDown, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    window.addEventListener('touchcancel', onCancel);
    dock.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  // 初始化对齐：字体/布局稳定后量一次（load + resize + 两拍兜底 + ResizeObserver）
  const align = () => navDropMove(true);
  window.addEventListener('load', align);
  window.addEventListener('resize', align);
  const ro = window.ResizeObserver ? new ResizeObserver(() => navDropMove(true)) : null;
  if (ro) ro.observe(dock);
  setTimeout(align, 60);
  setTimeout(align, 400);
}

/* ==================== 日/月/年 白玻分段滑块（2026-10-18 Stitch 1:1） ====================
   与 dock 胶囊同口径：滑块 #segPill 在 .st-seg 内 absolute（top/bottom/left 4px），
   transform 移到选中项；点击由 setPeriod 触发，额外支持拖拽（两端 0.32 阻尼）。 */
function stSegButtons() {
  return [...document.querySelectorAll('#seg button[data-p]')]
    .filter(b => b.offsetParent !== null && !b.disabled);
}
function stSegMove(instant) {
  const pill = $('segPill'), box = $('seg');
  if (!pill || !box) return;
  const btns = stSegButtons();
  if (!btns.length) { pill.style.width = '0px'; return; }
  const on = btns.find(b => b.classList.contains('on')) || btns[0];
  const br = box.getBoundingClientRect(), or_ = on.getBoundingClientRect();
  if (instant) pill.classList.add('is-dragging');
  pill.style.width = or_.width + 'px';
  pill.style.transform = 'translateX(' + (or_.left - br.left - 4) + 'px)';
  if (instant) requestAnimationFrame(() => pill.classList.remove('is-dragging'));
}
function initSegDrag() {
  const box = $('seg'), pill = $('segPill');
  if (!box || !pill) return;
  let dragging = false, startX = 0, base = 0, cur = 0, minO = 0, maxO = 0, moved = 0;
  const down = (e) => {
    dragging = true; moved = 0;
    startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    const btns = stSegButtons();
    if (!btns.length) { dragging = false; return; }
    const br = box.getBoundingClientRect();
    const on = btns.find(b => b.classList.contains('on')) || btns[0];
    base = on.getBoundingClientRect().left - br.left - 4;
    cur = base;
    minO = btns[0].getBoundingClientRect().left - br.left - 4;
    maxO = btns[btns.length - 1].getBoundingClientRect().left - br.left - 4;
    pill.classList.add('is-dragging');
  };
  const move = (e) => {
    if (!dragging) return;
    const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    const dx = x - startX;
    moved = Math.abs(dx);
    let next = base + dx;
    if (next < minO) next = minO + (next - minO) * .32;
    else if (next > maxO) next = maxO + (next - maxO) * .32;
    cur = next;
    pill.style.transform = 'translateX(' + next + 'px)';
    const btns = stSegButtons();
    if (!btns.length) return;
    const br = box.getBoundingClientRect();
    const unit = br.width / btns.length;
    const idx = Math.max(0, Math.min(btns.length - 1,
      Math.floor((next + 4 + unit / 2) / unit)));
    if (!btns[idx].classList.contains('on') && moved > 16) setPeriod(btns[idx].dataset.p);
  };
  const up = () => {
    if (!dragging) return;
    dragging = false;
    pill.classList.remove('is-dragging');
    const btns = stSegButtons();
    if (!btns.length) return;
    const br = box.getBoundingClientRect();
    const unit = br.width / btns.length;
    const idx = Math.max(0, Math.min(btns.length - 1,
      Math.floor((cur + 4 + unit / 2) / unit)));
    if (!btns[idx].classList.contains('on')) setPeriod(btns[idx].dataset.p);
    else stSegMove();
  };
  box.addEventListener('touchstart', down, { passive: true });
  window.addEventListener('touchmove', move, { passive: true });
  window.addEventListener('touchend', up);
  window.addEventListener('touchcancel', up);
  box.addEventListener('mousedown', (e) => {
    down(e);
    const mv = (ev) => move(ev);
    const mu = () => { up(); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', mu); };
    window.addEventListener('mousemove', mv);
    window.addEventListener('mouseup', mu);
  });
}

let viewEnterAnim = null;
let pendingViewEnter = null;

/** 新 DOM 已经写入后才播放短淡入；避免在空容器/旧视图上先播动画。 */
function flushViewEnter() {
  const p = pendingViewEnter;
  pendingViewEnter = null;
  if (p) playViewEnter(p.oldIdx, p.newIdx);
}

/** 切页入场只走 compositor：WAAPI 直接开新动画，不再 remove→offsetWidth→add 强制同步布局。 */
function playViewEnter(oldIdx, newIdx) {
  const viewEl = $('view');
  if (!viewEl || oldIdx < 0 || newIdx < 0 || oldIdx === newIdx) return;
  if (viewEnterAnim) { try { viewEnterAnim.cancel(); } catch (e) {} viewEnterAnim = null; }
  const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const dx = reduced ? 0 : (newIdx > oldIdx ? 40 : -40);
  if (viewEl.animate) {
    try {
      /* 页面内有大量 backdrop-filter；只做短 opacity，不做 transform/slide，
         避免整页合成层在切页时大面积重采样。 */
      viewEnterAnim = viewEl.animate([
        { opacity: .45 },
        { opacity: 1 },
      ], {
        duration: reduced ? 90 : 150,
        easing: 'ease-out',
        fill: 'none',
      });
      viewEnterAnim.onfinish = () => { viewEnterAnim = null; };
      return;
    } catch (e) { /* 老浏览器走 class 兜底 */ }
  }
  viewEl.classList.remove('view-slide-in');
  viewEl.style.setProperty('--slide-from', dx + 'px');
  requestAnimationFrame(() => {
    viewEl.classList.add('view-slide-in');
    setTimeout(() => viewEl.classList.remove('view-slide-in'), reduced ? 200 : 340);
  });
}

function switchView(v, opts) {
  opts = opts || {};
  /* 2026-10-15 task-11：底栏「微信对接」一级入口不新增视图 —— 折算成
     my + mySub='wechat'，复用「我的 → 消息设置」那张 #myPushCard（不出现第二份渲染）。 */
  if (v === 'wechat') { mySub = 'wechat'; v = 'my'; }
  /* 后台关掉的页面不许进（popstate / 深链兜底）：改道到还开着的第一个页 */
  const s = (site && site.settings) || {};
  if (v === 'data' && s.dataEnabled === false) v = 'group';
  if (v === 'group') {
    /* 还开着的子页（后台按赛事类型逐个关） */
    const enabled = [...document.querySelectorAll('#subnav button:not([disabled])')];
    if (s.groupEnabled === false || !enabled.length) v = 'lineage';
    /* 2026-10-13 修「点子页被改道回首个子页」：原来拿"第一个按钮有没有 .on"当
       "当前有没有选中子页"，可子导航点击早已把 curGroup 设成目标页，而 .on 还停在
       上一次选中项 —— 于是只要第一个子页当前不是选中态，点第二个起的所有子页都会被
       改道回第一个（实测 5 次点击 3 次无效）。改成：curGroup 不在还开着的列表里才落到第一个。 */
    else if (!enabled.some(b => b.dataset.g === curGroup)) curGroup = enabled[0].dataset.g;
  }
  if (v === 'lineage' && (s.lineageEnabled === false || TEAM === 'female')) v = 'data';
  if (v === 'my' && s.loginRequired === false) v = 'data';
  /* ===== 页面横滑方向（2026-10-18 v6，提示词第 7 条）=====
     序号差定方向：新 Tab 在右边（newIdx > oldIdx）= 向右翻页，新页从右滑入
     （--slide-from:40px）；在左边则从左（-40px）。同页（序号相同）不播动画。
     注意不能用 view/mySub 推 sameView：点「我的」时 onclick 先把 mySub 清成
     null，旧页 key 在这里已经算不出来 —— 直接用「切页前后 .on 落在哪个序号」
     对比，click 前旧序号取自 DOM（syncNavActive 还没跑），天然准确。 */
  const tabsBefore = navVisibleTabs();
  const oldIdx = tabsBefore.findIndex(b => b.classList.contains('on'));
  view = v;
  syncNavActive();
  const onWechat = v === 'my' && mySub === 'wechat';
  setQrWatermarkHidden(onWechat);
  if (!onWechat) {
    clearWxDock();
    clearPushCodeTimer();
    wxDockAutoAttempted = false;
    wxDockForceQr = false;
  }
  const tabsAfter = navVisibleTabs();
  const newIdx = tabsAfter.findIndex(b => b.classList.contains('on'));
  pendingViewEnter = (oldIdx >= 0 && newIdx >= 0 && oldIdx !== newIdx)
    ? { oldIdx: oldIdx, newIdx: newIdx } : null;
  document.querySelectorAll('#subnav button').forEach(b => b.classList.toggle('on', b.dataset.g === curGroup));
  show('toolbar', v === 'data');
  /* 2026-10-18：#toolbar 刚从 hidden 变可见，此刻才量得准宽度 ——
     隐藏期间 stSegMove 算出来的宽度是 0，不补一次滑块就永远是 2px。 */
  if (v === 'data') requestAnimationFrame(() => { try { stSegMove(true); } catch (e) {} });
  /* 底栏胶囊同理：隐藏的导航按钮（后台关掉的视图）不参与定位，这里再对齐一次 */
  requestAnimationFrame(() => { try { navDropMove(true); } catch (e) {} });
  /* 📣 头部公告行 #mhAnn 显隐（2026-10-17，任务口径 e 选「switchView 控制显隐」）：
     mhAnn 在 masthead 里是全局的，公告挂数据看板 —— 非数据视图统一收口：停轮换 +
     清行 + hidden；数据视图按 mhAnnQueue 原样恢复（不等网络，bootRest 静默刷新 /
     renderAnnounceItems 后续整包覆盖会再校准内容）。原 #home-ann 蓝条显隐逻辑随
     并入 #mhAnn 一并删除。 */
  if (v === 'data') mhAnnRestore();
  else mhAnnCollapse();
  /* 🎈 弹幕层只在看板显示：切走统一收口隐藏（挂载点在 renderList → renderDanmaku，
     切回 data 重新渲染榜单时会自动恢复）。 */
  /* 弹幕条随 renderList 一起输出/移除，切视图无需额外收口（2026-10-19 第三轮） */
  show('subnav', v === 'group');
  if (v === 'group') requestAnimationFrame(() => { try { groupSegMove(true); } catch (e) {} });
  show('foot', v !== 'lineage');
  syncHeaderOffset();
  /* 离开「我的」页就停页内计时器（激活轮询 / 目标人搜索防抖）：
     不停的话切回来会变成双份轮询，白耗请求 */
  if (v !== 'my') {
    clearTimeout(pushSrTimer);
    clearTimeout(pushChaseSrTimer);
    chasePicked.clear();     // 离开「我的」页：多选暂存作废（下次进来重新选）
  }
  /* 不清空 #view：旧内容先保留并由 .busy 轻微压暗，等目标视图一次替换。
     先 innerHTML='' 会触发一次大布局 + 空白闪动，是底栏切换体感卡顿的一部分。 */
  if (opts.push !== false) pushRoute(opts.replace === true);
  go();
}

function setPeriod(p) {
  period = p;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  stSegMove();          // 2026-10-18：白玻滑块滑到新口径
  /* 2026-10-22 用户口径：月 / 年也改成和日榜一样的横向可点周期条，不再用 ‹ › 步进。 */
  show('dates', true);
  show('stepper', false);

  if (p === 'daily') calHide();    // 月/年切换时把开着的日历收掉
  curPeriod = snapPeriod(p, nowPeriod(p));   // 只落有数据的周期
  renderDates();
  go();
}

/* 2026-10-14：顶部公告/庆祝只按 items 渲染一次（renderAnnounceItems），
   不再有独立的冠军/庆祝横幅路径，也不随日期口径切换刷新。 */


async function go() {
  show('err', false);
  /* 立刻给反馈：小菊花 + 内容压暗（数据没到不清空，到了再换）。
     乐观骨架只在内容为空时上，避免已看内容被闪没。 */
  const seq = ++loadSeq;
  if (viewAbort) { try { viewAbort.abort(); } catch (_) {} }
  const controller = typeof AbortController === 'function' ? new AbortController() : null;
  viewAbort = controller;
  const signal = controller ? controller.signal : undefined;
  busyOn();
  const optimistic = () => {
    if (view === 'data' && !listAll.length) $('view').innerHTML = '<div class="section">' + shimmerList() + '</div>';
  };
  optimistic();
  try {
    if (view === 'data') await loadData(signal);
    else if (view === 'lineage') await loadLineage(null, signal);
    else if (view === 'my') await loadMy(signal);
    else await loadGroup(signal);
    if (seq !== loadSeq) return;          // 期间用户又点了别的：过期响应作废
    flushViewEnter();                      // 目标 DOM 已落地，再播短淡入
    consecutiveFail = 0;
    show('stale', false);
  } catch (e) {
    if (e && e.name === 'AbortError') return;  // 切页主动取消：不得再写旧视图
    if (seq !== loadSeq) return;          // 过期失败的报错也不许盖住新内容
    consecutiveFail++;
    if (consecutiveFail >= 2) show('stale', true);
    /* 页面骨架可能已被整页接管（地区门禁 regionBlocked）：取不到就别硬写 */
    const mh = $('mhSub'), box = $('view');
    if (mh) mh.textContent = 'NETWORK';
    if (box) box.innerHTML = '<div class="empty"><span class="big">📶</span>暂时取不到数据<br>' +
      esc(e.message) + '</div>';
    flushViewEnter();
  } finally {
    if (seq === loadSeq) {
      busyOff();
      if (viewAbort === controller) viewAbort = null;
    }
  }
}

/* ==================== 静默刷新 ==================== */
/* 每分钟后台刷新，客户端加 ±10s 抖动：不加抖动的话所有人整点一起请求，服务端会尖峰 */
function scheduleRefresh() {
  clearTimeout(timer);
  const jitter = 60000 + (Math.random() * 20000 - 10000);
  timer = setTimeout(() => {
    /* lineage / my 不参与静默刷新：lineage 重建画布会丢缩放位置；
       my 是个人数据页，低频变化，且重建会打断用户正在输入的表单 */
    Promise.resolve(view === 'data' ? loadData(undefined, true)
      : (view === 'lineage' || view === 'my') ? null : loadGroup())
      .then(() => { consecutiveFail = 0; show('stale', false); })
      .catch(() => { consecutiveFail++; if (consecutiveFail >= 2) show('stale', true); })
      .finally(scheduleRefresh);
  }, jitter);
}

/* ==================== 导航显隐 ==================== */
/* 页面级显隐（2026-10-10）：每日报告 / 分组 / 族谱 / 分组子页都由后台开关控制，
   关掉的导航整体消失（接口也不下发，不是前端藏）；族谱仍是男团专属。
   分组子导航按赛事类型逐个显隐；全部子页都关时「分组」主导航也藏起来。 */
function syncNav() {
  const s = (site && site.settings) || {};
  const dataOn = s.dataEnabled !== false;
  const groupOn = s.groupEnabled !== false;
  // 族谱是男团专属页：女团视角不显示（2026-10-11）
  const linOn = s.lineageEnabled !== false && TEAM !== 'female';
  /* 子导航：把后台关掉的赛事类型按钮摘掉 */
  const gt = s.groupTypes || {};
  document.querySelectorAll('#subnav button').forEach(b => {
    const page = GROUP_PAGES.find(p => p.key === b.dataset.g);
    const on = groupOn && (!page || gt[page.type] !== false);
    b.disabled = !on;
    show(b, on);
  });
  /* 分组子页全关 → 分组主导航也没了 */
  const anySub = [...document.querySelectorAll('#subnav button')].some(b => !b.disabled);
  show('navGroup', groupOn && anySub);
  show('navData', dataOn);
  show('navLineage', linOn);
  show('navMy', s.loginRequired !== false);   // 关登录 = 全面开放，没有「我的」页
  /* 「微信对接」是「我的」子页的一级入口：跟「我的」同生共死（关登录时一起消失） */
  show('navWechat', s.loginRequired !== false);
  try { groupSegMove(true); } catch (e) {}
}

  if (linBtn) linBtn.style.display = TEAM === 'female' ? 'none' : '';
}

   · 品牌头 + 每步一个图标（后端 icon 白名单，前端再验一次）
   · Pill 步骤条可点击回跳；Esc / 点遮罩 = 跳过
   · 键盘 ← → 翻页；触屏左右滑动翻页
   · 滚动锁定 + 长文案卡内滚动，按钮永不被顶出屏幕
   · 版本记住已读：点「知道啦 / 跳过」，或翻完最后一步，都按 version 落 localStorage
   每次渲染都重建 DOM（innerHTML），所以这里统一在 render() 里重新绑事件。 */

/* 图标白名单与后端 STEP_ICON_WHITELIST 一致；只允许走 class 名，不放任意字符串 */
var ANNOUNCE_ICONS = ['auto_awesome', 'military_tech', 'qr_code_scanner',

  {
