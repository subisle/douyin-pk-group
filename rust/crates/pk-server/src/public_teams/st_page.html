/** 席位配置（2026-10-16 三甲通报）：弹窗按公告条在 items 里的**配置顺序**翻页，
    第 1 页就是第 1 条——运营想让谁当冠军就把谁排第一（横幅同口径）。
    每个席位只带视觉差异（主题色 / 荣耀副行 / 缺省徽章图标），内容全部来自该条公告：
    · theme：视觉主题（gold=冠军鎏金日冕 / purple=亚军紫晶星轨 / ice=季军冰蓝透视星轨，
      与 Stitch 三稿一一对应；超出 3 条统一 fallback 紫晶）
    · name / btn：进度小字里的席位名（冠军）与下一页按钮文案（季军荣耀）
    · sub：标题下荣耀副行的缺省词（纯装饰，不接后端）
    · icon：条目没配图标时的缺省徽章（emoji_events=冠军杯 / military_tech=奖牌 / star=星徽）
    （2026-10-16 用户口径：头像角标字「金/银/铜」去除，char 字段删除） */
var IP_SEATS = [
  { theme: 'gold', name: '冠军', btn: '冠军荣耀', sub: '问鼎巅峰 · 一战封神', icon: 'emoji_events' },
  { theme: 'purple', name: '亚军', btn: '亚军荣耀', sub: '锐不可当 · 傲视群雄', icon: 'military_tech' },
  { theme: 'ice', name: '季军', btn: '季军荣耀', sub: '锋芒毕露 · 再攀高峰', icon: 'star' },
];
var IP_SEAT_REST = { theme: 'purple', name: '荣耀席位', btn: '下一席位', sub: '荣耀在册 · 与有荣焉', icon: 'auto_awesome' };
function ipSeat(i) { return IP_SEATS[i] || IP_SEAT_REST; }

/** 席位徽章图标：条目 icon 在白名单内用条目的，否则用席位缺省（口径同横幅）。 */
function ipBadgeIcon(item, seat) {
  const ic = String(item && item.icon == null ? '' : item.icon).trim();
  return ANNOUNCE_ICONS.indexOf(ic) >= 0 ? ic : seat.icon;
}

/** 人名首字头像（Stitch 选手卡）：取人名第一个非空字符；渲染安全（单字符 textContent）。 */
function ipAvatarChar(name) {
  const s = splitRankNames(name).find((s) => s.length > 0) || '';
  return s ? s.charAt(0) : '★';
}

/** 登顶成绩分段：整万 +「万」+ 余数分开渲染（Stitch 大数字排版，成绩不丢精度）。
    wave<=0 → null（整块不渲染）；≥1 万拆成 {num:26, unit:'万', rest:'8591'}，
    不足 1 万原样不带单位。 */
function ipScoreParts(wave) {
  const n = Math.round(Number(wave) || 0);
  if (n <= 0) return null;
  if (n < 10000) return { num: String(n), unit: '', rest: '' };
  const w = Math.floor(n / 10000), r = n % 10000;
  return { num: String(w), unit: '万', rest: r === 0 ? '' : String(r).padStart(4, '0') };
}

/** 公告弹窗（三甲通报翻页版）：bootRest 末尾（maybeAnnounce() 之后）调用一次。
    · 序列 = items 里**全部** enabled && popup 的条目按配置顺序（1/3 冠军 → 2/3 亚军 → 3/3 季军…），
      与旧版「只取第一条」的区别：设计稿是三甲连报翻页，多条刚好各占一页；
      恰好 0 条可弹时静默返回，绝不挡启动。
    · 已读锁沿用版本锁：key = 'pk_item_popup_v' + version，翻完/关闭时写锁；
      翻页中途关弹窗也算读过（下次保存版本前进才再弹，与引导同口径）。
    · 卡片定高（CSS .ip-box height），各页尺寸一致；点「下一页 · N」/ 空白处翻页，
      最后一页按钮变「知道了」，点空白直接关。
    · 引导弹开了（announceCtx 非空）/ 登录门开着 → 让位不弹。
    · 安全：全程 createElement + textContent / 白名单标记（ipBodyHtml），
      后端字符串绝不进 innerHTML。 */
function maybeAnnounceItemsPopup() {
  /* 条目来源：siteAnnouncements.items 优先，site.items 兜底（与 bootRest 里横幅
     的两个来源一致；bootRest 在两者都齐了之后才调用本函数）。 */
  const items = Array.isArray(siteAnnouncements.items) && siteAnnouncements.items.length
    ? siteAnnouncements.items
    : (site && Array.isArray(site.items) ? site.items : []);
  const pages = items.filter((it) => it && it.enabled && it.popup);
  if (!pages.length) return;
  /* 引导让位：引导弹窗开着（announceCtx 非空）本次不弹，别叠两层遮罩 */
  if (announceCtx) return;
  /* 登录门兜底：#gate 不是 hidden（登录门开着）就不弹，z-index 89 会被 90 盖住但
     别留一个关不掉的层在底下 */
  const gate = $('gate');
  if (gate && !gate.classList.contains('hidden')) return;
  /* 已读锁：与引导弹窗 maybeAnnounce 的版本锁同口径，但 key 里再掺一份**通报内容指纹**
     （djb2(title|name|wave|text)）。为什么：登录门开着时（login_required=true）未登录
     用户拿不到 site.announcement.version，ver 恒为 0 —— 只按版本锁的话，运营更新了
     通报内容、未登录用户的 key 仍是 pk_item_popup_v0，永远不会再弹。掺内容指纹后
     「内容变了 = 新通报 = 重新弹」，已登录用户版本前进照样生效（两段都进 key）。 */
  const ver = siteAnnouncements.version != null ? siteAnnouncements.version
    : (site && site.announcement && site.announcement.version != null)
      ? site.announcement.version : 0;
  let fp = 5381;
  for (const pg of pages) {
    const sig = (pg.title || '') + '|' + (pg.name || '') + '|' + (pg.wave || 0) + '|' + (pg.text || '');
    for (let k = 0; k < sig.length; k++) fp = ((fp * 33) ^ sig.charCodeAt(k)) >>> 0;
  }
  const key = 'pk_item_popup_v' + ver + '_' + fp.toString(36);
  try {
    if (localStorage.getItem(key) === String(ver)) return;
  } catch (_) {}
  const box = $('itemPopup');
  if (!box) return;

  /* 关闭：写已读锁 + 收动画 + 清 DOM（点空白 / 知道了 / 翻完最后一页共用） */
  const close = () => {
    try { localStorage.setItem(key, String(ver)); } catch (_) {}
    box.classList.add('hidden');
    box.classList.remove('ip-overlay-in');
    box.innerHTML = '';
    unlockScroll();
  };

  /* ---- 常驻骨架：卡片双层边框 + 内层琉璃底 + 天光/粒子装饰层 ---- */
  box.innerHTML = '';
  const rays = document.createElement('div');
  rays.className = 'ip-rays';
  box.appendChild(rays);
  const particles = document.createElement('div');
  particles.className = 'ip-particles';
  box.appendChild(particles);
  /* 金紫飘落粒子（34 片，样式对齐 Stitch；prefers-reduced-motion 下 CSS 已禁动画） */
  const PALETTE = [['#fde047', 'rgba(253,224,71,.7)'], ['#fbbf24', 'rgba(251,191,36,.7)'],
    ['#c084fc', 'rgba(192,132,252,.7)'], ['#E9D5FF', 'rgba(233,213,255,.6)'], ['#ffffff', 'rgba(255,255,255,.9)']];
  for (let i = 0; i < 34; i++) {
    const p = document.createElement('span');
    const leaf = Math.random() > 0.45;
    const w = leaf ? Math.random() * 5 + 4 : Math.random() * 3 + 2;
    const col = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    p.style.width = w + 'px';
    p.style.height = (leaf ? Math.random() * 8 + 6 : w) + 'px';
    p.style.left = (Math.random() * 100) + '%';
    p.style.borderRadius = leaf ? (Math.random() > 0.5 ? '2px' : '50% 2px') : '50%';
    p.style.backgroundColor = col[0];
    p.style.boxShadow = '0 0 6px ' + col[1];
    p.style.animation = 'ipDrop ' + (Math.random() * 4.5 + 4.5).toFixed(2) + 's linear '
      + (Math.random() * 5).toFixed(2) + 's infinite';
    particles.appendChild(p);
  }

  const stage = document.createElement('div');
  stage.className = 'ip-stage';
  const card = document.createElement('div');
  card.className = 'ip-box';
  card.setAttribute('role', 'dialog');
  card.setAttribute('aria-modal', 'true');
  card.setAttribute('aria-labelledby', 'ipTitle');
  const inner = document.createElement('div');
  inner.className = 'ip-inner';

  /* 顶部「✦ 通报 ✦」胶囊 */
  const capsule = document.createElement('div');
  capsule.className = 'ip-capsule';
  const cs1 = document.createElement('i'); cs1.textContent = '✦';
  const capB = document.createElement('b'); capB.textContent = '通报';
  const cs2 = document.createElement('i'); cs2.textContent = '✦';
  capsule.appendChild(cs1); capsule.appendChild(capB); capsule.appendChild(cs2);
  inner.appendChild(capsule);

  /* 中段可滚区 + 单页容器（renderPage 每次整页重建） */
  const main = document.createElement('div');
  main.className = 'ip-main';
  inner.appendChild(main);

  /* 操作区：鎏金主按钮 + 进度小字（按钮文案随页变化，元素不重建保焦点） */
  const actions = document.createElement('div');
  actions.className = 'ip-actions';
  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'ip-next';
  const sweep = document.createElement('i');
  sweep.className = 'sweep';
  nextBtn.appendChild(sweep);
  const btnLabel = document.createElement('span');
  nextBtn.appendChild(btnLabel);
  /* chevron 用设计稿同款内联 SVG（stroke 2.5 圆角折线），不用字体图标 */
  const NS_SVG = 'http://www.w3.org/2000/svg';
  const btnArrow = document.createElementNS(NS_SVG, 'svg');
  btnArrow.setAttribute('viewBox', '0 0 24 24');
  btnArrow.setAttribute('fill', 'none');
  btnArrow.setAttribute('stroke', 'currentColor');
  const arrowPath = document.createElementNS(NS_SVG, 'path');
  arrowPath.setAttribute('d', 'M9 5l7 7-7 7');
  arrowPath.setAttribute('stroke-linecap', 'round');
  arrowPath.setAttribute('stroke-linejoin', 'round');
  arrowPath.setAttribute('stroke-width', '2.5');
  btnArrow.appendChild(arrowPath);
  nextBtn.appendChild(btnArrow);
  const foot = document.createElement('p');
  foot.className = 'ip-foot';
  actions.appendChild(nextBtn);
  actions.appendChild(foot);
  inner.appendChild(actions);
  card.appendChild(inner);

  /* 卡下提示：点它 = 点空白（进入下一页 / 最后一页关闭） */
  const tip = document.createElement('div');
  tip.className = 'ip-tip';
  const tipTxt = document.createElement('span');
  const tipArrow = document.createElement('b');
  tipArrow.textContent = '❯';
  tip.appendChild(tipTxt);
  tip.appendChild(tipArrow);
  stage.appendChild(card);
  stage.appendChild(tip);
  box.appendChild(stage);

  let idx = 0;
  const N = pages.length;

  /** 渲染第 i 页（三甲通报骨架，全部字段来自该条公告 + 席位装饰） */
  function renderPage(i) {
    const it = pages[i];
    const seat = ipSeat(i);
    idx = i;
    main.innerHTML = '';   // 只清这一层；粒子/装饰层翻页不重建
    const page = document.createElement('div');
    page.className = 'ip-page';

    /* 殿堂级徽章排面：地台 + 主题星轨 + 主徽章 + 点缀星辉。
       2026-10-16 三甲分化（用户口径「三个点背景是不一样的」）：主题类挂 visual，
       星轨/光效 DOM 按席位换 —— Stitch 三稿各不相同：
       冠军 = 鎏金日冕（太阳芒羽 + 能量核 + 金色双环）、亚军 = 紫晶双星轨（默认）、
       季军 = 冰蓝倾斜透视椭圆星轨（双能量星体）。 */
    const visual = document.createElement('div');
    visual.className = 'ip-visual ip-theme-' + (seat.theme || 'purple');
    const podium = document.createElement('div');
    podium.className = 'ip-podium';
    const podiumRing = document.createElement('div');
    podiumRing.className = 'ip-podium-ring';
    const halo = document.createElement('div');
    halo.className = 'ip-halo';
    const badge = document.createElement('div');
    badge.className = 'ip-badge';
    const badgeImg = document.createElement('img');
    badgeImg.alt = seat.name + '徽章';
    badgeImg.draggable = false;
    badgeImg.src = IP_BADGE_SRC[i] || IP_BADGE_SRC[2];
    badge.appendChild(badgeImg);
    visual.appendChild(podium);
    visual.appendChild(podiumRing);
    visual.appendChild(halo);
    if (seat.theme === 'gold') {
      /* 冠军：太阳芒羽 + 金色能量核压在光晕上，日冕双环（四芒星 + 星珠）+ 鎏金双星轨 */
      const sunburst = document.createElement('div');
      sunburst.className = 'ip-sunburst';
      const core = document.createElement('div');
      core.className = 'ip-glowcore';
      const corona = document.createElement('div');
      corona.className = 'ip-corona';
      const coronaStar = document.createElement('i');
      coronaStar.textContent = '✦';
      coronaStar.style.cssText = 'top:-7px;left:96px;font-size:13px;';
      const coronaDot = document.createElement('i');
      coronaDot.className = 'dot';
      corona.appendChild(coronaStar);
      corona.appendChild(coronaDot);
      const orbit = document.createElement('div');
      orbit.className = 'ip-orbit';
      orbit.appendChild(document.createElement('i'));
      const orbit2 = document.createElement('div');
      orbit2.className = 'ip-orbit2';
      orbit2.appendChild(document.createElement('i'));
      visual.appendChild(sunburst);
      visual.appendChild(core);
      visual.appendChild(corona);
      visual.appendChild(orbit);
      visual.appendChild(orbit2);
    } else if (seat.theme === 'ice') {
      /* 季军：冰蓝暗幕光晕 + 倾斜透视椭圆星轨（前后双能量星体）+ 反向虚线内环 */
      const veil = document.createElement('div');
      veil.className = 'ip-ice-veil';
      const iceOrbit = document.createElement('div');
      iceOrbit.className = 'ip-ice-orbit';
      iceOrbit.appendChild(document.createElement('i'));
      iceOrbit.appendChild(document.createElement('i'));
      const iceOrbit2 = document.createElement('div');
      iceOrbit2.className = 'ip-ice-orbit2';
      visual.appendChild(veil);
      visual.appendChild(iceOrbit);
      visual.appendChild(iceOrbit2);
    } else {
      /* 亚军（默认）：紫晶双星轨 */
      const orbit = document.createElement('div');
      orbit.className = 'ip-orbit';
      orbit.appendChild(document.createElement('i'));
      const orbit2 = document.createElement('div');
      orbit2.className = 'ip-orbit2';
      orbit2.appendChild(document.createElement('i'));
      visual.appendChild(orbit);
      visual.appendChild(orbit2);
    }
    visual.appendChild(badge);
    /* 四角点缀星辉（✦✦★★ 四枚，颜色/光晕随主题换 —— 与 Stitch 三稿一致） */
    const SPARKS = seat.theme === 'gold' ? [
      ['✦', 'top:20px;left:48px;font-size:12px;', '#fde047', '0 0 8px rgba(253,224,71,.9)', 0],
      ['✦', 'top:40px;right:44px;font-size:16px;', '#fef08a', '0 0 10px rgba(253,224,71,.9)', 0.8],
      ['★', 'bottom:32px;left:56px;font-size:11px;', '#fbbf24', '0 0 8px rgba(251,191,36,.9)', 1.4],
      ['★', 'bottom:28px;right:56px;font-size:12px;', '#fde047', '0 0 8px rgba(253,224,71,.9)', 1.9],
    ] : seat.theme === 'ice' ? [
      ['✦', 'top:20px;left:48px;font-size:12px;', '#7dd3fc', '0 0 8px rgba(125,211,252,.9)', 0],
      ['✦', 'top:40px;right:44px;font-size:16px;', '#bae6fd', '0 0 10px rgba(125,211,252,.9)', 0.8],
      ['★', 'bottom:32px;left:56px;font-size:11px;', '#38bdf8', '0 0 8px rgba(56,189,248,.9)', 1.4],
      ['★', 'bottom:28px;right:56px;font-size:12px;', '#7dd3fc', '0 0 8px rgba(125,211,252,.9)', 1.9],
    ] : [
      ['✦', 'top:20px;left:48px;font-size:12px;', '#fcd34d', '0 0 6px #fde047', 0],
      ['✦', 'top:40px;right:44px;font-size:16px;', '#E9D5FF', '0 0 8px #c084fc', 0.8],
      ['★', 'bottom:32px;left:56px;font-size:11px;', '#d8b4fe', '0 0 6px rgba(216,180,254,.8)', 1.4],
      ['★', 'bottom:28px;right:56px;font-size:12px;', '#fcd34d', '0 0 6px #fde047', 1.9],
    ];
    SPARKS.forEach(([ch, st, col, glow, delay]) => {
      const sp = document.createElement('span');
      sp.className = 'ip-spark';
      sp.textContent = ch;
      sp.style.cssText = st;
      sp.style.color = col;
      sp.style.textShadow = glow;
      sp.style.animationDelay = delay + 's';
      visual.appendChild(sp);
    });
    page.appendChild(visual);

    /* 标题 + 荣耀副行（副行 = 席位缺省词，纯装饰不接后端） */
    const titles = document.createElement('div');
    titles.className = 'ip-titles';
    const h1 = document.createElement('h1');
    h1.id = 'ipTitle';
    h1.textContent = String(it.title == null ? '' : it.title)
      || ('荣耀席位 ' + (i + 1));
    const sub = document.createElement('p');
    sub.className = 'ip-sub';
    const s1 = document.createElement('i'); s1.textContent = '★';
    const subTxt = document.createElement('span');
    subTxt.textContent = seat.sub;
    const s2 = document.createElement('i'); s2.textContent = '★';
    sub.appendChild(s1); sub.appendChild(subTxt); sub.appendChild(s2);
    titles.appendChild(h1);
    titles.appendChild(sub);
    page.appendChild(titles);

    /* 选手荣耀卡（1:1 设计稿）：上排 = 头像+名字+佩戴 chip | 登顶成绩；
       卡内底部 = 分隔线 + 奖励行（勾选 SVG + text 剩余行 + 「已派发」绿标）。 */
    const player = document.createElement('div');
    player.className = 'ip-player';
    const pRow = document.createElement('div');
    pRow.className = 'ip-p-row';
    const pLeft = document.createElement('div');
    pLeft.className = 'ip-p-left';
    const ava = document.createElement('div');
    ava.className = 'ip-ava';
    const avaRing = document.createElement('div');
    avaRing.className = 'ip-ava-ring';
    const avaCore = document.createElement('div');
    avaCore.className = 'ip-ava-core';
    const picked = splitRankNames(it.name).filter((s) => s.length > 0);
    /* 抖音头像（2026-10-16 用户口径「头像使用抖音头像」）：item.avatar 是后端白名单
       里的本站同源头像路径（/api/public/avatars/{pid}?v={hash}，选主播时带出）。
       只认这个前缀才发 <img>（任意字符串不进 src）；onerror / 空串回落首字色块
       （头像 404 语义与领奖台一致：装饰性资源缺图不破版）。 */
    const avaPath = String(it.avatar == null ? '' : it.avatar);
    if (avaPath.startsWith('/api/public/avatars/')) {
      const img = document.createElement('img');
      img.className = 'ip-ava-img';
      img.alt = '';
      img.draggable = false;
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.src = avaPath;
      img.onerror = () => {
        img.remove();
        avaCore.textContent = picked.length ? ipAvatarChar(it.name) : '';
        if (!picked.length) {
          const avaIco = document.createElement('span');
          avaIco.className = 'material-symbols-outlined';
          avaIco.textContent = 'person';
          avaCore.appendChild(avaIco);
        }
      };
      avaCore.appendChild(img);
    } else if (picked.length) {
      avaCore.textContent = ipAvatarChar(it.name);
    } else {
      const avaIco = document.createElement('span');
      avaIco.className = 'material-symbols-outlined';
      avaIco.textContent = 'person';
      avaCore.appendChild(avaIco);
    }
    avaRing.appendChild(avaCore);
    /* 2026-10-16 用户口径「去除金字」：头像角标（金/银/铜圆标）不再生成。 */
    ava.appendChild(avaRing);
    pLeft.appendChild(ava);
    const pInfo = document.createElement('div');
    pInfo.className = 'ip-p-info';
    const pName = document.createElement('div');
    pName.className = 'ip-p-name';
    pName.textContent = picked.length ? picked.slice(0, 3).join('、') : '荣耀席位';
    pInfo.appendChild(pName);
    const chipLine = String(it.text == null ? '' : it.text).split('\n')
      .map((l) => l.trim()).find((l) => l.length > 0);
    if (chipLine) {
      const chip = document.createElement('div');
      chip.className = 'ip-chip';
      const dot = document.createElement('i');
      const chipTxt = document.createElement('span');
      chipTxt.textContent = chipLine;
      chip.appendChild(dot);
      chip.appendChild(chipTxt);
      pInfo.appendChild(chip);
    }
    pLeft.appendChild(pInfo);
    pRow.appendChild(pLeft);
    const parts = ipScoreParts(it.wave);
    if (parts) {
      const score = document.createElement('div');
      score.className = 'ip-score';
      const scoreEm = document.createElement('em');
      scoreEm.textContent = '登顶成绩';
      const scoreRow = document.createElement('div');
      scoreRow.className = 'ip-score-row';
      const scoreNum = document.createElement('b');
      scoreNum.textContent = parts.num;
      scoreRow.appendChild(scoreNum);
      if (parts.unit) {
        const unit = document.createElement('i');
        unit.textContent = parts.unit;
        scoreRow.appendChild(unit);
        if (parts.rest) {
          const rest = document.createElement('u');
          rest.textContent = parts.rest;
          scoreRow.appendChild(rest);
        }
      }
      score.appendChild(scoreEm);
      score.appendChild(scoreRow);
      pRow.appendChild(score);
    }
    player.appendChild(pRow);

    /* 卡内奖励行：chip 已吃掉 text 首行（Stitch：佩戴称号在 chip、奖励在下行），
       这里渲染**剩余行**（多行合成一行 · 分隔，白名单富文本），带「已派发」绿标；
       剩余行为空时不渲染整行（不含绿标），保持设计稿卡高。 */
    const allLines = String(it.text == null ? '' : it.text).split('\n');
    const chipIdx = allLines.findIndex((l) => l.trim().length > 0);
    const restText = chipIdx >= 0 ? allLines.slice(chipIdx + 1).map((l) => l.trim())
      .filter((l) => l.length > 0).join(' · ') : '';
    if (restText) {
      const reward = document.createElement('div');
      reward.className = 'ip-reward';
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 20 20');
      svg.setAttribute('fill', 'currentColor');
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('fill-rule', 'evenodd');
      path.setAttribute('clip-rule', 'evenodd');
      path.setAttribute('d', 'M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z');
      svg.appendChild(path);
      reward.appendChild(svg);
      const rBody = document.createElement('div');
      rBody.className = 'ip-reward-text';
      const rHtml = ipBodyHtml({ text: restText });
      if (/<(p|ul|li|b)>/.test(rHtml)) {
        rBody.classList.add('rich');
        rBody.innerHTML = rHtml;   // 白名单产物：esc + <p>/<ul>/<li>/<b>
      } else {
        rBody.textContent = restText;
      }
      reward.appendChild(rBody);
      const okPill = document.createElement('span');
      okPill.className = 'ip-ok-pill';
      okPill.textContent = '已派发';
      reward.appendChild(okPill);
      player.appendChild(reward);
    }
    page.appendChild(player);

    main.appendChild(page);
    main.scrollTop = 0;

    /* 按钮与进度小字：N>1 → 「下一页 · 冠军/亚军/季军荣耀」+「i/N 全公会三甲荣誉通报 ·
       点击进入下一席位」；最后一页 → 「知道了」+「N/N 全公会三甲荣誉通报 · 点击空白处关闭」。 */
    const last = i >= N - 1;
    btnLabel.textContent = last ? '知道了' : '下一页 · ' + ipSeat(i + 1).btn;
    btnArrow.style.display = last ? 'none' : '';
    foot.textContent = (i + 1) + '/' + N + ' 全公会三甲荣誉通报 · '
      + (last ? '点击空白处关闭' : '点击进入下一席位');
    tipTxt.textContent = last ? '点击空白处关闭' : '点击空白处进入下一页';
    nextBtn.onclick = (e) => {
      e.stopPropagation();
      if (last) close();
      else renderPage(i + 1);
    };
    /* 重新触发单页入场动画（display 没变，强制 reflow 后重挂 animation） */
    page.style.animation = 'none';
    void page.offsetWidth;
    page.style.animation = '';
  }

  /* 首页渲染 + 打开：点空白（遮罩本体或卡下提示）= 下一页 / 最后一页关闭 */
  renderPage(0);
  box.onclick = (e) => {
    if (e.target === box || (e.target && e.target.closest && e.target.closest('.ip-tip'))) {
      if (idx >= N - 1) close();
      else renderPage(idx + 1);
    }
  };
  box.classList.remove('hidden');
  box.classList.add('ip-overlay-in');
  lockScroll();   // 弹窗开着锁背景滚动（close 里配对 unlockScroll，与引导/消息弹窗同口径）
  try { nextBtn.focus({ preventScroll: true }); } catch (_) { nextBtn.focus(); }
}

/* ---- 🎉 彩带：全屏 canvas 粒子（零依赖，rAF 驱动；样式全内联不碰其它元素） ---- */

/* 2026-10-16（用户点单）：彩带「只喷一次 + 慢一点」——在 2026-10-15 双侧礼炮上改两处：
   ① 只喷一次：原实现每帧向左右炮位各补 2 片、连补 2.8 秒（看着像连喷）；
      改为开场一次性齐发（每炮 VOLLEY 片）后**不再补发**，粒子只受物理支配。
   ② 慢一点：每帧只推进 DT 步物理（速度/重力/摆动/旋转/寿命统一乘 DT），即整条时间轴
      等比例放慢 1/DT ≈ 1.8 倍 —— 轨迹与移植时一致，只是慢慢飘、慢慢淡。
   收场：粒子全部淡完/落地/出屏即摘画布；durationMs 仍是兜底上限，按 1/DT 拉长到约 5.1 秒，
   粒子寿命按 durationMs 折算成「原速步数」，所以淡出刚好收在兜底那一刻，不会被硬切。
   下面 2026-10-15 的移植说明保留（物理公式本体没动，只是统一乘了 DT）。 */

/* 2026-10-15 任务四：彩带改为「双侧礼炮」——整段替换原「纸屑雨」实现。
   移植自 canvas-confetti ConfettiSideCannons 样例（MIT）：左右两个炮位
   （origin x:0,y:0.5 与 x:1,y:0.5）分别按 angle 60°（向右上）/ 120°（向左上）、
   spread 55°、startVelocity 60、colors ['#a786ff','#fd8bbc','#eca184','#f8deb1']，
   触发后持续 durationMs（默认 3000ms）；【2026-10-16 起改为单次齐发，见上一段】。
   粒子物理按 canvas-confetti v1 的 fetti 实现移植：
   · radAngle/radSpread 角度换弧度；wobble=Math.random()*10、
     wobbleSpeed=Math.min(0.11, Math.random()*0.1+0.05)、
     velocity=startVelocity*0.5+Math.random()*startVelocity、
     angle2D=-radAngle+(0.5*radSpread-Math.random()*radSpread)、
     tiltAngle=(Math.random()*(0.75-0.25)+0.25)*Math.PI、gravity=默认 1×3=3（恒定）、
     decay=0.9、tick/ticks=200；
   · 每步 velocity*=decay、gravity 恒定、x+=cos(angle2D)*velocity、
     y+=sin(angle2D)*velocity+gravity、wobble+=wobbleSpeed、tiltAngle+=0.1、tick++；
     alpha=1-tick/ticks，tick 用尽或出屏即移除（每步再统一乘 DT，即上面的慢放）。
   说明：任务口径里的 drag=0.03 在 v1 fetti 库内不存在（库内速度阻尼就是 decay=0.9、
   重力恒定不衰减），为忠实移植按库内实现，未给 gravity 加 drag 衰减。
   粒子形状：v1 updateFetti 的方片四边形（x/y + wobbleX/wobbleY + tilt 偏移），
   即带 tilt/rotation 的扁平小纸片（w≈10、h≈10·scalar，scalar=1）。
   全场总粒子上限 400：单次齐发天然远低于它，留作保险。
   保留旧接口口径：函数名 fireConfetti(durationMs)、prefers-reduced-motion 直接不放、
   重复调用先掐旧场（fireConfetti._raf）、canvas id=confettiCanvas、
   pointer-events:none、z-index 9999；fireConfettiOnce/celebrate 锁等调用方全部不动。 */
function fireConfetti(durationMs) {
  durationMs = Number(durationMs) > 0 ? Number(durationMs) : 3000;
  /* 尊重 prefers-reduced-motion：用户要求减弱动态效果时直接不放（比放个静态定格更省事） */
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  } catch (_) { /* 老浏览器没有 matchMedia：按正常放 */ }
  /* 上一场还没结束就再点：直接掐掉旧的 rAF 和 canvas，保证全场只有一份 */
  if (fireConfetti._raf) { cancelAnimationFrame(fireConfetti._raf); fireConfetti._raf = null; }
  const old = document.getElementById('confettiCanvas');
  if (old) old.remove();

  const doc = document.documentElement;
  const cv = document.createElement('canvas');
  cv.id = 'confettiCanvas';
  /* 全屏覆盖、绝不挡操作；z-index 9999 压过登录门(90)/toast 等一切 UI */
  cv.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;' +
    'pointer-events:none;z-index:9999;');
  cv.width = doc.clientWidth;
  cv.height = doc.clientHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');

  /* 样例配色（紫/粉/橘/米）：ConfettiSideCannons 官方样例同款。
     颜色按库内 hexToRgb 预解析成 {r,g,b}：updateFetti 每帧直接拼 rgba 字符串 */
  const COLORS = ['#a786ff', '#fd8bbc', '#eca184', '#f8deb1'].map((hex) => {
    const v = String(hex).replace(/[^0-9a-f]/gi, '');
    return {
      r: parseInt(v.substring(0, 2), 16),
      g: parseInt(v.substring(2, 4), 16),
      b: parseInt(v.substring(4, 6), 16)
    };
  });
  const START_VELOCITY = 60;      // 样例口径：startVelocity=60
  const SPREAD_DEG = 55;          // 样例口径：spread=55°
  const DECAY = 0.9;              // 库内默认 decay：velocity 每步 ×0.9
  const GRAVITY = 3;              // 库内口径：gravity 默认 1 × 3 = 3（恒定）
  const MAX_PARTS = 400;          // 全场总粒子上限（单次齐发天然远低于它，留作保险）
  /* 单次齐发 + 慢放（2026-10-16）：
     DT —— 每帧推进的物理步数（1 = 原速），0.55 ≈ 放慢 1.8 倍；
     LIFE_TICKS —— 一片纸屑的寿命（步），按「原速 60fps 下的 durationMs」折算：
       2800ms → 168 步；每步占 1/DT 帧，所以整段在墙上正好是 durationMs/DT ≈ 5.1 秒，
       淡出收在 END_AT 那一刻。（库内默认 ticks=200 是满速口径，慢放后沿用会被兜底上限硬切。）
     VOLLEY —— 每个炮位开场的齐发片数（左右各一波 = 200 片）。 */
  const DT = 0.55;
  const DECAY_DT = Math.pow(DECAY, DT);   // 每步衰减的 DT 次方（预计算，别每帧每片 Math.pow）
  const LIFE_TICKS = Math.max(30, Math.round(durationMs / 1000 * 60));
  const VOLLEY = 100;
  const W = cv.width, H = cv.height;
  const END_AT = Date.now() + Math.round(durationMs / DT);   // 兜底上限：原时长按慢放拉长

  /* 一片纸屑的初态：fetti.randomPhysics 的移植。
     cannon: 0=左炮（angle 60°，origin x:0，向右上）、1=右炮（angle 120°，origin x:1，向左上） */
  const spawnFetti = (cannon) => {
    const radAngle = (cannon === 0 ? 60 : 120) * (Math.PI / 180);
    const radSpread = SPREAD_DEG * (Math.PI / 180);
    return {
      x: (cannon === 0 ? 0 : 1) * W,   // origin.x 0 / 1 → 像素（origin.y 0.5 → 视口半高）
      y: 0.5 * H,
      wobble: Math.random() * 10,
      wobbleSpeed: Math.min(0.11, Math.random() * 0.1 + 0.05),
      velocity: (START_VELOCITY * 0.5) + (Math.random() * START_VELOCITY),
      angle2D: -radAngle + ((0.5 * radSpread) - (Math.random() * radSpread)),
      tiltAngle: (Math.random() * (0.75 - 0.25) + 0.25) * Math.PI,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      tick: 0,
      totalTicks: LIFE_TICKS,
      random: Math.random() + 2,       // v1.6+ 口径（1.0 时代是 +5，统一按现行版）
      tiltSin: 0,
      tiltCos: 0,
      wobbleX: 0,
      wobbleY: 0,
      gravity: GRAVITY,
      scalar: 1
    };
  };

  /* 单次齐发（2026-10-16）：开场就把左右两炮打满，此后不再补发 —— 池子只减不增 */
  let parts = [];
  for (let i = 0; i < VOLLEY && parts.length + 2 <= MAX_PARTS; i++) {
    parts.push(spawnFetti(0), spawnFetti(1));
  }

  /* 一步的粒子推进 + 绘制：updateFetti 的移植（方片 = x/y 与 wobbleX/wobbleY
     两个摆动点 + tilt 偏移构成的四边形，天然是带 tilt/rotation 的扁平纸片）。
     返回 false 表示这片已经消亡（tick 用尽），调用方把它从池里剔除。
     2026-10-16：每行统一乘 DT = 整条时间轴等比例放慢（轨迹不变，欧拉步长更小反而更准）。 */
  const updateFetti = (f) => {
    f.x += Math.cos(f.angle2D) * f.velocity * DT;
    f.y += Math.sin(f.angle2D) * f.velocity * DT + f.gravity * DT;
    f.velocity *= DECAY_DT;
    f.wobble += f.wobbleSpeed * DT;
    f.wobbleX = f.x + ((10 * f.scalar) * Math.cos(f.wobble));
    f.wobbleY = f.y + ((10 * f.scalar) * Math.sin(f.wobble));
    f.tiltAngle += 0.1 * DT;
    f.tiltSin = Math.sin(f.tiltAngle);
    f.tiltCos = Math.cos(f.tiltAngle);
    f.random = Math.random() + 2;
    const progress = f.tick / f.totalTicks;   // 淡出按步数算（与满速口径一致）
    f.tick += DT;
    /* 出屏即移除（礼炮从边角往外打，飞出视口就没有画的意义了） */
    if (f.tick >= f.totalTicks || f.x < -30 || f.x > W + 30 || f.y > H + 30 || f.y < -30) {
      return false;
    }
    const x1 = f.x + (f.random * f.tiltCos);
    const y1 = f.y + (f.random * f.tiltSin);
    const x2 = f.wobbleX + (f.random * f.tiltCos);
    const y2 = f.wobbleY + (f.random * f.tiltSin);
    ctx.fillStyle = 'rgba(' + f.color.r + ', ' + f.color.g + ', ' + f.color.b + ', ' +
      (1 - progress) + ')';
    ctx.beginPath();
    ctx.moveTo(Math.floor(f.x), Math.floor(f.y));
    ctx.lineTo(Math.floor(f.wobbleX), Math.floor(y1));
    ctx.lineTo(Math.floor(x2), Math.floor(y2));
    ctx.lineTo(Math.floor(x1), Math.floor(f.wobbleY));
    ctx.closePath();
    ctx.fill();
    return true;
  };

  const tick = () => {
    if (Date.now() >= END_AT || !cv.isConnected) {   // 兜底上限到点 / canvas 被移除：收场
      cv.remove();
      fireConfetti._raf = null;
      return;
    }
    ctx.clearRect(0, 0, W, H);
    /* 不再补发粒子（2026-10-16 单次齐发）：只推进开场那一波 */
    parts = parts.filter(updateFetti);
    if (!parts.length) {   // 粒子全淡完/落地：摘画布，不留空转的 rAF
      cv.remove();
      fireConfetti._raf = null;
      return;
    }
    fireConfetti._raf = requestAnimationFrame(tick);
  };
  fireConfetti._raf = requestAnimationFrame(tick);
}

/* ---- 🎉 每日之星登录庆祝：彩带 + 紫金庆祝横幅（当天只弹一次） ---- */

/* 当天只庆祝一次的两层锁：
   · sessionStorage celebrateShown_<YYYY-MM-DD> —— 跨页面加载（刷新/再进站当天不再弹）；
   · celebrateFiredThisLoad（内存）—— 本次页面里的庆祝事件进行中（登录时刻彩带已放，
     紧接着 bootRest 挂横幅属于同一次庆祝，不能被当天锁误吞）。 */
let celebrateFiredThisLoad = false;

function celebrateShownToday() {
  try { return !!sessionStorage.getItem('celebrateShown_' + todayStr()); }
  catch (_) { return false; }
}
function markCelebrateShown() {
  try { sessionStorage.setItem('celebrateShown_' + todayStr(), '1'); } catch (_) {}
}

/** 登录成功触发点（boot 主路径）：celebrate.enabled && confetti → 放彩带。
    只放彩带、只写锁；展示内容全部走 items（见 renderAnnounceItems），
    这里不再挂任何横幅。 */
function fireConfettiOnce(celebrate) {
  if (!celebrate || !celebrate.enabled || !celebrate.confetti) return;
  if (celebrateShownToday() || celebrateFiredThisLoad) return;
  markCelebrateShown();
  celebrateFiredThisLoad = true;
  fireConfetti(2800);
}

/** 庆祝彩带补挂（2026-10-14 改）：横幅已并入 items（tone=brand 那条），本函数
    **只**负责「彩带允许但本次页面还没放过」的补一场 + 两层锁，不再渲染任何横幅元素。
    （原实现往页面顶部再插一条庆祝横幅，与固定冠军条一起造成顶部两条重复，
    该路径已删除。）
    site.celebrate 是主数据源；site 没带字段（后端只发 /announcements）用 preferAnn 兜底。
    彩带允许但还没放过（比如 confetti 只在 site 侧给出 / 关登录直接进站）→ 这里补一场。
    bootRest 每次页面加载只跑一次，本函数天然只在首屏执行；静默刷新不经过这里。 */
function ensureCelebrateConfetti(celebrate, preferAnn) {
  const c = celebrate && (celebrate.enabled || celebrate.title || celebrate.name)
    ? celebrate : preferAnn;
  if (!c || !c.enabled) return;
  /* 当天已庆祝过、且本次页面没有进行中的庆祝事件 → 今天放过了，不再补 */
  if (celebrateShownToday() && !celebrateFiredThisLoad) return;
  /* 彩带：允许 && 本次页面还没放过（当天锁顺带写上，覆盖 confetti 只配在 site 侧的情况） */
  if (c.confetti && !celebrateFiredThisLoad) {
    markCelebrateShown();
    celebrateFiredThisLoad = true;
    fireConfetti(2800);
  }
}


/* 引导开着时锁背景滚动（iOS Safari 上 body overflow:hidden 不够，要连 touchmove 一起挡） */
var announceScrollDepth = 0;
function lockScroll() {
  announceScrollDepth++;
  var prev = document.body.style.overflow;
  document.body.setAttribute('data-ann-overflow', prev || '');
  document.body.style.overflow = 'hidden';
}
function unlockScroll() {
  announceScrollDepth = Math.max(0, announceScrollDepth - 1);
  if (announceScrollDepth > 0) return;
  document.body.style.overflow = document.body.getAttribute('data-ann-overflow') || '';
  document.body.removeAttribute('data-ann-overflow');
}

/* 登录门 / 地区门禁出现时把引导收掉，避免两层遮罩叠着。
   会话中途（登录 reload 前的窗口期）切页也可能把 spotlight 元素冲掉，一并清。 */
function dismissAnnounce() {
  clearAnnounceSpot();
  if (announceCtx) announceCtx();
}

(async function boot() {
  applyTeam();
  /* 公告/庆祝配置（2026-10-13）：并行探测 GET /api/public/announcements，
     失败/后端未上线时回落为全关（{}），所有消费点都按 falsy 兜底，不挡启动流程。
     items 也在这份里先垫一帧，见 bootRest 顶部。 */
  siteAnnouncements = await fetchAnnouncements().catch(() => ({}));
  if (await siteIsOpen()) { bootRest(); return; }
  const me = await ensureLogin();
  applyLoginState(me);   // 登录后立刻按账号团别设置 TEAM
  /* 登录彩带（2026-10-13）：celebrate.enabled && celebrate.confetti 才放。
     只放彩带、不挂横幅（展示内容走 items）；
     celebrateFiredThisLoad 记着本次页面的庆祝事件已开跑，site 数据回来后
     ensureCelebrateConfetti 不会因为当天锁误吞/重放。 */
  fireConfettiOnce(siteAnnouncements.celebrate);
  bootRest();
})();

async function bootRest() {

  /* 主导航 + 分组子导航 + 前进/后退 */
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    /* 2026-10-15 task-11：底栏「我的」是列表首页入口 —— 先清掉上次停留的子页
       （否则从「微信对接」点「我的」会又落回消息设置，「我的」看着像没反应）；
       「微信对接」则反着来，由 switchView 把 mySub 置成 'wechat'。 */
    if (b.dataset.v === 'my') mySub = null;
    switchView(b.dataset.v);
  });
  document.querySelectorAll('#subnav button').forEach(b =>
    b.onclick = () => { if (!b.disabled) { curGroup = b.dataset.g; switchView('group'); } });
  window.addEventListener('popstate', () => {
    const r = parseRoute();
    if (r.view === 'group' && r.group) curGroup = r.group;
    /* 「我的」子页进出（浏览器返回键 / 子页内返回按钮共用） */
    if (r.view === 'my') {
      const next = r.mySub || null;
      /* 只重渲染子页、不走 switchView，底栏选中态要自己同步
         （/my/wechat ↔ /my 来回时「微信对接」/「我的」高亮切换，task-11） */
      if (view === 'my') { mySub = next; syncNavActive(); renderMySub(); return; }
      mySub = next;
    } else if (view === 'my') {
      mySub = null;
    }
    switchView(r.view, { push: false });
  });
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setPeriod(b.dataset.p));
  $('btnSearch').onclick = () => {
    searchOpen = !searchOpen;
    show('searchBox', searchOpen);
    $('btnSearch').classList.toggle('on', searchOpen);
    if (searchOpen) $('q').focus();
  };
  $('q').oninput = (e) => { q = e.target.value; renderList(); };
  $('qClear').onclick = () => { q = ''; $('q').value = ''; renderList(); };
  $('pPrev').onclick = () => shiftStep(-1);
  $('pNext').onclick = () => shiftStep(1);
  $('btnCal').onclick = calShow;

  function shiftStep(n) {
    if (period === 'monthly') {
      curPeriod = stepPeriod(n);      // 只在有数据的月份之间走
    } else {
      curPeriod = snapPeriod('yearly', String(+curPeriod + n));
    }
    syncStepper();
    go();
  }

  /* 📣 头部公告行先垫一帧（2026-10-14 建条 / 2026-10-17 收进头部单行 #mhAnn）：
     site 还没回来，先用 boot 里探测到的 /api/public/announcements.items
     （登录前就能拿到，与 site.items 同源同口径）。site 到了以后由下面的
     renderAnnounceItems(site.items) 整包覆盖；site.items 不是数组（旧后端）时才回落到这份兜底。 */
  renderAnnounceItems(Array.isArray(siteAnnouncements.items) ? siteAnnouncements.items : []);

  /* 先拿站点配置：登录开关在 settings 里，关登录时根本不用弹登录门。
     401（要登录）→ 弹登录门重试。 */
  const fetchSite = () => api('/api/public/teams/' + TEAM);
  try {
    site = await fetchSite().catch(async (e) => {
      if (String(e.message || '').indexOf('登录') < 0) throw e;
      const me = await ensureLogin();
      applyLoginState(me);
      return fetchSite();
    });
  } catch (e) {
    if (regionBlockedShown) return;   // 已展示地区门禁整页提示，别覆盖成「连不上服务」
    document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="big">📡</span>' +
      '连不上服务，稍后再试试</div>';
    return;
  }
  if (!site.published) {
    document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="big">📺</span>' +
      '<b>' + LABEL() + '数据暂未公布</b><br>请等管理员发布</div>';
    return;
  }
  /* 📣 头部公告行（2026-10-17 用户口径）：公告收进 masthead 单行胶囊 #mhAnn（随头部
     吸顶、多条 4 秒轮换单行）。site.items 是主数据源（顺序即轮换顺序；空数组 = 不显示），
     整包覆盖掉上面那帧兜底；旧后端没有 items 字段时才回落到 boot 探测的 /announcements.items。
     site.champ / site.celebrate 兼容期后端仍会下发，但这里**不再**单独渲染
     （原来是固定冠军条 + 庆祝横幅两条独立路径同时渲染 = 顶部重复一条冠军）。 */
  renderAnnounceItems(Array.isArray(site.items) ? site.items : siteAnnouncements.items);
  /* 📣 看板公告条（2026-10-13 建，2026-10-17 并入 #mhAnn）：placements.home 开着才
     追加为头部公告行的一条（普通浅蓝条，与 items 一起轮换）。不持久化关闭 ——
     公告是运营触达位，每次进看板都显示。 */
  renderHomeAnnouncement(site.placements && site.placements.home);
  /* 🎉 登录庆祝彩带（2026-10-14）：只补彩带 + 两层锁，不再挂横幅（内容走 items）。 */
  ensureCelebrateConfetti(site.celebrate, siteAnnouncements.celebrate);

  /* 展示端登录门（2026-10-11）：后台「开启登录」开着 → 先登录再看；
     关掉 → 全面开放，直接展示全量数据（统一入口，不再分男团/女团）。 */
  const loginRequired = (site.settings || {}).loginRequired !== false;
  if (loginRequired) {
    await ensureLogin().then(applyLoginState);
    site = await fetchSite();
  }
  /* 未绑定主播的提醒条只作提示（文案指向联系管理员帅帅），没有可点的自助入口 */
  syncHeaderOffset();

  // 后台级开关：关掉的口径直接从界面消失（后端也不下发）
  const s = site.settings || {};
  const segs = { daily: s.daily !== false, monthly: s.monthly !== false, yearly: s.yearly !== false };
  document.querySelectorAll('#seg button').forEach(b => {
    b.disabled = !segs[b.dataset.p];
    if (!segs[b.dataset.p]) b.textContent = b.textContent + '（已关）';
  });
  if (!segs.daily && segs.monthly) period = 'monthly';
  else if (!segs.daily && segs.yearly) period = 'yearly';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.p === period));

  /* 每日报告页被关掉时首页落到分组（分组也关则落到族谱）；深链指到被关的页也一样改道 */
  const firstOn = (v, fb) => {
    if (v === 'data' && s.dataEnabled === false) return fb;
    if (v === 'group' && (s.groupEnabled === false ||
        !document.querySelector('#subnav button:not([disabled])'))) return fb;
    if (v === 'lineage' && (s.lineageEnabled === false || TEAM === 'female')) return fb;
    if (v === 'my' && s.loginRequired === false) return fb;
    return v;
  };
  const fallbackView = s.groupEnabled !== false &&
    document.querySelector('#subnav button:not([disabled])') ? 'group'
    : (s.dataEnabled !== false ? 'data' : 'lineage');
  view = firstOn(view, fallbackView);

  /* 默认站在昨天：数据每晚 24 点后才补前一天，今天那条一来就想看往往还没有。
     昨天万一还没入库（延迟或停采），退回库里最新那天，别把页面留在空状态。 */
  const dates0 = site.dates || [];
  curDate = dates0.includes(refStr()) ? refStr() : site.latestDate;
  curPeriod = snapPeriod(period, nowPeriod(period));   // 只站有数据的周期
  show('dates', period === 'daily');
  show('stepper', period !== 'daily');
  show('btnCal', period === 'daily');   // 日历只管「按日」口径；月/年走 ‹ › 步进
  $('pNow').textContent = period === 'monthly'
    ? curPeriod.slice(0, 4) + '年' + (+curPeriod.slice(5, 7)) + '月'
    : curPeriod + '年';
  syncStepper();

  await loadPlans();
  syncNav();

  /* 首页 = 每日报告：/st/m 直开时保留路径不跳转；带子路径（/group/xxx、/lineage）时
     按子路径落到对应视图，分享/刷新都不丢。深链指到被后台关掉的页时改道到首页兜底。 */
  const r0 = parseRoute();
  if (r0.view === 'group' && r0.group) curGroup = r0.group;
  /* 「我的」子页深链：/my/bind 等 → 全局 mySub，loadMy 渲染完按它落子页 */
  if (r0.view === 'my' && r0.mySub) mySub = r0.mySub;
  view = firstOn(r0.view, fallbackView);
  if (view === 'group' && r0.view === 'group' && r0.group) {
    const sub = document.querySelector('#subnav button[data-g="' + r0.group + '"]');
    if (sub && sub.disabled) curGroup = GROUP_PAGES.find(p => !document
      .querySelector('#subnav button[data-g="' + p.key + '"]').disabled)?.key || curGroup;
  }
  switchView(view, { push: false });
  scheduleRefresh();
  /* 引导放最后：它依赖 site.settings / site.announcement，且必须让位给登录门。
     登录成功后 gateResolve 会 reload，二次进来时 localStorage 已记住版本就不弹了。 */
  maybeAnnounce();
  /* 2026-10-16 三甲通报改版：公告弹窗（items 里全部 enabled && popup 条目翻页）。
     引导弹开了就让位，本次不弹（announceCtx 非空时 maybeAnnounceItemsPopup 直接返回）。 */
  if (!announceCtx) maybeAnnounceItemsPopup();
}

/* 字段面板已随「严格按排行榜版式」移除：显示内容固定，后台级开关仍在后端生效。 */
</script>
</body>
</html>
