/* ---- 导出族谱图片：按布局数据现拼独立 SVG（内联属性，不依赖页面 CSS）→ Canvas → PNG ---- */
const LN_PNG_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>';
const LN_FONT = "-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif";
const LN_ROW = 62, LN_PAD = 48, LN_HALF_W = 44, LN_HEAD = 132, LN_FOOT = 64;

/** 名字列表按可用宽度折行（中文按 1 字宽、ASCII 按 0.55 估） */
function lnWrapNames(names, maxW, fontPx) {
  fontPx = fontPx || 12;
  const wOf = (s) => [...s].reduce((w, ch) => w + (/[\x00-\xff]/.test(ch) ? fontPx * 0.55 : fontPx), 0);
  const lines = [];
  let cur = '';
  for (const n of names) {
    const candidate = cur ? cur + '、' + n : n;
    if (cur && wOf(candidate) > maxW) { lines.push(cur); cur = n; }
    else cur = candidate;
  }
  if (cur) lines.push(cur);
  return lines;
}

/** 拼一张整族谱的独立 SVG：每棵师门树先算包围盒，再贪心装列（目标是接近方形，别出细长条） */
function lnBuildSvg() {
  const all = [...lnById.values()];
  if (!all.length) return null;
  /* 布局节点上已带 th（门色）与 kids（子树），直接用，保证与画布同色同层级 */
  const roots = all.filter(n => n.masterId == null || !lnById.has(n.masterId));
  const boxes = roots.map(root => {
    const nodes = [], edges = [];
    const walk = (n) => {
      nodes.push(n);
      (n.kids || []).forEach(k => { edges.push([n, k]); walk(k); });
    };
    walk(root);
    const minX = Math.min.apply(null, nodes.map(n => n.x)) - LN_HALF_W;
    const minY = Math.min.apply(null, nodes.map(n => n.y)) - 26;
    const maxX = Math.max.apply(null, nodes.map(n => n.x)) + LN_HALF_W;
    const maxY = Math.max.apply(null, nodes.map(n => n.y)) + 26;
    return { nodes: nodes, edges: edges, minX: minX, minY: minY, w: maxX - minX, h: maxY - minY, x: 0, y: 0 };
  });
  const GAP_X = 56, GAP_Y = 44;
  const colW = Math.max.apply(null, boxes.map(b => b.w).concat([320]));
  const sumH = boxes.reduce((s, b) => s + b.h + GAP_Y, 0);
  const targetH = Math.max(Math.max.apply(null, boxes.map(b => b.h)), Math.sqrt(sumH * colW));
  const cols = [];
  let cur = { boxes: [], w: 0, h: 0 };
  for (const b of boxes) {
    if (cur.boxes.length && cur.h + b.h + GAP_Y > targetH) { cols.push(cur); cur = { boxes: [], w: 0, h: 0 }; }
    cur.boxes.push(b);
    cur.w = Math.max(cur.w, b.w);
    cur.h += b.h + (cur.boxes.length > 1 ? GAP_Y : 0);
  }
  if (cur.boxes.length) cols.push(cur);
  let cx = LN_PAD, bodyH = 0;
  for (const c of cols) {
    let cy = 0;
    for (const b of c.boxes) { b.x = cx; b.y = cy; cy += b.h + GAP_Y; }
    bodyH = Math.max(bodyH, c.h);
    cx += c.w + GAP_X;
  }
  const width = Math.max(cx - GAP_X + LN_PAD, 640);
  /* 没有师傅的人：图底部再补一份文字名单。用原始数据（lineageNodes）而不是上树的节点，
     因为「没师傅又没徒弟」的散人已经不画在树里了，得在这一行里留个记录 */
  const orphans = lineageNodes.filter(n => n.masterId == null).map(n => n.name);
  const listLines = orphans.length ? lnWrapNames(orphans, width - LN_PAD * 2) : [];
  const listH = orphans.length ? 50 + listLines.length * 20 : 0;
  const listTop = LN_HEAD + bodyH;
  const height = LN_HEAD + bodyH + listH + LN_FOOT;
  const px = (b, n) => b.x + (n.x - b.minX);
  const py = (b, n) => b.y + (n.y - b.minY) + LN_HEAD;

  let edges = '', cells = '';
  for (const b of boxes) {
    for (const e of b.edges) {
      const p = e[0], n = e[1];
      const stroke = n.depth === 1 && n.th ? n.th.bd : '#C3CDDC';
      const x1 = px(b, p) + LN_HALF_W, x2 = px(b, n) - LN_HALF_W, mx = (x1 + x2) / 2;
      edges += '<path d="M' + x1 + ',' + py(b, p) + ' H' + mx + ' V' + py(b, n) + ' H' + x2 +
        '" fill="none" stroke="' + stroke + '" stroke-width="1.5"/>';
    }
    for (const n of b.nodes) {
      const off = n.status === 'left';
      const th = n.th;
      const fill = n.depth === 0 && th ? th.bg : '#FFFFFF';
      const stroke = th ? th.bd : '#E5E7EB';
      const nameFill = th && !off ? th.tc : '#0b1c30';
      const sub = n.disciples > 0 ? n.disciples + ' 徒'
        : (off ? '已离团' : '第 ' + ((n.generation != null ? n.generation : n.depth) + 1) + ' 代');
      const nx = px(b, n), ny = py(b, n);
      cells += '<g opacity="' + (off ? 0.45 : 1) + '">' +
        '<rect x="' + (nx - LN_HALF_W) + '" y="' + (ny - 26) + '" width="' + (LN_HALF_W * 2) + '" height="52" rx="11" fill="' + fill +
        '" stroke="' + stroke + '" stroke-width="' + (n.depth === 0 ? 1.5 : 1) + '"/>' +
        '<text x="' + nx + '" y="' + (ny - 3) + '" text-anchor="middle" font-family="' + LN_FONT +
        '" font-size="13" font-weight="700" fill="' + nameFill + '">' + esc(n.name) + '</text>' +
        '<text x="' + nx + '" y="' + (ny + 16) + '" text-anchor="middle" font-family="' + LN_FONT +
        '" font-size="10" fill="#94a3b8">' + esc(sub) + '</text></g>';
    }
  }
  const maxDepth = all.reduce((m, n) => Math.max(m, n.depth), 0);
  const name = todayStr().split('-');
  const title = LABEL() + ' · 族谱';
  const sub2 = '师门 ' + roots.length + ' 支 · 上树 ' + all.length + ' 人 · 最深 ' + (maxDepth + 1) + ' 代';
  const foot = '抖音PK分组 · 生成于 ' + (+name[0]) + '年' + (+name[1]) + '月' + (+name[2]) + '日';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height +
    '" viewBox="0 0 ' + width + ' ' + height + '">' +
    '<rect width="' + width + '" height="' + height + '" fill="#ffffff"/>' +
    '<rect width="' + width + '" height="' + LN_HEAD + '" fill="#F8FAFF"/>' +
    '<text x="' + LN_PAD + '" y="56" font-family="' + LN_FONT + '" font-size="26" font-weight="800" fill="#0b1c30">' + esc(title) + '</text>' +
    '<text x="' + LN_PAD + '" y="84" font-family="' + LN_FONT + '" font-size="13" fill="#64748b">' + esc(sub2) + '</text>' +
    '<line x1="0" y1="' + LN_HEAD + '" x2="' + width + '" y2="' + LN_HEAD + '" stroke="#E5E7EB" stroke-width="1"/>' +
    edges + cells +
    (listH
      ? '<line x1="0" y1="' + (listTop + 6) + '" x2="' + width + '" y2="' + (listTop + 6) + '" stroke="#E5E7EB" stroke-width="1"/>' +
        '<text x="' + LN_PAD + '" y="' + (listTop + 32) + '" font-family="' + LN_FONT + '" font-size="13" font-weight="700" fill="#475467">没有师傅（' + orphans.length + ' 人）</text>' +
        listLines.map((ln, i) =>
          '<text x="' + LN_PAD + '" y="' + (listTop + 54 + i * 20) + '" font-family="' + LN_FONT +
          '" font-size="12" fill="#64748b">' + esc(ln) + '</text>').join('')
      : '') +
    '<line x1="0" y1="' + (height - LN_FOOT + 12) + '" x2="' + width + '" y2="' + (height - LN_FOOT + 12) + '" stroke="#E5E7EB" stroke-width="1"/>' +
    '<text x="' + (width / 2) + '" y="' + (height - 24) + '" text-anchor="middle" font-family="' + LN_FONT +
    '" font-size="12" fill="#94a3b8">' + esc(foot) + '</text></svg>';
  return { svg: svg, width: width, height: height };
}
async function lnExportPng() {
  try {
    const t = lnBuildSvg();
    if (!t) { toast('还没有可导出的族谱'); return; }
    toast('正在生成图片…');
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(t.svg);
    await img.decode();
    /* 太长（近百人 ≈ 7000px）时降倍率，别撞 canvas 尺寸上限 */
    const s = Math.max(1, Math.min(2, 15000 / t.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(t.width * s);
    cv.height = Math.round(t.height * s);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise((res, rej) =>
      cv.toBlob(b => (b ? res(b) : rej(new Error('canvas 转 PNG 失败'))), 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = LABEL() + '族谱-' + todayStr() + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('已导出族谱图片 ' + cv.width + '×' + cv.height);
  } catch (e) {
    toast('导出失败：' + (e && e.message ? e.message : e));
  }
}

/** 搜索：不重建画布，只切换 hit 类 + 计数 + 定位（避免每次按键丢输入框焦点） */
function lineageHitIds() {
  const q = lineageQ.trim();
  if (!q) return [];
  const out = [];
  for (const n of lnById.values()) if (n.name.indexOf(q) >= 0) out.push(n.id);
  return out;
}
function lineageUpdateHits() {
  const ids = lineageHitIds();
  const set = new Set(ids);
  document.querySelectorAll('.ln-node').forEach(g => {
    g.classList.toggle('hit', set.has(Number(g.dataset.id)));
  });
  const qi = $('lnQInfo');
  if (ids.length) {
    if (lnHitIdx >= ids.length) lnHitIdx = 0;
    qi.style.display = '';
    qi.textContent = (lnHitIdx + 1) + '/' + ids.length;
    lnFocus(ids[lnHitIdx]);
  } else if (qi) {
    qi.style.display = 'none';
  }
}

/* 卡片树搜索（2026-10-12）：与画布高亮共用同一个搜索框——不匹配的树节点卡 dim、
   匹配的卡描边高亮，并自动展开它的所有祖先支系（不然命中卡可能藏在收起的支系里）；
   搜索词清空时全部还原。画布一侧的 hit 逻辑仍在 lineageUpdateHits，两边互不干扰。 */
function lineageUpdateCardHits() {
  const q = lineageQ.trim();
  document.querySelectorAll('#view .st-branch-card, #view .st-kid-card').forEach(c => {
    const hit = !!q && (c.dataset.name || '').indexOf(q) >= 0;
    c.classList.toggle('dim', !!q && !hit);
    c.classList.toggle('hit', hit);
    if (!hit) return;
    let p = c.parentElement;
    while (p && !p.classList.contains('section')) {
      if (p.classList && p.classList.contains('st-branch-kids') && p.classList.contains('hidden')) {
        p.classList.remove('hidden');
        /* 容器被强制展开后，对应折叠钮的图标也要同步回「已展开」 */
        const ic = document.querySelector('[data-toggle="' + p.id + '"] .material-symbols-outlined');
        if (ic) ic.textContent = 'expand_less';
      }
      p = p.parentElement;
    }
  });
}

function renderLineage(keepView) {
  /* 没收徒的人只看空态：搜索/缩放/画布/导出都不渲染，也不跑树布局。
     myPersonId 为 0/null 或找不到对应节点时兜底照常画全树（不误伤管理员）。 */
  const me = myPersonId == null ? null : lineageNodes.find(n => n.id === myPersonId);
  if (me && !(Number(me.disciples) > 0)) {
      /* 口径切换 chips（2026-10-12）：日 / 月 / 年，点了带 period 重拉 */
  const periodChips = '<div class="ln-period" style="display:flex;gap:.5rem;padding:.25rem 1rem .5rem">' +
    [['daily', '日'], ['monthly', '月'], ['yearly', '年']].map(([k, label]) =>
      '<button class="go' + (lineagePeriod === k ? '' : ' gray') + '" data-lp="' + k + '">' + label + '</button>').join('') +
    '</div>';
$('view').innerHTML =
      '<div class="section tab-content-enter"><div class="card" style="padding:2rem 1.25rem;text-align:center">' +
        '<div class="material-symbols-outlined" style="font-size:44px;color:var(--on-surface-variant)">history_edu</div>' +
        '<h2 class="card-t" style="margin:.5rem 0 .25rem">暂未收徒</h2>' +
        '<div class="sub">收徒后，徒弟会出现在这里</div>' +
      '</div></div>';
    lnById = new Map();
    lineageQ = ''; lnHitIdx = 0;
    return { byId: lnById, roots: [] };
  }
  const t = layoutLineage();
  const { byId, roots } = t;
  lnById = byId;
  const anc = lineageSel != null ? chainSet(byId, lineageSel) : null;
  const inChain = (id) => anc != null && anc.has(id);
  const q = lineageQ.trim();
  const hits = q ? new Set([...byId.values()].filter(n => n.name.indexOf(q) >= 0).map(n => n.id)) : null;

  /* 代际文案：设计稿用中文序数（一代/二代），十代以外回退阿拉伯数字 */
  const LN_GEN_ZH = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  const genText = (n) => {
    const g = (n.generation != null ? n.generation : n.depth) + 1;
    return (LN_GEN_ZH[g - 1] || g) + ' 代';
  };
  /* 支系树改为递归多级（2026-10-12）：不再「2 层 + 截断 6 个」，每个有徒弟的节点
     都是可折叠子支系，孙辈继续缩进 + 连接线；wave 为 null 时「个人音浪」行整条不显示 */
  const kidHtml = (k) => {
    const off = k.status === 'left';
    const hasKids = (k.kids || []).length > 0;
    return '<div class="st-branch-kid">' +
      '<div class="st-kid-card' + (off ? ' off' : '') + '" data-name="' + esc(k.name) + '">' +
        '<div class="l"><div class="st-branch-av sub">' + esc(String(k.name || '?').charAt(0)) + '</div>' +
        '<div><div><span class="nm">' + esc(k.name) + '</span>' +
          '<span class="gen">' + esc(genText(k)) + '</span>' +
          '<span class="st">' + (off ? '离团' : '活跃') + '</span></div>' +
        (k.wave == null ? '' : '<div class="wv">个人音浪 ' + wan(k.wave) + '</div>') +
        '</div></div>' +
        (hasKids ? '<button class="st-branch-tg" data-toggle="lnkids-' + k.id + '" title="展开/收起">' +
          '<span class="material-symbols-outlined">expand_less</span></button>' : '') +
      '</div>' +
      (hasKids ? '<div class="st-branch-kids' + (lnAllOpen ? '' : ' hidden') + '" id="lnkids-' + k.id + '">' +
        (k.kids || []).map(kidHtml).join('') + '</div>' : '') +
    '</div>';
  };
  const branchCards = roots.slice(0, 12).map((r) => {
    const sub = r.disciples > 0 ? r.disciples + ' 位徒弟' : (r.status === 'left' ? '已离团' : '在册');
    const hasKids = (r.kids || []).length > 0;
    /* 支系卡：个人音浪行（wave null 不显示）+ 卡底「师徒合算总音浪」条（totalWave null 整条不显示） */
    return '<div class="st-branch-card" data-id="' + r.id + '" data-name="' + esc(r.name) + '">' +
      '<div class="l"><div class="st-branch-av">' + esc(String(r.name || '?').charAt(0)) + '</div>' +
        '<div style="flex:1;min-width:0"><div><span class="st-branch-nm">' + esc(r.name) + '</span>' +
        '<span class="st-branch-tag">' + esc(genText(r)) + '</span></div>' +
        '<div class="st-branch-sub">' + esc(sub) + '</div>' +
        (r.wave == null ? '' : '<div class="st-branch-wave">个人音浪 ' + wan(r.wave) + '</div>') +
        (r.totalWave == null ? '' : '<div class="st-branch-total"><span>师徒合算总音浪</span><b>' +
          wan(r.totalWave) + '</b></div>') +
        '</div></div>' +
      (hasKids ? '<button class="st-branch-tg" data-toggle="lnkids-' + r.id + '" title="展开/收起">' +
        '<span class="material-symbols-outlined">expand_less</span></button>' : '') +
    '</div>' +
    (hasKids ? '<div class="st-branch-kids' + (lnAllOpen ? '' : ' hidden') + '" id="lnkids-' + r.id + '">' +
      (r.kids || []).map(kidHtml).join('') + '</div>' : '');
  }).join('');

  let edges = '';
  for (const n of byId.values()) {
    if (n.masterId == null || !byId.has(n.masterId)) continue;
    const p = byId.get(n.masterId);
    const x1 = p.x + 44, x2 = n.x - 44, mx = (x1 + x2) / 2;
    const hot = anc != null && inChain(n.id) && anc.has(p.id);
    const cls = 'ln-edge' + (hot ? ' hot' : (anc ? ' dim' : ''));
    const trunk = n.depth === 1 && n.th ? ' style="stroke:' + n.th.bd + '"' : '';
    edges += '<path class="' + cls + '"' + trunk + ' d="M' + x1 + ',' + p.y + ' H' + mx + ' V' + n.y + ' H' + x2 + '"/>';
  }
  let nodes = '';
  for (const n of byId.values()) {
    const off = n.status === 'left';
    const cls = 'ln-node' + (off ? ' off' : '') + (lineageSel === n.id ? ' sel' : '') +
      (anc != null && inChain(n.id) && lineageSel !== n.id ? ' anc' : '') +
      (anc != null && !inChain(n.id) ? ' dim2' : '') +
      (hits != null && hits.has(n.id) ? ' hit' : '');
    const sub = n.disciples > 0 ? n.disciples + ' 徒'
      : (off ? '已离团' : '第 ' + ((n.generation != null ? n.generation : n.depth) + 1) + ' 代');
    let st = '';
    if (n.depth === 0 && n.th) st = 'fill:' + n.th.bg + ';stroke:' + n.th.bd + ';stroke-width:1.5;';
    else if (n.depth === 1 && n.th) st = 'stroke:' + n.th.bd + ';';
    if (hits != null && hits.has(n.id)) st += 'stroke:#f79009;stroke-width:2;';
    const nameSt = n.depth <= 1 && n.th && !off ? ' style="fill:' + n.th.tc + '"' : '';
    nodes += '<g class="' + cls + '" data-id="' + n.id + '" transform="translate(' + n.x + ',' + n.y + ')">' +
      '<rect x="-44" y="-25" width="88" height="50" rx="11"' + (st ? ' style="' + st + '"' : '') + '/>' +
      '<text class="ln-name" y="-3"' + nameSt + '>' + esc(n.name) + '</text>' +
      '<text class="ln-sub" y="15">' + esc(sub) + '</text>' +
      '</g>';
  }
  $('view').innerHTML =
    '<div class="section tab-content-enter">' +
    '<div class="st-ln-tools">' +
      '<div class="st-ln-search">' +
        '<span class="material-symbols-outlined" style="font-size:18px;color:var(--on-surface-variant)">search</span>' +
        '<input id="lnQ" placeholder="搜索主播或代际..." value="' + esc(q) + '" autocomplete="off">' +
        '<button class="st-ln-clear" id="lnQClear" title="清除"' + (q ? '' : ' style="display:none"') + '>' +
          '<span class="material-symbols-outlined">cancel</span></button>' +
      '</div>' +
      '<button class="st-ln-btn" id="lnFit" title="复位"><span class="material-symbols-outlined">filter_center_focus</span></button>' +
      '<button class="st-ln-btn" id="lnTglAll" title="' + (lnAllOpen ? '全部收起' : '全部展开') + '">' +
        '<span class="material-symbols-outlined" id="lnTglAllIc">' + (lnAllOpen ? 'unfold_less' : 'unfold_more') + '</span></button>' +
      '<button class="st-ln-btn" id="lnPng" title="导出图片">' + LN_PNG_ICON + '</button>' +
    '</div>' +
    periodChips +
    '<div class="st-branch">' + branchCards + '</div>' +
    '<div class="lineage-wrap" id="lnWrap">' +
    '<div class="ln-hint"><span class="tip">完整师门链 · 拖动查看 · 点人看传承路径</span>' +
    '<span class="qinfo" id="lnQInfo"' + (q ? '' : ' style="display:none"') + '></span></div>' +
    '<div class="ln-ctl">' +
    '<button id="lnZin" title="放大">+</button>' +
    '<button id="lnZout" title="缩小">−</button>' +
    '<button id="lnFull" title="全屏"></button>' +
    '</div>' +
    '<svg><g id="lnVp" transform="translate(0,0) scale(1)">' + edges + nodes + '</g></svg>' +
    '</div>' +
    '</div>';
  /* 口径切换绑定（2026-10-12）：点了带 period 重拉族谱数据 */
  $('view').querySelectorAll('[data-lp]').forEach(b => {
    b.onclick = () => { if (b.dataset.lp !== lineagePeriod) loadLineage(b.dataset.lp); };
  });
  bindLineage(t, keepView);
  /* 支系和子支系共用一套折叠交互（默认全展开）：图标 expand_less=已展开 / expand_more=已收起 */
  $('view').querySelectorAll('[data-toggle]').forEach(b => {
    b.onclick = () => {
      const box = document.getElementById(b.dataset.toggle);
      if (!box) return;
      const hidden = box.classList.toggle('hidden');
      b.querySelector('.material-symbols-outlined').textContent = hidden ? 'expand_more' : 'expand_less';
    };
  });
  /* 重渲染（如画布点人）会重建卡片树：搜索词还在的话把 dim/高亮补回来 */
  lineageUpdateCardHits();
}

function bindLineage(t, keepView) {
  const wrap = $('lnWrap');
  const fit = () => {
    // 横向树：祖师贴左边、纵向居中到最大师门（一代向右一列）
    const w = wrap.clientWidth || 360;
    const h = wrap.clientHeight || 400;
    const root = t.roots[0];
    lnView.s = Math.max(0.55, Math.min(0.95, (w - 24) / 460));
    lnView.x = 16;
    lnView.y = h / 2 - root.y * lnView.s;
    lnApply();
  };
  $('lnFit').onclick = fit;
  $('lnZin').onclick = () => lnZoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, 1.25);
  $('lnZout').onclick = () => lnZoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, 0.8);
  $('lnFull').onclick = lnToggleFs;
  $('lnPng').onclick = lnExportPng;
  /* 双击画布 = 全屏切换（拖动/点人不受影响：双击才触发） */
  wrap.addEventListener('dblclick', (e) => {
    if (e.target.closest && e.target.closest('.ln-ctl, .ln-hint')) return;
    lnToggleFs();
  });
  if (lnFsCss) wrap.classList.add('ln-fs');   // 全屏中切视图/重渲染，状态不丢
  lnSyncFsIcon();
  const qInput = $('lnQ');
  const qClear = $('lnQClear');
  /* 清除按钮跟随输入显隐；搜索框同时驱动两边：画布 hit（lineageUpdateHits）+
     卡片树 dim/高亮（lineageUpdateCardHits） */
  const syncClear = () => { qClear.style.display = qInput.value.trim() ? '' : 'none'; };
  qInput.oninput = () => {
    lineageQ = qInput.value; lnHitIdx = 0;
    syncClear(); lineageUpdateHits(); lineageUpdateCardHits();
  };
  qClear.onclick = () => {
    qInput.value = ''; lineageQ = ''; lnHitIdx = 0;
    syncClear(); lineageUpdateHits(); lineageUpdateCardHits();
    qInput.focus();
  };
  qInput.onkeydown = (e) => {
    if (e.key !== 'Enter') return;
    const ids = lineageHitIds();
    if (!ids.length) return;
    lnHitIdx = (lnHitIdx + 1) % ids.length;
    lineageUpdateHits();
  };
  /* 全部展开/收起：统一控制每一级支系容器（含孙辈），并同步所有折叠钮图标 */
  $('lnTglAll').onclick = () => {
    lnAllOpen = !lnAllOpen;
    $('view').querySelectorAll('.st-branch-kids[id]').forEach(box =>
      box.classList.toggle('hidden', !lnAllOpen));
    $('view').querySelectorAll('[data-toggle] .material-symbols-outlined').forEach(ic =>
      ic.textContent = lnAllOpen ? 'expand_less' : 'expand_more');
    $('lnTglAllIc').textContent = lnAllOpen ? 'unfold_less' : 'unfold_more';
    $('lnTglAll').title = lnAllOpen ? '全部收起' : '全部展开';
  };
  const pts = new Map();
  let pinchD = 0, moved = 0, onCtl = false;
  /* 手势坐标 → 画布内坐标的换算 */
  const rel = (cx, cy) => {
    const r = wrap.getBoundingClientRect();
    return [cx - r.left, cy - r.top];
  };
  wrap.addEventListener('pointerdown', (e) => {
    /* 控件（缩放/全屏/搜索框）交给原生 click：一旦抢了指针或重建 DOM，
       按钮的 click 就不触发了（真实点击踩过，合成 .click() 测不出来） */
    if (e.target.closest && e.target.closest('.ln-ctl, .ln-hint')) { onCtl = true; return; }
    wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) moved = 0;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      moved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
      lnView.x += e.clientX - prev.x;
      lnView.y += e.clientY - prev.y;
      lnApply();
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD > 0) {
        const [px, py] = rel((a.x + b.x) / 2, (a.y + b.y) / 2);
        lnZoomAt(px, py, d / pinchD);
      }
      pinchD = d;
    }
  });
  const up = (e) => {
    if (onCtl) { onCtl = false; return; }
    const wasTap = pts.size === 1 && moved < 6;
    pts.delete(e.pointerId);
    pinchD = 0;
    if (wasTap) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('.ln-node') : null;
      const id = g ? +g.dataset.id : null;
      lineageSel = id != null && lineageSel !== id ? id : null;
      renderLineage(true);
    }
  };
  wrap.addEventListener('pointerup', up);
  wrap.addEventListener('pointercancel', (e) => { onCtl = false; pts.delete(e.pointerId); pinchD = 0; });
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const [px, py] = rel(e.clientX, e.clientY);
    lnZoomAt(px, py, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });
  if (keepView) lnApply(); else fit();
}


/* ==================== 分组（按赛事类型拆页：初级/中级小组赛、月终争霸赛、两级晋级赛） ==================== */
async function loadPlans() {
  try {
    const d = await api('/api/public/plans');
    plans = d.items || [];
  } catch (_) { plans = []; }
}

async function loadGroup(signal) {
  const page = GROUP_PAGES.find(p => p.key === curGroup) || GROUP_PAGES[0];
  curGroup = page.key;
  $('mhSub').textContent = page.label;
  /* 展示端按类型各占一页：上架互斥也是按类型（同类型一场，不同类型互不影响） */
  const list = plans.filter(p => (p.eventType || '') === page.type);
  if (!list.length) {
    $('view').innerHTML = '<div class="section tab-content-enter">' +
      '<div class="st-group-chips"><button class="st-group-chip" disabled>' +
        '<span class="n"></span><span>暂无场次</span><span class="c">0人</span></button></div>' +
      '<div class="empty"><span class="big">📺</span>' + esc(page.label) +
      '暂未公布<br>上架后这里会自动出现</div></div>';
    bindGroupChips();
    return;
  }
  if (!list.some(p => p.id === planByType[curGroup])) planByType[curGroup] = list[0].id;
  const pid = planByType[curGroup];
  $('view').innerHTML = '<div class="section">' + shimmerList() + '</div>';
  try {
    const d = await api('/api/public/plans/' + pid, { signal });
    $('mhSub').textContent = page.label;
    $('view').innerHTML = groupHtml(d, page, list);
    bindGroupChips();
    groupSegMove(true);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    $('view').innerHTML = '<div class="empty"><span class="big">📺</span>取不到分组数据<br>' + esc(e.message) + '</div>';
  }
}

function groupHtml(d, page, list) {
  const showWave = !d.display || d.display.wave !== false;
  const showGroups = !d.display || d.display.groups !== false;
  const groups = d.groups || [];
  const sched = d.schedule || {};
  const nPlayers = d.counts ? d.counts.players : groups.reduce((s, g) => s + (g.count || 0), 0);
  const nGroups = d.counts ? d.counts.groups : groups.length;
  const day = (d.dates && d.dates[0]) || String(d.createdAt || '').slice(0, 10);
  const meta = [
    d.eventType || '',
    '共 ' + nPlayers + ' 人',
    sched.start ? sched.start + ' 后 / 间隔 ' + (sched.intervalMin || 15) + ' 分' : '',
  ].filter(Boolean).join(' · ');

  let html = '<div class="section tab-content-enter">';
  if (d.stale) html += '<div class="stale">分组用的是快照数据，可能不是最新</div>';

  /* 场次信息卡 + 组别胶囊 */
  html +=
    '<div class="st-my-big" style="margin-top:0">' +
      '<div class="lbl"><span>' + esc(page.label) + (day ? ' · ' + esc(day) : '') + '</span>' +
      '<span class="chip">' + nGroups + '组 · ' + nPlayers + '人</span></div>' +
      '<div style="margin-top:.375rem;font-size:18px;font-weight:600;color:var(--on-surface)">' +
        esc(d.title || page.label) + '</div>' +
      (meta ? '<div style="margin-top:.25rem;font-size:12px;color:var(--on-surface-variant)">' +
        esc(meta) + '</div>' : '') +
    '</div>' +
    '<div class="st-group-chips">' + groups.map((g, i) =>
      '<button class="st-group-chip' + (i === 0 ? ' on' : '') + '" data-scroll="gcard-' + i + '">' +
        '<span class="n"></span><span>' + esc(g.name) + '</span>' +
        '<span class="c">' + (g.count || (g.players || []).length) + '人</span>' +
      '</button>').join('') + '</div>';

  if (!showGroups) {
    return html + '<div class="empty">名单尚未开放<br>开赛时间如上</div></div>';
  }
  if (!groups.length) {
    return html + '<div class="empty"><span class="big">📺</span>暂无分组数据</div></div>';
  }

  /* 分组卡：横向滑动 + snap；成员白卡列表（序号 / 首字头像 / 姓名） */
  html += '<div class="st-group-cards" id="stGroupCards">' + groups.map((g, gi) => {
    const mems = (g.players || []).map((p, pi) =>
      '<div class="st-gmem">' +
        '<span class="st-gmem-rk">' + String(pi + 1).padStart(2, '0') + '</span>' +
        '<div class="st-gmem-av">' + esc(String(p.name || '?').charAt(0)) + '</div>' +
        '<span class="st-gmem-nm">' + esc(p.name) + (p.leader ? ' · ' + esc(p.leader) : '') + '</span>' +
      '</div>').join('');
    return '<section class="st-gcard" id="gcard-' + gi + '">' +
      '<div class="st-gcard-head"><div class="l">' +
        '<span class="bar' + (gi % 2 ? ' alt' : '') + '"></span>' +

        '<span class="cnt">' + (g.count || (g.players || []).length) + (g.slot ? '人满员' : '人') +
        (g.slot ? ' · ' + esc(g.slot) + ' 开赛' : '') + '</span></div>' +
      '<div class="st-gcard-body">' + (mems || '<div class="empty" style="padding:18px">空组</div>') + '</div>' +
    '</section>';
  }).join('') + '</div>';

  html += '<div class="gx-foot" style="text-align:center;color:var(--on-surface-variant);font-size:11px;margin-top:.25rem">' +
    esc((d.title || 'PK 分组') + (d.eventType ? ' · ' + d.eventType : '') + ' | ' + todayStr()) + '</div>';

  if (list.length > 1) {
    html += '<div class="st-my-list" style="margin-top:1rem"><div class="sec">切换已上架方案</div>' +
      list.map(p => '<button class="st-my-item" data-pid="' + p.id + '" style="width:100%;border:none;background:none;cursor:pointer">' +
        '<div class="l"><div class="ico"><span class="material-symbols-outlined">playlist_play</span></div>' +
        '<div class="t">' + esc(p.title || ('方案 ' + p.id)) + '</div></div>' +
        '<div class="r"><span class="pri">' + (p.id === planByType[curGroup] ? '当前' : '切换') + '</span>' +
        '<span class="material-symbols-outlined">chevron_right</span></div></button>').join('') + '</div>';
    setTimeout(() => document.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => {
      planByType[curGroup] = Number(b.dataset.pid); loadGroup();
    }), 0);
  }
  return html + '</div>';
}

/* ===== 分组赛事切换：独立苹果白玻分段控件（不共用底部水滴） =====
   普通点击切页；长按 180ms 后横向拖动时，白色玻璃滑块跟手跨格，松手切页。 */
let groupSegClickSuppressUntil = 0;
let groupSegPreviewKey = '';

function groupSegButtons() {
  return [...document.querySelectorAll('#subnav button[data-g]')]
    .filter(b => b.offsetParent !== null && !b.disabled);
}

function groupSegMove(instant) {
  const box = $('subnav'), pill = $('groupSegPill');
  if (!box || !pill) return;
  const btns = groupSegButtons();
  if (!btns.length) { pill.style.width = '0px'; return; }
  const active = btns.find(b => b.classList.contains('on')) || btns[0];
  const br = box.getBoundingClientRect(), ar = active.getBoundingClientRect();
  if (!br.width || !ar.width) { pill.style.width = '0px'; return; }
  if (instant) pill.classList.add('is-dragging');
  pill.style.width = ar.width + 'px';
  pill.style.transform = 'translateX(' + (ar.left - br.left - 4).toFixed(1) + 'px)';
  if (instant) requestAnimationFrame(() => pill.classList.remove('is-dragging'));
}

function groupSegChoose(key) {
  if (!key) return;
  const btn = document.querySelector('#subnav button[data-g="' + key + '"]');
  if (!btn || btn.disabled) return;
  if (curGroup === key && view === 'group') { groupSegMove(); return; }
  curGroup = key;
  switchView('group');
}

function groupSegPreviewAt(clientX, btns) {
  let best = btns[0], dist = Infinity;
  btns.forEach((b) => {
    const r = b.getBoundingClientRect();
    const d = Math.abs((r.left + r.width / 2) - clientX);
    if (d < dist) { dist = d; best = b; }
  });
  if (!best || best.dataset.g === groupSegPreviewKey) return best ? best.dataset.g : '';
  groupSegPreviewKey = best.dataset.g;
  btns.forEach(b => b.classList.toggle('on', b === best));
  groupSegMove(true);
  return groupSegPreviewKey;
}

function initGroupSegDrag() {
  const box = $('subnav'), pill = $('groupSegPill');
  if (!box || !pill) return;
  let pressed = false, longReady = false, dragging = false, rejected = false;
  let pointerId = null, startX = 0, startY = 0, longTimer = null, previewKey = '';

  const clearTimer = () => { if (longTimer) { clearTimeout(longTimer); longTimer = null; } };
  const restoreActive = () => {
    document.querySelectorAll('#subnav button[data-g]').forEach(b => b.classList.toggle('on', b.dataset.g === curGroup));
    groupSegPreviewKey = '';
    groupSegMove(true);
  };
  const reset = (restore) => {
    clearTimer();
    pressed = false; longReady = false; dragging = false; rejected = false;
    pointerId = null; previewKey = '';
    box.classList.remove('is-longpress', 'is-dragging');
    pill.classList.remove('is-dragging');
    if (restore) restoreActive();
  };

  function onDown(e) {
    if (e.button != null && e.button !== 0) return;
    const btn = e.target && e.target.closest ? e.target.closest('#subnav button[data-g]') : null;
    if (!btn || btn.disabled) return;
    pressed = true; longReady = false; dragging = false; rejected = false;
    pointerId = e.pointerId != null ? e.pointerId : null;
    startX = e.clientX || 0; startY = e.clientY || 0;
    previewKey = btn.dataset.g;
    clearTimer();
    longTimer = setTimeout(() => {
      longTimer = null;
      if (!pressed || rejected) return;
      longReady = true;
      groupSegPreviewKey = previewKey;
      box.classList.add('is-longpress');
      pill.classList.add('is-dragging');
      if (pointerId != null) { try { box.setPointerCapture(pointerId); } catch (_) {} }
      try { if ('vibrate' in navigator) navigator.vibrate(8); } catch (_) {}
    }, 180);
  }

  function onMove(e) {
    if (!pressed) return;
    if (pointerId != null && e.pointerId != null && e.pointerId !== pointerId) return;
    const dx = (e.clientX || 0) - startX;
    const dy = (e.clientY || 0) - startY;
    if (!longReady && !dragging) {
      if (Math.hypot(dx, dy) > 8) {
        rejected = true;
        groupSegClickSuppressUntil = performance.now() + 500;
        box.classList.remove('is-longpress');
        pill.classList.remove('is-dragging');
        clearTimer();
      }
      return;
    }
    if (longReady && !dragging && Math.abs(dx) > 3) {
      dragging = true;
      box.classList.add('is-dragging');
    }
    if (dragging) {
      if (e.cancelable) e.preventDefault();
      const key = groupSegPreviewAt(e.clientX || startX, groupSegButtons());
      if (key) previewKey = key;
    }
  }

  function onUp(e) {
    if (!pressed) return;
    if (pointerId != null && e && e.pointerId != null && e.pointerId !== pointerId) return;
    const commit = longReady && dragging ? previewKey : '';
    if (rejected || longReady) groupSegClickSuppressUntil = performance.now() + 500;
    reset(false);
    if (commit && commit !== curGroup) groupSegChoose(commit);
    else restoreActive();
  }

  function onCancel(e) {
    if (pointerId != null && e && e.pointerId != null && e.pointerId !== pointerId) return;
    groupSegClickSuppressUntil = performance.now() + 500;
    reset(true);
  }

  box.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
  box.addEventListener('lostpointercapture', (e) => { if (pressed) onCancel(e); });
  window.addEventListener('resize', () => groupSegMove(true));
  setTimeout(() => groupSegMove(true), 50);
}

/* ==================== 我的（手机号+密码登录） ==================== */
/* 账号来源：只有管理员在后台手动添加这一条路径（2026-10-14 注册功能已下线）。
   历史遗留的账号要先绑定主播，才有个人的音浪数据。
   token 存 sessionStorage，关闭浏览器后需重新登录；服务重启或失效自动退回登录卡。 */
const MY_ANY_KEY = 'myToken_any';
const MY_ANY_NAME = 'myName_any';
const MY_KEY = () => MY_ANY_KEY;
const MY_NAME_KEY = () => MY_ANY_NAME;

/* 登录态存放位：统一入口存 MY_ANY_KEY；旧团别 key 只做兼容读取 */
function myTokenKeys() {
  return [MY_ANY_KEY, 'myToken_male', 'myToken_female'];
}
const myTeamOfKey = (k) =>
  (k === 'myToken_male' ? 'male' : k === 'myToken_female' ? 'female' : '');
function readMyToken(key) {
  const token = sessionStorage.getItem(key);
  if (token) return token;
  const legacyToken = localStorage.getItem(key);   // 老版本存 localStorage：读到就搬进 sessionStorage
  if (legacyToken) {
    sessionStorage.setItem(key, legacyToken);
    localStorage.removeItem(key);
  }
  return legacyToken || '';
}

/** 当前登录态：{ token, team }（team 空串 = 团别待定，两团都能看；没登录则 token 为空） */
function mySession() {
  for (const key of myTokenKeys()) {
    const token = readMyToken(key);
    if (token) return { token: token, team: myTeamOfKey(key) };
  }
  return { token: '', team: '' };
}
function myToken() { return mySession().token; }
/** 带登录态的请求头：token 只走 X-My-Token（后端唯一入口，见 admin.rs::header_my_token）。
    所有需要登录态的 fetch 都必须经过这里，别再往 URL 上拼 ?token= / ?access_token=。 */
function myTokenHeaders(extra) {
  const h = Object.assign({}, extra || {});
  const t = myToken();
  if (t) h['X-My-Token'] = t;
  return h;
}
/* 登录态换发（2026-10-15 契约 A）：重置密码成功后后端会吊销**全部**旧 token，
   只下发一个新 token。新 token 统一写进唯一存放位 MY_ANY_KEY，并把所有历史引用
   （旧团别 key、老版本可能落在 localStorage 的那份）一并清掉——
   漏掉任何一处，下一次请求就会带着已吊销的死 token 打过去、全站 401。 */
function setMyToken(token) {
  if (!token) return;
  sessionStorage.setItem(MY_ANY_KEY, token);
  myTokenKeys().forEach((k) => {
    if (k === MY_ANY_KEY) return;
    sessionStorage.removeItem(k);
    localStorage.removeItem(k);
  });
  localStorage.removeItem(MY_ANY_KEY);   // 读侧有 localStorage→sessionStorage 的迁移兜底，这里清掉避免回灌旧值
}
function myLogout() {
  ['myToken_male', 'myToken_female', MY_ANY_KEY].forEach((k) => {
    sessionStorage.removeItem(k);
    localStorage.removeItem(k);
  });
  localStorage.removeItem(MY_NAME_KEY());
  localStorage.removeItem(MY_ANY_NAME);
  chasePicked.clear();   // 换账号/退出后旧的多选暂存不能跟着新账号走
}

async function loadMy(signal) {
  const t = myToken();
  if (!t) { sessionExpired(); return; }
  /* 2026-10-19 用户口径「去掉头部的 MY」：「我的」页与子页不再显示这行英文标签。 */
  $('mhSub').textContent = '';
  try {
    /* 账号还没绑主播（历史遗留 bound=0 / person_id=0，2026-10-14）：
       绑定由管理员在后台做，前端没有自助入口，所以这里**仍然早退**出一张说明卡 ——
       不能「继续拉主数据」：未绑定账号 person_id=0，后端 /my 会回 admin:true，
       前端据此把推送/追分控件渲染成禁用态，抖音号绑定提交也会被后端硬拒
       （binds.rs「管理员账号缺少对应的主播档案」）。与其给一堆点不动的控件，
       不如直接说清楚去找管理员。
       token 由 api() 统一走 X-My-Token 头（2026-10-13），URL 不再带登录态。 */
    const who = await api('/api/public/teams/' + TEAM + '/my/who', { signal });
    if (who && who.needBind) { applyLoginState(who); renderBindCard(who); return; }
    /* 2026-10-18 契约 v2 §4.7：正常账号也要把 who 的身份标志回填进 meState
       （emailMask/needQq/mustChangePass/phone）—— 否则刚登录进「我的」页，
       QQ 邮箱行还是「去绑定」（登录响应只带了部分字段时）。只合字段、不动 TEAM/水印，
       避免把「全团账号」的视角切错（applyLoginState 会改 TEAM）。 */
    if (who && meState) {
      ['emailMask', 'email', 'needQq', 'needProfile', 'mustChangePass', 'phone',
        'personPhone', 'bound', 'switchable'].forEach((k) => {
        if (who[k] !== undefined) meState[k] = who[k];
      });
    }
    /* 主数据 + 三块附属数据并行拉：以前四个 await 串行，CPU 4x 下「我的/微信」
       切换光网络等待就多出约 300ms。附属接口失败仍各自兜底，不挡主数据。 */
    const optional = (p, fallback) => api(p, { signal }).catch((e) => {
      if (e && e.name === 'AbortError') throw e;  // 切页取消要向上传递，不能伪装成空数据
      return fallback;
    });
    const [d, series, push, accounts] = await Promise.all([
      api('/api/public/teams/' + TEAM + '/my', { signal }),
      optional('/api/public/teams/' + TEAM + '/my/series?days=14', null),
      optional('/api/public/teams/' + TEAM + '/my/push', null),
      optional('/api/public/teams/' + TEAM + '/my/accounts', { __err: true }),
    ]);
    myPersonId = Number(d.personId || 0) || null;
    renderMy(d, series, push, accounts);
    /* 「我的」页真头像兜底（2026-10-19）：个人页大头像 + 抖音号列表行都可能有图，
       裂图要回落首字/图标，不能留破图（与榜单 bindRows 同一套）。 */
    bindAvatarFallback();
    /* 📣 「我的」页公告条（2026-10-13）：renderMy 渲染完成后，placements.my 开着才追加。
       插在 view 内容最顶上（资料卡之前），图标默认 person。
       深链 /my/<sub> 直接落到子页时不挂（公告属于「我的」列表首页）。 */
    if (!mySub) renderMyAnnouncement(site && site.placements && site.placements.my);
    /* 📩 管理员消息探测（docs/23 §6.1）：主界面渲染完成后拉一次未读，有未读才弹。
       fire-and-forget：接口失败/无未读/token 过期一律静默（fetchMyMessages 内部兜底），
       绝不挡主数据；本次页面生命周期只自动弹一次（probeMyMessages 内部锁）。 */
    probeMyMessages().catch(() => {});
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    /* token 过期/没验证过 → 回登录门；其它错误照常显示错误态 */
    const m = String(e.message || '');
    if (m.indexOf('过期') >= 0 || m.indexOf('缺少') >= 0 || m.indexOf('请先登录') >= 0) {
      sessionExpired();
    } else {
      $('view').innerHTML = '<div class="empty"><span class="big">📵</span>取不到个人数据<br>' + esc(m) + '</div>';
    }
  }
}

/* ==================== 账号绑定主播（只由管理员在后台做，前端无自助入口） ====================
   用户口径（2026-10-14）：账号 → 主播姓名的绑定由后端/管理员处理，主播自己不绑。
   未绑定账号（历史遗留 bound=0 / person_id=0）仍能登录，但这里只出一张「联系管理员」的
   提示卡：前端不再调用 POST /api/public/my/bind 与 GET /api/public/my/bind/search。 */
function renderBindCard(who) {
  $('view').innerHTML = '<div class="section">' +
    '<div class="card my-bind">' +
      '<h2 class="card-t">账号未绑定主播</h2>' +
      /* 2026-10-14：后端 /my/who 已在服务端打码（mask_phone），这里不再二次 mask */
      '<div class="sub">账号 <b>' + esc(who.phone || who.name || '') +
        '</b> 还没有绑定对应的主播，所以看不到个人数据。</div>' +
      '<div class="warn">绑定主播由管理员在后台处理，你自己无法操作。<br>请联系管理员帅帅，让他在后台把你的账号绑到对应的主播上，绑定后即可正常使用。</div>' +
    '</div>' +

function renderMyLogin() {
  /* 全站有登录门后这里只是兜底（正常到不了）；文案保持与登录门一致 */
  const name = localStorage.getItem(MY_NAME_KEY()) || '';
  $('mhSub').textContent = '';
  $('view').innerHTML = '<div class="section my-login">' +
    '<div class="card card-pad">' +
    '<div class="big-av" style="background:' + avColor(LABEL()) + '">' + esc(LABEL().charAt(0)) + '</div>' +
    '<h3>' + esc(LABEL()) + ' · 我的数据</h3>' +
    '<p class="tip">账号由管理员添加<br>使用「手机号 / 艺名 + 密码」登录</p>' +
    '<input id="myName" placeholder="手机号 / 艺名" value="' + esc(name) + '" autocomplete="off">' +
    /* 2026-10-14：与登录门 gatePass 同口径 —— 密码是 4~20 位字母/数字（2026-10-17 起也允许点），
       inputmode="numeric" 只弹数字键盘、字母打不出来（设了字母密码就登不进来），删掉用默认键盘。 */
    /* 2026-10-17 第四轮审计 D 域 P3-4：与 gatePass 同口径，密码框 type="password"。 */
    '<input id="myPass" type="password" placeholder="密码" autocomplete="off">' +
    '<div class="form-err hidden" id="myErr"></div>' +
    '<button class="btn-main" id="myGo">查看我的数据</button>' +
    '</div></div>';
  const go = async () => {
    const nm = $('myName').value.trim();
    /* 契约 v2 §4.1：密码**不 trim**（与登录门同口径；首尾空格是密码的一部分） */
    const pw = $('myPass').value || '';
    const errEl = $('myErr');
    if (!nm || !pw) {
      errEl.textContent = '请输入账号和密码';
      errEl.classList.remove('hidden');
      return;
    }
    const btn = $('myGo');
    btn.disabled = true; btn.textContent = '验证中…';
    errEl.classList.add('hidden');
    try {
      const r = await fetch('/api/public/my/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account: nm, pass: pw }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      /* 2026-10-14：后端已区分「密码错误」和「账号还没开通」，这里优先显示后端下发的原因 d.error；
         后端仍有个别分支只回 {ok:false} 不带 error（台账查无此人、管理观看账号未通过等），回落到原兜底文案 */
      if (!d.ok) throw new Error(d.error || '账号或密码不对，或账号还没开通');
      sessionStorage.setItem(MY_ANY_KEY, d.token);
      localStorage.setItem(MY_NAME_KEY(), d.name || nm);
      toast('验证通过');
      loadMy();
    } catch (e) {
      btn.disabled = false; btn.textContent = '查看我的数据';
      errEl.textContent = e.message || '验证失败，稍后再试';
      errEl.classList.remove('hidden');
    }
  };
  $('myGo').onclick = go;
  $('myName').onkeydown = (e) => { if (e.key === 'Enter') $('myPass').focus(); };
  $('myPass').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

/** 我的抖音号卡（2026-10-22）：
    收益总览在卡顶，单个号默认收起；点开后看分号日 / 月 / 年 / 累计与两种到手口径。
    三条兜底不变：published:false → 整卡不渲染；summary.count=0 → 空态；
    accounts.__err → 灰字失败态，绝不让整页数据因为分号接口失败而消失。 */
function myAccountsCard(accounts) {
  if (!accounts || accounts.published === false) return '';
  const wave = (o) => o == null || o.wave == null ? '—' : wan(o.wave);
  const estOf = (o) => o == null || o.wave == null ? null : estYuan(o.wave);
  const cell = (label, o) => '<span class="acct-cell"><i>' + label + '</i><b>' + esc(wave(o)) + '</b></span>';
  if (accounts.__err) {
    return '<div class="st-my-acct">' +
      '<div class="sec"><span>我的抖音号</span></div>' +
      '<div class="fail">抖音号数据加载失败</div></div>';
  }
  const list = Array.isArray(accounts.accounts) ? accounts.accounts : [];
  const sum = accounts.summary || null;
  if (!sum || !Number(sum.count)) {
    return '<div class="st-my-acct">' +
      '<div class="sec"><span>我的抖音号</span></div>' +
      '<div class="none">还没有绑定抖音号，绑定后这里显示每个号的数据</div></div>';
  }
  const body = list.map((a) => {
    /* 没登记抖音号时退回采集 ID；主标题优先用抖音名称。 */
    const no = a.douyinNo
      ? String(a.douyinNo)
      : (a.anchorId ? 'ID ' + String(a.anchorId) : '');
    const title = (a.anchorName ? String(a.anchorName) : '') || no || '未登记抖音号';
    const lastDate = a.lastDate ? String(a.lastDate) : '';
    const dateShown = /^\d{4}-\d{2}-\d{2}$/.test(lastDate) ? lastDate.slice(5) : lastDate;
    const days = Number(a.days) > 0 ? Number(a.days) : 0;
    const meta = (no && a.anchorName ? no : (no ? '' : '未登记抖音号')) +
      (lastDate ? (no && a.anchorName ? ' · ' : '') + dateShown : '');
    const avName = String(a.anchorName || a.douyinNo || '?');
    const monthEst = estOf(a.monthly);
    const totalEst = estOf(a.total);
    const pct = a.primary
      ? '<span class="chip">主号</span>'
      : '';
    const copy = a.douyinNo
      ? '<button class="acct-copy" type="button" data-copy="' + esc(String(a.douyinNo)) + '">复制</button>'
      : '';
    return '<details class="acct-item">' +
      '<summary class="acct-summary" title="展开或收起账号明细">' +
        '<span class="acct-main">' +
          '<span class="ico' + (a.avatar ? ' has-img' : '') + '" data-n="' + esc(avName) + '">' +
            (a.avatar
              ? '<img data-av src="' + esc(a.avatar) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">'
              : '<span class="material-symbols-outlined">smart_display</span>') +
          '</span>' +
          '<span class="acct-id">' +
            '<span class="acct-titleline"><span class="t">' + esc(title) + '</span>' + pct +
              '<span class="st' + (a.liveToday ? ' on' : '') + '"><i></i>' +
                (a.liveToday ? '今日已开播' : '今日未开播') + '</span>' +
            '</span>' +
            '<span class="acct-sub">' + esc(meta || '暂无数据') + '</span>' +
          '</span>' +
        '</span>' +
        '<span class="acct-glance"><span class="g-l">本月预估</span><b>' +
          esc(yuanBig(monthEst)) + '</b></span>' +
        '<span class="material-symbols-outlined acct-chevron">expand_more</span>' +
      '</summary>' +
      '<div class="acct-detail">' +
        '<div class="acct-numberline"><span>抖音号</span><code>' +
          esc(no || '未登记') + '</code>' + copy + '</div>' +
        '<div class="acct-stats">' +
          cell('今日音浪', a.daily) + cell('本月音浪', a.monthly) +
          cell('本年音浪', a.yearly) + cell('累计音浪', a.total) +
        '</div>' +
        '<div class="acct-earnings">' +
          '<div class="acct-earn"><span>本月预计到手</span><b>' + esc(yuanBig(monthEst)) + '</b>' +
            '<small>' + (a.monthly && a.monthly.wave != null ? esc(wan(a.monthly.wave)) + ' 音浪' : '本月暂无数据') + '</small></div>' +
          '<div class="acct-earn"><span>累计预计到手</span><b>' + esc(yuanBig(totalEst)) + '</b>' +
            '<small>' + (a.total && a.total.wave != null ? '自有数据 ' + esc(wan(a.total.wave)) + ' 音浪' : '累计暂无数据') + '</small></div>' +
        '</div>' +
        '<div class="acct-note">' +
          (lastDate ? '最后有数据 ' + esc(dateShown) : '暂无数据日期') +
          (days ? ' · ' + days + ' 天有数据' : '') + '</div>' +
      '</div>' +
    '</details>';
  }).join('');
  const monthEst = sum.monthly == null ? null : estOf(sum.monthly);
  const totalEst = sum.total == null ? null : estOf(sum.total);
  return '<div class="st-my-acct">' +
    '<div class="sec"><span>我的抖音号</span><span class="n">共 ' + Number(sum.count) + ' 个 · 点击展开明细</span></div>' +
    '<div class="fee-note">' + esc(earningsNote()) + '</div>' +
    '<div class="acct-overview">' +
      '<div class="acct-kpi"><span>本月预计到手</span><b>' + esc(yuanBig(monthEst)) + '</b>' +
        '<small>' + (sum.monthly && sum.monthly.wave != null ? '合计 ' + esc(wan(sum.monthly.wave)) + ' 音浪' : '音浪数据未展示') + '</small></div>' +
      '<div class="acct-kpi"><span>累计预计到手</span><b>' + esc(yuanBig(totalEst)) + '</b>' +
        '<small>' + (sum.total && sum.total.wave != null ? esc(wan(sum.total.wave)) + ' 音浪' : '音浪数据未展示') + '</small></div>' +
    '</div>' + body + '</div>';
}

function renderMy(d, series, push, accounts) {
  accounts = accounts || null;
  /* 收益口径（2026-10-19）：/my 与 /my/accounts 都带 earnings，两处同源；
     取 /my 的为主，它没带（老后端 / 接口失败）时退回抖音号卡那份。 */
  applyEarnings((d && d.earnings) || (accounts && accounts.earnings));
  if (d.name) {
    localStorage.setItem(MY_NAME_KEY(), d.name);
    /* 水印口径（2026-10-11）：手机号优先（打码），无手机号回退艺名。
       my 数据接口不带 phone，手机号从登录态 meState 取，避免被艺名覆盖。
       2026-10-14：meState.phone 已是后端打码值，这里不再二次 mask。 */
    const wmPhone = meState && meState.phone;
    applyWatermark(wmPhone || d.name);
  }
  pushState = push || null;
  /* 时长口径统一走 minFmt（x时x分，不要秒），与榜单 / 领奖台一致 */
  const minText = (v) => v == null ? '' : '时长 ' + minFmt(v);
  const stat = (label, o, prevLabel) => '<div class="my-stat"><div class="l">' + label + '</div>' +
    '<div class="w">' + (o.wave == null ? '—' : wan(o.wave)) +
    (o.wave == null || o.prevWave == null ? '' :
      ' <span class="pv" title="较' + esc(prevLabel) + (o.prevWave === 0 ? '无数据' : ' ' + wan(o.prevWave)) + '">' +
      waveDelta(o.wave, o.prevWave) + '</span>') +
    '</div>' +
    (o.minutes == null ? '' : '<div class="m">' + minText(o.minutes) + '</div>') + '</div>';
  /* 未播口径与榜单一致：当日音浪 < 2 = 未开播 */
  const offToday = d.daily && d.daily.wave != null && d.daily.wave < 2;
  /* 近 14 个业务日趋势：条形图，未播（<3）置灰 */
  let trend = '';
  const waves = series && series.waves;
  if (Array.isArray(waves) && waves.length) {
    const max = Math.max.apply(null, waves.concat([1]));
    const bars = waves.map((w, i) =>
      '<div class="b' + (w < 2 ? ' off' : '') + '" style="height:' +
      Math.max(4, Math.round(w / max * 100)) + '%" title="' +
      esc((series.dates[i] || '').slice(5)) + ' · ' + wan(w) + '"></div>').join('');
    const xs = '<span>' + esc((series.dates[0] || '').slice(5)) + '</span>' +
      '<span></span>'.repeat(Math.max(0, waves.length - 2)) +
      '<span style="text-align:right">' + esc((series.dates[waves.length - 1] || '').slice(5)) + '</span>';
    trend = '<div class="card my-trend"><h2 class="card-t">近 ' + waves.length + ' 个业务日音浪</h2>' +
      '<div class="bars">' + bars + '</div><div class="xs">' + xs + '</div></div>';
  }
  /* Stitch 版我的页：资料卡 → 大数字卡 → Grouped List */
  /* 副标题（2026-10-12）：「团名 · 师承【师傅】」。masterName 是 /my 接口字段（没有师傅 = null，
     整段只显示团名）；原「日期 · 未开播」挪到大数字卡「预估折合收益」行尾，信息不丢 */
  const head = '<div class="st-my-head">' +
    '<div class="st-my-av' + (d.avatar ? ' has-img' : '') + '">' +
      (d.avatar
        ? '<img data-av src="' + esc(d.avatar) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">'
        : esc(String(d.name || '?').charAt(0))) +
      '<span class="badge"><span class="material-symbols-outlined">verified</span></span>' +
    '</div>' +
    '<div style="flex:1;min-width:0">' +
      '<div style="display:flex;align-items:center;gap:.375rem"><span class="nm">' + esc(d.name || '—') + '</span>' +
      '<span class="tag">主账号</span></div>' +
      '<div class="sub">' + esc(LABEL()) + (d.masterName ? ' · 师承【' + esc(d.masterName) + '】' : '') + '</div>' +
    '</div>' +
  '</div>';

  const m = d.monthly || {};
  const t = d.total || {};
  const y = d.yearly || {};
  const dd = d.daily || {};
  const monthEst = Number.isFinite(Number(m.yuan)) ? Number(m.yuan) : estYuan(m.wave);
  const totalEst = estYuan(t.wave);
  const totalWave = t.wave == null ? null : Number(t.wave);
  const dataDate = d.date ? String(d.date) : '';
  const dataDateShown = /^\d{4}-\d{2}-\d{2}$/.test(dataDate) ? dataDate.slice(5) : dataDate;
  const feeBits = earningsCfg.sharePct + '% 分成' +
    (earningsCfg.feePct > 0 ? ' · 扣 ' + earningsCfg.feePct + '% 税' : '');
  /* 本月和上月同期都换成人民币再比，避免用户自己再算一遍分成 / 税费。 */
  const monthCmp = (() => {
    if (monthEst == null || m.prevWave == null || Number(m.prevWave) <= 0) {
      return '<span>暂无上月同期数据</span>';
    }
    const prevEst = estYuan(m.prevWave);
    if (prevEst == null) return '<span>暂无上月同期数据</span>';
    const diff = monthEst - prevEst;
    if (Math.abs(diff) < 0.005) return '<span>与上月同期持平</span>';
    const up = diff > 0;
    const pct = Math.round(Math.abs(diff) / prevEst * 1000) / 10;
    return '<span class="delta ' + (up ? 'd-up' : 'd-down') + '">' +
      (up ? '↑' : '↓') + esc(yuanBig(Math.abs(diff))) + ' · ' +
      (up ? '+' : '-') + pct + '%</span><span>较上月同期</span>';
  })();
  /* 音浪仍保留三条同期对照，作为收益主卡的第二层数据，不再抢占第一行。 */
  const cmpRow = (icon, label, o, prevLabel) => {
    if (!o || o.wave == null) return '';
    const delta = (o.prevWave == null || o.prevWave === 0) ? ''
      : ' <span class="pv">' + waveDelta(o.wave, o.prevWave) + '</span>';
    const pctTag = (o.prevWave != null && o.prevWave > 0)
      ? '<span class="st-cmp-pct">' + (o.wave >= o.prevWave ? '+' : '') +
        Math.round((o.wave - o.prevWave) / o.prevWave * 1000) / 10 + '%</span>' : '';
    return '<div class="st-cmp-row"><span class="material-symbols-outlined">' + icon + '</span>' +
      '<span class="cl">' + label + '</span>' +
      '<span class="cv">' + wan(o.wave) + delta + '</span>' + pctTag +
      '<span class="cp">' + prevLabel + '</span></div>';
  };
  const big = '<div class="st-my-big">' +
    '<div class="earn-head"><div>' +
      '<div class="earn-kicker"><span class="material-symbols-outlined">monetization_on</span>' +
        '<span>累计预计到手</span></div>' +
      '<div class="earn-main">' + esc(yuanBig(totalEst)) + '</div>' +
      '<div class="earn-caption">基于自有数据累计折算 · 实际提现以平台结算为准</div>' +
    '</div><span class="earn-pill">' + esc(feeBits) + '</span></div>' +
    '<div class="earn-grid">' +
      '<div class="earn-kpi"><span>本月预计到手</span><b>' + esc(yuanBig(monthEst)) + '</b>' +
        '<small>' + monthCmp + '</small></div>' +
      '<div class="earn-kpi"><span>自有数据累计音浪</span><b>' +
        (totalWave == null ? '—' : esc(wan(totalWave))) + '</b>' +
        '<small>' + (dataDateShown ? '截至 ' + esc(dataDateShown) : '暂无数据日期') + '</small></div>' +
    '</div>' +
    '<div class="wave-block"><div class="wave-title">' +
      '<span class="material-symbols-outlined">functions</span><span>音浪对比</span></div>' +
      cmpRow('today', '今日音浪', dd, '比上日') +
      cmpRow('calendar_month', '本月音浪', m, '比上月同期') +
      cmpRow('functions', '本年累计', y, '比去年同期') +
    '</div>' +
  '</div>';

  /* 推送状态走 /my/push 的真实字段（后端没有 configured 这个键）：
     bound=已对接可推送；scanBound+needActivate=扫了码还没等微信确认（2026-10-17 起归入未完成态）。 */
  /* 2026-10-13 用户口径：只接微信推送，不显示 QQ。
     2026-10-15 任务二：三态文案抽成 pushStatusText(p)（2026-10-17 后只剩「我的」列表页这一处使用）。 */
  const pushStatus = pushStatusText(push);

  $('view').innerHTML = '<div class="section tab-content-enter">' +
    head + big + trend + myAccountsCard(accounts) +
    '<div class="st-my-list">' +
      '<div class="sec">系统服务与偏好</div>' +
      '<div class="st-my-item" id="myPushRow" style="cursor:pointer"><div class="l"><div class="ico"><span class="material-symbols-outlined">notifications</span></div>' +
      '<div style="min-width:0"><div class="t">消息设置</div>' +
      '<div class="d">微信机器人对接与推送开关</div></div></div>' +
      '<div class="r"><span>' + esc(pushStatus) + '</span>' +
      '<span class="material-symbols-outlined">chevron_right</span></div></div>' +
      '<div class="st-my-item" id="myChaseRow" style="cursor:pointer"><div class="l"><div class="ico"><span class="material-symbols-outlined">flag</span></div>' +
      '<div style="min-width:0"><div class="t">追分设置</div>' +
      '<div class="d">追人 · 定目标分，进度变化 wxbot 私聊提醒</div></div></div>' +
      '<div class="r"><span>' + esc(chaseSummary(push)) + '</span>' +
      '<span class="material-symbols-outlined">chevron_right</span></div></div>' +
      '<div class="st-my-item" id="myEmailRow" style="cursor:pointer">' +
      '<div class="l"><div class="ico"><span class="material-symbols-outlined">mail</span></div>' +
      '<div style="min-width:0"><div class="t">QQ 邮箱</div>' +
      '<div class="d">忘记密码时，临时密码发到这个邮箱</div></div></div>' +
      /* 2026-10-18 契约 v2 §4.7：只显示服务端脱敏 emailMask；未绑显示「去绑定」（主色） */
      '<div class="r">' + (meState && meState.emailMask
        ? '<span>' + esc(meState.emailMask) + '</span>'
        : '<span class="pri">去绑定</span>') +
      '<span class="material-symbols-outlined">chevron_right</span></div></div>' +
      '<div class="st-my-item" id="myForgot" style="cursor:pointer">' +
      '<div class="l"><div class="ico"><span class="material-symbols-outlined">lock_reset</span></div>' +
      '<div class="t">重置密码</div></div>' +
      '<div class="r"><span class="material-symbols-outlined">chevron_right</span></div></div>' +
      '<div class="st-my-item" id="myAbout" style="cursor:pointer"><div class="l"><div class="ico"><span class="material-symbols-outlined">info</span></div>' +
      '<div class="t">关于系统与内部版本</div></div>' +
      '<div class="r"><span>v7.10-FINAL</span></div></div>' +
    '</div>' +
    /* 联系运营卡（2026-10-12）：项目里没有私信通道，按钮只给微信联系方式提示 */
    '<div class="st-my-ops">' +
      '<div class="st-my-ops-av">帅</div>' +
      '<div style="flex:1;min-width:0"><div class="t">遇到问题？请私信帅帅</div>' +
      '<div class="d">运营专员在线 · 快速协助排查核算</div></div>' +
      '<button class="st-my-ops-btn" id="myOps">' +
      '<span class="material-symbols-outlined">chat</span>立即私信</button>' +
    '</div>' +
    /* 不再按 push 有无渲染：接口失败也落地一张带重试的卡，
       保住「点那一行有东西可滚」这个最基本的行为 */
    pushCard(push) +
    /* 「追分设置」独立卡（2026-10-13 用户口径）：与推送卡分开，
       追分目标表单只出现在这张卡里，推送卡只管绑定与开关 */
    chaseCard(push) +
    '<button class="my-logout" id="myOut">退出登录</button>' +
  '</div>';
  $('myOut').onclick = () => {
    myLogout();
    removeWatermark();
    location.reload();   // 回登录门
  };
  $('myOps').onclick = () => {
    /* 没有站内私信通道（运营在微信里），这里只指路不跳转 */
    toast('请直接在微信里联系帅帅');
  };
  /* 我的抖音号（2026-10-22）：summary 负责展开 / 收起，复制只放在展开后的明确按钮上，
     避免原来「想展开却复制了抖音号」的误触。 */
  document.querySelectorAll('.st-my-acct .acct-copy[data-copy]').forEach((btn) => {
    btn.onclick = async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const no = btn.dataset.copy || '';
      if (!no) return;
      try {
        if (!navigator.clipboard) throw new Error('clipboard unavailable');
        await navigator.clipboard.writeText(no);
        toast('已复制抖音号');
      } catch (_) {
        toast('复制失败，请手动复制');
      }
    };
  });
  $('myForgot').onclick = () => {
    /* 2026-10-15 契约 A：入口「重置密码」——登录态下直接换新密码，
       不需要旧密码（POST /api/public/my/password，身份只认 X-My-Token 头，
       body 只有 {newPass}）。成功后后端吊销全部旧 token 并下发新 token，
       由对话框负责覆盖本地登录态。 */
    openMyPwdDlg();
  };
  /* 2026-10-18 契约 v2 §4.4：我的页常驻入口，与登录后 nudge 共用同一个弹窗 */
  $('myEmailRow').onclick = () => { openQqDlg({ source: 'my' }); };
  /* 列表两行滚到页内对应的操作卡：绑定行 → 绑定/审计卡，推送行 → 推送卡。
     卡片是异步渲染的（my / series / claim / push / accounts 五个请求回来才拼 DOM），
     所以找不到目标时短轮询等一下再滚，而不是静默 return 让用户以为点了没反应。 */
  const scrollToCard = (id) => {
    let tries = 0;
    const attempt = () => {
      const el = id && $(id);
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return true; }
      if (++tries > 20) {   // 最多等 ~1s（50ms × 20），超过就当这张卡真的不显示
        toast('功能加载中，稍等一下再点');
        return false;
      }
      setTimeout(attempt, 50);
      return false;
    };
    attempt();
  };
  /* 列表行 → 子页（2026-10-13 用户口径）：下一页式（/my/<sub>，带返回按钮），
     不再是页内滚动。内容由 renderMySub 从本页已加载的数据就地组装。 */
  /* 2026-10-14：myPrivacy 行已删除，对应 onclick 一并移除
     （$() 找不到元素会返回 null，留着赋值会 TypeError 白屏）。 */
  $('myAbout').onclick = () => { mySub = 'about'; pushRoute(); renderMySub(); };
  $('myPushRow').onclick = () => { mySub = 'wechat'; pushRoute(); renderMySub(); };
  $('myChaseRow').onclick = () => { mySub = 'chase'; pushRoute(); renderMySub(); };
  renderPushBox(push);
  /* 「追分设置」独立卡（2026-10-13）：**这里绝不能再补一次 renderChaseBox**（2026-10-15 task-7）。
     renderPushBox → bindPushBox 末尾已经 renderChaseBox + bindChaseHandlers；在这里再渲染一次
     只会把 #chaseBox 的 innerHTML 整体换新，把刚绑好的 onclick/keydown 连同旧节点一起丢掉 ——
     真机上「添加目标分数」「批量添加」点不动、搜索不出候选就是这个二次渲染造成的。
     追分卡是常驻 DOM（renderMy 每次都整页重建 .section），任何路径进来都已经有内容，不需要兜底。 */
  /* 深链 /my/<sub> 直接落到子页；/my 停在列表首页。
     首页只显示：头部/数据卡/服务列表/运营卡——绑定表单、推送设置等重卡只在子页出现。 */
  if (mySub) { renderMySub(); }
  else {
    history.replaceState(null, '', '/my');
    ['myPushCard', 'myChaseCard'].forEach((id) => { const el = $(id); if (el) el.hidden = true; });
  }
  /* 兜底卡的重试按钮：重新拉一次 /my/push，成功就换成正常内容
     （推送卡与追分卡都会跟着刷新；chaseRetry 由 bindChaseRetry 单独绑） */
  const retry = $('pushRetry');
  if (retry) {
    retry.onclick = async () => {
      retry.disabled = true;
      retry.textContent = '重试中…';
      try {
        renderPushBox(await fetchPush());
      } catch (e) {
        retry.disabled = false;
        retry.textContent = '重试';
        toast(e.message || '还是没取到');
      }
    };
  }
  bindChaseRetry();
}

/* ==================== 「我的」子页（2026-10-13 下一页式路由） ==================== */
/* 子页清单：id 元素映射 —— 列表首页的一行 ↔ 子页里要显示的那张卡 */
const MY_SUB_CARDS = {
  /* 契约 C（2026-10-15）：原「推送机器人服务」升级为「消息设置」（微信对接 +
     推送开关 + 追分设置入口）。push 保留为兼容别名：老链接 /my/push 与
     新链接 /my/wechat 打开的是同一张卡。 */
  wechat:  { title: '消息设置',         card: 'myPushCard' },
  push:    { title: '消息设置',         card: 'myPushCard' },
  chase:   { title: '追分设置',         card: 'myChaseCard' },
};
const MY_SUB_INFO = {
  privacy: { title: '隐私与对外展示字段', icon: 'visibility' },
  about:   { title: '关于系统与内部版本', icon: 'info' },
};

/* 进入 /my/<mySub>：整页只留「返回栏 + 目标内容」，回列表用返回按钮/浏览器返回。 */
function renderMySub() {
  /* 修复6①：原代码 const view = $('view') 遮蔽了全局 view（let view = 'data'），
     `view !== $('view')` 是恒真的死判断（同一次取值当然相等）——整段删除。
     后面统一用局部名 v，不与全局 view 撞名。 */
  const v = $('view');
  if (!v) return;
  /* 进/出「我的」子页都先同步底栏选中态（2026-10-15 task-11）：
     切到 /my/wechat 时底栏高亮「微信对接」，回列表首页时高亮「我的」。 */
  syncNavActive();
  if (!mySub) { showMyHome(); return; }
  const sub = mySub;
  /* 修复6②：信息型子页要显示 myInfoCard，卡片型子页要隐藏它——
     否则从 privacy/about 切到 bind/push 时旧的信息卡会叠在目标卡上。
     在这里统一处理（原实现只在 showMyHome 里隐藏，方向反了就漏）。 */
  const info = $('myInfoCard');
  if (info) info.hidden = !MY_SUB_INFO[sub];
  /* 直接子节点按块分组：保留目标卡，其余全部隐藏 */
  const keep = [];
  if (MY_SUB_CARDS[sub]) keep.push(MY_SUB_CARDS[sub].card);
  /* 遍历 v 的块级孩子，把不属于目标卡的都藏起来 */
  /* .section 内逐块控制：首页块（概览/数据大卡/趋势/账号/服务列表/运营卡）藏，
     目标卡（myPushCard / myChaseCard）显。 */
  const sec = v.querySelector('.section');
  if (sec) {
    Array.from(sec.children).forEach((blk) => {
      if (keep.includes(blk.id)) { blk.hidden = false; return; }
      blk.hidden = true;
    });
  }
  /* 顶部返回栏 */
  const meta = MY_SUB_CARDS[sub] || MY_SUB_INFO[sub];
  let bar = $('mySubBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'mySubBar';
    bar.className = 'st-my-subbar';
    v.insertBefore(bar, v.firstChild);
  } else if (bar.parentElement !== v) {
    v.insertBefore(bar, v.firstChild);
  }
  bar.hidden = false;
  bar.innerHTML = '<button class="st-my-back" id="mySubBack">' +
    '<span class="material-symbols-outlined">arrow_back</span>返回</button>' +
    '<div class="t">' + esc(meta.title) + '</div>';
  $('mySubBack').onclick = () => {
    /* 修复5：返回用 history.back()（popstate 已统一处理 mySub 切换），
       不再 pushState('/my') —— 否则每进一次子页历史就多一条，返回键要按很多下。
       深链直达（栈里上一条不是本站 /my，或根本没有历史）时 back() 会离开站点，
       此时降级为 pushState('/my') 原地回列表首页。 */
    mySub = null;
    if (document.referrer && history.length > 1) {
      history.back();
    } else {
      history.pushState(null, '', '/my');
      showMyHome();
    }
  };
  /* 无卡片的信息型子页（隐私/关于）：就地渲染内容卡
     （修复6③：MY_SUB_INFO 定义里本就没有卡片键，!MY_SUB_CARDS[sub] 是恒真判断，
     保留只是噪音——改为直接判 MY_SUB_INFO[sub]） */
  if (MY_SUB_INFO[sub]) {
    let card = $('myInfoCard');
    if (!card) {
      card = document.createElement('div');
      card.id = 'myInfoCard';
      card.className = 'st-my-list';
      v.appendChild(card);
    }
    card.hidden = false;
    card.innerHTML = '<div class="sec">' + esc(meta.title) + '</div><div style="padding:0 1rem 1rem">' +
      (sub === 'privacy'
        ? '<div class="sub" style="line-height:1.8">对外展示口径：榜单与分组里只显示主播<b>艺名</b>；' +
          '手机号仅用于登录与微信推送，不在任何页面公开展示。推送图上的水印只压收件人艺名，' +
          '用于数据溯源。绑定审计提交的抖音号截图仅管理员可见。</div>'
        : '<div class="sub" style="line-height:1.8">主播数据日报 · 内部系统 v7.10-FINAL。<br>' +
          '数据每晚 24:00 后入库前一天；推送图带收件人专属隐形水印（可溯源）。' +
          '遇到问题请在「我的」页联系运营帅帅。</div>') +
      '</div>';
  }
  /* 进入 / 回到微信对接子页：已有有效二维码就恢复轮询，没有就自动取一张。 */
  if (sub !== 'wechat') {
    clearWxDock();
    clearPushCodeTimer();
    wxDockAutoAttempted = false;
    wxDockForceQr = false;
  }
  setQrWatermarkHidden(sub === 'wechat');
  if (sub === 'wechat') autoStartWxDock(pushState);
  /* 滚回顶部（进子页的第一屏） */
  window.scrollTo({ top: 0 });
}

/* 回「我的」列表首页：恢复所有块，再把只在子页出现的重卡藏起来 */
function showMyHome() {
  const v = $('view');
  if (!v) return;
  setQrWatermarkHidden(false);
  /* 离开微信对接子页：停掉 2 秒轮询 / 倒计时，二维码 URL 保留，回来时若未过期直接恢复。 */
  clearWxDock();
  clearPushCodeTimer();
  wxDockAutoAttempted = false;
  wxDockForceQr = false;
  const bar = $('mySubBar');
  if (bar) bar.hidden = true;
  const info = $('myInfoCard');
  if (info) info.hidden = true;
  const sec = v.querySelector('.section');
  if (sec) Array.from(sec.children).forEach((blk) => { blk.hidden = false; });
  ['myPushCard', 'myChaseCard'].forEach((id) => { const el = $(id); if (el) el.hidden = true; });
}

/* ==================== 「我的」页内：改密对话框（2026-10-15 契约 A；2026-10-18 契约 v2 §4.8） ====================
   已登录身份下自己改密码，不需要旧密码；也用于「临时密码登录后改密」提示层的入口
   （opts.force=true：标题/说明换口径、去掉「取消」、点遮罩与 Esc 都不关、留「退出登录」逃生口）。
   接口：POST /api/public/my/password  Headers: X-My-Token
     Body: {"newPass":"..."} → 200 {ok:true, token, mustChangePass:false}；400 {code,error}；401
   成功后后端吊销全部旧 token：必须用响应 token 覆盖本地登录态（setMyToken），否则立刻被踢回登录门。
   密码规则（2026-10-18 用户口径）：4~64 个字符，允许中英文/特殊字符/任何符号，**不 trim**（首尾空格是密码的一部分）。 */
function openMyPwdDlg(opts) {
  opts = opts || {};
  const force = !!opts.force;
  const old = $('myPwdMask');
  if (old) old.remove();   // 防重复弹层
  const mask = document.createElement('div');
  mask.id = 'myPwdMask';
  mask.style.cssText = 'position:fixed;inset:0;z-index:96;background:rgba(11,28,48,.45);' +
    'display:flex;align-items:center;justify-content:center;padding:20px;';
  mask.innerHTML = '<div class="gate-box dlg-box" style="max-width:360px">' +
    '<h3>' + (force ? '请设置新密码' : '重置密码') + '</h3>' +
    '<p class="tip">' + (force
      ? '你正在用临时密码登录，请先设置自己的登录密码。<br>设置后其他设备上的登录会退出。'
      : '直接设置一个新的登录密码，不需要旧密码。<br>改完旧的登录凭证立即失效，本机会自动换成新登录态，不用重新登录。') +
    '</p>' +
    '<input id="myPwdNew" type="password" placeholder="' + PASS_RULE + '" autocomplete="new-password">' +
    '<input id="myPwdNew2" type="password" placeholder="确认新密码" autocomplete="new-password">' +
    '<div class="form-hint">支持中英文、数字和任意符号；首尾空格也算密码的一部分</div>' +
    '<div class="form-err hidden" id="myPwdErr"></div>' +
    '<div class="btn-row">' +
      (force ? '' : '<button class="go gray" id="myPwdCancel">取消</button>') +
      '<button class="go" id="myPwdGo">' + (force ? '保存新密码' : '重置密码') + '</button></div>' +
    (force ? '<button class="gate-link-plain" id="myPwdOut">退出登录</button>' : '') +
    '</div>';
  document.body.appendChild(mask);
  lockScroll();
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey);
    mask.remove();
    unlockScroll();
  };
  const onKey = (e) => { if (e.key === 'Escape' && !force) close(); };
  document.addEventListener('keydown', onKey);
  mask.addEventListener('click', (e) => { if (e.target === mask && !force) close(); });
  if (!force) $('myPwdCancel').onclick = close;
  else $('myPwdOut').onclick = () => { close(); myLogout(); removeWatermark(); location.reload(); };
  ['myPwdNew', 'myPwdNew2'].forEach((id) => {
    $(id).onkeydown = (e) => { if (e.key === 'Enter') $('myPwdGo').click(); };
  });
  setTimeout(() => { const el = $('myPwdNew'); if (el) el.focus(); }, 60);
  $('myPwdGo').onclick = async () => {
    const newPass = $('myPwdNew').value || '';   // 契约 v2 §4.8：不 trim
    const newPass2 = $('myPwdNew2').value || '';
    const errEl = $('myPwdErr');
    const fail = (m) => {
      errEl.textContent = m;
      errEl.classList.remove('hidden');
    };
    errEl.classList.add('hidden');
    /* 前端先校验（与后端 validate_my_password 同口径）：不满足直接提示，不发请求 */
    if (!isValidPass(newPass)) return fail(PASS_RULE);
    if (newPass !== newPass2) return fail('两次输入的新密码不一致');
    const btn = $('myPwdGo');
    const i1 = $('myPwdNew'), i2 = $('myPwdNew2');
    btn.disabled = true; btn.textContent = '提交中…';
    i1.disabled = true; i2.disabled = true;
    try {
      const d = await postJson('/api/public/my/password', { newPass: newPass }, { auth: true });
      if (d && d.token) setMyToken(d.token);   // 后端已吊销全部旧 token
      /* 改密成功 → 清除「临时密码」标记（契约 §4.6/§4.8） */
      if (meState) meState.mustChangePass = false;
      close();
      toast(force ? '密码已修改' : '密码已重置');
      refreshWho().catch(() => {});   // 重拉身份，needQq/mustChangePass 与服务端对齐
      if (typeof opts.after === 'function') { try { opts.after(); } catch (_) {} }
    } catch (e) {
      if (e.code === 'UNAUTHORIZED') { close(); sessionExpired(); return; }
      btn.disabled = false; btn.textContent = force ? '保存新密码' : '重置密码';
      i1.disabled = false; i2.disabled = false;
      fail(apiErrText(e) || '重置失败，稍后再试');
    }
  };
}

/* ==================== 绑定 / 修改 / 解绑 QQ 邮箱（契约 v2 §4.4/§4.7 / §3.4） ====================
   登录后的 nudge 与「我的」页的 QQ 邮箱行共用同一个弹窗（source: 'nudge' | 'my'）。
   接口：POST /api/public/my/email  {"qq":"12345678"}；{"qq":""} = 解绑
     200 {ok:true, emailMask:"123***@qq.com"}；400 INVALID_QQ / QQ_TAKEN / NEED_PROFILE；401
   2026-10-18 用户口径：同一 QQ 不能绑多个账号；没有 QQ 邮箱的找管理员。
   脱敏只用服务端 emailMask 回填，**不用输入原值**拼显示。 */
function openQqDlg(opts) {
  opts = opts || {};
  const source = opts.source === 'nudge' ? 'nudge' : 'my';
  const current = (meState && (meState.emailMask || meState.email || '')) || '';
  const dlg = makeDialog('qqMask', '');
  const box = dlg.box;
  const failEl = () => $('qqErr');

  const applyResult = (d, qq, bound) => {
    const maskTxt = bound ? ((d && d.emailMask) || maskQq(qq)) : '';
    if (meState) {
      meState.emailMask = maskTxt;
      meState.email = maskTxt;
      meState.needQq = bound ? false : true;
    }
    dlg.close();
    toast(bound ? (current ? 'QQ 邮箱已更新' : 'QQ 邮箱已绑定')
      : 'QQ 邮箱已解绑，忘记密码请联系管理员');
    if (source === 'my' || view === 'my') { try { loadMy(); } catch (_) {} }
  };

  const submit = async (qq) => {
    const btn = $('qqGo');
    const errEl = failEl();
    const fail = (m) => { if (errEl) { errEl.textContent = m; errEl.classList.remove('hidden'); } };
    errEl.classList.add('hidden');
    if (!isValidQq(qq)) return fail('QQ 号应为 5~12 位数字，且不能以 0 开头');
    btn.disabled = true; btn.textContent = '绑定中…';
    const input = $('qqIn');
    if (input) input.disabled = true;
    try {
      const d = await postJson('/api/public/my/email', { qq: qq }, { auth: true });
      applyResult(d, qq, true);
    } catch (e) {
      if (e.code === 'UNAUTHORIZED') { dlg.close(); sessionExpired(); return; }
      btn.disabled = false; btn.textContent = current ? '保存' : (source === 'nudge' ? '立即绑定' : '绑定');
      if (input) input.disabled = false;
      if (e.code === 'NEED_PROFILE') { dlg.close(); renderProfileGuide(meState || {}); return; }
      fail(apiErrText(e) || '保存失败，稍后再试');
    }
  };

  const renderUnbindConfirm = () => {
    box.innerHTML =
      '<button class="dialog-close" id="qqX2" aria-label="关闭"><span class="material-symbols-outlined">close</span></button>' +
      '<h3>解绑 QQ 邮箱</h3>' +
      '<div class="warn-box">解绑后，忘记密码将无法自助重置，只能联系管理员帅帅在后台重置。<br>确定要解绑吗？</div>' +
      '<div class="btn-row"><button class="go gray" id="qqUnbindCancel">取消</button>' +
      '<button class="go" id="qqUnbindOk" style="background:#F43F5E">仍要解绑</button></div>';
    $('qqX2').onclick = dlg.close;
    $('qqUnbindCancel').onclick = renderMain;
    $('qqUnbindOk').onclick = async () => {
      const btn = $('qqUnbindOk');
      btn.disabled = true; btn.textContent = '解绑中…';
      try {
        const d = await postJson('/api/public/my/email', { qq: '' }, { auth: true });
        applyResult(d, '', false);
      } catch (e) {
        if (e.code === 'UNAUTHORIZED') { dlg.close(); sessionExpired(); return; }
        btn.disabled = false; btn.textContent = '仍要解绑';
        const errEl = document.createElement('div');
        errEl.className = 'form-err';
        errEl.textContent = apiErrText(e) || '解绑失败，稍后再试';
        btn.parentNode.parentNode.appendChild(errEl);
      }
    };
  };

  const renderMain = () => {
    box.innerHTML =
      '<button class="dialog-close" id="qqX" aria-label="关闭"><span class="material-symbols-outlined">close</span></button>' +
      '<h3>' + (current ? '修改 QQ 邮箱' : '绑定 QQ 邮箱') + '</h3>' +
      '<p class="tip">' + (source === 'nudge'
        ? '绑定后忘记密码可以自助重置，临时密码会发到你的 QQ 邮箱。<br>没有 QQ 邮箱？请联系管理员帅帅。'
        : '忘记密码时，临时密码会发到这个 QQ 邮箱。<br>没有 QQ 邮箱？请联系管理员帅帅。') + '</p>' +
      (current ? '<div class="field-label">当前绑定</div>' +
        '<input class="dlg-readonly" value="' + esc(current) + '" readonly autocomplete="off">' : '') +
      '<div class="field-label">QQ 号</div>' +
      '<div class="qq-wrap"><input id="qqIn" inputmode="numeric" maxlength="12" placeholder="QQ 号" autocomplete="off">' +
        '<span class="qq-suffix">@qq.com</span></div>' +
      '<div class="qq-preview" id="qqPreview">将绑定：你的 QQ 邮箱</div>' +
      '<div class="form-err hidden" id="qqErr"></div>' +
      '<div class="btn-row">' +
        (source === 'nudge' ? '<button class="go gray" id="qqLater">以后再说</button>'
          : '<button class="go gray" id="qqCancel">取消</button>') +
        '<button class="go" id="qqGo">' + (current ? '保存' : (source === 'nudge' ? '立即绑定' : '绑定')) + '</button>' +
      '</div>' +
      (current ? '<div style="text-align:right;margin-top:12px">' +
        '<button class="link-danger" id="qqUnbind">解绑 QQ 邮箱</button></div>' : '');
    $('qqX').onclick = dlg.close;
    if ($('qqLater')) $('qqLater').onclick = dlg.close;   // 写冷却：markQqNudged 在弹出时已记一次
    if ($('qqCancel')) $('qqCancel').onclick = dlg.close;
    const input = $('qqIn');
    const syncPreview = () => {
      const q = String(input.value || '').replace(/\D/g, '').replace(/^0+/, '').slice(0, 12);
      input.value = q;
      $('qqPreview').textContent = isValidQq(q) ? '将绑定：' + q + '@qq.com' :
        (q ? 'QQ 号应为 5~12 位数字，且不能以 0 开头' : '将绑定：你的 QQ 邮箱');
    };
    input.addEventListener('input', () => { failEl().classList.add('hidden'); syncPreview(); });
    input.onkeydown = (e) => { if (e.key === 'Enter') $('qqGo').click(); };
    setTimeout(() => { try { input.focus(); } catch (_) {} }, 60);
    $('qqGo').onclick = () => submit(String(input.value || '').trim());
    if ($('qqUnbind')) $('qqUnbind').onclick = renderUnbindConfirm;
  };

  renderMain();
}

/* 追分设置入口行的右侧摘要（2026-10-12：没开追分开关 = 关；开了看目标数）。
   2026-10-15 任务一：未绑定不再返回「未绑定」装禁用 —— 后端 POST /my/push/targets
   本就不校验绑定状态，未绑定也能设目标，摘要要反映真实状态：
   · p 为 null（接口失败）→ 维持「未绑定」（真的什么状态都拿不到）；
   · 未绑定 → 「未绑定微信 · N 个目标 / 未绑定微信 · 未设目标」；
   · 已绑定 → 按既有口径：没开追分开关 = 关；开了看目标数。 */
function chaseSummary(p) {
  if (!p) return '未绑定';
  if (!p.bound) {
    const n = (p.targets || []).length;
    return n ? '未绑定微信 · ' + n + ' 个目标' : '未绑定微信 · 未设目标';
  }
  if (!p.notifyTarget) return '已关';
  const n = (p.targets || []).length;
  return n ? n + ' 个目标' : '已开 · 未设目标';
}

/* ==================== 微信推送（绑定机器人 + 追分目标） ==================== */
/* 微信对接状态三态文案（2026-10-15 任务二抽出共用）：
   bound=微信已同步；scanBound+needActivate=待激活；其余（含 p 为 null/接口失败）
   =微信未同步。当前只被「我的」列表页 myPushRow 的右侧摘要使用
   （2026-10-17 极简口径：消息设置页与追分卡里的入口行均已撤，文案保留两态口径）。 */
function pushStatusText(p) {
  return !p ? '微信未同步'
    : p.bound ? '微信已同步'
    : p.scanBound ? (p.needActivate ? '待激活' : '已扫码')
    : '微信未同步';
}

/* ==================== 微信推送（绑定机器人 + 追分目标）数据源 ==================== */
/* 2026-10-10：数据入库约 30 分钟后由微信机器人私聊推送，两类内容各自开关（都关着就不推）：
   · 追分提醒 —— 追主播 / 定音浪目标 / 追名次（一律比本月累计），追上/还差多少都推给你
   · 每日报告 —— 当天音浪排行榜
   对接（2026-10-19 口径）：进入微信对接子页自动 POST /my/push/wechat/start →
   出二维码 + 4 位对接码（同一响应）+ 2 秒轮询，用户截屏后用微信扫码并在手机上点确认
   （confirmed）即对接完成；首次扫码后给对方发一条消息，机器人会依次发成功提示和介绍。 */
let pushState = null;
let pushSrTimer = null;      // scanBound 旧态的自动回流轮询（needActivate 时 5s 后刷一次）
let pushChaseSrTimer = null; // 「目标人」搜索防抖（与上面的轮询分开，避免互相 clearTimeout）
/* 追分「目标人」多选的暂存（2026-10-15 契约 B）：chase 卡每次刷新（后台轮询 / 保存回读 /
   删除后重拉）都会整块重渲染，勾选态放这里才不会丢；批量添加成功或用户撤销才清。
   2026-10-17：值从 name 升级为 {name, wave}（wave = 勾选当时缓存的本月音浪，
   供 chip 显示「名字 · 音浪」；wave==null 表示当时没拿到，chip 只显示名字）。 */
let chasePicked = new Map();

function pushCard(p) {
  /* 接口失败（p == null）也要把卡渲染出来：否则「消息设置」那一行
     滚不到任何东西，用户点了没反应，还以为功能是坏的。
     2026-10-15 契约 C：卡名从「微信推送服务」改成「消息设置」，页内三段由
     pushPageHtml 组装（微信对接 / 推送开关 / 追分设置入口）。 */
  return '<div class="st-my-list" id="myPushCard"><div class="sec">消息设置</div>' +
    '<div id="pushBox" style="padding:0 1rem 1rem"></div></div>';
}

/* 「追分设置」独立子页卡（2026-10-13 用户口径：不再复用 myPushCard）。
   内容由 renderChaseBox 就地填进 #chaseBox，与推送卡各管各的。 */
function chaseCard(p) {
  return '<div class="st-my-list" id="myChaseCard"><div class="sec">追分设置</div>' +
    '<div id="chaseBox" style="padding:0 1rem 1rem"></div></div>';
}

/* 推送状态取不到时的兜底内容：一句说明 + 重试按钮（照 myAccountsCard 的 __err 口径） */
function pushErrHtml() {
  return '<div class="sub" style="margin-top:6px;line-height:1.75">' +
    '推送状态没取到，可能是网络慢。点下面重试。</div>' +
    '<button class="go gray" id="pushRetry" style="margin-top:10px">重试</button>';
}

async function fetchPush() {
  const p = await api('/api/public/teams/' + TEAM + '/my/push');
  pushState = p;
  return p;
}

async function refreshPush() {
  try {
    renderPushBox(await fetchPush());
  } catch (e) {
    toast(e.message || '刷新失败');
  }
}

function renderPushBox(p) {
  const box = $('pushBox');
  if (!box) return;
  /* 每次重渲染都换掉 #pushBox 的 DOM：先把二维码轮询 / 倒计时停掉，
     否则旧计时器会在已卸载的节点上继续打接口（2026-10-16 深夜，段①二维码）。 */
  clearWxDock();
  box.innerHTML = !p ? pushErrHtml() : pushPageHtml(p);
  bindPushBox(p);
}

/* 「消息设置」子页两段（2026-10-17 用户口径：极简重做）：
   ① 微信对接 —— 两个状态：
      状态 A 未对接（!p.bound，含 scanBound 还没等微信确认的旧态）：
        一句说明 + 一个「扫码对接」按钮 → 二维码 + 4 位对接码 + 2 秒轮询，
        confirmed 即对接完成；首次扫码仍要用户先给机器人发一条消息才能生成会话上下文；
      状态 B 已对接（p.bound）：一行「✓ 已对接（昵称）」+「重新绑定」按钮。
   ② 推送开关 —— 仅状态 B 出现（追分提醒 / 每日报告 / 师门日报）。
   原第三段「追分设置」入口行整体删除：追分入口只留在「我的」列表页那一行。
   后端 channelConfigured=false（管理员还没接机器人）时整页只给一句说明。 */
function pushPageHtml(p) {
  if (!p.channelConfigured) return pushNotReady();
  return wechatBindHtml(p) + pushFlagsHtml(p);
}

function pushNotReady() {
  return '<div class="sub" style="margin-top:6px;line-height:1.7">' +
    '微信推送暂未开放（管理员还没连接微信机器人），稍后再看。</div>';
}

/* 段标题（与推送/追分卡里的 .card-t 小标题同一口径） */
function pushSecTitle(text) {
  return '<div class="card-t" style="margin:12px 0 2px;font-size:13px">' + text + '</div>';
}

/* ① 微信对接（2026-10-17 用户口径：两态极简，原三态/多段提示全部收拢）：
   · 状态 B 已对接（p.bound）：一行「✓ 已对接（昵称）」+「重新绑定」按钮。
     重新绑定只重置推送接线、不注销扫码登录，不需要重新扫码。
   · 状态 A 未对接（!p.bound，含 scanBound 旧态）：交给 pushUnboundHtml ——
     一句说明 + 「扫码对接」按钮。 */
function wechatBindHtml(p) {
  let h = pushSecTitle('微信对接');
  if (p.bound) {
    /* 昵称来自后端 scanNickname：用户换了号或代绑过也能看出推送发去哪 */
    const who = p.scanNickname ? '（' + esc(p.scanNickname) + '）' : '';
    h += '<div class="row"><span class="st ok">✓ 已对接' + who + '</span></div>';
    /* 推送失败原因只在真出过错时多一行，正常状态不给页面加行数 */
    if (p.lastError) {
      h += '<div class="hint">上次推送没成功：' + esc(p.lastError) + '</div>';
    }
    h += '<button class="go gray" id="pushUnbind" style="margin-top:10px">重新绑定</button>';
  } else {
    h += pushUnboundHtml(p);
  }
  return h;
}

/* 状态 A 未对接：进入页面就自动取二维码（不再要求先点按钮），用户截屏后到
   微信「扫一扫 → 相册」选择即可。取码响应仍带 4 位对接码，但只放进可折叠兜底，
   不抢扫码主路径；confirmed 后 onWxDockConfirmed → refreshPush 进状态 B。 */
function pushUnboundHtml(p) {
  let h = '';
  /* 2026-10-19 用户口径「已扫码不展示码」：已经扫过码、只差手机确认 /
     给机器人发消息的中间态，不再铺那张大二维码 —— 只留说明 + 按钮。
     点击「重新获取二维码」会重建二维码区；startWxDock 先复位旧会话状态，
     后端 start 也会复用仍有效的 pending 会话，不会立刻另开一张。 */
  const scannedWaiting = !wxDockConfirmed && !wxDockForceQr && !!(p && p.scanBound);
  if (wxDockConfirmed) {
    /* 本次会话刚轮询到 confirmed（toast 会被重渲染冲掉，这里钉住）。
       · 首次扫码：没有 context_token，iLink 无法主动发消息 —— 必须提示「给机器人发一条消息」，
         对方发完后机器人会立即连发「对接成功」和功能介绍并激活；
       · 重扫/解绑后重扫：后端复用已有会话上下文主动连发同样两条消息，正常显示成功即可。 */
    h += '<div class="sub" style="margin-top:8px;line-height:1.75">' +
      (wxDockNeedActivate
        ? '✅ 已完成对接<br>最后一步：在微信里给机器人随便发一条消息，机器人会依次发送“对接成功”和功能介绍，同时激活推送。'
        : '✅ 对接成功') +
      '</div>';
  } else if (scannedWaiting) {
    /* 扫码后不再展示大二维码：一句明确的确认提示 + 小号重取入口（2026-10-19） */
    h += '<div class="wx-bind-note" style="margin-top:10px">' +
      '已扫码，请在微信中确认完成机器人对接。若页面一直没有变化，' +
      '请重新获取二维码后再扫一次。默认每天自动推送每日报告。</div>';
    if (p.needActivate) {
      h += '<div class="hint" style="margin-top:6px;line-height:1.7">' +
        '首次对接：完成后给机器人发一条消息，即会收到成功提示和功能介绍。</div>';
    }
    h += '<button class="go gray" id="pushWxRefresh" style="margin-top:10px">重新获取二维码</button>';
  } else {
    h += '<div class="wx-bind-copy">' +
      '<div class="wx-bind-lead">截屏后用微信扫码绑定机器人</div>' +
      '<p>每日自动发给你数据；收徒弟后，还有<span class="nowrap">徒弟数据</span>、' +
      '<span class="nowrap">个人数据</span>等。</p>' +
      '<p>欢迎绑定体验，后续会持续更新更多功能。</p>' +
      '</div>';
  }
  if (!wxDockConfirmed && !scannedWaiting) {
  h += '<div class="wx-bind-qr" id="pushQrArea" aria-busy="true">' +
    '<div class="wx-shot-hint">截屏保存，微信「扫一扫」→ 从相册选择</div>' +
    /* 二维码卡（.qr-* 一套样式是原「扫码绑定」卡留下的：208px 白底 + 四角取景框 +
       状态行 + 倒计时），页面打开即自动获取；用户截屏后去微信相册扫码。 */
