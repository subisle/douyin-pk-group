<script>
/* ==================== 路由与全局状态 ==================== */
/* /1 男团 /0 女团；/st/m、/st/f 为别名。链接即团别，页内不提供切换。
   子路径 history 路由（2026-10-09）：
     /st/m             → 每日报告（首页默认）
     /st/m/report      → 每日报告（别名）
     /st/m/group/<key> → 按赛事类型的分组页
     /st/m/lineage     → 族谱
     /st/m/my          → 我的数据（手机号+密码登录；账号由管理员在后台开通）
   刷新/直接分享子路径链接都能落到正确视图（后端对子路径渲染同一 HTML）。 */
/* 团别（2026-10-11 改）：
   - 开启登录：登录账号的团别决定 TEAM（男团成员只看男团、女团只看女团）；
   - 关闭登录：打开展示页先选「男团 / 女团」，TEAM = 所选团别。
   统一入口 /api/public/teams/all 保留，游客默认 all（还没选团别）。 */
let TEAM = 'all';
const LABEL = () => TEAM === 'female' ? '女团' : TEAM === 'male' ? '男团' : '主播';
const $ = (id) => document.getElementById(id);

/* 分组子页：key 进 URL，type 对应方案 eventType（与后端 EVENT_TYPES 一致），label 是页面标题 */
const GROUP_PAGES = [
  { key: 'junior',       type: '初级争霸赛小组赛', label: '初级争霸赛小组赛' },
  { key: 'mid',          type: '中级争霸赛小组赛', label: '中级争霸赛小组赛' },
  { key: 'final',        type: '月终争霸赛',       label: '月终争霸赛' },
  { key: 'junior-promo', type: '初级争霸赛晋级赛', label: '初级争霸赛晋级赛' },
  { key: 'mid-promo',    type: '中级争霸赛晋级赛', label: '中级争霸赛晋级赛' },
];

let site = null;         // 站点配置（含后台级显隐开关）
let period = 'daily';    // daily | monthly | yearly
let view = 'data';       // data | group | lineage | my
let curGroup = GROUP_PAGES[0].key;  // 分组子页当前 key
/* 「我的」子页（2026-10-13）：bind/push/chase/privacy/about。/my 是列表首页，
   点列表行进子页（下一页式，带返回），路由 /my/<sub> 可直达可分享。 */
let mySub = null;
let curDate = null;      // 每日口径当前日期
let curPeriod = null;    // 月/年口径当前周期
let plans = [];          // 已上架分组方案（各类型独立互斥，每类型最多一场）
let planByType = {};     // 分组子页 key → 正在看的方案 id（同类型多个上架时页内切换用）
let searchOpen = false;
let q = '';
let consecutiveFail = 0;
let timer = null;
let loadSeq = 0;         // 请求序号：RTT≈260ms，快速连点时只认最后一次的结果

/* 请求在途的即时反馈：标题旁小菊花 + 内容轻微压暗。
   在 go() 里开、请求落地后关；静默刷新不经过这里，不打扰正常浏览。 */
function busyOn() { document.body.classList.add('busy'); }
function busyOff() { document.body.classList.remove('busy'); }

/* ==================== URL 路由（history，子路径 = 视图） ==================== */
/** 当前 pathname → 视图描述。识别不了的子路径一律落回每日报告（首页默认数据页）。
    兼容旧链接：/st/m/lineage、/1/report 这类带团别前缀的老路径剥掉前缀照常落视图。 */
function parseRoute() {
  const rest = location.pathname
    .replace(/^\/(?:st\/)?(?:m|f|1|0|all)(?=\/|$)/, '')
    .replace(/^\/+|\/+$/g, '');
  if (rest === '' || rest === 'report') return { view: 'data' };
  if (rest === 'lineage') return { view: 'lineage' };
  if (rest === 'my') return { view: 'my' };
  /* 2026-10-15 task-11：底栏一级入口「微信对接」的短路径别名 /wechat
     （等价 /my/wechat，深链直达不 404、不落回列表；规范路径仍是 /my/wechat）。 */
  if (rest === 'wechat') return { view: 'my', mySub: 'wechat' };
  /* 「我的」子页（2026-10-15 契约 C）：wechat = 「消息设置」；push 为兼容别名，
     旧链接 /my/push 仍打开同一页（不 404、不落回列表）。 */
  const mym = rest.match(/^my\/(push|chase|privacy|about|wechat)$/);
  if (mym) return { view: 'my', mySub: mym[1] };
  const gm = rest.match(/^group\/([a-z-]+)$/);
  if (gm && GROUP_PAGES.some(p => p.key === gm[1])) return { view: 'group', group: gm[1] };
  return { view: 'data' };
}
/** 当前视图对应的规范路径（根路径 + 子页路径；男女共用一个网址，团别不进 URL） */
function routePath() {
  if (view === 'lineage') return '/lineage';
  if (view === 'my') return mySub ? '/my/' + mySub : '/my';
  if (view === 'group') return '/group/' + curGroup;
  return '/report';
}
function pushRoute(replace) {
  const path = routePath();
  if (location.pathname === path) return;
  if (replace) history.replaceState(null, '', path);
  else history.pushState(null, '', path);
}

/* ==================== 小工具 ==================== */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = (n) => String(n).padStart(2, '0');
/** 328500 → 32万8500；不足一万原样返回 */
const wan = (n) => {
  n = Math.round(Number(n) || 0);
  if (n < 10000) return String(n);
  const w = Math.floor(n / 10000), r = n % 10000;
  return r === 0 ? w + '万' : w + '万' + pad2safe(r);
};
const pad2safe = (r) => String(r).padStart(4, '0');
/** 时长分钟 → 「x时x分」（用户口径 2026-10-16：不要秒，也不用「小时 / 分钟」长词）。
    108 → 「1时48分」；整点不显示 0 分，120 → 「2时」；不足 1 小时只显示「45分」。
    领奖台 / 榜单行 / 个人页三处共用这一个格式，别再各写一份。
    脏数据兜底：NaN / null / 字符串 → 0 分，Infinity 之类非有限值也按 0 处理
    （不兜的话会渲染出「Infinity时」）。 */
const minFmt = (v) => {
  const n = Number(v);
  if (!Number.isFinite(n)) return '0分';
  const t = Math.round(n);
  const h = Math.floor(t / 60), m = t % 60;
  return h > 0 ? h + '时' + (m ? m + '分' : '') : m + '分';
};
/** 提成金额（1.0.1）：后端已按「徒弟音浪 ÷ 音浪:人民币 × 提成百分比」算好金额，
    这里只做人民币格式化（最多 2 位小数、去尾零）。 */
const yuan = (n) => {
  if (n == null || !Number.isFinite(Number(n))) return '—';
  const v = Math.round(Number(n) * 100) / 100;
  return '¥' + v.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
};
/** 同期差值 chip（1.0.1）：涨红跌绿是固定口径；prev 为 null（上期没数据）不显示 */
const waveDelta = (wave, prev) => {
  if (wave == null || prev == null) return '';
  const d = wave - prev;
  if (d > 0) return '<span class="delta d-up">↑' + wan(d) + '</span>';
  if (d < 0) return '<span class="delta d-down">↓' + wan(-d) + '</span>';
  return '<span class="delta d-flat">—</span>';
};
const iso = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayStr = () => iso(new Date());
/** 数据每晚 24 点后入库前一天，所以「最新一天数据」落在昨天：
    展示页默认就站到昨天，而不是等到今天的数据到达才跳过去。 */
const refStr = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };
const nowPeriod = (p) => {
  // 与默认日期同一个参照日（昨天），否则月末切月会把新一天先算进本月
  const r = refStr();
  return p === 'monthly' ? r.slice(0, 7) : r.slice(0, 4);
};
const shiftMonth = (p, n) => {
  const y = +p.slice(0, 4), m = +p.slice(5, 7) - 1;
  const d = new Date(y, m + n, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
};
/* 月 / 年口径的可选周期 = **有数据的周期**（2026-10-11：库里只有 10 月 9 天的音浪，
   以前按 ‹ 能一路翻到 2026年3月，点进去只有空态，等于把不存在的月份的音浪摆给人看）。 */
function dataPeriods(p) {
  const ds = (site && site.dates) || [];
  return [...new Set(ds.map(d => p === 'monthly' ? d.slice(0, 7) : d.slice(0, 4)))];  // 降序
}
/** 当前周期不在有数据的列表里 → 吸附到 ≤ 它的最近一个有数据周期（没有就落到最早一个有数据周期） */
function snapPeriod(p, cur) {
  if (p !== 'monthly' && p !== 'yearly') return cur;   // 日口径不看周期
  const list = dataPeriods(p);
  if (!list.length) return cur || nowPeriod(p);
  if (list.includes(cur)) return cur;
  const le = list.filter(x => x <= String(cur || ''));
  return le.length ? le[0] : list[list.length - 1];
}
/** 步进 n=+1 更新 / -1 更早；只在有数据的周期之间走，到头就是原值 */
function stepPeriod(n) {
  const list = dataPeriods(period);
  const i = list.indexOf(curPeriod);
  if (i < 0) return snapPeriod(period, curPeriod);
  return list[Math.max(0, Math.min(list.length - 1, i - n))];
}
/** ‹ › 到头就禁用（只有一个月/一年的数据时两个都灰） */
function syncStepper() {
  if (period === 'daily' || !$('stepper')) return;
  const list = dataPeriods(period);
  const i = list.indexOf(curPeriod);
  const none = i < 0 || list.length <= 1;
  $('pPrev').disabled = none || i >= list.length - 1;   // 更早：已经是最早一个有数据的周期
  $('pNext').disabled = none || i <= 0;                 // 更新：已经是最近一个有数据的周期
}
/* show 传 id 或元素都行（syncNav 里对子导航按钮直接传元素） */
const show = (el, on) => (typeof el === 'string' ? $(el) : el).classList.toggle('hidden', !on);
let toastTimer;
function toast(msg) {
  $('toastTx').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);

async function api(p) {
  /* 登录门（2026-10-10）：带登录态请求头；401 → 弹登录门。
     2026-10-13 修「登录成功又回登录门」：token 一律走 X-My-Token 头——后端
     （admin.rs::header_my_token）只认这个头，?token= / ?access_token= 一律按未登录
     401 处理。旧写法下登录成功后第一个数据请求就 401 → sessionExpired 清 token →
     又弹登录门。顺带 token 不再进 URL（访问日志/浏览器历史/Referer 不再记登录态）。 */
  const r = await fetch(p, { headers: myTokenHeaders() });
  if (r.status === 401) { sessionExpired(); throw new Error('请先登录'); }
  let d = {};
  try { d = await r.json(); } catch (_) {}
  /* 访问门禁（2026-10-11）：白名单外的 IP 后端统一 403，不清 token、不弹登录门。
     2026-10-13：403 不再全是地区门禁 —— 后端用 `code` 区分（如族谱的
     lineage_forbidden）。带 code 的是业务拒绝，抛给调用方就地展示；
     只有不带 code 的（地区门禁）才整页替换，否则页面骨架会被整个换掉。 */
  if (r.status === 403) {
    if (d.code) throw Object.assign(new Error(d.error || '没有访问权限'), { code: d.code });
    regionBlocked(d.error || '您的ip不在授权范围内');
    throw new Error(d.error || '您的ip不在授权范围内');
  }
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

/* ==================== 登录门 + 全屏水印 ==================== */
let gateResolve = null;   // 登录成功后 resolve({name,...})
let meState = null;       // 当前登录身份（who 的结果，带 bound / needBind）
/* 2026-10-14 注册功能已下线：原有 4 个注册状态变量及相关页面逻辑一并删除，
   登录门只剩「登录」+「忘记密码」。 */

/* 2026-10-14：原 maskPhone() 前端打码函数已删 —— 手机号统一由后端 /my/who、
   /my/push 在服务端 mask_phone() 后下发，前端拿到即已脱敏，不再二次打码
   （对已打码值再 mask 会把 138****1234 打成 13****34，水印失真）。 */

/** 登录成功后统一收口：水印 + 未绑定提醒条 + 换团条显隐 */
function applyLoginState(me) {
  meState = me || null;
  /* 换团条：只有「全团」账号（后端 switchable=true）才显示。
     钉死某团的账号（饭团=女团）压根不给切换入口，不是「显示但点了报错」。
     switchable 由 /my/who 每次都下发，所以刷新页面也能重建（不只登录那一刻）。 */
  renderTeamSwitch(me);
  // 登录账号的团别决定 TEAM：男团成员只看男团、女团只看女团（2026-10-11）
  if (me && (me.team === 'male' || me.team === 'female') && TEAM !== me.team) {
    TEAM = me.team;
    applyTeam();
  }
  /* 全团账号：套用上次选的视角（刷新/重进还是上次那个团）。
     钉死团的账号 me.team 就是死值，上面的分支已经设好，这里不覆盖。 */
  if (me && me.switchable) {
    const saved = savedViewTeam();
    if (saved && saved !== TEAM) { TEAM = saved; applyTeam(); }
    if (meState) meState.team = TEAM;
    renderTeamSwitch(meState);
  }
  const needBind = !!(me && me.needBind);
  /* 提醒条用 hidden 属性控制（CSS 写的是 .bindbar[hidden]），不是 class="hidden" */
  const bar = $('bindBar');
  if (bar) bar.hidden = !needBind;
  /* 水印口径（2026-10-11）：显示自己的手机号（打码），没有手机号才回退艺名。
     2026-10-14：phone 现在是后端 /my/who 服务端打码后的值，这里直接用、不再 mask，
     （对已打码值再 mask 会把 138****1234 打成 13****34，水印反而失真）。 */
  const wmText = needBind ? '未绑定主播' : ((me && (me.phone || me.name)) || '');
  applyWatermark(wmText);
  return me;
}

/* ---- 换团条（2026-10-15 权限分布）----
   全团账号（帅帅 / 鹏先生）可以在「全团 / 男团 / 女团」之间自己切；
   钉死某团的账号（饭团 = 只看女团）不渲染这条 —— 不是显示出来点了报错，
   压根不给入口。后端仍会在每个数据接口上按 token 团别复核，前端藏只是体验。 */

/** 上次选的视角（localStorage 可能不可用/被禁，一律 try 包住） */
function savedViewTeam() {
  try {
    const v = localStorage.getItem('myViewTeam');
    return (v === 'all' || v === 'male' || v === 'female') ? v : '';
  } catch (_) { return ''; }
}

function renderTeamSwitch(me) {
  const box = $('teamSwitch');
  if (!box) return;
  const on = !!(me && me.switchable);
  show('teamSwitch', on);
  if (!on) return;
  /* 当前视角高亮：all / male / female。空串（旧「任意团」token）按 all 显示 */
  const cur = (me && (me.team === 'male' || me.team === 'female')) ? me.team : 'all';
  box.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === cur);
    b.onclick = () => switchTeam(b.dataset.t);
  });
}

/** 切团：换 TEAM 后整页重拉（榜单 / 日期条 / 族谱都按团别取数）。
    只改前端视角，不动 token —— 后端 gate_team 对「任意团」token 一律放行，
    所以从 all 切到 male 不需要重新登录。 */
function switchTeam(t) {
  if (t !== 'all' && t !== 'male' && t !== 'female') return;
  if (TEAM === t) return;
  TEAM = t;
  /* 记忆住，刷新/下次进来还是这个视角（同一账号自己的偏好） */
  try { localStorage.setItem('myViewTeam', t); } catch (_) {}
  if (meState) meState.team = t;
  renderTeamSwitch(meState);
  applyTeam();
  syncNav();
  /* 族谱是男团专属页：正在看族谱时切到女团会被改道，改道由 switchView 负责，
     这里只保证当前视图的数据按新团别重拉 */
  go();
}

function closeGate(me) {

  requestAnimationFrame(() => { try { maybeAnnounce(); } catch (_) {} });

/* ------------------------------ 登录页签 ------------------------------ */
function bindLoginPane() {
  const go = async () => {
    const acct = $('gateAcct').value.trim(), pw = $('gatePass').value.trim();
    const errEl = $('gateErr');
    if (!acct || !pw) {
      errEl.textContent = '请输入账号和密码';
      errEl.classList.remove('hidden');
      return;
    }
    const btn = $('gateGo');
    btn.disabled = true; btn.textContent = '登录中…';
    errEl.classList.add('hidden');
    try {
      /* 统一免团别登录口：后端按账号反查绑定主播，前端不再按团别分流 */
      const url = '/api/public/my/login';
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account: acct, pass: pw }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      /* 2026-10-14：后端已区分「密码错误」和「账号还没开通」，这里优先显示后端下发的原因 d.error；
         后端仍有个别分支只回 {ok:false} 不带 error（台账查无此人、管理观看账号未通过等），回落到原兜底文案 */
      if (!d.ok) throw new Error(d.error || '账号或密码不对，或账号还没开通');
      /* token 统一存 MY_ANY_KEY；后端 all 端点接受任何绑定主播的账号 */
      const team = d.team === 'male' || d.team === 'female' ? d.team : '';
      const key = MY_ANY_KEY;
      sessionStorage.setItem(key, d.token);
      if (key !== MY_KEY()) sessionStorage.removeItem(MY_KEY());
      localStorage.setItem(team ? 'myName_' + team : MY_ANY_NAME, d.name || acct);
      toast(d.needBind ? '登录成功，账号未绑定主播请联系管理员帅帅' : '登录成功');
      closeGate({ name: d.name || acct, personId: d.personId, bound: d.bound !== false,
        needBind: !!d.needBind, team: team, anyTeam: !team });
    } catch (e) {
      btn.disabled = false; btn.textContent = '登 录';
      errEl.textContent = e.message || '登录失败，稍后再试';
      errEl.classList.remove('hidden');

  };
  $('gateGo').onclick = go;
  $('gateForgot').onclick = forgotPassword;
  $('gateAcct').onkeydown = (e) => { if (e.key === 'Enter') $('gatePass').focus(); };
  $('gatePass').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

async function forgotPassword() {
  const acct = ($('gateAcct').value || '').trim().replace(/[\s-]/g, '');
  const errEl = $('gateErr');
  errEl.classList.add('hidden');
  /* 资格与后端 store/my_account.rs my_account_reset_password_random 对齐：
     后端按 phone 查 my_accounts，只认 is_admin=0 且 phone 已绑定的普通账号，
     查不到就返回「该手机号未绑定账号」（2026-10-14 后端口径：没绑定就说未绑定）。
     管理员观看账号与未绑定手机号一律拒（文案不区分两者，避免泄露台账）。
     所以这里必须是纯数字手机号（5~20 位，同 validate_my_phone），姓名不能重置。 */
  if (!/^\d{5,20}$/.test(acct)) {
    errEl.textContent = '请先输入已绑定的手机号（5~20 位数字），再点重置；未绑定请联系管理员帅帅';
    errEl.classList.remove('hidden');
    return;
  }
  const btn = $('gateForgot');
  btn.disabled = true; btn.textContent = '重置中…';
  try {
    const r = await fetch('/api/public/my/password/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: acct }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    /* 修复3：后端 my.rs 重置为 CSPRNG 随机密码（响应 d.password 只下发一次），
       不再是手机号后四位 —— 文案/回填/按钮态三处同步改，别再误导用户 */
    $('gatePass').value = d.password || '';
    errEl.classList.remove('hidden');
    /* 2026-10-14：「设置里」指向不明。改密入口只在个人页那一行（id=myForgot）——
       2026-10-15 契约 A 后该行文案改为「重置密码」，这里同步，否则用户临时密码
       登录后按旧文案找不到地方改。 */
    errEl.textContent = d.password
      ? '已生成临时密码：' + d.password + '（已帮你填进密码框；登录后到「我的」页 → 「重置密码」改成自己的密码）'
      : '重置后会生成一个临时密码；登录成功后到「我的」页 → 「重置密码」改成自己的密码';
    toast('密码已重置，临时密码见下方提示');
  } catch (e) {
    errEl.textContent = e.message || '重置失败，稍后再试';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = '忘记密码？重置生成临时密码';
  }
}

/* 2026-10-14 注册功能已下线：注册页签的 DOM + JS 已整体删除
   （表单、网关授权步骤、姓名核对、提交建号、轮询与全部相关状态变量），
   登录门只保留「登录」+「忘记密码」。 */

/* 会话失效（接口 401）：清 token 回登录门；登录门已开着就不动 */
function sessionExpired() {
  myLogout();
  removeWatermark();
  dismissMsgModal();                  // 消息弹窗同样让位给登录门
  if (gateResolve) return;            // 登录门已在
  gateResolve = () => location.reload();
  showGate();
}

/* 访问门禁（2026-10-11）：白名单外的访客整页提示（连不上服务之外的另一种终止态） */
let regionBlockedShown = false;
function regionBlocked(msg) {
  if (regionBlockedShown) return;
  regionBlockedShown = true;
  dismissAnnounce();   // body 整个换掉，引导的 DOM 随之消失，句柄必须清干净
  document.body.innerHTML = '<div class="empty" style="padding-top:120px"><span class="big">🔒</span><b>' +
    esc(msg || '您的ip不在授权范围内') + '</b><br>本展示页仅对安徽、河南、江苏开放</div>';
}

/* 启动前置：有 token 先验身份（轻量 who）；没有/失效 → 弹登录门等人登录 */
async function ensureLogin() {
  const t = myToken();
  if (t) {
    /* token 可能记在别的团（团别待定的登录态两团都认）：候选团逐个问一遍身份 */
    const cands = ['all'];
    for (const team of cands) {
      try {
        const who = await fetch('/api/public/teams/' + team + '/my/who',
          { headers: myTokenHeaders() }).then((r) => r.json());
        if (who && who.ok) {
          /* team 回账号真正的团别（团别待定 = 空串），不是刚试探的团 */
          who.team = who.anyTeam ? '' :
            (who.team === 'male' || who.team === 'female' ? who.team : team);
          return who;
        }
        if (who && /过期|失效/.test(who.error || '')) break;   // token 本身失效，别再问别的团
      } catch (_) { /* 网络问题也走重新登录，登录卡会给出报错 */ }
    }
    myLogout();
  }
  return new Promise((resolve) => {
    gateResolve = resolve;
    showGate();
  });
}

/* 全屏水印（显示打码手机号，没有手机号才回退艺名）：平铺斜排、极低透明度、
   pointer-events none，不影响任何操作 */
function applyWatermark(name) {
  const wm = $('wm');
  const nm = String(name || '').trim();
  if (!nm) { wm.hidden = true; return; }
  const tile = '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150">' +
    '<text x="120" y="80" font-size="14" fill="#0F1728" fill-opacity="0.10" text-anchor="middle" ' +
    'transform="rotate(-22 120 80)">' + esc(nm) + ' · ' + esc(nm) + '</text></svg>';
  wm.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(tile) + '")';
  wm.hidden = false;
}
function removeWatermark() { const wm = $('wm'); if (wm) { wm.hidden = true; wm.style.backgroundImage = ''; } }

/* ==================== 榜单 ==================== */
/* 版式严格对齐排行榜参考设计：TOP3 领奖台 + 名次/头像/名字/数值 的简洁列表。
   涨红跌绿是本项目固定口径：名次升 = 红 ↑，降 = 绿 ↓。 */
function deltaChip(it) {
  if (!it.delta) return '';
  const d = it.delta;
  if (d.dir === 'up') return '<span class="delta d-up">↑' + d.n + '</span>';
  if (d.dir === 'down') return '<span class="delta d-down">↓' + d.n + '</span>';
  return '<span class="delta d-flat">—</span>';
}

/* 头像：没有照片，用名字首字 + 按名字哈希取稳定底色（同一个人颜色不变） */
const AV_COLORS = ['#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#14B8A6'];
function avColor(name) {

    ? '<img class="st-trophy" src="' + TROPHY_SRC[r] + '" alt="' + TROPHY_ALT[r] +
      '" width="24" height="24" draggable="false">'
    : '';

/** 领奖台：按 [第2名, 第1名, 第3名] 排布，第一名居中大号；缺位留空。
    后台关掉「音浪数值」时接口不下发数字（wave=null），显示 —。 */
function podHtml(items) {
  const pick = (r) => items.find(x => x.hasData !== false && x.rank === r);
  const order = [pick(2), pick(1), pick(3)];
  if (!order.some(Boolean)) return '';
  /* Stitch 版领奖台：外圈白环 + 内圈米色/银/铜，每位名次头顶金/银/铜奖杯 + 深棕名次标 */
  const IN_TONE = (r) =>
    r === 1 ? 'st-pod-in-1' : r === 2 ? 'st-pod-in-2' : 'st-pod-in-3';
  return '<div class="st-podium">' + order.map(it => {
    if (!it) return '<div class="st-pod"></div>';
    const ch = esc(String(it.name || '?').charAt(0));
    /* 真头像（T3）：avatar 是同源相对路径（拿不到就是 null）。有图就直出 <img>（公开图，
       不用 fetch+objectURL），没图仍走原来的「首字 + 金银铜底色」，外观与旧版一模一样。
       data-n 交给 bindRows 的 onerror 兜底：裂图时回落到首字。 */
    const av = it.avatar
      ? '<div class="st-pod-av ' + IN_TONE(it.rank) + ' has-img" data-n="' + esc(it.name) + '">' +
          '<img data-av src="' + esc(it.avatar) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">' +
        '</div>'
      : '<div class="st-pod-av ' + IN_TONE(it.rank) + '" data-n="' + esc(it.name) + '">' + ch + '</div>';
    const wave = it.wave == null ? '—' : wan(it.wave);
    const total = it.periodic ? '' : (it.totalWave == null ? '' : wan(it.totalWave));
    const label = it.periodic ? (period === 'monthly' ? '当月音浪' : '年度音浪') : '日音浪';
    const min = it.minutes == null || it.minutes === 0 ? '' : minFmt(it.minutes);
    const absent = it.periodic ? (it.absentDays == null ? 0 : it.absentDays) : null;
    return '<div class="st-pod st-pod-' + it.rank + '" data-n="' + esc(it.name) + '" data-w="' + (it.wave == null ? '' : it.wave) + '">' +
      '<div class="st-pod-ring">' +
        trophyHtml(it.rank) +
        av +
      '</div>' +
      '<h3 class="st-pod-nm">' + esc(it.name) + '</h3>' +
      (absent != null ? '<span class="st-pod-off' + (absent > 0 ? ' warn' : '') + '">未播 ' + absent + '天</span>' : '') +
      (min ? '<span class="st-pod-off">时长 ' + min + '</span>' : '') +
      '<p class="st-pod-wv">' + wave + '</p>' +
      '<span class="st-pod-lbl">' + label + '</span>' +
      (total ? '<p class="st-pod-total">总 ' + total + '</p>' : '') +
    '</div>';
  }).join('') + '</div>';
}

/** 榜单行（Stitch 版）：
    日榜：按当日音浪排名，右列显示当日音浪，不显示未播天数。
    月榜：按当月音浪排名，右列显示当月音浪。
    年榜：按年度音浪排名，右列显示年度音浪。
    时长字段：导入有数据就显示在名字下方，没有则完全隐藏。 */
function lbRowHtml(it) {
  const hideWave = it.wave == null;
  const off = it.hasData === false || (!hideWave && it.wave < 2);
  const wave = hideWave ? '—' : wan(it.wave);
  const rightLbl = it.periodic
    ? (period === 'monthly' ? '当月音浪' : '年度音浪')
    : '当日音浪';
  const min = (it.minutes == null || it.minutes === 0) ? '' : minFmt(it.minutes);
  const absent = it.periodic ? (it.absentDays == null ? 0 : it.absentDays) : null;
  const sub = min ? '时长 ' + min : '';
  return '<div class="st-row' + (off ? ' off' : '') + '" data-n="' + esc(it.name) +
    '" data-w="' + (off || hideWave ? '' : it.wave) + '">' +
    '<div class="st-row-l">' +
      '<span class="st-row-rk">' + (off ? '—' : (it.rank || '—')) + '</span>' +
      /* 真头像（T3）：有图先给 has-img（不设 avSoft 内联底色，否则会盖住圆形裁切），
         没图的老路径一字未改：avSoft 柔和底 + 姓名首字。 */
      (it.avatar
        ? '<div class="st-row-av has-img" data-n="' + esc(it.name) + '">' +
            '<img data-av src="' + esc(it.avatar) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">' +
          '</div>'
        : '<div class="st-row-av" data-n="' + esc(it.name) + '" style="' + avSoft(it.name) + '">' +
            esc(String(it.name || '?').charAt(0)) + '</div>') +
      '<div class="st-row-mid">' +
        '<div class="st-row-nmwrap"><span class="st-row-nm">' + esc(it.name) + '</span>' +
          (absent != null ? '<span class="st-row-off' + (absent > 0 ? ' warn' : '') + '">未播 ' + absent + '天</span>' : '') +
        '</div>' +
        (sub ? '<p class="st-row-sub">' + sub + '</p>' : '') +
      '</div>' +
    '</div>' +
    '<div class="st-row-r"><span class="st-row-wv">' + (off ? '—' : wave) + '</span>' +
      '<span class="st-row-lbl">' + rightLbl + '</span></div>' +
  '</div>';
}

/** Stitch 版头像：柔和底色（indigo/sky/violet/rose/orange/teal 轮换） */
const SOFT_TONES = [
  ['rgba(99,102,241,.10)', '#4c4aca'],
  ['rgba(14,165,233,.10)', '#0369a1'],
  ['rgba(139,92,246,.10)', '#6d28d9'],
  ['rgba(244,63,94,.10)',  '#be123c'],
  ['rgba(249,115,22,.10)', '#c2410c'],
  ['rgba(20,184,166,.10)', '#0f766e'],
];
function avSoft(name) {
  let h = 0; const s = String(name || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const t = SOFT_TONES[h % SOFT_TONES.length];
  return 'background:' + t[0] + ';color:' + t[1];
}

let listAll = [];
/** 参与渲染的行：搜索过滤（未开播的人始终显示，置灰） */
function visibleRows() {
  const key = q.trim();
  return listAll.filter(it => !key || String(it.name).indexOf(key) >= 0);
}
function renderList() {
  const key = q.trim();
  /* 搜索时收起领奖台：命中的人（含前三）全部在列表里找得到；
     平时列表从第 4 名起，前三只在领奖台上出现一次（严格对齐参考设计） */
  const pod = key ? '' : podHtml(listAll);
  const rows = pod ? visibleRows().filter(it => !(it.rank >= 1 && it.rank <= 3)) : visibleRows();
  /* 只有前三名有数据时：领奖台照常，列表部分留个说明行而不是空态 */
  const isDaily = period === 'daily' && !listAll.some(x => x.periodic);
  const headL = isDaily ? '名次 / 主播' : '名次 / 主播 / 状态';
  const headR = isDaily ? '当日音浪' : (period === 'monthly' ? '当月音浪' : '年度音浪');
  const listHtml = '<div class="st-list">' +
    '<div class="st-list-head"><span>' + headL + '</span><span>' + headR + '</span></div>' +
    '<div class="st-list-body">' +
      (rows.length ? rows.map(lbRowHtml).join('') : '<div class="empty" style="padding:18px">其余人今天还没有数据</div>') +
    '</div></div>';
  const body = rows.length === 0 && !pod
    ? '<div class="empty">' + (key ? '没有匹配「' + esc(key) + '」的主播<br>换个名字试试'
        : '<span class="big">📺</span>这个' + (period === 'daily' ? '日期' : '周期') + '没有可显示的主播<br>换个日期试试') + '</div>'
    : (pod + listHtml);
  $('view').innerHTML = '<div class="section">' + body + '</div>';
  bindRows();
}

function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {});
  toast('已复制 ' + t);
}

/* 点人/长按 = 复制「名字 · 音浪」；音浪隐藏时只复制名字 */
function bindRows() {
  const copy = (el) => copyText(el.dataset.w === ''
    ? el.dataset.n
    : el.dataset.n + ' · ' + wan(Number(el.dataset.w || 0)) + ' 音浪');
  document.querySelectorAll('#view .lb-row, #view .pod').forEach(el => {
    let lp;
    el.onclick = () => copy(el);
    el.oncontextmenu = (e) => { e.preventDefault(); copy(el); };
    el.ontouchstart = () => { lp = setTimeout(() => copy(el), 520); };
    el.ontouchend = el.ontouchmove = () => clearTimeout(lp);
  });
  /* 头像兜底（T3）：接口给的 avatar 也可能 404 / 图挂了，绝不能留破图。
     在渲染后同一拍挂 onerror：摘掉 has-img（领奖台的 CSS 底色自己回来），列表行再补回
     avSoft 柔和底色，最后用 data-n 里的名字回落成姓名首字（textContent 顺带把 <img> 拿掉，
     破图图标也不会留下）。领奖台不设内联底色，保持旧版外观。 */
  document.querySelectorAll('#view img[data-av]').forEach(img => {
    img.onerror = () => {
      const box = img.parentElement;
      if (!box) return;
      box.classList.remove('has-img');
      const nm = box.dataset.n || '';
      if (box.classList.contains('st-row-av')) box.style.cssText = avSoft(nm);
      box.textContent = String(nm || '?').charAt(0);
    };
  });
}

/* ==================== 加载：数据页 ==================== */
async function loadData() {
  if (period === 'daily') {
    const d = await api('/api/public/teams/' + TEAM + '/daily' + (curDate ? '?date=' + curDate : ''));
    curDate = d.date;
    listAll = d.items || [];
    $('mhSub').textContent = 'DATA ' + (curDate || '').replaceAll('-', '.') +
      ' · ' + (d.liveCount || 0) + '/' + (d.teamSize || listAll.length) + ' 有数据';
    renderDates();
  } else {
    const url = '/api/public/teams/' + TEAM + '/' + period + (curPeriod ? '?period=' + curPeriod : '');
    const d = await api(url);
    /* 显隐兜底（2026-10-11）：后端 published:false / periodEnabled:false 时不下发 period，
       以前直接 curPeriod = d.period 再 .slice 会抛错，页面只剩「暂时取不到数据」。 */
    if (!d || d.published === false) {
      listAll = [];
      $('mhSub').textContent = period === 'monthly' ? 'MONTH' : 'YEAR';
      $('pNow').textContent = period === 'monthly'
        ? nowPeriod('monthly').slice(0, 4) + '年' + (+nowPeriod('monthly').slice(5, 7)) + '月'
        : nowPeriod('yearly') + '年';
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        LABEL() + '数据暂未公布<br>请等管理员发布</div></div>';
      return;
    }
    if (d.periodEnabled === false) {
      listAll = [];
      $('mhSub').textContent = period === 'monthly' ? 'MONTH' : 'YEAR';
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        (period === 'monthly' ? '每月' : '每年') + '榜暂未开放<br>换个口径看看</div></div>';
      return;
    }
    curPeriod = snapPeriod(period, d.period || curPeriod);
    if (!curPeriod) {
      listAll = [];
      $('view').innerHTML = '<div class="section"><div class="empty"><span class="big">📺</span>' +
        '这个周期没有可显示的主播<br>换一个周期试试</div></div>';
      return;
    }
    /* periodic：月/年榜行没有 absentDays/totalWave 概念，榜单行不渲染「本月/未播」副行 */
    listAll = (d.items || []).map(x => ({ ...x, hasData: true, periodic: true }));
    $('mhSub').textContent = (period === 'monthly' ? 'MONTH ' : 'YEAR ') + curPeriod;
    $('pNow').textContent = period === 'monthly'
      ? curPeriod.slice(0, 4) + '年' + (+curPeriod.slice(5, 7)) + '月'
      : curPeriod + '年';
    syncStepper();
  }
  renderList();
}

function renderDates() {
  const dates = (site && site.dates) || [];
  let prevM = '';
  $('dates').innerHTML = dates.map(d => {
    let label = d.slice(5).replace('-', '.');
    if (d === todayStr()) label = '今天';
    else if (d === refStr()) label = '昨天';
    /* 跨月时插一条「10月」分隔，长条里不迷路 */
    const m = d.slice(0, 7);
    const gap = prevM && m !== prevM ? '<span class="mgap">' + (+m.slice(5, 7)) + '月</span>' : '';
    prevM = m;
    const noData = calMonths && !calMonths.has(d.slice(0, 7)) ? '' :
      (calDays && !calDays.has(d) ? ' nodata' : '');
    return gap + '<button data-d="' + d + '" class="' + (d === curDate ? 'on' : '') + noData + '">' + label + '</button>';
  }).join('');
  document.querySelectorAll('#dates button').forEach(b => b.onclick = () => pickDate(b.dataset.d));
}

/* 点日期（日期条 / 日历共用）：先本地高亮（点了立刻有反应），再拉数据 */
function pickDate(d) {
  if (!d || d === curDate) return;
  curDate = d;
  document.querySelectorAll('#dates button').forEach(x =>
    x.classList.toggle('on', x.dataset.d === d));
  const on = document.querySelector('#dates button.on');
  if (on) on.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  go();
}

/* ==================== 日期日历（点 📅 弹出，底部抽屉 / PC 居中卡） ==================== */
/* 数据分布（有数据的天）：curDate 所在月拉不到就把整段 dates 摊进日历 */
let calDays = null;      // Set('YYYY-MM-DD') 有数据的日子；null = 未知（不标点）
let calMonths = null;    // Set('YYYY-MM') 有数据的月份（哪些月缺数据）

function calBuildDays() {
  const dates = (site && site.dates) || [];
  calDays = new Set(dates);
  calMonths = new Set(dates.map(d => d.slice(0, 7)));
}

let calY = 0, calM = 0;   // 日历当前显示的年月（calM: 0-11）

function calShow() {
  if (!(site && site.dates && site.dates.length)) { toast('还没有可选的日期'); return; }
  if (!calDays) calBuildDays();
  const ref = curDate || refStr();
  calY = +ref.slice(0, 4);
  calM = +ref.slice(5, 7) - 1;
  if ($('calPop')) { $('calPop').classList.remove('hidden'); calRender(); return; }
  const pop = document.createElement('div');
  pop.id = 'calPop';
  pop.className = 'cal-pop';
  pop.innerHTML = '<div class="cal-card">' +
    '<div class="cal-head">' +
    '<button id="calPrev" title="上一个月"><span class="material-symbols-outlined">chevron_left</span></button>' +
    '<div class="ttl" id="calTitle">—</div>' +
    '<button id="calNext" title="下一个月"><span class="material-symbols-outlined">chevron_right</span></button>' +
    '<button class="close" id="calClose" title="关闭"><span class="material-symbols-outlined">close</span></button>' +
    '</div>' +
    '<div class="cal-grid" id="calGrid"></div>' +
    '<div class="note" style="margin:10px 0 0">绿点 = 有数据的日子 · 只能选有数据的日期</div>' +
    '</div>';
  document.body.appendChild(pop);
  pop.addEventListener('click', (e) => { if (e.target === pop) calHide(); });
  $('calClose').onclick = calHide;
  $('calPrev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } calRender(); };
  $('calNext').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } calRender(); };
  calRender();
}

function calHide() {
  const p = $('calPop');
  if (p) p.classList.add('hidden');
}

function calRender() {
  $('calTitle').textContent = calY + ' 年 ' + (calM + 1) + ' 月';
  const first = new Date(calY, calM, 1);
  const lead = first.getDay();                       // 0=周日
  const dim = new Date(calY, calM + 1, 0).getDate(); // 本月天数
  const prevDim = new Date(calY, calM, 0).getDate();
  const tStr = todayStr();
  let html = '';
  ['日', '一', '二', '三', '四', '五', '六'].forEach((w, i) => {
    html += '<div class="wd' + (i === 0 || i === 6 ? ' wkend' : '') + '">' + w + '</div>';
  });
  for (let i = lead - 1; i >= 0; i--) {
    html += '<button class="cal-d dim" disabled>' + (prevDim - i) + '</button>';
  }
  for (let d = 1; d <= dim; d++) {
    const ds = calY + '-' + pad2(calM + 1) + '-' + pad2(d);
    const has = calDays && calDays.has(ds);
    const cls = 'cal-d' + (has ? ' has' : '') + (ds === tStr ? ' today' : '') + (ds === curDate ? ' on' : '');
    html += '<button class="' + cls + '" data-d="' + ds + '"' + (has ? '' : ' disabled') + '>' + d + '</button>';
  }
  const tail = (7 - (lead + dim) % 7) % 7;
  for (let d = 1; d <= tail; d++) {
    html += '<button class="cal-d dim" disabled>' + d + '</button>';
  }
  $('calGrid').innerHTML = html;
  $('calGrid').querySelectorAll('.cal-d[data-d]').forEach(b => {
    b.onclick = () => {
      calHide();
      pickDate(b.dataset.d);   // 本地先高亮，数据回来再换内容
    };
  });
}

function shimmerList() {
  return '<div class="card">' + [0, 0, 0, 0, 0, 0].map(() => '<div class="sk sk-row"></div>').join('') + '</div>';
}

/* ==================== 族谱画布（男团：鹏先生为祖师爷的师门树） ==================== */
let lineageNodes = [];   // /lineage 的扁平节点
let myPersonId = null;   // 当前登录主播 id；0/null 时族谱兜底照常画全树
let lineageSel = null;   // 点击选中的节点 id（高亮祖师→自己整条链）
let lnView = { x: 0, y: 0, s: 1 };
let lnById = new Map();  // id → 布局节点（渲染后供搜索/定位用）
let lineageQ = '';       // 搜索词
let lnHitIdx = 0;        // 回车在命中之间循环
let lnAllOpen = true;    // 卡片树「全部展开/收起」当前状态（默认全展开）

/* 与分组长图同源的 8 色循环：每个师门一种颜色， trunk（祖师+各大支支头）上色 */
const LN_THEMES = [
  { bg:'#fdeaf1', bd:'#f6a8c5', tc:'#e04f8a' },
  { bg:'#f0ecfd', bd:'#b3a1f2', tc:'#7a58e0' },
  { bg:'#e4f7fb', bd:'#7fd0e2', tc:'#189db8' },
  { bg:'#fdf3dd', bd:'#f4c46a', tc:'#dd8f1d' },
  { bg:'#e7f7ec', bd:'#82cb9b', tc:'#2f9e5d' },
  { bg:'#fdebe9', bd:'#f19a97', tc:'#dd4f4c' },
  { bg:'#e9eefc', bd:'#98aaee', tc:'#4c63d6' },
  { bg:'#e6f6f1', bd:'#74c7ab', tc:'#1c9b77' },
];

/* 族谱音浪口径（2026-10-12）：daily / monthly / yearly，切换时带 period 重新拉 */
let lineagePeriod = 'daily';

async function loadLineage(period) {
  if (period) lineagePeriod = period;
  let d;
  try {
    d = await api('/api/public/teams/' + TEAM + '/lineage?period=' + lineagePeriod);
  } catch (e) {
    /* 非师门成员：后端 403 + code=lineage_forbidden（2026-10-12 审计口径，产品口径是
       「族谱给有师门归属的人看」）。这是本人的正常态，不是地区门禁 —— 页面骨架/导航
       保留，只把内容区换成提示（原来落进 regionBlocked 会把整页换成地区门禁文案，
       紧接着 $('mhSub') 取不到元素 → 整个页面挂掉）。 */
    if (e && e.code === 'lineage_forbidden') {
      $('mhSub').textContent = 'LINEAGE';
      $('view').innerHTML = '<div class="empty" style="padding-top:80px">' +
        '<span class="big">🔒</span><b>族谱仅对师门成员开放</b><br>' +
        '有师傅或徒弟的账号才能查看师门树。</div>';
      return;
    }
    throw e;
  }
  lineageNodes = d.nodes || [];
  $('mhSub').textContent = 'LINEAGE ' + lineageNodes.length + ' 人';
  lineageQ = ''; lnHitIdx = 0; lnAllOpen = true;
  renderLineage(false);
}

/** 树布局（横向，从左到右）：祖师在最左，一代向右一列；同层按子树大小排，
    父节点纵向居中于最上/最下子节点之间。叶节点各占一行。 */
function layoutLineage() {
  const byId = new Map(lineageNodes.map(n => [n.id, Object.assign({}, n, { kids: [], th: null, depth: 0, x: 0, y: 0 })]));
  const roots = [];
  for (const n of byId.values()) {
    if (n.masterId != null && byId.has(n.masterId)) byId.get(n.masterId).kids.push(n);
    else roots.push(n);
  }
  /* 没师傅又没徒弟的散人不上树（有徒弟的师门根保留：那是每棵树的头）。
     注意只从 byId 里摘掉，lineageNodes 原样保留，导出图底部的名单还要用。 */
  for (const n of [...byId.values()]) {
    if (n.masterId == null && n.kids.length === 0) byId.delete(n.id);
  }
  const visRoots = roots.filter(r => byId.has(r.id));
  const size = (n) => 1 + n.kids.reduce((s, k) => s + size(k), 0);
  const sortRec = (n) => {
    n.kids.sort((a, b) => size(b) - size(a) || a.name.localeCompare(b.name, 'zh-Hans-CN'));
    n.kids.forEach(sortRec);
  };
  roots.sort((a, b) => size(b) - size(a) || a.name.localeCompare(b.name, 'zh-Hans-CN'));
  roots.forEach(sortRec);
  const COL = 132, ROW = 62, PAD = 48;
  let cursor = PAD, maxDepth = 0;
  const place = (n, depth, th) => {
    n.depth = depth; n.th = th;
    maxDepth = Math.max(maxDepth, depth);
    if (!n.kids.length) { n.y = cursor + ROW / 2; cursor += ROW; }
    else { n.kids.forEach(k => place(k, depth + 1, th)); n.y = (n.kids[0].y + n.kids[n.kids.length - 1].y) / 2; }
    n.x = PAD + depth * COL;
  };
  visRoots.forEach((r, i) => place(r, 0, LN_THEMES[i % LN_THEMES.length]));
  return { byId, roots: visRoots, width: PAD * 2 + maxDepth * COL + 88, height: Math.max(cursor + PAD, 300) };
}

/** 祖师 → 自己 的链上所有人 */
function chainSet(byId, id) {
  const s = new Set();
  let cur = id, guard = 0;
  while (cur != null && byId.has(cur) && guard++ < 60) { s.add(cur); cur = byId.get(cur).masterId; }
  return s;
}

/* ---- 画布视图：平移/缩放/定位（顶层函数，按钮和手势共用） ---- */
function lnApply() {
  const vp = $('lnVp');
  if (vp) vp.setAttribute('transform', 'translate(' + lnView.x + ',' + lnView.y + ') scale(' + lnView.s + ')');
}
function lnZoomAt(px, py, k) {
  const v = lnView;
  const ns = Math.min(2.5, Math.max(0.22, v.s * k));
  const real = ns / v.s;
  v.x = px - (px - v.x) * real;
  v.y = py - (py - v.y) * real;
  v.s = ns;
  lnApply();
}
/** 把某人带到画布正中（搜索定位用），必要时稍微放大 */
function lnFocus(id) {
  const wrap = $('lnWrap');
  const n = lnById.get(id);
  if (!wrap || !n) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  lnView.s = Math.max(lnView.s, 0.85);
  lnView.x = w / 2 - n.x * lnView.s;
  lnView.y = h / 2 - n.y * lnView.s;
  lnApply();
}

/* ---- 导出族谱图片：按布局数据现拼独立 SVG（内联属性，不依赖页面 CSS）→ Canvas → PNG ---- */
const LN_PNG_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>';
const LN_FONT = "-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif";
const LN_ROW = 62, LN_PAD = 48, LN_HALF_W = 44, LN_HEAD = 132, LN_FOOT = 64;

/** 名字列表按可用宽度折行（中文按 1 字宽、ASCII 按 0.55 估） */
function lnWrapNames(names, maxW, fontPx) {
  fontPx = fontPx || 12;
  const wOf = (s) => [...s].reduce((w, ch) => w + (/[\x00-\xff]/.test(ch) ? fontPx * 0.55 : fontPx), 0);
  const lines = [];
  let cur = '';
  for (const n of names) {
    const candidate = cur ? cur + '、' + n : n;
    if (cur && wOf(candidate) > maxW) { lines.push(cur); cur = n; }
    else cur = candidate;
  }
  if (cur) lines.push(cur);
  return lines;
}

/** 拼一张整族谱的独立 SVG：每棵师门树先算包围盒，再贪心装列（目标是接近方形，别出细长条） */
function lnBuildSvg() {
  const all = [...lnById.values()];
  if (!all.length) return null;
  /* 布局节点上已带 th（门色）与 kids（子树），直接用，保证与画布同色同层级 */
  const roots = all.filter(n => n.masterId == null || !lnById.has(n.masterId));
  const boxes = roots.map(root => {
    const nodes = [], edges = [];
    const walk = (n) => {
      nodes.push(n);
      (n.kids || []).forEach(k => { edges.push([n, k]); walk(k); });
    };
    walk(root);
    const minX = Math.min.apply(null, nodes.map(n => n.x)) - LN_HALF_W;
    const minY = Math.min.apply(null, nodes.map(n => n.y)) - 26;
    const maxX = Math.max.apply(null, nodes.map(n => n.x)) + LN_HALF_W;
    const maxY = Math.max.apply(null, nodes.map(n => n.y)) + 26;
    return { nodes: nodes, edges: edges, minX: minX, minY: minY, w: maxX - minX, h: maxY - minY, x: 0, y: 0 };
  });
  const GAP_X = 56, GAP_Y = 44;
  const colW = Math.max.apply(null, boxes.map(b => b.w).concat([320]));
  const sumH = boxes.reduce((s, b) => s + b.h + GAP_Y, 0);
  const targetH = Math.max(Math.max.apply(null, boxes.map(b => b.h)), Math.sqrt(sumH * colW));
  const cols = [];
  let cur = { boxes: [], w: 0, h: 0 };
  for (const b of boxes) {
    if (cur.boxes.length && cur.h + b.h + GAP_Y > targetH) { cols.push(cur); cur = { boxes: [], w: 0, h: 0 }; }
    cur.boxes.push(b);
    cur.w = Math.max(cur.w, b.w);
    cur.h += b.h + (cur.boxes.length > 1 ? GAP_Y : 0);
  }
  if (cur.boxes.length) cols.push(cur);
  let cx = LN_PAD, bodyH = 0;
  for (const c of cols) {
    let cy = 0;
    for (const b of c.boxes) { b.x = cx; b.y = cy; cy += b.h + GAP_Y; }
    bodyH = Math.max(bodyH, c.h);
    cx += c.w + GAP_X;
  }
  const width = Math.max(cx - GAP_X + LN_PAD, 640);
  /* 没有师傅的人：图底部再补一份文字名单。用原始数据（lineageNodes）而不是上树的节点，
     因为「没师傅又没徒弟」的散人已经不画在树里了，得在这一行里留个记录 */
  const orphans = lineageNodes.filter(n => n.masterId == null).map(n => n.name);
  const listLines = orphans.length ? lnWrapNames(orphans, width - LN_PAD * 2) : [];
  const listH = orphans.length ? 50 + listLines.length * 20 : 0;
  const listTop = LN_HEAD + bodyH;
  const height = LN_HEAD + bodyH + listH + LN_FOOT;
  const px = (b, n) => b.x + (n.x - b.minX);
  const py = (b, n) => b.y + (n.y - b.minY) + LN_HEAD;

  let edges = '', cells = '';
  for (const b of boxes) {
    for (const e of b.edges) {
      const p = e[0], n = e[1];
      const stroke = n.depth === 1 && n.th ? n.th.bd : '#C3CDDC';
      const x1 = px(b, p) + LN_HALF_W, x2 = px(b, n) - LN_HALF_W, mx = (x1 + x2) / 2;
      edges += '<path d="M' + x1 + ',' + py(b, p) + ' H' + mx + ' V' + py(b, n) + ' H' + x2 +
        '" fill="none" stroke="' + stroke + '" stroke-width="1.5"/>';
    }
    for (const n of b.nodes) {
      const off = n.status === 'left';
      const th = n.th;
      const fill = n.depth === 0 && th ? th.bg : '#FFFFFF';
      const stroke = th ? th.bd : '#E5E7EB';
      const nameFill = th && !off ? th.tc : '#0b1c30';
      const sub = n.disciples > 0 ? n.disciples + ' 徒'
        : (off ? '已离团' : '第 ' + ((n.generation != null ? n.generation : n.depth) + 1) + ' 代');
      const nx = px(b, n), ny = py(b, n);
      cells += '<g opacity="' + (off ? 0.45 : 1) + '">' +
        '<rect x="' + (nx - LN_HALF_W) + '" y="' + (ny - 26) + '" width="' + (LN_HALF_W * 2) + '" height="52" rx="11" fill="' + fill +
        '" stroke="' + stroke + '" stroke-width="' + (n.depth === 0 ? 1.5 : 1) + '"/>' +
        '<text x="' + nx + '" y="' + (ny - 3) + '" text-anchor="middle" font-family="' + LN_FONT +
        '" font-size="13" font-weight="700" fill="' + nameFill + '">' + esc(n.name) + '</text>' +
        '<text x="' + nx + '" y="' + (ny + 16) + '" text-anchor="middle" font-family="' + LN_FONT +
        '" font-size="10" fill="#94a3b8">' + esc(sub) + '</text></g>';
    }
  }
  const maxDepth = all.reduce((m, n) => Math.max(m, n.depth), 0);
  const name = todayStr().split('-');
  const title = LABEL() + ' · 族谱';
  const sub2 = '师门 ' + roots.length + ' 支 · 上树 ' + all.length + ' 人 · 最深 ' + (maxDepth + 1) + ' 代';
  const foot = '抖音PK分组 · 生成于 ' + (+name[0]) + '年' + (+name[1]) + '月' + (+name[2]) + '日';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height +
    '" viewBox="0 0 ' + width + ' ' + height + '">' +
    '<rect width="' + width + '" height="' + height + '" fill="#ffffff"/>' +
    '<rect width="' + width + '" height="' + LN_HEAD + '" fill="#F8FAFF"/>' +
    '<text x="' + LN_PAD + '" y="56" font-family="' + LN_FONT + '" font-size="26" font-weight="800" fill="#0b1c30">' + esc(title) + '</text>' +
    '<text x="' + LN_PAD + '" y="84" font-family="' + LN_FONT + '" font-size="13" fill="#64748b">' + esc(sub2) + '</text>' +
    '<line x1="0" y1="' + LN_HEAD + '" x2="' + width + '" y2="' + LN_HEAD + '" stroke="#E5E7EB" stroke-width="1"/>' +
    edges + cells +
    (listH
      ? '<line x1="0" y1="' + (listTop + 6) + '" x2="' + width + '" y2="' + (listTop + 6) + '" stroke="#E5E7EB" stroke-width="1"/>' +
        '<text x="' + LN_PAD + '" y="' + (listTop + 32) + '" font-family="' + LN_FONT + '" font-size="13" font-weight="700" fill="#475467">没有师傅（' + orphans.length + ' 人）</text>' +
        listLines.map((ln, i) =>
          '<text x="' + LN_PAD + '" y="' + (listTop + 54 + i * 20) + '" font-family="' + LN_FONT +
          '" font-size="12" fill="#64748b">' + esc(ln) + '</text>').join('')
      : '') +
    '<line x1="0" y1="' + (height - LN_FOOT + 12) + '" x2="' + width + '" y2="' + (height - LN_FOOT + 12) + '" stroke="#E5E7EB" stroke-width="1"/>' +
    '<text x="' + (width / 2) + '" y="' + (height - 24) + '" text-anchor="middle" font-family="' + LN_FONT +
    '" font-size="12" fill="#94a3b8">' + esc(foot) + '</text></svg>';
  return { svg: svg, width: width, height: height };
}
async function lnExportPng() {
  try {
    const t = lnBuildSvg();
    if (!t) { toast('还没有可导出的族谱'); return; }
    toast('正在生成图片…');
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(t.svg);
    await img.decode();
    /* 太长（近百人 ≈ 7000px）时降倍率，别撞 canvas 尺寸上限 */
    const s = Math.max(1, Math.min(2, 15000 / t.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(t.width * s);
    cv.height = Math.round(t.height * s);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise((res, rej) =>
      cv.toBlob(b => (b ? res(b) : rej(new Error('canvas 转 PNG 失败'))), 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = LABEL() + '族谱-' + todayStr() + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('已导出族谱图片 ' + cv.width + '×' + cv.height);
  } catch (e) {
    toast('导出失败：' + (e && e.message ? e.message : e));
  }
}

/* 卡片树搜索（2026-10-12）：与画布高亮共用同一个搜索框——不匹配的树节点卡 dim、
   匹配的卡描边高亮，并自动展开它的所有祖先支系（不然命中卡可能藏在收起的支系里）；
   搜索词清空时全部还原。画布一侧的 hit 逻辑仍在 lineageUpdateHits，两边互不干扰。 */
function lineageUpdateCardHits() {
  const q = lineageQ.trim();
  document.querySelectorAll('#view .st-branch-card, #view .st-kid-card').forEach(c => {
    const hit = !!q && (c.dataset.name || '').indexOf(q) >= 0;
    c.classList.toggle('dim', !!q && !hit);
    c.classList.toggle('hit', hit);
    if (!hit) return;
    let p = c.parentElement;
    while (p && !p.classList.contains('section')) {
      if (p.classList && p.classList.contains('st-branch-kids') && p.classList.contains('hidden')) {
        p.classList.remove('hidden');
        /* 容器被强制展开后，对应折叠钮的图标也要同步回「已展开」 */
        const ic = document.querySelector('[data-toggle="' + p.id + '"] .material-symbols-outlined');
        if (ic) ic.textContent = 'expand_less';

      p = p.parentElement;
    }
  });
}

function renderLineage(keepView) {

    const cls = 'ln-edge' + (hot ? ' hot' : (anc ? ' dim' : ''));
    const trunk = n.depth === 1 && n.th ? ' style="stroke:' + n.th.bd + '"' : '';
    edges += '<path class="' + cls + '"' + trunk + ' d="M' + x1 + ',' + p.y + ' H' + mx + ' V' + n.y + ' H' + x2 + '"/>';
  }
  let nodes = '';
  for (const n of byId.values()) {
    const off = n.status === 'left';
    const cls = 'ln-node' + (off ? ' off' : '') + (lineageSel === n.id ? ' sel' : '') +
      (anc != null && inChain(n.id) && lineageSel !== n.id ? ' anc' : '') +
      (anc != null && !inChain(n.id) ? ' dim2' : '') +
      (hits != null && hits.has(n.id) ? ' hit' : '');
    const sub = n.disciples > 0 ? n.disciples + ' 徒'
      : (off ? '已离团' : '第 ' + ((n.generation != null ? n.generation : n.depth) + 1) + ' 代');
    let st = '';
    if (n.depth === 0 && n.th) st = 'fill:' + n.th.bg + ';stroke:' + n.th.bd + ';stroke-width:1.5;';
    else if (n.depth === 1 && n.th) st = 'stroke:' + n.th.bd + ';';
    if (hits != null && hits.has(n.id)) st += 'stroke:#f79009;stroke-width:2;';
    const nameSt = n.depth <= 1 && n.th && !off ? ' style="fill:' + n.th.tc + '"' : '';
    nodes += '<g class="' + cls + '" data-id="' + n.id + '" transform="translate(' + n.x + ',' + n.y + ')">' +
      '<rect x="-44" y="-25" width="88" height="50" rx="11"' + (st ? ' style="' + st + '"' : '') + '/>' +
      '<text class="ln-name" y="-3"' + nameSt + '>' + esc(n.name) + '</text>' +
      '<text class="ln-sub" y="15">' + esc(sub) + '</text>' +
      '</g>';
  }
  $('view').innerHTML =
    '<div class="section tab-content-enter">' +
    '<div class="st-ln-tools">' +
      '<div class="st-ln-search">' +
        '<span class="material-symbols-outlined" style="font-size:18px;color:var(--on-surface-variant)">search</span>' +
        '<input id="lnQ" placeholder="搜索主播或代际..." value="' + esc(q) + '" autocomplete="off">' +
        '<button class="st-ln-clear" id="lnQClear" title="清除"' + (q ? '' : ' style="display:none"') + '>' +
          '<span class="material-symbols-outlined">cancel</span></button>' +
      '</div>' +
      '<button class="st-ln-btn" id="lnFit" title="复位"><span class="material-symbols-outlined">filter_center_focus</span></button>' +
      '<button class="st-ln-btn" id="lnTglAll" title="' + (lnAllOpen ? '全部收起' : '全部展开') + '">' +
        '<span class="material-symbols-outlined" id="lnTglAllIc">' + (lnAllOpen ? 'unfold_less' : 'unfold_more') + '</span></button>' +
      '<button class="st-ln-btn" id="lnPng" title="导出图片">' + LN_PNG_ICON + '</button>' +
    '</div>' +
    periodChips +
    '<div class="st-branch">' + branchCards + '</div>' +
    '<div class="lineage-wrap" id="lnWrap">' +
    '<div class="ln-hint"><span class="tip">完整师门链 · 拖动查看 · 点人看传承路径</span>' +
    '<span class="qinfo" id="lnQInfo"' + (q ? '' : ' style="display:none"') + '></span></div>' +
    '<div class="ln-ctl">' +
    '<button id="lnZin" title="放大">+</button>' +
    '<button id="lnZout" title="缩小">−</button>' +
    '<button id="lnFull" title="全屏"></button>' +
    '</div>' +
    '<svg><g id="lnVp" transform="translate(0,0) scale(1)">' + edges + nodes + '</g></svg>' +
    '</div>' +
    '</div>';
  /* 口径切换绑定（2026-10-12）：点了带 period 重拉族谱数据 */
  $('view').querySelectorAll('[data-lp]').forEach(b => {
    b.onclick = () => { if (b.dataset.lp !== lineagePeriod) loadLineage(b.dataset.lp); };
  });
  bindLineage(t, keepView);
  /* 支系和子支系共用一套折叠交互（默认全展开）：图标 expand_less=已展开 / expand_more=已收起 */
  $('view').querySelectorAll('[data-toggle]').forEach(b => {

      if (!box) return;
      const hidden = box.classList.toggle('hidden');
      b.querySelector('.material-symbols-outlined').textContent = hidden ? 'expand_more' : 'expand_less';
    };
  });
  /* 重渲染（如画布点人）会重建卡片树：搜索词还在的话把 dim/高亮补回来 */
  lineageUpdateCardHits();
}

function bindLineage(t, keepView) {
  const wrap = $('lnWrap');
  const fit = () => {
    // 横向树：祖师贴左边、纵向居中到最大师门（一代向右一列）
    const w = wrap.clientWidth || 360;
    const h = wrap.clientHeight || 400;
    const root = t.roots[0];
    lnView.s = Math.max(0.55, Math.min(0.95, (w - 24) / 460));
    lnView.x = 16;
    lnView.y = h / 2 - root.y * lnView.s;
    lnApply();
  };
  $('lnFit').onclick = fit;
  $('lnZin').onclick = () => lnZoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, 1.25);
  $('lnZout').onclick = () => lnZoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, 0.8);
  $('lnFull').onclick = lnToggleFs;
  $('lnPng').onclick = lnExportPng;
  /* 双击画布 = 全屏切换（拖动/点人不受影响：双击才触发） */
  wrap.addEventListener('dblclick', (e) => {
    if (e.target.closest && e.target.closest('.ln-ctl, .ln-hint')) return;
    lnToggleFs();
  });
  if (lnFsCss) wrap.classList.add('ln-fs');   // 全屏中切视图/重渲染，状态不丢
  lnSyncFsIcon();
  const qInput = $('lnQ');
  const qClear = $('lnQClear');
  /* 清除按钮跟随输入显隐；搜索框同时驱动两边：画布 hit（lineageUpdateHits）+
     卡片树 dim/高亮（lineageUpdateCardHits） */
  const syncClear = () => { qClear.style.display = qInput.value.trim() ? '' : 'none'; };
  qInput.oninput = () => {
    lineageQ = qInput.value; lnHitIdx = 0;
    syncClear(); lineageUpdateHits(); lineageUpdateCardHits();
  };
  qClear.onclick = () => {
    qInput.value = ''; lineageQ = ''; lnHitIdx = 0;
    syncClear(); lineageUpdateHits(); lineageUpdateCardHits();
    qInput.focus();
  };
  qInput.onkeydown = (e) => {
    if (e.key !== 'Enter') return;
    const ids = lineageHitIds();
    if (!ids.length) return;
    lnHitIdx = (lnHitIdx + 1) % ids.length;
    lineageUpdateHits();
  };
  /* 全部展开/收起：统一控制每一级支系容器（含孙辈），并同步所有折叠钮图标 */
  $('lnTglAll').onclick = () => {
    lnAllOpen = !lnAllOpen;
    $('view').querySelectorAll('.st-branch-kids[id]').forEach(box =>
      box.classList.toggle('hidden', !lnAllOpen));
    $('view').querySelectorAll('[data-toggle] .material-symbols-outlined').forEach(ic =>
      ic.textContent = lnAllOpen ? 'expand_less' : 'expand_more');
    $('lnTglAllIc').textContent = lnAllOpen ? 'unfold_less' : 'unfold_more';
    $('lnTglAll').title = lnAllOpen ? '全部收起' : '全部展开';
  };
  const pts = new Map();
  let pinchD = 0, moved = 0, onCtl = false;
  /* 手势坐标 → 画布内坐标的换算 */
  const rel = (cx, cy) => {
    const r = wrap.getBoundingClientRect();
    return [cx - r.left, cy - r.top];
  };
  wrap.addEventListener('pointerdown', (e) => {
    /* 控件（缩放/全屏/搜索框）交给原生 click：一旦抢了指针或重建 DOM，
       按钮的 click 就不触发了（真实点击踩过，合成 .click() 测不出来） */
    if (e.target.closest && e.target.closest('.ln-ctl, .ln-hint')) { onCtl = true; return; }
    wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) moved = 0;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      moved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
      lnView.x += e.clientX - prev.x;
      lnView.y += e.clientY - prev.y;
      lnApply();
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD > 0) {
        const [px, py] = rel((a.x + b.x) / 2, (a.y + b.y) / 2);
        lnZoomAt(px, py, d / pinchD);
      }
      pinchD = d;
    }
  });
  const up = (e) => {
    if (onCtl) { onCtl = false; return; }
    const wasTap = pts.size === 1 && moved < 6;
    pts.delete(e.pointerId);
    pinchD = 0;
    if (wasTap) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('.ln-node') : null;
      const id = g ? +g.dataset.id : null;
      lineageSel = id != null && lineageSel !== id ? id : null;
      renderLineage(true);
    }
  };
  wrap.addEventListener('pointerup', up);
  wrap.addEventListener('pointercancel', (e) => { onCtl = false; pts.delete(e.pointerId); pinchD = 0; });
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const [px, py] = rel(e.clientX, e.clientY);
    lnZoomAt(px, py, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });
  if (keepView) lnApply(); else fit();
}

function groupHtml(d, page, list) {
  const showWave = !d.display || d.display.wave !== false;
  const showGroups = !d.display || d.display.groups !== false;
  const groups = d.groups || [];
  const sched = d.schedule || {};
  const nPlayers = d.counts ? d.counts.players : groups.reduce((s, g) => s + (g.count || 0), 0);
  const nGroups = d.counts ? d.counts.groups : groups.length;
  const day = (d.dates && d.dates[0]) || String(d.createdAt || '').slice(0, 10);
  const meta = [
    d.eventType || '',
    '共 ' + nPlayers + ' 人',
    sched.start ? sched.start + ' 后 / 间隔 ' + (sched.intervalMin || 15) + ' 分' : '',
  ].filter(Boolean).join(' · ');

  /* 顶部：赛事维度 segmented（复用 #subnav 的真实按钮文案/状态） */
  const tabs = [...document.querySelectorAll('#subnav button:not([disabled])')].map(b =>
    '<button data-g="' + b.dataset.g + '"' + (b.dataset.g === curGroup ? ' class="on"' : '') +
    '>' + esc(b.textContent) + '</button>').join('');

  let html = '<div class="section tab-content-enter">';
  if (d.stale) html += '<div class="stale">分组用的是快照数据，可能不是最新</div>';
  html += '<div class="st-group-tabs">' + tabs + '</div>';

  /* 场次信息卡 + 组别胶囊 */
  html +=
    '<div class="st-my-big" style="margin-top:0">' +
      '<div class="lbl"><span>' + esc(page.label) + (day ? ' · ' + esc(day) : '') + '</span>' +
      '<span class="chip">' + nGroups + '组 · ' + nPlayers + '人</span></div>' +
      '<div style="margin-top:.375rem;font-size:18px;font-weight:600;color:var(--on-surface)">' +
        esc(d.title || page.label) + '</div>' +
      (meta ? '<div style="margin-top:.25rem;font-size:12px;color:var(--on-surface-variant)">' +
        esc(meta) + '</div>' : '') +
    '</div>' +
    '<div class="st-group-chips">' + groups.map((g, i) =>
      '<button class="st-group-chip' + (i === 0 ? ' on' : '') + '" data-scroll="gcard-' + i + '">' +
        '<span class="n"></span><span>' + esc(g.name) + '</span>' +
        '<span class="c">' + (g.count || (g.players || []).length) + '人</span>' +
      '</button>').join('') + '</div>';

  if (!showGroups) {
    return html + '<div class="empty">名单尚未开放<br>开赛时间如上</div></div>';
  }
  if (!groups.length) {
    return html + '<div class="empty"><span class="big">📺</span>暂无分组数据</div></div>';
  }

  /* 分组卡：横向滑动 + snap；成员白卡列表（序号 / 首字头像 / 姓名） */
  html += '<div class="st-group-cards" id="stGroupCards">' + groups.map((g, gi) => {
    const mems = (g.players || []).map((p, pi) =>
      '<div class="st-gmem">' +
        '<span class="st-gmem-rk">' + String(pi + 1).padStart(2, '0') + '</span>' +
        '<div class="st-gmem-av">' + esc(String(p.name || '?').charAt(0)) + '</div>' +
        '<span class="st-gmem-nm">' + esc(p.name) + (p.leader ? ' · ' + esc(p.leader) : '') + '</span>' +
      '</div>').join('');
    return '<section class="st-gcard" id="gcard-' + gi + '">' +
      '<div class="st-gcard-head"><div class="l">' +
        '<span class="bar' + (gi % 2 ? ' alt' : '') + '"></span>' +
        '<h2>' + esc(g.name) + '</h2></div>' +
        '<span class="cnt">' + (g.count || (g.players || []).length) + (g.slot ? '人满员' : '人') +
        (g.slot ? ' · ' + esc(g.slot) + ' 开赛' : '') + '</span></div>' +
      '<div class="st-gcard-body">' + (mems || '<div class="empty" style="padding:18px">空组</div>') + '</div>' +
    '</section>';
  }).join('') + '</div>';

  html += '<div class="gx-foot" style="text-align:center;color:var(--on-surface-variant);font-size:11px;margin-top:.25rem">' +
    esc((d.title || 'PK 分组') + (d.eventType ? ' · ' + d.eventType : '') + ' | ' + todayStr()) + '</div>';

  if (list.length > 1) {
    html += '<div class="st-my-list" style="margin-top:1rem"><div class="sec">切换已上架方案</div>' +
      list.map(p => '<button class="st-my-item" data-pid="' + p.id + '" style="width:100%;border:none;background:none;cursor:pointer">' +
        '<div class="l"><div class="ico"><span class="material-symbols-outlined">playlist_play</span></div>' +
        '<div class="t">' + esc(p.title || ('方案 ' + p.id)) + '</div></div>' +
        '<div class="r"><span class="pri">' + (p.id === planByType[curGroup] ? '当前' : '切换') + '</span>' +
        '<span class="material-symbols-outlined">chevron_right</span></div></button>').join('') + '</div>';
    setTimeout(() => document.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => {
      planByType[curGroup] = Number(b.dataset.pid); loadGroup();
    }), 0);
  }
  return html + '</div>';
}

/** Stitch 分组交互：赛事 tab 切换 / 组别胶囊滚动到卡片 */
function bindStGroupTabs() {
  document.querySelectorAll('.st-group-tabs button[data-g]').forEach(b => {
    b.onclick = () => {
      if (!b.disabled) {
        curGroup = b.dataset.g;

  document.querySelectorAll('.st-group-chip[data-scroll]').forEach(c => {

/* ==================== 我的（手机号+密码登录） ==================== */
/* 账号来源：只有管理员在后台手动添加这一条路径（2026-10-14 注册功能已下线）。
   历史遗留的账号要先绑定主播，才有个人的音浪数据。
   token 存 sessionStorage，关闭浏览器后需重新登录；服务重启或失效自动退回登录卡。 */
const MY_ANY_KEY = 'myToken_any';
const MY_ANY_NAME = 'myName_any';
const MY_KEY = () => MY_ANY_KEY;
const MY_NAME_KEY = () => MY_ANY_NAME;

/* 登录态存放位：统一入口存 MY_ANY_KEY；旧团别 key 只做兼容读取 */
function myTokenKeys() {
  return [MY_ANY_KEY, 'myToken_male', 'myToken_female'];
}
const myTeamOfKey = (k) =>
  (k === 'myToken_male' ? 'male' : k === 'myToken_female' ? 'female' : '');
function readMyToken(key) {
  const token = sessionStorage.getItem(key);
  if (token) return token;
  const legacyToken = localStorage.getItem(key);   // 老版本存 localStorage：读到就搬进 sessionStorage
  if (legacyToken) {
    sessionStorage.setItem(key, legacyToken);
    localStorage.removeItem(key);
  }
  return legacyToken || '';
}

/** 当前登录态：{ token, team }（team 空串 = 团别待定，两团都能看；没登录则 token 为空） */
function mySession() {
  for (const key of myTokenKeys()) {
    const token = readMyToken(key);
    if (token) return { token: token, team: myTeamOfKey(key) };
  }
  return { token: '', team: '' };
}
function myToken() { return mySession().token; }
/** 带登录态的请求头：token 只走 X-My-Token（后端唯一入口，见 admin.rs::header_my_token）。
    所有需要登录态的 fetch 都必须经过这里，别再往 URL 上拼 ?token= / ?access_token=。 */
function myTokenHeaders(extra) {
  const h = Object.assign({}, extra || {});
  const t = myToken();
  if (t) h['X-My-Token'] = t;
  return h;
}
/* 登录态换发（2026-10-15 契约 A）：重置密码成功后后端会吊销**全部**旧 token，
   只下发一个新 token。新 token 统一写进唯一存放位 MY_ANY_KEY，并把所有历史引用
   （旧团别 key、老版本可能落在 localStorage 的那份）一并清掉——
   漏掉任何一处，下一次请求就会带着已吊销的死 token 打过去、全站 401。 */
function setMyToken(token) {
  if (!token) return;
  sessionStorage.setItem(MY_ANY_KEY, token);
  myTokenKeys().forEach((k) => {
    if (k === MY_ANY_KEY) return;
    sessionStorage.removeItem(k);
    localStorage.removeItem(k);
  });
  localStorage.removeItem(MY_ANY_KEY);   // 读侧有 localStorage→sessionStorage 的迁移兜底，这里清掉避免回灌旧值
}
function myLogout() {
  ['myToken_male', 'myToken_female', MY_ANY_KEY].forEach((k) => {
    sessionStorage.removeItem(k);
    localStorage.removeItem(k);
  });
  localStorage.removeItem(MY_NAME_KEY());
  localStorage.removeItem(MY_ANY_NAME);
  chasePicked.clear();   // 换账号/退出后旧的多选暂存不能跟着新账号走
}

async function loadMy() {
  const t = myToken();
  if (!t) { sessionExpired(); return; }
  $('mhSub').textContent = 'MY';
  try {
    /* 账号还没绑主播（历史遗留 bound=0 / person_id=0，2026-10-14）：
       绑定由管理员在后台做，前端没有自助入口，所以这里**仍然早退**出一张说明卡 ——
       不能「继续拉主数据」：未绑定账号 person_id=0，后端 /my 会回 admin:true，
       前端据此把推送/追分控件渲染成禁用态，抖音号绑定提交也会被后端硬拒
       （binds.rs「管理员账号缺少对应的主播档案」）。与其给一堆点不动的控件，
       不如直接说清楚去找管理员。
       token 由 api() 统一走 X-My-Token 头（2026-10-13），URL 不再带登录态。 */
    const who = await api('/api/public/teams/' + TEAM + '/my/who');
    if (who && who.needBind) { applyLoginState(who); renderBindCard(who); return; }
    const d = await api('/api/public/teams/' + TEAM + '/my');
    myPersonId = Number(d.personId || 0) || null;
    let series = null;
    try {
      series = await api('/api/public/teams/' + TEAM + '/my/series?days=14');
    } catch (_) { /* 趋势图失败不挡主数据 */ }
    let push = null;
    try {
      push = await api('/api/public/teams/' + TEAM + '/my/push');
    } catch (_) { /* 推送状态失败不挡主数据 */ }
    /* 我的抖音号（2026-10-12）：后端并行实现中。失败/超时一律不挡主数据，
       这里用 {__err:true} 占位，卡片位置只出一行灰字（口径见 myAccountsCard） */
    let accounts = null;
    try {
      accounts = await api('/api/public/teams/' + TEAM + '/my/accounts');
    } catch (_) { accounts = { __err: true }; }
    renderMy(d, series, push, accounts);
    /* 📣 「我的」页公告条（2026-10-13）：renderMy 渲染完成后，placements.my 开着才追加。
       插在 view 内容最顶上（资料卡之前），图标默认 person。
       深链 /my/<sub> 直接落到子页时不挂（公告属于「我的」列表首页）。 */
    if (!mySub) renderMyAnnouncement(site && site.placements && site.placements.my);
    /* 📩 管理员消息探测（docs/23 §6.1）：主界面渲染完成后拉一次未读，有未读才弹。
       fire-and-forget：接口失败/无未读/token 过期一律静默（fetchMyMessages 内部兜底），
       绝不挡主数据；本次页面生命周期只自动弹一次（probeMyMessages 内部锁）。 */
    probeMyMessages().catch(() => {});
  } catch (e) {
    /* token 过期/没验证过 → 回登录门；其它错误照常显示错误态 */
    const m = String(e.message || '');
    if (m.indexOf('过期') >= 0 || m.indexOf('缺少') >= 0 || m.indexOf('请先登录') >= 0) {
      sessionExpired();
    } else {
      $('view').innerHTML = '<div class="empty"><span class="big">📵</span>取不到个人数据<br>' + esc(m) + '</div>';
    }
  }
}

/* ==================== 账号绑定主播（只由管理员在后台做，前端无自助入口） ====================
   用户口径（2026-10-14）：账号 → 主播姓名的绑定由后端/管理员处理，主播自己不绑。
   未绑定账号（历史遗留 bound=0 / person_id=0）仍能登录，但这里只出一张「联系管理员」的

function renderBindCard(who) {

    '<div class="card my-bind">' +
      '<h2 class="card-t">账号未绑定主播</h2>' +

      '<div class="sub">账号 <b>' + esc(who.phone || who.name || '') +

function renderMyLogin() {
  /* 全站有登录门后这里只是兜底（正常到不了）；文案保持与登录门一致 */
  const name = localStorage.getItem(MY_NAME_KEY()) || '';
  $('mhSub').textContent = 'MY';
  $('view').innerHTML = '<div class="section my-login">' +
    '<div class="card card-pad">' +
    '<div class="big-av" style="background:' + avColor(LABEL()) + '">' + esc(LABEL().charAt(0)) + '</div>' +
    '<h3>' + esc(LABEL()) + ' · 我的数据</h3>' +
    '<p class="tip">账号由管理员添加<br>使用「手机号 + 密码」登录（姓名也可以）</p>' +
    '<input id="myName" placeholder="手机号 / 姓名" value="' + esc(name) + '" autocomplete="off">' +
    /* 2026-10-14：与登录门 gatePass 同口径 —— 密码是 4~20 位字母或数字，
       inputmode="numeric" 只弹数字键盘、字母打不出来（设了字母密码就登不进来），删掉用默认键盘。 */
    '<input id="myPass" placeholder="密码" autocomplete="off">' +
    '<div class="form-err hidden" id="myErr"></div>' +
    '<button class="btn-main" id="myGo">查看我的数据</button>' +
    '</div></div>';
  const go = async () => {
    const nm = $('myName').value.trim(), pw = $('myPass').value.trim();
    const errEl = $('myErr');
    if (!nm || !pw) {
      errEl.textContent = '请输入账号和密码';
      errEl.classList.remove('hidden');
      return;
    }
    const btn = $('myGo');
    btn.disabled = true; btn.textContent = '验证中…';
    errEl.classList.add('hidden');
    try {
      const r = await fetch('/api/public/my/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account: nm, pass: pw }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      /* 2026-10-14：后端已区分「密码错误」和「账号还没开通」，这里优先显示后端下发的原因 d.error；
         后端仍有个别分支只回 {ok:false} 不带 error（台账查无此人、管理观看账号未通过等），回落到原兜底文案 */
      if (!d.ok) throw new Error(d.error || '账号或密码不对，或账号还没开通');
      sessionStorage.setItem(MY_ANY_KEY, d.token);
      localStorage.setItem(MY_NAME_KEY(), d.name || nm);
      toast('验证通过');
      loadMy();
    } catch (e) {
      btn.disabled = false; btn.textContent = '查看我的数据';
      errEl.textContent = e.message || '验证失败，稍后再试';
      errEl.classList.remove('hidden');
    }
  };
  $('myGo').onclick = go;
  $('myName').onkeydown = (e) => { if (e.key === 'Enter') $('myPass').focus(); };
  $('myPass').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

/** 我的抖音号卡（2026-10-12）：GET /api/public/teams/{TEAM}/my/accounts
    每个绑定的抖音号一行，显示日/月/年/累计音浪（与 /my 同一口径）。
    三条兜底：published:false → 整卡不渲染；summary.count 为 0 → 空态文案；
    accounts.__err（接口失败/超时，loadMy 里吞掉的）→ 灰字「抖音号数据加载失败」，绝不让页面挂掉。 */
function myAccountsCard(accounts) {
  if (!accounts || accounts.published === false) return '';
  const wave = (o) => o == null || o.wave == null ? '—' : wan(o.wave);
  /* 2026-10-15 任务五：数值格右对齐 + tabular-nums（CSS 在 .wg .c b / .sum .c b 上），
     标签「日/月/年/累计」包一层 <i>（font-style:normal;min-width:2em）防被数值挤压。 */
  const cell = (label, o) => '<span class="c">' + label + '<b>' + esc(wave(o)) + '</b></span>';
  if (accounts.__err) {
    return '<div class="st-my-acct">' +
      '<div class="sec"><span>我的抖音号</span></div>' +
      '<div class="fail">抖音号数据加载失败</div></div>';
  }
  const list = Array.isArray(accounts.accounts) ? accounts.accounts : [];
  const sum = accounts.summary || null;
  if (!sum || !Number(sum.count)) {
    return '<div class="st-my-acct">' +
      '<div class="sec"><span>我的抖音号</span></div>' +
      '<div class="none">还没有绑定抖音号，绑定后这里显示每个号的数据</div></div>';
  }
  const body = list.map((a) => {
    /* 没登记抖音号时退回采集 ID，并加 `ID ` 前缀标明「这不是抖音号」——
       与推送文案（push.rs::AccountWave::display_name）同一口径，2026-10-12 */
    /* 2026-10-13 用户口径：抖音号行主标题显示抖音名称（anchorName），
       抖音号做次行说明；没有名称才退回抖音号/采集 ID。 */
    const no = a.douyinNo
      ? String(a.douyinNo)
      : (a.anchorId ? 'ID ' + String(a.anchorId) : '');
    const title = (a.anchorName ? String(a.anchorName) : '') || no;
    /* 2026-10-15 任务五：日期只动展示 —— 2026-10-15 缩写成 10-15（MM-DD），
       只认 YYYY-MM-DD 形态的才缩，其它格式原样透传；lastDate 为空仍显示「暂无数据」。
       数据字段（a.lastDate）原样保留，不参与任何请求。 */
    const lastDate = a.lastDate ? String(a.lastDate) : '';
    const dateShown = /^\d{4}-\d{2}-\d{2}$/.test(lastDate) ? lastDate.slice(5) : lastDate;
    const sub = (no && a.anchorName ? no + ' · ' : '') +
      (lastDate ? dateShown : '暂无数据') +
      (Number(a.days) > 0 ? ' · ' + a.days + ' 天有数据' : '');
    /* 2026-10-15 任务五：整行可点复制抖音号。复制的是 douyinNo 本体（no 前缀是
       「ID 」兜底展示形态，带出去没意义）；no 为空不挂 .copiable、不绑事件。 */
    const copyable = no && a.douyinNo;
    return '<div class="row' + (copyable ? ' copiable" data-copy="' + esc(no) : '') + '">' +
      '<div class="l"><div class="ico"><span class="material-symbols-outlined">smart_display</span></div>' +
      '<div style="min-width:0">' +
        '<div style="display:flex;align-items:center;min-width:0"><span class="t">' + esc(title) + '</span>' +
        (a.primary ? '<span class="chip">主号</span>' : '') +
        '<span class="st' + (a.liveToday ? ' on' : '') + '"><i></i>' +
        (a.liveToday ? '今日已开播' : '今日未开播') + '</span></div>' +
        '<div class="d">' + esc(sub) + '</div>' +
      '</div></div>' +
      '<div class="wg">' +
        cell('日', a.daily) + cell('月', a.monthly) +
        cell('年', a.yearly) + cell('累计', a.total) +
      '</div></div>';
  }).join('');
  return '<div class="st-my-acct">' +
    '<div class="sec"><span>我的抖音号</span><span class="n">共 ' + Number(sum.count) + ' 个</span></div>' +
    '<div class="sum"><span>合计</span><span class="g">' +
      cell('日', sum.daily) + cell('月', sum.monthly) +
      cell('年', sum.yearly) + cell('累计', sum.total) +
    '</span></div>' + body + '</div>';
}

function renderMy(d, series, push, accounts) {
  accounts = accounts || null;
  if (d.name) {
    localStorage.setItem(MY_NAME_KEY(), d.name);
    /* 水印口径（2026-10-11）：手机号优先（打码），无手机号回退艺名。
       my 数据接口不带 phone，手机号从登录态 meState 取，避免被艺名覆盖。
       2026-10-14：meState.phone 已是后端打码值，这里不再二次 mask。 */
    const wmPhone = meState && meState.phone;
    applyWatermark(wmPhone || d.name);
  }
  pushState = push || null;
  /* 时长口径统一走 minFmt（x时x分，不要秒），与榜单 / 领奖台一致 */
  const minText = (v) => v == null ? '' : '时长 ' + minFmt(v);
  const stat = (label, o, prevLabel) => '<div class="my-stat"><div class="l">' + label + '</div>' +
    '<div class="w">' + (o.wave == null ? '—' : wan(o.wave)) +
    (o.wave == null || o.prevWave == null ? '' :
      ' <span class="pv" title="较' + esc(prevLabel) + (o.prevWave === 0 ? '无数据' : ' ' + wan(o.prevWave)) + '">' +
      waveDelta(o.wave, o.prevWave) + '</span>') +
    '</div>' +
    (o.minutes == null ? '' : '<div class="m">' + minText(o.minutes) + '</div>') + '</div>';
  /* 未播口径与榜单一致：当日音浪 < 2 = 未开播 */
  const offToday = d.daily && d.daily.wave != null && d.daily.wave < 2;
  /* 近 14 个业务日趋势：条形图，未播（<3）置灰 */
  let trend = '';
  const waves = series && series.waves;
  if (Array.isArray(waves) && waves.length) {
    const max = Math.max.apply(null, waves.concat([1]));
    const bars = waves.map((w, i) =>
      '<div class="b' + (w < 2 ? ' off' : '') + '" style="height:' +
      Math.max(4, Math.round(w / max * 100)) + '%" title="' +
      esc((series.dates[i] || '').slice(5)) + ' · ' + wan(w) + '"></div>').join('');
    const xs = '<span>' + esc((series.dates[0] || '').slice(5)) + '</span>' +
      '<span></span>'.repeat(Math.max(0, waves.length - 2)) +
      '<span style="text-align:right">' + esc((series.dates[waves.length - 1] || '').slice(5)) + '</span>';
    trend = '<div class="card my-trend"><h2 class="card-t">近 ' + waves.length + ' 个业务日音浪</h2>' +
      '<div class="bars">' + bars + '</div><div class="xs">' + xs + '</div></div>';
  }
  /* Stitch 版我的页：资料卡 → 大数字卡 → Grouped List */
  /* 副标题（2026-10-12）：「团名 · 师承【师傅】」。masterName 是 /my 接口字段（没有师傅 = null，
     整段只显示团名）；原「日期 · 未开播」挪到大数字卡「预估折合收益」行尾，信息不丢 */
  const head = '<div class="st-my-head">' +
    '<div class="st-my-av">' +
      esc(String(d.name || '?').charAt(0)) +
      '<span class="badge"><span class="material-symbols-outlined">verified</span></span>' +
    '</div>' +
    '<div style="flex:1;min-width:0">' +
      '<div style="display:flex;align-items:center;gap:.375rem"><span class="nm">' + esc(d.name || '—') + '</span>' +
      '<span class="tag">主账号</span></div>' +
      '<div class="sub">' + esc(LABEL()) + (d.masterName ? ' · 师承【' + esc(d.masterName) + '】' : '') + '</div>' +
    '</div>' +
  '</div>';

  const m = d.monthly || {};
  const t = d.total || {};
  const y = d.yearly || {};
  const dd = d.daily || {};
  const monthlyYuan = m.yuan == null ? (m.wave == null ? '—' : yuan(m.wave / 10)) : yuan(m.yuan);
  /* Stitch 版音浪对比卡（2026-10-13）：今日/本月/本年 三段同期对照。
     daily.prevWave=上一业务日、monthly.prevWave=上月同期、yearly.prevWave=去年同期，
     数据 /my 全有（minutes.rs 同期对照字段）。涨红跌绿沿用 waveDelta。 */
  const cmpRow = (icon, label, o, prevLabel) => {
    if (!o || o.wave == null) return '';
    const delta = (o.prevWave == null || o.prevWave === 0) ? ''
      : ' <span class="pv">' + waveDelta(o.wave, o.prevWave) + '</span>';
    const pctTag = (o.prevWave != null && o.prevWave > 0)
      ? '<span class="st-cmp-pct">' + (o.wave >= o.prevWave ? '+' : '') +
        Math.round((o.wave - o.prevWave) / o.prevWave * 1000) / 10 + '%</span>' : '';
    return '<div class="st-cmp-row"><span class="material-symbols-outlined">' + icon + '</span>' +
      '<span class="cl">' + label + '</span>' +
      '<span class="cv">' + wan(o.wave) + delta + '</span>' + pctTag +
      '<span class="cp">' + prevLabel + '</span></div>';
  };
  const big = '<div class="st-my-big">' +
    '<div class="lbl"><span>音浪对比</span></div>' +
    cmpRow('today', '今日音浪', dd, '比上日') +
    cmpRow('calendar_month', '本月音浪', m, '比上月同期') +
    cmpRow('functions', '本年累计', y, '比去年同期') +
    '<div class="st-cmp-rmb"><div class="l"><span class="material-symbols-outlined">monetization_on</span>' +
      '<span>本月预估折合收益</span><span class="pct-tag">35%分成</span></div>' +
      '<div class="v">' + monthlyYuan + '</div></div>' +
  '</div>';


  /* 推送状态走 /my/push 的真实字段（后端没有 configured 这个键）：
     bound=已对接可推送；scanBound+needActivate=扫了码还没等微信确认（2026-10-17 起归入未完成态）。 */
  /* 2026-10-13 用户口径：只接微信推送，不显示 QQ。
     2026-10-15 任务二：三态文案抽成 pushStatusText(p)（2026-10-17 后只剩「我的」列表页这一处使用）。 */
  const pushStatus = pushStatusText(push);

  $('view').innerHTML = '<div class="section tab-content-enter">' +
    head + big + trend + myAccountsCard(accounts) +
    '<div class="st-my-list">' +
      '<div class="sec">系统服务与偏好</div>' +
      '<div class="st-my-item" id="myPushRow" style="cursor:pointer"><div class="l"><div class="ico"><span class="material-symbols-outlined">notifications</span></div>' +
      '<div style="min-width:0"><div class="t">消息设置</div>' +
      '<div class="d">微信机器人对接与推送开关</div></div></div>' +
      '<div class="r"><span>' + esc(pushStatus) + '</span>' +
      '<span class="material-symbols-outlined">chevron_right</span></div></div>' +
      '<div class="st-my-item" id="myChaseRow" style="cursor:pointer"><div class="l"><div class="ico"><span class="material-symbols-outlined">flag</span></div>' +
      '<div style="min-width:0"><div class="t">追分设置</div>' +
      '<div class="d">追人 · 定目标分，进度变化 wxbot 私聊提醒</div></div></div>' +
      '<div class="r"><span>' + esc(chaseSummary(push)) + '</span>' +
      '<span class="material-symbols-outlined">chevron_right</span></div></div>' +
      '<div class="st-my-item" id="myForgot" style="cursor:pointer">' +
      '<div class="l"><div class="ico"><span class="material-symbols-outlined">lock_reset</span></div>' +
      '<div class="t">重置密码</div></div>' +
      '<div class="r"><span class="material-symbols-outlined">chevron_right</span></div></div>' +
      '<div class="st-my-item" id="myAbout" style="cursor:pointer"><div class="l"><div class="ico"><span class="material-symbols-outlined">info</span></div>' +
      '<div class="t">关于系统与内部版本</div></div>' +
      '<div class="r"><span>v7.10-FINAL</span></div></div>' +
    '</div>' +
    /* 联系运营卡（2026-10-12）：项目里没有私信通道，按钮只给微信联系方式提示 */
    '<div class="st-my-ops">' +
      '<div class="st-my-ops-av">帅</div>' +
      '<div style="flex:1;min-width:0"><div class="t">遇到问题？请私信帅帅</div>' +
      '<div class="d">运营专员在线 · 快速协助排查核算</div></div>' +
      '<button class="st-my-ops-btn" id="myOps">' +
      '<span class="material-symbols-outlined">chat</span>立即私信</button>' +
    '</div>' +
    /* 不再按 push 有无渲染：接口失败也落地一张带重试的卡，
       保住「点那一行有东西可滚」这个最基本的行为 */
    pushCard(push) +
    /* 「追分设置」独立卡（2026-10-13 用户口径）：与推送卡分开，
       追分目标表单只出现在这张卡里，推送卡只管绑定与开关 */
    chaseCard(push) +
    '<button class="my-logout" id="myOut">退出登录</button>' +
  '</div>';
  $('myOut').onclick = () => {
    myLogout();
    removeWatermark();
    location.reload();   // 回登录门
  };
  $('myOps').onclick = () => {
    /* 没有站内私信通道（运营在微信里），这里只指路不跳转 */
    toast('请直接在微信里联系帅帅');
  };
  /* 我的抖音号：整行点击复制抖音号（2026-10-15 任务五）。
     行 DOM 由 myAccountsCard 生成（.row.copiable[data-copy]，douyinNo 为空的行不挂），
     复制成功 toast('已复制抖音号')；无 clipboard API 的老浏览器降级 toast 失败提示。 */
  document.querySelectorAll('.st-my-acct .row.copiable').forEach((rowEl) => {
    rowEl.onclick = async () => {
      const no = rowEl.dataset.copy || '';
      if (!no) return;
      try {
        if (!navigator.clipboard) throw new Error('clipboard unavailable');
        await navigator.clipboard.writeText(no);
        toast('已复制抖音号');
      } catch (_) {
        toast('复制失败，请手动复制');
      }
    };
  });
  $('myForgot').onclick = () => {
    /* 2026-10-15 契约 A：入口「重置密码」——登录态下直接换新密码，
       不需要旧密码（POST /api/public/my/password，身份只认 X-My-Token 头，
       body 只有 {newPass}）。成功后后端吊销全部旧 token 并下发新 token，
       由对话框负责覆盖本地登录态。 */
    openMyPwdDlg();
  };
  /* 列表两行滚到页内对应的操作卡：绑定行 → 绑定/审计卡，推送行 → 推送卡。
     卡片是异步渲染的（my / series / claim / push / accounts 五个请求回来才拼 DOM），
     所以找不到目标时短轮询等一下再滚，而不是静默 return 让用户以为点了没反应。 */
  const scrollToCard = (id) => {
    let tries = 0;
    const attempt = () => {
      const el = id && $(id);
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return true; }
      if (++tries > 20) {   // 最多等 ~1s（50ms × 20），超过就当这张卡真的不显示
        toast('功能加载中，稍等一下再点');
        return false;
      }
      setTimeout(attempt, 50);
      return false;
    };
    attempt();
  };
  /* 列表行 → 子页（2026-10-13 用户口径）：下一页式（/my/<sub>，带返回按钮），
     不再是页内滚动。内容由 renderMySub 从本页已加载的数据就地组装。 */
  /* 2026-10-14：myPrivacy 行已删除，对应 onclick 一并移除
     （$() 找不到元素会返回 null，留着赋值会 TypeError 白屏）。 */
  $('myAbout').onclick = () => { mySub = 'about'; pushRoute(); renderMySub(); };
  $('myPushRow').onclick = () => { mySub = 'wechat'; pushRoute(); renderMySub(); };
  $('myChaseRow').onclick = () => { mySub = 'chase'; pushRoute(); renderMySub(); };
  renderPushBox(push);
  /* 「追分设置」独立卡（2026-10-13）：**这里绝不能再补一次 renderChaseBox**（2026-10-15 task-7）。
     renderPushBox → bindPushBox 末尾已经 renderChaseBox + bindChaseHandlers；在这里再渲染一次
     只会把 #chaseBox 的 innerHTML 整体换新，把刚绑好的 onclick/keydown 连同旧节点一起丢掉 ——
     真机上「添加目标分数」「批量添加」点不动、搜索不出候选就是这个二次渲染造成的。
     追分卡是常驻 DOM（renderMy 每次都整页重建 .section），任何路径进来都已经有内容，不需要兜底。 */
  /* 深链 /my/<sub> 直接落到子页；/my 停在列表首页。
     首页只显示：头部/数据卡/服务列表/运营卡——绑定表单、推送设置等重卡只在子页出现。 */
  if (mySub) { renderMySub(); }
  else {
    history.replaceState(null, '', '/my');
    ['myPushCard', 'myChaseCard'].forEach((id) => { const el = $(id); if (el) el.hidden = true; });
  }
  /* 兜底卡的重试按钮：重新拉一次 /my/push，成功就换成正常内容
     （推送卡与追分卡都会跟着刷新；chaseRetry 由 bindChaseRetry 单独绑） */
  const retry = $('pushRetry');
  if (retry) {
    retry.onclick = async () => {
      retry.disabled = true;
      retry.textContent = '重试中…';
      try {
        renderPushBox(await fetchPush());
      } catch (e) {
        retry.disabled = false;
        retry.textContent = '重试';
        toast(e.message || '还是没取到');
      }
    };
  }
  bindChaseRetry();
}

const MY_SUB_CARDS = {

/* 进入 /my/<mySub>：整页只留「返回栏 + 目标内容」，回列表用返回按钮/浏览器返回。 */
function renderMySub() {
  /* 修复6①：原代码 const view = $('view') 遮蔽了全局 view（let view = 'data'），
     `view !== $('view')` 是恒真的死判断（同一次取值当然相等）——整段删除。
     后面统一用局部名 v，不与全局 view 撞名。 */
  const v = $('view');
  if (!v) return;
  /* 进/出「我的」子页都先同步底栏选中态（2026-10-15 task-11）：
     切到 /my/wechat 时底栏高亮「微信对接」，回列表首页时高亮「我的」。 */
  syncNavActive();

  const info = $('myInfoCard');
  if (info) info.hidden = !MY_SUB_INFO[sub];
  /* 直接子节点按块分组：保留目标卡，其余全部隐藏 */
  const keep = [];
  if (MY_SUB_CARDS[sub]) keep.push(MY_SUB_CARDS[sub].card);
  /* 遍历 v 的块级孩子，把不属于目标卡的都藏起来 */
  /* .section 内逐块控制：首页块（概览/数据大卡/趋势/账号/服务列表/运营卡）藏，
     目标卡（myPushCard / myChaseCard）显。 */
  const sec = v.querySelector('.section');
  if (sec) {

  /* 顶部返回栏 */
  const meta = MY_SUB_CARDS[sub] || MY_SUB_INFO[sub];
  let bar = $('mySubBar');

    bar = document.createElement('div');
    bar.id = 'mySubBar';

  $('mySubBack').onclick = () => {
    /* 修复5：返回用 history.back()（popstate 已统一处理 mySub 切换），
       不再 pushState('/my') —— 否则每进一次子页历史就多一条，返回键要按很多下。
       深链直达（栈里上一条不是本站 /my，或根本没有历史）时 back() 会离开站点，
       此时降级为 pushState('/my') 原地回列表首页。 */
    mySub = null;

      history.back();
