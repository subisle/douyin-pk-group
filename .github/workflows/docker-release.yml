# 发布 pk-server 双架构镜像到 GHCR（147 部署用）。
# 触发：push v* tag 或手动。复用根 Dockerfile（交叉编译，双架构均分钟级）。
name: Docker 发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  release:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像元数据（tag = 语义版本 + latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # 额外产出 amd64 docker tar 挂 rolling release：147 无 ghcr PAT 时
      # 用 gh release download（匿名可下公开仓库 release）+ docker load 更新。
      - name: 导出 amd64 tar 到 release
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --output type=docker,dest=/tmp/pk-server-amd64.tar .
          gzip -9 /tmp/pk-server-amd64.tar
          gh release view dist-amd64 >/dev/null 2>&1 || \
            gh release create dist-amd64 --title "amd64 镜像包" --notes "docker-release.yml 自动更新"
          gh release upload dist-amd64 /tmp/pk-server-amd64.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
