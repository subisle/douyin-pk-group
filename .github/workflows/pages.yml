name: Cloudflare Pages 前端

on:
  workflow_dispatch:
  push:
    branches: [pg-migration]
    paths:
      - "apps/douyin-web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-pk-web
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署 pk-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm -F @pk/douyin-web build

      - name: 部署到 Cloudflare Pages
        working-directory: apps/douyin-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.152.0 pages deploy dist --project-name pk-web --branch main
