# 产出可直接 docker load 的 arm64 镜像包，挂到 rolling release 上。
#
# 为什么需要：ghcr 上的包默认私有，部署机（rk3318 等）没有 read:packages 凭据
# 就拉不下来。与其让部署机长期持有个人 token，不如由 CI 导出一个可离线加载的
# 镜像包，部署机用 `docker load` 导入即可。
#
# 用法：
#   gh workflow run arm64-bundle.yml
#   gh release download arm64-bundle     # 拿到 pk-server + douyin-server 两个 tar.gz
name: arm64 镜像包

on:
  workflow_dispatch:

permissions:
  contents: write   # 创建/更新 release 需要

jobs:
  bundle:
    name: 构建 arm64 镜像包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建 pk-server arm64 镜像并导出
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          # 必须显式打 tag：docker exporter 不会自己起名，不给 tags 的话
          # 导出的 tar 载入后是 <none>:<none>，compose 就会去 Docker Hub 拉同名镜像。
          # 部署机的 compose 固定引用 pk-server:arm64，两边靠这个名字对齐。
          tags: pk-server:arm64
          outputs: type=docker,dest=/tmp/pk-server-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 构建 douyin-server arm64 镜像并导出
        uses: docker/build-push-action@v6
        with:
          context: ./server-go
          file: server-go/Dockerfile
          platforms: linux/arm64
          tags: douyin-server:arm64
          outputs: type=docker,dest=/tmp/douyin-server-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 压缩
        run: |
          gzip -9 /tmp/pk-server-arm64.tar
          gzip -9 /tmp/douyin-server-arm64.tar

      - name: 上传到 rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=arm64-bundle
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "arm64 镜像包" --notes "由 arm64-bundle.yml 自动更新" --prerelease
          gh release upload "$tag" /tmp/pk-server-arm64.tar.gz /tmp/douyin-server-arm64.tar.gz --clobber
          echo "release $tag 已更新"
