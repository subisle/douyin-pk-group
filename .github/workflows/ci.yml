name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "镜像架构，逗号分隔（默认只出部署机要用的 amd64）"
        type: string
        default: "linux/amd64"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  go:
    name: Go 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: 单元测试
        working-directory: server-go
        run: go test ./...
      - name: Vet
        working-directory: server-go
        run: go vet ./...

  rust:
    name: Rust 测试（pk-core + pk-server）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: 单元测试
        working-directory: rust
        run: cargo test --workspace
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace -- -D warnings
      - name: 格式检查
        working-directory: rust
        run: cargo fmt --all -- --check

  web:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm --filter @pk/web exec tsc --noEmit && pnpm --filter @pk/douyin-web exec tsc --noEmit
      - name: 构建（含镜像里要用的现役管理端 douyin-web）
        run: pnpm --filter @pk/web build && pnpm --filter @pk/douyin-web build

  docker:
    name: 构建镜像（${{ inputs.platforms || 'linux/amd64' }}）
    needs: [go, rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 只有真的要出 arm64 才装 QEMU：跨架构模拟编译 Rust 会把构建从几分钟
      # 拖到半小时以上，而部署机（64 / x86_64）只需要 amd64。
      - name: 判断是否需要 QEMU
        id: qemu
        run: |
          if echo "${{ inputs.platforms || 'linux/amd64' }}" | grep -q 'arm64'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 QEMU
        if: steps.qemu.outputs.needed == 'true'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 pk-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          # mode=max 会把每层都存一遍，仓库 artifact 配额有限（曾经撞满导致缓存上传失败），
          # 这里只保留中间层，体积小很多，命中率和耗时基本不变。
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 构建并推送 douyin-server
        uses: docker/build-push-action@v6
        with:
          context: ./server-go
          file: server-go/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/douyin-server:latest
            ghcr.io/${{ github.repository }}/douyin-server:${{ github.sha }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
