name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "镜像架构，逗号分隔（默认只出部署机要用的 amd64）"
        type: string
        default: "linux/amd64"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust 测试（pk-core + pk-server）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # 注（2026-10-14）：原 bot_e2e.rs / monthly_duration_e2e.rs 及 store_e2e.rs 其余用例已删除
      # —— 它们是 MySQL 方言（`?` 占位符 / `DELETE d FROM ... JOIN`），在 PostgreSQL 上会 42601，
      # 且未配 DB_LOCAL_HOST 时静默跳过（退出码 0），CI 一直空转变绿。
      # 如需重新引入 DB e2e：须起 postgres service + 用 PG 原生 $n 占位符（或统一走 pq::rewrite），
      # 参考 store_e2e.rs::absorb_pending_is_idempotent_across_repeated_calls（唯一保留并真实跑库的用例）。
      - name: 单元测试
        working-directory: rust
        run: cargo test --workspace
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace -- -D warnings
      - name: 格式检查
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: 契约一致性检查
        run: bash scripts/check/contract.sh

  web:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm --filter @pk/douyin-web exec tsc --noEmit
      - name: 构建（镜像里要用的现役管理端 douyin-web）
        run: pnpm --filter @pk/douyin-web build

  docker:
    name: 构建镜像（${{ inputs.platforms || 'linux/amd64' }}）
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 只有真的要出 arm64 才装 QEMU：跨架构模拟编译 Rust 会把构建从几分钟
      # 拖到半小时以上，而部署机（64 / x86_64）只需要 amd64。
      - name: 判断是否需要 QEMU
        id: qemu
        run: |
          if echo "${{ inputs.platforms || 'linux/amd64' }}" | grep -q 'arm64'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 QEMU
        if: steps.qemu.outputs.needed == 'true'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 pk-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          # mode=max 会把每层都存一遍，仓库 artifact 配额有限（曾经撞满导致缓存上传失败），
          # 这里只保留中间层，体积小很多，命中率和耗时基本不变。
          cache-from: type=gha
          cache-to: type=gha,mode=min
