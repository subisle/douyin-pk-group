# 产出可直接 docker load 的 amd64 镜像包，挂到 rolling release 上。
#
# 为什么要单独出包而不是让部署机直接拉 ghcr：
# ghcr 上的包默认私有，部署机没有 read:packages 凭据。与其让部署机长期持有
# 个人 token，不如由 CI 导出一个可离线加载的镜像包，部署机 docker load 即可。
#
# 只出 amd64（147 生产）；arm64/rk3318 已废弃（2026-10-11）。
#
# 用法：
#   gh workflow run amd64-bundle.yml
#   gh release download amd64-bundle     # 拿到 pk-server 的 tar.gz
# ⚠️ 供应链风险（2026-10-17 第四轮审计 E-P2-8 / P2-16）：本文件里的 actions/* /
# docker/* 全部用可变 tag。上游 tag 被移动 / 仓库被接管时，CI 会执行被替换的
# 代码（本 job 带 contents:write + GITHUB_TOKEN）。修法：钉完整 40 位 commit SHA
# （保留 `# vX.Y.Z` 注释便于升级）。本轮**离线环境取不到官方 SHA，不编造 SHA**。
name: amd64 镜像包

on:
  workflow_dispatch:

permissions:
  contents: write   # 创建/更新 release 需要

jobs:
  bundle:
    name: 构建 amd64 镜像包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建 pk-server amd64 镜像并导出
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          # 必须显式打 tag：docker exporter 不会自己起名，不给 tags 的话
          # 导出的 tar 载入后是 <none>:<none>，compose 就会去 Docker Hub 拉同名镜像。
          # 部署机的 compose 固定引用 pk-server:amd64，两边靠这个名字对齐。
          tags: pk-server:amd64
          outputs: type=docker,dest=/tmp/pk-server-amd64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 压缩
        run: |
          gzip -9 /tmp/pk-server-amd64.tar

      - name: 上传到 rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=amd64-bundle
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "amd64 镜像包" --notes "由 amd64-bundle.yml 自动更新" --prerelease
          gh release upload "$tag" /tmp/pk-server-amd64.tar.gz --clobber
          echo "release $tag 已更新"
