openapi: 3.1.0
info:
  name: PK Local Integration Contract
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      description: "状态：已实现（pk-server）"
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/public/plans/{planId}:
    get:
      operationId: getPublicPlan
      description: "状态：已实现（pk-server）"
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published read-only plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlan"
  # ---- 以下两条是已退役 Go 服务（douyin-server）的历史路径，2026-10 起不再存在 ----
  # 保留在此仅为追溯调用方；pk-server 不提供 /dy/* 前缀。
  /dy/api/health:
    get:
      operationId: getDouyinHealth
      description: "状态：已删除（原 Go 过渡服务 douyin-server 已于 2026-10 移除，该路径不再存在）"
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /dy/api/robot/commands:
    post:
      operationId: dispatchRobotCommand
      description: "状态：已删除（原 Go 过渡代码随服务移除；机器人命令路由现由 Rust bot/ 模块实现）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RobotCommand"
      responses:
        "200":
          description: Deterministic robot result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotResponse"
        "400":
          description: Invalid command
  /api/admin/streamers:
    get:
      operationId: listStreamers
      description: "状态：已实现（B 阶段）。查询参数 q（名字模糊）、team（male/female）。"
      responses:
        "200":
          description: Streamer roster with primary account and aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamerList"
    post:
      operationId: createStreamer
      description: "状态：已实现（B 阶段）。name+team 必填；douyinNo 全局唯一，重复返回 400。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamerUpsert"
      responses:
        "200":
          description: Created person id
  /api/admin/streamers/{id}:
    put:
      operationId: updateStreamer
      description: "状态：已实现（B 阶段）。部分更新；masterId=0 表示清空师傅。"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamerUpsert"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteStreamer
      description: "状态：已实现（B 阶段）。软删（deleted_at）。"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Soft-deleted
  /api/admin/announcement/items-avatar:
    description: "状态：已实现（2026-10-16）。Announcement.items 每条新增 avatar 字段（选主播时由 seat-options 带出并保存的抖音头像同源路径）。写入校验：只收 /api/public/avatars/ 开头、≤120 字符、无路径穿越的 ASCII 路径，其余丢弃为空串；下发原样带出（空 = 展示端回落首字色块）。详见 /api/admin/announcement 的 items 定义。"

  /api/admin/announcement/seat-options:
    get:
      operationId: announcementSeatOptions
      description: "状态：已实现（2026-10-16）。三甲席位选人：按月返回主播成绩榜（personId/name/team/wave），公告条「选主播」自动带出人名与该月成绩。口径与展示端月榜一致（monthly_wave 导入整月值优先，daily_metric 日明细求和兜底，wave_reliable=1）。period 缺省 = 当月。"
      parameters:
        - name: period
          in: query
          schema:
            type: string
          description: "成绩月份 YYYY-MM；缺省 = 当月（本机时区）。"
      responses:
        "200":
          description: "该月成绩榜（wave DESC）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        personId: { type: integer }
                        name: { type: string }
                        team: { type: string }
                        wave: { type: integer }
                        avatar:
                          type: string
                          description: "抖音头像同源地址 /api/public/avatars/{pid}?v={hash}；无图（表未建/未同步）= null，前端回落首字色块。"

  /api/admin/import/upload:
    post:
      operationId: uploadImport
      description: "状态：已实现（multipart 文件上传）（CSV/TSV/文本），解析返回行预览；确认后走 commit。响应 rows 是按日解析结果，monthRows 是按月解析结果（2026-10-16 起时长 / 音浪两类列都带，同一行可同时有 minutes 与 wave）；suggest.kind 取值 daily / month（2026-10-16 由 month-duration 更名，因为按月导入不止时长一种指标），只有「有时长列、没有音浪列」的文件才建议 month —— 时长 + 总音浪同表的概览列表默认 daily，运营在弹窗里手动切「按月」。"
      responses:
        "200":
          description: Parsed rows (rows + monthRows + suggest)
  /api/admin/import/preview:
    post:
      operationId: previewImport
      description: "状态：已实现（B 阶段）。解析粘贴文本/结构化行并匹配主播，不落库。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreview"
      responses:
        "200":
          description: Parsed rows with match status and team conflicts
  /api/admin/import/commit:
    post:
      operationId: commitImport
      description: "状态：已实现（B 阶段）。事务写 daily_metric（merge 幂等覆盖 / reject 拒绝重复）+ import_batch 审计。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreview"
      responses:
        "200":
          description: Batch id with ok/failed rows
        "400":
          description: reject 模式下当日已有数据，或参数非法
  /api/admin/import/batches:
    get:
      operationId: listImportBatches
      description: "状态：已实现（B 阶段）。最近 50 条导入批次审计。"
      responses:
        "200":
          description: Import batch list
  /api/admin/import/month/preview:
    post:
      operationId: previewMonthImport
      description: "状态：已实现（2026-10-16）。按月指标预览（时长 / 音浪），解析 + 匹配 + 与日明细对账，不落库；period 为 YYYY-MM。响应在 total / matched / minutesTotal 之外补齐：waveTotal；rowsWithMinutes / rowsWithWave（文件里各有多少行带该指标）与 hasMinutes / hasWave（前端据此自动勾选指标）；existingRows / existingMinutes 与 existingWaveRows / existingWave（该月已导入的整月值）；dailyMinutes / dailyWave（该月日明细合计）；diffs / waveDiffs（与日明细不一致的人，各最多 30 条）。文件里时长列与音浪列都没有时返回 400。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreview"
      responses:
        "200":
          description: Parsed month rows with match status, existing month values and daily reconciliation
        "400":
          description: period 格式非 YYYY-MM，或文件里既没有时长列也没有音浪列
  /api/admin/import/month/commit:
    post:
      operationId: commitMonthImport
      description: "状态：已实现（2026-10-16）。按月入库：事务写 monthly_duration（时长）/ monthly_wave（音浪）+ import_batch 审计（source=admin-import-month）。请求体 metrics = minutes / wave 的任意子集，勾哪个写哪个（不带 = 两种都导，**空数组 400**，不静默当成都导）。同月同指标幂等「值相同不覆盖、值不同才覆盖」，两种指标各自判定；未匹配主播的整月值不进 import_pending 暂存区。响应含 minutesTotal / waveTotal / okRows / unchanged / skipped / failures / batchId。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreview"
      responses:
        "200":
          description: Batch id with per-metric totals and ok/skipped/failed rows
        "400":
          description: period 非法、metrics 为空数组或含未知指标，或没有任何数据行
  /api/admin/import/month-status:
    get:
      operationId: monthImportStatus
      description: "状态：已实现（2026-10-16）。该月已导入的整月值：rows / minutes（月度时长行数与分钟合计）、waveRows / wave（月度音浪行数与合计，2026-10-16 新增）、lastBatch（最近批次文件名与时间）。"
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: team
          in: query
          required: true
          description: "团别过滤：auto（不限团别，前端默认）/ male / female。MonthQuery 里是必填字段，缺参会 400。"
          schema:
            type: string
            enum: [auto, male, female]
      responses:
        "200":
          description: Imported month duration and wave for the period
        "400":
          description: period 格式非 YYYY-MM，或缺 team 参数
  /api/admin/import/month:
    delete:
      operationId: deleteMonthImport
      description: "状态：已实现（2026-10-16）。删除某月已导入的整月时长**与**整月音浪（team 可选，限团别）：一次删两张表，避免只删一个留下幽灵月值；响应 rows / waveRows（两张表各删行数）与 batches（批次记录数）。"
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: team
          in: query
          required: true
          description: "团别过滤：auto（不限团别，前端默认）/ male / female —— 与 GET month-status 同一套必填口径。"
          schema:
            type: string
            enum: [auto, male, female]
      responses:
        "200":
          description: Deleted row counts per month table and batch count
        "400":
          description: period 格式非 YYYY-MM，或缺 team 参数
  /api/public/teams/{team}:
    get:
      operationId: publicTeamSite
      description: "状态：已实现（阶段 D）。团别站点配置 + 最新日期；链接关闭时 published=false。"
      responses:
        "200":
          description: Site config
  /api/public/teams/{team}/daily:
    get:
      operationId: publicTeamDaily
      description: "状态：已实现（阶段 D）。每日榜，DTO 白名单绝无抖音号；item 含 avatar（同源头像路径，可为 null）。"
      responses:
        "200":
          description: Daily ranking
  /api/public/teams/{team}/monthly:
    get:
      operationId: publicTeamMonthly
      description: "状态：已实现（阶段 D）。月榜；item 含 avatar（同源头像路径，可为 null）。"
      responses:
        "200":
          description: Monthly ranking
  /api/public/teams/{team}/yearly:
    get:
      operationId: publicTeamYearly
      description: "状态：已实现（阶段 D）。年榜；item 含 avatar（同源头像路径，可为 null）。"
      responses:
        "200":
          description: Yearly ranking
  /api/public/avatars/{person_id}:
    get:
      operationId: publicAvatar
      description: "状态：已实现（2026-10-16）。主播抖音头像本地留存副本：有图返回 200 image/jpeg（JPEG 原图，带 Cache-Control: public, max-age=31536000, immutable 长缓存），无图/无该行/查询异常一律 404 空体；person_id 非数字时由框架返回 400（不是 404）。榜单 item.avatar 即此路径，带 ?v=<hash> 内容版本号（图变 URL 变），可放心长缓存；不下发抖音号或任何内部 id 字段。"
      parameters:
        - name: person_id
          in: path
          required: true
          schema:
            # 整数（axum Path<i64>）：非数字路径参数由框架直接 400 text/plain，
            # 不走下面的 404 分支 —— P2-3（2026-10-16 独立验证）按真实行为改口径，
            # 不为了对齐文档再加一层路由 fallback。
            type: integer
            format: int64
      responses:
        "200":
          description: Avatar JPEG (locally stored copy)
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No stored avatar for this person
  /api/public/teams/{team}/verify:
    post:
      operationId: publicTeamVerify
      description: "状态：已实现（阶段 D）。抖音号验证，统一失败文案不给候选；IP 限流 5 次/分钟。"
      responses:
        "200":
          description: Verify result with personal token
  /api/public/teams/{team}/my:
    get:
      operationId: publicTeamMy
      description: "状态：已实现（1.0.1）。个人数据（日/月/年/累计/团内名次）+ 日/月/年同期对照（prevWave）+ 徒弟提成 commission（仅直系徒弟、排除名单内师傅为 null）。token 鉴权。"
      responses:
        "200":
          description: Personal metrics
  /api/admin/dashboard:
    get:
      operationId: dashboard
      description: "状态：已实现（3328 移植）。KPI + 团别趋势 + 未播预警 + TopN。参数 date/days(7-90)/top。"
      responses:
        "200":
          description: Dashboard aggregate
  /api/admin/commission/settings:
    get:
      operationId: adminCommissionSettingsGet
      description: "状态：已实现（1.0.1）。读徒弟提成设置（折算比例 + 排除名单）。"
      responses:
        "200":
          description: Commission settings
    post:
      operationId: adminCommissionSettingsUpdate
      description: "状态：已实现（1.0.1）。保存徒弟提成设置（缺省键保留现值；比例必须 > 0）。"
      responses:
        "200":
          description: Commission settings saved
  /api/admin/metrics/monthly:
    get:
      operationId: monthlyMetrics
      description: "状态：已实现（3328 移植）。月度聚合榜（wave/minutes/liveDays/dataDays）。参数 period=YYYY-MM、team。"
      responses:
        "200":
          description: Monthly aggregate rows
  /api/admin/metrics/yearly:
    get:
      operationId: yearlyMetrics
      description: "状态：已实现（3328 移植）。年度聚合榜。参数 period=YYYY、team。"
      responses:
        "200":
          description: Yearly aggregate rows
  /api/admin/streamers/duplicates:
    get:
      operationId: duplicateStreamers
      description: "状态：已实现（3328 移植）。同名 / 同抖音号重复检测。"
      responses:
        "200":
          description: Duplicate groups
  /api/admin/streamers/{id}/detail:
    get:
      operationId: streamerDetail
      description: "状态：已实现（3328 移植）。主播详情含全部账号。"
      responses:
        "200":
          description: Streamer detail with accounts
  /api/admin/streamers/{id}/accounts:
    post:
      operationId: bindAccount
      description: "状态：已实现（3328 移植）。绑定账号（anchor_id 唯一，主号可换绑）。"
      responses:
        "200":
          description: Bound
  /api/admin/bots/sessions:
    get:
      operationId: botSessions
      description: "状态：已实现（机器人见过的会话列表）（群聊/私聊 + 管理员标记）。"
      responses:
        "200":
          description: Session list
  /api/admin/bots/sessions/admin:
    post:
      operationId: setBotSessionAdmin
      description: "状态：已实现（勾选/取消会话的管理员身份）（群聊与私聊独立）。"
      responses:
        "200":
          description: Updated
  /api/admin/bots/status:
    get:
      operationId: botsStatus
      description: "状态：已实现（E 阶段）。QQ / 微信渠道连接状态汇总。"
      responses:
        "200":
          description: Channel statuses
  /api/admin/bots/qq/start:
    post:
      operationId: startQqBot
      description: "状态：已实现（E 阶段）。启动 QQ gateway WebSocket 连接循环。"
      responses:
        "200":
          description: Started
  /api/admin/bots/qq/stop:
    post:
      operationId: stopQqBot
      description: "状态：已实现（E 阶段）。"
      responses:
        "200":
          description: Stopped
  /api/admin/bots/weixin/start:
    post:
      operationId: startWeixinBot
      description: "状态：已实现（E 阶段）。未登录时 400 提示先扫码。"
      responses:
        "200":
          description: Started
        "400":
          description: Not logged in
  /api/admin/bots/weixin/stop:
    post:
      operationId: stopWeixinBot
      description: "状态：已实现（E 阶段）。"
      responses:
        "200":
          description: Stopped
  /api/admin/bots/weixin/qrcode:
    get:
      operationId: weixinQrCode
      description: "状态：已实现（1.0.1，对齐 openclaw-weixin）。POST get_bot_qrcode?bot_type=3（带 local_token_list），返回 qrcode + imgContent（base64 图）。"
      responses:
        "200":
          description: QR code id and image content
  /api/admin/bots/weixin/qrcode/check:
    post:
      operationId: weixinQrCheck
      description: "状态：已实现（1.0.1，对齐 openclaw-weixin）。全状态机 wait/scaned/confirmed/expired/need_verifycode/verify_code_blocked/scaned_but_redirect/binded_redirect；need_verifycode 带可选 verifyCode 重轮；confirmed 自动保存 bot_token + baseurl。"
      responses:
        "200":
          description: Scan status vocabulary per protocol
  /api/admin/bots/weixin/token:
    post:
      operationId: weixinToken
      description: "状态：已实现（E 阶段）。手工粘贴登录 token（不走扫码）。"
      responses:
        "200":
          description: Token saved
components:
  schemas:
    Health:
      type: object
      required: [server, ok]
      properties:
        server:
          type: string
        ok:
          type: boolean
    PublicPlan:
      type: object
      required: [id, published]
      properties:
        id:
          type: string
        published:
          type: boolean
    RobotCommand:
      type: object
      required: [command, args]
      additionalProperties: false
      properties:
        command:
          type: string
          enum: [help, query, rank, group]
        args:
          type: array
          items:
            type: string
          maxItems: 20
    RobotResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
    StreamerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Streamer"
        total:
          type: integer
    Streamer:
      type: object
      properties:
        personId: { type: string }
        name: { type: string }
        team: { type: string, enum: [male, female, unknown] }
        masterId: { type: [string, "null"] }
        generation: { type: [integer, "null"] }
        groupName: { type: [string, "null"] }
        status: { type: string, enum: [active, left, paused] }
        douyinNo: { type: [string, "null"] }
        aliases: { type: array, items: { type: string } }
    StreamerUpsert:
      type: object
      properties:
        name: { type: string }
        team: { type: string, enum: [male, female] }
        douyinNo: { type: string }
        anchorId: { type: string }
        masterId: { type: integer }
        generation: { type: integer }
        groupName: { type: string }
        status: { type: string, enum: [active, left, paused] }
        joinedAt: { type: string }
    ImportPreview:
      type: object
      properties:
        text: { type: string, description: "粘贴文本（每行一人，tab/逗号/空格分隔）" }
        rows:
          type: array
          description: "结构化行（与 text 二选一）"
          items:
            type: object
            properties:
              name: { type: string }
              douyinNo: { type: string }
              wave: { type: number }
              cumulativeWave: { type: number }
              minutes: { type: number }
              isLive: { type: boolean }
        bizDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        period: { type: string, pattern: '^\d{4}-\d{2}$', description: "按月导入的业务月份（/import/month/* 用；按日导入不看它）" }
        metrics:
          type: array
          description: "按月导入要写的指标（2026-10-16）：minutes / wave 的任意子集；不带 = 两种都导，空数组 400"
          items:
            type: string
            enum: [minutes, wave]
        team: { type: string, enum: [male, female] }
        mode: { type: string, enum: [merge, reject] }
        filename: { type: string }
