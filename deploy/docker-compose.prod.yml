# 147 生产容器编排（2026-10-12 容器化定稿）。
# 拓扑：caddy(已有) → pk-server → pk-postgres(业务库) + pk-redis(缓存)
# 持久化全部 bind mount 到 /opt/pk-server/，宿主机 cron 每日 pg_dump 到 backups/。
# 用法：cp .env.prod.example /opt/pk-server/.env.prod && 编辑后
#       docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# ⚠️ 配置注入方式（2026-10-17 第四轮审计 P2-12）：本文件**故意不使用 env_file**，
# 容器里的环境变量 = 下面 environment 段逐个 ${VAR:-} 透传的结果。因此：
#   · 只把键写进 .env.prod 而**没有**在 environment 段登记 → 该键**不会进容器**
#     （静默丢失、代码回落默认值，排查时极易误判）；
#   · 新增可配置项必须**同时**改这里与 .env.prod.example，并写清默认值语义；
#   · 一律用 ${VAR:-} 空默认：敏感项缺失时由代码默认 / 启动守卫兜底，不在编排里写死值。
#
# 安全加固（2026-10-17 第四轮审计 E-P2-6）：三服务均 cap_drop ALL +
# no-new-privileges + json-file 日志限额（10m×3），避免容器日志写满 64 的
# 8.9G 余量把 PG/服务拖停。postgres / redis 官方镜像以 root 起入口脚本再降权，
# cap_drop ALL 后需补回最小能力（见各 service 的 cap_add 注释），否则容器起不来。
name: douyin-pk

services:
  pk-server:
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO is required}:${PK_TAG:-latest}
    container_name: pk-server
    restart: unless-stopped
    depends_on:
      pk-postgres:
        condition: service_healthy
      pk-redis:
        condition: service_started
    environment:
      # 业务库（PG，唯一事实源）
      DB_SOURCE: LOCAL
      DB_LOCAL_HOST: pk-postgres
      DB_LOCAL_PORT: "5432"
      DB_LOCAL_NAME: douyin
      DB_LOCAL_USER: douyin_admin
      DB_LOCAL_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      DB_LOCAL_POOL_LIMIT: "6"
      DB_WRITER_HOST: pk-postgres
      DB_WRITER_PORT: "5432"
      DB_WRITER_NAME: douyin
      DB_WRITER_USER: douyin_admin
      DB_WRITER_PASSWORD: ${PG_PASSWORD}
      DB_MIGRATOR_HOST: pk-postgres
      DB_MIGRATOR_PORT: "5432"
      DB_MIGRATOR_NAME: douyin
      DB_MIGRATOR_USER: douyin_admin
      DB_MIGRATOR_PASSWORD: ${PG_PASSWORD}
      # 音浪读源（远程 MySQL 读源，与现网一致；主机/账号只写 .env.prod）
      DB_A_HOST: ${DB_A_HOST}
      DB_A_PORT: ${DB_A_PORT:-3306}
      DB_A_NAME: ${DB_A_NAME}
      DB_A_USER: ${DB_A_USER}
      DB_A_PASSWORD: ${DB_A_PASSWORD}
      # 缓存（2026-10-17 审计补口令：原先 pk-redis 无 requirepass，宿主上任意
      # 进程可经 127.0.0.1:6379 直连缓存/锁层。口令必须与 .env.prod 的
      # REDIS_PASSWORD 一致 —— 两处同时改，缺一启动即失败，不会静默裸奔）
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@pk-redis:6379/0
      # 管理口令 / 机器人凭据等沿用原 pk.env 其余项
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 管理员登录态时长（秒；留空 = 代码默认 28800 = 8 小时）
      ADMIN_TOKEN_TTL: ${ADMIN_TOKEN_TTL:-}
      # 跨域白名单（同源部署留空即可；多域部署才填，逗号分隔）
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 机器人渠道（QQ / 微信）。2026-10-17 第四轮审计 P1-3：
      #   · QQ 管理员改为 **fail-closed** —— BOT_QQ_ADMINS 未配置 = 一个都不认，
      #     QQ 会话只会被静默忽略。**生产必填**（只填运营自持的 QQ 号，逗号分隔）；
      #   · BOT_QQ_APP_ID/SECRET 不配 = QQ 渠道不启动；BOT_WECHAT_TOKEN 留空 =
      #     未登录扫码状态（扫码成功后 token 持久化在业务库 config 表）；
      #   · 其余键留空一律走代码默认（BOT_RATE_LIMIT 默认 10 条/分钟/会话）。
      BOT_QQ_ADMINS: ${BOT_QQ_ADMINS:-}
      BOT_WECHAT_ADMINS: ${BOT_WECHAT_ADMINS:-}
      BOT_QQ_APP_ID: ${BOT_QQ_APP_ID:-}
      BOT_QQ_APP_SECRET: ${BOT_QQ_APP_SECRET:-}
      BOT_WECHAT_TOKEN: ${BOT_WECHAT_TOKEN:-}
      BOT_RATE_LIMIT: ${BOT_RATE_LIMIT:-}
      BOT_QQ_SANDBOX: ${BOT_QQ_SANDBOX:-}
      BOT_QQ_PRIVATE_ONLY: ${BOT_QQ_PRIVATE_ONLY:-}
      BOT_ATTACHMENT_HOSTS: ${BOT_ATTACHMENT_HOSTS:-}
      WECHAT_ADMIN_CODE: ${WECHAT_ADMIN_CODE:-}
      # IP 闸门（展示端访客拦截）。生产留空 = 拦截开启（本意如此）。
      # IP_GATE_DISABLED 只供临时排障（设 1 关拦截），排障完必须关回。
      IP_GATE_DISABLED: ${IP_GATE_DISABLED:-}
      IP_GATE_SOURCES: ${IP_GATE_SOURCES:-}
      IP_QUERY_SOURCES: ${IP_QUERY_SOURCES:-}
      IP_GATE_ALLOWLIST: ${IP_GATE_ALLOWLIST:-}
      # 推送节奏 / 头像自动同步（留空 = 代码默认；头像总闸见下方 AVATAR_SYNC_DISABLED）
      PUSH_DELAY_MINUTES: ${PUSH_DELAY_MINUTES:-}
      PUSH_MAX_TOTAL_SECS: ${PUSH_MAX_TOTAL_SECS:-}
      WX_PUSH_BATCH_SIZE: ${WX_PUSH_BATCH_SIZE:-}
      WX_PUSH_BATCH_INTERVAL_SECS: ${WX_PUSH_BATCH_INTERVAL_SECS:-}
      AVATAR_SYNC_ENABLED: ${AVATAR_SYNC_ENABLED:-}
      AVATAR_SYNC_DAYS: ${AVATAR_SYNC_DAYS:-}
      AVATAR_SYNC_CHECK_SECS: ${AVATAR_SYNC_CHECK_SECS:-}
      # 内置展示端管理员账号（2026-10-17，可选）：格式 name:pass:viewTeam，逗号分隔。
      # 服务启动幂等补齐；不配 = 不建内置账号（走管理端后台开号）。
      BUILTIN_MY_ACCOUNTS: ${BUILTIN_MY_ACCOUNTS:-}
      PORT: "8787"
      HOST: 0.0.0.0
      TZ: Asia/Shanghai
      RUST_LOG: info
      # 出网闸门（2026-10-17 补，审计 1-P0-1；同日用户拍板**全开**）：
      # 原先这里**完全没有** PUSH_OUT_ENABLED，而镜像只 COPY rust（rust/.env 在
      # .gitignore 里、进不了镜像）→ 生产必然落到代码默认「关闭」，64 上线后所有
      # 推送只记 WARN、主播一条都收不到。现在显式注入，**默认 1 = 真实发送**：
      #   =1 / true → 真实发送（上线口径，默认）；
      #   显式设 0 / false → 只记日志不真发（仅排查/回滚时临时用）。
      # PUSH_OUT_ALLOW 留空 = 不额外限制收件人；想灰度就填姓名白名单（逗号分隔）。
      PUSH_OUT_ENABLED: ${PUSH_OUT_ENABLED:-1}
      PUSH_OUT_ALLOW: ${PUSH_OUT_ALLOW:-}
      # 头像同步总闸（2026-10-17 用户点单冻结：与本地口径一致，生产默认冻结）。
      # 要恢复同步需同时删掉 compose 这行与 .env.prod 里的同名变量。
      AVATAR_SYNC_DISABLED: "1"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /opt/pk-server/data:/app/data
    mem_limit: 512m
    # 最小权限（2026-10-17 第四轮审计 E-P2-6）：镜像已 USER pk（非 root），
    # 业务只需监听 8787 + 写 /app/data，不需要任何 Linux capability。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 日志限额（同审计 E-P2-6）：64 磁盘余量只有 ~8.9G，不限额的 json-file
    # 可被刷屏日志写满，把 PG / 服务一起拖停。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/pk-server", "--health-check"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  pk-postgres:
    image: postgres:17-alpine
    container_name: pk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: douyin
      POSTGRES_USER: douyin_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - timezone=Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /opt/pk-server/pg-data:/var/lib/postgresql/data
      - /opt/pk-server/backups:/backup
    mem_limit: 512m
    # 最小权限（2026-10-17 第四轮审计 E-P2-6）：cap_drop ALL 后再补回官方
    # postgres 镜像启动必需的几项 —— 它的入口脚本以 root 启动，先 chown PGDATA
    # 再 gosu 到 postgres 用户；全部丢掉会直接起不来。补回的是最小集合，其余
    # 默认 capability 仍然全丢。若改成 `user: postgres` 直接非 root 运行可去掉
    # cap_add，但宿主 bind mount 属主要预先 chown 到镜像内 postgres 的 UID/GID。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U douyin_admin -d douyin"]
      interval: 10s
      timeout: 5s
      retries: 5

  pk-redis:
    image: redis:7-alpine
    container_name: pk-redis
    restart: unless-stopped
    # requirepass（2026-10-17 审计补）：与 pk-server 的 REDIS_URL 用同一口令
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 96mb --maxmemory-policy allkeys-lru
    # 不发布宿主端口（2026-10-17 第四轮审计 P2-13 / docs/17 D3）：宿主 6379 已被
    # systemd redis-server 占用，且缓存无外部访问需求 —— 容器间走 docker 内网即可。
    # 原先的 ports: 127.0.0.1:6379:6379 已删除，避免上线即 bind 失败 / 实例混淆。
    volumes:
      - /opt/pk-server/redis-data:/data
    mem_limit: 128m
    # 最小权限（2026-10-17 第四轮审计 E-P2-6）：与 postgres 同理，官方 redis 镜像
    # 入口脚本以 root 启动后 chown /data 并 setpriv 降权到 redis 用户，故补回最小能力。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
