name: douyin-pk-suite

# ⚠️ 监听地址（P1-5）：宿主端口发布一律绑 127.0.0.1，公网入口交给宿主机
#    Nginx/Caddy 反代，绝不能把 8787/8080 直接裸到 0.0.0.0。
#    容器内 pk-server 的 HOST 默认为 127.0.0.1 时 healthcheck 之外无法直连；
#    若需要容器外直连探活，必须显式在 .env 配 HOST=0.0.0.0（宿主侧仍只绑
#    127.0.0.1，公网进不来）。生产目前走「服务间容器网络互访（mariadb/pk-server）
#    + 宿主反代」，两个应用服务不发布端口，属预期状态。

services:
  pk-server:
    image: pk-server:arm64
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: "8787"
      WEB_DIST: /app/web
      SQLITE_PATH: /app/data/app.db
      DB_LOCAL_HOST: mariadb
      DB_LOCAL_PORT: "3306"
      DB_LOCAL_USER: ${PK_READER_USER:-pk_reader}
      DB_LOCAL_PASSWORD: ${PK_READER_PASSWORD:?set PK_READER_PASSWORD}
      DB_LOCAL_NAME: douyin
      DB_LOCAL_POOL_LIMIT: "2"
      DB_LOCAL_READONLY: "1"
      # douyin_writer 业务写池（B 阶段：主播台账 / 导入写入）
      DB_WRITER_HOST: mariadb
      DB_WRITER_PORT: "3306"
      DB_WRITER_NAME: douyin
      DB_WRITER_USER: ${DOUYIN_WRITER_USER:-douyin_writer}
      DB_WRITER_PASSWORD: ${DOUYIN_WRITER_PASSWORD:?set DOUYIN_WRITER_PASSWORD}
      DB_WRITER_POOL_LIMIT: "4"
      # docs/00 §4 决策：DDL 不随启动自动跑；迁移用 docker exec pk-server migrate
      DB_MIGRATOR_HOST: mariadb
      DB_MIGRATOR_PORT: "3306"
      DB_MIGRATOR_NAME: douyin
      DB_MIGRATOR_USER: ${DOUYIN_MIGRATOR_USER:-douyin_migrator}
      DB_MIGRATOR_PASSWORD: ${DOUYIN_MIGRATOR_PASSWORD:?set DOUYIN_MIGRATOR_PASSWORD}
    volumes:
      - pk-data:/app/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "/usr/local/bin/pk-server", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3

  douyin-server:
    image: douyin-server:arm64
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DOUYIN_HTTP_ADDR: :8080
      # 与 mariadb 的 MARIADB_USER / MARIADB_PASSWORD 联动，避免 .env 里双份密码改漏
      DOUYIN_DATABASE_DSN: ${DOUYIN_WRITER_USER:-douyin_writer}:${DOUYIN_WRITER_PASSWORD:?set DOUYIN_WRITER_PASSWORD}@tcp(mariadb:3306)/douyin?charset=utf8mb4
      DOUYIN_MIGRATE: "1"
    volumes:
      - bot-state:/var/lib/douyin
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/dy/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: douyin
      MARIADB_USER: ${DOUYIN_WRITER_USER:-douyin_writer}
      MARIADB_PASSWORD: ${DOUYIN_WRITER_PASSWORD:?set DOUYIN_WRITER_PASSWORD}
      PK_READER_USER: ${PK_READER_USER:-pk_reader}
      PK_READER_PASSWORD: ${PK_READER_PASSWORD:?set PK_READER_PASSWORD}
    command:
      - --transaction-isolation=READ-COMMITTED
      - --innodb-buffer-pool-size=256M
      - --max-connections=48
      - --skip-name-resolve
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pk-data:
  bot-state:
  mariadb-data:
