# 部署到 64：镜像由 GitHub Actions 构建（ghcr.io/subisle/douyin-pk-group）
# 用法：
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml up -d
#
# ⚠️ 监听地址：compose 里端口发布固定绑 127.0.0.1（公网入口走 Caddy 反代）。
#    容器内 pk-server 的 HOST 默认 127.0.0.1 时只能容器内自连 —— 若 compose
#    healthcheck 或容器外直连探活，需要显式在 .env 配 HOST=0.0.0.0（容器内监听
#    全部地址没问题：宿主侧端口只绑 127.0.0.1，公网仍然进不来）。
services:
  pk-server:
    image: ghcr.io/subisle/douyin-pk-group:latest
    container_name: pk-server
    restart: unless-stopped
    ports:
      # 只绑 127.0.0.1：公网入口交给 Caddy 反代，别把 8787 裸奔到 0.0.0.0
      - "127.0.0.1:${PK_PORT:-6666}:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      WEB_DIST: /app/web
      SQLITE_PATH: /app/data/app.db
      WAVE_CACHE_TTL: "600"
      # CORS_ORIGINS 等一律走 .env；管理员口令内置于 pk-server
    volumes:
      - ./data:/app/data        # SQLite（方案 + 别名）持久化
    healthcheck:
      test: ["CMD", "/usr/local/bin/pk-server", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
